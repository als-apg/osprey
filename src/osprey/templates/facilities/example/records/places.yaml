- id: BR
  level: machine
  description: 'Booster Ring (BR): Accelerates electron beam from 150 MeV (linac energy) to 2.0 GeV before injection into the storage ring. Compact ring with 4-fold symmetry, operates at 1-10 Hz repetition rate.'
  names:
  - booster ring
- id: BTS
  level: machine
  description: 'Booster-to-Storage Transfer Line (BTS): Beam transport line that guides accelerated beam from booster ring to storage ring. ~35m beamline with steering magnets, quadrupoles, and diagnostics.'
  names:
  - booster-to-storage transfer line
