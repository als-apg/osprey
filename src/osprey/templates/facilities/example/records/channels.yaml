- id: SR:MAG:DIPOLE:01:CURRENT:GOLDEN
  'on':
    device: SR/DIPOLE01
  signal: current_golden_readback
  unit: A
  description: 'Storage ring dipole bending magnet 01 current golden setpoint. Magnet Excitation Current (Amperes): Current through dipole coil windings. Directly proportional to magnetic bending field via Ampere''s law (B ∝ I). Typically 50-500A depending on ring energy. Tightly regulated by precision power supplies to maintain stable beam energy and trajectory. Golden Setpoint (read-only): Reference setpoint for optimal beam operation. Stored golden values represent known good operating conditions. Read-only - used for comparison and restore operations.'
- id: SR:MAG:DIPOLE:01:CURRENT:RB
  'on':
    device: SR/DIPOLE01
  signal: current_readback
  unit: A
  description: 'Storage ring dipole bending magnet 01 current readback. Magnet Excitation Current (Amperes): Current through dipole coil windings. Directly proportional to magnetic bending field via Ampere''s law (B ∝ I). Typically 50-500A depending on ring energy. Tightly regulated by precision power supplies to maintain stable beam energy and trajectory. Current Readback (read-only): Actual measured dipole current from DCCT. High-accuracy measurement (±0.01%) essential for field reproducibility. Used in power supply feedback loop and archived for orbit analysis.'
  tags:
  - in_context
- id: SR:MAG:DIPOLE:01:CURRENT:SP
  role: setpoint
  pair: SR:MAG:DIPOLE:01:CURRENT:RB
  tolerance:
    absolute: 0.05
  'on':
    device: SR/DIPOLE01
  signal: current_setpoint
  unit: A
  description: 'Storage ring dipole bending magnet 01 current setpoint. Magnet Excitation Current (Amperes): Current through dipole coil windings. Directly proportional to magnetic bending field via Ampere''s law (B ∝ I). Typically 50-500A depending on ring energy. Tightly regulated by precision power supplies to maintain stable beam energy and trajectory. Current Setpoint (read-write): Commanded dipole current for desired bending field. Operators or high-level software set this to control beam energy. Power supply servo loop regulates output to match setpoint.'
  tags:
  - in_context
