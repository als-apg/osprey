description: 'Injection into the storage ring for a turn-by-turn trajectory study. Each injected
  shot launches a bunch of 16 particles at the injection point, off the design trajectory by half a
  millimetre horizontally and one percent in energy, with a finite emittance, energy spread and
  length, and a centroid that jitters from shot to shot. Every element with length has an
  elliptical vacuum chamber of 3 mm by 5 mm half-axes. The ring already stores half a bunch of
  charge, so the stored current reads above zero before the first shot. The scenario states no RF
  value, so it applies alike on every simulator instance.'
