# Bundled with OSPREY: the example facility. Delete this line to make the file yours.
description: Sector-7 vacuum burst with correlated beam loss at 14:32:08 local time, recurring daily.
archiver:
- channel: SR:VAC:GAUGE:SR07:PRESSURE:RB
  events:
  - shape: burst
    at_time: '14:32:08'
    amplitude: 1.5e-07
    decay_s: 5
    tail_share: 0.1
    tail_decay_s: 25
- channel: SR:DIAG:DCCT:01:CURRENT:RB
  events:
  - shape: loss
    at_time: '14:32:08'
    amount: 5.0
