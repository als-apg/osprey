- id: SR/DIPOLE
  description: 'Dipole Bending Magnets: Main bending magnets that deflect the beam in a circular path to form the storage ring. Create uniform magnetic field perpendicular to beam. Numbered sequentially around the ring (e.g., B01, B02, ...). Critical for maintaining correct beam trajectory and energy.'
