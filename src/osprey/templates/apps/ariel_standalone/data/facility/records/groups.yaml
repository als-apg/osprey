  - SR/CAVITY02
  signals:
    POWER: 'RF Power (Kilowatts): Electromagnetic power in RF transmission system.'
    POWER/FWD: 'Forward Power (read-only): RF power traveling from klystron toward cavity.'
    POWER/REV: 'Reflected Power (read-only): Power bouncing back from cavity.'
    POWER/NET: 'Net Power (read-only): Actual power delivered to cavity (FWD - REV).'
    VOLTAGE: 'Cavity Gap Voltage (Megavolts): Peak RF voltage across accelerating gap. Typical: 0.5-3 MV.'
    VOLTAGE/RB: 'Voltage Readback (read-only): Measured cavity gap voltage.'
    VOLTAGE/SP: 'Voltage Setpoint (read-write): Commanded cavity gap voltage.'
    VOLTAGE/GOLDEN: 'Golden Voltage (read-only): Reference gap voltage for nominal operation.'
    FREQUENCY: 'RF Frequency (MHz): Operating frequency of RF system. Must match harmonic of beam revolution frequency.'
    FREQUENCY/RB: 'Frequency Readback (read-only): Measured RF frequency.'
    FREQUENCY/SP: 'Frequency Setpoint (read-write): Commanded RF frequency.'
    TEMPERATURE: 'Cavity Temperature (Celsius): Body temperature of RF cavity.'
    TEMPERATURE/RB: 'Temperature Readback (read-only): Measured cavity temperature.'
    TUNER: 'Cavity Tuner Position (Centimeters): Mechanical tuner adjusts cavity resonant frequency.'
    TUNER/RB: 'Position Readback (read-only): Current tuner position.'
    TUNER/SP: 'Position Setpoint (read-write): Commanded tuner position.'
    STATUS: 'RF System Status: Cavity and low-level RF system health.'
    STATUS/READY: 'Ready Status (read-only): RF system ready for operation.'
    STATUS/INTERLOCK: 'Interlock Status (read-only): RF interlocks satisfied.'
    STATUS/FAULT: 'Fault Status (read-only): RF system fault detected.'
