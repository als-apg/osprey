  - SR/DIPOLE35
  - SR/DIPOLE36
  signals:
    CURRENT: 'Magnet Excitation Current (Amperes): Current through dipole coil windings. Directly proportional to magnetic bending field via Ampere''s law (B ∝ I). Typically 50-500A depending on ring energy. Tightly regulated by precision power supplies to maintain stable beam energy and trajectory.'
    CURRENT/SP: 'Current Setpoint (read-write): Commanded dipole current for desired bending field. Operators or high-level software set this to control beam energy. Power supply servo loop regulates output to match setpoint.'
    CURRENT/RB: 'Current Readback (read-only): Actual measured dipole current from DCCT. High-accuracy measurement (±0.01%) essential for field reproducibility. Used in power supply feedback loop and archived for orbit analysis.'
    CURRENT/GOLDEN: 'Golden Setpoint (read-only): Reference setpoint for optimal beam operation. Stored golden values represent known good operating conditions. Read-only - used for comparison and restore operations.'
    STATUS: 'Operational Status: Power supply and magnet health indicators. Monitor readiness, operational state, and fault conditions. Critical for safe operation and automated interlocks.'
    STATUS/READY: 'Ready Status (read-only): Power supply is ready for operation. Indicates all interlocks satisfied and system initialized.'
    STATUS/ON: 'On Status (read-only): Power supply is energized and regulating. Indicates magnet is actively powered.'
    STATUS/FAULT: 'Fault Status (read-only): Fault condition detected (overcurrent, overvoltage, etc.). Boolean flag - true indicates problem requiring attention.'
