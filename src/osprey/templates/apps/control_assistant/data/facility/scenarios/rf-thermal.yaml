  week before the investigation, each a body-temperature rise, a reflected-power spike and a forward-power
  trip from thermal detuning; the last is the beam dump four days ago. Nothing after the manifold repair
  two days ago, when cavity 1 settles at 26.5 degC. Cavity 2 shows one minor excursion for contrast.'
