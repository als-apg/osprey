[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scaffold-app"
version = "0.1.0"
description = "An OSPREY application: one panel, one read tool, one write tool."
requires-python = ">=3.11"
# Everything it imports is already in the image: the framework and its dependencies.
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["scaffold_app"]

# The panel and the skill sit beside the package in the source tree and inside it in the wheel.
[tool.hatch.build.targets.wheel.force-include]
panel = "scaffold_app/panel"
skills = "scaffold_app/skills"
