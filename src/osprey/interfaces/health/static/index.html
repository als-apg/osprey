<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!--
  Pre-paint theme boot FIRST: a plain (non-module) script that resolves and
  applies data-theme before first paint, so the panel never flashes the
  wrong theme. Everything below styles against the token stylesheet that
  follows it -- no raw color literals anywhere in this bundle (see
  dashboard.css for the same rule applied to the sibling stylesheet).

  All asset paths are root-absolute so they resolve against the serving host
  in every embedding context and survive the web-terminal proxy's path
  rewrite: the design-system + font assets come from the shared mounts, and
  this panel's own dashboard.css / js live under the sidecar's /static mount.
-->
<script src="/design-system/js/theme-boot.js"></script>
<link rel="stylesheet" href="/design-system/css/tokens.css">
<link rel="stylesheet" href="/design-system/css/base.css">
<link rel="stylesheet" href="/design-system/css/primitives.css">
<link rel="stylesheet" href="/static/fonts/fonts.css">
<link rel="stylesheet" href="/static/dashboard.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Health</title>
<script type="module">
  // Follower role: this panel is never the theme hub (the web terminal is).
  // It applies its own `?theme=` query param when the host
  // appends one, otherwise it trusts whatever theme-boot.js already set
  // pre-paint, and thereafter obeys the hub's broadcasts. applyEmbedded()
  // reads `?embedded=true` and marks the body, which lets the panel send its
  // tile ⋯ entries to the hub. Every color is a design-token reference, so
  // no re-read of computed colors is needed on a data-theme swap.
  import { initTheme } from '/design-system/js/theme-manager.js';
  import { applyEmbedded } from '/design-system/js/frame-params.js';
  initTheme({ role: 'follower' });
  applyEmbedded();
</script>
</head>
<body>

<div class="sweep" id="sw"></div>

<!-- The panel root: the toolbar, then the
     categories sidebar and the report. -->
<div class="health" data-panel-root>
  <div class="osprey-panel-toolbar">
    <div class="osprey-panel-toolbar__start">
      <button class="osprey-icon-btn" id="sidebar-toggle" type="button" aria-controls="categories"></button>
      <div class="osprey-seg" id="filter" role="group" aria-label="Filter checks by status"></div>
    </div>
    <div class="osprey-panel-toolbar__end">
      <button class="osprey-icon-btn" id="scan-now" type="button" aria-label="Scan now" title="Scan now"></button>
    </div>
  </div>

  <div class="health-body">
    <aside class="osprey-panel-sidebar" id="categories" data-open="false" aria-label="Categories">
      <div class="osprey-section-label">Categories</div>
      <div class="health-cat-list" id="category-list"></div>
    </aside>
    <div class="osprey-splitter" id="categories-handle" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Resize sidebar"></div>

    <main class="health-main">
      <div class="health-state" id="state"></div>

      <section class="hero" id="hero" hidden>
        <div class="gauge-w">
          <svg id="gauge" class="gauge-svg" viewBox="0 0 200 200" aria-hidden="true">
            <circle class="gauge-bg" cx="100" cy="100" r="80"/>
          </svg>
          <div class="gauge-c">
            <span class="gauge-sc" id="rsc">--</span>
            <span class="gauge-tot" id="rtot"></span>
          </div>
        </div>
        <div class="hero-text">
          <div class="hero-title" id="hero-title"></div>
          <div class="hero-detail" id="hero-detail"></div>
        </div>
      </section>

      <section class="grid" id="grid" hidden></section>
    </main>
  </div>
</div>

<!-- Panel-local entry module: render + polling. Loaded root-absolute from
     the sidecar's /static mount, after the skeleton above is in the DOM. -->
<script type="module" src="/static/js/dashboard.js"></script>
</body>
</html>
