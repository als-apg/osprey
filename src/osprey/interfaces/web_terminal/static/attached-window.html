<!DOCTYPE html>
<!-- The page a pane's own window opens on (attached-window.js). The hub
     opens it, waits for the marker below, then replaces its head and body with
     its own stylesheets, a header bar and the moved pane. It is a real page
     under the hub so the window shows the hub's address and takes the hub's
     zoom; on its own it shows only the line below. Its page-ready mark is
     pending until the hub has dressed it (attached-window.js dressWindow). -->
<html lang="en" data-osprey-attached-shell data-page-ready="pending">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSPREY</title>
</head>
<body>
  <p>This window shows a pane of the OSPREY web terminal. Open it from a tile's Open in new window button.</p>
</body>
</html>
