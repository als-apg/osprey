<!DOCTYPE html>
<!-- data-browse-orient: axis of the browse split (row = browser left /
     artifact right, column = stacked band). "row" is the shipped default;
     browse-layout.js re-applies a persisted "column" choice at module load. -->
<html lang="en" data-browse-orient="row">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSPREY Workspace</title>
  <meta name="description" content="Artifact Gallery for OSPREY Control System Agent">

  <!-- FOUC prevention: applies data-theme before any CSS loads. Replaces the
       old inline ?theme=/localStorage script + message listener -- both are
       now theme-manager.js's job (follower role, wired in gallery.js), and
       theme-boot.js validates ids against the baked-in manifest instead of
       trusting any 'light'/'dark' string handed to it. -->
  <script src="/design-system/js/theme-boot.js"></script>

  <!-- FOUC prevention: applies data-ui-mode (expert/simple) before any CSS loads -->
  <script src="/design-system/js/mode-boot.js"></script>

  <!-- Design system tokens -->
  <link rel="stylesheet" href="/design-system/css/tokens.css">
  <link rel="stylesheet" href="/design-system/css/base.css">

  <!-- Fonts (self-hosted, no external CDN) -->
  <link rel="stylesheet" href="/static/fonts/fonts.css">

  <!-- highlight.js: data-href-dark/light let theme-manager.js swap the stylesheet at runtime -->
  <link id="hljs-theme" rel="stylesheet"
        href="{{ vendor_url('highlight.js atom-one-dark theme', '/static/css/vendor/atom-one-dark.min.css') }}"
        data-href-dark="{{ vendor_url('highlight.js atom-one-dark theme', '/static/css/vendor/atom-one-dark.min.css') }}"
        data-href-light="{{ vendor_url('highlight.js atom-one-light theme', '/static/css/vendor/atom-one-light.min.css') }}">
  <link rel="prefetch" href="{{ vendor_url('highlight.js atom-one-light theme', '/static/css/vendor/atom-one-light.min.css') }}">
  <script src="{{ vendor_url('highlight.js', '/static/js/vendor/highlight.min.js') }}"></script>

  <!-- marked.js (markdown rendering) -->
  <script src="{{ vendor_url('marked', '/static/js/vendor/marked.min.js') }}"></script>

  <!-- KaTeX (math/equation rendering for markdown artifacts) -->
  <link rel="stylesheet" href="{{ vendor_url('KaTeX CSS', '/static/css/vendor/katex.min.css') }}">
  <script defer src="{{ vendor_url('KaTeX JS', '/static/js/vendor/katex.min.js') }}"></script>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="/static/css/gallery.css">

  <style>
    /* Inline critical styles */
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- App header — slim wordmark + theme + status. In the web-terminal shell
         (body.embedded) the shell chrome supplies the wordmark, theme toggle
         and status, so this whole bar is hidden (frame 2a); the browse view's
         own two cards fill the panel. Scope/refresh/layout live in the
         browser column's ⋯ menu below. -->
    <header class="header">
      <div class="header-inner">
        <div class="header-left">
          <a href="/" class="logo">
            <div class="logo-glyph">
              <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                <path d="M2 17l10 5 10-5"/>
                <path d="M2 12l10 5 10-5"/>
              </svg>
            </div>
            <span class="logo-text">WORKSPACE</span>
          </a>
        </div>
        <div class="header-right">
          <osprey-theme-switcher></osprey-theme-switcher>
          <span class="status-indicator" id="health-indicator">
            <span class="status-dot healthy"></span>
            <span class="status-label">Connected</span>
          </span>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main">
      <!-- Browse View — two cards on the neutral canvas (frame 2a): a left
           browser-column card beside a large detail/preview card. -->
      <section id="view-artifacts-browse" class="view active">
        <div class="browse-layout">
          <!-- Left browser column — card: a single toolbar row + tree/timeline.
               Identity chrome (title, count) is the tile bar's job in the
               embedded shell and the app header's on the standalone page;
               rare actions (scope, refresh, layout) live in the ⋯ menu. -->
          <aside class="browse-sidebar" id="browse-sidebar">
            <div class="sidebar-header">
              <!-- The only bar: filter input beside the Types/Activity mode
                   pair and the ⋯ overflow menu. -->
              <div class="sidebar-controls-row">
                <div class="sidebar-search">
                  <svg class="sidebar-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="7"/>
                    <path d="M21 21l-4.35-4.35"/>
                  </svg>
                  <input
                    type="text"
                    id="search"
                    class="sidebar-search-input"
                    placeholder="Filter..."
                    autocomplete="off"
                  >
                </div>
                <div class="sidebar-mode-toggle">
                  <button class="mode-btn active" data-mode="tree" title="Group by type" aria-label="Group by type">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
                    </svg>
                  </button>
                  <button class="mode-btn" data-mode="activity" title="Sort chronologically" aria-label="Sort chronologically">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <circle cx="12" cy="12" r="10"/>
                      <path d="M12 6v6l4 2"/>
                    </svg>
                  </button>
                </div>
                <div class="sidebar-menu-wrap">
                  <button class="btn btn-icon sidebar-menu-btn" id="sidebar-menu-btn"
                          title="More options" aria-label="More options"
                          aria-haspopup="menu" aria-expanded="false">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                      <circle cx="5" cy="12" r="1.8"/>
                      <circle cx="12" cy="12" r="1.8"/>
                      <circle cx="19" cy="12" r="1.8"/>
                    </svg>
                  </button>
                  <!-- Rare actions; each keeps its long-standing id so the
                       existing gallery.js/browse-layout.js wiring holds. -->
                  <div class="sidebar-menu" id="sidebar-menu" role="menu" hidden>
                    <button class="sidebar-menu-item" id="all-sessions-btn" role="menuitemcheckbox"
                            aria-checked="false" title="Show artifacts from all sessions">
                      <svg class="menu-item-check" width="14" height="14" viewBox="0 0 24 24"
                           fill="none" stroke="currentColor" stroke-width="2.5"
                           stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 6L9 17l-5-5"/>
                      </svg>
                      All sessions
                    </button>
                    <button class="sidebar-menu-item" id="refresh-btn" role="menuitem" title="Refresh all data">
                      <svg class="refresh-icon" width="14" height="14" viewBox="0 0 24 24"
                           fill="none" stroke="currentColor" stroke-width="2"
                           stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
                        <path d="M3.51 9a9 9 0 0114.85-3.36L23 10"/>
                        <path d="M20.49 15a9 9 0 01-14.85 3.36L1 14"/>
                      </svg>
                      Refresh
                    </button>
                    <button class="sidebar-menu-item" id="orient-toggle-btn" role="menuitem"
                            title="Switch to stacked layout" aria-label="Switch to stacked layout">
                      <svg class="orient-icon orient-icon-column" width="14" height="14" viewBox="0 0 24 24"
                           fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="7" rx="1"/>
                        <rect x="3" y="14" width="18" height="7" rx="1"/>
                      </svg>
                      <svg class="orient-icon orient-icon-row" width="14" height="14" viewBox="0 0 24 24"
                           fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="18" rx="1"/>
                        <rect x="14" y="3" width="7" height="18" rx="1"/>
                      </svg>
                      <span class="orient-label">Stacked layout</span>
                    </button>
                  </div>
                </div>
              </div>
              <!-- List/gallery layout toggle: kept in the DOM for its JS hooks
                   (gallery.js binds .layout-btn / #layout-toggle) but hidden.
                   Frame 2a's ~220px browser column has no room for a
                   thumbnail-gallery view, so the type/activity tree is the
                   sole layout here. -->
              <div class="sidebar-layout-toggle" id="layout-toggle" hidden>
                <button class="layout-btn active" data-layout="list" title="List view">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
                  </svg>
                </button>
                <button class="layout-btn" data-layout="gallery" title="Gallery view">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7" rx="1"/>
                    <rect x="14" y="3" width="7" height="7" rx="1"/>
                    <rect x="3" y="14" width="7" height="7" rx="1"/>
                    <rect x="14" y="14" width="7" height="7" rx="1"/>
                  </svg>
                </button>
              </div>
            </div>
            <!-- Scope pill — visible only while the all-sessions scope is on,
                 so the non-default state stays loud even though its toggle
                 lives in the ⋯ menu. -->
            <div class="scope-pill" id="scope-pill" hidden>
              <span class="scope-pill-label">All sessions</span>
              <button class="scope-pill-clear" id="scope-pill-clear"
                      title="Back to this session" aria-label="Show only this session">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2.5" stroke-linecap="round">
                  <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
              </button>
            </div>
            <div class="sidebar-body" id="sidebar-body">
              <!-- Tree or timeline rendered here -->
            </div>
          </aside>

          <!-- Splitter between the cards — live in side-by-side mode
               (browse-layout.js), hidden in the stacked band layout. -->
          <div class="resize-handle osprey-splitter" id="resize-handle"
               role="separator" aria-orientation="vertical"
               aria-label="Resize browser column" tabindex="0"></div>

          <!-- Right pane — inline preview -->
          <div class="browse-preview-pane" id="browse-preview-pane">
            <div class="preview-empty" id="preview-empty">
              <div class="preview-empty-inner">
                <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1">
                  <rect x="6" y="6" width="36" height="36" rx="4" stroke-dasharray="4 4"/>
                  <path d="M6 32l12-12 8 8 6-6 10 10"/>
                  <circle cx="16" cy="16" r="3"/>
                </svg>
                <p>Select an artifact to preview</p>
              </div>
            </div>
            <div class="preview-content hidden" id="preview-content">
              <!-- Preview rendered dynamically -->
            </div>
          </div>
        </div>
      </section>

      <!-- Simple View — a big latest-result card above a friendly
           "Results from this session" list (frame 2b). Shown only when
           html[data-ui-mode="simple"]; the browse view (Expert) is the
           default. Both share the same artifact data + session scoping;
           gallery.js populates this section (renderSimple). -->
      <section id="view-artifacts-simple">
        <div class="simple-layout">
          <!-- Latest result -->
          <div class="simple-result-card">
            <div class="simple-empty" id="simple-empty">
              <div class="preview-empty-inner">
                <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1">
                  <rect x="6" y="6" width="36" height="36" rx="4" stroke-dasharray="4 4"/>
                  <path d="M6 32l12-12 8 8 6-6 10 10"/>
                  <circle cx="16" cy="16" r="3"/>
                </svg>
                <p>No results yet</p>
              </div>
            </div>
            <div class="simple-result hidden" id="simple-result">
              <div class="simple-result-header">
                <span class="simple-result-title" id="simple-result-title"></span>
                <span class="simple-badge-new" id="simple-result-badge" hidden>NEW</span>
                <div class="simple-result-actions">
                  <a class="btn btn-primary" id="simple-open-full" target="_blank" rel="noopener">Open full size</a>
                  <a class="btn btn-secondary" id="simple-save">Save</a>
                </div>
              </div>
              <div class="simple-result-preview" id="simple-result-preview"></div>
              <div class="simple-result-caption" id="simple-result-caption"></div>
            </div>
          </div>
          <!-- Results from this session -->
          <div class="simple-list-card">
            <div class="simple-list-header">
              <span class="simple-list-title">Results from this session</span>
              <span class="simple-list-count" id="simple-list-count">0</span>
              <button class="simple-show-all" id="simple-show-all" hidden>Show all &rarr;</button>
            </div>
            <div class="simple-list-body" id="simple-list-body">
              <!-- Session results rendered dynamically -->
            </div>
          </div>
        </div>
      </section>

    </main>
  </div>

  <!-- logbook.js/print.js load via the import graph (preview.js imports
       both directly); no separate script tags needed. -->
  <script type="module" src="/static/js/gallery.js"></script>
</body>
</html>
