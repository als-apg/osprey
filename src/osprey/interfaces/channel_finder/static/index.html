<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSPREY Channel Finder</title>

  <!-- Theme boot: applies data-theme pre-paint; zero import deps, must load
       before any stylesheet. Live theme changes and the embedded-mode flag
       are handled by the theme-manager FOLLOWER role in app.js. -->
  <script src="/design-system/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/design-system/css/tokens.css">
  <link rel="stylesheet" href="/design-system/css/base.css">
  <link rel="stylesheet" href="/design-system/css/primitives.css">

  <!-- Fonts (self-hosted, no external CDN) -->
  <link rel="stylesheet" href="/static/fonts/fonts.css">

  <!-- Styles -->
  <link rel="stylesheet" href="/static/css/channel-finder.css">
</head>
<body>
  <!-- The panel root: the size container named `panel` that the toolbar's
       and the sidebar's narrow rules measure. One column, embedded and
       standalone alike: the panel toolbar, the active view (the only part
       that scrolls), and the corpus strip. -->
  <div class="cf-panel" id="cf-panel" data-panel-root>
    <!-- The panel toolbar (DESIGN.md §12.3), driven by js/panel-toolbar.js.
         The graph finder claims the toggle, the count and the search while it
         is mounted; elsewhere they stay in their slots, disabled. The ⋯ at
         the far right is built standalone only: embedded, the tile's ⋯ is the
         panel's one menu. -->
    <header class="osprey-panel-toolbar" id="cf-toolbar">
      <div class="osprey-panel-toolbar__start">
        <button class="osprey-icon-btn" id="cf-sidebar-toggle" type="button"
                aria-label="Show sidebar" disabled></button>
        <div class="osprey-seg" id="cf-views" role="group" aria-label="View">
          <button type="button" data-view="explore" aria-pressed="true">Explore</button>
          <button type="button" data-view="feedback" aria-pressed="false">Feedback</button>
        </div>
      </div>
      <div class="osprey-panel-toolbar__end" id="cf-toolbar-end">
        <span class="osprey-panel-toolbar__text" id="cf-result-count" hidden></span>
        <label class="osprey-search-field" id="cf-search-field">
          <input type="search" id="cf-search" placeholder="Search devices, addresses and descriptions"
                 aria-label="Search devices, addresses and descriptions" autocomplete="off"
                 spellcheck="false" disabled>
          <kbd class="osprey-kbd" title="Press / to search" aria-hidden="true">/</kbd>
        </label>
        <osprey-display-menu></osprey-display-menu>
      </div>
    </header>

    <main class="app-main" id="app-main">
      <div class="view-container" id="view-container"></div>
    </main>

    <!-- Corpus strip: the corpus stats, the store they came from and the
         pipeline switcher, pinned under the view. Its provenance truncates
         rather than run into the switcher; the pipeline dropdown opens
         upward. -->
    <div class="corpus-strip" id="corpus-strip">
      <span class="stats-badges" id="stats-badges"></span>
      <!-- Graph paradigm only: the store the numbers came from and the tools
           the assistant reads it with (stats-badges.js renderProvenance). -->
      <span class="corpus-prov" id="corpus-prov"></span>
      <div class="pipeline-switcher" id="pipeline-switcher">
        <button class="pipeline-badge" id="pipeline-badge" title="Switch pipeline"></button>
        <div class="pipeline-dropdown" id="pipeline-dropdown"></div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
