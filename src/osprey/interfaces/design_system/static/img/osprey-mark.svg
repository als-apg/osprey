<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -4 16 16">
  <!-- OSPREY mark, the 16x8 pixel osprey, in the accent blue of the wordmark
       beside it in the web terminal header (index.html) and the chat sprite
       (chat-icons.js). One mark pixel is one pixel of a 16px tab icon, so it
       stays crisp; no tile, so the mark sits on the tab strip itself, with the
       dark theme's lighter accent where the strip is dark. The pages link this
       file at a content-hashed URL (app.py `_favicon_url`): a browser keeps a
       tab icon by its URL, so an edit here reaches it only at a new address. -->
  <style>path { fill: #1f62c4 } @media (prefers-color-scheme: dark) { path { fill: #6e9fff } }</style>
  <path shape-rendering="crispEdges" d="M0 0h2v1h-2zM14 0h2v1h-2zM1 1h3v1h-3zM12 1h3v1h-3zM2 2h4v1h-4zM10 2h4v1h-4zM3 3h4v1h-4zM9 3h4v1h-4zM4 4h8v1h-8zM6 5h4v1h-4zM7 6h2v1h-2zM6 7h1v1h-1zM9 7h1v1h-1z"/>
</svg>
