<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -6 20 20">
  <!-- OSPREY mark, the 16x8 pixel osprey, on the design's "16 light" tile. The
       same pixels are inlined in the web terminal header (index.html) and the
       chat sprite (chat-icons.js). The tile carries its own contrast, so
       the mark reads on a light or a dark tab strip alike. The pages link this
       file at a content-hashed URL (app.py `_favicon_url`): a browser keeps a
       tab icon by its URL, so an edit here reaches it only at a new address. -->
  <rect x="-2" y="-6" width="20" height="20" rx="4" fill="#f1f1ee"/>
  <path fill="#16171a" shape-rendering="crispEdges" d="M0 0h2v1h-2zM14 0h2v1h-2zM1 1h3v1h-3zM12 1h3v1h-3zM2 2h4v1h-4zM10 2h4v1h-4zM3 3h4v1h-4zM9 3h4v1h-4zM4 4h8v1h-8zM6 5h4v1h-4zM7 6h2v1h-2zM6 7h1v1h-1zM9 7h1v1h-1z"/>
</svg>
