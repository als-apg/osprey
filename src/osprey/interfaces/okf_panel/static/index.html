<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OKF Knowledge Panel</title>
  <!-- Empty data-URI icon: suppresses a /favicon.ico 404 in standalone/dev
       (the panel renders inside the web-terminal iframe in production). -->
  <link rel="icon" href="data:," />
  <!-- Theme boot: applies data-theme pre-paint; zero import deps, must load
       before any stylesheet. Live theme changes and the embedded-mode flag
       are handled by the theme-manager FOLLOWER role in app.js. -->
  <script src="/design-system/js/theme-boot.js"></script>

  <!-- Design system tokens (shared across every OSPREY interface) -->
  <link rel="stylesheet" href="/design-system/css/tokens.css" />
  <link rel="stylesheet" href="/design-system/css/base.css" />
  <!-- Primitives: the panel toolbar, its chip and search field, the panel
       sidebar and the centred states (section "Panel chrome"). -->
  <link rel="stylesheet" href="/design-system/css/primitives.css" />

  <!-- Fonts (self-hosted, no external CDN) -->
  <link rel="stylesheet" href="/static/fonts/fonts.css" />

  <!-- Root-absolute asset refs: osprey's panel proxy rewrites these under
       /panel/okf/ in production; served verbatim at / in local/dev. Loaded
       after tokens.css/base.css so its panel rules win over base.css. -->
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <!-- #app is the panel root: the size container the toolbar's search field
       and the sidebar's narrow overlay query (data-panel-root). -->
  <div id="app" data-panel-root data-graph="{{ 'true' if graph else 'false' }}">
    <!-- The panel toolbar (js/toolbar.js): the view switcher, the sidebar
         toggle, the breadcrumb, the bundle-health chip and the search field.
         data-graph says whether the panel serves a facility graph; without
         one the switcher stays hidden and the panel is the Knowledge view
         alone. Each view has its own toggle, context and chip; js/views.js
         shows the open view's. -->
    <header class="osprey-panel-toolbar okf-toolbar">
      <div class="osprey-panel-toolbar__start">
        <!-- The sidebar toggle keeps the corner above the sidebar, as in
             every panel. js/contents.js (panel-sidebar.js) gives it its icon
             and state. -->
        <button id="contents-toggle" class="osprey-icon-btn" type="button"
                aria-controls="sidebar" aria-expanded="false"
                aria-label="Show sidebar" title="Show sidebar"></button>
        <button id="graph-toggle" class="osprey-icon-btn" type="button"
                aria-controls="graph-sidebar" aria-expanded="false"
                aria-label="Show sidebar" title="Show sidebar" hidden></button>
        <span class="okf-toolbar-rule" aria-hidden="true"></span>
        <div id="okf-views" class="osprey-seg" role="group" aria-label="View" hidden>
          <button type="button" data-view="knowledge" aria-pressed="true">Knowledge</button>
          <button type="button" data-view="graph" aria-pressed="false">Graph</button>
        </div>
        <nav id="crumb" class="osprey-crumb" aria-label="Breadcrumb">
          <span class="osprey-crumb-leaf" aria-current="page">Browse</span>
        </nav>
        <span id="graph-context" class="osprey-panel-toolbar__text" hidden></span>
      </div>
      <div class="osprey-panel-toolbar__end">
        <!-- Bundle health (osprey addition): the /api/bundle_health check of
             the served bundle. It opens the issues behind its label. -->
        <button id="bundle-health" class="osprey-chip osprey-chip--connecting"
                type="button" title="Bundle health" aria-live="polite" disabled>
          <span class="osprey-chip-label">Checking bundle</span>
        </button>
        <!-- What the Graph view draws, and from where. -->
        <span id="graph-chip" class="osprey-chip osprey-chip--info" hidden>
          <span class="osprey-chip-label"></span>
        </span>
        <label class="osprey-search-field">
          <input id="search-input" type="search" name="q" autocomplete="off"
                 placeholder="Search concepts…" aria-label="Search concepts" />
        </label>
      </div>
    </header>
    <div id="knowledge-view" class="okf-body">
      <!-- The contents list (js/contents.js). data-open="false": the first
           paint never shows a list the boot is about to hide; the overview
           needs none, and a page opens it. -->
      <aside id="sidebar" class="osprey-panel-sidebar" data-open="false"
             aria-label="Contents">
        <a id="structure-link" class="osprey-nav-row structure-link" href="#__structure">
          <span class="structure-title">Knowledge Base</span>
          <span class="structure-sub">structure overview</span>
        </a>
        <nav id="tree" aria-label="Concept tree"></nav>
        <div id="search-results" hidden aria-label="Search results"></div>
      </aside>
      <!-- The contents list's divider: the shared splitter, driven by
           panel-sidebar.js. Arrow keys nudge it. -->
      <div id="sidebar-resizer" class="osprey-splitter" role="separator"
           aria-orientation="vertical" aria-label="Resize sidebar"
           tabindex="0"></div>
      <main id="reader">
        <div id="reader-content">
          <div class="osprey-state" role="status">
            <p class="osprey-state-message">Loading the knowledge base</p>
          </div>
        </div>
      </main>
    </div>
    <!-- The Graph view (js/graph-view.js): the facility graph, drawn as an
         overview of its kinds and classes or as the neighbourhood of one
         node. Its sidebar is the view's controls and legend; the inspector
         on the right describes the picked node. -->
    <div id="graph-view" class="okf-body" hidden>
      <aside id="graph-sidebar" class="osprey-panel-sidebar" data-open="false"
             aria-label="Graph controls">
        <div class="okf-graph-controls">
          <div id="graph-modes" class="osprey-seg" role="group" aria-label="Drawing">
            <button type="button" data-mode="overview" aria-pressed="true">Overview</button>
            <button type="button" data-mode="hood" aria-pressed="false">Neighbourhood</button>
          </div>
        </div>
        <div id="graph-hits" class="okf-graph-section" hidden aria-label="Search results"></div>
        <div id="graph-depth" class="okf-graph-section" hidden>
          <div class="osprey-section-label">Depth</div>
          <div class="okf-graph-controls">
            <div id="graph-hops" class="osprey-seg" role="group" aria-label="Depth">
              <button type="button" data-hops="1" aria-pressed="false">1 hop</button>
              <button type="button" data-hops="2" aria-pressed="true">2 hops</button>
              <button type="button" data-hops="3" aria-pressed="false">3 hops</button>
            </div>
          </div>
        </div>
        <div class="okf-graph-section">
          <div class="osprey-section-label">Relations</div>
          <div id="graph-relations" class="okf-graph-legend"></div>
        </div>
        <div class="okf-graph-section">
          <div class="osprey-section-label">Nodes</div>
          <div id="graph-kinds" class="okf-graph-legend"></div>
        </div>
      </aside>
      <div id="graph-resizer" class="osprey-splitter" role="separator"
           aria-orientation="vertical" aria-label="Resize sidebar"
           tabindex="0"></div>
      <div class="okf-graph-main">
        <div id="graph-stage" class="okf-graph-stage"></div>
        <aside id="graph-inspector" class="okf-graph-inspector" aria-label="Details" hidden></aside>
      </div>
    </div>
  </div>
  <!-- marked must load before app.js (app.js calls marked.parse).
       Provenance: marked v12.0.2 (MIT), https://github.com/markedjs/marked —
       vendored verbatim; the pinned file carries its own license header. -->
  <script src="/static/vendor/marked.min.js"></script>
  <!-- DOMPurify must load before app.js too: bundle markdown is files an agent
       can write, so app.js writes marked's output only through
       DOMPurify.sanitize. The CDN copy by default, the copy `osprey vendor
       fetch` places in static/vendor/ when the deployment is offline. -->
  <script src="{{ vendor_url('DOMPurify', '/static/vendor/purify.min.js') }}"></script>
  <!-- ES module: imports the theme-manager follower + shared dom helpers.
       Deferred by nature, so it runs after the non-module scripts above
       (marked and DOMPurify stay globals). -->
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
