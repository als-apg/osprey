<script type="module">
// Follower role: the dashboard is never the theme hub (web-terminal is), so it
// never persists a preference or broadcasts — it only applies whatever
// theme-boot.js already resolved pre-paint and whatever the hub broadcasts
// when this page is embedded as the in-terminal EVENTS panel.
import { initTheme } from '/design-system/js/theme-manager.js';
import { applyEmbedded } from '/design-system/js/frame-params.js';
initTheme({ role: 'follower' });
// Stamps body.embedded when the hub frames this page as the EVENTS panel and
// arms the header-contribution helpers the main script publishes to. The hub's
// tile bar adds the title above the panel toolbar.
applyEmbedded();
</script>

<title>Event Dispatcher</title>
<script>
/* OSPREY_CONFIG_PLACEHOLDER */
// Fallback when the dashboard is served without server-side config injection
// (e.g. opened as a static file). dashboard.py replaces the comment above with
// a `window.__OSPREY_CONFIG__ = {...};` literal at request time.
window.__OSPREY_CONFIG__ = window.__OSPREY_CONFIG__ || { facility_name: "", channel_strip_prefix: "", history_url: "" };
</script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-display);
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 13px;
  line-height: 1.5;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ============================================================
   Shell — the panel toolbar (primitives.css) over one scrolling main.
   ============================================================ */

.panel-root {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

/* The warnings nothing else on screen says (the dispatcher or its worker
   unreachable, a full queue) show at the top of the body, only while they
   hold. The tile bar carries no text, and the panel has no status line. */
.embed-notice {
  flex-shrink: 0;
  padding: 8px 20px;
  background: var(--error-tint-08);
  border-bottom: 1px solid var(--error-tint-30);
  color: var(--color-error);
  font-size: 12px;
}
.embed-notice[hidden] { display: none; }

/* ============================================================
   Views — exactly one is visible at a time.
   ============================================================ */

main {
  flex: 1;
  overflow-y: auto;
  min-height: 0;
}
.view { display: none; padding: 18px 20px 28px; }
.view.on { display: block; }
/* A panel-wide state (connecting, not authorised, unreachable) replaces every view. */
main.has-state > .view { display: none; }
.panel-state { height: 100%; }

.section-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 0 0 10px;
}
.view .section-head + .section-head,
.lane-list + .section-head,
.run-list + .section-head,
.detail-block + .section-head { margin-top: 26px; }
.section-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
}
.section-count {
  font-size: 12px;
  color: var(--text-muted);
  margin-left: auto;
}

/* ============================================================
   Timeline lanes — one thin lane per trigger.
   ============================================================ */

.section-head > .osprey-seg { margin-left: auto; }

.lane-list {
  border: 1px solid var(--border-default);
  border-radius: 6px;
  overflow: hidden;
}
.lane {
  display: grid;
  grid-template-columns: 150px 1fr;
  gap: 12px;
  align-items: center;
  padding: 7px 12px;
  border-bottom: 1px solid var(--neutral-tint-06);
}
.lane:last-child { border-bottom: none; }
.lane:hover { background: var(--accent-tint-06); }
.lane.disabled { opacity: 0.5; }
.lane-name {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--color-accent-light);
  cursor: pointer;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.lane-name:hover { text-decoration: underline; }
.lane-rail {
  height: 18px;
  background: var(--bg-panel);
  border: 1px solid var(--border-default);
  border-radius: 3px;
  position: relative;
  overflow: hidden;
}
/* Position comes from `left`, NOT a percentage translateX: a percentage in
   translateX resolves against the element's own width (3px), so it can only
   ever nudge a mark a couple of pixels rather than place it along the rail.
   `left` is percentage-of-parent, which is what a timeline position means;
   transform is then free to carry the centering and the hover scale. */
.lane-mark {
  position: absolute;
  top: 3px;
  width: 3px;
  height: 12px;
  border-radius: 1px;
  cursor: pointer;
  transform: translateX(-50%);
  transition: transform 120ms ease, box-shadow 120ms ease;
  will-change: transform;
}
.lane-mark:hover { transform: translateX(-50%) scaleY(1.3); box-shadow: 0 0 6px currentColor; }
.lane-mark.ok    { background: var(--color-success); }
.lane-mark.err   { background: var(--color-error); }
.lane-mark.retry { background: var(--color-warning); }
.lane-mark.live  {
  background: var(--color-accent-light);
  box-shadow: 0 0 6px var(--color-accent-light);
  width: 4px;
  animation: pulse-mark 1.8s infinite;
}
@keyframes pulse-mark {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.55; }
}

/* ============================================================
   Run list — two lines per run, no table.
   ============================================================ */

.row-list {
  border: 1px solid var(--border-default);
  border-radius: 6px;
  overflow: hidden;
}
.run-row {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  padding: 10px 13px;
  border-bottom: 1px solid var(--border-default);
  cursor: pointer;
  transition: background 120ms ease;
}
.run-row:last-child { border-bottom: none; }
.run-row:hover { background: var(--accent-tint-06); }
.run-icon {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 5px;
  background: var(--text-muted);
}
.run-row.is-ok   .run-icon { background: var(--color-success); }
.run-row.is-err  .run-icon { background: var(--color-error); }
.run-row.is-live .run-icon {
  background: var(--color-warning);
  animation: pulse-mark 1.8s infinite;
}
.run-main { flex: 1; min-width: 0; }
.run-headline {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
}
.run-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  word-break: break-word;
}
.run-when {
  font-size: 12px;
  color: var(--text-muted);
}
.run-preview {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 2px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.run-preview.is-err { color: var(--color-error); }
.run-id {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  flex-shrink: 0;
  margin-top: 2px;
}

.empty-state {
  text-align: center;
  padding: 40px 18px;
  color: var(--text-muted);
  font-size: 12px;
  border: 1px dashed var(--border-default);
  border-radius: 6px;
}
/* The dashed box a section's centred state sits in (renderState inside). */
.state-box {
  border: 1px dashed var(--border-default);
  border-radius: var(--radius-lg);
}
/* The Info icon after a state's message: a technical detail, as a tooltip. */
.state-tip {
  vertical-align: middle;
  margin-left: var(--space-1);
  color: var(--text-muted);
}

/* ============================================================
   Trigger list + trigger detail
   ============================================================ */

.trigger-row {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  padding: 10px 13px;
  border-bottom: 1px solid var(--border-default);
  cursor: pointer;
  transition: background 120ms ease;
}
.trigger-row:last-child { border-bottom: none; }
.trigger-row:hover { background: var(--accent-tint-06); }
.trigger-row.disabled .trigger-name { color: var(--text-muted); }
.trigger-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 5px;
  background: var(--color-success);
}
.trigger-row.disabled .trigger-dot {
  background: transparent;
  border: 1px solid var(--text-muted);
}
.trigger-main { flex: 1; min-width: 0; }
.trigger-name {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-primary);
  word-break: break-word;
}
.trigger-sub {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 2px;
}
.trigger-source {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  margin-left: 8px;
}

.btn {
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border-default);
  font-family: inherit;
  font-size: 12px;
  padding: 4px 12px;
  border-radius: 4px;
  cursor: pointer;
  flex-shrink: 0;
  transition: color 120ms ease, border-color 120ms ease, background 120ms ease;
}
.btn:hover { color: var(--color-accent-light); border-color: var(--color-accent-light); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn:disabled:hover { color: var(--text-secondary); border-color: var(--border-default); }
.btn.primary {
  background: var(--accent-tint-08);
  color: var(--color-accent-light);
  border-color: var(--accent-tint-30);
}
.btn.danger { color: var(--color-error); border-color: var(--error-tint-30); }
.btn.danger:hover { background: var(--error-tint-08); border-color: var(--color-error); }
/* A .btn may be an <a> when it leaves the app (see the run's history link).
   Scoped to anchors on purpose: <button> needs none of this, and widening the
   shared rule would restyle every existing button to fix one element. */
a.btn {
  display: inline-flex;
  align-items: center;
  text-decoration: none;
  line-height: 1.4;
}

.detail-head {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 4px;
}
.detail-title {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  word-break: break-word;
}
.detail-actions { margin-left: auto; display: flex; gap: 6px; }
.detail-summary {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 16px;
}

.field-grid {
  display: grid;
  grid-template-columns: max-content 1fr;
  gap: 7px 18px;
  align-items: baseline;
  margin-bottom: 20px;
}
.field-label {
  font-size: 12px;
  color: var(--text-muted);
}
.field-value {
  font-size: 12px;
  color: var(--text-primary);
  word-break: break-word;
}
.field-value.mono { font-family: var(--font-mono); }
.field-value .btn { margin-left: 8px; }

.detail-block { margin-bottom: 20px; }
.block-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 7px;
}
.prompt-body {
  background: var(--bg-panel);
  border: 1px solid var(--border-default);
  border-left: 2px solid var(--border-accent);
  border-radius: 4px;
  padding: 10px 12px;
  font-family: var(--font-mono);
  font-size: 11px;
  line-height: 1.6;
  color: var(--text-secondary);
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 240px;
  overflow-y: auto;
}

.payload-editor {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.payload-editor textarea {
  background: var(--bg-panel);
  border: 1px solid var(--border-default);
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 11px;
  line-height: 1.6;
  padding: 8px 10px;
  border-radius: 4px;
  resize: vertical;
  min-height: 84px;
  max-height: 280px;
  outline: none;
  transition: border-color 120ms ease;
}
.payload-editor textarea:focus { border-color: var(--color-accent-light); }
.payload-actions {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.payload-actions .hint {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
}
.recent-row {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  align-items: center;
  font-size: 11px;
  color: var(--text-muted);
}
.recent-row .pill {
  background: var(--bg-panel);
  border: 1px solid var(--border-default);
  padding: 2px 8px;
  border-radius: 3px;
  cursor: pointer;
  color: var(--text-secondary);
  font-family: var(--font-mono);
  max-width: 200px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.recent-row .pill:hover { border-color: var(--color-accent-light); color: var(--color-accent-light); }

/* ============================================================
   Run detail — transcript
   ============================================================ */

.transcript {
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.6;
  color: var(--text-secondary);
}
.event {
  margin-bottom: 2px;
  word-break: break-word;
  white-space: pre-wrap;
}
.event-text { color: var(--text-primary); }
.event-error { color: var(--color-error); }
.event-done { color: var(--color-success); }

.tool-call {
  margin: 5px 0;
  background: var(--bg-primary);
  border: 1px solid var(--border-default);
  border-radius: 4px;
  overflow: hidden;
}
.tool-call .tool-head {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 5px 9px;
  cursor: pointer;
  user-select: none;
  color: var(--color-accent-secondary-light);
  transition: background 120ms ease;
}
.tool-call .tool-head:hover { background: var(--accent-secondary-tint-06); }
.tool-call .chev {
  font-size: 9px;
  color: var(--text-muted);
  transition: transform 180ms ease;
  display: inline-block;
  width: 10px;
}
.tool-call.open .chev { transform: rotate(90deg); }
.tool-call .tool-name {
  font-size: 11px;
  color: var(--color-accent-secondary-light);
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tool-call .tool-args {
  font-size: 10px;
  color: var(--text-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 50%;
}
.tool-call .tool-body {
  display: none;
  padding: 6px 10px 10px 24px;
  border-top: 1px solid var(--border-default);
  background: var(--overlay-black-20);
}
.tool-call.open .tool-body { display: block; }
.tool-section-label {
  font-size: 11px;
  color: var(--text-muted);
  margin: 6px 0 3px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.tool-section-label .copy-btn {
  color: var(--text-muted);
  font-size: 11px;
  cursor: pointer;
  padding: 1px 6px;
  border-radius: 3px;
  border: 1px solid transparent;
}
.tool-section-label .copy-btn:hover { color: var(--color-accent-light); border-color: var(--border-accent); }
.tool-json {
  font-family: var(--font-mono);
  font-size: 11px;
  line-height: 1.5;
  color: var(--text-secondary);
  background: var(--bg-primary);
  border-radius: 3px;
  padding: 6px 8px;
  max-height: 320px;
  overflow: auto;
  word-break: break-word;
  white-space: pre-wrap;
  margin: 0;
}
.tool-json .key { color: var(--color-accent-secondary); }
.tool-json .str { color: var(--color-success); }
.tool-json .num { color: var(--color-accent-light); }
.tool-json .bool { color: #a78bfa; } /* hygiene-allow-color: fixed categorical JSON-syntax color (5th hue, no fleet token) */
.tool-json .null { color: var(--text-muted); font-style: italic; }

.toast {
  position: fixed;
  bottom: 16px;
  right: 16px;
  padding: 9px 15px;
  background: var(--bg-secondary);
  border: 1px solid var(--border-default);
  border-left: 3px solid var(--color-accent-light);
  border-radius: 4px;
  font-size: 12px;
  color: var(--text-primary);
  z-index: 1000;
  max-width: 360px;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 180ms ease, transform 180ms ease;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.err { border-left-color: var(--color-error); }
.toast.ok  { border-left-color: var(--color-success); }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--neutral-tint-20); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--neutral-tint-35); }
</style>
<link rel="stylesheet" href="/static/fonts/fonts.css">
</head>
<body>

<div class="panel-root" data-panel-root>

<div class="osprey-panel-toolbar">
  <div class="osprey-panel-toolbar__start">
    <div class="osprey-seg" id="view-seg" role="group" aria-label="Dispatcher views">
      <button type="button" data-view="activity" aria-pressed="true">Activity</button>
      <button type="button" data-view="triggers" aria-pressed="false">Triggers</button>
    </div>
    <span class="osprey-panel-toolbar__text" id="toolbar-crumb" hidden></span>
  </div>
  <div class="osprey-panel-toolbar__end">
    <label class="osprey-search-field" id="search-field">
      <span data-icon="search"></span>
      <input type="search" id="search" placeholder="Search runs…" aria-label="Search runs" spellcheck="false" autocomplete="off">
    </label>
  </div>
</div>

<div class="embed-notice" id="embed-notice" role="status" hidden></div>

<main id="main">

  <!-- A panel-wide state: while it shows, every view is hidden -->
  <div class="panel-state" id="panel-state" hidden></div>

  <!-- Activity: timeline lanes + recent runs -->
  <section class="view on" id="view-activity">
    <div class="section-head">
      <span class="section-title" id="timeline-title">Last 24 hours</span>
      <div class="osprey-seg" id="timeline-window" role="group" aria-label="Timeline window">
        <button type="button" data-hours="1" aria-pressed="false">1h</button>
        <button type="button" data-hours="24" aria-pressed="true">24h</button>
        <button type="button" data-hours="168" aria-pressed="false">7d</button>
      </div>
    </div>
    <div class="lane-list" id="lane-list"></div>

    <div class="section-head">
      <span class="section-title" id="runs-title">Recent runs</span>
      <div class="osprey-seg" id="status-filter" role="group" aria-label="Run status">
        <button type="button" data-status="" aria-pressed="true">All</button>
        <button type="button" data-status="error" aria-pressed="false">Failed</button>
        <button type="button" data-status="pending" aria-pressed="false">Running</button>
      </div>
    </div>
    <div id="run-list"></div>
  </section>

  <!-- Triggers: the list -->
  <section class="view" id="view-triggers">
    <div class="section-head">
      <span class="section-title">Triggers</span>
      <span class="section-count" id="trigger-count"></span>
    </div>
    <div id="trigger-list"></div>
  </section>

  <!-- Run detail (the toolbar's Activity segment leads back) -->
  <section class="view" id="view-run">
    <div id="run-detail"></div>
  </section>

  <!-- Trigger detail (the toolbar's Triggers segment leads back) -->
  <section class="view" id="view-trigger">
    <div id="trigger-detail"></div>
  </section>

</main>

</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   State
   ============================================================ */

let state = { pool: { running: 0, queued: 0, max: 0 }, triggers: [], runs: [], timeline: {}, server_time_iso: null, facility_timezone: null };
/* `search` filters the Activity runs and `triggerQuery` the Triggers list: the
   toolbar's one search field edits whichever list is on screen. */
let filters = { lane: '', status: '', search: '', triggerQuery: '', timelineHours: 24 };

/* The whole routing model: which of the four screens is showing, and what it
   is showing. There is no other navigation state — no open-tab list, no
   per-zone collapse flags, no stored geometry. */
let view = { name: 'activity', runId: null, triggerName: null };

let pollTimer = null;
let pollMs = 3000;
let authBlocked = false;
let lastWorkerError = null;
/* False until the first /dashboard/state answer: until then nothing is known,
   so the panel shows a connecting state rather than an empty dispatcher. */
let loaded = false;
/* The last poll's failure when the dispatcher itself did not answer. */
let dispatcherError = null;
let searchTimer = null;
/* The single live EventSource, owned by whichever run detail is open. */
let stream = null;
let streamRunId = null;
let streamParts = { text: [], toolCalls: [] };

const POLL_OK_MS = 3000;
/* On 401 the panel cannot read anything, so a 3s poll is 1200 pointless
   requests an hour. Back off and say so instead. */
const POLL_BLOCKED_MS = 30000;

/* ============================================================
   Small helpers
   ============================================================ */

function $(sel) { return document.querySelector(sel); }
function el(tag, props = {}, children = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'className') e.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'dataset') Object.assign(e.dataset, v);
    else if (k in e) e[k] = v;
    else e.setAttribute(k, v);
  }
  for (const child of (Array.isArray(children) ? children : [children])) {
    if (child == null) continue;
    e.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
  }
  return e;
}
function truncId(id) { return id ? id.slice(0, 8) : '—'; }

/** Compact but readable — "14 min ago". */
function formatAge(sec) {
  if (sec == null) return '';
  if (sec < 60) return 'just now';
  if (sec < 3600) return Math.round(sec / 60) + ' min ago';
  if (sec < 86400) return Math.round(sec / 3600) + ' hr ago';
  return Math.round(sec / 86400) + ' d ago';
}
function formatDuration(sec) {
  if (sec == null) return null;
  if (sec < 60) return sec.toFixed(1) + 's';
  return Math.floor(sec / 60) + 'm ' + Math.round(sec % 60) + 's';

// Build a <pre> with lightweight JSON syntax highlighting. Uses matchAll() so
// the text is tokenized without touching innerHTML — tool content cannot inject
// markup. Tokens: key (quoted string + colon), str, bool, null, num.
function buildJsonView(text) {
  const pre = el('pre', { className: 'tool-json' });
  if (!text) { pre.textContent = ''; return pre; }
  const tokenRE = /("(?:\\.|[^"\\])*")(\s*:)|("(?:\\.|[^"\\])*")|\b(true|false)\b|\bnull\b|(-?\d+(?:\.\d+)?)/g;
  let cursor = 0;
  for (const m of text.matchAll(tokenRE)) {
    if (m.index > cursor) pre.appendChild(document.createTextNode(text.slice(cursor, m.index)));
    if (m[1] !== undefined) {
      pre.appendChild(el('span', { className: 'key', textContent: m[1] }));
      pre.appendChild(document.createTextNode(m[2]));
    } else if (m[3] !== undefined) {
      pre.appendChild(el('span', { className: 'str', textContent: m[3] }));
    } else if (m[4] !== undefined) {
      pre.appendChild(el('span', { className: 'bool', textContent: m[4] }));
    } else if (m[5] !== undefined) {
      pre.appendChild(el('span', { className: 'num', textContent: m[5] }));
    } else {
      pre.appendChild(el('span', { className: 'null', textContent: 'null' }));
    }
    cursor = m.index + m[0].length;
  }
  if (cursor < text.length) pre.appendChild(document.createTextNode(text.slice(cursor)));
  return pre;
}

/* ============================================================
   Transport
   ============================================================ */

async function apiGet(path) {
  // Attach the bearer token for the standalone (direct-to-dispatcher) path; in
  // the in-terminal proxy path bearer() is empty and the proxy injects it.
  const r = await fetch(path, { credentials: 'same-origin', headers: { ...bearer() } });
  if (!r.ok) { const e = new Error(`GET ${path} → ${r.status}`); e.status = r.status; throw e; }
  return r.json();
}
async function apiPost(path, body = null, headers = {}) {
  const opts = { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json', ...headers } };
  if (body !== null) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  let data = null; try { data = await r.json(); } catch {}
  return { ok: r.ok, status: r.status, data };
}
async function apiPut(path, body, headers = {}) {
  const r = await fetch(path, { method: 'PUT', credentials: 'same-origin', headers: { 'Content-Type': 'application/json', ...headers }, body: JSON.stringify(body) });
  let data = null; try { data = await r.json(); } catch {}
  return { ok: r.ok, status: r.status, data };
}

function getDispatcherToken() {
  const stored = sessionStorage.getItem('dispatcher-token');
  if (stored) return stored;
  // Accept a one-time handoff via the URL fragment (#token=...). Fragments are
  // NOT sent to the server and are not written to access logs, unlike query
  // params. The token is moved into sessionStorage and stripped from the URL.
  const hashParams = new URLSearchParams(window.location.hash.slice(1));
  const fromHash = hashParams.get('token');
  if (fromHash) {
    sessionStorage.setItem('dispatcher-token', fromHash);
    hashParams.delete('token');
    const rest = hashParams.toString();
    const u = new URL(window.location.href);
    u.hash = rest ? '#' + rest : '';
    history.replaceState({}, '', u.toString());
    return fromHash;
  }
  return null;
}
function bearer() {
  const t = getDispatcherToken();
  return t ? { 'Authorization': 'Bearer ' + t } : {};
}

/* Writes are NOT gated on holding a token client-side.
 *
 * In the path that matters — the panel embedded in the web terminal — the
 * terminal's proxy injects the dispatcher bearer server-side for every method,
 * so the browser legitimately holds nothing and the request still succeeds.
 * Demanding a token here would pop a `prompt()` on the panel's primary action,
 * inside an iframe, where a modal blocks the whole terminal tab — and it would
 * fire precisely when it was least necessary.
 *
 * So: attempt the write, and let the server be the authority. This turns a
 * 401 into the same sentence the read path already shows, instead of a dialog.
 */
/* True when this page is being served through the web terminal's panel proxy,
 * which is the only path that injects a bearer server-side. Read off the URL
 * because that is the one signal available to the standalone page too — and it
 * decides which advice is honest. Telling an operator already sitting IN the
 * EVENTS tab to "open it from the EVENTS tab" is the failure mode this guards:
 * proxied means the token is missing from the terminal's environment, which is
 * a deployment fact they can act on, not a navigation mistake. */
const IN_TERMINAL_PROXY = window.location.pathname.includes('/panel/events/');
const UNAUTHORIZED_HINT = IN_TERMINAL_PROXY
  ? 'Not authorised to change the dispatcher — this terminal has no dispatcher token.'
  : 'Not authorised — open this panel from the terminal’s EVENTS tab.';
/* The not-authorised state: the token name is a deployment detail, so it sits
   behind the Info icon; the standalone advice is the next step, so it is the
   state's second line. */
const UNAUTHORIZED_STATE = IN_TERMINAL_PROXY
  ? { tip: 'This terminal has no EVENT_DISPATCHER_TOKEN. Its tier or app must declare the EVENTS panel, and `osprey up` must mint the token into the deployment’s .env.' }
  : { detail: 'Open this panel from the terminal’s EVENTS tab, which supplies a token.' };

/** True when a response was rejected for auth; the caller explains rather than retries. */
function explainIfUnauthorized(res) {
  if (res.status !== 401 && res.status !== 403) return false;
  showToast(UNAUTHORIZED_HINT, 'err');
  return true;
}

async function fetchState() {
  try {
    const data = await apiGet(`/dashboard/state?timeline_hours=${filters.timelineHours}`);
    state = data;
    stampFacilityTimezone(state.facility_timezone);
    if (authBlocked) { authBlocked = false; setPollInterval(POLL_OK_MS); }
    loaded = true;
    dispatcherError = null;
    lastWorkerError = data.worker_error || null;
    render();
  } catch (e) {
    // 401/403 means this page was opened outside the terminal proxy and has no
    // token. That is a permanent condition until someone supplies one, so stop
    // hammering and say what to do about it — the old panel logged a console
    // error every 3s forever behind an empty screen.
    if (e.status === 401 || e.status === 403) {
      if (!authBlocked) { authBlocked = true; setPollInterval(POLL_BLOCKED_MS); }
      render();
      return;
    }
    // Anything else: the dispatcher did not answer. The banner says so, and the
    // last state stays on screen rather than turning into an empty dispatcher.
    dispatcherError = e.message || String(e);
    console.error('fetchState failed:', e);

}
function setPollInterval(ms) {
  pollMs = ms;
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(fetchState, pollMs);
}
function startPolling() {
  fetchState();
  setPollInterval(pollMs);
}

/* ============================================================
   Routing — four screens; the toolbar's segments lead back
   ============================================================ */

const VIEW_IDS = {
  activity: 'view-activity',
  triggers: 'view-triggers',
  run: 'view-run',
  trigger: 'view-trigger',
};

function navigate(next, { push = true } = {}) {
  // Leaving a run detail tears its stream down; nothing else owns one.
  if (view.name === 'run' && next.name !== 'run') closeStream();
  view = { name: 'activity', runId: null, triggerName: null, ...next };
  for (const [name, id] of Object.entries(VIEW_IDS)) {
    document.getElementById(id).classList.toggle('on', name === view.name);
  }
  $('#main').scrollTop = 0;
  if (push) saveUrl();
  render();
}

/* ============================================================
   Panel toolbar — view switch, breadcrumb, search, section segs
   ============================================================ */

function pressSeg(selector, isPressed) {
  for (const b of document.querySelectorAll(selector + ' > button')) {
    b.setAttribute('aria-pressed', String(isPressed(b)));
  }
}

function syncToolbar() {
  // A detail screen is reached FROM a list, so that list's segment stays pressed
  // and pressing it again leads back.
  const triggersSide = view.name === 'triggers' || view.name === 'trigger';
  pressSeg('#view-seg', (b) => b.dataset.view === (triggersSide ? 'triggers' : 'activity'));

  let leaf = '';
  if (view.name === 'trigger') leaf = view.triggerName;
  else if (view.name === 'run') {
    const run = (state.runs || []).find(r => r.run_id === view.runId);
    leaf = (run?.trigger_name || 'Run') + ' · ' + truncId(view.runId);
  }
  const crumb = $('#toolbar-crumb');
  crumb.hidden = !leaf;
  crumb.textContent = leaf ? '› ' + leaf : '';

  // One search field: runs on Activity, trigger names on Triggers. A detail
  // screen has no list to search, so the field keeps its slot, disabled.
  const input = $('#search');
  const onList = view.name === 'activity' || view.name === 'triggers';
  const label = triggersSide ? 'Filter triggers' : 'Search runs';
  input.placeholder = label + '…';
  input.setAttribute('aria-label', label);
  input.disabled = !onList;
  setTitle($('#search-field'), onList ? '' : 'Search works on the Activity and Triggers lists');
  const value = triggersSide ? filters.triggerQuery : filters.search;
  if (input.value !== value && document.activeElement !== input) input.value = value;

  pressSeg('#timeline-window', (b) => parseFloat(b.dataset.hours) === filters.timelineHours);
  pressSeg('#status-filter', (b) => (b.dataset.status || '') === filters.status);
}

function hasRunFilters() {
  return Boolean(filters.lane || filters.status || filters.search);
}
function hasFilters() {
  return hasRunFilters() || Boolean(filters.triggerQuery) || filters.timelineHours !== 24;
}
/** A run filter changed: keep the URL, the list and the ⋯ entry in step. */
function applyRunFilters() {
  saveUrl();
  renderRunList();
  publishHeader();
}
/** ⋯ › Clear filters: the window, the status, the lane and both searches. */
function clearFilters() {
  clearTimeout(searchTimer);
  const refetch = filters.timelineHours !== 24;
  filters = { lane: '', status: '', search: '', triggerQuery: '', timelineHours: 24 };
  $('#search').value = '';
  saveUrl();
  render();
  if (refetch) fetchState();
}

/* ============================================================
   Tile-bar header contribution — one ⋯ entry

   The panel's controls live in its own toolbar; the hub's tile bar gets a v3
   `menu`, whose entries land in the tile ⋯ "This panel" section, and never
   inert text. The
   design-system helpers are ES modules while this is a classic inline script,
   so they arrive through a dynamic import() rather than a top-level one. Until
   it settles every publish below simply does nothing.
   ============================================================ */

let headerContrib = null;
const headerContribReady = import('/design-system/js/header-contrib.js')
  .then((mod) => { headerContrib = mod; })
  .catch((e) => {
    // Helpers unreachable: the tile bar keeps its title and close button, and
    // the panel keeps working — one lost affordance, not a broken screen.
    console.warn('Header contribution unavailable:', e);
  });

/* The hub renders exactly what the LAST contribution says and never mutates
   item state itself, so the WHOLE contribution goes out again on every render
   and filter change, which keeps the entry's disabled state current. */
function publishHeader() {
  if (!headerContrib) return;
  headerContrib.contributeHeader([
    {
      kind: 'menu',
      id: 'events',
      items: [{ id: 'clear-filters', label: 'Clear filters', disabled: !hasFilters() }],
    },
  ]);
}

function loadUrl() {
  const p = new URL(window.location.href).searchParams;
  if (p.has('lane')) filters.lane = p.get('lane') || '';
  if (p.has('status')) filters.status = p.get('status') || '';
  if (p.has('q')) filters.search = p.get('q') || '';
  if (p.has('hours')) {
    const h = parseFloat(p.get('hours'));
    if (!isNaN(h) && h > 0) filters.timelineHours = h;
  }
  const v = p.get('view');
  if (v === 'triggers') view = { name: 'triggers', runId: null, triggerName: null };
  else if (v === 'run' && p.get('id')) view = { name: 'run', runId: p.get('id'), triggerName: null };
  else if (v === 'trigger' && p.get('name')) view = { name: 'trigger', runId: null, triggerName: p.get('name') };
}

function saveUrl() {
  const u = new URL(window.location.href);
  const setOrDel = (k, v) => v ? u.searchParams.set(k, v) : u.searchParams.delete(k);
  setOrDel('lane', filters.lane);
  setOrDel('status', filters.status);
  setOrDel('q', filters.search);
  if (filters.timelineHours !== 24) u.searchParams.set('hours', String(filters.timelineHours));
  else u.searchParams.delete('hours');

  u.searchParams.delete('view');
  u.searchParams.delete('id');
  u.searchParams.delete('name');
  if (view.name === 'triggers') u.searchParams.set('view', 'triggers');
  else if (view.name === 'run') { u.searchParams.set('view', 'run'); u.searchParams.set('id', view.runId); }
  else if (view.name === 'trigger') { u.searchParams.set('view', 'trigger'); u.searchParams.set('name', view.triggerName); }

  history.replaceState({}, '', u.toString());
}

/* ============================================================
   Warning banner — what a stale screen must not hide
   ============================================================ */

const DISPATCHER_UNREACHABLE = 'Cannot reach the dispatcher — the runs below may be out of date.';
const WORKER_UNREACHABLE = 'Cannot reach the dispatch worker — the runs below may be out of date.';

/* The body's banner: the dispatcher or its worker being unreachable, and a
   full queue. Persistent, not a toast: a stale run list must never look
   fresh. While reads are refused, or before the first state arrives, the
   panel-wide state already says so, so the banner stays down. */
function renderNotice() {
  const box = $('#embed-notice');
  const lines = [];
  if (!authBlocked && loaded) {
    if (dispatcherError) lines.push(DISPATCHER_UNREACHABLE);
    else if (lastWorkerError) lines.push(WORKER_UNREACHABLE);
    const queued = (state.pool || {}).queued;
    if (queued) lines.push(`Queue full — ${queued} waiting.`);
  }
  box.replaceChildren(...lines.map((t) => el('div', { textContent: t })));
  box.hidden = lines.length === 0;
}

/* ============================================================
   Panel-wide state — connecting, not authorised, unreachable
   ============================================================ */

/** The state that stands in for every view, or null when the views can show. */
function panelState() {
  // A 401 leaves state.triggers empty, so every list would report "none
  // registered" — a claim about a dispatcher we were not allowed to read.
  if (authBlocked) {
    return { icon: 'x', message: 'Not authorised to read the dispatcher.', ...UNAUTHORIZED_STATE, action: RETRY };
  }
  if (!loaded && dispatcherError) {
    return { icon: 'x', message: 'Cannot reach the dispatcher.', tip: dispatcherError, action: RETRY };
  }
  if (!loaded) return { icon: 'refresh', message: 'Connecting to the dispatcher…' };
  return null;
}

/** Paint the panel-wide state; true when it replaces the views. */
function renderPanelState() {
  const next = panelState();
  const host = $('#panel-state');
  $('#main').classList.toggle('has-state', next !== null);
  host.hidden = next === null;
  if (next) showState(host, next);
  else host.textContent = '';
  return next !== null;
}

/* ============================================================
   Activity — timeline lanes
   ============================================================ */

function renderLanes() {
  const hours = filters.timelineHours;
  const now = Date.now();
  const windowMs = hours * 3600 * 1000;
  const start = now - windowMs;

  $('#timeline-title').textContent =
    hours <= 1 ? 'Last hour' : hours <= 24 ? 'Last 24 hours' : 'Last 7 days';

  const list = $('#lane-list');
  list.textContent = '';
  const triggers = state.triggers || [];

  if (triggers.length === 0) {
    showState(list, { icon: 'activity', message: 'No triggers are registered.' });
    return;
  }

  for (const t of triggers) {
    const events = (state.timeline[t.name] || []).filter(ev => {
      const ts = parseIsoTs(ev.timestamp);
      return ts != null && ts >= start && ts <= now;
    });

    const lane = el('div', { className: 'lane' + (t.status === 'disabled' ? ' disabled' : '') });
    lane.appendChild(el('div', {
      className: 'lane-name',
      textContent: t.name,
      title: 'Show only this trigger\u2019s runs below',
      onclick: () => { filters.lane = filters.lane === t.name ? '' : t.name; applyRunFilters(); },
    }));

    const rail = el('div', { className: 'lane-rail' });
    const hasPending = (state.runs || []).some(r => r.status === 'pending' && r.trigger_name === t.name);
    for (let i = 0; i < events.length; i++) {
      const ev = events[i];
      const ts = parseIsoTs(ev.timestamp);
      if (ts == null) continue;
      const pct = ((ts - start) / windowMs) * 100;
      let kind = 'ok';
      if (ev.status === 'error' || (ev.status && ev.status.startsWith('error'))) kind = 'err';
      else if (ev.status === 'queue_full') kind = 'retry';
      if (i === events.length - 1 && hasPending && ev.status === 'dispatched') kind = 'live';

      rail.appendChild(el('div', {
        className: 'lane-mark ' + kind,
        style: { left: pct + '%' },
        title: [formatMarkTime(ts), ev.status].filter(Boolean).join(' — '),
        onclick: () => openNearestRunForTrigger(t.name, ts),
      }));
    }
    lane.appendChild(rail);
    list.appendChild(lane);
  }
}

function openNearestRunForTrigger(triggerName, ts) {
  const runs = (state.runs || []).filter(r => r.trigger_name === triggerName);
  if (runs.length === 0) { showToast('No runs recorded yet for ' + triggerName); return; }
  let closest = runs[0], bestDelta = Infinity;
  for (const r of runs) {
    const d = Math.abs((r.created_at || 0) * 1000 - ts);
    if (d < bestDelta) { bestDelta = d; closest = r; }
  }
  navigate({ name: 'run', runId: closest.run_id });
}

/* ============================================================
   Activity — recent runs
   ============================================================ */

function matchesFilter(r) {
  if (filters.lane && r.trigger_name !== filters.lane) return false;
  if (filters.status && r.status !== filters.status) return false;
  if (filters.search) {
    const q = filters.search.toLowerCase();
    const blob = [r.run_id, r.trigger_name || '', r.text_output || '', r.error || ''].join(' ').toLowerCase();
    if (!blob.includes(q)) return false;
  }
  return true;
}

/** One run, as two lines. Shared by the Activity list and trigger detail. */
function renderRunRow(r, { showName = true } = {}) {
  const outcome = outcomeOf(r.status);
  const row = el('div', {
    className: 'run-row is-' + outcome,
    onclick: () => navigate({ name: 'run', runId: r.run_id }),
  });
  row.appendChild(el('div', { className: 'run-icon' }));

  const main = el('div', { className: 'run-main' });
  const headline = el('div', { className: 'run-headline' });
  if (showName) {
    headline.appendChild(el('span', { className: 'run-name', textContent: r.trigger_name || 'Manual run' }));
  }
  const when = [formatAge(r.age_sec), formatDuration(r.duration_sec)].filter(Boolean).join(' · ');
  headline.appendChild(el('span', { className: 'run-when', textContent: when }));
  main.appendChild(headline);

  const preview = r.error || (r.text_output || '').replace(/\s+/g, ' ').trim();
  if (preview) {
    main.appendChild(el('div', {
      className: 'run-preview' + (r.error ? ' is-err' : ''),
      textContent: preview.slice(0, 200),
    }));
  }
  row.appendChild(main);

  row.appendChild(el('div', { className: 'run-id', textContent: truncId(r.run_id) }));
  return row;
}

function renderRunList() {
  const host = $('#run-list');
  host.textContent = '';

  // The lane filter has no control of its own: the title names it, and
  // ⋯ › Clear filters (or a second press on the lane name) drops it.
  $('#runs-title').textContent = filters.lane ? 'Recent runs · ' + filters.lane : 'Recent runs';
  pressSeg('#status-filter', (b) => (b.dataset.status || '') === filters.status);

  if (lastWorkerError) {
    // The dispatcher answered without runs: a down worker must not read as an
    // empty history.
    boxedState(host, { icon: 'x', message: 'Cannot reach the dispatch worker.', tip: lastWorkerError, action: RETRY });
    return;
  }

  const runs = (state.runs || []).filter(matchesFilter);
  if (runs.length === 0) {
    if (hasRunFilters()) {
      boxedState(host, {
        icon: 'search',
        message: 'No runs match the current filters.',
        action: { label: 'Clear filters', onClick: clearFilters },
      });
    } else {
      boxedState(host, {
        icon: 'history',
        message: 'No runs recorded yet.',
        action: { label: 'View triggers', onClick: () => navigate({ name: 'triggers' }) },
      });
    }
    return;
  }

  const list = el('div', { className: 'row-list' });
  for (const r of runs) list.appendChild(renderRunRow(r));
  host.appendChild(list);
}

/* ============================================================
   Triggers list
   ============================================================ */

/** Human summary of where a trigger's events come from. */
function describeSource(t) {
  const cfg = t.source_config || {};
  if (t.source === 'epics_ca') {
    const edge = cfg.edge || 'rising';
    const sym = edge === 'rising' ? '↑>' : edge === 'falling' ? '↓<' : '↔';
    const stripPrefix = (window.__OSPREY_CONFIG__ && window.__OSPREY_CONFIG__.channel_strip_prefix) || '';
    const pv = cfg.pv ? String(cfg.pv).replace(new RegExp('^' + stripPrefix, 'i'), '') : '';
    return `${pv} ${sym}${cfg.threshold ?? '?'}`;
  }
  if (t.source === 'cron' && Array.isArray(cfg.at)) {
    const days = Array.isArray(cfg.days) ? cfg.days.join(' ') : 'daily';
    return cfg.at.join(', ') + ' · ' + days;
  }
  if (t.source === 'cron') return formatInterval(cfg.interval_sec);
  return t.source || '';
}

function renderTriggerList() {
  const triggers = state.triggers || [];
  const q = filters.triggerQuery.toLowerCase();
  const visible = triggers.filter(t => !q || t.name.toLowerCase().includes(q));

  $('#trigger-count').textContent = plural(triggers.length, 'trigger');

  const host = $('#trigger-list');
  host.textContent = '';

  if (visible.length === 0) {
    if (triggers.length === 0) {
      boxedState(host, { icon: 'activity', message: 'No triggers are registered.' });
    } else {
      boxedState(host, {
        icon: 'search',
        message: 'No triggers match that filter.',
        action: { label: 'Clear filters', onClick: clearFilters },
      });
    }
    return;
  }

  const list = el('div', { className: 'row-list' });
  for (const t of visible) {
    const disabled = t.status === 'disabled';
    const row = el('div', {
      className: 'trigger-row' + (disabled ? ' disabled' : ''),
      onclick: () => navigate({ name: 'trigger', triggerName: t.name }),
    });
    row.appendChild(el('div', { className: 'trigger-dot' }));

    const main = el('div', { className: 'trigger-main' });
    const nameRow = el('div');
    nameRow.appendChild(el('span', { className: 'trigger-name', textContent: t.name }));
    nameRow.appendChild(el('span', { className: 'trigger-source', textContent: describeSource(t) }));
    main.appendChild(nameRow);

    const lastFired = t.last_fired ? parseIsoTs(t.last_fired) : null;
    let sub = disabled
      ? 'Disabled'
      : lastFired ? 'Fired ' + formatAge((Date.now() - lastFired) / 1000) : 'Never fired';
    const nextFire = disabled ? '' : formatNextFire(t.next_fire);
    if (nextFire) sub += ' · next ' + nextFire;
    main.appendChild(el('div', { className: 'trigger-sub', textContent: sub }));
    row.appendChild(main);

    row.appendChild(el('button', {
      className: 'btn',
      textContent: 'Fire',
      disabled,
      title: disabled ? 'Trigger is disabled' : 'Fire with an empty payload',
      onclick: (e) => { e.stopPropagation(); fireTrigger(t.name, {}); },
    }));
    list.appendChild(row);
  }
  host.appendChild(list);
}

/* ============================================================
   Trigger detail
   ============================================================ */

function renderTriggerDetail() {
  const host = $('#trigger-detail');
  host.textContent = '';
  const t = (state.triggers || []).find(x => x.name === view.triggerName);
  if (!t) {
    host.appendChild(el('div', { className: 'empty-state', textContent: 'That trigger is no longer registered.' }));
    return;
  }
  const disabled = t.status === 'disabled';

  const head = el('div', { className: 'detail-head' });
  head.appendChild(el('span', { className: 'detail-title', textContent: t.name }));
  host.appendChild(head);

  const grid = el('div', { className: 'field-grid' });
  const field = (label, value, mono = false) => {
    grid.appendChild(el('div', { className: 'field-label', textContent: label }));
    grid.appendChild(el('div', { className: 'field-value' + (mono ? ' mono' : ''), textContent: value }));
  };
  field('Source', describeSource(t) || t.source || '—', true);
  const nextFire = disabled ? '' : formatNextFire(t.next_fire);
  if (nextFire) field('Next fire', nextFire);

  grid.appendChild(el('div', { className: 'field-label', textContent: 'Status' }));
  const statusCell = el('div', { className: 'field-value' }, [
    el('span', { textContent: disabled ? 'Disabled' : 'Armed' }),
  ]);
  statusCell.appendChild(el('button', {
    className: 'btn' + (disabled ? '' : ' danger'),
    textContent: disabled ? 'Enable' : 'Disable',
    onclick: () => toggleTrigger(t.name, t.status),
  }));
  grid.appendChild(statusCell);

  field('On error', t.on_error || 'drop');
  field('Tools', (t.allowed_tools && t.allowed_tools.length) ? t.allowed_tools.join(', ') : 'none', true);
  host.appendChild(grid);

  if (t.prompt) {
    const block = el('div', { className: 'detail-block' });
    block.appendChild(el('div', { className: 'block-title', textContent: 'Prompt' }));
    block.appendChild(el('div', { className: 'prompt-body', textContent: t.prompt }));
    host.appendChild(block);
  }

  host.appendChild(buildPayloadEditor(t));

  const runs = (state.runs || []).filter(r => r.trigger_name === t.name);
  const runsBlock = el('div', { className: 'detail-block' });
  runsBlock.appendChild(el('div', { className: 'block-title', textContent: 'Recent runs from this trigger' }));
  if (runs.length === 0) {
    runsBlock.appendChild(el('div', { className: 'empty-state', textContent: 'This trigger has not run yet.' }));
  } else {
    const list = el('div', { className: 'row-list' });
    for (const r of runs) list.appendChild(renderRunRow(r, { showName: false }));
    runsBlock.appendChild(list);
  }
  host.appendChild(runsBlock);
}

function buildPayloadEditor(trigger) {
  const block = el('div', { className: 'detail-block' });
  block.appendChild(el('div', { className: 'block-title', textContent: 'Fire with payload' }));

  const wrap = el('div', { className: 'payload-editor' });
  const recent = getRecentPayloads(trigger.name);
  const ta = el('textarea', { spellcheck: false, autocomplete: 'off', value: recent[0] || '{\n  \n}' });
  wrap.appendChild(ta);

  const actions = el('div', { className: 'payload-actions' });
  const fireBtn = el('button', {
    className: 'btn primary',
    textContent: 'Fire',
    disabled: trigger.status === 'disabled',
    onclick: async () => {
      let payload;
      try { payload = JSON.parse(ta.value); }
      catch (err) { showToast('Invalid JSON: ' + err.message, 'err'); return; }
      if (typeof payload !== 'object' || payload == null || Array.isArray(payload)) {
        showToast('Payload must be a JSON object', 'err'); return;
      }
      savePayloadToRecent(trigger.name, ta.value);
      await fireTrigger(trigger.name, payload);
    },
  });
  actions.appendChild(fireBtn);
  actions.appendChild(el('span', { className: 'hint', textContent: '⌘↵ to fire' }));
  wrap.appendChild(actions);

  if (recent.length > 0) {
    const row = el('div', { className: 'recent-row' }, [el('span', { textContent: 'Recent:' })]);
    for (let i = 0; i < Math.min(5, recent.length); i++) {
      row.appendChild(el('span', {
        className: 'pill',
        textContent: recent[i].replace(/\s+/g, ' ').slice(0, 40),
        title: recent[i],
        onclick: () => { ta.value = recent[i]; ta.focus(); },
      }));
    }
    wrap.appendChild(row);
  }

  ta.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); fireBtn.click(); }
  });

  block.appendChild(wrap);
  return block;
}

function recentPayloadsKey(triggerName) { return 'dispatch-panel-recent-payloads:' + triggerName; }
function getRecentPayloads(triggerName) {
  try {
    const raw = localStorage.getItem(recentPayloadsKey(triggerName));
    if (!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr.slice(0, 10) : [];
  } catch { return []; }
}
function savePayloadToRecent(triggerName, text) {
  const key = recentPayloadsKey(triggerName);
  const existing = getRecentPayloads(triggerName).filter(p => p !== text);
  existing.unshift(text);
  try { localStorage.setItem(key, JSON.stringify(existing.slice(0, 10))); } catch {}
}

/* ============================================================
   Run detail — the whole panel, one run
   ============================================================ */

/* What a repaint of the transcript would actually change. The panel polls every
   3s and re-renders the open view; without this, an expanded tool call would
   snap shut every three seconds and any text selection would be lost. */
function runSignature(run) {
  return [
    run.run_id, run.status,
    (run.tool_calls || []).length,
    (run.text_output || '').length,
    run.error || '',
  ].join('|');
}
let paintedRunSig = null;

/** A session id the history page link may carry as a path segment. */
const SESSION_ID_SAFE = /^[A-Za-z0-9._-]{1,128}$/;

/**
 * The history page's transcript of this run's session, or null.
 *
 * The page lives on its own origin; the dispatcher is handed its URL at
 * deploy time only when the deployment serves it. A run's session belongs to
 * the person who asked for the run, so the page shows its thinking, folded, to
 * that person and to `history: all` viewers, which is what the link's label
 * says. The run detail itself shows no thinking.
 */
function historyUrlForRun(run) {
  const base = (window.__OSPREY_CONFIG__ && window.__OSPREY_CONFIG__.history_url) || '';
  const sid = run && run.session_id;
  if (!base || !sid || !SESSION_ID_SAFE.test(sid)) return null;
  return base + 'session/' + encodeURIComponent(sid);
}

function renderRunDetail() {
  const host = $('#run-detail');
  const run = (state.runs || []).find(r => r.run_id === view.runId);
  if (!run) {
    host.textContent = '';
    paintedRunSig = null;
    host.appendChild(el('div', { className: 'empty-state', textContent: 'That run is no longer in the recent history.' }));
    return;
  }

  const existing = document.getElementById('run-transcript');
  // The stream owns the transcript while it is open: repainting from the
  // polled snapshot mid-stream would duplicate text the stream has already
  // appended. Otherwise repaint only when the content really changed.
  const keepTranscript = existing && (
    streamRunId === run.run_id || runSignature(run) === paintedRunSig
  );
  const preserved = keepTranscript ? existing : null;
  if (preserved) preserved.remove();

  host.textContent = '';

  const head = el('div', { className: 'detail-head' });
  head.appendChild(el('span', {
    className: 'detail-title',
    textContent: (run.trigger_name || 'Manual run') + ' · ' + truncId(run.run_id),
  }));

  const actions = el('div', { className: 'detail-actions' });
  if (run.status === 'pending') {
    actions.appendChild(el('button', {
      className: 'btn danger',
      textContent: '✕ Cancel',
      title: 'Cancel is usually <1s; may take a few seconds if a tool call is in flight.',
      onclick: () => cancelRun(run.run_id),
    }));
  } else if (run.trigger_name) {
    actions.appendChild(el('button', {
      className: 'btn',
      textContent: '↻ Re-fire',
      title: 'Dispatch this trigger again with an empty payload.',
      onclick: () => fireTrigger(run.trigger_name, {}, run.run_id),
    }));
  }

  // Cross-links out of the run. Each renders only when its destination is real,
  // so a link never leads somewhere empty: the trigger must still be registered
  // — `trigger_name` is reverse-mapped from the dispatcher's in-memory pool, so
  // it is absent for runs that outlived a dispatcher restart, and the trigger
  // itself may since have been removed from triggers.yml.
  const linkedTrigger = run.trigger_name
    && (state.triggers || []).some(t => t.name === run.trigger_name);
  if (linkedTrigger) {
    actions.appendChild(el('button', {
      className: 'btn',
      textContent: '⌁ View trigger',
      title: 'Open the trigger that started this run.',
      onclick: () => navigate({ name: 'trigger', triggerName: run.trigger_name }),
    }));
  }

  const historyUrl = historyUrlForRun(run);
  if (historyUrl) {
    // A real anchor, not a scripted button: middle-click and "open in new tab"
    // work, and the dashboard is embedded in an iframe in the web terminal, so
    // navigating in place would strand the operator inside it.
    actions.appendChild(el('a', {
      className: 'btn',
      href: historyUrl,
      target: '_blank',
      rel: 'noopener noreferrer',
      textContent: 'history (thinking: the asker and history: all)',
      title: "Open this run's session on the history page. Its thinking shows there, "
        + 'folded, to the person who asked for the run and to history: all viewers.',
    }));
  }

  head.appendChild(actions);
  host.appendChild(head);

  const bits = [];
  const dur = formatDuration(run.duration_sec);
  if (dur) bits.push((run.status === 'error' ? 'Failed after ' : run.status === 'pending' ? 'Running for ' : 'Finished in ') + dur);
  if (run.num_turns != null) bits.push(plural(run.num_turns, 'turn'));
  if (run.tool_count) bits.push(plural(run.tool_count, 'tool'));
  if (run.owner) bits.push('fired by ' + run.owner);
  bits.push(formatAge(run.age_sec));
  host.appendChild(el('div', { className: 'detail-summary', textContent: bits.filter(Boolean).join(' · ') }));

  const transcript = preserved || el('div', { className: 'transcript', id: 'run-transcript' });
  host.appendChild(transcript);
  if (!preserved) {
    paintTranscript(transcript, run);
    paintedRunSig = runSignature(run);
  }

  // A live run streams into the view that is showing it, and only that view.
  if (run.status === 'pending' && run.has_stream && streamRunId !== run.run_id) {
    openStream(run.run_id, transcript);
  }
}

/** Paint the stored (polled) content of a run. Live deltas append on top. */
function paintTranscript(container, run) {
  container.textContent = '';
  if (run.error) container.appendChild(el('div', { className: 'event event-error', textContent: '✘ ' + run.error }));
  for (const c of (run.tool_calls || [])) container.appendChild(renderToolCall(c));
  if (run.text_output) container.appendChild(el('div', { className: 'event event-text', textContent: run.text_output }));
  if (!run.error && !run.text_output && !(run.tool_calls || []).length) {
    container.appendChild(el('div', {
      className: 'empty-state',
      textContent: run.status === 'pending' ? 'Waiting for the first output…' : 'This run produced no output.',
    }));
  }
}

function renderToolCall(c) {
  const inputStr = prettyJson(c.input);
  // The collapsed header needs a one-line gist of the arguments. Taking the
  // first line of the pretty-printed form yields a bare "{" for every object,
  // so compact the JSON instead — "{"file_path":"/data/orbit.csv"}" tells you
  // what the call did without expanding it.
  const headArgs = (() => {
    try { return JSON.stringify(c.input) ?? ''; }
    catch { return inputStr.replace(/\s+/g, ' '); }
  })().slice(0, 90);

  const wrap = el('div', { className: 'tool-call' });
  const head = el('div', { className: 'tool-head', onclick: () => { wrap.classList.toggle('open'); } });
  head.appendChild(el('span', { className: 'chev', textContent: '▸' }));
  head.appendChild(el('span', { className: 'tool-name', textContent: c.name || '<tool>' }));
  head.appendChild(el('span', { className: 'tool-args', textContent: headArgs }));
  wrap.appendChild(head);

  const body = el('div', { className: 'tool-body' });
  body.appendChild(renderJsonSection('Input', inputStr));
  if (c.result != null) {
    const resultStr = typeof c.result === 'string' ? c.result : prettyJson(c.result);
    body.appendChild(renderJsonSection('Result', resultStr));
  } else {
    body.appendChild(el('div', { className: 'run-when', textContent: 'No result yet' }));
  }
  wrap.appendChild(body);
  return wrap;
}

function renderJsonSection(label, text) {
  const section = el('div', {});
  const lab = el('div', { className: 'tool-section-label' });
  lab.appendChild(el('span', { textContent: label }));
  lab.appendChild(el('span', {
    className: 'copy-btn',
    textContent: 'Copy',
    onclick: async () => {
      try { await navigator.clipboard.writeText(text); showToast('Copied', 'ok'); }
      catch { showToast('Copy failed', 'err'); }
    },
  }));
  section.appendChild(lab);
  section.appendChild(buildJsonView(text));
  return section;
}

/* ============================================================
   Streaming — exactly one, owned by the open run detail
   ============================================================ */

function openStream(runId, container) {
  closeStream();
  streamRunId = runId;
  streamParts = { text: [], toolCalls: [] };
  // EventSource cannot set an Authorization header. In the in-terminal EVENTS
  // tab the web-terminal proxy injects the bearer server-side so the stream is
  // authorized. A direct standalone browser cannot authenticate the stream (we
  // intentionally do NOT pass the token in the URL); onerror closes it and the
  // run is still visible via the polled state. No token is ever placed in the URL.
  stream = new EventSource('/dashboard/stream/' + runId);
  stream.onmessage = (e) => {
    try { handleStreamEvent(container, JSON.parse(e.data)); } catch {}
  };
  // Run streams are one-shot; closing prevents EventSource's auto-reconnect
  // from pounding the sidecar with 410s once the run has finished.
  stream.onerror = () => closeStream();
}

function closeStream() {
  if (stream) { stream.close(); stream = null; }
  streamRunId = null;
}

/** Within a hair of the bottom — i.e. the reader is following the stream. */
function isPinnedToBottom(scroller) {
  return scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 120;
}

function handleStreamEvent(container, event) {
  // A stream whose detail view has been navigated away from is stale.
  if (view.name !== 'run' || view.runId !== streamRunId) { closeStream(); return; }
  // Decide BEFORE mutating: appending changes scrollHeight, so a check made
  // afterwards would read as "not at the bottom" for a reader who was.
  const scroller = $('#main');
  const follow = isPinnedToBottom(scroller);
  const empty = container.querySelector('.empty-state');
  if (empty) empty.remove();

  if (event.type === 'text') {
    streamParts.text.push(event.content);
    let tx = container.querySelector('.event-text.live-text');
    if (!tx) { tx = el('div', { className: 'event event-text live-text' }); container.appendChild(tx); }
    tx.textContent = streamParts.text.join('');
  } else if (event.type === 'tool_start') {
    const call = { name: event.name, input: event.input, result: null };
    streamParts.toolCalls.push(call);
    container.appendChild(renderToolCall(call));
  } else if (event.type === 'tool_result') {
    const last = streamParts.toolCalls[streamParts.toolCalls.length - 1];
    if (last) last.result = event.result;
    const calls = container.querySelectorAll('.tool-call');
    const wrap = calls[calls.length - 1];
    if (wrap && last) {
      const fresh = renderToolCall(last);
      fresh.classList.toggle('open', wrap.classList.contains('open'));
      wrap.replaceWith(fresh);
    }
  } else if (event.type === 'error') {
    container.appendChild(el('div', { className: 'event event-error', textContent: '✘ ' + event.message }));
    closeStream();
  } else if (event.type === 'done') {
    container.appendChild(el('div', { className: 'event event-done', textContent: '✔ Done' }));
    closeStream();
  }
  // Only chase the tail for a reader who was already following it; yanking a
  // scrolled-back reader forward on every token makes the run unreadable.
  if (follow) scroller.scrollTop = scroller.scrollHeight;
}

/* ============================================================
   Actions
   ============================================================ */

async function fireTrigger(name, payload, fromRunId = null) {
  try {
    const body = { payload: payload || {} };
    if (fromRunId) body.dispatch_id = fromRunId;
    const res = await apiPost(`/retry/${encodeURIComponent(name)}`, body, bearer());
    if (res.ok) {
      showToast(`Fired ${name}${fromRunId ? ' (re-fire)' : ''}`, 'ok');
      setTimeout(fetchState, 300);
    } else if (!explainIfUnauthorized(res)) {
      showToast(`Fire failed: ${res.data?.detail || res.status}`, 'err');
    }
  } catch (e) {
    showToast('Fire error: ' + e.message, 'err');
  }
}

async function cancelRun(runId) {
  try {
    const res = await apiPost(`/dashboard/cancel/${encodeURIComponent(runId)}`, null, bearer());
    if (res.ok) {
      showToast(res.data?.cancelled ? `Cancel requested for ${truncId(runId)}` : 'Already finished', res.data?.cancelled ? 'ok' : '');
      setTimeout(fetchState, 500);
    } else if (!explainIfUnauthorized(res)) {
      showToast(`Cancel failed: ${res.data?.detail || res.status}`, 'err');
    }
  } catch (e) {
    showToast('Cancel error: ' + e.message, 'err');
  }
}

async function toggleTrigger(name, currentStatus) {
  const next = currentStatus === 'disabled' ? 'active' : 'disabled';
  try {
    const res = await apiPut(`/trigger/${encodeURIComponent(name)}/status`, { status: next }, bearer());
    if (res.ok) {
      showToast(`${name} ${next === 'disabled' ? 'disabled' : 'enabled'}`, 'ok');
      fetchState();
    } else if (!explainIfUnauthorized(res)) {
      showToast(`Status change failed: ${res.data?.detail || res.status}`, 'err');
    }
  } catch (e) {
    showToast('Status error: ' + e.message, 'err');
  }
}

/* ============================================================
   Render + wiring
   ============================================================ */

function render() {
  renderNotice();
  syncToolbar();
  publishHeader();
  if (renderPanelState()) return;
  if (view.name === 'activity') { renderLanes(); renderRunList(); }
  else if (view.name === 'triggers') renderTriggerList();
  else if (view.name === 'trigger') renderTriggerDetail();
  else if (view.name === 'run') renderRunDetail();
}

function wire() {
  for (const btn of document.querySelectorAll('#view-seg > button')) {
    btn.addEventListener('click', () => navigate({ name: btn.dataset.view }));
  }

  for (const btn of document.querySelectorAll('#timeline-window > button')) {
    btn.addEventListener('click', () => {
      filters.timelineHours = parseFloat(btn.dataset.hours);
      syncToolbar();
      saveUrl();
      publishHeader();
      fetchState();
    });
  }

  for (const btn of document.querySelectorAll('#status-filter > button')) {
    btn.addEventListener('click', () => {
      filters.status = btn.dataset.status || '';
      applyRunFilters();
    });
  }

  const search = $('#search');
  search.addEventListener('input', () => {
    // The list the operator typed into, even if the view changes before the debounce ends.
    const target = view.name;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      if (target === 'triggers') {
        filters.triggerQuery = search.value;
        renderTriggerList();
        publishHeader();
      } else if (target === 'activity') {
        filters.search = search.value;
        applyRunFilters();
      }
    }, 180);
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
      e.preventDefault();
      // A detail screen has no list to search: go back to the list it came from.
      if (view.name === 'run') navigate({ name: 'activity' });
      else if (view.name === 'trigger') navigate({ name: 'triggers' });
      search.focus();
    }
  });
}

function init() {
  loadUrl();
  hydrateIcons();
  wire();
  navigate(view, { push: false });
  startPolling();

  // ⋯ › This panel › Clear filters arrives as ('events', 'clear-filters'). The
  // publish here covers the ordinary case where navigate() above ran before
  // the helpers landed; re-publishing when they were already in hand is free,
  // since a contribution is an idempotent replace.
  headerContribReady.then(() => {
    if (!headerContrib) return;
    headerContrib.onHeaderAction((id, value) => {
      if (id === 'events' && value === 'clear-filters') clearFilters();
    });
    publishHeader();
  });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
</body>
</html>
