[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orbit-bump"
version = "0.1.0"
description = "An OSPREY example application: plan, preview and apply a closed local orbit bump."
requires-python = ">=3.11"
# The framework, FastAPI and uvicorn are already in the image; numpy is the one it adds.
dependencies = ["numpy"]

[tool.hatch.build.targets.wheel]
packages = ["orbit_bump"]

# The panel and the skill sit beside the package in the source tree and inside it in the wheel.
[tool.hatch.build.targets.wheel.force-include]
panel = "orbit_bump/panel"
skills = "orbit_bump/skills"
