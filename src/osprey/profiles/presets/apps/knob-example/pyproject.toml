[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knob-example"
version = "0.1.0"
description = "A small complete OSPREY application: one panel, one read tool, one write tool."
requires-python = ">=3.11"
# Everything it imports is already in the image: the framework and its dependencies.
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["knob_example"]

# The panel sits beside the package in the source tree and inside it in the wheel.
[tool.hatch.build.targets.wheel.force-include]
panel = "knob_example/panel"
