# admin.yml
# Admin tier: the deployment-editing access level of the deployment's own agent.
#
# A tier is not a second agent. It is a small delta the build lays over the
# deployment's own profile: lists here are added by name to the deployment's
# lists, config keys here win over the deployment's. A tier never subtracts and
# never carries a deployment fact (services, data, ports); those stay the
# deployment's, and every tier's render dials the deployment's services.
#
# The other tiers differ on what they may do to the MACHINE. This one differs
# on what it may do to the DEPLOYMENT: it is the single tier that can change
# the configuration the other tiers run under. The deployment's profile takes
# three privileges away from every tier: the `setup_patch` tool, the web
# Config panel, and writes to the scaffold gallery. This file is the one place
# they are lifted back, by name.
#
# Lifting the deny does not make the tool unsupervised. `setup_patch` sits in
# the rendered settings.json `ask` list and is matched by the osprey_approval
# PreToolUse hook, so every edit still stops for a human. The tier difference is
# whether the path exists at all, not whether it is watched.
#
# One consequence is a filesystem fact rather than a permission list: because
# this render is setup-patch capable, its image hands `build/config.yml` to the
# agent's user (Dockerfile.j2). No other tier's image does, so no other tier can
# write the file that says what it may do.
#
# The control-system tiers are `readonly` and `readwrite`.

name: Control Assistant (Admin)

# The write-oriented panels, exactly as the readwrite tier declares them: the
# admin tier is a full operator desk plus deployment editing, never an operator
# desk minus. Added by name to the deployment's builtin set. Each tab's URL,
# path and label are not spelled here: the deployment's build derives them when
# it injects the event dispatcher and the bluesky-web sidecar, and this tier's
# render is told them from the deployment's render (the Reach Contract,
# `osprey.deployment.reach`).
web_panels:
  - events          # EVENTS dashboard tab (event dispatcher)
  - bluesky         # Plan authoring, the plan queue, and the run's live results

# The guided configuration workflow, left out of the deployment's own
# selection on purpose because it edits config.yml and .mcp.json. Added by name
# to the deployment's skills.
skills:
  - setup-mode      # Inspect the deployment's configuration and patch it

# ── Config overrides ─────────────────────────────────────────────────────────
# Dotted keys ONLY, as in the deployment's own config: block.
config:
  # The top of `never`, `asked` and `allowed`, one above readwrite's `asked`;
  # each machine's write is still decided by the login's own switch.
  # What makes this the admin tier is the deployment-editing block below, not a
  # wider write surface.
  control_system.writes: allowed
  # The axis this tier is defined by: the three privileges the deployment
  # floors, all lifted here and nowhere else.
  #
  # The deployment-editing tool. `remove_deny` subtracts the deployment's deny
  # for this render alone, the direction a floor has to be lifted in, since
  # string lists only ever union. What is left is the `ask` entry the workspace
  # server declares, which routes the call through the approval hook.
  claude_code.permissions.remove_deny:
    - mcp__osprey_workspace__setup_patch
  # The same capability from the browser: the web Config panel edits the
  # running deployment's configuration.
  web.config_panel.enabled: true
  # The gallery is readable at every tier; this turns its edit, create and
  # delete surfaces back on. Its contents are shared deployment state, which is
  # exactly what this tier is for.
  web.scaffold_gallery.write_enabled: true
