# readwrite.yml
# Read-write tier: the operations access level of the deployment's own agent.
#
# A tier is not a second agent. It is a small delta the build lays over the
# deployment's own profile: lists here are added by name to the deployment's
# lists, config keys here win over the deployment's. A tier never subtracts and
# never carries a deployment fact (services, data, ports); those stay the
# deployment's, and every tier's render dials the deployment's services.
#
# This tier allows writes: `control_system.writes: allowed` lets a session
# write to every machine the deployment configures. Whether the next write
# goes through is each login's own write switch for that machine, set from the
# web terminal's control-target chip, so the build arms nothing by itself.
#
# Armed does NOT mean unguarded: every channel write still passes the
# writes-check hook, per-channel min/max limits, and the mandatory human
# approval prompt before the connector executes it. The tier difference is
# whether the write path exists at all, not whether it is supervised.
#
# The read-only counterpart is the `readonly` tier. The `admin` tier carries
# this same posture plus deployment editing.

name: Control Assistant (Read-Write)

# The write-oriented panels, added by name to the deployment's builtin set.
# Each tab's URL, path and label are not spelled here: the deployment's build
# derives them when it injects the event dispatcher and the bluesky-web
# sidecar, and this tier's render is told them from the deployment's render
# (the Reach Contract, `osprey.deployment.reach`), so a sidecar moved in the
# deployment's profile moves the tab with it.
web_panels:
  - events          # EVENTS dashboard tab (event dispatcher)
  - bluesky         # Plan authoring, the plan queue, and the run's live results

# ── Config overrides ─────────────────────────────────────────────────────────
# Dotted keys ONLY, as in the deployment's own config: block.
config:
  # The tier boundary, pinned rather than left to the deployment's root, so
  # a root that says `never` does not take this tier's writes away.
  control_system.writes: allowed
  # Full split-pane terminal + workspace layout for the write-armed operator.
  # Pinned on both sides of the tier boundary (readonly pins `simple`) rather
  # than left to the server default, for the same reason control_system.writes is.
  web.ui_mode: expert
