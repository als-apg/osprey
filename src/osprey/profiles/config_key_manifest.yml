# ---------------------------------------------------------------------------
# orphan_sites — per deleted key, regexes for its removed code sites. Every
# regex here must match ZERO times under the listed root (failure mode 4).
# ---------------------------------------------------------------------------
orphan_sites:
  approval.tools.channel_limits:
  - root: src/osprey/templates
    regex: '^\s+channel_limits:\s'
    back_test: {base_matches: 3, branch_matches: 0}
    why: >-
      the deleted approval policy entry. The removed sites were UNQUOTED YAML
      mapping keys in the templates, so the earlier quoted-key regex could
      never fire — it matched 0 even at merge-base. Anchored to the YAML
      mapping-key form and rooted at templates, which also keeps the
      LimitsValidator, channel_limits.json and the osprey_limits hook (all
      legitimate bare-word users) out of scope.
  file_paths.user_memory_dir:
  - root: src/osprey
    regex: 'user_memory_dir'
    why: compose_generator mkdir list, scaffolding mkdir/README, Dockerfile.j2, config.py docstring
  file_paths.execution_plans_dir:
  - root: src/osprey
    regex: 'execution_plans_dir'
    why: compose mkdir list + docstring
  file_paths.prompts_dir:
  - root: src/osprey
    regex: 'prompts_dir'
    why: compose mkdir list + docstring
  workspace.base_dir:
  - root: src/osprey/interfaces/web_terminal/routes
    regex: '^\s*"workspace",'
    why: >-
      the "workspace" entry in config.py `_AGENT_CONFIG_SECTIONS`. Anchored to
      the list-item form so the many legitimate uses of the word (the
      osprey_workspace MCP server, utils/workspace.py) do not trip it.
  ariel.reasoning:
  - root: src/osprey
    regex: 'ReasoningConfig|reasoning_config'
    why: deleted config class/field/parse + capabilities() echo
  ariel.default_max_results:
  - root: src/osprey
    regex: 'default_max_results'
    why: ARIELConfig field + capabilities payload
  ariel.cache_embeddings:
  - root: src/osprey
    regex: 'cache_embeddings'
    why: deleted field/parse/assertions
  channel_finder.explicit_validation_mode:
  - root: src/osprey
    regex: 'explicit_validation_mode'
    why: deleted from 2 templates + propagated copy
  channel_finder.pipelines.hierarchical.tree_preview:
  - root: src/osprey/templates
    regex: '^\s+tree_preview:\s*$'
    back_test: {base_matches: 2, branch_matches: 0}
    why: >-
      the deleted CONFIG BLOCK only, which was a bare YAML block header. The
      earlier dict/quoted-key regex matched 0 even at merge-base. Rooted at
      templates so the kept, tested `generate_tree_preview` utility stays out
      of scope.
  channel_finder.pipelines.in_context.processing:
  - root: src/osprey
    regex: 'chunk_dictionary|max_correction_iterations'
    why: >-
      the deleted processing block's own leaf names — `processing` alone is
      far too common to anchor on.
  channel_finder.benchmark.execution:
  - root: src/osprey
    regex: 'runs_per_query.*delay_between_runs|continue_on_error'
    why: deleted benchmark execution block leaves
  channel_finder.benchmark.output:
  - root: src/osprey
    regex: 'save_incremental|include_detailed_metrics'
    why: deleted benchmark output block leaves
  channel_finder.benchmark.evaluation:
  - root: src/osprey
    regex: 'exact_match_weight|partial_match_weight'
    why: deleted benchmark evaluation block leaves
  machine_state:
    # The deleted services/machine_state module has NO content-grep site: it had
    # zero importers, so nothing anywhere ever spelled its import path. A regex
    # for it could not fire even at merge-base. Its deletion is asserted by
    # path ABSENCE below (the mirror of `keeps`), not by grep.
  - root: src/osprey/templates
    regex: '^machine_state:'
    back_test: {base_matches: 1, branch_matches: 0}
    why: the deleted top-level config block in the templates — a genuine, fireable site
  api.providers.ollama.host:
  - root: src/osprey/templates
      # Anchored on the base_url line that preceded it, not on `host: localhost`
      # alone. Bare, it claimed every indented `host: localhost` in every
      # template — so the first unrelated block to use that ordinary default
      # (the archiver's stored-connection block) read as the deleted ollama key
      # coming back. An orphan regex has to name the site it is proving gone.
    regex: '\$\{OLLAMA_HOST[^\n]*\n\s+host:\s*localhost'
    why: the deleted ollama host/port pair (replaced by a single base_url)
  api.providers.ollama.port:
  - root: src/osprey/templates
    regex: '^\s+port:\s*11434'
    why: the deleted ollama port line
  applications:
    # `root` may be a LIST: the config loader moved to the osprey-connectors
    # workspace member, so src/osprey/utils/config.py is a shim this regex can
    # never match. Both trees are scanned; the back-test sums hits across the
