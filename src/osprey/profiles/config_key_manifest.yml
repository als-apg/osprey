    back_test: {base_matches: 2, branch_matches: 0, engine: 'python re.M over whole-file text'}
    why: >-
      the connector-level timeout that sat outside any connector type. The
      pattern SPANS TWO LINES, so a line-based engine (grep, or a per-line
      Python loop) finds 0 matches at merge-base as well as now — a check that
      cannot fail. `multiline: true` obliges the guard to read the whole file
      and match with re.M; see scan_rules.multiline_entries.
  facility_name:
  - root: src/osprey/templates
    regex: '^facility_name:'
    why: >-
      the retired top-level spelling, now migrated to the canonical
      `facility:` block in every template. The READER fallback in
      utils/facility.py is deliberate and must NOT be removed — this regex is
      scoped to templates only for exactly that reason.

# ---------------------------------------------------------------------------
# render_contexts — the matrix the guard renders every template under, then
# UNIONS the walked key sets. Jinja conditionals gate audited blocks, so a
# single context would under-report.
# ---------------------------------------------------------------------------
render_contexts:
  undefined: ChainableUndefined
  note: >-
    StrictUndefined fails on project_root and the panel machinery, so
    ChainableUndefined is required for one context to serve every matrix cell.
  what_the_union_is: >-
    Two sources, because a rendered config now has two authors. The FRAMEWORK
    TEMPLATE writes what the build derives — the project layout, the port
    layout, api.providers from providers.yml, and the keys a profile FIELD
    decides — and is rendered once per matrix cell below. Each PRESET's
    resolved `config:` block is the other half, and it is read through the real
    resolver (resolve_build_profile + _expand_dotted) rather than parsed out of
    the file, so personas, `extends:` and every legal dotted/nested spelling are
    resolved the way a build resolves them. layout_port_fill is applied to each
    preset for the same reason the build applies it: a preset deliberately
    spells no host port, and without the fill every `services.*` port key would
    read as manifest rot.
  base:
    project_name: demo
    project_root: /tmp/demo
    default_provider: anthropic
    default_model: haiku
    environment_python: null
    environment_packages: []
    environment_inherit_exclude: []
  note_computed_context: >-
    osprey_ports, builtin_panels and provider_catalog are NOT spelled here. Each
    has exactly one home in the tree — the port layout, the panel registry and
    providers.yml — and a copy in this file would be the silent one the day they
    diverge. The guard fills them in.
  matrix:
    # The framework template's remaining branches, and nothing else: it renders
    # no services, no deployed_services and no per-app blocks any more.
    channel_finder_mode: [in_context, hierarchical, middle_layer]
    ariel_server_on: [true, false]
    web_selection:
    - panels: all          # every builtin the registry declares
      default_panel: ariel
      panel_presets: {Operations: [ariel, channel-finder]}
    - panels: []
      default_panel: null
      panel_presets: null
  framework_template: src/osprey/templates/project/config.yml.j2
  presets:
  - src/osprey/profiles/presets/hello-world.yml
  - src/osprey/profiles/presets/ariel-standalone.yml
  - src/osprey/profiles/presets/channel-finder-standalone.yml
  - src/osprey/profiles/presets/control-assistant.yml
  note_presets: >-
    The four ROOT presets. The persona presets (control-assistant-*.yml) extend
    control-assistant and are deliberately absent: they are deltas, so every key
    they carry is either inherited from the root — already in the union — or a
    persona-scoped override of one, and listing them would make `all-templates`
    parity a claim about deltas instead of about the four documents an operator
    starts from.
  # Guard self-test: one key from inside each conditional branch must appear in
  # the union, otherwise the matrix has silently stopped covering that branch.
  # Re-mapped when the app templates were deleted — the branches these name are
  # the framework template's own. What makes each one discriminating is that the
  # framework template is its ONLY author: a key a preset also spelled would stay
  # in the union after the matrix stopped rendering its branch, and the check
  # would pass on the preset's copy. Six are DERIVED keys, which is the usual
  # reason no preset can supply one; `web.panels.channel-finder.enabled` is not
  # derived and is framework-only for a different reason — the template renders
  # every builtin panel's block from the registry. So the GUARD checks the exact
  # source set per key rather than the derived prefix: a key a preset also spells
  # is refused here, because it could not detect the shrunk matrix.
  self_test_keys:
    enable_in_context: channel_finder.pipelines.in_context.subagent_model
    enable_hierarchical: channel_finder.pipelines.hierarchical.feedback.store_path
    enable_middle_layer: channel_finder.pipelines.middle_layer.database.type
    ariel_server_on: ariel.enhancement_modules.semantic_processor.model.model_id
    panels_on: web.panels.channel-finder.enabled
    default_panel_set: web.default_panel
    panel_presets_set: web.presets
  expected_union_size: 357
  note_union_size: >-
    Informational, not an assertion — it moves whenever the framework template
    or a preset gains or loses a key, and the guard reports a diff against it
    rather than failing on it. Because it cannot fail, it is a signal only while
    it is re-derived whenever a source's key set changes: a counter left behind
    reads as an agreement it has not earned.

    Re-derive it by running the guard and recording the number it reports, never
    by adding an expected delta to the number already written here. The union is
    taken over the rendered sources, so a change in what those sources are moves
    it by an amount arithmetic on the previous figure cannot predict.

# ---------------------------------------------------------------------------
# governed_sets — ADDENDUM 2. Two safety stanzas make EXHAUSTIVE claims that no
# test protects. The guard must build each preset's config, run
# osprey.registry.mcp.resolve_servers, collect every tool whose PreToolUse
# matcher runs osprey_approval.py, and assert set equality with the enumeration
# below. A future default-enabled server carrying an approval hook then turns
# the guard red instead of silently falsifying the shipped comment.
# ---------------------------------------------------------------------------
governed_sets:
  method:
    description: >-
      Build the preset's config the way `osprey build` does — the framework
      template rendered from the preset's own FIELDS, with its resolved
      `config:` block merged over the top — then pass the `claude_code` section
      to resolve_servers with a ctx carrying channel_finder_pipeline when the
      config has a channel_finder section. For every ENABLED server, walk
      hooks_pre; a rule counts when any of its hooks' `command` contains
      osprey_approval.py. Extract the tool short-name from each matcher.
      The framework render is not optional here: pipeline_mode is a DERIVED key,
      so reading the `config:` block alone would resolve every preset's servers
      against a pipeline mode of None.
    matcher_shape: 'mcp__<server>__<tool>'
    matcher_parse_warning: >-
      Matchers are SINGLE tokens and underscores are word characters, so a
      naive `[A-Za-z_][A-Za-z0-9_]*` findall returns the whole matcher as one
      token. Parse with `mcp__[A-Za-z0-9_-]+?__([A-Za-z0-9_]+)`. An extractor
      that returns an empty governed set for every template is broken, not a
      finding.
    approval_hook_marker: osprey_approval.py
  claims:
    ariel-standalone:
      preset: src/osprey/profiles/presets/ariel-standalone.yml
      comment_claim: 'here ARIEL `entry_create` and `entry_publish`, workspace `setup_patch`, `add_panel_to_rail`, `remove_panel_from_rail` and `register_panel`, and facility-knowledge `draft_concept`'
      exhaustive: true
      tools: [entry_create, entry_publish, setup_patch, add_panel_to_rail,
              remove_panel_from_rail, register_panel, draft_concept]
    channel-finder-standalone:
      preset: src/osprey/profiles/presets/channel-finder-standalone.yml
      comment_claim: 'in this deployment that is the workspace `setup_patch` tool plus the three panel-rail verbs `add_panel_to_rail`, `remove_panel_from_rail` and `register_panel`'
      exhaustive: true
      tools: [setup_patch, add_panel_to_rail, remove_panel_from_rail, register_panel]
  reference_counts:
    note: >-
      Not exhaustive claims in any shipped comment — recorded so a future
      change to the default-enabled server set is visible. Re-derived
      2026-08-27 with the method above: execute_file joined every set when the
      policy-unit rescue gave it the same approval hook as execute (they share
      one gate on the python server, so the pair moves together). Re-derived
      again over the PRESETS when the app templates were deleted: each set is
      now measured from what a build of that preset resolves. That is why
      control-assistant's is longer than the old control_assistant template's —
      the preset enables the bluesky server, whose seven queue/plan tools carry
      the same approval hook and were never in a template's render.
      entry_publish joined every set that already carried entry_create when the
      ariel server gave it the same approval hook.
      add_panel_to_rail, remove_panel_from_rail and register_panel joined every
      set when the workspace server gave the panel-rail verbs the same approval
      hook: the rail is what the next operator sees, so changing it asks first.
    control-assistant: [add_panel_to_rail, archiver_read, channel_read, channel_write, control_target_set, draft_concept, entry_create, entry_publish, execute, execute_file, queue_add, queue_remove, queue_start, queue_stop, register_panel, remove_panel_from_rail, setup_patch, stop_run, validate_plan, write_plan]
    hello-world: [add_panel_to_rail, archiver_read, channel_read, channel_write, control_target_set, draft_concept, execute, execute_file, register_panel, remove_panel_from_rail, setup_patch]
  draft_concept_note: >-
    draft_concept is approval-governed in control-assistant and hello-world
    (osprey_facility_knowledge is enabled by default and carries the hook) but
    appears in NO approval.tools block, so it falls to
    default_policy: always. Fail-closed and correctly described by the shipped
    comment. This is the reason the governed set is larger than the
    approval.tools LIST in every preset — do not "fix" one to match the other.
    control_target_set is governed the same way and for the same reason: the
    controls server carries the approval hook on it, and it appears in no
    approval.tools block, so it too falls to default_policy. execute_file is
    the third of this kind: it shares execute's policy unit (same server, same
    hooks) but no approval.tools block names it.
  rail_tools_note: >-
    add_panel_to_rail, remove_panel_from_rail and register_panel are governed
    wherever the workspace server runs, which is every preset. Three presets —
    ariel-standalone, hello-world and control-assistant, whose six `extends`
    children inherit the lines — spell `always` for each of them, so the
    shipped policy is explicit there. channel-finder-standalone deliberately
    ships no approval.tools block at all, so its rail verbs fall to
    default_policy: always, the same fail-closed route draft_concept and
    control_target_set take. Same outcome, stated in a different place: do not
    "fix" the missing keys, and do not read their absence as the rail being
    ungated.

# ---------------------------------------------------------------------------
# kept_readers — code that legitimately still mentions a DELETED key. These are
# deliberate legacy-tolerance paths, not orphans. A guard that greps deleted key
# names across src/ without this exclusion list goes red against intended code.
# ---------------------------------------------------------------------------
kept_readers:
  facility_name_reader:
    site: src/osprey/utils/facility.py
    covers: [facility_name]
    detail: >-
      resolve_facility_name still honours the retired top-level `facility_name`
      as a fallback so pre-consolidation configs keep working. The key is banned
      from TEMPLATES, not from readers — which is why that orphan regex is
      scoped to src/osprey/templates.
  tree_preview_util:
    site: src/osprey/services/channel_finder
    covers: [channel_finder.pipelines.hierarchical.tree_preview]
    detail: >-
      `generate_tree_preview` is a kept, tested utility. Only the CONFIG BLOCK
      was deleted, which is why that orphan regex anchors on the mapping-key
      form rather than the bare word.

# ---------------------------------------------------------------------------
# scan_rules — how the guard must walk the tree.
# ---------------------------------------------------------------------------
scan_rules:
  exclude_dirs: ['__pycache__', '.venv', 'node_modules', '.git', '.mypy_cache', '.pytest_cache', '.ruff_cache']
  regex_engine: >-
    EVERY regex in this file is written against LINE STARTS, because they were
    authored and verified with grep, which is inherently line-based. A Python
    implementation MUST therefore pass `re.M` on every match — not only on
    `multiline: true` entries. Without it, `^` anchors at the start of the whole
    file and every `^`-anchored regex silently reports 0 matches, manufacturing
    the exact cannot-fail class this manifest's back-test exists to detect. Cost
    of learning this: the first back-test implementation applied re.M only to
    flagged entries and reported 7 false cannot-fail failures, including two
    regexes that had already been hand-verified as matching at merge-base.
  multiline_entries: >-
    An entry carrying `multiline: true` additionally SPANS newlines, so it can
    never be matched by a line-based tool at all — the guard must read whole
    files for it. (With `re.M` + whole-file text, both kinds work uniformly.)
    Only `control_system.connector.timeout` needs this today.
  back_test_required: >-
    Every `orphan_sites` regex MUST be back-tested against the merge-base commit
    recorded in back_test_baseline: it has to match at least once THERE and zero
    times on the branch. A regex that matches 0 in both places proves nothing —
    it is a green light wired to nothing. Four of the original 22 were exactly
    that (see back_test_baseline.history). Entries carry their verified counts
    in a `back_test:` block; the guard should re-derive them rather than trust
    the recorded numbers.
  absence_is_git_tracked: >-
    An `absent_paths` entry is satisfied when the path has NO git-tracked files
    (`git ls-files <path>` is empty) — never by filesystem existence
    (`Path.exists()` / `os.path.isdir`). A deleted Python package leaves a
    populated `__pycache__/` behind in any working tree it was ever imported in,
    so a filesystem check goes red on developer worktrees while CI stays green.
    Measure the base side the same way, with `git ls-tree -r --name-only
    <commit> -- <path>`. This is the same stale-.pyc trap as
    `exclude_dirs`, reached from the other direction.
  back_test_baseline:
    commit: ccf324d7
    extraction: 'git show <commit>:<path>'
    history: >-
      Found by back-testing during task 7.1 review: channel_limits used a
      quoted-key regex where the real sites were unquoted YAML; tree_preview
      used a dict/quoted form where the real site was a bare block header;
      machine_state's services-module regex could never fire because the module
      had zero importers; connector.timeout's pattern is multiline. All four
      matched 0 at merge-base as well as on the branch.
  exclude_note: >-
    MUST exclude __pycache__. Compiled .pyc files retain the string constants of
    deleted modules, so a grep that counts them reports orphan sites that no
    longer exist in source — observed while authoring this manifest: the
    machine_state orphan regex appeared to match 3 times, entirely from stale
    .pyc artifacts, and 0 times in real source.
  test_tree: >-
    The guard scans src/osprey only. If it is ever pointed at tests/, the
    deliberate legacy fixture (see notes.legacy_fixture_out_of_scope) MUST be
    allowlisted first — it holds every deleted key on purpose.

# ---------------------------------------------------------------------------
# absent_paths — the mirror of `keeps`. Deletions whose only honest assertion is
# that a PATH no longer exists, because no content grep can ever fire for them.
# ---------------------------------------------------------------------------
absent_paths:
- path: src/osprey/services/machine_state
  assert: absent
  back_test:
    base_tracked_files: 3     # __init__.py, models.py, reader.py at ccf324d7
    branch_tracked_files: 0
  why: >-
    The module had ZERO importers, so no file anywhere ever spelled
    `from osprey.services.machine_state` or the module path. A content regex
    for it therefore matches 0 both before and after the deletion — it cannot
    distinguish success from failure. Path absence is the only assertion that
    actually tests this deletion. Note the deliberate asymmetry with
    `keeps`: the same ledger item both DELETES this module and KEEPS the
    control_assistant machine_state_channels.json asset, so the two
    sections guard opposite halves of one change.

# ---------------------------------------------------------------------------
# keeps — ADDENDUM 3. Assets whose CONTINUED EXISTENCE is load-bearing but
# which no grep gate protects, because the asset does not contain the string
# that would be searched for.
# ---------------------------------------------------------------------------
keeps:
- path: src/osprey/templates/apps/control_assistant/data/machine_state_channels.json
  assert: exists
  why: >-
    Feeds VA manifest reconciliation via
    services/virtual_accelerator/manifest/loaders.load_machine_state_candidate_addresses,
    surfacing as _metadata.machine_state_reconciliation. The machine_state
    DELETION's grep gate passes partly for the wrong reason: this file never
    contains the string `machine_state` in its CONTENT, only in its filename,
    so a content grep can never protect it. Today only
    tests/templates/test_machine_state_channels.py and tests/va/test_manifest.py
    fail on its deletion. An explicit existence assertion makes the dependency
    visible in the manifest rather than implicit in two test files.

# ---------------------------------------------------------------------------
# notes — carried forward from tasks 3.2, 5.1 and 6.3. Not guard rules.
# ---------------------------------------------------------------------------
notes:
  manifest_fixture_provider_shape:
    site: tests/cli/test_manifest_build_args.py
    detail: >-
      Carries 'anthropic/claude-opus' as fixture data. It never reaches the
      resolver, so it is harmless and was left alone. If cheap, the guard could
      flag provider/model-SHAPED default_model values (a '/' in a value that
      should be a bare tier: haiku | sonnet | opus), since claude_code.default_model
      takes a tier, not a wire id.
  prefix_rule_drift:
    detail: >-
      RESOLVED. The only place stating facility.prefix must be lowercase alnum
      plus hyphens, 2-6 chars, as a hard requirement was the facility-config
      schema reference, which has been removed along with the rest of the
      facility-config surface. Nothing enforces that rule and nothing claims it
      any more: the only validation in the tree is a non-emptiness lint at
      deployment/web_terminals/lint.py `_check_empty_facility_prefix`.
    inert: >-
      Stronger than unenforced. facility.prefix reaches only two container-name
      interpolations and the personas path — never an nginx location key or a
      URL segment, which is the specific reason usernames and persona names do
      get the charset regex. There is NO sink at which violating the
      2-6/lowercase rule breaks anything.
    remedy_direction: >-
      None. Do NOT add a validator, and do NOT let this manifest grow a charset
      rule for facility.prefix: a new check would reject configurations that
      work correctly today, converting a cosmetic doc inconsistency into a
      breaking change. The three presets that carry the key already describe it
      in prose, and none of them claims a charset or length rule.
  legacy_fixture_out_of_scope:
    path: tests/utils/fixtures/legacy_config_all_deleted_keys.yml
    detail: >-
      Deliberately holds every retired key so the loader's tolerance stays
      tested. If the guard is ever pointed at tests/, this file MUST be
      allowlisted or every `deleted` entry will fire on it.
  facility_timezone_unshipped:
    detail: >-
      facility.timezone is READ (deployment/web_terminals/env_production.py,
      deployment/web_terminals/render.py) but shipped by no preset, and is
      distinct from system.timezone. A hidden-key stanza candidate for phase 6,
      not a guard rule.
