id: https://narad.example.org/schema/osprey.facility.core
name: osprey.facility.core
title: Facility file
description: >-
  One facility, described once: its places, devices, channels and groups, the
  models that simulate it and how each model is wired to channels, the write
  limits and the scenarios. `osprey build` combines the sources under
  data/facility/ into one file of this shape. Every list whose order carries
  meaning sets `list_elements_ordered`; a multivalued slot without it is a set,
  compared and written sorted by its string form.

prefixes:
  osprey_facility: https://narad.example.org/schema/osprey.facility.core/
  linkml: https://w3id.org/linkml/

default_prefix: osprey_facility
default_range: string

imports:
  - linkml:types
  - vocabulary

enums:
  role_enum:
    description: What a program does with a channel.
    permissible_values:
      setpoint:
        description: Written by a program; read back through its `pair`.
      readback:
        description: Read only; the pair of at most one setpoint.
      none:
        description: Neither written nor paired.

  value_type_enum:
    description: The type of the value a channel carries.
    permissible_values:
      float:
      int:
      bool:
      enum:
      string:
      waveform:

  energy_scaling_enum:
    description: How a calibration scales with the reference energy.
    permissible_values:
      none:
      brho:

  place_from_enum:
    description: Where a device's `place` came from.
    permissible_values:
      span:
        description: No source stated one; the deepest span containing the device's s.
      authored:
        description: Stated in an authored record.
      fix:
        description: Set by a fix.

  fix_op_enum:
    permissible_values:
      set:
      add:
      drop:

  measurement_kind_enum:
    description: The measurements a model's measurement file allows.
    permissible_values:
      orm:
      dispersion:
      trm:
      crm:
      chromaticity_monitor:
      trajectory:

  trajectory_setting_scope_enum:
    description: What one value of an operator setting of the trajectory measurement sets.
    permissible_values:
      device:
        description: One value per device of the group `groups.bpm` names.
      global:
        description: One value for the whole model.

classes:
  Facility:
    tree_root: true
    description: The whole facility file.
    attributes:
      schema:
        required: true
        pattern: "^osprey\\.facility\\.[a-z_]+/[0-9]+$"
        description: The file header, `osprey.facility.<doc>/<version>`.
      identity:
        range: Identity
        required: true
        inlined: true
      classes:
        range: FacilityClass
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
        description: The facility-added device classes, carried verbatim.
      places:
        range: Place
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
      devices:
        range: Device
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
      channels:
        range: Channel
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
      groups:
        range: Group
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
      models:
        range: Model
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
      limits:
        range: Limits
        inlined: true
      scenarios:
        range: Scenario
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true

  Identity:
    description: Who the facility is.
    attributes:
      code:
        required: true
        pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        description: Names IRIs, status channels and the graph token.
      name:
      description:

  FacilityClass:
    description: A device class a facility adds as the child of an existing class.
    attributes:
      class:
        identifier: true
        required: true
      parent:
        required: true
        description: A vocabulary class or an earlier facility-added class.
      aliases:
        multivalued: true
        list_elements_ordered: true
      description:

  Provenance:
    description: Which sources, fixes and defaults produced a record.
    attributes:
      sources:
        range: ProvenanceSource
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
        description: One entry per layer that stated a field, sorted by layer.
      fixes:
        range: ProvenanceFix
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
        description: The fixes applied to the record, in fixes.yaml order.
      defaults:
        multivalued: true
        list_elements_ordered: true
        description: The fields the build filled because no source stated them.
      place_from:
        range: place_from_enum

  ProvenanceSource:
    attributes:
      layer:
        required: true
      file:
        required: true
        description: Relative to data/facility/.
      fields:
        multivalued: true
        list_elements_ordered: true

  ProvenanceFix:
    attributes:
      op:
        range: fix_op_enum
        required: true
      why:
        required: true

  Place:
    description: A node of the facility's own tree; its id is a `/`-separated path.
    attributes:
      id:
        identifier: true
        required: true
      level:
        description: The facility's word for this depth of its tree.
      description:
      names:
        multivalued: true
        description: Other names a person at the facility uses for the record; a set, compared and written sorted.
      attributes:
        range: Any
        description: A free string to scalar or list map, carried verbatim.
      span:
        range: Span
        inlined: true
      provenance:
        range: Provenance
        inlined: true

  Span:
    description: >-
      The half-open stretch [from_marker, to_marker) of one model's deck that
      places devices; no `to_marker` means the end of the deck.
    attributes:
      model:
        required: true
      from_marker:
        required: true
      to_marker:

  Device:
    description: One device; its channels point at it through `on`.
    attributes:
      id:
        identifier: true
        required: true
      class:
        description: A vocabulary class or a facility-added class.
      place:
      description:
      label:
        description: The one name a person reads for the record; a view that shows one name takes it, else the id.
      names:
        multivalued: true
        description: Other names a person at the facility uses for the record; a set, compared and written sorted.
      properties:
        multivalued: true
        list_elements_ordered: true
        description: Vocabulary property names.
      attributes:
        range: Any
        description: A free string to scalar or list map, carried verbatim.
      model:
        description: >-
          The model whose deck `s` and `length` are measured in; computed when the
          device is wired, else stated with `s`.
      s:
        range: float
        description: >-
          The entrance of the device in metres along its model; computed from the
          deck when the device is wired, and a source may state it when not. On a
          periodic deck of length L a stated s is read modulo L, and the device is
          placed and numbered there; a stated s outside [0, L] builds with one
          warning per device. On a single-pass deck it lies in [0, L].
      length:
        range: float
        description: In metres; computed when the device is wired, and a source may state it when not.
      ordinalInPlace:
        range: integer
        description: Computed; the device's ordinal among its class in its place.
      ordinalInModel:
        range: integer
        description: Computed; the device's ordinal among its class in its model.
      groups:
        multivalued: true
        description: Computed; the groups naming the device as a member.
      provenance:
        range: Provenance
        inlined: true

  OnTarget:
    description: The one device or place a channel belongs to.
    attributes:
      device:
      place:

  Channel:
    description: One control-system channel; its id is the full address.
    attributes:
      id:
        identifier: true
        required: true
      role:
        range: role_enum
        description: Absent means readback.
      pair:
        description: >-
          The readback address of a setpoint. Absent, the build pairs the setpoint
          with the one readback on the same device, place or nothing whose signal
          names the same quantity, else with itself.
      tolerance:
        range: Tolerance
        inlined: true
        description: "On a float setpoint: how close its readback (its pair, else itself) must come."
      "on":
        range: OnTarget
        inlined: true
        description: Absent means the channel belongs to nothing.
      endpoint_of:
        multivalued: true
        description: The devices sharing this channel as an endpoint.
      signal:
        description: A vocabulary signal role.
      unit:
        description: Free text.
      description:
        description: >-
          What this channel is. When a source states none and the channel names
          a `signal`, the build composes one from its owner, its signal and its
          unit, and records it in `provenance.defaults`.
      label:
        description: The one name a person reads for the record; a view that shows one name takes it, else the id.
      names:
        multivalued: true
        description: Other names a person at the facility uses for the record; a set, compared and written sorted.
      former_addresses:
        multivalued: true
      tags:
        multivalued: true
      attributes:
        range: Any
        description: A free string to scalar or list map, carried verbatim.
      value_type:
        range: value_type_enum
        description: Absent means float.
      options:
        multivalued: true
        list_elements_ordered: true
        description: The labels of a bool or enum channel.
      shape:
        range: integer
        multivalued: true
        list_elements_ordered: true
        description: The dimensions of a waveform channel.
      precision:
        range: integer
        description: The decimals a display shows, 0 to 17; only on a float channel.
      simulation:
        range: Seed
        inlined: true
      provenance:
        range: Provenance
        inlined: true

  Seed:
    description: How an unwired channel behaves when simulated.
    attributes:
      nominal:
        range: Any
        description: The value at start, of the channel's value_type.
      noise:
        range: Noise
        inlined: true
      drift:
        range: Drift
        inlined: true
      clamp:
        range: Any
        multivalued: true
        list_elements_ordered: true
        minimum_cardinality: 2
        maximum_cardinality: 2
        description: "[low, high]; either side may be null."
      linear:
        range: LinearTerm
        multivalued: true
        inlined: true
        list_elements_ordered: true
        description: "The value as a weighted sum of other channels, `{<address>: <coefficient>}`."
      pulse:
        range: Pulse
        inlined: true
        description: The trace of a waveform channel, shaped in code and scaled by a driving channel.
      gate:
        range: Gate
        inlined: true
        description: "What the channel does while any of `inputs` reads its blocking label, beside `nominal`."

  Pulse:
    description: >-
      The channels a waveform channel's trace follows; the trace's shape is
      fixed in code, not in the seed.
    attributes:
      driver:
        required: true
        description: The address whose reading scales the trace.
      enable:
        required: true
        description: The address of the bool channel that switches the trace on; off gives a flat zero trace.

  Gate:
    description: >-
      Applies `gated` to a channel while any listed input reads its blocking
      label; otherwise the channel behaves as its other seed keys say.
    attributes:
      inputs:
        range: GateInput
        multivalued: true
        inlined: true
        list_elements_ordered: true
        required: true
        description: "`{<address>: <blocking_label>}`."
      gated:
        range: Any
        required: true
        description: >-
          The value while gated, typed by the gated channel: a factor > 0 on a
          float channel, a label on a bool or enum channel, an integer on an
          int channel.

  GateInput:
    attributes:
      address:
        key: true
      blocking_label:
        required: true

  Noise:
    description: >-
      Additive Gaussian noise, stating exactly one of `absolute`, `relative`.
    attributes:
      absolute:
        range: float
        minimum_value: 0
        description: Gaussian sigma in the channel's unit.
      relative:
        range: float
        minimum_value: 0
        description: Gaussian sigma as a fraction of the reading.

  Tolerance:
    description: >-
      How close a readback must come to its setpoint's demand, stating exactly
      one of `absolute`, `relative`.
    attributes:
      absolute:
        range: float
        minimum_value: 0
        description: Largest |readback − demand| at which a move counts as done, in the channel's unit.
      relative:
        range: float
        minimum_value: 0
        description: The same bound as a fraction of the demand.

  Drift:
    attributes:
      amplitude:
        range: float
        required: true
      period_s:
        range: float
        required: true

  LinearTerm:
    attributes:
      address:
        key: true
      coefficient:
        range: float
        required: true

  Group:
    description: >-
      A named set of devices. A channel's meaning is on the channel: its
      `signal` and its `description`.
    attributes:
      id:
        identifier: true
        required: true
      description:
        description: What the set is, in the facility's words.
      label:
        description: The one name a person reads for the record; a view that shows one name takes it, else the id.
      names:
        multivalued: true
        description: Other names a person at the facility uses for the record; a set, compared and written sorted.
      members:
        multivalued: true
        description: Device ids.
      provenance:
        range: Provenance
        inlined: true

  Model:
    description: One simulation model and how it is wired to channels.
    attributes:
      name:
        identifier: true
        required: true
        pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
      engine:
        required: true
      deck:
        description: Relative to data/facility/.
      settings:
        range: Any
        description: "`{<engine>: {...}}`, the one key equal to `engine`."
      wiring:
        range: Wiring
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
      measurement:
        range: Measurement
        inlined: true
      provenance:
        range: Provenance
        inlined: true

  Wiring:
    description: >-
      One model variable: a channel's address driven by or read from `element`
      or `slices`, never both.
    attributes:
      id:
        identifier: true
        required: true
        description: "`<model>/<address>`, split at the first `/`."
      address:
        required: true
      element:
      slices:
        range: Slice
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
        description: The first slice is the element read from.
      engine:
        range: Any
        description: The engine's own words for the variable.
      calibration:
        range: Calibration
        inlined: true
      direction:
        description: Computed from the channel's role.
      unit:
        description: Computed from the channel.
      default:
        range: Any
        description: Computed; the operating point from the deck.
      value_range:
        range: float
        multivalued: true
        list_elements_ordered: true
        description: Computed from the channel's limits record.
      provenance:
        range: Provenance
        inlined: true

  Slice:
    attributes:
      element:
        required: true
      weight:
        range: float
        description: Absent means 1.
      device:
        description: Absent means the channel's device.
      curve:
        range: Curve
        inlined: true
        description: >-
          This slice's own hardware-to-physics conversion; absent means the
          record's `calibration.curve`. The first slice states none.

  Calibration:
    attributes:
      curve:
        range: Curve
        required: true
        inlined: true
      inverse:
        range: Curve
        inlined: true
      energy_scaling:
        range: energy_scaling_enum

  Curve:
    description: Exactly one of `linear` or `table`.
    attributes:
      linear:
        range: LinearCurve
        inlined: true
      table:
        range: TableCurve
        inlined: true

  LinearCurve:
    attributes:
      gain:
        range: float
        required: true
      offset:
        range: float
        required: true

  TableCurve:
    attributes:
      grid:
        range: float
        multivalued: true
        required: true
        list_elements_ordered: true
      values:
        range: float
        multivalued: true
        required: true
        list_elements_ordered: true

  Measurement:
    description: >-
      The measurements a model allows and the groups and channels they use. The
      step and settle keys are pyAML's own, carried verbatim.
    attributes:
      kinds:
        range: measurement_kind_enum
        multivalued: true
      groups:
        range: MeasurementGroups
        inlined: true
      instruments:
        range: MeasurementInstruments
        inlined: true
      trajectory:
        range: TrajectoryDeclaration
        inlined: true
        description: The trajectory surface of a model whose `kinds` list `trajectory`.
      n_step:
        range: integer
      n_avg_meas:
        range: integer
      fit_order:
        range: integer
      sleep_between_step:
        range: float
      sleep_between_meas:
        range: float
      corrector_delta:
        range: float
      quad_delta:
        range: float
      sextu_delta:
        range: float
      frequency_delta:
        range: float
      alpha:
        range: float
      n_discard:
        range: integer
      gain:
        range: float

  MeasurementGroups:
    description: Group ids; a role naming several groups takes their members together.
    attributes:
      bpm:
        multivalued: true
      hcor:
        multivalued: true
      vcor:
        multivalued: true
      quad:
        multivalued: true
      sext:
        multivalued: true

  MeasurementInstruments:
    description: Channel addresses.
    attributes:
      tune:
      rf:
      injection_request:
      injection_busy:
      bunch_clean_enable:
      beam_current:
      rf_status:

  TrajectoryDeclaration:
    description: >-
      The trajectory measurement's surface: the sample of every turn-by-turn
      buffer the injected shot arrives at, the operator settings the
      measurement reads its monitors under, and the ordered chain of steps
      one shot runs.
    attributes:
      trigger_sample:
        range: integer
        required: true
        minimum_value: 0
        description: The sample of each turn-by-turn buffer the injected shot arrives at.
      settings:
        range: TrajectorySetting
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
        description: The operator settings, in the order they are shown and applied.
      steps:
        range: TrajectoryStep
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
        required: true
        description: The chain one shot runs, in order.

  TrajectorySetting:
    description: >-
      One operator setting. Its readback is the setpoint channel's `pair`, and a
      move counts as settled within the setpoint channel's `tolerance`, or on
      an exact match when the channel states none.
    attributes:
      id:
        required: true
        description: The setting's name, unique within the declaration.
      label:
        required: true
        description: The words an operator sees for the setting.
      description:
        description: What the setting does to the measurement.
      scope:
        range: trajectory_setting_scope_enum
        required: true
      signal:
        description: >-
          With scope `device`, the signal of the setpoint channel on each device
          of the group `groups.bpm` names.
      address:
        description: With scope `global`, the address of the one setpoint channel.
      timeout_s:
        range: float
        required: true
        minimum_value: 0
        description: The longest wait, in seconds, for the readback to settle after a write.

  TrajectoryStep:
    description: >-
      One step of the chain. A step with a `command` writes it; a step without
      one is run by the measurement service itself.
    attributes:
      id:
        required: true
        description: The step's name, unique within the chain.
      label:
        required: true
        description: The words an operator sees for the step.
      description:
        required: true
        description: What the step does to the machine.
      default:
        range: boolean
        required: true
        description: Whether the step is part of the chain a run takes when none is chosen.
      command:
        range: TrajectoryCommand
        inlined: true

  TrajectoryCommand:
    description: The write a command step makes, and how long the step may take.
    attributes:
      address:
        required: true
        description: The setpoint channel written.
      value:
        range: Any
        required: true
        description: The value written, of the channel's value_type.
      timeout_s:
        range: float
        required: true
        minimum_value: 0
        description: >-
          The longest the step may take, in seconds: the wait for `done` when it
          is stated; a step without `done` writes and continues.
      done:
        range: TrajectoryDone
        inlined: true

  TrajectoryDone:
    description: The reading a command step waits for before the chain continues.
    attributes:
      address:
        required: true
        description: The channel read.
      value:
        range: Any
        required: true
        description: The value that means the command is done.

  Limits:
    attributes:
      records:
        range: LimitRecord
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true

  LimitRecord:
    description: The write limits of one channel.
    attributes:
      address:
        identifier: true
        required: true
      min_value:
        range: float
      max_value:
        range: float
      max_step:
        range: float
      writable:
        range: boolean
        description: >-
          Absent means true on a setpoint carrying both `min_value` and
          `max_value`, false otherwise.
      confirm:
        range: boolean
        description: Absent means true; false turns off the re-read after a write.

  Scenario:
    description: Values written into the models at start, and the narratives that go with them.
    attributes:
      name:
        identifier: true
        required: true
      description:
        description: What the scenario shows.
      overrides:
        range: Any
        description: "`{<address>: <value>}`, each value of the channel's value_type."
      faults:
        range: Any
        description: >-
          `{<model>: {<address or engine variable>: <value>}}`, where a value is a
          scalar or a map `{<fault field>: <value>}`.
      channel_faults:
        range: Any
        description: >-
          `{<address>: stuck | frozen | disconnected}`: faults of the channel
          itself while the scenario is active. `stuck` holds a setpoint's
          writes; `frozen` holds a reading at the value it served when the
          scenario became active; `disconnected` reads not-a-number with an
          undefined alarm and holds writes.
      archiver:
        range: Any
        multivalued: true
        list_elements_ordered: true
        description: >-
          `[{channel, events}]`, the history each channel's archive shows. An
          event's `at_offset` is in seconds relative to the moment the scenario
          is applied (negative is the past); a step or spike may instead state
          `at_when` `{days_ago, time}`, a logbook entry's own `when`, so the
          event and the entry narrating it fall at one instant. An anchored
          spike's `width` is its Gaussian sigma in seconds. An event meant to be
          sampled densely sits inside the archive's dense tier, with a `width`
          of at least twice the sampling interval.
      logbook:
        range: Any
        multivalued: true
        list_elements_ordered: true
        description: >-
          `[{entry_id, when, author, title, text, tags?, categories?, loto_tag?,
          extra?, attachments?}]`, the entries the scenario narrates.
          `attachments` lists the entry's pictures, each `{path: <picture
          file>}` or `{plot: <plot spec .json>}`, relative to the scenario's
          own directory `scenarios/<name>/`.
      drivers:
        range: Any
        description: >-
          `{<driver>: {kind, amplitude, period_s}}`, slow signals shared by the
          channels `couple` names, so those channels move together.
      couple:
        range: Any
        description: >-
          `{<address>: [{driver, gain, gain_wander?}]}`: the channel adds
          `gain` times each named driver to its value; `gain_wander`
          `{amplitude, period_s}` lets that gain wax and wane.
      noise:
        range: Any
        description: >-
          `{<address>: {absolute: <sigma>} | {relative: <fraction>}}`, the
          channel's noise while the scenario is active, in place of its seed's.
      still:
        range: Any
        description: >-
          `all`, or a list of addresses: while the scenario is active, those
          readings serve without drift, couplings or noise.

  Any:
    class_uri: linkml:Any
    description: Any value, carried verbatim.
