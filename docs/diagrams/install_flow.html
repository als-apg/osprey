<!DOCTYPE html>
<!--
  Source of truth for the /osprey:install flow diagram committed to
  docs/source/_static/screenshots/. Hand-authored SVG; edit here, then regenerate:

      cd docs && make screenshots-install_flow

  The screenshot runner (docs/screenshots) loads this page in headless chromium
  with ?theme=light / ?theme=dark and crops the #fig-* figure element at 2x.
  The tiny script below maps that query parameter onto data-theme, which is what
  the CSS tokens switch on. Captions live in the consuming .rst figures, not
  here, so the PNGs stay pure diagrams.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSPREY install flow — docs diagram source</title>
<script>
  const t = new URLSearchParams(location.search).get("theme");
  if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
</script>
<style>
  :root {
    --paper: #F6F8F6;
    --ink: #1B2420;
    --muted: #5D6B65;
    --line: #C6CFCA;
    --box: #FFFFFF;
    --accent: #0E7A6E;        /* teal — the deployment repository, the one output */
    --warn: #B26A08;          /* amber — the background upstream scout */
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #121815;
      --ink: #E4EAE6;
      --muted: #93A29B;
      --line: #35413B;
      --box: #1A211D;
      --accent: #33C9B4;
      --warn: #E9A23B;
    }
  }
  :root[data-theme="dark"] {
    --paper: #121815;
    --ink: #E4EAE6;
    --muted: #93A29B;
    --line: #35413B;
    --box: #1A211D;
    --accent: #33C9B4;
    --warn: #E9A23B;
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    margin: 0;
    padding: 2rem 1.5rem;
  }
  main { max-width: 1120px; margin: 0 auto; }
  figure {
    margin: 0 0 2.5rem;
    padding: 1rem;
    background: var(--paper);
  }
  figure svg { max-width: 100%; height: auto; display: block; }

  /* ── shared grammar with docs/diagrams/retrieval_map.html ── */
  :root {
    --accent-tint: rgba(14,122,110,0.08);
    --warn-tint: rgba(178,106,8,0.08);
    --rule: rgba(27,36,32,0.10);
    --wash: rgba(27,36,32,0.05);
    --wash-lt: rgba(27,36,32,0.02);
    --ink-strong: rgba(27,36,32,0.55);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --accent-tint: rgba(51,201,180,0.10);
      --warn-tint: rgba(233,162,59,0.10);
      --rule: rgba(228,234,230,0.10);
      --wash: rgba(228,234,230,0.05);
      --wash-lt: rgba(228,234,230,0.02);
      --ink-strong: rgba(228,234,230,0.55);
    }
  }
  :root[data-theme="dark"] {
    --accent-tint: rgba(51,201,180,0.10);
    --warn-tint: rgba(233,162,59,0.10);
    --rule: rgba(228,234,230,0.10);
    --wash: rgba(228,234,230,0.05);
    --wash-lt: rgba(228,234,230,0.02);
    --ink-strong: rgba(228,234,230,0.55);
  }

  .nb      { fill: var(--box); stroke: var(--line); stroke-width: 1.2; }
  .nb-warn { fill: var(--warn-tint); stroke: var(--warn); stroke-width: 1.2; }
  .nb-acc  { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
  .nsub    { fill: var(--wash-lt); stroke: var(--line); stroke-width: 1; }
  .zone    { fill: var(--wash-lt); stroke: var(--rule); stroke-width: 0.8; stroke-dasharray: 6 5; }
  .mask    { fill: var(--paper); }
  .tn { font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; font-size: 12px; font-weight: 600; fill: var(--ink); }
  .ts { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 9px; fill: var(--muted); }
  .te { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 8px; font-weight: 500; fill: var(--muted); letter-spacing: 0.14em; }
  .ta { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 8px; fill: var(--muted); letter-spacing: 0.06em; }
  .ta-warn { fill: var(--warn); }
  .t-acc  { fill: var(--accent); }
  .t-warn2 { fill: var(--warn); }
  .e     { stroke: var(--muted); stroke-width: 1.2; fill: none; }
  .e-acc { stroke: var(--accent); stroke-width: 1.4; fill: none; }
  .e-dash { stroke-dasharray: 5 4; }
</style>
</head>
<body>
<main>

  <figure id="fig-install-flow">
    <svg viewBox="0 0 1280 684" role="img" aria-labelledby="install-flow-title install-flow-desc">
    <title id="install-flow-title">The /osprey:install flow — two entry questions, four phases, one repository</title>
    <desc id="install-flow-desc">Two opening questions set the starting point and the install mode. Four phases then run left to right — DISCOVER reads, MAP rules a verdict per element, BUILD assembles the deployment, CLOSE gates on the ledger — each handing the operator a card to confirm or modify, and ending in a deployment repository holding profile.yml and INTERVIEW.md. An upstream scout runs in the background from MAP onward and reports back at the next card.</desc>
    <defs>
      <marker id="arr" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
        <polygon points="0,0 8,3 0,6" fill="context-stroke"/>
      </marker>
    </defs>

    <!-- ── scout zone (drawn first so nodes sit above it) ── -->
    <rect class="zone" x="344" y="388" width="816" height="136" rx="8"/>
    <text class="te" x="360" y="408">UPSTREAM SCOUT · BACKGROUND</text>

    <!-- ── entry row edges ── -->
    <line class="e" x1="332" y1="72" x2="384" y2="72" marker-end="url(#arr)"/>
    <path class="e" d="M492,100 V124 Q492,132 484,132 H176 Q168,132 168,140 V152" marker-end="url(#arr)"/>

    <!-- ── phase chain edges ── -->
    <line class="e" x1="304" y1="204" x2="344" y2="204" marker-end="url(#arr)"/>
    <line class="e" x1="616" y1="204" x2="656" y2="204" marker-end="url(#arr)"/>
    <line class="e" x1="928" y1="204" x2="968" y2="204" marker-end="url(#arr)"/>

    <!-- ── card drop lines ── -->
    <line class="e" x1="324" y1="204" x2="324" y2="306"/>
    <line class="e" x1="636" y1="204" x2="636" y2="306"/>
    <line class="e" x1="948" y1="204" x2="948" y2="306"/>

    <!-- ── scout edges ── -->
    <path class="e e-dash" d="M536,256 V424" marker-end="url(#arr)"/>
    <rect class="mask" x="436" y="280" width="92" height="12" rx="2"/>
    <text class="ta" x="528" y="289" text-anchor="end">investigate? yes</text>

    <path class="e e-dash" d="M688,465 H1104 V256" marker-end="url(#arr)"/>
    <rect class="mask" x="836" y="459" width="120" height="12" rx="2"/>
    <text class="ta" x="896" y="468" text-anchor="middle">write-up at next card</text>

    <!-- ── close → deployment repository ── -->
    <path class="e-acc" d="M1200,256 V536 Q1200,544 1192,544 H1056 Q1048,544 1048,552 V560" marker-end="url(#arr)"/>

    <!-- ── entry nodes ── -->
    <rect class="mask" x="32" y="44" width="300" height="56" rx="6"/>
    <rect class="nb" x="32" y="44" width="300" height="56" rx="6"/>
    <text class="tn" x="182" y="70" text-anchor="middle">What already exists?</text>
    <text class="ts" x="182" y="88" text-anchor="middle">deployment · facility, no OSPREY · nothing yet</text>

    <rect class="mask" x="384" y="44" width="216" height="56" rx="6"/>
    <rect class="nb" x="384" y="44" width="216" height="56" rx="6"/>
    <text class="tn" x="492" y="70" text-anchor="middle">Install OSPREY?</text>
    <text class="ts" x="492" y="88" text-anchor="middle">already · release · dev (main)</text>

    <!-- ── phase nodes ── -->
    <rect class="mask" x="32" y="152" width="272" height="104" rx="8"/>
    <rect class="nb" x="32" y="152" width="272" height="104" rx="8"/>
    <text class="tn" x="168" y="180" text-anchor="middle">DISCOVER</text>
    <text class="ts" x="168" y="206" text-anchor="middle">reads repo, files, CLI output</text>
    <text class="ts" x="168" y="222" text-anchor="middle">writes nothing</text>

    <rect class="mask" x="344" y="152" width="272" height="104" rx="8"/>
    <rect class="nb" x="344" y="152" width="272" height="104" rx="8"/>
    <text class="tn" x="480" y="180" text-anchor="middle">MAP</text>
    <text class="ts" x="480" y="206" text-anchor="middle">one verdict per element</text>
    <text class="ts" x="480" y="222" text-anchor="middle">port · native · placeholder · obsolete · gap</text>
    <text class="ts" x="480" y="238" text-anchor="middle">facility, prefix, timezone, project</text>

    <rect class="mask" x="656" y="152" width="272" height="104" rx="8"/>
    <rect class="nb" x="656" y="152" width="272" height="104" rx="8"/>
    <text class="tn" x="792" y="180" text-anchor="middle">BUILD</text>
    <text class="ts" x="792" y="206" text-anchor="middle">hello-world base, by rule</text>
    <text class="ts" x="792" y="222" text-anchor="middle">feature port: keys · service · panel · data</text>
    <text class="ts" x="792" y="238" text-anchor="middle">harvest named sources</text>

    <rect class="mask" x="968" y="152" width="272" height="104" rx="8"/>
    <rect class="nb" x="968" y="152" width="272" height="104" rx="8"/>
    <text class="tn" x="1104" y="180" text-anchor="middle">CLOSE</text>
    <text class="ts" x="1104" y="206" text-anchor="middle">ledger gate: every path accounted</text>
    <text class="ts" x="1104" y="222" text-anchor="middle">devil's advocate</text>
    <text class="ts" x="1104" y="238" text-anchor="middle">final validate + build</text>

    <!-- ── hand-off cards ── -->
    <rect class="mask" x="246" y="306" width="156" height="32" rx="4"/>
    <rect class="nsub" x="246" y="306" width="156" height="32" rx="4"/>
    <text class="ts" x="324" y="326" text-anchor="middle">status-quo card</text>
    <text class="ta" x="324" y="354" text-anchor="middle">confirm / modify</text>

    <rect class="mask" x="558" y="306" width="156" height="32" rx="4"/>
    <rect class="nsub" x="558" y="306" width="156" height="32" rx="4"/>
    <text class="ts" x="636" y="326" text-anchor="middle">porting-map card</text>
    <text class="ta" x="636" y="354" text-anchor="middle">confirm / modify</text>

    <rect class="mask" x="870" y="306" width="156" height="32" rx="4"/>
    <rect class="nsub" x="870" y="306" width="156" height="32" rx="4"/>
    <text class="ts" x="948" y="326" text-anchor="middle">feature checklist</text>
    <text class="ta" x="948" y="354" text-anchor="middle">confirm / modify</text>

    <!-- ── the scout ── -->
    <rect class="mask" x="420" y="424" width="268" height="82" rx="6"/>
    <rect class="nb-warn" x="420" y="424" width="268" height="82" rx="6"/>
    <text class="tn t-warn2" x="554" y="450" text-anchor="middle">scout</text>
    <text class="ts" x="554" y="474" text-anchor="middle">fit check · prior art · where the fix lives</text>
    <text class="ts" x="554" y="490" text-anchor="middle">verdict: mechanical | architectural</text>

    <!-- ── the one output ── -->
    <rect class="mask" x="856" y="560" width="384" height="88" rx="8"/>
    <rect class="nb-acc" x="856" y="560" width="384" height="88" rx="8"/>
    <text class="tn t-acc" x="1048" y="588" text-anchor="middle">Deployment repository</text>
    <text class="ts" x="1048" y="614" text-anchor="middle">profile.yml — every decision, explicit</text>
    <text class="ts" x="1048" y="630" text-anchor="middle">INTERVIEW.md — every locked card + ledger</text>
  </svg>
  </figure>

</main>
</body>
</html>
