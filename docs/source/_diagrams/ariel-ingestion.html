<div class="osprey-diagram">
<svg viewBox="0 0 960 488" role="img" aria-labelledby="ariel-ingestion-title ariel-ingestion-desc">
  <title id="ariel-ingestion-title">ARIEL data ingestion</title>
  <desc id="ariel-ingestion-desc">A facility adapter pulls entries from the source system and yields EnhancedLogbookEntry records; the repository upserts them idempotently into PostgreSQL and copies their pictures into attachment_files. Optional enhancement modules run as a separate step: each reads stored entries, and each writes its results back to the database, in order: picture captions, keywords and summaries, text embeddings, picture embeddings, and the markdown mirror for the qmd sidecar.</desc>
  <defs>
    <marker id="ariel-ingestion-arr" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0,0 8,3 0,6" fill="context-stroke"/>
    </marker>
  </defs>
  <!-- zone first -->
  <rect class="zone" x="480" y="88" width="400" height="352" rx="8"/>
  <rect class="mask" x="496" y="92" width="252" height="12" rx="2"/>
  <text class="te" x="500" y="101">ENHANCEMENT · OPTIONAL STEP · IN RUN ORDER</text>
  <!-- arrows -->
  <line class="e" x1="200" y1="96" x2="200" y2="136" marker-end="url(#ariel-ingestion-arr)"/>
  <line class="e" x1="200" y1="192" x2="200" y2="232" marker-end="url(#ariel-ingestion-arr)"/>
  <line class="e" x1="200" y1="288" x2="200" y2="328" marker-end="url(#ariel-ingestion-arr)"/>
  <line class="e e-dash" x1="312" y1="356" x2="480" y2="356" marker-end="url(#ariel-ingestion-arr)"/>
  <rect class="mask" x="208" y="200" width="116" height="12" rx="2"/>
  <text class="ta" x="212" y="209">EnhancedLogbookEntry</text>
  <rect class="mask" x="356" y="336" width="80" height="12" rx="2"/>
  <text class="ta" x="396" y="345" text-anchor="middle">READS ENTRIES</text>
  <!-- write-back: every module feeds one bus back into PostgreSQL -->
  <line class="e-thin" x1="848" y1="142" x2="904" y2="142"/>
  <line class="e-thin" x1="848" y1="206" x2="904" y2="206"/>
  <line class="e-thin" x1="848" y1="270" x2="904" y2="270"/>
  <line class="e-thin" x1="848" y1="334" x2="904" y2="334"/>
  <line class="e-thin" x1="848" y1="398" x2="904" y2="398"/>
  <polyline class="e" points="904,142 904,464 200,464 200,386" marker-end="url(#ariel-ingestion-arr)"/>
  <rect class="mask" x="500" y="458" width="104" height="12" rx="2"/>
  <text class="ta" x="552" y="467" text-anchor="middle">WRITES RESULTS BACK</text>
  <!-- main chain -->
  <rect class="mask" x="88" y="40" width="224" height="56" rx="6"/>
  <rect class="nb-ext" x="88" y="40" width="224" height="56" rx="6"/>
  <text class="tn" x="200" y="64" text-anchor="middle">source system</text>
  <text class="ts" x="200" y="80" text-anchor="middle">HTTP API · JSONL file</text>
  <rect class="mask" x="88" y="136" width="224" height="56" rx="6"/>
  <rect class="nb" x="88" y="136" width="224" height="56" rx="6"/>
  <text class="tn" x="200" y="160" text-anchor="middle">facility adapter</text>
  <text class="ts" x="200" y="176" text-anchor="middle">yields entries one at a time</text>
  <rect class="mask" x="88" y="232" width="224" height="56" rx="6"/>
  <rect class="nb" x="88" y="232" width="224" height="56" rx="6"/>
  <text class="tn" x="200" y="256" text-anchor="middle">repository upsert</text>
  <text class="ts" x="200" y="272" text-anchor="middle">dedup by ID · copies pictures</text>
  <rect class="mask" x="88" y="328" width="224" height="56" rx="6"/>
  <rect class="nb-st" x="88" y="328" width="224" height="56" rx="6"/>
  <text class="tn" x="200" y="352" text-anchor="middle">PostgreSQL</text>
  <text class="ts" x="200" y="368" text-anchor="middle">enhanced_entries · attachment_files</text>
  <!-- modules, in execution order -->
  <rect class="mask" x="512" y="116" width="336" height="52" rx="6"/>
  <rect class="nb" x="512" y="116" width="336" height="52" rx="6"/>
  <text class="tn" x="680" y="138" text-anchor="middle">ImageCaptionModule</text>
  <text class="ts" x="680" y="154" text-anchor="middle">pictures → captions in the searchable text</text>
  <rect class="mask" x="512" y="180" width="336" height="52" rx="6"/>
  <rect class="nb" x="512" y="180" width="336" height="52" rx="6"/>
  <text class="tn" x="680" y="202" text-anchor="middle">SemanticProcessorModule</text>
  <text class="ts" x="680" y="218" text-anchor="middle">→ keywords + summary fields</text>
  <rect class="mask" x="512" y="244" width="336" height="52" rx="6"/>
  <rect class="nb" x="512" y="244" width="336" height="52" rx="6"/>
  <text class="tn" x="680" y="266" text-anchor="middle">TextEmbeddingModule</text>
  <text class="ts" x="680" y="282" text-anchor="middle">→ per-model embedding tables</text>
  <rect class="mask" x="512" y="308" width="336" height="52" rx="6"/>
  <rect class="nb" x="512" y="308" width="336" height="52" rx="6"/>
  <text class="tn" x="680" y="330" text-anchor="middle">ImageEmbeddingModule</text>
  <text class="ts" x="680" y="346" text-anchor="middle">pictures → per-model image vector table</text>
  <rect class="mask" x="512" y="372" width="336" height="52" rx="6"/>
  <rect class="nb" x="512" y="372" width="336" height="52" rx="6"/>
  <text class="tn" x="680" y="394" text-anchor="middle">QmdExportModule</text>
  <text class="ts" x="680" y="410" text-anchor="middle">→ markdown mirror for the qmd sidecar</text>
</svg>
</div>
