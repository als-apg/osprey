<div class="osprey-diagram">
<svg viewBox="0 0 960 440" role="img" aria-labelledby="health-suite-title health-suite-desc">
  <title id="health-suite-title">What composes the health suite</title>
  <desc id="health-suite-desc">Rows in one health report arrive from six independent origins: always-on built-ins, presence-gated service categories, categories you declare, MCP checks derived from claude_code.servers, an archiver freshness check derived from the build profile, and Python plugins. They compose into one categorized suite whose rows each carry a cost class, and three surfaces read that suite at different tiers.</desc>
  <defs>
    <marker id="health-suite-arr" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0,0 8,3 0,6" fill="context-stroke"/>
    </marker>
  </defs>

  <!-- fan-in edges -->
  <line class="e" x1="266" y1="82"  x2="336" y2="166" marker-end="url(#health-suite-arr)"/>
  <line class="e" x1="266" y1="138" x2="336" y2="188" marker-end="url(#health-suite-arr)"/>
  <line class="e" x1="266" y1="194" x2="336" y2="210" marker-end="url(#health-suite-arr)"/>
  <line class="e" x1="266" y1="250" x2="336" y2="232" marker-end="url(#health-suite-arr)"/>
  <line class="e" x1="266" y1="306" x2="336" y2="254" marker-end="url(#health-suite-arr)"/>
  <line class="e" x1="266" y1="362" x2="336" y2="276" marker-end="url(#health-suite-arr)"/>
  <!-- fan-out edges -->
  <line class="e" x1="620" y1="190" x2="690" y2="138" marker-end="url(#health-suite-arr)"/>
  <line class="e" x1="620" y1="222" x2="690" y2="222" marker-end="url(#health-suite-arr)"/>
  <line class="e" x1="620" y1="254" x2="690" y2="306" marker-end="url(#health-suite-arr)"/>
  <!-- override tap -->
  <line class="e e-dash" x1="480" y1="344" x2="480" y2="302" marker-end="url(#health-suite-arr)"/>

  <text class="te" x="16" y="44">WHERE ROWS COME FROM</text>
  <text class="te" x="694" y="44">WHO READS THE SUITE</text>

  <!-- origins -->
  <rect class="nb" x="16" y="60" width="250" height="44" rx="6"/>
  <text class="tn" x="141" y="80" text-anchor="middle">built-in core checks</text>
  <text class="ts" x="141" y="95" text-anchor="middle">always on</text>
  <rect class="nb" x="16" y="116" width="250" height="44" rx="6"/>
  <text class="tn" x="141" y="136" text-anchor="middle">presence-gated</text>
  <text class="ts" x="141" y="151" text-anchor="middle">ariel · channel_finder</text>
  <rect class="nb" x="16" y="172" width="250" height="44" rx="6"/>
  <text class="tn" x="141" y="192" text-anchor="middle">health.categories</text>
  <text class="ts" x="141" y="207" text-anchor="middle">what you declare yourself</text>
  <rect class="nb" x="16" y="228" width="250" height="44" rx="6"/>
  <text class="tn" x="141" y="248" text-anchor="middle">health.auto.mcp</text>
  <text class="ts" x="141" y="263" text-anchor="middle">read from claude_code.servers</text>
  <rect class="nb" x="16" y="284" width="250" height="44" rx="6"/>
  <text class="tn" x="141" y="304" text-anchor="middle">freshness_channel</text>
  <text class="ts" x="141" y="319" text-anchor="middle">named in the build profile</text>
  <rect class="nb" x="16" y="340" width="250" height="44" rx="6"/>
  <text class="tn" x="141" y="360" text-anchor="middle">health.plugins</text>
  <text class="ts" x="141" y="375" text-anchor="middle">your own Python checks</text>

  <!-- the suite -->
  <rect class="nb-foc" x="340" y="142" width="280" height="160" rx="6"/>
  <text class="tn" x="480" y="170" text-anchor="middle">one categorized suite</text>
  <line class="divider" x1="364" y1="184" x2="596" y2="184"/>
  <text class="ts" x="480" y="206" text-anchor="middle">poll — cheap, side-effect-free</text>
  <text class="ts" x="480" y="222" text-anchor="middle">on_demand — costly or externally</text>
  <text class="ts" x="480" y="238" text-anchor="middle">visible; runs only with --full</text>
  <line class="divider" x1="364" y1="254" x2="596" y2="254"/>
  <text class="ta" x="480" y="274" text-anchor="middle">--category scopes which categories run,</text>
  <text class="ta" x="480" y="290" text-anchor="middle">it never elevates a cost class</text>

  <rect class="nb-st" x="340" y="344" width="280" height="44" rx="6"/>
  <text class="ts" x="480" y="364" text-anchor="middle">metadata-only override</text>
  <text class="ta" x="480" y="379" text-anchor="middle">tunes a built-in, never redefines it</text>

  <!-- surfaces -->
  <rect class="nb" x="694" y="106" width="250" height="64" rx="6"/>
  <text class="tn" x="819" y="130" text-anchor="middle">osprey health</text>
  <text class="ts" x="819" y="146" text-anchor="middle">poll by default</text>
  <text class="ts" x="819" y="161" text-anchor="middle">--full adds on_demand</text>
  <rect class="nb" x="694" y="190" width="250" height="64" rx="6"/>
  <text class="tn" x="819" y="214" text-anchor="middle">SYSTEM dashboard</text>
  <text class="ts" x="819" y="230" text-anchor="middle">poll only — a browser can</text>
  <text class="ts" x="819" y="245" text-anchor="middle">never trigger on_demand</text>
  <rect class="nb" x="694" y="274" width="250" height="64" rx="6"/>
  <text class="tn" x="819" y="298" text-anchor="middle">agent tools</text>
  <text class="ts" x="819" y="314" text-anchor="middle">health_check — auto-approved</text>
  <text class="ts" x="819" y="329" text-anchor="middle">health_check_full — asks first</text>

  <text class="ta ta-warn" x="480" y="418" text-anchor="middle">declare health.categories.archiver or name a freshness_channel — never both; a profile that does both is refused at build time</text>
</svg>
</div>
