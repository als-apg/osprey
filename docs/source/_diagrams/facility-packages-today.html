  <title id="fpt-title">Today versus target: the description and the panels each their own package, and the edges the boundary ratchet listed, grouped by the phase that removed them</title>
  <desc id="fpt-desc">Two halves. The left half is today. The description is its own package, packages/osprey-facility, import root osprey_facility: some 25 modules such as records, combine, build, validate, render, scenarios, compute, layers, kinds, sessions and the schema. It imports no framework code, no click and no pyaml_cs_osprey, and the framework imports it through its public modules only. The panel engine is its own package too, packages/osprey-panels, import root osprey_panels: it reads facility.json, the panel rule tables and a theme file passed in, and imports no framework, no description module and no osprey_connectors. The framework imports no osprey_panels module and has no panels command. No third-party reach is listed. The right half is the ratchet, drawn by edge class and the phase that removed it, not entry by entry. Phase 2, the panels seam, is done and lists no edge: the panels read facility.json only. Phase 3, the facility untangle, is done and lists no edge: it removed every description edge into the framework, the edges to click and to pyaml_cs_osprey, and the engine contract's osprey.simulation.engines spelling, and broke the import cycle. Phase 4, the facility package, is done and lists no edge: it removed the framework's reaches into description modules outside the public API, such as the CLI's read of the MML layer data. Phase 5, the panels package, is done and lists no edge: it removed the framework CLI's import of the panels, the panels' climb to the framework theme, replaced by a theme file passed in, and the panels' import of osprey_connectors.safety_file. Phase 6, release wiring, removes no edge: osprey-facility tags and publishes on its own stream, and osprey-panels is not published. Footer: the ratchet is empty; an edge of any of these classes fails the boundary check today.</desc>
