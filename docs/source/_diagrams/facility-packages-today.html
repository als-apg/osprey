  <title id="fpt-title">Today versus target: the one facility package with its import cycle, and the edges the boundary ratchet lists, grouped by the phase that removes them</title>
  <desc id="fpt-desc">Two halves. The left half is today. src/osprey/facility is one package. Its description, some 22 modules such as records, combine, build, validate, render, scenarios, compute, layers and kinds, imports itself in one cycle, and the cycle runs through the framework's views, scenarios and render: the description reaches into the framework, and the framework imports description modules that are not its public API. The panels code lives inside it, at facility/panels: model and describe import records, relations, validate and pairing, tables reads the vocabulary files of the description, and emit climbs its own file path to reach the framework's theme and imports osprey_connectors.safety_file. The framework's facility CLI imports the panels. Beside it, third-party reaches: click in nine description modules, and kinds into pyaml_cs_osprey. Warn edges are the ones the ratchet lists; each is an allowed entry today and fails the check once its phase has passed. The right half is the ratchet, drawn by edge class and the phase that removes it, not entry by entry. Phase 2, the panels seam: panels to facility code, the model and describe imports and the tables read of the vocabulary; after it the panels read facility.json only. Phase 3, the facility untangle: every description edge into the framework, the views helpers, utils.facility, registry.mcp, the CLI, deployment, config paths, the osprey.simulation root and the engine implementations such as pyat; the edges to click and to pyaml_cs_osprey; the engine contract's osprey.simulation.engines spelling, which moves to osprey_connectors; and any description edge to the panels; this breaks the import cycle. Phase 4, the facility package: framework edges into description modules outside the public API, such as the CLI's read of the MML layer data, after which the public API is protected. Phase 5, the panels package: the framework CLI's import of the panels, the panels' climb to the framework theme, which becomes a theme file passed in, and the panels' import of osprey_connectors.safety_file. Phase 6, release wiring, removes no edge: both packages tag and publish. Footer: the ratchet only shrinks; an edge of none of these classes fails the boundary check today.</desc>
