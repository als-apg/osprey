<div class="osprey-diagram">
<svg viewBox="0 0 1000 600" role="img" aria-labelledby="fpt-title fpt-desc">
  <title id="fpt-title">Today versus target: the description as its own package, the panels still inside the framework, and the edges the boundary ratchet lists, grouped by the phase that removes them</title>
  <desc id="fpt-desc">Two halves. The left half is today. The description is its own package, packages/osprey-facility, import root osprey_facility: some 25 modules such as records, combine, build, validate, render, scenarios, compute, layers, kinds, sessions and the schema. It imports no framework code, no click and no pyaml_cs_osprey, and the framework imports it through its public modules only. The panels code still lives in the framework, at src/osprey/facility/panels: it reads facility.json only and imports no description module, and emit climbs its own file path to reach the framework's theme and imports osprey_connectors.safety_file. The framework's facility CLI imports the panels. No third-party reach is listed. Warn edges are the ones the ratchet lists; each is an allowed entry today and fails the check once its phase has passed. The right half is the ratchet, drawn by edge class and the phase that removes it, not entry by entry. Phase 2, the panels seam, is done and lists no edge: the panels read facility.json only. Phase 3, the facility untangle, is done and lists no edge: it removed every description edge into the framework, the edges to click and to pyaml_cs_osprey, and the engine contract's osprey.simulation.engines spelling, and broke the import cycle. Phase 4, the facility package, is done and lists no edge: it removed the framework's reaches into description modules outside the public API, such as the CLI's read of the MML layer data. Phase 5, the panels package: the framework CLI's import of the panels, the panels' climb to the framework theme, which becomes a theme file passed in, and the panels' import of osprey_connectors.safety_file. Phase 6, release wiring, removes no edge: both packages tag and publish. Footer: the ratchet only shrinks; an edge of none of these classes fails the boundary check today.</desc>

    <marker id="fpt-arr" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse"><polygon points="0,0 8,3 0,6" style="fill: var(--od-muted)"/></marker>
    <marker id="fpt-arr-warn" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse"><polygon points="0,0 8,3 0,6" style="fill: var(--od-warn)"/></marker>
  </defs>

  <text class="te" x="520" y="32">TARGET · THE RATCHET BY EDGE CLASS AND REMOVING PHASE</text>
  <line class="divider" x1="500" y1="44" x2="500" y2="556"/>

  <!-- today: the description package -->
  <rect class="zone" x="20" y="50" width="290" height="164" rx="6"/>

  <text class="ts" x="44" y="116">~25 modules: records combine build</text>
  <text class="ts" x="44" y="130">validate render scenarios compute</text>
  <text class="ts" x="44" y="144">layers kinds sessions schema …</text>
  <text class="ts t-acc" x="44" y="176">imports no framework, no click,</text>
  <text class="ts t-acc" x="44" y="190">no pyaml_cs_osprey; no cycle</text>

  <!-- today: the panels, still in the framework tree -->

  <text class="te" x="32" y="240">SRC/OSPREY/FACILITY/PANELS/</text>

  <rect class="nb-warn" x="32" y="250" width="266" height="100" rx="6"/>
  <text class="ta ta-warn" x="44" y="268">PANELS · FACILITY/PANELS/</text>
  <text class="ts" x="44" y="286">reads facility.json only,</text>
  <text class="ts" x="44" y="300">  no description import</text>
  <text class="ts" x="44" y="324">emit → framework theme (path climb)</text>
  <text class="ts" x="44" y="338">emit → osprey_connectors.safety_file</text>

  <!-- today: framework -->
  <rect class="nb" x="350" y="80" width="130" height="270" rx="6"/>
  <text class="ta" x="362" y="98">OSPREY</text>
  <text class="ta" x="362" y="110">FRAMEWORK</text>
  <text class="ts" x="362" y="130">views</text>
  <text class="ts" x="362" y="144">settings</text>
  <text class="ts" x="362" y="158">bundled</text>
  <text class="ts" x="362" y="172">utils.facility</text>
  <text class="ts" x="362" y="186">cli · deployment</text>
  <text class="ts" x="362" y="200">simulation</text>
  <text class="ts" x="362" y="214">  engines (pyat …)</text>
  <text class="ts" x="362" y="292">cli facility</text>
  <text class="ts" x="362" y="324">theme</text>

  <!-- today: edges -->
  <line class="e" x1="350" y1="150" x2="300" y2="150" marker-end="url(#fpt-arr)"/>
  <text class="ta" x="303" y="144">imports</text>

  <text class="ts" x="32" y="424">none listed: each side imports only its</text>

  <rect class="nb-st" x="520" y="50" width="460" height="70" rx="6"/>
  <text class="ta" x="532" y="68">PHASE 2 · PANELS SEAM · DONE</text>
  <text class="ts" x="532" y="86">lists no edge</text>
  <text class="ts t-acc" x="532" y="104">the panels read facility.json only</text>

  <rect class="nb-st" x="520" y="148" width="460" height="130" rx="6"/>
  <text class="ta" x="532" y="166">PHASE 3 · FACILITY UNTANGLE · DONE</text>
  <text class="ts" x="532" y="184">removed description → framework: views helpers, utils.facility,</text>
  <text class="ts" x="532" y="198">  registry.mcp, CLI, deployment, config paths, the</text>
  <text class="ts" x="532" y="212">  osprey.simulation root, engine implementations (pyat …)</text>
  <text class="ts" x="532" y="226">removed description → click, → pyaml_cs_osprey</text>
  <text class="ts" x="532" y="240">the engine contract's osprey. spelling → osprey_connectors</text>
  <text class="ts" x="532" y="254">lists no edge</text>
  <text class="ts t-acc" x="532" y="268">the import cycle is gone</text>

  <rect class="nb-st" x="520" y="288" width="460" height="74" rx="6"/>
  <text class="ta" x="532" y="306">PHASE 4 · FACILITY PACKAGE · DONE</text>
  <text class="ts" x="532" y="324">removed framework → description modules outside the public</text>
  <text class="ts" x="532" y="338">  API, such as the CLI's read of the MML layer data</text>
  <text class="ts t-acc" x="532" y="352">lists no edge; the public API is protected</text>

  <rect class="nb-bnd" x="520" y="372" width="460" height="88" rx="6"/>
  <text class="ta ta-warn" x="532" y="390">PHASE 5 · PANELS PACKAGE</text>
  <text class="ts" x="532" y="408">framework CLI → panels</text>
  <text class="ts" x="532" y="422">panels → framework theme by path climb; a theme file is passed in</text>
  <text class="ts" x="532" y="436">panels → osprey_connectors.safety_file</text>
  <text class="ts t-acc" x="532" y="450">after it, the ratchet is empty</text>

  <rect class="nb-st" x="520" y="470" width="460" height="56" rx="6"/>
  <text class="ta" x="532" y="488">PHASE 6 · RELEASE WIRING</text>
  <text class="ts" x="532" y="506">removes no edge: osprey-facility and osprey-panels</text>
  <text class="ts" x="532" y="520">tag and publish on their own streams</text>

  <text class="ts" x="20" y="582">The ratchet only shrinks: each phase deletes its classes; an edge of none of these classes fails the boundary check today.</text>
</svg>
</div>
