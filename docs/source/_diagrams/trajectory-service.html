<div class="osprey-diagram">
<svg viewBox="0 0 1120 440" role="img" aria-labelledby="trajectory-service-title trajectory-service-desc">
  <title id="trajectory-service-title">The trajectory service: two doors, one declaration, one state</title>
  <desc id="trajectory-service-desc">Two hops reach the trajectory service, both through the web terminal's panel proxy. The operator's browser calls the proxy at the panel's API path, which leads to the panel door. The agent calls the trajectory MCP server, which bounds each call by the service's own budgets and calls the proxy at the agent's API path with the panel token, which leads to the agent door, the door that also checks the launch token. The proxy drops any owner a request claims, adds the terminal's secret, and on the agent's hop the service's launch token as well; it sets no read bound on either hop. The service's shared web gate admits on the secret and names its account as the owner. Both doors hand the owner to one admission check and one worker, which takes the target's guarded-run lock before it acts. The service reads one declaration at start, the measurement file's trajectory block, which names the BPM devices, the operator settings and the chain's steps. Every action changes one state per target, the snapshot with its setup and SolveConfig, which both doors read.</desc>

    </marker>
  </defs>
