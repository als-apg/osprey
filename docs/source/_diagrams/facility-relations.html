<div class="osprey-diagram">

  <title id="fr-title">Relation claims: the records they come from, the standing the build gives them, the place a located_in claim projects, and the views that read either</title>
  <desc id="fr-desc">Read left to right in four columns. Column 1, the records. Relations, in records/relations.yaml: each claim names a type, a subject and an object, a basis of stated or inferred (an inferred claim names its rule), and a source citing a document, its version, its state and a locator; for example SR/QF05-PS located_in HALL/ROW3/RK07. Documents, in documents.yaml: each has an id, a title, a kind and a system, such as rack-layout and cable-schedule. Policy, in policy.yaml, is optional: a precedence of document kinds per relation type, and stated_over_inferred, true unless set false. Places and devices, in records/places.yaml and records/devices.yaml, and groups, are the ends a claim names; a device may have no place of its own. Column 2, standing. A claim whose shape breaks a rule stops the build with relation-invalid: an end naming no device, place or group, or more than one; a kind the type does not allow at that end; basis inferred without a rule; a required attribute left out; or a subject equal to its object. Sound claims, with the documents and the policy, get a standing per key: the claims on one key group by the object they state; with a policy they rank by the precedence of their document's kind, then stated before inferred. A claim is accepted when its key has one object or its group ranks strictly best, contested when the objects disagree and no group wins, and superseded when it ranks below the winner. The demo has 16 accepted and 2 contested claims. Standing raises warnings, and the build goes on: relation-contested, one per key a dispute leaves unsettled; relation-coarse, one per type, for a claim with a place end where the type allows a device, or with a key attribute, port or unit left out; and also identity-ambiguous, part-cycle and relation-stub. Column 3, projection. Accepted located_in claims give Device.place, only when the device has no place yet (an authored place, a fix, an imported place or a span comes first), no claim on its key is contested, and the accepted claims that are not coarse name exactly one place. The device then carries provenance.place_from: relation; the claim's unit is not copied. In the demo SR/BPM13-EL takes HALL/ROW3/RK08, one place with no dispute; SR/QF05-PS takes no place, because rack-layout and cable-schedule disagree, so its key is contested and warned. Column 4, views. The graph, data/graph/facility.ttl, reads every standing: an accepted claim is an edge under its type's predicate, such as poweredBy, cabledTo or locatedIn; a contested claim is an edge under the predicate's Contested twin, such as locatedInContested; a superseded claim is no edge. The claims setting, all, contested or none, chooses which claims also get a narad_sem:Claim node. basis: stated drops the inferred claims, and the locatedIn of a projected place that no stated claim backs. The views that read the projected place: facts, with its place counts and the classes of unplaced devices; the channel finder in hierarchical mode, whose levels come from the places that hold channels; and the channel finder in middle_layer mode, whose System is the top place of the device. The views that read no relations: the channel finder in in_context mode, pyaml, simulator, bluesky, limits and benchmarks; a claim changes none of them. Footer: warnings never stop the build, relation-invalid does; a disputed key projects nothing, and its warning is the report.</desc>

  <text class="ts" x="285" y="436">relation-contested · per key</text>
  <text class="ts" x="285" y="450">a dispute leaves unsettled</text>
  <text class="ts" x="285" y="468">relation-coarse · per type</text>
  <text class="ts" x="285" y="482">a place end where a device fits;</text>
  <text class="ts" x="285" y="496">a key attribute, port or unit</text>
  <text class="ts" x="285" y="510">left out</text>
  <text class="ts" x="285" y="528">+ identity-ambiguous, part-cycle, …</text>

  <text class="ta ta-acc" x="642" y="143" text-anchor="middle">EVERY STANDING</text>

  <line class="e-acc" x1="471" y1="274" x2="526" y2="274" marker-end="url(#fr-arr-acc)"/>

  <!-- 3. projection -->
  <rect class="nb-foc" x="526" y="170" width="210" height="215" rx="6"/>
  <text class="ta" x="538" y="188">LOCATED_IN → DEVICE.PLACE</text>
  <text class="ts" x="538" y="206">only when:</text>
  <text class="ts" x="538" y="224">· the device has no place yet</text>
  <text class="ts" x="538" y="238">(authored, fix, imported or</text>
  <text class="ts" x="538" y="252">span come first)</text>
  <text class="ts" x="538" y="270">· no claim on its key contested</text>
