<div class="osprey-diagram">
<svg viewBox="0 0 960 330" role="img" aria-labelledby="testing-rings-title testing-rings-desc">
  <title id="testing-rings-title">How OSPREY is tested: five rings that gate a change, two that judge something else</title>
  <desc id="testing-rings-desc">Five rings, each adding one real thing, gate a pull request: the code in process, the safety hooks without a model, the machine as simulation bundles and the Virtual Accelerator, the agent with a real model and a judge, and the deployed container stacks. The same machinery then judges two other defendants: the model, on the benchmark board, and the live facility deployment, through osprey health and osprey audit. Markers are the hops that move a test between lanes.</desc>
  <defs>
    <marker id="testing-rings-arr" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0,0 8,3 0,6" fill="context-stroke"/>
    </marker>
  </defs>

  <!-- the gating zone -->
  <rect class="zone" x="8" y="40" width="684" height="178" rx="8"/>
  <text class="te" x="20" y="30">WHAT GATES A PULL REQUEST · A RED BLAMES THE CHANGE</text>
  <text class="te" x="712" y="30">SAME MACHINERY, ANOTHER DEFENDANT</text>

  <!-- ring to ring: each adds one real thing -->
  <line class="e" x1="140" y1="112" x2="152" y2="112" marker-end="url(#testing-rings-arr)"/>
  <line class="e" x1="276" y1="112" x2="288" y2="112" marker-end="url(#testing-rings-arr)"/>
  <line class="e" x1="412" y1="112" x2="424" y2="112" marker-end="url(#testing-rings-arr)"/>
  <line class="e" x1="548" y1="112" x2="560" y2="112" marker-end="url(#testing-rings-arr)"/>
  <!-- the subject flips: the same machinery, pointed at something else -->
  <line class="e-acc e-dash" x1="692" y1="112" x2="706" y2="112" marker-end="url(#testing-rings-arr)"/>
  <line class="e-acc e-dash" x1="824" y1="112" x2="832" y2="112" marker-end="url(#testing-rings-arr)"/>

  <!-- ring 1 -->
  <rect class="mask" x="20" y="56" width="120" height="112" rx="6"/>
  <rect class="nb" x="20" y="56" width="120" height="112" rx="6"/>
  <text class="tn" x="80" y="78" text-anchor="middle">1 · the code</text>
  <text class="ts" x="80" y="96" text-anchor="middle">in process, no model</text>
  <text class="ts" x="80" y="110" text-anchor="middle">unit · static tiers</text>
  <text class="ts" x="80" y="124" text-anchor="middle">1800 files</text>
  <text class="ta" x="80" y="152" text-anchor="middle">every push</text>
  <!-- ring 2 -->
  <rect class="mask" x="156" y="56" width="120" height="112" rx="6"/>
  <rect class="nb" x="156" y="56" width="120" height="112" rx="6"/>
  <text class="tn" x="216" y="78" text-anchor="middle">2 · the hooks</text>
  <text class="ts" x="216" y="96" text-anchor="middle">hooks, no model</text>
  <text class="ts" x="216" y="110" text-anchor="middle">unit + chain smoke</text>
  <text class="ts" x="216" y="124" text-anchor="middle">the rules it is told</text>
  <text class="ta" x="216" y="152" text-anchor="middle">every push</text>
  <!-- ring 3 -->
  <rect class="mask" x="292" y="56" width="120" height="112" rx="6"/>
  <rect class="nb" x="292" y="56" width="120" height="112" rx="6"/>
  <text class="tn" x="352" y="78" text-anchor="middle">3 · the machine</text>
  <text class="ts" x="352" y="96" text-anchor="middle">simulation bundles</text>
  <text class="ts" x="352" y="110" text-anchor="middle">VA on real EPICS</text>
  <text class="ts" x="352" y="124" text-anchor="middle">pinned, no model</text>
  <text class="ta" x="352" y="152" text-anchor="middle">every push · every PR</text>
  <!-- ring 4 -->
  <rect class="mask" x="428" y="56" width="120" height="112" rx="6"/>
  <rect class="nb-foc" x="428" y="56" width="120" height="112" rx="6"/>
  <text class="tn" x="488" y="78" text-anchor="middle">4 · the model</text>
  <text class="ts" x="488" y="96" text-anchor="middle">an agent via the SDK</text>
  <text class="ts" x="488" y="110" text-anchor="middle">e2e lanes · Tier 3</text>
  <text class="ts" x="488" y="124" text-anchor="middle">trace floor + judge</text>
  <text class="ta ta-acc" x="488" y="152" text-anchor="middle">full-ci label</text>
  <!-- ring 5 -->
  <rect class="mask" x="564" y="56" width="120" height="112" rx="6"/>
  <rect class="nb" x="564" y="56" width="120" height="112" rx="6"/>
  <text class="tn" x="624" y="78" text-anchor="middle">5 · the stack</text>
  <text class="ts" x="624" y="96" text-anchor="middle">containers, no model</text>
  <text class="ts" x="624" y="110" text-anchor="middle">one lane per stack</text>
  <text class="ts" x="624" y="124" text-anchor="middle">built and read back</text>
  <text class="ta" x="624" y="152" text-anchor="middle">every PR</text>

  <!-- what each ring adds -->
  <text class="ta" x="80" y="196" text-anchor="middle">real code</text>
  <text class="ta" x="216" y="196" text-anchor="middle">+ real hooks</text>
  <text class="ta" x="352" y="196" text-anchor="middle">+ a real machine</text>
  <text class="ta" x="488" y="196" text-anchor="middle">+ a real model</text>
  <text class="ta" x="624" y="196" text-anchor="middle">+ real containers</text>

  <!-- the two subject flips -->
  <rect class="mask" x="706" y="56" width="118" height="112" rx="6"/>
  <rect class="nb-ext" x="706" y="56" width="118" height="112" rx="6"/>
  <text class="tn" x="765" y="78" text-anchor="middle">6 · the model</text>
  <text class="ts" x="765" y="96" text-anchor="middle">on trial: the board</text>
  <text class="ts" x="765" y="110" text-anchor="middle">capability · harness</text>
  <text class="ts" x="765" y="124" text-anchor="middle">Tier 2, never a gate</text>
  <text class="ta" x="765" y="152" text-anchor="middle">on demand</text>
  <rect class="mask" x="832" y="56" width="118" height="112" rx="6"/>
  <rect class="nb-ext" x="832" y="56" width="118" height="112" rx="6"/>
  <text class="tn" x="891" y="78" text-anchor="middle">7 · the facility</text>
  <text class="ts" x="891" y="96" text-anchor="middle">a live deployment</text>
  <text class="ts" x="891" y="110" text-anchor="middle">health · audit</text>
  <text class="ts" x="891" y="124" text-anchor="middle">its stack, in use</text>
  <text class="ta" x="891" y="152" text-anchor="middle">every run · on request</text>
  <text class="ta ta-acc" x="765" y="196" text-anchor="middle">ring 4, per model</text>
  <text class="ta ta-acc" x="891" y="196" text-anchor="middle">ring 5, in service</text>

  <!-- markers are hops -->
  <text class="te" x="20" y="252">MARKERS ARE HOPS · WHERE A TEST RUNS INSTEAD</text>
  <rect class="nb-st" x="20" y="262" width="166" height="40" rx="6"/>
  <text class="ts" x="103" y="278" text-anchor="middle">slow</text>
  <text class="ta" x="103" y="293" text-anchor="middle">out of the fast local loop</text>
  <rect class="nb-st" x="198" y="262" width="166" height="40" rx="6"/>
  <text class="ts" x="281" y="278" text-anchor="middle">pty · wall_clock</text>
  <text class="ta" x="281" y="293" text-anchor="middle">a serial step, run alone</text>
  <rect class="nb-st" x="376" y="262" width="166" height="40" rx="6"/>
  <text class="ts" x="459" y="278" text-anchor="middle">dockerbuild · qmd</text>
  <text class="ta" x="459" y="293" text-anchor="middle">a lane of its own</text>
  <rect class="nb-st" x="554" y="262" width="166" height="40" rx="6"/>
  <text class="ts" x="637" y="278" text-anchor="middle">model_free</text>
  <text class="ta" x="637" y="293" text-anchor="middle">the lane that holds no key</text>
  <rect class="nb-st" x="732" y="262" width="212" height="40" rx="6"/>
  <text class="ts" x="838" y="278" text-anchor="middle">agentic_benchmark · harness_benchmark</text>
  <text class="ta" x="838" y="293" text-anchor="middle">which lane the board scores it in</text>

  <text class="ta ta-warn" x="480" y="322" text-anchor="middle">a tier numbers the cost of a proof; whether it gates a pull request is a separate property, and Tier 2 is the rung that measures instead</text>
</svg>
</div>
