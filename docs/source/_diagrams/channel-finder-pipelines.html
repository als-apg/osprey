<div class="osprey-diagram">
<svg viewBox="0 0 960 364" role="img" aria-labelledby="cf-pipelines-title cf-pipelines-desc">
  <title id="cf-pipelines-title">The three channel-finder pipelines</title>
  <desc id="cf-pipelines-desc">The three pipelines are not size tiers of one design — each takes a differently shaped channel database, resolves a query by a different mechanism, and is exposed through its own MCP server. In-context puts the whole database in one prompt; hierarchical selects recursively level by level; middle layer runs a React agent over query tools.</desc>

  <!-- selection band -->
  <text class="te" x="16" y="42">SELECTION</text>
  <rect class="zone" x="156" y="16" width="774" height="44" rx="4"/>
  <text class="ts" x="172" y="36">pipeline_mode set → that pipeline.</text>
  <text class="ts" x="172" y="52">unset → the first pipeline with a database configured, preferring middle_layer › hierarchical › in_context</text>

  <!-- column headers -->
  <text class="tn" x="281" y="84" text-anchor="middle">in_context</text>
  <text class="tn" x="543" y="84" text-anchor="middle">hierarchical</text>
  <text class="tn" x="805" y="84" text-anchor="middle">middle_layer</text>
  <line class="divider" x1="156" y1="94" x2="406" y2="94"/>
  <line class="divider" x1="418" y1="94" x2="668" y2="94"/>
  <line class="divider" x1="680" y1="94" x2="930" y2="94"/>

  <!-- row 1 · database shape -->
  <text class="te" x="16" y="152">DATABASE</text>
  <text class="te" x="16" y="166">SHAPE</text>
  <rect class="nb" x="156" y="112" width="250" height="72" rx="6"/>
  <text class="tn" x="281" y="136" text-anchor="middle">flat JSON</text>
  <text class="ts" x="281" y="153" text-anchor="middle">standalone entries plus</text>
  <text class="ts" x="281" y="167" text-anchor="middle">template entries per family</text>
  <rect class="nb" x="418" y="112" width="250" height="72" rx="6"/>
  <text class="tn" x="543" y="136" text-anchor="middle">nested tree</text>
  <text class="ts" x="543" y="153" text-anchor="middle">levels + naming_pattern</text>
  <text class="ts" x="543" y="167" text-anchor="middle">{system}:{family}[{device}]…</text>
  <rect class="nb" x="680" y="112" width="250" height="72" rx="6"/>
  <text class="tn" x="805" y="136" text-anchor="middle">MML functional</text>
  <text class="ts" x="805" y="153" text-anchor="middle">System → Family →</text>
  <text class="ts" x="805" y="167" text-anchor="middle">Field → ChannelNames</text>

  <!-- row 2 · query mechanism -->
  <text class="te" x="16" y="243">QUERY</text>
  <text class="te" x="16" y="257">MECHANISM</text>
  <rect class="nb-foc" x="156" y="200" width="250" height="92" rx="6"/>
  <text class="tn" x="281" y="224" text-anchor="middle">one LLM call</text>
  <text class="ts" x="281" y="242" text-anchor="middle">the whole database sits</text>
  <text class="ts" x="281" y="256" text-anchor="middle">in the system prompt</text>
  <text class="ts" x="281" y="270" text-anchor="middle">no splitting, no retry</text>
  <rect class="nb-foc" x="418" y="200" width="250" height="92" rx="6"/>
  <text class="tn" x="543" y="224" text-anchor="middle">recursive selection</text>
  <text class="ts" x="543" y="242" text-anchor="middle">the model picks once</text>
  <text class="ts" x="543" y="256" text-anchor="middle">per level: system → family</text>
  <text class="ts" x="543" y="270" text-anchor="middle">→ device → field → subfield</text>
  <rect class="nb-foc" x="680" y="200" width="250" height="92" rx="6"/>
  <text class="tn" x="805" y="224" text-anchor="middle">React agent loop</text>
  <text class="ts" x="805" y="242" text-anchor="middle">calls query tools —</text>
  <text class="ts" x="805" y="256" text-anchor="middle">list_systems, inspect_fields,</text>
  <text class="ts" x="805" y="270" text-anchor="middle">list_channels, run_sql</text>

  <!-- row 3 · mcp server -->
  <text class="te" x="16" y="328">MCP SERVER</text>
  <rect class="nb-st" x="156" y="304" width="250" height="40" rx="6"/>
  <text class="ts" x="281" y="328" text-anchor="middle">channel_finder_in_context</text>
  <rect class="nb-st" x="418" y="304" width="250" height="40" rx="6"/>
  <text class="ts" x="543" y="328" text-anchor="middle">channel_finder_hierarchical</text>
  <rect class="nb-st" x="680" y="304" width="250" height="40" rx="6"/>
  <text class="ts" x="805" y="328" text-anchor="middle">channel_finder_middle_layer</text>
</svg>
</div>
