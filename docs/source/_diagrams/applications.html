<div class="osprey-diagram">
<svg viewBox="0 0 1100 720" role="img" aria-labelledby="applications-title applications-desc">
  <title id="applications-title">An application: projected by the build, judged by the one chain, behind its trust boundaries</title>
  <desc id="applications-desc">At build time apps/name/app.yml passes its checks before anything is written, then each container becomes a service on loopback and each login that shows the application gains a sidebar panel, a tool server whose write tools are its writes list, and an approval declaration. A write tool call from the OSPREY agent passes the login's control_system.writes ceiling, then the owner's per-machine switch position, which decides whether a person is asked, then the approval record whose approver is human, dispatch_policy or write_switch, and reaches the application's tool server, which checks the call again. A person opens the panel from its sidebar row, sourced from GET /api/panels; the terminal's proxy refuses a write method or a WebSocket on a login that does not arm the application, and the panel's backend runs the interfaces gate. Both paths end at the connector, through the command write for commands, and the connector asks the verdict on every put. Beside the paths stand the shell gate, which refuses an armed render beside an open shell, and the import boundary, which holds application code to the SDK.</desc>
  <defs>
    <marker id="applications-arr" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0,0 8,3 0,6" style="fill: var(--od-muted)"/>
    </marker>
  </defs>

  <!-- at build -->
  <rect class="zone" x="40" y="24" width="1020" height="136" rx="6"/>
  <text class="te" x="56" y="44">AT BUILD · BEFORE THE DEPLOYMENT RUNS</text>
  <line class="e" x1="284" y1="104" x2="320" y2="104" marker-end="url(#applications-arr)"/>
  <line class="e" x1="552" y1="104" x2="588" y2="104" marker-end="url(#applications-arr)"/>
  <line class="e" x1="820" y1="104" x2="856" y2="104" marker-end="url(#applications-arr)"/>
  <rect class="mask" x="56" y="56" width="228" height="92" rx="6"/>
  <rect class="nb-in" x="56" y="56" width="228" height="92" rx="6"/>
  <text class="tn" x="170" y="84" text-anchor="middle">apps/&lt;name&gt;/app.yml</text>
  <text class="ts" x="170" y="102" text-anchor="middle">containers · a panel · a tool server</text>
  <text class="ts" x="170" y="116" text-anchor="middle">the deployment's own code</text>
  <rect class="mask" x="324" y="56" width="228" height="92" rx="6"/>
  <rect class="nb" x="324" y="56" width="228" height="92" rx="6"/>
  <text class="tn" x="438" y="84" text-anchor="middle">the checks first</text>
  <text class="ts" x="438" y="102" text-anchor="middle">manifests · each login's selection</text>
  <text class="ts" x="438" y="116" text-anchor="middle">ports · pinned versions · vendor files</text>
  <text class="ts" x="438" y="130" text-anchor="middle">refused before anything is written</text>
  <rect class="mask" x="592" y="56" width="228" height="92" rx="6"/>
  <rect class="nb" x="592" y="56" width="228" height="92" rx="6"/>
  <text class="tn" x="706" y="84" text-anchor="middle">for the deployment</text>
  <text class="ts" x="706" y="102" text-anchor="middle">each container, a service</text>
  <text class="ts" x="706" y="116" text-anchor="middle">its port published on loopback</text>
  <rect class="mask" x="860" y="56" width="184" height="92" rx="6"/>
  <rect class="nb" x="860" y="56" width="184" height="92" rx="6"/>
  <text class="tn" x="952" y="84" text-anchor="middle">for each login</text>
  <text class="ts" x="952" y="102" text-anchor="middle">a panel block</text>
  <text class="ts" x="952" y="116" text-anchor="middle">a server and its writes: list</text>
  <text class="ts" x="952" y="130" text-anchor="middle">approval declarations</text>

  <!-- a tool call -->
  <rect class="zone" x="40" y="176" width="1020" height="148" rx="6"/>
  <text class="te" x="56" y="196">A WRITE TOOL CALL · THE ONE CHAIN</text>
  <line class="e" x1="228" y1="260" x2="260" y2="260" marker-end="url(#applications-arr)"/>
  <line class="e" x1="432" y1="260" x2="464" y2="260" marker-end="url(#applications-arr)"/>
  <line class="e" x1="636" y1="260" x2="668" y2="260" marker-end="url(#applications-arr)"/>
  <line class="e" x1="840" y1="260" x2="872" y2="260" marker-end="url(#applications-arr)"/>
  <rect class="mask" x="56" y="208" width="172" height="104" rx="6"/>
  <rect class="nb-in" x="56" y="208" width="172" height="104" rx="6"/>
  <text class="tn" x="142" y="236" text-anchor="middle">OSPREY agent</text>
  <text class="ts" x="142" y="254" text-anchor="middle">mcp__&lt;app&gt;__&lt;tool&gt;</text>
  <text class="ts" x="142" y="268" text-anchor="middle">on the session's machine</text>
  <rect class="mask" x="260" y="208" width="172" height="104" rx="6"/>
  <rect class="nb" x="260" y="208" width="172" height="104" rx="6"/>
  <text class="tn" x="346" y="236" text-anchor="middle">the login's tier</text>
  <text class="ts" x="346" y="254" text-anchor="middle">a ceiling:</text>
  <text class="ts" x="346" y="268" text-anchor="middle">never · asked · allowed</text>
  <rect class="mask" x="464" y="208" width="172" height="104" rx="6"/>
  <rect class="nb" x="464" y="208" width="172" height="104" rx="6"/>
  <text class="tn" x="550" y="236" text-anchor="middle">the switch's position</text>
  <text class="ts" x="550" y="254" text-anchor="middle">the owner's, per machine</text>
  <text class="ts" x="550" y="268" text-anchor="middle">decides if a person is asked</text>
  <rect class="mask" x="668" y="208" width="172" height="104" rx="6"/>
  <rect class="nb" x="668" y="208" width="172" height="104" rx="6"/>
  <text class="tn" x="754" y="236" text-anchor="middle">the approval record</text>
  <text class="ts" x="754" y="254" text-anchor="middle">the declaration describes</text>
  <text class="ts" x="754" y="268" text-anchor="middle">and binds the call</text>
  <text class="ts" x="754" y="282" text-anchor="middle">human · dispatch_policy</text>
  <text class="ts" x="754" y="296" text-anchor="middle">write_switch</text>
  <rect class="mask" x="872" y="208" width="172" height="104" rx="6"/>
  <rect class="nb" x="872" y="208" width="172" height="104" rx="6"/>
  <text class="tn" x="958" y="236" text-anchor="middle">the tool server</text>
  <text class="ts" x="958" y="254" text-anchor="middle">checks the call again</text>
  <text class="ts" x="958" y="268" text-anchor="middle">and the machine it names</text>

  <!-- at the panel -->
  <rect class="zone" x="40" y="340" width="1020" height="136" rx="6"/>
  <text class="te" x="56" y="360">A PERSON AT THE PANEL · THE WEB TERMINAL</text>
  <line class="e" x1="228" y1="420" x2="260" y2="420" marker-end="url(#applications-arr)"/>
  <line class="e" x1="432" y1="420" x2="464" y2="420" marker-end="url(#applications-arr)"/>
  <line class="e" x1="836" y1="420" x2="872" y2="420" marker-end="url(#applications-arr)"/>
  <rect class="mask" x="56" y="372" width="172" height="92" rx="6"/>
  <rect class="nb-in" x="56" y="372" width="172" height="92" rx="6"/>
  <text class="tn" x="142" y="400" text-anchor="middle">a sidebar row</text>
  <text class="ts" x="142" y="418" text-anchor="middle">from GET /api/panels</text>
  <text class="ts" x="142" y="432" text-anchor="middle">available while its url</text>
  <text class="ts" x="142" y="446" text-anchor="middle">is published</text>
  <rect class="mask" x="260" y="372" width="172" height="92" rx="6"/>
  <rect class="nb-bnd" x="260" y="372" width="172" height="92" rx="6"/>
  <text class="tn" x="346" y="400" text-anchor="middle">the proxy write refusal</text>
  <text class="ts" x="346" y="418" text-anchor="middle">/panel/&lt;id&gt;</text>
  <text class="ts" x="346" y="432" text-anchor="middle">writes and sockets refused</text>
  <text class="ts" x="346" y="446" text-anchor="middle">where the login does not arm</text>
  <rect class="mask" x="464" y="372" width="372" height="92" rx="6"/>
  <rect class="nb" x="464" y="372" width="372" height="92" rx="6"/>
  <text class="tn" x="650" y="400" text-anchor="middle">the panel's backend</text>
  <text class="ts" x="650" y="418" text-anchor="middle">first-party: framed as the deployment's own, never capped</text>
  <text class="ts" x="650" y="432" text-anchor="middle">runs the interfaces gate on its own routes</text>
  <text class="ts" x="650" y="446" text-anchor="middle">Origin: null and stray form bodies refused</text>
  <line class="e" x1="938" y1="312" x2="938" y2="372" marker-end="url(#applications-arr)"/>
  <rect class="mask" x="872" y="372" width="132" height="92" rx="6"/>
  <rect class="nb-bnd" x="872" y="372" width="132" height="92" rx="6"/>
  <text class="tn" x="938" y="400" text-anchor="middle">the command write</text>
  <text class="ts" x="938" y="418" text-anchor="middle">commands only:</text>
  <text class="ts" x="938" y="432" text-anchor="middle">a set refused</text>
  <text class="ts" x="938" y="446" text-anchor="middle">whole, lock held</text>

  <!-- the connector -->
  <line class="e" x1="1024" y1="312" x2="1024" y2="492" marker-end="url(#applications-arr)"/>
  <line class="e" x1="938" y1="464" x2="938" y2="492" marker-end="url(#applications-arr)"/>
  <line class="e" x1="650" y1="464" x2="650" y2="492" marker-end="url(#applications-arr)"/>
  <rect class="mask" x="464" y="496" width="580" height="60" rx="6"/>
  <rect class="nb-foc" x="464" y="496" width="580" height="60" rx="6"/>
  <text class="tn" x="754" y="520" text-anchor="middle">the connector</text>
  <text class="ts" x="754" y="538" text-anchor="middle">the verdict on every put, then the limits, as for every write</text>
  <rect class="mask" x="56" y="496" width="376" height="60" rx="6"/>
  <rect class="nb-ext" x="56" y="496" width="376" height="60" rx="6"/>
  <text class="tn" x="244" y="520" text-anchor="middle">the machine</text>
  <text class="ts" x="244" y="538" text-anchor="middle">whichever one the session points at</text>
  <line class="e" x1="464" y1="526" x2="436" y2="526" marker-end="url(#applications-arr)"/>

  <!-- beside the paths -->
  <rect class="zone" x="40" y="572" width="1020" height="124" rx="6"/>
  <text class="te" x="56" y="592">BESIDE THE PATHS</text>
  <rect class="mask" x="56" y="604" width="486" height="80" rx="6"/>
  <rect class="nb-bnd" x="56" y="604" width="486" height="80" rx="6"/>
  <text class="tn" x="299" y="630" text-anchor="middle">the shell gate</text>
  <text class="ts" x="299" y="648" text-anchor="middle">a shell lifted on an asked or allowed tier fails the build</text>
  <text class="ts" x="299" y="662" text-anchor="middle">a launch token or write route beside a shell is refused at deploy</text>
  <rect class="mask" x="558" y="604" width="486" height="80" rx="6"/>
  <rect class="nb-bnd" x="558" y="604" width="486" height="80" rx="6"/>
  <text class="tn" x="801" y="630" text-anchor="middle">the import boundary</text>
  <text class="ts" x="801" y="648" text-anchor="middle">application code imports only osprey.apps.sdk,</text>
  <text class="ts" x="801" y="662" text-anchor="middle">osprey.facility.kinds and public osprey_connectors</text>
</svg>
</div>
