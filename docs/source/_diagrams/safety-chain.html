<div class="osprey-diagram">
<svg viewBox="0 0 1220 904" role="img" aria-labelledby="safety-chain-title safety-chain-desc">
  <title id="safety-chain-title">Four ways to change something on the machine, and what stands in the way of each</title>
  <desc id="safety-chain-desc">The deployment's settings — which machine it points at, whether writes are switched on for that machine, and whether the operator has narrowed it to read-only — are read by the gates. An operator asks the Osprey agent in plain language; every tool call that could write then passes the checks: are writes switched on, and does a human approve, which the operator answers at the terminal prompt; a channel write also passes a limits check on the way, which the other tools do not. Once approved, the call reaches its server: a channel write goes to the control-system server, which checks the limits once more; a Python run has its code read before it runs and then runs in its own guarded process; queueing a plan reaches the Bluesky queue, which the operator can also drive from the panel without those checks, and which needs a launch token to start or to take work while running, asks every channel the plan declares to answer before it starts, and checks each write as it happens; a Jupyter cell is run by the operator directly, and its kernel re-reads the settings before every cell. All four end at the connector, which checks the operator's narrowing on every write, checks the value against the limits where limits checking is on, sends the value, and, where the channel's policy asks for it, waits for the machine and reads the channel back.</desc>
  <defs>
    <marker id="safety-chain-arr" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0,0 8,3 0,6" style="fill: var(--od-muted)"/>
    </marker>
    <marker id="safety-chain-arr-acc" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0,0 8,3 0,6" style="fill: var(--od-accent)"/>
    </marker>
  </defs>

  <!-- settings band -->
  <rect class="mask" x="40" y="40" width="1120" height="64" rx="6"/>
  <rect class="nb-st" x="40" y="40" width="1120" height="64" rx="6"/>
  <text class="tn" x="60" y="62">Deployment settings, read by the gates below</text>
  <text class="ts" x="60" y="80">which machine the deployment points at · whether writes are switched on for it · whether the operator has narrowed it to read-only</text>
  <text class="ts" x="60" y="94">the machine and the narrowing are read fresh by the next check, the next cell, the next write · the writes switch in config.yml takes a rebuild</text>

  <!-- actors -->
  <line class="e-acc" x1="860" y1="152" x2="340" y2="152" marker-end="url(#safety-chain-arr-acc)"/>
  <rect class="mask" x="530" y="146" width="140" height="12" rx="2"/>
  <text class="ta ta-acc" x="600" y="155" text-anchor="middle">asks in plain language</text>

  <rect class="mask" x="40" y="124" width="300" height="56" rx="6"/>
  <rect class="nb-in" x="40" y="124" width="300" height="56" rx="6"/>
  <text class="tn" x="190" y="146" text-anchor="middle">Osprey agent</text>
  <text class="ts" x="190" y="162" text-anchor="middle">can only act by calling tools</text>

  <rect class="mask" x="860" y="124" width="300" height="56" rx="6"/>
  <rect class="nb nb-acc-stroke" x="860" y="124" width="300" height="56" rx="6"/>
  <text class="tn" x="1010" y="146" text-anchor="middle">Operator</text>
  <text class="ts" x="1010" y="162" text-anchor="middle">a person at the terminal</text>

  <!-- agent → checks -->
  <line class="e" x1="190" y1="180" x2="190" y2="220" marker-end="url(#safety-chain-arr)"/>
  <rect class="mask" x="130" y="194" width="120" height="12" rx="2"/>
  <text class="ta" x="190" y="203" text-anchor="middle">each tool call that could write</text>

  <!-- operator → approval -->
  <line class="e-acc" x1="1010" y1="180" x2="1010" y2="248" marker-end="url(#safety-chain-arr-acc)"/>
  <rect class="mask" x="1018" y="206" width="120" height="12" rx="2"/>
  <text class="ta ta-acc" x="1022" y="215">approves or refuses</text>

  <!-- operator → direct actions, below the checks -->
  <path class="e-acc" d="M1160,138 H1180 V400 H759 V412" marker-end="url(#safety-chain-arr-acc)"/>
  <line class="e-acc" x1="1005" y1="400" x2="1005" y2="412" marker-end="url(#safety-chain-arr-acc)"/>
  <rect class="mask" x="1024" y="394" width="142" height="12" rx="2"/>
  <text class="ta ta-acc" x="1095" y="403" text-anchor="middle">acts directly · no checks</text>

  <!-- checks zone -->
  <rect class="zone" x="40" y="224" width="1120" height="152" rx="6"/>
  <text class="te" x="56" y="242">CHECKS BEFORE A TOOL THAT COULD WRITE RUNS</text>

  <!-- channel write: through the limits check -->
  <line class="e" x1="380" y1="284" x2="430" y2="284" marker-end="url(#safety-chain-arr)"/>
  <line class="e" x1="770" y1="284" x2="820" y2="284" marker-end="url(#safety-chain-arr)"/>
  <rect class="mask" x="382" y="268" width="48" height="12" rx="2"/>
  <text class="ta" x="405" y="277" text-anchor="middle">a channel</text>
  <rect class="mask" x="382" y="292" width="48" height="12" rx="2"/>
  <text class="ta" x="405" y="301" text-anchor="middle">write</text>
  <!-- everything else: straight to approval -->
  <path class="e" d="M340,308 H400 V334 H800 V308 H820" marker-end="url(#safety-chain-arr)"/>
  <rect class="mask" x="500" y="328" width="200" height="12" rx="2"/>
  <text class="ta" x="600" y="337" text-anchor="middle">run Python · queue or start a plan</text>

  <rect class="mask" x="40" y="252" width="340" height="64" rx="6"/>
  <rect class="nb" x="40" y="252" width="340" height="64" rx="6"/>
  <text class="tn" x="210" y="274" text-anchor="middle">Are writes switched on?</text>
  <text class="ts" x="210" y="290" text-anchor="middle">the kill switch</text>
  <text class="ts" x="210" y="303" text-anchor="middle">writes off for this machine, or narrowed: refused</text>

  <rect class="mask" x="430" y="252" width="340" height="64" rx="6"/>
  <rect class="nb" x="430" y="252" width="340" height="64" rx="6"/>
  <text class="tn" x="600" y="274" text-anchor="middle">Is the value within limits?</text>
  <text class="ts" x="600" y="290" text-anchor="middle">channel writes only · in the database · writable · range</text>
  <text class="ts" x="600" y="303" text-anchor="middle">step size: left to the connector, which reads first</text>

  <rect class="mask" x="820" y="252" width="340" height="64" rx="6"/>
  <rect class="nb-foc" x="820" y="252" width="340" height="64" rx="6"/>
  <text class="tn" x="990" y="274" text-anchor="middle">Does a human approve?</text>
  <text class="ts" x="990" y="290" text-anchor="middle">the operator answers a prompt at the terminal</text>
  <text class="ts" x="990" y="303" text-anchor="middle">for Python, the exact code is shown in a review notebook</text>

  <text class="ts" x="56" y="354">how often approval is asked is set per tool: always · only when the request could write (the check reads the request itself) · never</text>
  <text class="ts" x="56" y="368">where no machine may be written at all, channel writes and plan queueing are switched off outright and Python is always asked · stopping a plan never is</text>

  <!-- approval → servers -->
  <path class="e" d="M990,316 V386 H130 V412" marker-end="url(#safety-chain-arr)"/>
  <line class="e" x1="376" y1="386" x2="376" y2="412" marker-end="url(#safety-chain-arr)"/>
  <line class="e" x1="603" y1="386" x2="603" y2="412" marker-end="url(#safety-chain-arr)"/>
  <rect class="mask" x="960" y="342" width="60" height="12" rx="2"/>
  <text class="ta" x="990" y="351" text-anchor="middle">approved</text>
  <rect class="mask" x="86" y="392" width="88" height="12" rx="2"/>
  <text class="ta" x="130" y="401" text-anchor="middle">channel write</text>
  <rect class="mask" x="343" y="392" width="66" height="12" rx="2"/>
  <text class="ta" x="376" y="401" text-anchor="middle">run Python</text>
  <rect class="mask" x="564" y="392" width="78" height="12" rx="2"/>
  <text class="ta" x="603" y="401" text-anchor="middle">queue a plan</text>

  <!-- column A · channel write -->
  <rect class="mask" x="40" y="416" width="180" height="56" rx="6"/>
  <rect class="nb" x="40" y="416" width="180" height="56" rx="6"/>
  <text class="tn" x="130" y="438" text-anchor="middle">control-system server</text>
  <text class="ts" x="130" y="454" text-anchor="middle">one call · one or more channels</text>
  <line class="e" x1="130" y1="472" x2="130" y2="492" marker-end="url(#safety-chain-arr)"/>
  <rect class="mask" x="40" y="496" width="180" height="84" rx="6"/>
  <rect class="nb" x="40" y="496" width="180" height="84" rx="6"/>
  <text class="tn" x="130" y="518" text-anchor="middle">the server checks again</text>
  <text class="ts" x="130" y="536" text-anchor="middle">the limits, once more</text>
  <text class="ts" x="130" y="549" text-anchor="middle">the machine is still the one</text>
  <text class="ts" x="130" y="562" text-anchor="middle">the operator approved</text>
  <line class="e" x1="130" y1="580" x2="130" y2="744" marker-end="url(#safety-chain-arr)"/>

  <!-- column B · run Python -->
  <rect class="mask" x="236" y="416" width="280" height="56" rx="6"/>
  <rect class="nb" x="236" y="416" width="280" height="56" rx="6"/>
  <text class="tn" x="376" y="438" text-anchor="middle">Python server</text>
  <text class="ts" x="376" y="454" text-anchor="middle">code the agent wrote · read-only or read-write</text>
  <line class="e" x1="376" y1="472" x2="376" y2="492" marker-end="url(#safety-chain-arr)"/>
  <rect class="mask" x="236" y="496" width="280" height="97" rx="6"/>
  <rect class="nb" x="236" y="496" width="280" height="97" rx="6"/>
  <text class="tn" x="376" y="518" text-anchor="middle">the code is read before it runs</text>
  <text class="ts" x="376" y="536" text-anchor="middle">dangerous patterns are refused</text>
  <text class="ts" x="376" y="549" text-anchor="middle">writes into the deployment's own files are refused</text>
  <text class="ts" x="376" y="562" text-anchor="middle">read-only code may not import client libraries</text>
  <text class="ts" x="376" y="575" text-anchor="middle">read-only code that spells a write is refused</text>
  <line class="e" x1="376" y1="593" x2="376" y2="613" marker-end="url(#safety-chain-arr)"/>
  <rect class="mask" x="236" y="617" width="280" height="110" rx="6"/>
  <rect class="nb-bnd" x="236" y="617" width="280" height="110" rx="6"/>
  <text class="tn" x="376" y="639" text-anchor="middle">the code runs in its own process</text>
  <text class="ts" x="376" y="657" text-anchor="middle">read-only code cannot write, even if it tries</text>
  <text class="ts" x="376" y="670" text-anchor="middle">client-library writes are checked against limits</text>
  <text class="ts" x="376" y="683" text-anchor="middle">it cannot write into the deployment's own files</text>
  <text class="ts" x="376" y="696" text-anchor="middle">it is stopped after a time limit</text>
  <text class="ts" x="376" y="709" text-anchor="middle">the result is saved before the process ends</text>
  <line class="e" x1="376" y1="727" x2="376" y2="744" marker-end="url(#safety-chain-arr)"/>

  <!-- column C · queue a plan -->
  <rect class="mask" x="532" y="416" width="142" height="56" rx="6"/>
  <rect class="nb" x="532" y="416" width="142" height="56" rx="6"/>
  <text class="tn" x="603" y="438" text-anchor="middle">Bluesky server</text>
  <text class="ts" x="603" y="454" text-anchor="middle">queue a plan · start it</text>
  <rect class="mask" x="690" y="416" width="142" height="56" rx="6"/>
  <rect class="nb nb-acc-stroke" x="690" y="416" width="142" height="56" rx="6"/>
  <text class="tn" x="761" y="434" text-anchor="middle">BLUESKY panel</text>
  <text class="ts" x="761" y="449" text-anchor="middle">operator clicks Start</text>
  <text class="ts" x="761" y="462" text-anchor="middle">skips the checks above</text>
  <line class="e" x1="603" y1="472" x2="603" y2="492" marker-end="url(#safety-chain-arr)"/>
  <line class="e" x1="761" y1="472" x2="761" y2="492" marker-end="url(#safety-chain-arr)"/>
  <rect class="mask" x="532" y="496" width="300" height="70" rx="6"/>
  <rect class="nb" x="532" y="496" width="300" height="70" rx="6"/>
  <text class="tn" x="682" y="518" text-anchor="middle">the queue</text>
  <text class="ts" x="682" y="536" text-anchor="middle">start, or add while it runs: needs a launch token</text>
  <text class="ts" x="682" y="549" text-anchor="middle">per lane and role · adds to a stopped queue need none</text>
  <line class="e" x1="682" y1="566" x2="682" y2="586" marker-end="url(#safety-chain-arr)"/>
  <rect class="mask" x="532" y="590" width="300" height="70" rx="6"/>
  <rect class="nb" x="532" y="590" width="300" height="70" rx="6"/>
  <text class="tn" x="682" y="612" text-anchor="middle">before and during a run</text>
  <text class="ts" x="682" y="630" text-anchor="middle">every channel the plan declares must answer first</text>
  <text class="ts" x="682" y="643" text-anchor="middle">each write: writes on for the machine? within limits?</text>
  <line class="e" x1="682" y1="660" x2="682" y2="744" marker-end="url(#safety-chain-arr)"/>
  <rect class="mask" x="576" y="694" width="212" height="14" rx="2"/>
  <text class="ts" x="682" y="704" text-anchor="middle">stopping a plan never needs a token</text>

  <!-- column D · Jupyter cell -->
  <rect class="mask" x="850" y="416" width="310" height="56" rx="6"/>
  <rect class="nb nb-acc-stroke" x="850" y="416" width="310" height="56" rx="6"/>
  <text class="tn" x="1005" y="434" text-anchor="middle">JUPYTER cell</text>
  <text class="ts" x="1005" y="449" text-anchor="middle">the operator runs it</text>
  <text class="ts" x="1005" y="462" text-anchor="middle">skips the checks above</text>
  <line class="e" x1="1005" y1="472" x2="1005" y2="492" marker-end="url(#safety-chain-arr)"/>
  <rect class="mask" x="850" y="496" width="310" height="84" rx="6"/>
  <rect class="nb" x="850" y="496" width="310" height="84" rx="6"/>
  <text class="tn" x="1005" y="518" text-anchor="middle">the notebook kernel</text>
  <text class="ts" x="1005" y="536" text-anchor="middle">starts with writes off · before each cell re-reads:</text>
  <text class="ts" x="1005" y="549" text-anchor="middle">which machine · writes on? · narrowed?</text>
  <text class="ts" x="1005" y="562" text-anchor="middle">a refused write is shown in the cell</text>
  <line class="e" x1="1005" y1="580" x2="1005" y2="744" marker-end="url(#safety-chain-arr)"/>
  <rect class="mask" x="866" y="592" width="278" height="14" rx="2"/>
  <text class="ts" x="1005" y="602" text-anchor="middle">agent edits stay in notebooks/ and artifacts/</text>

  <!-- connector band -->
  <rect class="mask" x="40" y="748" width="1120" height="68" rx="6"/>
  <rect class="nb nb-acc-stroke" x="40" y="748" width="1120" height="68" rx="6"/>
  <text class="tn" x="60" y="770">Connector — the last step before the machine</text>
  <text class="ts" x="60" y="788">checks the operator's narrowing on every write · where limits checking is on, checks the value against the limits: allowed range · step size · may this channel be written</text>
  <text class="ts" x="60" y="802">sends the value · where that channel's policy asks for it, waits for the machine to confirm and reads the channel back to compare</text>
  <line class="e" x1="600" y1="816" x2="600" y2="840" marker-end="url(#safety-chain-arr)"/>

  <!-- control system -->
  <rect class="mask" x="500" y="844" width="200" height="44" rx="6"/>
  <rect class="nb-ext" x="500" y="844" width="200" height="44" rx="6"/>
  <text class="tn" x="600" y="862" text-anchor="middle">control system</text>
  <text class="ts" x="600" y="877" text-anchor="middle">the machine</text>

</svg>
</div>
