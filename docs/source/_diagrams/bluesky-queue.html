  <line class="e" x1="568" y1="92" x2="688" y2="92" marker-end="url(#bluesky-queue-arr)"/>
  <path class="e-warn e-dash" d="M776,120 V152 Q776,160 768,160 H488 Q480,160 480,152 V120" marker-end="url(#bluesky-queue-arr)"/>

  <rect class="mask" x="590" y="168" width="76" height="12" rx="2"/>

  <rect class="mask" x="688" y="64" width="176" height="56" rx="6"/>
