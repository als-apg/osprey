<div class="osprey-diagram">

  <line class="e" x1="192" y1="52" x2="384" y2="52" marker-end="url(#connector-callers-arr)"/>
  <polyline class="e-warn e-dash" points="704,52 936,52 936,266 912,266" marker-end="url(#connector-callers-arr)"/>
  <line class="e" x1="112" y1="176" x2="112" y2="240" marker-end="url(#connector-callers-arr)"/>
  <line class="e" x1="288" y1="176" x2="288" y2="240" marker-end="url(#connector-callers-arr)"/>
  <line class="e" x1="464" y1="176" x2="464" y2="240" marker-end="url(#connector-callers-arr)"/>
  <line class="e" x1="640" y1="176" x2="640" y2="240" marker-end="url(#connector-callers-arr)"/>
  <line class="e" x1="816" y1="176" x2="816" y2="240" marker-end="url(#connector-callers-arr)"/>
  <line class="e-acc" x1="112" y1="292" x2="112" y2="352" marker-end="url(#connector-callers-arr)"/>
  <line class="e-acc" x1="288" y1="292" x2="288" y2="352" marker-end="url(#connector-callers-arr)"/>
  <line class="e-acc" x1="464" y1="292" x2="464" y2="352" marker-end="url(#connector-callers-arr)"/>
  <line class="e-acc" x1="640" y1="292" x2="640" y2="352" marker-end="url(#connector-callers-arr)"/>
  <line class="e-acc" x1="816" y1="292" x2="816" y2="352" marker-end="url(#connector-callers-arr)"/>
