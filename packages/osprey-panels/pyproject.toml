[build-system]
# setuptools-scm >= 9.2 for `scm.git.describe_command` below (the 8.x line hatch-vcs
# still admits has no `scm` table and refuses the keyword).
requires = ["hatchling", "hatch-vcs", "setuptools-scm>=9.2"]
build-backend = "hatchling.build"

[project]
name = "osprey-panels"
dynamic = ["version"]
description = "The OSPREY panel engine: control-room screens generated from a facility.json"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "BSD-3-Clause"}
# The only runtime dependency: the written screens are validated against the
# Screen-IR schema. The lower bound is the framework's own.
dependencies = [
    "jsonschema>=4.26,<5",
]

[project.urls]
Repository = "https://github.com/als-apg/osprey"
Issues = "https://github.com/als-apg/osprey/issues"

[project.scripts]
osprey-panels = "osprey_panels.cli:main"

[tool.hatch.version]
source = "vcs"
# The package is not published and has no release tags. `root` climbs to the
# repository; the describe glob matches no tag there, so every build is
# 0.0.postN+g…, and the framework's `v*` tags never number it. The describe
# command sits in the `scm.git` table, not the deprecated flat
# `git_describe_command` key, as in osprey-facility.
raw-options = { root = "../..", version_scheme = "post-release", scm = { git = { describe_command = "git describe --dirty --tags --long --abbrev=40 --match osprey-panels-v2[0-9][0-9][0-9].*" } } }

# What the panels promise the documents around them: the facility-document
# headers they read (`osprey_panels.document.READS`) and the Screen-IR version
# they write (`osprey_panels.screen_ir.SCREEN_IR_VERSION`).
#
# Rule: adding a read is additive and needs only this table. Dropping a read,
# or changing the emitted version, is a recorded retirement: the old value
# moves to `retired`, with its reason written beside it. A value the base
# revision listed must stay in `reads`, `emits` or `retired`; tests/osprey_panels_tests/test_stability_table.py
# holds both the code and that history to this table.
[tool.osprey-panels.compat]
reads = ["osprey.facility.facility/4"]
emits = "1.1"
retired = []

[tool.hatch.build.hooks.vcs]
version-file = "src/osprey_panels/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/osprey_panels"]

# Repository workflow, not package content: the package's checks module, which
# only the repository's check command reads, and `tools/`, the font-metrics
# generator and its font, which only a maintainer regenerating `metrics.py`
# runs.
[tool.hatch.build.targets.sdist]
exclude = ["repo_checks.py", "tools"]

# The package suite's test dependencies: a group, not an extra, so they never
# reach the wheel's metadata. `uv sync --package osprey-panels` installs it.
[dependency-groups]
dev = [
    "pytest",
    "pytest-timeout",
    "pytest-xdist",
    "fontTools",  # the font-metrics drift test reads the font the generator measured
]

# Read by the standalone lane; a run from the repository root uses the root's.
[tool.pytest.ini_options]
addopts = "-ra -v --tb=short --strict-markers --color=yes"
testpaths = ["tests"]
tmp_path_retention_policy = "failed"
markers = [
    "wheel_build: Tests that read a built osprey-panels wheel named by OSPREY_PANELS_WHEEL. Deselected from the root unit shards; the package's standalone CI job builds the wheel once and selects them.",
]
