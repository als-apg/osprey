[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "osprey-connectors"
dynamic = ["version"]
description = "Control-system and archiver connectors for OSPREY"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "BSD-3-Clause"}
dependencies = [
    "rich>=14.0.0",
    "PyYAML>=6.0.2",
    "python-dotenv>=1.1.0",
    "numpy>=2.2.6",
    "pandas>=2.2.3",
    "python-dateutil>=2.9.0",
    "pyepics",
    # pvAccess client for the EPICS connector's PVA transport. Core, not an
    # extra: extras get forgotten by deployments, and a platform marker would
    # strip p4p from exactly the arm64 images that need it. Wheels ship for
    # macOS universal2, linux x86_64 and windows, but NOT for linux aarch64 --
    # there p4p, pvxslibs and epicscorelibs build from source, which needs a C
    # toolchain. The project image's deps layer already stages and purges one
    # under the `setuptools<84` pip constraint, so containers are covered;
    # bare-metal arm64-linux installs need a compiler present. Note this is a
    # stricter reach than pyepics, which is a py3-none-any wheel that installs
    # anywhere and only fails at runtime if no libca is found.
    "p4p>=4.2",
    # MongoDB client for MongoDBArchiverConnector. Declared even though the
    # connector imports it inside connect(): the deferred import exists so
    # registration stays cheap, not to make the dependency optional.
    "pymongo>=4.17.0",
]

[tool.hatch.version]
source = "vcs"
# The package versions with the framework's calendar stream, from the same
# v-tags: both wheels are always built from one checkout and always carry the
# same number, so "which connectors goes with which framework" is never a
# question and a semantic version never has to decide what counts as minor.
# `root` climbs to the repository the tags live in; the describe command is the
# framework's own (see the root pyproject.toml for why the match glob exists —
# in short, the default glob would read the retired osprey-connectors-v0.1.0
# tag and the checkpoint-* tags).
raw-options = { root = "../..", version_scheme = "post-release", git_describe_command = "git describe --dirty --tags --long --abbrev=40 --match v[0-9]*" }

[tool.hatch.build.hooks.vcs]
version-file = "src/osprey_connectors/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/osprey_connectors"]
