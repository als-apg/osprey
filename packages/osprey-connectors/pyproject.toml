[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "osprey-connectors"
dynamic = ["version"]
description = "Control-system and archiver connectors for OSPREY"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "BSD-3-Clause"}
dependencies = [
    "rich>=14.0.0",
    "PyYAML>=6.0.2",
    "python-dotenv>=1.1.0",
    "numpy>=2.2.6",
    "pandas>=2.2.3",
    "python-dateutil>=2.9.0",
    # Channel Access client for the EPICS connector. Pure Python on top of
    # epicscorelibs, which ships a libca per architecture.
    "aioca>=2.1",
    # pvAccess client for the EPICS connector's PVA transport. Core, not an
    # extra: extras get forgotten by deployments, and a platform marker would
    # strip p4p from exactly the arm64 images that need it. Wheels ship for
    # macOS universal2, linux x86_64 and windows. From 4.3, p4p and the
    # pvxslibs and epicscorelibs releases it requires also ship linux aarch64
    # wheels, but for CPython 3.14 only: on 3.11-3.13 an arm64-linux install
    # still builds all three from source and needs a C toolchain (the project
    # image's deps layer stages and purges one). p4p and aioca both load the
    # one EPICS base epicscorelibs carries.
    "p4p>=4.3",
    # MongoDB client for MongoDBArchiverConnector. Declared even though the
    # connector imports it inside connect(): the deferred import exists so
    # registration stays cheap, not to make the dependency optional.
    "pymongo>=4.17.0",
    # LUMEModel contract the simulated machine's model modules subclass.
    # String-equal to the root pin: the framework and this package must load
    # one lume-base, and the model modules are written against this release.
    "lume-base==0.5.0",
]

[tool.hatch.version]
source = "vcs"
# The package versions with the framework's calendar stream, from the same
# v-tags: both wheels are always built from one checkout and always carry the
# same number, so "which connectors goes with which framework" is never a
# question and a semantic version never has to decide what counts as minor.
# `root` climbs to the repository the tags live in; the describe command is the
# framework's own (see the root pyproject.toml for why the match glob exists —
# in short, the default glob would read the retired osprey-connectors-v0.1.0
# tag and the checkpoint-* tags).
raw-options = { root = "../..", version_scheme = "post-release", git_describe_command = "git describe --dirty --tags --long --abbrev=40 --match v[0-9]*" }

[tool.hatch.build.hooks.vcs]
version-file = "src/osprey_connectors/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/osprey_connectors"]

# What the package's own suite (tests/) needs on top of the runtime dependencies.
# A dependency group rather than an extra, so it never reaches the published
# wheel's metadata. `uv sync --package osprey-connectors` installs it (`dev` is
# uv's default group) and nothing of the framework, which is the point: the
# `connectors-standalone` CI lane runs this suite where `import osprey` fails.
[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-timeout",
    "pytest-xdist",
    "cryptography",  # tests/osprey_connectors_tests/_loopback_https.py mints its certificates
]

# Read when pytest runs from this directory (the standalone lane). A run from the
# repository root reads the root pyproject.toml instead, which lists tests/ here
# among its testpaths, so both entry points collect the same suite.
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -v --tb=short --strict-markers --color=yes"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
tmp_path_retention_policy = "failed"
