[build-system]
# setuptools-scm >= 9.2 for `scm.git.describe_command` below (the 8.x line hatch-vcs
# still admits has no `scm` table and refuses the keyword).
requires = ["hatchling", "hatch-vcs", "setuptools-scm>=9.2"]
build-backend = "hatchling.build"

[project]
name = "osprey-connectors"
dynamic = ["version"]
description = "Control-system and archiver connectors for OSPREY"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "BSD-3-Clause"}
dependencies = [
    "rich>=14.0.0",
    "PyYAML>=6.0.2",
    "python-dotenv>=1.1.0",
    "numpy>=2.2.6",
    "pandas>=2.2.3",
    "python-dateutil>=2.9.0",
    # Channel Access client for the EPICS connector. Pure Python on top of
    # epicscorelibs, which ships a libca per architecture.
    "aioca>=2.1",
    # pvAccess client for the EPICS connector's PVA transport. Core, not an
    # extra: extras get forgotten by deployments, and a platform marker would
    # strip p4p from exactly the arm64 images that need it. Wheels ship for
    # macOS universal2, linux x86_64 and windows. From 4.3, p4p and the
    # pvxslibs and epicscorelibs releases it requires also ship linux aarch64
    # wheels, but for CPython 3.14 only: on 3.11-3.13 an arm64-linux install
    # still builds all three from source and needs a C toolchain (the project
    # image's deps layer stages and purges one). p4p and aioca both load the
    # one EPICS base epicscorelibs carries.
    "p4p>=4.3",
    # MongoDB client for MongoDBArchiverConnector. Declared even though the
    # connector imports it inside connect(): the deferred import exists so
    # registration stays cheap, not to make the dependency optional.
    "pymongo>=4.17.0",
    # LUMEModel contract the simulated machine's model modules subclass.
    # String-equal to the root pin: the framework and this package must load
    # one lume-base, and the model modules are written against this release.
    "lume-base==0.5.0",
]

[tool.hatch.version]
source = "vcs"
# The package has its own calendar stream, on its own tags:
# osprey-connectors-vYYYY.M.P (with bN/rcN for pre-releases), cut when the
# package itself changes rather than with every framework release. It stays
# backward-compatible with every supported framework release, so the framework
# declares a floor and never an exact pin.
#
# `root` climbs to the repository the tags live in. The describe glob reads only
# this package's calendar tags: the framework's v-tags start with `v`, and the
# `2[0-9][0-9][0-9]` year skips the retired osprey-connectors-v0.1.0 (PyPI
# already carries 0.1.0, so a dev build rebased onto it would sort below every
# calendar release). The backend's default tag regex then parses what the glob
# found: its optional dashed-words prefix (`osprey-connectors-`) and leading `v`
# are stripped, leaving the calendar version. With no matching tag reachable
# the backend yields 0.0.postN+g…, which the framework's floor refuses — so a
# fresh clone needs the tags fetched, and a fork or mirror must sync the
# osprey-connectors-v* tags.
#
# The describe command sits in the `scm.git` table, not the flat
# `git_describe_command` key, and there is no `tag_regex`: setuptools-scm 10
# (vcs-versioning 2) deprecates both flat keys, in favour of `scm.git.describe_command`
# and `tag.regex`, and warns on every build that passes them. hatch-vcs 0.5 hands
# raw-options to setuptools-scm's get_version(), which takes the `scm` table but
# has no `tag` parameter, so a non-default regex cannot be passed without the
# deprecated key — and none is needed. (The warnings read "Configuration field
# 'git_describe_command' is deprecated. Use 'scm.git.describe_command' instead."
# and "get_version() parameter 'tag_regex' is deprecated.")
# tests/osprey_connectors_tests/test_version.py pins the glob, the absence of a
# regex override, and a warning-free derivation.
raw-options = { root = "../..", version_scheme = "post-release", scm = { git = { describe_command = "git describe --dirty --tags --long --abbrev=40 --match osprey-connectors-v2[0-9][0-9][0-9].*" } } }

[tool.hatch.build.hooks.vcs]
version-file = "src/osprey_connectors/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/osprey_connectors"]

# Unreleased changelog fragments are repository workflow, not package content:
# the release fold empties the directory into CHANGELOG.md, which does ship.
[tool.hatch.build.targets.sdist]
exclude = ["changelog.d"]

# The package suite's test dependencies: a group, not an extra, so they never
# reach the wheel's metadata. `uv sync --package osprey-connectors` installs it.
[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-timeout",
    "pytest-xdist",
    "cryptography",  # tests/osprey_connectors_tests/_loopback_https.py mints its certificates
]

# Read by the standalone lane; a run from the repository root uses the root's.
[tool.pytest.ini_options]
addopts = "-ra -v --tb=short --strict-markers --color=yes"
testpaths = ["tests"]
asyncio_mode = "auto"
tmp_path_retention_policy = "failed"
