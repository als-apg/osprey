# Where every line of every split docs page went.
#
# The IA restructure cuts large how-to pages apart and scatters the pieces. This
# table is the ledger: `scripts/docs/check_split_accounting.py` reads each source
# file as it stood at `baseline_ref` and fails if a non-blank line is assigned to
# nothing, or if an H1/H2 that existed then survives in no page today.
#
# Schema
#   baseline_ref        commit the branch starts from; old pages are read from it
#   sources[<old path relative to docs/source>]
#     ranges            [{lines: "a-b", dest: "<new path>[#anchor]"}]  content that leaves
#                       dest: null marks a range deliberately dropped (say why in `retired`)
#     stays             ["a-b", ...]  content that remains in this file
#     stays_in          set when the file itself is git-mv'd: where `stays` ends up
#   retired_headings    exact H1/H2 texts that deliberately stop existing anywhere
#
# Line numbers are 1-based and inclusive, verified against `baseline_ref`
# (`git show <ref>:docs/source/<path> | sed -n 'a,bp'`); range boundaries sit on
# heading boundaries except where a table or code block is lifted out in place.

