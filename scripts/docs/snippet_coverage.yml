# Which docs code blocks a test reads. Read by scripts/docs/snippet_coverage.py.
#
# One claim per test and way of reading. A block on a docs page is "tested"
# when a claim under `tested:` matches it:
#
#   test:       the test file, relative to the repo root
#   pages:      pages relative to docs/source; globs allowed (`*` stays in one
#               directory, `**/` spans any). A literalinclude claim may name the
#               included file instead (how-to/control-systems/examples/*.py).
#   languages:  block languages the test reads: the code-block argument (`text`
#               when there is none), `literal` for a paragraph ending in `::`,
#               `literalinclude` for an included file
#   kind:       runs   - executes the block, or loads it through the code that owns it
#               checks - resolves the names it spells against what defines them
#               pins   - compares its text or value with a value the code holds
#               parses - only the language's own parser reads it (bash -n,
#                        json.loads, ast.parse); nothing compares it with the
#                        code. The weakest kind: a block only a `parses` claim
#                        reads counts as tested, and the report also shows it
#                        as "parse-only"
#   contains:   optional; the claim covers only blocks whose text contains this
#               (for a test that reads one block among several on a page)
#   matches:    optional, instead of `contains`; a regular expression searched
#               in the block, `^` and `$` at each line, for a test that reads
#               lines of a shape (`^npm run`) rather than blocks holding a
#               word. A claim with both is a ledger problem
#   what:       one line: what the test does to the block
#
# A test belongs here only if it reads the content of a block. Tests that read
# prose, inline literals, tables or headings are not claims, and neither are
# word bans that scan every page (they are listed under `not_counted:` so a
# reader can see they were weighed).
#
# The ledger is kept by hand. The only automatic honesty checks: the test file
# exists, names each claimed page (its stem, or `docs/source` for a `**` glob)
# and the claim matches at least one block.
#
# `not_testable:` names blocks nothing in the repository can read. They are
# not counted as untested: the report shows them in their own column and the
# ratchet skips them. Each entry has `pages`, `languages`, exactly one of
# `contains`/`matches` (as for a claim; usually the block's first line), a
# `reason` and a `why`: one line a reviewer can check against the block, saying
# what it needs that a test lacks. Reasons:
#
#   network          - it downloads or posts over the internet (an installer,
#                      a package manager, a cloud API)
#   host-service     - it drives the host's own services (systemd, logind,
#                      journald, cron) or root-owned files
#   third-party-tool - it runs a program OSPREY does not ship (node, claude,
#                      docker, podman, a Canopy wheel) and carries no OSPREY
#                      name a test could resolve
#   llm              - it is what a person types to the agent, or the model's
#                      side of the conversation
#   illustration     - it shows the shape of something (an HTTP request, a
#                      passwd excerpt, a hypothetical file tree) that nothing
#                      in the repository holds
#
# A block a `runs`/`checks`/`pins` claim reads (live or pending, landed or
# not) is tested, so an entry that names it is a ledger problem; so are an
# entry that matches no block, an unknown reason and an empty `why`. A
# `parses` claim may read a not-testable block: the entry wins, and the block
# is not counted as parse-only.
#
# `pending:` holds claims of tests on open pull requests, with the PR number
# (or the campaign unit id, such as `W6-3`, until the pull request opens).
# Until the test is on disk the report shows what it would cover. Once it is (a
# new file exists, or a widened file contains `marker:`) the claim counts as
# tested, so the PRs can merge in any order; --check only notes it. A tidy-up
# commit after they merge moves the claims to `tested:` and regenerates the
# baseline.

