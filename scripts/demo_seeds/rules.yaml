# The simulated motion of the example facility's float readbacks, one row per
# signal class. `reseed.py` stamps each row's `noise` and `drift` into
# src/osprey/templates/facilities/example/seeds.yaml.
#
# A row matches a channel by its device's `class` (records/devices.yaml) and the
# channel's `signal` (records/channels.yaml). An optional `machine` (the first
# segment of the device id) or `device` (the device id) narrows the row; when
# several rows match, `device` wins over `machine`, and `machine` over neither.
#
# `noise` is the sigma of a read's Gaussian noise and `drift` a slow wander of
# `amplitude` over `period_s`; each is `{value, unit}` or `none`, converted into
# the channel's own unit. `source` names the instrument behaviour the value
# stands for.

- class: Dipole
  signal: current_readback
  noise: {value: 3, unit: mA}
  source: DCCT-regulated bend supply, ~10 ppm of ~330 A

- class: Quadrupole
  signal: current_readback
  noise: {value: 1, unit: mA}
  source: quadrupole supply, 10-25 ppm of 40-170 A

- class: Sextupole
  signal: current_readback
  noise: {value: 2, unit: mA}
  source: sextupole supply, ~25 ppm of ~85 A

- class: HCorrector
  signal: current_readback
  noise: {value: 1, unit: mA}
  drift:
    amplitude: {value: 5, unit: mA}
    period_s: {value: 21600, unit: s}
  source: bipolar corrector supply, ~100 ppm of 12 A full scale; thermal wander

- class: VCorrector
  signal: current_readback
  noise: {value: 1, unit: mA}
  drift:
    amplitude: {value: 5, unit: mA}
    period_s: {value: 21600, unit: s}
  source: bipolar corrector supply, ~100 ppm of 12 A full scale; thermal wander

