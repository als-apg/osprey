# ---------------------------------------------------------------------------
# orphan_sites — per deleted key, regexes for its removed code sites. Every
# regex here must match ZERO times under the listed root (failure mode 4).
# ---------------------------------------------------------------------------
orphan_sites:
  # NOTE — the three deleted `control_system.write_verification` keys have NO
  # orphan_sites entry ON PURPOSE. Each has a DELIBERATE surviving reader in
  # src/osprey/connectors/control_system/base.py, so any regex on their names
  # would make the guard permanently red against intended code. See
  # kept_readers.write_verification_legacy_tolerance. They remain guarded by
  # the `deleted` list (failure mode 3: must not reappear in the rendered
  # union), which is the check that actually matters for them.

  # ADDENDUM 1 — the settings-drawer literal. The OLD key was the bare
  # 'control_system.write_verification'; the LIVE re-keyed leaf is
  # 'control_system.write_verification.default_level'. This regex requires the
  # closing quote immediately after `write_verification`, so it matches the old
  # literal and NOT the live one.
  control_system.write_verification__ui_literal:
    - root: src/osprey/interfaces/web_terminal/static/js
      regex: "'control_system\\.write_verification'"
      why: >-
        settings.js old bare key literal. Verified NOT to match the live
        're-keyed leaf at settings.js:51
        ('control_system.write_verification.default_level').
  approval.tools.channel_limits:
    - root: src/osprey/templates
      regex: '^\s+channel_limits:\s'
      back_test: {base_matches: 3, branch_matches: 0}
      why: >-
        the deleted approval policy entry. The removed sites were UNQUOTED YAML
        mapping keys in the templates, so the earlier quoted-key regex could
        never fire — it matched 0 even at merge-base. Anchored to the YAML
        mapping-key form and rooted at templates, which also keeps the
        LimitsValidator, channel_limits.json and the osprey_limits hook (all
        legitimate bare-word users) out of scope.
  file_paths.user_memory_dir:
    - root: src/osprey
      regex: 'user_memory_dir'
      why: compose_generator mkdir list, scaffolding mkdir/README, Dockerfile.j2, config.py docstring
  file_paths.execution_plans_dir:
    - root: src/osprey
      regex: 'execution_plans_dir'
      why: compose mkdir list + docstring
  file_paths.prompts_dir:
    - root: src/osprey
      regex: 'prompts_dir'
      why: compose mkdir list + docstring
  workspace.base_dir:
    - root: src/osprey/interfaces/web_terminal/routes
      regex: '^\s*"workspace",'
      why: >-
        the "workspace" entry in config.py `_AGENT_CONFIG_SECTIONS`. Anchored to
        the list-item form so the many legitimate uses of the word (the
        osprey_workspace MCP server, utils/workspace.py) do not trip it.
  ariel.reasoning:
    - root: src/osprey
      regex: 'ReasoningConfig|reasoning_config'
      why: deleted config class/field/parse + capabilities() echo
  ariel.default_max_results:
    - root: src/osprey
      regex: 'default_max_results'
      why: ARIELConfig field + capabilities payload
  ariel.cache_embeddings:
    - root: src/osprey
      regex: 'cache_embeddings'
      why: deleted field/parse/assertions
  channel_finder.explicit_validation_mode:
    - root: src/osprey
      regex: 'explicit_validation_mode'
      why: deleted from 2 templates + propagated copy
  channel_finder.pipelines.hierarchical.tree_preview:
    - root: src/osprey/templates
      regex: '^\s+tree_preview:\s*$'
      back_test: {base_matches: 2, branch_matches: 0}
      why: >-
        the deleted CONFIG BLOCK only, which was a bare YAML block header. The
        earlier dict/quoted-key regex matched 0 even at merge-base. Rooted at
        templates so the kept, tested `generate_tree_preview` utility stays out
        of scope.
  channel_finder.pipelines.in_context.processing:
    - root: src/osprey
      regex: 'chunk_dictionary|max_correction_iterations'
      why: >-
        the deleted processing block's own leaf names — `processing` alone is
        far too common to anchor on.
  channel_finder.benchmark.execution:
    - root: src/osprey
      regex: 'runs_per_query.*delay_between_runs|continue_on_error'
      why: deleted benchmark execution block leaves
  channel_finder.benchmark.output:
    - root: src/osprey
      regex: 'save_incremental|include_detailed_metrics'
      why: deleted benchmark output block leaves
  channel_finder.benchmark.evaluation:
    - root: src/osprey
      regex: 'exact_match_weight|partial_match_weight'
      why: deleted benchmark evaluation block leaves
  machine_state:
    # The deleted services/machine_state module has NO content-grep site: it had
    # zero importers, so nothing anywhere ever spelled its import path. A regex
    # for it could not fire even at merge-base. Its deletion is asserted by
    # path ABSENCE below (the mirror of `keeps`), not by grep.
    - root: src/osprey/templates
      regex: '^machine_state:'
      back_test: {base_matches: 1, branch_matches: 0}
      why: the deleted top-level config block in the templates — a genuine, fireable site
  api.providers.ollama.host:
    - root: src/osprey/templates
      # Anchored on the base_url line that preceded it, not on `host: localhost`
      # alone. Bare, it claimed every indented `host: localhost` in every
      # template — so the first unrelated block to use that ordinary default
      # (the archiver's stored-connection block) read as the deleted ollama key
      # coming back. An orphan regex has to name the site it is proving gone.
      regex: '\$\{OLLAMA_HOST[^\n]*\n\s+host:\s*localhost'
      why: the deleted ollama host/port pair (replaced by a single base_url)
  api.providers.ollama.port:
    - root: src/osprey/templates
      regex: '^\s+port:\s*11434'
      why: the deleted ollama port line
  applications:
    # `root` may be a LIST: the config loader moved to the osprey-connectors
    # workspace member, so src/osprey/utils/config.py is a shim this regex can
    # never match. Both trees are scanned; the back-test sums hits across the
    # roots, because the connectors tree postdates the baseline commit.
    - root:
        - src/osprey/utils
        - packages/osprey-connectors/src/osprey_connectors
      regex: 'current_application'
      why: deleted loader identity block (config.py, now osprey_connectors/config.py)
  control_system.connector.timeout:
    - root: src/osprey/templates
      regex: '^  connector:\n    timeout:'
      multiline: true
      back_test: {base_matches: 2, branch_matches: 0, engine: 'python re.M over whole-file text'}
      why: >-
        the connector-level timeout that sat outside any connector type. The
        pattern SPANS TWO LINES, so a line-based engine (grep, or a per-line
        Python loop) finds 0 matches at merge-base as well as now — a check that
        cannot fail. `multiline: true` obliges the guard to read the whole file
        and match with re.M; see scan_rules.multiline_entries.
  facility_name:
    - root: src/osprey/templates
      regex: '^facility_name:'
      why: >-
        the retired top-level spelling, now migrated to the canonical
        `facility:` block in every template. The READER fallback in
        utils/facility.py is deliberate and must NOT be removed — this regex is
        scoped to templates only for exactly that reason.

# ---------------------------------------------------------------------------
# render_contexts — the matrix the guard renders every template under, then
# UNIONS the walked key sets. Jinja conditionals gate audited blocks, so a
# single context would under-report.
# ---------------------------------------------------------------------------
render_contexts:
  undefined: ChainableUndefined
  note: >-
    StrictUndefined fails on project_root / selected_web_panels / the panel
    machinery, so ChainableUndefined is required for one context to serve all
    five templates.
  base:
    project_name: demo
    project_root: /tmp/demo
    default_provider: anthropic
    default_model: haiku
    environment_python: null
    environment_packages: []
    environment_inherit_exclude: []
    builtin_panels: [ariel, channel-finder]
    default_panel: null
    panel_presets: null
  matrix:
    channel_finder_mode:
      - mode: in_context
        flags: {enable_in_context: true, enable_hierarchical: false, enable_middle_layer: false}
      - mode: hierarchical
        flags: {enable_in_context: false, enable_hierarchical: true, enable_middle_layer: false}
      - mode: middle_layer
        flags: {enable_in_context: false, enable_hierarchical: false, enable_middle_layer: true}
    deploy_services: [true, false]
    selected_web_panels:
      - [ariel, channel-finder]
      - []
  templates:
    - src/osprey/templates/project/config.yml.j2
    - src/osprey/templates/apps/control_assistant/config.yml.j2
    - src/osprey/templates/apps/hello_world/config.yml.j2
    - src/osprey/templates/apps/ariel_standalone/config.yml.j2
    - src/osprey/templates/apps/channel_finder_standalone/config.yml.j2
  # Guard self-test: one key from inside each conditional branch must appear in
  # the union, otherwise the matrix has silently stopped covering that branch.
  self_test_keys:
    enable_in_context: channel_finder.pipelines.in_context.subagent_model
    enable_hierarchical: channel_finder.pipelines.hierarchical.feedback.store_path
    enable_middle_layer: channel_finder.pipelines.middle_layer.database.type
    deploy_services_true: services.openobserve.retention_days
    panels_on: web.panels.channel-finder.enabled
  expected_union_size: 313
  note_union_size: >-
    Informational, not an assertion — it moves whenever a template gains or
    loses a key. The guard should report a diff against this number, not fail on
    it. Because it cannot fail, it only stays useful if it is re-derived
    whenever a template's key set changes; it had drifted 9 low before the qmd
    blocks landed, which is exactly how a soft counter stops being a signal.
    284 -> 289 absorbs two separate movements, recorded here so the arithmetic
    stays checkable: the target-switch work adds exactly FOUR rendered paths
    (control_system.target_switch{,.drain_timeout_s,.probe_interval_s} and
    control_system.connector.virtual_accelerator.probe_channel — the generic
    template's new virtual_accelerator block introduces no path the
    control_assistant template did not already render), and the remaining ONE
    is pre-existing drift measured at this branch's base: archiver.auto_bin_points
    landed with #117 with a `keys` entry but without bumping this counter.
    289 -> 298 folds in the ariel vocabulary block, which moved the same
    counter from 284 to 294 on its own line of development. That value was
    re-derived by running the guard against the merged templates, not by
    adding the two increments — adding them gives 299, one high, so a counter
    reconciled by arithmetic across two branches is a counter that drifts.
    Re-derived at 285 when the `services.graphdb` block landed: 9 of those 12
    are the graphdb keys, the other 3 were drift that had accumulated since the
    previous re-derivation. Re-derived again at 287 when the graph MCP server
    added `services.graphdb.query_timeout_s` and `query_max_rows` to the same
    block — exactly two keys, both in the two app templates that already
    carried the block, so no other template's key set moved.
    305 -> 309 when the target-switch branch merged main: re-derived by running
    the guard on the merged templates, and this time the arithmetic agrees —
    main's 305 plus the branch's four target-switch paths, nothing else moved.

# ---------------------------------------------------------------------------
# governed_sets — ADDENDUM 2. Two safety stanzas make EXHAUSTIVE claims that no
# test protects. The guard must render the template, run
# osprey.registry.mcp.resolve_servers, collect every tool whose PreToolUse
# matcher runs osprey_approval.py, and assert set equality with the enumeration
# below. A future default-enabled server carrying an approval hook then turns
# the guard red instead of silently falsifying the shipped comment.
# ---------------------------------------------------------------------------
governed_sets:
  method:
    description: >-
      Render the template (render_contexts.base + any matrix cell),
      yaml.safe_load, pass the `claude_code` section to resolve_servers with a
      ctx carrying channel_finder_pipeline when the config has a
      channel_finder section. For every ENABLED server, walk hooks_pre; a rule
      counts when any of its hooks' `command` contains osprey_approval.py.
      Extract the tool short-name from each matcher.
    matcher_shape: 'mcp__<server>__<tool>'
    matcher_parse_warning: >-
      Matchers are SINGLE tokens and underscores are word characters, so a
      naive `[A-Za-z_][A-Za-z0-9_]*` findall returns the whole matcher as one
      token. Parse with `mcp__[A-Za-z0-9_-]+?__([A-Za-z0-9_]+)`. An extractor
      that returns an empty governed set for every template is broken, not a
      finding.
    approval_hook_marker: osprey_approval.py
  claims:
    ariel_standalone:
      template: src/osprey/templates/apps/ariel_standalone/config.yml.j2
      comment_claim: 'in this app exactly three'
      exhaustive: true
      tools: [entry_create, setup_patch, draft_concept]
    channel_finder_standalone:
      template: src/osprey/templates/apps/channel_finder_standalone/config.yml.j2
      comment_claim: 'the only tool it governs is the workspace setup_patch tool'
      exhaustive: true
      tools: [setup_patch]
  reference_counts:
    note: >-
      Not exhaustive claims in any shipped comment — recorded so a future
      change to the default-enabled server set is visible. Re-derived
      2026-08-02 with the method above.
    project: [channel_write, channel_read, archiver_read, control_target_set, execute, setup_patch, entry_create, draft_concept]
    control_assistant: [channel_write, channel_read, archiver_read, control_target_set, execute, setup_patch, entry_create, draft_concept]
    hello_world: [channel_write, channel_read, archiver_read, control_target_set, execute, setup_patch, draft_concept]
  draft_concept_note: >-
    draft_concept is approval-governed in project, control_assistant and
    hello_world (osprey_facility_knowledge is enabled by default and carries the
    hook) but appears in NO approval.tools block, so it falls to
    default_policy: always. Fail-closed and correctly described by the shipped
    comment. This is the reason the governed set is 7/7/6 while the
    approval.tools LISTS are 6/6/6 — do not "fix" one to match the other.
    control_target_set is governed the same way and for the same reason: the
    controls server carries the approval hook on it, and it appears in no
    approval.tools block, so it too falls to default_policy. That is what
    makes the governed set 8/8/7 rather than 7/7/6.

# ---------------------------------------------------------------------------
# kept_readers — code that legitimately still mentions a DELETED key. These are
# deliberate legacy-tolerance paths, not orphans. A guard that greps deleted key
# names across src/ without this exclusion list goes red against intended code.
# ---------------------------------------------------------------------------
kept_readers:
  write_verification_legacy_tolerance:
    site: src/osprey/connectors/control_system/base.py
    covers:
      - control_system.write_verification.fail_on_mismatch
      - control_system.write_verification.enabled
      - control_system.write_verification.timeout
    detail: >-
      `_warn_once_if_fail_on_mismatch_set` deliberately still READS
      `fail_on_mismatch` so a legacy project carrying it at true is told once,
      at the first write, which path actually enforces verification. Its
      docstring also names `enabled` and `timeout` to explain why those two stay
      silent (they were inert at every value). All three names therefore appear
      in src/ BY DESIGN. Guard them via the `deleted` list only.
  facility_name_reader:
    site: src/osprey/utils/facility.py
    covers: [facility_name]
    detail: >-
      resolve_facility_name still honours the retired top-level `facility_name`
      as a fallback so pre-consolidation configs keep working. The key is banned
      from TEMPLATES, not from readers — which is why that orphan regex is
      scoped to src/osprey/templates.
  tree_preview_util:
    site: src/osprey/services/channel_finder
    covers: [channel_finder.pipelines.hierarchical.tree_preview]
    detail: >-
      `generate_tree_preview` is a kept, tested utility. Only the CONFIG BLOCK
      was deleted, which is why that orphan regex anchors on the mapping-key
      form rather than the bare word.

# ---------------------------------------------------------------------------
# scan_rules — how the guard must walk the tree.
# ---------------------------------------------------------------------------
scan_rules:
  exclude_dirs: ['__pycache__', '.venv', 'node_modules', '.git', '.mypy_cache', '.pytest_cache', '.ruff_cache']
  regex_engine: >-
    EVERY regex in this file is written against LINE STARTS, because they were
    authored and verified with grep, which is inherently line-based. A Python
    implementation MUST therefore pass `re.M` on every match — not only on
    `multiline: true` entries. Without it, `^` anchors at the start of the whole
    file and every `^`-anchored regex silently reports 0 matches, manufacturing
    the exact cannot-fail class this manifest's back-test exists to detect. Cost
    of learning this: the first back-test implementation applied re.M only to
    flagged entries and reported 7 false cannot-fail failures, including two
    regexes that had already been hand-verified as matching at merge-base.
  multiline_entries: >-
    An entry carrying `multiline: true` additionally SPANS newlines, so it can
    never be matched by a line-based tool at all — the guard must read whole
    files for it. (With `re.M` + whole-file text, both kinds work uniformly.)
    Only `control_system.connector.timeout` needs this today.
  back_test_required: >-
    Every `orphan_sites` regex MUST be back-tested against the merge-base commit
    recorded in back_test_baseline: it has to match at least once THERE and zero
    times on the branch. A regex that matches 0 in both places proves nothing —
    it is a green light wired to nothing. Four of the original 22 were exactly
    that (see back_test_baseline.history). Entries carry their verified counts
    in a `back_test:` block; the guard should re-derive them rather than trust
    the recorded numbers.
  absence_is_git_tracked: >-
    An `absent_paths` entry is satisfied when the path has NO git-tracked files
    (`git ls-files <path>` is empty) — never by filesystem existence
    (`Path.exists()` / `os.path.isdir`). A deleted Python package leaves a
    populated `__pycache__/` behind in any working tree it was ever imported in,
    so a filesystem check goes red on developer worktrees while CI stays green.
    Measure the base side the same way, with `git ls-tree -r --name-only
    <commit> -- <path>`. This is the same stale-.pyc trap as
    `exclude_dirs`, reached from the other direction.
  back_test_baseline:
    commit: ccf324d7
    extraction: 'git show <commit>:<path>'
    history: >-
      Found by back-testing during task 7.1 review: channel_limits used a
      quoted-key regex where the real sites were unquoted YAML; tree_preview
      used a dict/quoted form where the real site was a bare block header;
      machine_state's services-module regex could never fire because the module
      had zero importers; connector.timeout's pattern is multiline. All four
      matched 0 at merge-base as well as on the branch.
  exclude_note: >-
    MUST exclude __pycache__. Compiled .pyc files retain the string constants of
    deleted modules, so a grep that counts them reports orphan sites that no
    longer exist in source — observed while authoring this manifest: the
    machine_state orphan regex appeared to match 3 times, entirely from stale
    .pyc artifacts, and 0 times in real source.
  test_tree: >-
    The guard scans src/osprey only. If it is ever pointed at tests/, the
    deliberate legacy fixture (see notes.legacy_fixture_out_of_scope) MUST be
    allowlisted first — it holds every deleted key on purpose.

# ---------------------------------------------------------------------------
# absent_paths — the mirror of `keeps`. Deletions whose only honest assertion is
# that a PATH no longer exists, because no content grep can ever fire for them.
# ---------------------------------------------------------------------------
absent_paths:
  - path: src/osprey/services/machine_state
    assert: absent
    back_test:
      base_tracked_files: 3   # __init__.py, models.py, reader.py at ccf324d7
      branch_tracked_files: 0
    why: >-
      The module had ZERO importers, so no file anywhere ever spelled
      `from osprey.services.machine_state` or the module path. A content regex
      for it therefore matches 0 both before and after the deletion — it cannot
      distinguish success from failure. Path absence is the only assertion that
      actually tests this deletion. Note the deliberate asymmetry with
      `keeps`: the same ledger item both DELETES this module and KEEPS the
      control_assistant machine_state_channels.json asset, so the two
      sections guard opposite halves of one change.

# ---------------------------------------------------------------------------
# keeps — ADDENDUM 3. Assets whose CONTINUED EXISTENCE is load-bearing but
# which no grep gate protects, because the asset does not contain the string
# that would be searched for.
# ---------------------------------------------------------------------------
keeps:
  - path: src/osprey/templates/apps/control_assistant/data/machine_state_channels.json
    assert: exists
    why: >-
      Feeds VA manifest reconciliation via
      services/virtual_accelerator/manifest/loaders.load_machine_state_candidate_addresses,
      surfacing as _metadata.machine_state_reconciliation. The machine_state
      DELETION's grep gate passes partly for the wrong reason: this file never
      contains the string `machine_state` in its CONTENT, only in its filename,
      so a content grep can never protect it. Today only
      tests/templates/test_machine_state_channels.py and tests/va/test_manifest.py
      fail on its deletion. An explicit existence assertion makes the dependency
      visible in the manifest rather than implicit in two test files.

# ---------------------------------------------------------------------------
# notes — carried forward from tasks 3.2, 5.1 and 6.3. Not guard rules.
# ---------------------------------------------------------------------------
notes:
  manifest_fixture_provider_shape:
    site: tests/cli/test_manifest_build_args.py
    detail: >-
      Carries 'anthropic/claude-opus' as fixture data. It never reaches the
      resolver, so it is harmless and was left alone. If cheap, the guard could
      flag provider/model-SHAPED default_model values (a '/' in a value that
      should be a bare tier: haiku | sonnet | opus), since claude_code.default_model
      takes a tier, not a wire id.
  prefix_rule_drift:
    detail: >-
      RESOLVED. The only place stating facility.prefix must be lowercase alnum
      plus hyphens, 2-6 chars, as a hard requirement was the facility-config
      schema reference, which has been removed along with the rest of the
      facility-config surface. Nothing enforces that rule and nothing claims it
      any more: the only validation in the tree is a non-emptiness lint at
      deployment/web_terminals/lint.py `_check_empty_facility_prefix`.
    inert: >-
      Stronger than unenforced. facility.prefix reaches only two container-name
      interpolations and the personas path — never an nginx location key or a
      URL segment, which is the specific reason usernames and persona names do
      get the charset regex. There is NO sink at which violating the
      2-6/lowercase rule breaks anything.
    remedy_direction: >-
      None. Do NOT add a validator, and do NOT let this manifest grow a charset
      rule for facility.prefix: a new check would reject configurations that
      work correctly today, converting a cosmetic doc inconsistency into a
      breaking change. All five templates and both presets already state the
      enforced rule alongside the Docker constraint.
  legacy_fixture_out_of_scope:
    path: tests/utils/fixtures/legacy_config_all_deleted_keys.yml
    detail: >-
      Deliberately holds every retired key so the loader's tolerance stays
      tested. If the guard is ever pointed at tests/, this file MUST be
      allowlisted or every `deleted` entry will fire on it.
  facility_timezone_unshipped:
    detail: >-
      facility.timezone is READ (deployment/web_terminals/env_production.py,
      deployment/web_terminals/render.py) but shipped by no template, and is
