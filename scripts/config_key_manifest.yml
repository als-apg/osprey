# Config-key resurrection guard manifest (ledger P7).
#
# Consumed by the guard tool (task 7.2). Four required top-level sections —
# `keys`, `deleted`, `orphan_sites`, `render_contexts` — plus three advisory
# ones (`governed_sets`, `keeps`, `notes`).
#
# Parity marks (`all-templates: true`) come from scripts/config_key_parity.md.
# READ THAT DOCUMENT'S SCOPE CAVEAT BEFORE ADDING RULES: presence in all five
# templates and value-equality across them are separate properties, and neither
# may be inferred from the other.
#
# Each key carries exactly one disposition:
#
#   evidence: <regex>   A regex that MUST match at least once under src/osprey/.
#                       Every one was verified against the tree while authoring;
#                       the guard re-verifies on every run (failure mode 2).
#   covered-by: <path>  This leaf has NO independent reader — it is consumed by
#                       unpacking its parent block, so the parent carries the
#                       real anchored evidence. See the note below.
#   data-map: true      The key's leaves are user-extensible data, not a fixed
#                       schema — the guard checks shape, not membership.
#   forward-declared    Written by the templates, read by nothing today, and
#                       deliberately so (documented hidden-key stanzas).
#
# WHY `covered-by` EXISTS — this matters for anyone extending the manifest.
# A first draft gave every key an `evidence` regex, and every regex "passed".
# Measuring them exposed the problem: 62 of them were bare words like `port`
# (840 files), `path` (519), `type` (475) or `enabled` (169). Those match
# whether or not the key is still read, so they prove nothing — a passing guard
# built on them is theatre. Nested leaves genuinely have no per-leaf reader to
# cite: code does `services.get("openobserve")` and then `.get("port")`, so the
# only honest citation is at the parent. `covered-by` records that structural
# fact instead of manufacturing evidence. Do NOT "improve" a `covered-by` entry
# into a bare-word `evidence` regex; if you add one, it must be an anchored
# fragment of a real reader.
#
# Distinctive leaf names (`retention_days`, `port_host`, `subagent_model`,
# `allow_unlisted_channels`, …) DO keep a bare-name `evidence` regex: those
# identifiers exist nowhere else, so their disappearance is a real signal.
#
# THE THRESHOLD, and what is left under it. A bare-name `evidence` regex is
# accepted only if it appears in <= 25 files under src/osprey (check B3 fails
# the manifest otherwise). The bare entries are domain identifiers, not English
# words, so deleting the reader really would drop the count toward zero. Where
# an obvious anchored form existed it was preferred instead — e.g.
# claude_code.telemetry.backend cites `telemetry_cfg.get("backend") ==
# "openobserve"` rather than the bare word, and services.postgresql.path cites
# the compose generator's `service_config["path"]` read after the bare word
# crossed the ceiling. The rest have no clean single reader to anchor on (the
# value is unpacked from a block, or read in several places with different
# shapes), and forcing an anchor would mean inventing one.

# ---------------------------------------------------------------------------
# keys — every dotted path the five templates render, with its evidence
# ---------------------------------------------------------------------------
keys:
  # ── Identity / roots ────────────────────────────────────────────────
  project_name:
    all-templates: true
    evidence: 'config\.get\("project_name", project_dir\.name\)'
  build_dir:
    all-templates: true
    evidence: 'config\.get\("build_dir", "\./build"\)'
  project_root:
    all-templates: true
    evidence: 'config\.get\("project_root"\)'
  facility:
    evidence: 'config\.get\("facility"\)'
    note: >-
      Live (name only) in ariel_standalone and channel_finder_standalone;
      commented in the other three. Canonical spelling.
  facility.name:
    evidence: 'facility\.get\("name"\)'
  facility.prefix:
    rendered: false
    evidence: 'as_dict\(config\.get\("facility"\)\)\.get\("prefix"\)'
    note: >-
      Commented in all five — only the multi-user web-terminal stack reads it.
      The ONLY enforcement anywhere is a non-emptiness lint
      (deployment/web_terminals/lint.py `_check_empty_facility_prefix`); no
      charset or length rule exists in code. See notes.prefix_rule_drift.

  # ── Container runtime / deployment ──────────────────────────────────
  container_runtime:
    all-templates: true
    evidence: 'config\.get\("container_runtime", "auto"\) if config else None'
    note: >-
      An absent key behaves identically to "auto" (runtime_helper `_runtimes_to_try`),
      so parity here is a documentation guarantee, not a behavioural one.
  deployed_services:
    all-templates: true
    evidence: 'config\.get\("deployed_services", \[\]\)'
    note: >-
      PRESENCE is all-templates; VALUES deliberately diverge ([] /
      [openobserve] / [postgresql, openobserve]). The guard must not assert
      value equality here.
  images.registry:
    rendered: false
    evidence: 'images\.get\("registry"\)'
    note: >-
      Hidden key, unset in all five templates. One of the two stack-wide image
      axes (`compose_generator.resolve_image_axes`): the registry every
      OSPREY-built image's DEFAULT reference is prefixed with, so the images CI
      pushes and the images a deploy pulls are the same images. Overridden by
      OSPREY_IMAGE_REGISTRY in the environment, and outranked in the other
      direction by a `services.<svc>.image` pin or an
      `OSPREY_<SVC>_IMAGE` compose override. Never applied to the third-party
      pins beside them — prefixing an upstream name yields no image at all.
  images.tag:
    rendered: false
    evidence: 'images\.get\("tag"\)'
    note: >-
      The other axis, same layering. Defaults to `local` — the tag `osprey up`
      builds on the host — so a deployment that sets neither key renders
      byte-for-byte what it rendered before the axes existed.
  services:
    evidence: 'get_config_value\("services\.postgresql", \{\}\)'
  # The bluesky bridge's plan-lane blocks are INJECTOR-written, not template-
  # rendered: `_inject_bluesky` writes `services.bluesky` (and, on a two-lane
  # deploy, its `bluesky_va`/`bluesky_live` sibling) into an already-rendered
  # project config, so none of the five shipped templates carries them and they
  # are outside the rendered union this manifest is otherwise derived from.
  # Only `devices_file` is recorded, because only it is written UNCONDITIONALLY
  # on every lane of every bluesky deploy — its disappearance is therefore a
  # real signal, where the omit-when-unset neighbours (`plan_dir`,
  # `excluded_plans`) would go silent for a configuration reason.
  services.bluesky.devices_file:
    rendered: false
    evidence: '\{"devices_file": bluesky\.devices_file\}'
    note: >-
      Names where the Bluesky plan device file is AUTHORED, replacing the
      per-deployment env-var channel. Written by `_inject_bluesky` via
      `_facility_plan_keys` in cli/build_injectors.py, from `bluesky.devices_file`
      in the build profile; defaults to `data/bluesky_devices.yml`. A relative
      path resolves against the rendered config's own directory (so it travels
      with the built project); an absolute path is operator-owned and read
      as-is. `rendered: false` because no shipped config.yml.j2 renders it —
      the injector does — which is what would otherwise trip the phantom-key
      check.
  services.openobserve: {evidence: 'get\("openobserve", \{\}\)'}
  services.openobserve.path: {evidence: 'service_config\["path"\]'}
  services.openobserve.port: {evidence: 'services\.openobserve\.port'}
  services.openobserve.retention_days: {evidence: 'retention_days'}
  services.postgresql: {evidence: 'get_config_value\("services\.postgresql", \{\}\)'}
  services.postgresql.path: {evidence: 'service_config\["path"\]'}
  services.postgresql.database_name: {evidence: 'database_name'}
  services.postgresql.username: {covered-by: services.postgresql}
  services.postgresql.port_host: {evidence: 'port_host'}
  # The qmd semantic-search sidecar, shipped LIVE in the ariel-standalone and
  # control-assistant templates (it backs the default-on `hybrid` search mode
  # and ranked OKF search). Every regex below anchors on qmd_service.py and
  # matches exactly one file, so deleting the resolver fails the guard rather
  # than rotting quietly.
  services.qmd:
    evidence: 'QMD_SERVICE_NAME = "qmd"'
    note: >-
      The block's name is spelled once, as `qmd_service.QMD_SERVICE_NAME`, and
      every reader goes through that constant — the resolver, the two dotted
      keys below that build their own paths from it, and the reach contract
      asking whether there is a block to dial. Pinning the constant rather
      than one reader's `services.get(...)` keeps the guard on the spelling
      itself, which is the thing a config file has to match.
  services.qmd.path:
    evidence: 'service_config\["path"\]'
    note: >-
      Same generic compose-generator read as the openobserve/postgresql `path`
      keys — it resolves any service's fragment directory, qmd included.
  services.qmd.port:
    evidence: '_positive_int\(block\.get\("port"\)'
    note: >-
      Defaults to 8180, deliberately NOT qmd's own 8181: the daemon hardcodes
      an IPv6-loopback bind, so the container fronts it with a forwarder that
      owns the routable port. `deployment/host_ports.py` cites this key from
      the same module, so the port-conflict remedy cannot drift from it.
  services.qmd.interval:
    evidence: 'block\.get\("interval"\)'
    note: >-
      Fallback corpus-sweep period, not the freshness lag — `.qmd-touch` is the
      primary trigger. Default 30 s; a no-op sweep costs ~12.5 s at 135k
      documents, so a large corpus should raise it.
  services.qmd.models_dir:
    rendered: false
    evidence: '_absolute_path\(block\.get\("models_dir"\)'
    note: >-
      Hidden key, unset in all five templates. Names a host directory holding
      the three GGUF models the sidecar image otherwise downloads at build
      time; setting it skips the downloads and delivers them over a read-only
      mount instead, which is what makes the sidecar buildable on a network
      with no route to huggingface.co. Subject-named after what the directory
      holds, like `path`/`mirror_path`, not after the mount that carries it.
      `preflight_qmd_models_dir` refuses the deploy when the directory is
      missing or lacks a model under its exact `hf_<org>_<basename>` cache
      name — the one operator error that would otherwise surface only as an
      unhealthy container an hour later.
  # `services.qmd.bind_address` is deliberately absent: the sidecar publishes on
  # the project-wide `deployment.bind_address` like every other service. See
  # deployment/qmd_service.py for why a per-service key would be a hazard.

  # The graph store, shipped LIVE in the ariel-standalone and control-assistant
  # templates (block and `deployed_services` entry always emitted together — a
  # deployed graphdb without a block is refused pre-compose). Every regex below
  # — except `path`, which cites the generic compose-generator read shared with
  # its three neighbours, and the two query bounds at the end of the block —
  # anchors on deployment/graphdb_service.py, the single resolver the compose
  # render, the port-conflict sweep, the health category and the seeder all
  # read through, so deleting it fails the guard rather than rotting quietly.
  # The query bounds are the one pair the deploy path never sees: they shape a
  # single agent query, so the graph MCP server reads them at query time and
  # their evidence anchors there instead.
  services.graphdb:
    evidence: '_graphdb_block\(config\)'
  services.graphdb.path:
    evidence: 'service_config\["path"\]'
    note: >-
      Same generic compose-generator read as the openobserve/postgresql/qmd
      `path` keys — it resolves any service's fragment directory, graphdb
      included.
  services.graphdb.image:
    evidence: '_text\(block\.get\("image"\)'
    note: >-
      Pinned to neo4j:5.26-community by DEFAULT_IMAGE, and the pin is about the
      neosemantics (n10s) plugin's release cadence rather than Neo4j's: without
      n10s the store cannot import the RDF corpus at all, and 5.26 is the
      newest server line its plugin manifest covers. Overridable per project
      for a mirror or a pre-baked image; the compose fragment layers
      ${OSPREY_GRAPHDB_IMAGE} over it.
  services.graphdb.port_host:
    evidence: '_port\(block\.get\("port_host"\)'
    note: >-
      Published bolt port (7687), the only protocol the neo4j driver speaks.
      `deployment/host_ports.py` cites GRAPHDB_PORT_CONFIG_KEY from this same
      module, so the port-conflict remedy cannot drift from the schema.
  services.graphdb.http_port_host:
    evidence: 'block\.get\("http_port_host"\)'
    note: >-
      Published HTTP port (7474) for the Neo4j Browser and the container
      healthcheck. NOT the health category, which dials the store over bolt on
      `port_host` (or an explicit `uri`). Graphdb is the first single compose
      service publishing two host ports, which is why the port-conflict remedy
      resolves per container port — a conflict on 7474 that named `port_host`
      would send the operator to edit the wrong number.
  services.graphdb.ttl_path:
    evidence: '_optional_text\(block\.get\("ttl_path"\)'
    note: >-
      Optional RDF/Turtle corpus the store is seeded from; unset brings the
      store up bootstrapped but empty. Kept verbatim by
      GraphdbServiceConfig.ttl_path and resolved against the config file's
      directory by its consumers, per the `facility_knowledge.bundle_path` rule
      — resolving it against the process cwd would give a deploy and a CLI verb
      two different files from one config value.
  services.graphdb.heap_initial_size:
    evidence: 'block\.get\("heap_initial_size"\)'
    note: >-
      JVM heap the server starts with. Spelled explicitly because Neo4j sizes
      nothing automatically inside a container: left unset it reads the host's
      memory and picks numbers the container's own limit will not honour.
  services.graphdb.heap_max_size:
    evidence: 'block\.get\("heap_max_size"\)'
    note: Ceiling the JVM heap may grow to. Same container-sizing reason as above.
  services.graphdb.pagecache_size:
    evidence: 'block\.get\("pagecache_size"\)'
    note: >-
      Off-heap cache for graph data and indexes. Separate from the heap and not
      taken out of it: the container's memory budget is roughly heap max plus
      this plus about half a gigabyte of JVM overhead.
  services.graphdb.query_timeout_s:
    evidence: '_setting\(QUERY_TIMEOUT_CONFIG_KEY'
    note: >-
      Transaction timeout the graph MCP server hands to the store for one
      `read_cypher` call, so a runaway traversal is cancelled server-side
      instead of being held open by a client that has already given up. Read in
      mcp_server/graph/server_context.py rather than by the deploy resolver —
      the value never reaches compose, so this is the first graphdb key whose
      evidence sits outside deployment/graphdb_service.py.
  services.graphdb.query_max_rows:
    evidence: '_setting\(QUERY_MAX_ROWS_CONFIG_KEY'
    note: >-
      Rows one `read_cypher` call returns before the result is truncated; the
      tool reports the truncation, so a partial answer is never mistaken for a
      complete one. Bounds what a question costs the AGENT's context window
      rather than what it costs the store, which is why it is a query-time key
      and not a container one.
  # `services.graphdb.bind_address` is deliberately absent for the same reason
  # qmd's is — every service publishes on the project-wide
  # `deployment.bind_address`, and graphdb reuses that one reading.
  # `services.graphdb.uri` and `services.graphdb.username` are absent too, but
  # for a different reason: they are read (by `resolve_graphdb_connection`, for
  # an EXTERNAL store this deployment connects to but does not run) and simply
  # rendered by no shipped template, so a manifest entry would fail the
  # phantom-key check. There is deliberately no `password` key at any layer —
  # the credential lives in the project .env as GRAPHDB_PASSWORD.

  # ── Safety / approval ───────────────────────────────────────────────
  approval:
    all-templates: true
    evidence: 'config\.get\("approval", \{\}\)'
  approval.enabled:
    all-templates: true
    covered-by: approval
  approval.default_policy:
    all-templates: true
    evidence: 'default_policy'
  approval.tools:
    covered-by: approval
    note: >-
      Absent from channel_finder_standalone by design — its only
      approval-governed tool (setup_patch) is covered by default_policy.
      See governed_sets.
  approval.tools.channel_write:
    evidence: 'approval\.tools\.channel_write'
    note: >-
      Anchored for the same reason as channel_read below: `channel_write`
      names the MCP tool as well as the policy key, and the literal has now
      spread past the vacuity ceiling -- a bare match no longer proves a
      reader exists. The anchored form cites the settings-panel schema and
      the config-writer default that actually serve this key.
  approval.tools.channel_read:
    evidence: 'approval\.tools\.channel_read'
    note: >-
      Anchored on the settings-panel schema that serves this key rather than
      on the bare word. `channel_read` names the MCP tool as well as the
      policy, so the literal spread across enough modules to trip the
      vacuity guard -- a match that no longer proved a reader existed.
  approval.tools.archiver_read: {evidence: 'archiver_read'}
  approval.tools.execute: {covered-by: approval.tools}
  approval.tools.setup_patch: {evidence: 'setup_patch'}
  approval.tools.entry_create:
    evidence: 'entry_create'
    note: >-
      Inert in hello_world: that template disables the ariel server, so the
      tool never exists. Harmless (fail-closed either way); recorded so it is
      not mistaken for drift.
  hooks:
    evidence: 'full_config\.get\("hooks", \{\}\)'
  hooks.debug:
    evidence: 'cfg\.get\("hooks", \{\}\)\.get\("debug"\)'
    note: >-
      Live true in control_assistant / ariel_standalone /
      channel_finder_standalone; commented (absent reads as false) in project
      and hello_world. Deliberate.

  # ── Control system ──────────────────────────────────────────────────
  control_system: {evidence: 'get_config_value\("control_system", \{\}\)'}
  control_system.type: {evidence: 'get_config_value\("control_system\.type", "mock"\)'}
  control_system.writes_enabled:
    evidence: 'get_config_value\("control_system\.writes_enabled", False\)'
  control_system.limits_checking: {evidence: 'limits_checking'}
  control_system.limits_checking.enabled:
    evidence: 'get_config_value\("control_system\.limits_checking\.enabled", False\)'
  control_system.limits_checking.database_path:
    evidence: 'get_config_value\("control_system\.limits_checking\.database_path", None\)'
  control_system.limits_checking.allow_unlisted_channels:
    evidence: 'allow_unlisted_channels'
  control_system.write_verification:
    evidence: 'get_config_value\("control_system\.write_verification", \{\}\)'
  control_system.write_verification.default_level:
    evidence: 'get_config_value\("control_system\.write_verification\.default_level", "callback"\)'
  control_system.write_verification.default_tolerance_percent:
    evidence: 'default_tolerance_percent'
  control_system.read_inline_max_elements:
    evidence: '"control_system\.read_inline_max_elements"'
  control_system.channel_read_artifact_retention:
    evidence: '"control_system\.channel_read_artifact_retention"'
  control_system.connector: {covered-by: control_system}
  control_system.connector.mock: {covered-by: control_system.connector}
  control_system.connector.mock.simulation_file: {evidence: 'simulation_file'}
  control_system.connector.mock.response_delay_ms: {evidence: 'response_delay_ms'}
  control_system.connector.mock.noise_level: {evidence: 'noise_level'}
  control_system.connector.epics: {covered-by: control_system.connector}
  control_system.connector.epics.timeout: {covered-by: control_system.connector.epics}
  control_system.connector.epics.gateways: {evidence: 'gateways'}
  control_system.connector.epics.gateways.read_only:
    evidence: 'gateways\.get\("read_only", \{\}\)'
    note: >-
      Anchored on the gateway SELECTION in epics_connector, not on the bare
      word: `read_only` now appears in 31 files under the evidence roots (the
      claude-setup file service and the scaffold gallery both use it for their
      own read-only flags), which is past the vacuity cap and would have kept
      the entry green with no reader left. The virtual-accelerator entry below
      cites the same site on purpose — the VA connector subclasses the EPICS
      one and inherits this selection rather than repeating it.
  control_system.connector.epics.gateways.read_only.address: {covered-by: control_system.connector.epics.gateways.read_only}
  control_system.connector.epics.gateways.read_only.port: {covered-by: control_system.connector.epics.gateways.read_only}
  control_system.connector.epics.gateways.read_only.use_name_server: {evidence: 'use_name_server'}
  control_system.connector.epics.gateways.write_access: {evidence: 'write_access'}
  control_system.connector.epics.gateways.write_access.address: {covered-by: control_system.connector.epics.gateways.write_access}
  control_system.connector.epics.gateways.write_access.port: {covered-by: control_system.connector.epics.gateways.write_access}
  control_system.connector.epics.gateways.write_access.use_name_server: {evidence: 'use_name_server'}
  control_system.connector.virtual_accelerator: {covered-by: control_system.connector}
  control_system.connector.virtual_accelerator.timeout: {covered-by: control_system.connector.virtual_accelerator}
  control_system.connector.virtual_accelerator.simulation_file: {evidence: 'simulation_file'}
  control_system.connector.virtual_accelerator.gateways: {evidence: 'gateways'}
  control_system.connector.virtual_accelerator.gateways.read_only:
    evidence: 'gateways\.get\("read_only", \{\}\)'
    note: >-
      The VA connector subclasses the EPICS one and reaches its read-only
      gateway through the inherited selection, so the evidence cites that one
      site. Same anchoring reason as the EPICS entry above.
  control_system.connector.virtual_accelerator.gateways.read_only.address: {covered-by: control_system.connector.virtual_accelerator.gateways.read_only}
  control_system.connector.virtual_accelerator.gateways.read_only.use_name_server:
    evidence: 'use_name_server'
  control_system.connector.virtual_accelerator.gateways.write_access: {evidence: 'write_access'}
  control_system.connector.virtual_accelerator.gateways.write_access.address: {covered-by: control_system.connector.virtual_accelerator.gateways.write_access}
  control_system.connector.virtual_accelerator.gateways.write_access.use_name_server:
    evidence: 'use_name_server'
  control_system.connector.virtual_accelerator.probe_channel:
    forward-declared: true
    note: >-
      The channel the target switch reads to prove this target is reachable
      before it becomes the active one. Written by the templates ahead of the
      switch's own reader (this branch); a target without one is ineligible,
      which is why the VA block ships it set and the epics block does not.
  control_system.connector.epics.probe_channel:
    rendered: false
    forward-declared: true
    note: >-
      Same key, commented in both templates that carry an epics block. A live
      probe channel is facility-specific and cannot be guessed, and an unset
      one leaves the live target un-switchable-to rather than falsely
      eligible — the fail-closed direction.

  # ── Control-system target switch ────────────────────────────────────
  control_system.target_switch:
    forward-declared: true
    note: >-
      Tuning + acknowledgment block for the running-session control-system
      target switch. Rendered ahead of its readers on this branch.
  control_system.target_switch.drain_timeout_s: {forward-declared: true}
  control_system.target_switch.probe_interval_s: {forward-declared: true}
  control_system.target_switch.live_gateway_acknowledged:
    rendered: false
    forward-declared: true
    note: >-
      Commented in every template that renders an epics block. The operator
      sets it to their OWN live gateway hostname; the shipped example is a
      real-hostname-SHAPED string on purpose (an actually-real one in the
      control_assistant template, a neutral one in the project template), so
      nothing can string-test a value for "still the default". Only
      set-and-non-empty is ever checked.

  # ── Archiver ────────────────────────────────────────────────────────
  archiver: {evidence: 'get_config_value\("archiver", \{\}\)'}
  # Evidenced by the factory's own diagnostic for an unset type, not by the name
  # of whichever connector happens to be the default. The literal 'mock_archiver'
  # used to serve here and stopped describing the key the moment the
  # control-assistant default became mongodb_archiver — a matcher that tracks a
  # default is a matcher that goes quiet on the change it should have caught.
  archiver.type: {evidence: 'archiver\.type is not set'}
  # Point budget behind archiver_read's span-derived default bin (issue #117).
  archiver.auto_bin_points: {evidence: 'archiver\.auto_bin_points'}
  archiver.epics_archiver: {evidence: 'epics_archiver'}
  archiver.epics_archiver.url: {covered-by: archiver.epics_archiver}
  archiver.epics_archiver.timeout: {covered-by: archiver.epics_archiver}
  # The stored archive's connection block, rendered by the control_assistant
  # template and written from the profile's `va_archiver:` block at build time.
  archiver.mongodb_archiver: {evidence: 'mongodb_archiver'}
  archiver.mongodb_archiver.host: {covered-by: archiver.mongodb_archiver}
  archiver.mongodb_archiver.port: {covered-by: archiver.mongodb_archiver}
  archiver.mongodb_archiver.name: {covered-by: archiver.mongodb_archiver}
  archiver.mongodb_archiver.collection: {covered-by: archiver.mongodb_archiver}
  archiver.mongodb_archiver.auth: {covered-by: archiver.mongodb_archiver}
  archiver.mongodb_archiver.username: {covered-by: archiver.mongodb_archiver}
  archiver.mongodb_archiver.password_env: {covered-by: archiver.mongodb_archiver}
  archiver.mongodb_archiver.timeout: {covered-by: archiver.mongodb_archiver}

  # ── Execution ───────────────────────────────────────────────────────
  execution: {evidence: 'execution = config\.get\("execution"\) if isinstance\(config, dict\) else None'}
  execution.execution_method:
    evidence: 'execution\.get\("execution_method"\) if isinstance\(execution, dict\) else None'
  execution.environment:
    forward-declared: true
    note: >-
      Build provenance. Nothing reads it at run time by design — the template
      comment says so explicitly. Recorded so the guard does not demand a reader.
  execution.environment.python: {forward-declared: true}
  execution.environment.packages: {forward-declared: true}
  execution.environment.inherit_exclude: {forward-declared: true}

  # ── System / paths ──────────────────────────────────────────────────
  system:
    all-templates: true
    evidence: 'config\.get\("system", \{\}\)\.get\("timezone", "UTC"\)'
  system.timezone:
    all-templates: true
    evidence: 'get_config_value\("system\.timezone", None\)'
  agent_data:
    all-templates: true
    evidence: '\(config or \{\}\)\.get\("agent_data"\) or \{\}'
  agent_data.base_dir:
    all-templates: true
    evidence: 'section\.get\("base_dir"\) or DEFAULT_AGENT_DATA_BASE_DIR'
    note: >-
      The only key naming this directory. Anchored on the resolver's return
      expression (utils/workspace.agent_data_base_dir); the previous
      'agent_data\.base_dir' regex matched only PROSE — docstrings and comments —
      so it would have stayed green if the reader itself were deleted.
  file_paths:
    all-templates: true
    evidence: 'config\.get\("file_paths", \{\}\)'
  file_paths.api_calls_dir:
    all-templates: true
    evidence: 'get_agent_dir\("api_calls_dir"\)'
    note: >-
      Absent from file_paths, the subdirectory falls back to the KEY'S OWN NAME
      (utils/config.get_agent_dir), so a missing entry silently renames the
      directory rather than failing.
  file_paths.registry_exports_dir:
    all-templates: true
    evidence: 'get_agent_dir\("registry_exports_dir"\)'

  # ── API providers ───────────────────────────────────────────────────
  api:
    all-templates: true
    evidence: 'api_providers'
  api.providers:
    all-templates: true
    data-map: true
    key-shape:
      required: [base_url, models]
      models-tiers: [haiku, sonnet, opus]
    evidence: 'defines no models mapping'
    note: >-
      Provider NAMES are user-extensible data, not schema — membership
      deliberately differs (10 providers in project/control_assistant/
      hello_world, a 6-provider subset in the two standalone bundles). The
      guard checks SHAPE per provider (base_url present, all three tiers
      mapped), never membership. At runtime a tier no source maps falls back
      to the default model with a warning; only a provider with no models map
      AND no default model to fall back on hard-errors in
      build/claude_code_resolver.py, which is the quoted evidence. The guard
      stays stricter than the runtime on purpose — a shipped template should
      map every tier rather than lean on that fallback.

  # ── Claude Code ─────────────────────────────────────────────────────
  claude_code:
    all-templates: true
    evidence: 'get_config_value\("claude_code", \{\}\)'
  claude_code.provider:
    all-templates: true
    evidence: 'get_config_value\("claude_code\.provider", ""\)'
  claude_code.default_model:
    all-templates: true
    evidence: 'claude_code_config\.get\("default_model"\)'
  claude_code.servers:
    evidence: 'claude_code_config\.get\("servers", \{\}\)'
    note: >-
      Server enable/disable overrides, consumed by registry.mcp.resolve_servers.
      Anchored because EIGHT covered-by children terminate here — a weak regex
      at this node would silently hollow out all of them.
  claude_code.servers.controls: {covered-by: claude_code.servers}
  claude_code.servers.controls.enabled: {covered-by: claude_code.servers.controls}
  claude_code.servers.python: {covered-by: claude_code.servers}
  claude_code.servers.python.enabled: {covered-by: claude_code.servers.python}
  claude_code.servers.ariel: {covered-by: claude_code.servers}
  claude_code.servers.ariel.enabled: {covered-by: claude_code.servers.ariel}
  claude_code.servers.channel-finder: {covered-by: claude_code.servers}
  claude_code.servers.channel-finder.enabled: {covered-by: claude_code.servers.channel-finder}
  claude_code.servers.osprey_facility_knowledge: {evidence: 'osprey_facility_knowledge'}
  claude_code.servers.osprey_facility_knowledge.enabled: {covered-by: claude_code.servers.osprey_facility_knowledge}
  claude_code.agents: {evidence: 'resolve_agents'}
  claude_code.agents.logbook-search: {evidence: 'logbook-search'}
  claude_code.agents.logbook-search.enabled: {covered-by: claude_code.agents.logbook-search}
  claude_code.agents.logbook-deep-research: {evidence: 'logbook-deep-research'}
  claude_code.agents.logbook-deep-research.enabled: {covered-by: claude_code.agents.logbook-deep-research}
  claude_code.telemetry:
    all-templates: true
    covered-by: claude_code
  claude_code.telemetry.enabled:
    all-templates: true
    covered-by: claude_code.telemetry
  claude_code.telemetry.backend:
    evidence: 'telemetry_cfg\.get\("backend"\) == "openobserve"'
  claude_code.telemetry.protocol: {evidence: 'http/protobuf'}
  claude_code.telemetry.openobserve: {evidence: 'telemetry_cfg\.get\("openobserve"\)'}
  claude_code.telemetry.openobserve.user: {covered-by: claude_code.telemetry.openobserve}
  claude_code.telemetry.openobserve.password: {covered-by: claude_code.telemetry.openobserve}
  claude_code.telemetry.openobserve.org: {covered-by: claude_code.telemetry.openobserve}
  claude_code.telemetry.log_user_prompts: {evidence: 'log_user_prompts'}
  claude_code.telemetry.log_assistant_responses: {evidence: 'log_assistant_responses'}
  claude_code.telemetry.log_tool_details: {evidence: 'log_tool_details'}
  claude_code.telemetry.log_raw_api_bodies: {evidence: 'log_raw_api_bodies'}

  # ── Channel finder ──────────────────────────────────────────────────
  channel_finder: {evidence: 'channel_finder = config\.get\("channel_finder"'}
  channel_finder.pipeline_mode: {evidence: 'pipeline_mode'}
  channel_finder.pipelines: {covered-by: channel_finder}
  channel_finder.pipelines.in_context: {covered-by: channel_finder.pipelines}
  channel_finder.pipelines.in_context.database: {covered-by: channel_finder.pipelines.in_context}
  channel_finder.pipelines.in_context.database.type: {covered-by: channel_finder.pipelines.in_context.database}
  channel_finder.pipelines.in_context.database.path: {covered-by: channel_finder.pipelines.in_context.database}
  channel_finder.pipelines.in_context.database.presentation_mode:
    evidence: 'presentation_mode'
    note: >-
      Preview rendering only — honoured by the preview/validate paths; the MCP
      server and web UI build their own prompt text and never consult it.
  channel_finder.pipelines.in_context.subagent_model: {evidence: 'subagent_model'}
  channel_finder.pipelines.hierarchical: {covered-by: channel_finder.pipelines}
  channel_finder.pipelines.hierarchical.database: {covered-by: channel_finder.pipelines.hierarchical}
  channel_finder.pipelines.hierarchical.database.type: {covered-by: channel_finder.pipelines.hierarchical.database}
  channel_finder.pipelines.hierarchical.database.path: {covered-by: channel_finder.pipelines.hierarchical.database}
  channel_finder.pipelines.hierarchical.feedback: {covered-by: channel_finder.pipelines.hierarchical}
  channel_finder.pipelines.hierarchical.feedback.enabled: {covered-by: channel_finder.pipelines.hierarchical.feedback}
  channel_finder.pipelines.hierarchical.feedback.store_path: {evidence: 'store_path'}
  channel_finder.pipelines.middle_layer: {covered-by: channel_finder.pipelines}
  channel_finder.pipelines.middle_layer.database: {covered-by: channel_finder.pipelines.middle_layer}
  channel_finder.pipelines.middle_layer.database.type: {covered-by: channel_finder.pipelines.middle_layer.database}
  channel_finder.pipelines.middle_layer.database.path: {covered-by: channel_finder.pipelines.middle_layer.database}
  channel_finder.benchmark:
    evidence: 'channel_finder\.benchmark\.dataset_path'
    note: >-
      control_assistant ONLY, deliberately. It is the only bundle shipping the
      query corpus; materialize_tier_artifacts no-ops for bundles with no
      data/channel_databases/tiers/ subtree, so a dataset_path in the other
      templates would name a phantom. The channel-finder app runs the command
      via --queries-path instead.
  channel_finder.benchmark.dataset_path:
    evidence: 'No benchmark query set configured'

  # ── ARIEL ───────────────────────────────────────────────────────────
  ariel: {evidence: 'get_config_value\("ariel", \{\}\)'}
  ariel.ingestion: {covered-by: ariel}
  ariel.ingestion.adapter: {covered-by: ariel.ingestion}
  ariel.ingestion.source_url: {evidence: 'source_url'}
  ariel.default_search_mode: {evidence: 'default_search_mode'}
  # The facility vocabulary: shorthand the operators type, mapped to the words
  # the logbook prose actually uses. Read ONCE at config parse — the file is
  # loaded by ARIELConfig.from_dict, not lazily on first search — so each leaf
  # anchors on its own reader in config.py rather than a covered-by chain. That
  # matters here for the same reason it does for the hybrid knobs above: a
  # present-but-malformed knob is refused, never defaulted, and the refusal
  # message IS the reader, so the regex dies with it.
  ariel.vocabulary:
    evidence: 'config_dict\.get\("vocabulary"\)'
  ariel.vocabulary.enabled:
    evidence: '_vocab_bool\(data, "enabled"'
    note: >-
      The off switch. Shipped false everywhere except the control_assistant
      bundle, which ships the example vocabulary as the format tutorial. False
      means nothing is read at all, so a stale `path` left behind is inert
      rather than a startup failure.
  ariel.vocabulary.path:
    evidence: '_VOCABULARY_PREFIX\}\.path must be a non-empty string'
    note: >-
      Config-relative, resolved against the directory holding config.yml — the
      same rule as `facility_knowledge.bundle_path` and the qmd mirror. Enabled
      with no value here is a validate() error rather than a silent no-op, and
      a file that fails to load is stored as a keyed error, never swallowed.
  ariel.vocabulary.expand_by_default:
    evidence: '_vocab_bool\(data, "expand_by_default"'
    note: >-
      Whether a request that expresses no preference gets expansion. Shipped
      explicitly as true beside `enabled`, because the per-request
      `expand_query` argument overrides it and an operator reading the config
      should be able to see which way the default falls.
  ariel.vocabulary.canonical_to_acronym:
    evidence: '_vocab_bool\(data, "canonical_to_acronym"'
    note: >-
      Default true: a query that spells a phrase out should still reach entries
      that wrote the acronym.
  ariel.vocabulary.canonical_to_shorthand:
    evidence: '_vocab_bool\(data, "canonical_to_shorthand"'
    note: >-
      Default false, the opposite of its acronym sibling: expanding prose into
      operator shorthand adds noise far more often than recall.
  ariel.vocabulary.expand_modes:
    rendered: false
    evidence: '_VOCABULARY_PREFIX\}\.expand_modes names no enabled search'
    note: >-
      Unset — the shipped state — means "all enabled modes"; the key exists so a
      facility whose hybrid reranking degrades under expansion can drop `hybrid`
      without giving up keyword expansion. An entry naming a module that is
      unknown or not enabled is a validate() error, so the templates omit the
      key rather than shipping a list that would rot as modules are toggled —
      hence `rendered: false`: the omission is the design, and the default "every
      enabled search module" can never go stale because nothing restates it.
  ariel.search_modules:
    evidence: 'config_dict\.get\("search_modules", \{\}\)\.items\(\)'
  ariel.search_modules.keyword: {covered-by: ariel.search_modules}
  ariel.search_modules.keyword.enabled: {covered-by: ariel.search_modules.keyword}
  # The keyword module's pattern knobs. Same rule as the hybrid stanza below,
  # for the same reason: SearchModuleConfig.from_dict keeps only `enabled`,
  # `provider`, `model` and `settings`, so a knob written as a sibling of
  # `enabled` is inert forever with no error. Each leaf therefore anchors on the
  # type refusal that proves the nested spelling is the one being read — the
  # refusal message IS the reader, so the regex dies with it.
  ariel.search_modules.keyword.settings:
    evidence: '_SETTINGS_PREFIX = "search_modules\.keyword\.settings"'
  ariel.search_modules.keyword.settings.patterns_enabled:
    evidence: '_SETTINGS_PREFIX\}\.patterns_enabled must be a boolean'
    note: >-
      Shipped as `true`, matching DEFAULT_PATTERNS_ENABLED: `/regex/` spans and
      `*` globs are what an operator reaches for first. False makes both forms
      ordinary full-text tokens — the escape hatch for a facility whose entry
      text is full of literal asterisks. A present-but-malformed value is
      refused, never defaulted, because defaulting it would leave the
      deployment on the behaviour it explicitly asked to leave.
  ariel.search_modules.keyword.settings.pattern_timeout_seconds:
    evidence: '_SETTINGS_PREFIX\}\.pattern_timeout_seconds must be a number'
    note: >-
      Shipped as `10.0`, matching DEFAULT_PATTERN_TIMEOUT_SECONDS. The envelope
      is applied only to a search that actually emitted a `~*` predicate, so a
      pattern-free query is untouched by it. Never clamped up into range: a
      configured `0` means the deployment believes it disabled the envelope,
      and answering that with a silent ten seconds is worse than naming the key.
  ariel.search_modules.semantic: {covered-by: ariel.search_modules}
  ariel.search_modules.semantic.enabled: {covered-by: ariel.search_modules.semantic}
  ariel.search_modules.semantic.provider: {covered-by: ariel.search_modules.semantic}
  ariel.search_modules.semantic.model: {covered-by: ariel.search_modules.semantic}
  # The hybrid search mode, answered by the qmd sidecar. Unlike its
  # keyword/semantic siblings the knobs
  # get their OWN evidence rather than a covered-by chain, because the loader
  # they pass through is the one place this block can silently evaporate:
  # SearchModuleConfig.from_dict keeps `enabled`, `provider`, `model` and
  # `settings` and DROPS every other key without a word (unlike the enhancement
  # loader beside it, which folds extras into settings). A knob written as a
  # sibling of `enabled` is therefore inert forever — no error, just defaults —
  # so each regex below anchors on the reader that proves the nested spelling
  # is the one being read.
  ariel.search_modules.hybrid:
    evidence: 'config\.search_modules\.get\("hybrid"\)'
  ariel.search_modules.hybrid.enabled: {covered-by: ariel.search_modules.hybrid}
  ariel.search_modules.hybrid.settings:
    evidence: '_SETTINGS_PREFIX = "search_modules\.hybrid\.settings"'
  ariel.search_modules.hybrid.settings.rerank:
    evidence: '_SETTINGS_PREFIX\}\.rerank must be a boolean'
    note: >-
      Shipped as `true`, matching DEFAULT_RERANK and qmd's own default. One
      key, both surfaces: the agent-facing hybrid_search tool and the ARIEL
      search panel read it, and each can override it without changing the
      deployment — the tool per call, the panel per session until Reset. The
      reranker dominates query latency — an LLM reviews each candidate — but
      it is not load-bearing: a reranked query that fails is
      retried once without it. The OKF side is a separate key and defaults the
      other way. The evidence anchors on the type refusal rather than the read:
      a present-but-malformed knob is rejected, never defaulted, because
      defaulting it would strand a deployment on the path it asked to leave.
  ariel.search_modules.hybrid.settings.candidate_limit:
    evidence: '_SETTINGS_PREFIX\}\.candidate_limit must be a positive integer'
    note: >-
      Shipped as `40`, matching DEFAULT_CANDIDATE_LIMIT and qmd's own
      `candidateLimit`. One key for both surfaces, like `rerank` above. The
      other documented latency lever: lowering it trades recall for speed.
  ariel.enhancement_modules:
    evidence: 'get\("enhancement_modules", \{\}\)'
    note: >-
      Pinned to the loader that reads the block rather than to the bare word,
      which by now appears in enough modules and tests to pass the vacuity
      check on mentions alone.
  ariel.enhancement_modules.semantic_processor: {evidence: 'semantic_processor'}
  ariel.enhancement_modules.semantic_processor.enabled: {covered-by: ariel.enhancement_modules.semantic_processor}
  ariel.enhancement_modules.semantic_processor.provider: {covered-by: ariel.enhancement_modules.semantic_processor}
  ariel.enhancement_modules.semantic_processor.model: {covered-by: ariel.enhancement_modules.semantic_processor}
  ariel.enhancement_modules.semantic_processor.model.model_id: {covered-by: ariel.enhancement_modules.semantic_processor.model}
  ariel.enhancement_modules.semantic_processor.model.max_tokens: {evidence: 'max_tokens'}
  ariel.enhancement_modules.text_embedding: {evidence: 'text_embedding'}
  ariel.enhancement_modules.text_embedding.enabled: {covered-by: ariel.enhancement_modules.text_embedding}
  ariel.enhancement_modules.text_embedding.provider: {covered-by: ariel.enhancement_modules.text_embedding}
  ariel.enhancement_modules.text_embedding.models: {covered-by: ariel.enhancement_modules.text_embedding}
  # The markdown mirror the qmd sidecar indexes — one file per logbook entry,
  # written during ingestion. Paired with `ariel.search_modules.hybrid` above: the
  # export without the search mode indexes a corpus nobody queries, and the
  # search mode without the export queries a corpus nobody wrote.
  ariel.enhancement_modules.qmd_export:
    evidence: 'get_enhancement_module_config\("qmd_export"\)'
  ariel.enhancement_modules.qmd_export.enabled: {covered-by: ariel.enhancement_modules.qmd_export}
  ariel.enhancement_modules.qmd_export.settings:
    evidence: 'export\.get\("settings"\)'
    note: >-
      Evidence is the compose generator, not the ARIEL loader, and that is the
      point. EnhancementModuleConfig.from_dict folds unknown top-level keys
      into `settings`, so both spellings reach the exporter identically — but
      the compose generator reads the raw config.yml, where they are still
      distinct, and prefers the nested one. The template ships the nested
      spelling so the bind mount and the exporter cannot disagree about which
      directory the mirror is.
  ariel.enhancement_modules.qmd_export.settings.mirror_path:
    evidence: 'config\.get\("mirror_path"\)'
    note: >-
      Config-relative, resolved against the directory holding config.yml — the
      same rule as `facility_knowledge.bundle_path`. Shipped under var/, the
      gitignored STATE zone: the mirror is machine-written from Postgres and is
      as large as the logbook, so a path under the tracked data/ zone would
      commit a generated corpus. An enabled export with no value here is
      refused at configure() time rather than skipped.
  ariel.embedding: {covered-by: ariel}
  ariel.embedding.provider: {covered-by: ariel.embedding}

  # ── Logbook / facility knowledge / panels ───────────────────────────
  logbook: {evidence: 'get_config_value\("logbook\.composition", \{\}\)'}
  logbook.composition: {evidence: 'get_config_value\("logbook\.composition", \{\}\)'}
  logbook.composition.provider: {covered-by: logbook.composition}
  logbook.composition.default_tier: {evidence: 'default_tier'}
  facility_knowledge:
    evidence: 'config_key="facility_knowledge"'
    note: >-
      The section is read through the companion-server registry, not by a
      literal config.get at the reading site: registry/web.py declares
      config_key="facility_knowledge" on the okf WebServerDefinition, and both
      readers (web_server_config_section and the auto-launch checker) go through
      that field. The declaration is therefore the only place the key name
      appears, and the evidence anchors on it.
  facility_knowledge.bundle_path:
    evidence: 'get_config_value\("facility_knowledge\.bundle_path", None\)'
  artifact_server: {evidence: 'config\.get\("artifact_server"\) or \{\}'}
  artifact_server.host: {covered-by: artifact_server}
  artifact_server.port: {covered-by: artifact_server}
  artifact_server.auto_launch: {evidence: 'auto_launch'}

  # ── Web UI / CLI ────────────────────────────────────────────────────
  web: {evidence: 'config\.get\("web", \{\}\)'}
  web.theme:
    evidence: 'get_config_value\("web\.theme", DEFAULT_WEB_THEME\)'
    note: >-
      Live in project only; commented in control_assistant; absent from the
      three others. The default is "main" whether the key is live or absent,
      so no behaviour depends on the form. Deliberately per-template.
      Read in one place — theme_config.configured_web_theme(), the shared
      resolver the web terminal and the artifact gallery both call — where
      the shipped default family lives as the DEFAULT_WEB_THEME constant
      the evidence cites, so it survives a future rename of the family.
  web.panels: {evidence: 'web\.panels'}
  web.panels.ariel: {covered-by: web.panels}
  web.panels.ariel.enabled: {covered-by: web.panels.ariel}
  web.panels.channel-finder: {covered-by: web.panels}
  web.panels.channel-finder.enabled: {covered-by: web.panels.channel-finder}
  web.docs_url:
    evidence: 'get_config_value\(\s*"web\.docs_url",\s*DEFAULT_DOCS_URL\s*\)'
    note: >-
      Rendered live in the four templates that carry a `web:` block;
      hello_world has none, so this is deliberately not all-templates.
      The `\s*` between the call's parts is load-bearing: these four reads sit
      in one lifespan block, and the formatter wraps a call across lines purely
      on line length, so a single-line pattern reds the guard when a rename
      pushes an unrelated call past the margin.
  web.config_panel:
    evidence: '(?:get_config_value|resolve_config_flag)\(\s*"web\.config_panel\.'
    note: >-
      The block is never read as a mapping — its single leaf below carries the
      whole read, so the evidence anchors on the prefix they share and this
      entry dies with that reader rather than outliving it. Rendered live in
      the four templates that carry a `web:` block; hello_world has none, so
      this is deliberately not all-templates, same as `web.docs_url`.
  web.config_panel.enabled:
    evidence: '(?:get_config_value|resolve_config_flag)\(\s*"web\.config_panel\.enabled",\s*True'
    note: >-
      Tier gate for the Config panel, and a SERVER-side one: false makes
      /api/config and /api/claude-setup refuse every verb with 403 and takes
      the panel out of the GET /api/panels payload. config.yml and .claude/
      are what the agent's permission surface is rendered from, so a
      client-only gate would be undone by typing the route's URL. Shipped
      true — the panel every single-user deployment has always had — and
      pinned false by the multi-user persona presets that are not the admin
      tier. The default is spelled in the evidence because it is the
      fail-open posture: an unreadable config must not silently take an
      operator's own config editor away.
  web.scaffold_gallery:
    evidence: '(?:get_config_value|resolve_config_flag)\(\s*"web\.scaffold_gallery\.'
    note: >-
      The block is never read as a mapping — its single leaf below carries the
      whole read, so the evidence anchors on the prefix they share and this
      entry dies with that reader rather than outliving it. Rendered live in
      the four templates that carry a `web:` block; hello_world has none, so
      this is deliberately not all-templates, same as `web.config_panel`.
  web.scaffold_gallery.write_enabled:
    evidence: '(?:get_config_value|resolve_config_flag)\(\s*"web\.scaffold_gallery\.write_enabled",\s*True'
    note: >-
      Tier gate for the Scaffold gallery, and a SERVER-side one: false makes
      every write and delete verb under /api/scaffold refuse with 403 (create,
      claim, save, unoverride, register, delete-untracked) while the read
      routes stay open. The gallery authors `.claude/rules|skills|agents`
      content, which the agent loads at PROJECT scope, so a client-only gate
      would be undone by curl — the same cosmetic-gate failure `ui_mode:
      simple` was. Shipped true — the gallery every single-user deployment has
      always had — and pinned false by the multi-user persona presets that are
      not the admin tier. The default is spelled in the evidence because it is
      the fail-open posture: a config-read error must not silently revoke an
      operator's own gallery. The `\s*` between the call's parts is
      load-bearing for the same reason `web.docs_url` carries it: the formatter
      wraps this call across lines on length alone.
  web.feedback:
    evidence: 'get_config_value\("web\.feedback\.'
    note: >-
      The block is never read as a mapping — each of the three leaves below
      has its own dotted lookup in the web terminal's lifespan. The evidence
      anchors on the prefix those readers share, so this entry dies with the
      last of them rather than outliving them all.
  web.feedback.github_repo:
    evidence: 'get_config_value\(\s*"web\.feedback\.github_repo",\s*DEFAULT_FEEDBACK_GITHUB_REPO\s*\)'
  web.feedback.email:
    evidence: 'get_config_value\(\s*"web\.feedback\.email",\s*DEFAULT_FEEDBACK_EMAIL\s*\)'
  web.feedback.max_store_bytes:
    evidence: 'get_config_value\(\s*"web\.feedback\.max_store_bytes",\s*DEFAULT_FEEDBACK_MAX_STORE_BYTES\s*\)'
  web.channel_suggestions: {evidence: 'web\.get\("channel_suggestions"\)'}
  web.channel_suggestions.enabled: {evidence: 'section\.get\("enabled", True\)'}
  web.channel_suggestions.max_channels:
    evidence: 'section\.get\("max_channels", DEFAULT_MAX_CHANNELS\)'
  cli: {evidence: 'get_config_value\("cli\.theme", "default", config_path\)'}
  cli.theme: {evidence: 'get_config_value\("cli\.theme", "default", config_path\)'}

