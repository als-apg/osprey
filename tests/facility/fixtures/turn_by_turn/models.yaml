# An injection chain whose stored current may be zero, and the example ring on
# pyAT as a turn-by-turn ring fed by the chain. The ring shot counter steps
# after the ring charge, so a shot always carries that shot's charge.
- name: CHAIN
  engine: injection
  settings:
    injection:
      cycle:
        period_s: 1.0
        width_s: 0.5
      stages: [transfer, ring]
      current_per_charge: 2.0
  wiring:
    - address: INJ:SHOT:REQ
      engine: {signal: request}
    - address: INJ:GUN:CHARGE:SP
      engine: {signal: parameter, quantity: charge, start: 1.5}
    - address: INJ:TRANSFER:EFF:SP
      engine: {signal: parameter, quantity: efficiency, stage: 0, start: 0.8}
    - address: INJ:RING:EFF:SP
      engine: {signal: parameter, quantity: efficiency, stage: 1, start: 0.6}
    - address: INJ:RING:CURRENT:SP
      engine: {signal: parameter, quantity: current, start: 0.0}
    - address: INJ:SHOT:COUNT
      engine: {signal: counter, offset_s: 0.01}
    - address: INJ:TRANSFER:COUNT
      engine: {signal: counter, offset_s: 0.02}
    - address: INJ:TRANSFER:CHARGE
      engine: {signal: charge, offset_s: 0.03, stage: 0}
    - address: INJ:TRANSFER:EFF
      engine: {signal: efficiency, offset_s: 0.04, stage: 0}
    - address: INJ:RING:CHARGE
      engine: {signal: charge, offset_s: 0.05, stage: 1}
    - address: INJ:RING:SHOT:COUNT
      engine: {signal: counter, offset_s: 0.06}
    - address: INJ:RING:EFF
      engine: {signal: efficiency, offset_s: 0.07, stage: 1}
    - address: INJ:RING:CURRENT
      engine: {signal: current, offset_s: 0.08}
    - address: INJ:RING:CURRENT:FAST
      engine: {signal: current_fast}
    - address: INJ:SHOT:BUSY
      engine: {signal: busy}
- name: RING
  engine: pyat
  deck: decks/SR.json
  settings:
    pyat:
      solve: periodic
      # Calibrated with the tracking core: RF off, the radiation loss drives
      # the bunch into the aperture between turns 110 and 210, none left by
      # turn 250; RF on, every particle survives 250 turns.
      turn_by_turn:
        injection_element: INJ
        turns: 250
        trigger_sample: 10
        particles: 16
        launch: {x: 0.001, px: 0.0, y: -0.0005, py: 0.0, delta: 0.0, ct: 0.0}
        emittance_x: 2.0e-08
        emittance_y: 2.0e-09
        sigma_delta: 0.001
        sigma_z: 0.003
        jitter: {x: 5.0e-05, y: 3.0e-05}
        aperture: {shape: elliptical, x: 0.004, y: 0.004}
        sum_per_charge: 1.0
        sum_per_stored: 0.01
        sum_floor: 0.01
        position_noise: 1.0e-05
        sum_noise: 0.001
        floor_noise: 0.001
        tone_period: 10
        tone_amplitude: 0.5
  inputs:
    - {address: INJ:RING:SHOT:COUNT, engine: {signal: shot}}
    - {address: INJ:RING:CHARGE, engine: {signal: charge}}
    - {address: INJ:RING:CURRENT, engine: {signal: stored_current}}
  wiring:
    - address: SR:RF:SWITCH
      engine: {signal: rf_switch}
    - address: SR:DIAG:TBT:PILOT
      engine: {signal: pilot_tone}
    - address: SR:DIAG:TBT:STORED:01
      engine: {signal: stored}
    - address: SR:DIAG:TBT:STORED:02
      engine: {signal: stored}
    - address: SR:DIAG:TBT:TURNS
      engine: {signal: turns_tracked}
    - address: SR:DIAG:BPM:01:ARM
      element: BPM01
      engine: {signal: arm}
    - address: SR:DIAG:BPM:01:ARMED
      element: BPM01
      engine: {signal: armed}
    - address: SR:DIAG:BPM:01:TBT:X
      element: BPM01
      engine: {signal: turn_x}
    - address: SR:DIAG:BPM:01:TBT:Y
      element: BPM01
      engine: {signal: turn_y}
    - address: SR:DIAG:BPM:01:TBT:SUM
      element: BPM01
      engine: {signal: turn_sum}
    - address: SR:DIAG:BPM:02:ARM
      element: BPM02
      engine: {signal: arm}
    - address: SR:DIAG:BPM:02:ARMED
      element: BPM02
      engine: {signal: armed}
    - address: SR:DIAG:BPM:02:TBT:X
      element: BPM02
      engine: {signal: turn_x}
    - address: SR:DIAG:BPM:02:TBT:Y
