      - OSPREY_SIMULATOR_LOG_DIR=/app/dls_controls-assistant/var/simulator
      - OSPREY_GUARDED_RUN_DIR=/app/dls_controls-assistant/var/guarded_run
      - OSPREY_TERMINAL_LANDING_URL=http://dls-deploy.dls.example.org:10000
      - OSPREY_TERMINAL_BIND_HOST=127.0.0.1
      - OSPREY_TERMINAL_WEB_PORT=10101
      - OSPREY_WEB_PORT=10101
      - OSPREY_TERMINAL_SESSION_LIFETIME=43200
      - OSPREY_TERMINAL_SECRET=${OSPREY_TERMINAL_SECRET_BOB:-}
      - OSPREY_TERMINAL_EXTERNAL_ORIGIN=http://dls-deploy.dls.example.org:10000
      - OSPREY_ARTIFACT_SERVER_PORT=10201
      - OSPREY_ARIEL_PORT=10301
      - OSPREY_CHANNEL_FINDER_PORT=10501
      - OSPREY_LATTICE_DASHBOARD_PORT=10401
      - OSPREY_FACILITY_KNOWLEDGE_PORT=10601
      - OSPREY_HEALTH_PORT=10701
    volumes:
      - bob-claude-config:/data/claude-config
      - bob-claude-projects:/data/claude-config/projects
      - bob-agent-data:/app/dls_controls-assistant/var/agent_data
      - ./var/spool/bob:/app/dls_controls-assistant/var/spool/bob
      - ./var/state/bob:/app/dls_controls-assistant/var/state/bob
      - ./var/agent_data/control_target/bob:/app/dls_controls-assistant/var/agent_data/control_target/bob
      # The DEPLOYMENT's simulator model logs, read-write: the in-process
      # composite appends `<model>.log` here, beside the records the Virtual
      # Accelerator writes, and `osprey sim status` prints these paths. The
      # deploy provisions the directory setgid + group-writable, and the
      # entrypoint joins its group (OSPREY_SIMULATOR_LOG_DIR above).
      - ./var/simulator:/app/dls_controls-assistant/var/simulator
      # The DEPLOYMENT's guarded-run directory, read-write: one lock per
      # control target, shared with every other container that runs the
      # agent, so a run started here contends for the same lock. The deploy
      # provisions it setgid +
      # group-writable, and the entrypoint joins its group
      # (OSPREY_GUARDED_RUN_DIR above).
      - ./var/guarded_run:/app/dls_controls-assistant/var/guarded_run
    healthcheck:
      # A bare `osprey web` with no OSPREY_WEB_PORT override falls back to the
      # layout's `web` slot at the deployment's own base (resolve_web_port in
      # cli/web_cmd.py). Every per-user container here sets OSPREY_WEB_PORT
      # above, so the probe targets the ACTUAL bound port, never that
      # fallback. Probed via bind_host itself (not a hardcoded "127.0.0.1"
      # literal) since that's the same loopback address
      # OSPREY_TERMINAL_BIND_HOST bakes into the app's own bind.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:10101/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s



  web-logbook:
    image: git.dls.example.org:5050/physics/production/dls-profiles/web-terminal-logbook:latest
    container_name: dls_controls-web-logbook
    restart: unless-stopped
