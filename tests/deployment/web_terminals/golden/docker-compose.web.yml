
services:

  nginx:
    image: nginx:1.31-alpine
    container_name: dls_controls-nginx
    restart: unless-stopped
    network_mode: host
    security_opt: ["no-new-privileges:true"]
    labels:
      com.osprey.repo-id: "@REPO_ID@"
    environment:
      - TZ=America/Los_Angeles
      - NGINX_ENVSUBST_FILTER=^OSPREY_TERMINAL_SECRET_
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx/osprey
      - OSPREY_TERMINAL_SECRET_ALICE=${OSPREY_TERMINAL_SECRET_ALICE:-}
      - OSPREY_TERMINAL_SECRET_BOB=${OSPREY_TERMINAL_SECRET_BOB:-}
      - OSPREY_TERMINAL_SECRET_LOGBOOK=${OSPREY_TERMINAL_SECRET_LOGBOOK:-}
    volumes:
      - ./build/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./build/nginx/landing.html:/usr/share/nginx/html/landing.html:ro
      - ./build/nginx/templates:/etc/nginx/templates:ro
    tmpfs:
      - /etc/nginx/osprey:mode=0700
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:10000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s



  web-alice:
    image: git.dls.example.org:5050/physics/production/dls-profiles/web-terminal:latest
    container_name: dls_controls-web-alice
    restart: unless-stopped
    network_mode: host
    security_opt: ["no-new-privileges:true"]
    labels:
      com.osprey.repo-id: "@REPO_ID@"
    env_file:
      - .env.users
      - .env.agent-record.login.alice
    environment:
      - CLAUDE_CONFIG_DIR=/data/claude-config
      - HOME=/data/claude-config
      - TZ=America/Los_Angeles
      - OSPREY_TERMINAL_USER=alice
      - OSPREY_AUDIT_IDENTITY=alice
      - OSPREY_SPOOL_DIR=/app/dls_controls-assistant/var/spool/alice
      - OSPREY_STATE_DIR=/app/dls_controls-assistant/var/state/alice
      - OSPREY_AGENT_RECORD_URL=http://127.0.0.1:10053
      - OSPREY_CONTROL_CONTEXT_DIR=/app/dls_controls-assistant/var/agent_data/control_target/alice
      - OSPREY_SIMULATOR_LOG_DIR=/app/dls_controls-assistant/var/simulator
      - OSPREY_GUARDED_RUN_DIR=/app/dls_controls-assistant/var/guarded_run
      - OSPREY_TERMINAL_LANDING_URL=http://dls-deploy.dls.example.org:10000
      - OSPREY_TERMINAL_BIND_HOST=127.0.0.1
      - OSPREY_TERMINAL_WEB_PORT=10100
      - OSPREY_WEB_PORT=10100
      - OSPREY_TERMINAL_SESSION_LIFETIME=43200
      - OSPREY_TERMINAL_SECRET=${OSPREY_TERMINAL_SECRET_ALICE:-}
      - OSPREY_TERMINAL_EXTERNAL_ORIGIN=http://dls-deploy.dls.example.org:10000
      - OSPREY_ARTIFACT_SERVER_PORT=10200
      - OSPREY_ARIEL_PORT=10300
      - OSPREY_CHANNEL_FINDER_PORT=10500
      - OSPREY_LATTICE_DASHBOARD_PORT=10400
      - OSPREY_FACILITY_KNOWLEDGE_PORT=10600
      - OSPREY_HEALTH_PORT=10700
    volumes:
      - alice-claude-config:/data/claude-config
      - alice-claude-projects:/data/claude-config/projects
      - alice-agent-data:/app/dls_controls-assistant/var/agent_data
      - ./var/spool/alice:/app/dls_controls-assistant/var/spool/alice
      - ./var/state/alice:/app/dls_controls-assistant/var/state/alice
      - ./var/agent_data/control_target/alice:/app/dls_controls-assistant/var/agent_data/control_target/alice
      # The DEPLOYMENT's simulator model logs, read-write: the in-process
      # composite appends `<model>.log` here, beside the records the Virtual
      # Accelerator writes, and `osprey sim status` prints these paths. The
      # deploy provisions the directory setgid + group-writable, and the
      # entrypoint joins its group (OSPREY_SIMULATOR_LOG_DIR above).
      - ./var/simulator:/app/dls_controls-assistant/var/simulator
      # The DEPLOYMENT's guarded-run directory, read-write: one lock per
      # control target, shared with every other container that runs the
      # agent, so a run started here contends for the same lock. The deploy
      # provisions it setgid +
      # group-writable, and the entrypoint joins its group
      # (OSPREY_GUARDED_RUN_DIR above).
      - ./var/guarded_run:/app/dls_controls-assistant/var/guarded_run
    healthcheck:
      # A bare `osprey web` with no OSPREY_WEB_PORT override falls back to the
      # layout's `web` slot at the deployment's own base (resolve_web_port in
      # cli/web_cmd.py). Every per-user container here sets OSPREY_WEB_PORT
      # above, so the probe targets the ACTUAL bound port, never that
      # fallback. Probed via bind_host itself (not a hardcoded "127.0.0.1"
      # literal) since that's the same loopback address
      # OSPREY_TERMINAL_BIND_HOST bakes into the app's own bind.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:10100/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s



