      - TZ=America/Los_Angeles
      - OSPREY_TERMINAL_USER=logbook
      - OSPREY_AUDIT_IDENTITY=logbook
      - OSPREY_SPOOL_DIR=/app/dls_controls-logbook/var/spool/logbook
      - OSPREY_STATE_DIR=/app/dls_controls-logbook/var/state/logbook
      - OSPREY_AGENT_RECORD_URL=http://127.0.0.1:10053
      - OSPREY_CONTROL_CONTEXT_DIR=/app/dls_controls-logbook/var/agent_data/control_target/logbook
      - OSPREY_SIMULATOR_LOG_DIR=/app/dls_controls-logbook/var/simulator
      - OSPREY_GUARDED_RUN_DIR=/app/dls_controls-logbook/var/guarded_run
      - OSPREY_TERMINAL_LANDING_URL=http://dls-deploy.dls.example.org:10000
      - OSPREY_TERMINAL_BIND_HOST=127.0.0.1
      - OSPREY_TERMINAL_WEB_PORT=10199
      - OSPREY_WEB_PORT=10199
      - OSPREY_TERMINAL_SESSION_LIFETIME=43200
      - OSPREY_TERMINAL_SECRET=${OSPREY_TERMINAL_SECRET_LOGBOOK:-}
      - OSPREY_TERMINAL_EXTERNAL_ORIGIN=http://dls-deploy.dls.example.org:10000
      - "OSPREY_WEB_APP_NAME=logbook"
      - OSPREY_ARTIFACT_SERVER_PORT=10299
      - OSPREY_ARIEL_PORT=10399
      - OSPREY_CHANNEL_FINDER_PORT=10599
      - OSPREY_LATTICE_DASHBOARD_PORT=10499
      - OSPREY_FACILITY_KNOWLEDGE_PORT=10699
      - OSPREY_HEALTH_PORT=10799
    volumes:
