# ============================================================
# PROVIDER CATALOG
# ============================================================
# Every model provider this deployment can name. `provider:` in profile.yml
# picks one of these entries by name, and the build renders this whole file
# into `api.providers` in build/config.yml.
#
# Each entry carries:
#   base_url       required — the OpenAI-compatible endpoint
#   default_model  required — the model id a deployment runs when its profile
#                  names none; one of `models`
#   models         required — a list of the model ids the gateway serves,
#                  spelled exactly as the gateway spells them
#   api_key        optional — usually an ${ENV_VAR} reference, expanded at runtime
#   health_model   optional — the cheapest served id, used by the health check;
#                  absent, the provider adapter's own health model answers
#   claude_code_aliases
#                  optional — a partial or full {haiku, sonnet, opus} map of
#                  served ids. These are Claude Code's own alias names; only a
#                  gateway that serves Claude models can fill them honestly,
#                  and only when it wants to pin them rather than let the
#                  build derive them from `models`.
#   api_protocol   optional — `anthropic` or `openai`, the only two values it
#                  takes. `anthropic` names an endpoint that speaks the
#                  Anthropic API directly and so skips the translation proxy;
#                  an absent key means `openai`. Anything else, a capitalised
#                  `Anthropic` included, is refused when the provider is
#                  resolved rather than silently routed through the proxy.
#
# Add your own gateway by appending an entry; the keys above are the whole
# contract. A copy of this file beside profile.yml replaces the packaged
# catalog outright — it is not merged — so an entry deleted here is gone.
# `osprey profile expand --providers` refreshes the packaged entries.
#
# API keys are read from the project .env at runtime, never stored here.

providers:
  cborg:
    api_key: ${CBORG_API_KEY}
    base_url: https://api.cborg.lbl.gov/v1
    default_model: claude-haiku-4-5
    health_model: claude-haiku-4-5
    models:
      - claude-opus-5
      - claude-sonnet-5
      - claude-haiku-4-5
  amsc-i2:
    api_key: ${AMSC_I2_API_KEY}
    base_url: https://api.i2-core.american-science-cloud.org/v1
    default_model: claude-sonnet
    models:
      - claude-haiku
      - claude-sonnet
      - claude-opus
  stanford:
    api_key: ${STANFORD_API_KEY}
    base_url: https://aiapi-prod.stanford.edu/v1
    default_model: gpt-4o
    models:
      - gpt-4o-mini
      - gpt-4o
      - o3-mini
  openai:
    api_key: ${OPENAI_API_KEY}
    base_url: https://api.openai.com/v1
    default_model: gpt-6-sol
    health_model: gpt-5.6-luna
    models:
      - gpt-6-astra
      - gpt-6-sol
      - gpt-6-luna
      - gpt-5.6-luna
  anthropic:
    api_key: ${ANTHROPIC_API_KEY}
    base_url: https://api.anthropic.com
    default_model: claude-sonnet-5
    models:
      - claude-fable-5-1
      - claude-opus-5-5
      - claude-opus-5
      - claude-sonnet-5
      - claude-haiku-4-5
  google:
    api_key: ${GOOGLE_API_KEY}
    base_url: https://generativelanguage.googleapis.com/v1beta
    default_model: gemini-3.8-flash
    models:
      - gemini-3.8-flash
      - gemini-3.5-flash-lite
      - gemini-2.5-pro
  ollama:
    api_key: ollama
    base_url: ${OLLAMA_HOST:-http://localhost:11434}
    default_model: gpt-oss:20b
    models:                        # Local models — `ollama pull` each one before use
      - mistral:7b
      - gpt-oss:20b
      - gpt-oss:120b
  argo:
    api_key: ${ARGO_API_KEY}
    base_url: ${ARGO_BASE_URL:-https://apps.inside.anl.gov/argoapi/v1}
    default_model: claudesonnet45
    models:                        # Argo spells its model IDs without punctuation
      - claudehaiku45
      - claudesonnet45
      - claudeopus41
  als-apg:
    api_key: ${ALS_APG_API_KEY}
    # The gateway this provider fronts. A site whose gateway is elsewhere
    # exports ALS_APG_BASE_URL, which beats this value, or replaces the line
    # below with that endpoint's /v1 URL in its own copy of the catalog.
    base_url: https://llm.als.lbl.gov/v1
    default_model: claude-sonnet-5
    health_model: claude-haiku-4-5-20251001
    models:
      - claude-fable-5-1
      - claude-opus-5-5
      - claude-sonnet-5
      - claude-haiku-4-5-20251001
  # DwarfStar (ds4) — local DeepSeek V4 server (https://github.com/antirez/ds4)
  # No API key required. If the server runs on a remote host, forward the port:
  #   ssh -L 8000:127.0.0.1:8000 <host>
  ds4:
    api_key: EMPTY                  # ds4 ignores auth; any non-empty string works
    base_url: http://127.0.0.1:8000/v1
    default_model: deepseek-v4-flash
    models:
      - deepseek-v4-flash
      - deepseek-v4-pro
