# Demo Facility (readonly) — one access level of this deployment's agent
#
# A tier adds to ../profile.yml and never subtracts from it: the build lays
# this file over that one. Services, data and ports stay profile.yml's. To see
# the combined result:
#   osprey validate tiers/readonly.yml
#
# Copied from the bundled `readonly` tier with the rest of this fixture. Like
# profile.yml beside it, it carries no `provenance:` block: this fixture is
# trimmed by hand, so there is no emission for `osprey validate` to hold it
# against.

name: Demo Facility (readonly)

# ── Config overrides ─────────────────────────────────────────────────────────
# Dotted keys ONLY, as in the deployment's own config: block.
config:
  # The axis this tier hard-pins. `never` wins over the deployment's own
  # `allowed`, since a tier's key beats the root's, so no session of this
  # tier writes to any machine the deployment configures.
  control_system.writes: never
