control_system.writes: asked
web.panels:
  corrector-trim:
    label: Scaffold
    url: http://127.0.0.1:10900
    path: /
    health_endpoint: /health
    app: corrector-trim
    agent_routes:
    - method: GET
      path: /api/state
    - method: POST
      path: /api/write
    launch_token_env: CORRECTOR_TRIM_LAUNCH_TOKEN
    enabled: true
claude_code.servers:
  corrector-trim:
    command: '{current_python_env}'
    args:
    - -m
    - corrector_trim.tools
    env:
      OSPREY_APP_NAME: corrector-trim
      OSPREY_CONFIG: '{project_root}/build/config.yml'
      CONFIG_FILE: '{project_root}/build/config.yml'
    permissions:
      allow:
      - read_channel
    writes:
    - set_channel
    app: corrector-trim
apps:
  corrector-trim:
    approval:
      set_channel:
        prompt: Set {{ state.channel }} to {{ input.value }}, now {{ state.readback }}.
        panel_id: corrector-trim
        state_path: /api/state
        display_lines_key: null
        bind:
          state_fields:
          - field: approved_readback
            key: readback
          input_digests: []
        require:
          all_of:
          - approved_target
          - approved_readback
          one_of: []
        errors:
          unreachable: The panel's backend is not answering; check its container with osprey health.
          refused: The value was not written. Read the channel again and ask for a new approval.
    tools:
      read:
      - read_channel
      errors:
        unreachable: The panel's backend is not answering; check its container with osprey health.
        refused: The value was not written. Read the channel again and ask for a new approval.
dispatch.denied_app_tools:
- mcp__corrector-trim__set_channel
settings.json:
  hooks:
    PreToolUse:
    - matcher: mcp__corrector-trim__set_channel
      hooks:
      - run: .claude/hooks/osprey_writes_check.py
        timeout: 5
      - run: .claude/hooks/osprey_approval.py --budget 30
        timeout: 30
    PostToolUse:
    - matcher: mcp__corrector-trim__.*
      hooks:
      - run: .claude/hooks/osprey_error_guidance.py
        timeout: 5
    - matcher: mcp__corrector-trim__set_channel
      hooks:
      - run: .claude/hooks/osprey_approval.py
        timeout: 5
    PostToolUseFailure:
    - matcher: mcp__corrector-trim__set_channel
      hooks:
      - run: .claude/hooks/osprey_approval.py
        timeout: 5
  permissions:
    allow:
    - mcp__corrector-trim__read_channel
hook_config.json:
  server_prefixes:
  - mcp__corrector-trim__
  approval_prefixes:
  - mcp__corrector-trim__
  write_tools:
  - mcp__corrector-trim__set_channel
  facility_write_tools:
  - mcp__corrector-trim__set_channel
  governed_tools:
  - mcp__corrector-trim__set_channel
  app_approvals:
    mcp__corrector-trim__set_channel:
      app: corrector-trim
      bind:
        input_digests: []
        state_fields:
        - field: approved_readback
          key: readback
      display_lines_key: null
      errors:
        refused: The value was not written. Read the channel again and ask for a new approval.
        unreachable: The panel's backend is not answering; check its container with osprey health.
      panel_id: corrector-trim
      prompt: Set {{ state.channel }} to {{ input.value }}, now {{ state.readback }}.
      require:
        all_of:
        - approved_target
        - approved_readback
        one_of: []
      state_path: /api/state
  app_error_types:
    corrector-trim.refused:
      class: Safety
      text: The value was not written. Read the channel again and ask for a new approval.
    corrector-trim.unreachable:
      class: Connection
      text: The panel's backend is not answering; check its container with osprey health.
  plan_mode_denied_tools:
  - mcp__corrector-trim__set_channel
panel_token_routes:
- - GET
  - /panel/corrector-trim/api/state
- - POST
  - /panel/corrector-trim/api/write
reach:
  consumers:
  - name: The corrector-trim panel
    'on': true
    resolves: true
    dial:
    - 127.0.0.1
    - 10900
  credentials_held:
  - CORRECTOR_TRIM_LAUNCH_TOKEN
