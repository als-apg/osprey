agent_data:
  base_dir: var/agent_data
agent_record:
  backend: clickhouse
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.18.2
    memory: 2g
  memory: 1g
  port: 10053
  readers:
  - name: carol
  retention_days: 90
api:
  providers:
  - als-apg
  - amsc-i2
  - anthropic
  - argo
  - cborg
  - ds4
  - google
  - llama-cpp
  - ollama
  - openai
  - stanford
approval:
  default_policy: always
  enabled: true
  tools:
    add_panel_to_rail: always
    archiver_read: skip
    channel_read: skip
    channel_write: always
    entry_create: always
    entry_publish: always
    execute: selective
    register_panel: always
    remove_panel_from_rail: always
    setup_patch: always
archiver:
  auto_bin_points: 10000
  mongodb_archiver:
    auth:
      password_env: MONGO_ROOT_PASSWORD
      source: admin
      username: osprey
    collection: pv_history
    host: localhost
    name: osprey_archiver
    port: 10801
    timeout_s: 5
  type: mongodb_archiver
ariel:
  attachments:
    copy_on_ingest: images
    view:
      enabled: true
  default_search_mode: hybrid
  embedding:
    provider: ollama
  enhancement_modules:
    image_caption:
      enabled: true
      model:
        model_id: qwen3-vl:4b
      provider: ollama
    image_embedding:
      dimensions: 1024
      enabled: true
      model: qwen3-vl-embedding-2b
      provider: llama-cpp
    qmd_export:
      enabled: true
      settings:
        mirror_path: var/ariel_mirror
    semantic_processor:
      enabled: false
      model:
        max_tokens: 256
      provider: anthropic
    text_embedding:
      enabled: true
      models:
      - dimension: 768
        max_input_tokens: 2048
        name: nomic-embed-text
      provider: ollama
  search_modules:
    hybrid:
      enabled: true
      settings:
        candidate_limit: 40
        rerank: true
        strategy: qmd
    keyword:
      enabled: true
      settings:
        fuzzy_threshold: 0.3
        pattern_timeout_seconds: 10.0
        patterns_enabled: true
    semantic:
      enabled: true
      model: nomic-embed-text
      provider: ollama
  vocabulary:
    canonical_to_acronym: true
    canonical_to_shorthand: false
    enabled: true
    expand_by_default: true
    expand_entries: false
    path: data/ariel/vocabulary.yml
artifact_server:
  auto_launch: true
  example_artifact: false
  host: 127.0.0.1
  port: 10200
bluesky:
  queue_autostart: true
build_dir: ./build
channel_finder:
  benchmark:
    dataset_path: data/benchmarks/queries.json
  query_max_rows: 500
claude_code:
  permissions:
    deny:
    - mcp__osprey_workspace__setup_patch
  provider: anthropic
  servers:
    bluesky:
      enabled: false
    channel-finder:
      enabled: false
    controls:
      enabled: false
    health:
      enabled: false
    osprey_facility_knowledge:
      enabled: false
    python:
      enabled: false
cli:
  theme: default
container_runtime: docker
control_system:
  channel_read_artifact_retention: 20
  connector:
    epics:
      timeout_s: 5.0
    live_standin:
      gateways:
        read_only:
          address: localhost
          port: 10090
          use_name_server: true
        write_access:
          address: localhost
          port: 10090
          use_name_server: true
      probe_channel: SR:VAC:GAUGE:SR01:PRESSURE:RB
    virtual_accelerator:
      gateways:
        read_only:
          address: localhost
          use_name_server: true
        write_access:
          address: localhost
          use_name_server: true
      probe_channel: SR:VAC:GAUGE:SR01:PRESSURE:RB
      timeout_s: 5.0
  limits_checking:
    database_path: data/channel_limits.json
    enabled: true
    mode: optional
  read_inline_max_elements: 2000
  target_switch:
    drain_timeout_s: 5
    probe_interval_s: 30
    probe_timeout_s: 5
  type: virtual_accelerator
  writes: never
deploy:
  fqdn: 127.0.0.1
deployed_services: []
execution:
  execution_method: subprocess
facility_knowledge:
  bundle_path: data/facility/knowledge
file_paths:
  registry_exports_dir: registry_exports
health:
  auto:
    mcp:
      url_key: host_url
  categories:
    archiver:
      checks:
      - channel: SR:DIAG:DCCT:01:CURRENT:RB
        max_age_s: 60
        name: archiver_freshness
        type: archiver_freshness
hooks:
  debug: true
logbook:
  composition:
    provider: anthropic
modules:
  web_terminals:
    auth:
      allow_insecure_http: true
      method: password
      session_lifetime: 43200
    default_tier: readonly
    enabled: false
    image_source: local
    landing:
      footer: OSPREY multi-user web terminal stack. Experimental system. Proceed with
        caution.
      groups:
      - label: Users
        type: users
      - label: Apps
        type: apps
      notices:
      - data/landing/working-safely.md
    shared:
    - logbook
    - knowledge
    - channel-finder
    users:
    - display_name: Control Room (Alice)
      index: 0
      name: alice
      tier: readwrite
    - display_name: Read-Only View (Bob)
      index: 1
      name: bob
      tier: readonly
    - display_name: Deployment Admin (Carol)
      index: 2
      name: carol
      tier: admin
project_name: osprey-freeze-logbook
scaffold:
  user_owned:
  - rules/facility
services:
  archiver_recorder:
    path: ./services/archiver_recorder
  graphdb:
    port_host: 10802
    ttl_path: ./data/graph/facility.ttl
  live_standin:
    port: 10090
  postgresql:
    database_name: ariel
    port_host: 10800
    username: ariel
  qmd:
    port: 10060
  virtual_accelerator:
    port: 5064
simulation:
  default_scenarios:
  - rf-thermal
  models: null
  tick_s: 1.0
system:
  timezone: UTC
va_archiver:
  hot_cadence_sec: 10
  hot_span_hours: 48
  recorder_cadence_sec: 10
  recorder_poll_sec: 30
  recorder_tail_cadence_sec: 60
  retention_days: 30
  tail_cadence_sec: 60
web:
  channel_suggestions:
    enabled: true
    max_channels: 50000
  config_panel:
    enabled: false
  control_target_picker: false
  default_panel: ariel
  panels:
    ariel:
      enabled: true
    system-health:
      enabled: false
      hidden: true
  scaffold_gallery:
    write_enabled: false
  theme: light
  ui_mode: expert
