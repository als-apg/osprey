agent_data:
  base_dir: var/agent_data
api:
  providers:
  - als-apg
  - amsc-i2
  - anthropic
  - argo
  - cborg
  - ds4
  - google
  - ollama
  - openai
  - stanford
approval:
  default_policy: always
  enabled: true
  tools:
    archiver_read: skip
    channel_read: skip
    channel_write: always
    entry_create: always
    execute: selective
    setup_patch: always
archiver:
  auto_bin_points: 10000
  mongodb_archiver:
    auth: admin
    collection: pv_history
    host: localhost
    name: osprey_archiver
    password_env: MONGO_ROOT_PASSWORD
    port: 10801
    timeout: 5
    username: osprey
  type: mongodb_archiver
ariel:
  default_search_mode: hybrid
  embedding:
    provider: ollama
  enhancement_modules:
    qmd_export:
      enabled: true
      settings:
        mirror_path: var/ariel_mirror
    semantic_processor:
      enabled: false
      model:
        max_tokens: 256
        model_id: haiku
      provider: anthropic
    text_embedding:
      enabled: true
      models:
      - dimension: 768
        name: nomic-embed-text
      provider: ollama
  search_modules:
    hybrid:
      enabled: true
      settings:
        candidate_limit: 40
        rerank: true
    keyword:
      enabled: true
      settings:
        pattern_timeout_seconds: 10.0
        patterns_enabled: true
    semantic:
      enabled: true
      model: nomic-embed-text
      provider: ollama
  vocabulary:
    canonical_to_acronym: true
    canonical_to_shorthand: false
    enabled: true
    expand_by_default: true
    path: data/ariel/vocabulary.yml
artifact_server:
  auto_launch: true
  example_artifact: false
  host: 127.0.0.1
  port: 10200
bluesky:
  queue_autostart: true
build_dir: ./build
channel_finder:
  benchmark:
    dataset_path: data/benchmarks/queries.json
  pipeline_mode: graph
  pipelines: null
claude_code:
  default_model: haiku
  permissions:
    deny:
    - mcp__osprey_workspace__setup_patch
    - mcp__osprey_facility_knowledge__draft_concept
  provider: anthropic
  servers:
    ariel:
      enabled: false
    bluesky:
      enabled: false
    controls:
      enabled: false
    health:
      enabled: false
    python:
      enabled: false
  telemetry:
    backend: openobserve
    enabled: true
    log_assistant_responses: true
    log_raw_api_bodies: true
    log_tool_details: true
    log_user_prompts: true
    openobserve:
      org: default
      password: ${ZO_INGEST_SA_TOKEN}
      user: ${ZO_INGEST_USER_EMAIL:-ingest@example.com}
    protocol: http/protobuf
cli:
  theme: default
container_runtime: docker
control_system:
  channel_read_artifact_retention: 20
  connector:
    epics:
      timeout: 5.0
      writes_enabled: false
    live_standin:
      gateways:
        read_only:
          address: localhost
          port: 10090
          use_name_server: true
        write_access:
          address: localhost
          port: 10090
          use_name_server: true
      probe_channel: SR:VAC:GAUGE:SR01:PRESSURE:RB
    mock:
      simulation_file: data/simulation/machine.json
    virtual_accelerator:
      gateways:
        read_only:
          address: localhost
          use_name_server: true
        write_access:
          address: localhost
          use_name_server: true
      limits_checking:
        allow_unlisted_channels: true
        enabled: true
      probe_channel: SR:VAC:GAUGE:SR01:PRESSURE:RB
      simulation_file: data/simulation/machine.json
      timeout: 5.0
      writes_enabled: false
  limits_checking:
    allow_unlisted_channels: false
    database_path: data/channel_limits.json
    enabled: true
  read_inline_max_elements: 2000
  target_switch:
    drain_timeout_s: 5
    probe_interval_s: 30
  type: live_standin
  writes_enabled: false
deploy:
  fqdn: 127.0.0.1
deployed_services: []
execution:
  execution_method: subprocess
facility:
  ontology: data/facility_ontology.json
  prefix: ca
facility_knowledge:
  bundle_path: data/facility_knowledge
file_paths:
  api_calls_dir: api_calls
  registry_exports_dir: registry_exports
health:
  categories:
    archiver:
      checks:
      - channel: SR:DIAG:DCCT:01:CURRENT:RB
        max_age_s: 60
        name: archiver_freshness
        type: archiver_freshness
hooks:
  debug: true
logbook:
  composition:
    default_tier: haiku
    provider: anthropic
modules:
  web_terminals:
    auth:
      allow_insecure_http: true
      method: password
      session_lifetime: 43200
    default_persona: readonly
    enabled: false
    image_source: local
    landing:
      footer: OSPREY multi-user web terminal stack. Experimental system. Proceed with
        caution.
      groups:
      - label: Users
        type: users
      notices:
      - data/landing/working-safely.md
    personas:
      admin:
        build_profile: personas/admin.yml
        project: osprey-freeze-admin
        project_path: build/osprey-freeze-admin
      knowledge:
        build_profile: personas/knowledge.yml
        landing_group: Standalone deployments
        project: osprey-freeze-knowledge
        project_path: build/osprey-freeze-knowledge
      logbook:
        build_profile: personas/logbook.yml
        landing_group: Standalone deployments
        project: osprey-freeze-logbook
        project_path: build/osprey-freeze-logbook
      readonly:
        build_profile: personas/readonly.yml
        project: osprey-freeze-readonly
        project_path: build/osprey-freeze-readonly
      readwrite:
        build_profile: personas/readwrite.yml
        project: osprey-freeze-readwrite
        project_path: build/osprey-freeze-readwrite
    users:
    - display_name: Control Room (Alice)
      index: 0
      name: alice
      persona: readwrite
    - display_name: Read-Only View (Bob)
      index: 1
      name: bob
      persona: readonly
    - access: any
      display_name: Logbook Research
      index: 2
      name: logbook
      persona: logbook
    - access: any
      display_name: Facility Knowledge
      index: 4
      name: knowledge
      persona: knowledge
    - display_name: Deployment Admin (Carol)
      index: 3
      name: carol
      persona: admin
project_name: osprey-freeze-knowledge
scaffold:
  user_owned:
  - rules/facility
services:
  archiver_recorder:
    path: ./services/archiver_recorder
  graphdb:
    port_host: 10802
  live_standin:
    port: 10090
  openobserve:
    port: 10050
  postgresql:
    database_name: ariel
    port_host: 10800
    username: ariel
  qmd:
    port: 10060
  virtual_accelerator:
    port: 5064
system:
  timezone: UTC
va_archiver:
  hot_cadence_sec: 10
  hot_span_hours: 48
  recorder_cadence_sec: 10
  recorder_poll_sec: 30
  recorder_tail_cadence_sec: 60
  retention_days: 30
  tail_cadence_sec: 60
web:
  channel_suggestions:
    enabled: true
    max_channels: 50000
  config_panel:
    enabled: false
  default_panel: okf
  docs_url: https://als-apg.github.io/osprey
  feedback:
    email: thellert@lbl.gov
    github_repo: als-apg/osprey
    max_store_bytes: 268435456
  panels:
    channel-finder:
      enabled: true
    jupyter:
      enabled: true
    okf:
      enabled: true
  scaffold_gallery:
    write_enabled: false
  theme: light
  ui_mode: expert
