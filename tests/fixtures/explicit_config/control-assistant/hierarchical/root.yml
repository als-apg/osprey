agent_data:
  base_dir: var/agent_data
agent_record:
  backend: clickhouse
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.18.2
    memory: 2g
  memory: 1g
  port: 10053
  readers:
  - name: carol
  retention_days: 90
api:
  providers:
  - als-apg
  - amsc-i2
  - anthropic
  - argo
  - cborg
  - ds4
  - google
  - llama-cpp
  - ollama
  - openai
  - stanford
approval:
  default_policy: always
  enabled: true
  tools:
    add_panel_to_rail: always
    archiver_read: skip
    channel_read: skip
    entry_create: always
    entry_publish: always
    register_panel: always
    remove_panel_from_rail: always
    setup_patch: always
apps:
  knob-example:
    approval:
      set_corrector:
        bind:
          input_digests: []
          state_fields:
          - field: approved_readback
            key: readback
        display_lines_key: null
        errors:
          refused: The value was not written. Read the channel again and ask for a
            new approval.
          unreachable: The knob panel's backend is not answering; check its container
            with osprey health.
        panel_id: knob-example
        prompt: Set {{ state.channel }} to {{ input.value }}, now {{ state.readback
          }}.
        require:
          all_of:
          - approved_target
          - approved_readback
          one_of: []
        state_path: /api/state
    tools:
      errors:
        refused: The value was not written. Read the channel again and ask for a new
          approval.
        unreachable: The knob panel's backend is not answering; check its container
          with osprey health.
      read:
      - read_corrector
archiver:
  auto_bin_points: 10000
  mongodb_archiver:
    auth:
      password_env: MONGO_ROOT_PASSWORD
      source: admin
      username: osprey
    collection: pv_history
    host: localhost
    name: osprey_archiver
    port: 10801
    timeout_s: 5
  type: mongodb_archiver
ariel:
  attachments:
    copy_on_ingest: images
    view:
      enabled: true
  default_search_mode: hybrid
  embedding:
    provider: ollama
  enhancement_modules:
    image_caption:
      enabled: true
      model:
        model_id: qwen3-vl:4b
      provider: ollama
    image_embedding:
      dimensions: 1024
      enabled: true
      model: qwen3-vl-embedding-2b
      provider: llama-cpp
    qmd_export:
      enabled: true
      settings:
        mirror_path: var/ariel_mirror
    semantic_processor:
      enabled: false
      model:
        max_tokens: 256
      provider: anthropic
    text_embedding:
      enabled: true
      models:
      - dimension: 768
        max_input_tokens: 2048
        name: nomic-embed-text
      provider: ollama
  search_modules:
    hybrid:
      enabled: true
      settings:
        candidate_limit: 40
        rerank: true
        strategy: qmd
    keyword:
      enabled: true
      settings:
        fuzzy_threshold: 0.3
        pattern_timeout_seconds: 10.0
        patterns_enabled: true
    semantic:
      enabled: true
      model: nomic-embed-text
      provider: ollama
  vocabulary:
    canonical_to_acronym: true
    canonical_to_shorthand: false
    enabled: true
    expand_by_default: true
    expand_entries: false
    path: data/ariel/vocabulary.yml
artifact_server:
  auto_launch: true
  example_artifact: true
  host: 127.0.0.1
  port: 10200
bluesky:
  queue_autostart: true
build_dir: ./build
channel_finder:
  benchmark:
    dataset_path: data/benchmarks/queries.json
  pipeline_mode: hierarchical
  pipelines:
    hierarchical:
      database:
        path: data/channel_finder/hierarchical.json
      feedback:
        enabled: true
        store_path: var/agent_data/feedback/hierarchical_feedback.json
  query_max_rows: 500
claude_code:
  permissions:
    deny:
    - mcp__osprey_workspace__setup_patch
  provider: anthropic
  servers:
    bluesky:
      enabled: true
    health:
      enabled: true
    knob-example:
      app: knob-example
      args:
      - -m
      - knob_example.tools
      command: '{current_python_env}'
      env:
        OSPREY_APP_NAME: knob-example
      permissions:
        allow:
        - read_corrector
      writes:
      - set_corrector
cli:
  theme: default
container_runtime: docker
control_system:
  channel_read_artifact_retention: 20
  connector:
    epics:
      timeout_s: 5.0
    live_standin:
      gateways:
        read_only:
          address: localhost
          port: 10090
          use_name_server: true
        write_access:
          address: localhost
          port: 10090
          use_name_server: true
      probe_channel: SR:VAC:GAUGE:SR01:PRESSURE:RB
    virtual_accelerator:
      gateways:
        read_only:
          address: localhost
          use_name_server: true
        write_access:
          address: localhost
          use_name_server: true
      probe_channel: SR:VAC:GAUGE:SR01:PRESSURE:RB
      timeout_s: 5.0
  limits_checking:
    database_path: data/channel_limits.json
    enabled: true
    mode: optional
  read_inline_max_elements: 2000
  target_switch:
    drain_timeout_s: 5
    probe_interval_s: 30
    probe_timeout_s: 5
  type: virtual_accelerator
  writes: asked
deploy:
  fqdn: 127.0.0.1
deployed_services:
- postgresql
- qmd
- graphdb
- archive
- knob-example
- event_dispatcher
- dispatch_worker
- bluesky
- bluesky_web
- virtual_accelerator
- live_standin
- mongodb
- archiver_recorder
dispatch:
  denied_app_tools:
  - mcp__knob-example__set_corrector
execution:
  execution_method: subprocess
facility_knowledge:
  bundle_path: data/facility/knowledge
file_paths:
  registry_exports_dir: registry_exports
health:
  auto:
    mcp:
      url_key: host_url
  categories:
    archiver:
      checks:
      - channel: SR:DIAG:DCCT:01:CURRENT:RB
        max_age_s: 60
        name: archiver_freshness
        type: archiver_freshness
hooks:
  debug: true
logbook:
  composition:
    provider: anthropic
modules:
  web_terminals:
    auth:
      allow_insecure_http: true
      method: password
      session_lifetime: 43200
    default_tier: readonly
    enabled: true
    image_source: local
    landing:
      footer: OSPREY multi-user web terminal stack. Experimental system. Proceed with
        caution.
      groups:
      - label: Users
        type: users
      - label: Shared logins
        type: shared
      notices:
      - data/landing/working-safely.md
    renders:
      admin:
        kind: tier
        project: osprey-freeze-admin
        project_path: build/osprey-freeze-admin
      channel-finder:
        kind: tier
        project: osprey-freeze-channel-finder
        project_path: build/osprey-freeze-channel-finder
      knowledge:
        kind: tier
        project: osprey-freeze-knowledge
        project_path: build/osprey-freeze-knowledge
      logbook:
        kind: tier
        project: osprey-freeze-logbook
        project_path: build/osprey-freeze-logbook
      readonly:
        kind: tier
        project: osprey-freeze-readonly
        project_path: build/osprey-freeze-readonly
      readwrite:
        kind: tier
        project: osprey-freeze-readwrite
        project_path: build/osprey-freeze-readwrite
    shared:
    - logbook
    - knowledge
    - channel-finder
    users:
    - display_name: Control Room (Alice)
      index: 0
      name: alice
      tier: readwrite
    - display_name: Read-Only View (Bob)
      index: 1
      name: bob
      tier: readonly
    - display_name: Deployment Admin (Carol)
      index: 2
      name: carol
      tier: admin
project_name: osprey-freeze
scaffold:
  user_owned:
  - rules/facility
services:
  archive:
    path: ./services/archive
  archiver_recorder:
    path: ./services/archiver_recorder
  bluesky:
    path: ./services/bluesky
    port: 10080
    tiled_enabled: true
    tiled_port: 10070
  bluesky_web:
    path: ./services/bluesky_web
    port: 10071
  dispatch_worker:
    bind_env: DISPATCH_WORKER_BIND
    inactivity_sec: 120
    max_turns: 25
    network: host
    path: ./services/dispatch_worker
    tier: readonly
    timeout_sec: 300
    worker_count: 1
    worker_port_base: 10011
    worker_port_stride: 1
    workspace_mode: isolated
  event_dispatcher:
    additional_dirs:
    - dst: triggers.yml
      src: triggers.yml
    bind_env: FASTMCP_HOST
    channel_strip_prefix: ''
    facility_name: Example Research Facility
    network: host
    path: ./services/event_dispatcher
    port: 10010
  graphdb:
    heap_initial_size: 512m
    heap_max_size: 1G
    http_port_host: 10803
    image: neo4j:5.26-community
    pagecache_size: 512m
    path: ./services/graphdb
    port_host: 10802
    query_max_rows: 200
    query_timeout_s: 15
    ttl_path: ./data/graph/facility.ttl
  knob-example:
    app: knob-example
    audit_identity: knob-example
    command:
    - python
    - -m
    - knob_example.server
    config_file: ./services/knob-example/app-config.yml
    control_identity: false
    drives_target: true
    env: []
    health: /health
    launch_token_env: KNOB_EXAMPLE_LAUNCH_TOKEN
    path: ./services/knob-example
    port: 10900
    roster_grant:
      panel_id: knob-example
      single_user_alias: false
    state: var/knob-example
    url: http://127.0.0.1:10900
  live_standin:
    path: ./services/virtual_accelerator
    port: 10090
  mongodb:
    compression: zstd
    path: ./services/mongodb
    port_host: 10801
    username: osprey
  postgresql:
    database_name: ariel
    path: ./services/postgresql
    port_host: 10800
    username: ariel
  qmd:
    interval: 30
    path: ./services/qmd
    port: 10060
  virtual_accelerator:
    path: ./services/virtual_accelerator
    port: 5064
simulation:
  default_scenarios:
  - rf-thermal
  models: null
  tick_s: 1.0
system:
  timezone: UTC
va_archiver:
  hot_cadence_sec: 10
  hot_span_hours: 48
  recorder_cadence_sec: 10
  recorder_poll_sec: 30
  recorder_tail_cadence_sec: 60
  retention_days: 30
  tail_cadence_sec: 60
web:
  channel_suggestions:
    enabled: true
    max_channels: 50000
  config_panel:
    enabled: false
  panels:
    ariel:
      enabled: true
    bluesky:
      enabled: false
      label: BLUESKY
      path: /bluesky/
      url: ${BLUESKY_WEB_URL:-http://localhost:10071}
    channel-finder:
      enabled: true
    events:
      enabled: false
      health_endpoint: /health
      label: EVENTS
      path: /dashboard
      url: http://localhost:10010
    jupyter:
      enabled: true
    knob-example:
      agent_routes:
      - method: GET
        path: /api/state
      - method: POST
        path: /api/write
      app: knob-example
      enabled: true
      health_endpoint: /health
      label: Knob
      launch_token_env: KNOB_EXAMPLE_LAUNCH_TOKEN
      path: /
      url: http://127.0.0.1:10900
    lattice:
      enabled: true
    okf:
      enabled: true
    system-health:
      enabled: true
      hidden: true
  scaffold_gallery:
    write_enabled: false
  theme: light
