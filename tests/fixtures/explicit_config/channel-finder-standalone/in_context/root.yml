agent_data:
  base_dir: var/agent_data
api:
  providers:
  - als-apg
  - amsc-i2
  - anthropic
  - argo
  - cborg
  - ds4
  - google
  - llama-cpp
  - ollama
  - openai
  - stanford
approval:
  default_policy: always
  enabled: true
artifact_server:
  auto_launch: true
  host: 127.0.0.1
  port: 10200
build_dir: ./build
channel_finder:
  pipeline_mode: in_context
  pipelines:
    in_context:
      database:
        path: data/channel_finder/in_context.json
      subagent_model: null
  query_max_rows: 500
claude_code:
  provider: anthropic
  servers:
    ariel:
      enabled: false
    controls:
      enabled: false
    osprey_facility_knowledge:
      enabled: false
    python:
      enabled: false
  telemetry:
    enabled: false
container_runtime: docker
deployed_services: []
execution:
  execution_method: subprocess
file_paths:
  api_calls_dir: api_calls
  registry_exports_dir: registry_exports
hooks:
  debug: true
project_name: osprey-freeze
scaffold:
  user_owned:
  - rules/facility
simulation:
  models: null
  tick_s: 1.0
system:
  timezone: UTC
web:
  config_panel:
    enabled: true
  control_target_picker: false
  default_panel: channel-finder
  feedback:
    max_store_bytes: 268435456
  panels:
    channel-finder:
      enabled: true
  scaffold_gallery:
    write_enabled: true
