agent_data:
  base_dir: var/agent_data
api:
  providers:
  - als-apg
  - amsc-i2
  - anthropic
  - argo
  - cborg
  - ds4
  - google
  - llama-cpp
  - ollama
  - openai
  - stanford
approval:
  default_policy: always
  enabled: true
  tools:
    add_panel_to_rail: always
    entry_create: always
    entry_publish: always
    register_panel: always
    remove_panel_from_rail: always
ariel:
  attachments:
    copy_on_ingest: images
    view:
      enabled: true
  default_search_mode: hybrid
  demo_narrative: all
  embedding:
    provider: ollama
  enhancement_modules:
    image_caption:
      enabled: true
      model:
        model_id: qwen3-vl:4b
      provider: ollama
    image_embedding:
      dimensions: 1024
      enabled: true
      model: qwen3-vl-embedding-2b
      provider: llama-cpp
    qmd_export:
      enabled: true
      settings:
        mirror_path: var/ariel_mirror
    semantic_processor:
      enabled: false
      model:
        max_tokens: 256
      provider: anthropic
    text_embedding:
      enabled: true
      models:
      - dimension: 768
        max_input_tokens: 2048
        name: nomic-embed-text
      provider: ollama
  search_modules:
    hybrid:
      enabled: true
      settings:
        candidate_limit: 40
        rerank: true
    keyword:
      enabled: true
      settings:
        fuzzy_threshold: 0.3
        pattern_timeout_seconds: 10.0
        patterns_enabled: true
    semantic:
      enabled: true
      model: nomic-embed-text
      provider: ollama
  vocabulary:
    canonical_to_acronym: true
    canonical_to_shorthand: false
    enabled: false
    expand_by_default: true
    expand_entries: false
artifact_server:
  auto_launch: true
  host: 127.0.0.1
  port: 10200
build_dir: ./build
claude_code:
  provider: anthropic
  servers:
    controls:
      enabled: false
    python:
      enabled: false
  telemetry:
    backend: gateway
    enabled: true
    log_assistant_responses: true
    log_raw_api_bodies: true
    log_tool_details: true
    log_user_prompts: true
    protocol: http/protobuf
container_runtime: docker
deployed_services:
- postgresql
- telemetry_store
- telemetry_gateway
- qmd
- graphdb
execution:
  execution_method: subprocess
file_paths:
  api_calls_dir: api_calls
  registry_exports_dir: registry_exports
hooks:
  debug: true
logbook:
  composition:
    provider: anthropic
project_name: osprey-freeze
scaffold:
  user_owned:
  - rules/facility
services:
  graphdb:
    heap_initial_size: 512m
    heap_max_size: 1G
    http_port_host: 10803
    image: neo4j:5.26-community
    pagecache_size: 512m
    path: ./services/graphdb
    port_host: 10802
    query_max_rows: 200
    query_timeout_s: 15
    ttl_path: ./data/graph/facility.ttl
  postgresql:
    database_name: ariel
    path: ./services/postgresql
    port_host: 10800
    username: ariel
  qmd:
    interval: 30
    path: ./services/qmd
    port: 10060
  telemetry_gateway:
    path: ./services/telemetry_gateway
    port: 10051
  telemetry_store:
    path: ./services/telemetry_store
    port: 10804
    readers:
    - name: operator
    retention_days: 14
simulation:
  models: null
  tick_s: 1.0
system:
  timezone: UTC
web:
  config_panel:
    enabled: true
  control_target_picker: false
  default_panel: ariel
  feedback:
    max_store_bytes: 268435456
  panels:
    ariel:
      enabled: true
  scaffold_gallery:
    write_enabled: true
