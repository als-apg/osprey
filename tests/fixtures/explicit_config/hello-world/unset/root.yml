agent_data:
  base_dir: var/agent_data
api:
  providers:
  - als-apg
  - amsc-i2
  - anthropic
  - argo
  - cborg
  - ds4
  - google
  - llama-cpp
  - ollama
  - openai
  - stanford
approval:
  default_policy: always
  enabled: true
  tools:
    add_panel_to_rail: always
    archiver_read: skip
    channel_read: skip
    channel_write: always
    execute: selective
    register_panel: always
    remove_panel_from_rail: always
    setup_patch: always
archiver:
  auto_bin_points: 10000
  type: mock_archiver
artifact_server:
  auto_launch: true
  host: 127.0.0.1
  port: 10200
build_dir: ./build
claude_code:
  agents:
    logbook-deep-research:
      enabled: false
    logbook-search:
      enabled: false
  provider: anthropic
  servers:
    ariel:
      enabled: false
    channel-finder:
      enabled: false
    controls:
      enabled: true
    example_server:
      args:
      - -m
      - example_server
      command: '{current_python_env}'
      env:
        OSPREY_CONFIG: '{project_root}/build/config.yml'
        PYTHONPATH: '{project_root}/build/_mcp_servers'
      permissions:
        allow:
        - example_status
        ask: []
  telemetry:
    backend: gateway
    enabled: true
    log_assistant_responses: true
    log_raw_api_bodies: true
    log_tool_details: true
    log_user_prompts: true
    protocol: http/protobuf
container_runtime: docker
control_system:
  channel_read_artifact_retention: 20
  connector:
    virtual_accelerator:
      serving: in_process
  limits_checking:
    database_path: data/channel_limits.json
    enabled: true
    mode: optional
  read_inline_max_elements: 2000
  type: virtual_accelerator
  writes_enabled: false
deployed_services:
- telemetry_store
- telemetry_gateway
execution:
  execution_method: subprocess
file_paths:
  api_calls_dir: api_calls
  registry_exports_dir: registry_exports
hooks:
  debug: false
project_name: osprey-freeze
services:
  telemetry_gateway:
    path: ./services/telemetry_gateway
    port: 10051
  telemetry_store:
    path: ./services/telemetry_store
    port: 10804
    readers:
    - name: operator
    retention_days: 14
simulation:
  models: null
  tick_s: 1.0
system:
  timezone: UTC
