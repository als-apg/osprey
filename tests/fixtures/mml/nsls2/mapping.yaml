facility:
  token: NSLS2
  title: NSLS2
  description: NSLS-II, the 3 GeV storage-ring light source at Brookhaven National Laboratory. The export
    covers the storage ring and the linac-to-booster transfer line, both taken from the Middle Layer in
    simulator mode.
  provenance: stated
systems:
  StorageRing:
    name: StorageRing
    description: 'The NSLS-II storage ring at 3.0 GeV: 30 cells of quadrupoles, sextupoles, skew quadrupoles
      and orbit correctors, with 180 beam position monitors, a DCCT, the RF master oscillator and the
      tune measurement.'
    provenance: stated
  LTB:
    name: LTB
    description: 'The NSLS-II linac-to-booster transfer line at 200 MeV: bends, quadrupoles, orbit correctors,
      beam position monitors and fluorescent screens.'
    provenance: stated
section_order:
- StorageRing
- LTB
families:
  BEND:
    class: Dipole
    aliases:
    - BEND
    description: 'Main dipoles: the storage-ring bend string (one supply per pair of cells) and the four
      LTB bends, each with a current readback and setpoint; the LTB bends also carry an on/off control
      and a summary fault.'
    provenance: stated
    channels: 136
    fields:
      Monitor:
        description: Power-supply current readback per magnet.
        provenance: stated
      Setpoint:
        description: Power-supply current setpoint per magnet.
        provenance: stated
      Fault:
        description: Power-supply summary fault status per LTB device (boolean monitor).
        provenance: stated
      OnControl:
        description: Power-supply on/off control per LTB device (boolean control).
        provenance: stated
  BPMx:
    class: BeamPositionMonitor
    aliases:
    - BPMx
    description: 'Horizontal beam position monitors: 180 in the storage ring (position, turn-by-turn)
      and 7 in the LTB (position, sum signal).'
    provenance: stated
    channels: 372
    fields:
      Monitor:
        description: Horizontal beam position per BPM (mm).
        provenance: stated
      TBT:
        description: Single-shot turn-by-turn horizontal position per storage-ring BPM (mm).
        provenance: stated
      Sum:
        description: Button sum signal per LTB BPM.
        provenance: stated
  BPMy:
    class: BeamPositionMonitor
    aliases:
    - BPMy
    description: 'Vertical beam position monitors: 180 in the storage ring (position, turn-by-turn) and
      7 in the LTB (position, sum signal).'
    provenance: stated
    channels: 372
    fields:
      Monitor:
        description: Vertical beam position per BPM (mm).
        provenance: stated
      TBT:
        description: Single-shot turn-by-turn vertical position per storage-ring BPM (mm).
        provenance: stated
      Sum:
        description: Button sum signal per LTB BPM.
        provenance: stated
  DCCT:
    class: BeamCurrentMonitor
    aliases:
    - DCCT
    description: The storage-ring DCCT, read as the averaged stored-beam current.
    provenance: stated
    channels: 3
    fields:
      Monitor:
        description: Averaged stored-beam current (mA).
        provenance: stated
  HCM:
    class: HCorrector
    aliases:
    - HCM
