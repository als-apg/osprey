facility:
  token: SPEAR3
  title: SPEAR3
  description: SPEAR3, the 3 GeV storage-ring light source of SSRL at SLAC National Accelerator Laboratory.
    The export covers the storage ring, taken from the Middle Layer in simulator mode; the Middle Layer
    stages a few transfer-line and beamline signals under the same system.
  provenance: stated
systems:
  StorageRing:
    name: StorageRing
    description: 'The SPEAR3 storage ring at 3.0 GeV in user mode: dipoles, quadrupoles, sextupoles, skew
      quadrupoles and orbit correctors, 117 beam position monitors, the DCCT, the RF station, the injection
      kickers and septum, vacuum instrumentation and the beamline and orbit-interlock signals the Middle
      Layer exposes alongside the ring.'
    provenance: stated
section_order:
- StorageRing
families:
