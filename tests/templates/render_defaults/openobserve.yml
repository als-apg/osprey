# Opt-in local telemetry backend for the OSPREY agent. OpenObserve is a
# single-binary logs/traces/metrics store that speaks OTLP natively, so the
# agent can emit its telemetry to it directly (see the `claude_code.telemetry`
# block in config.yml and docs/how-to/monitor-agent.rst). Unlike the framework's
# own services this pulls a single PUBLIC upstream image — there is no Dockerfile,
# no wheel, and no osprey source baked in.
#
# The pinned image tag is overridable like every other service image
# (env → config → default): set OSPREY_OPENOBSERVE_IMAGE (e.g.
# OSPREY_OPENOBSERVE_IMAGE=my-registry/openobserve:dev) or
# services.openobserve.image in config.yml. Pin a digest in production if
# you need byte-for-byte reproducibility.
#
# ZO_ROOT_USER_EMAIL / ZO_ROOT_USER_PASSWORD initialize the store's single admin
# account, and that is ALL they do here: they are read once, when the data volume
# is first created. Set them in the project .env — the `${VAR:-default}` form
# below falls back to a dev default when unset, which you MUST override before
# exposing the store beyond localhost.
#
# The agent does NOT push telemetry with these. `osprey up` uses the root
# credential once, in-process, to create a separate ingest service account
# through the store's API, and writes the token the store issues for it into the
# project .env — that token is what the agent's telemetry block references. The
# store learns of that account only through the API, so nothing about it appears
# in this file; the root password never reaches a rendered config.

services:
  openobserve:
    image: ${OSPREY_OPENOBSERVE_IMAGE:-public.ecr.aws/zinclabs/openobserve:v0.14.4}
    # container_name is a HOST-GLOBAL docker identifier: namespace it per-project
    # so two OSPREY projects can deploy the telemetry store on one host without
    # colliding on one name. The emitter reaches this service by its compose
    # service key `openobserve` (OSPREY_OTEL_OPENOBSERVE_HOST for an in-network
    # worker) or the published localhost port — never the container name — so
    # this rename needs no network alias.
    container_name: golden-project-openobserve
    labels:
      osprey.project.name: "golden-project"
      com.osprey.repo-id: "0123456789ab"
      osprey.project.root: "/deploy/golden-project"
      # Content fingerprint of the rendered config this deploy built
      # (runtime_helper's as_built_config_digest, carried in by
      # OSPREY_CONFIG_DIGEST). The same recreate trigger as the env digest, for
      # the other file a container reads its settings from: this service mounts
      # the rendered config.yml, so `osprey set` changes a file the compose
      # document never mentions and compose would leave the container running on
      # the settings it parsed at startup. Empty when the invocation did not set
      # the variable (a hand-run `docker compose up`).
      osprey.config.digest: "${OSPREY_CONFIG_DIGEST:-}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:5080:5080/tcp"
    environment:
      # Single-admin root account. These same credentials authenticate the
      # agent's OTLP ingest, so they must match what the telemetry resolver
      # sends — hence sourcing both from the project .env (overridable defaults).
      ZO_ROOT_USER_EMAIL: ${ZO_ROOT_USER_EMAIL:-root@example.com}
      ZO_ROOT_USER_PASSWORD: ${ZO_ROOT_USER_PASSWORD:-Complexpass#123}
      # Persist all ingested data to the mounted named volume. OpenObserve
      # defaults ZO_DATA_DIR to ./data/openobserve/ (relative to the container
      # CWD); pin it to the volume mount point so persistence is deterministic.
      ZO_DATA_DIR: /data
      # Growth bound. A Docker/Podman NAMED VOLUME has no portable hard size cap,
      # so the store is bounded by AGE, not bytes: OpenObserve drops data older
      # than this many days. Sourced from services.openobserve.retention_days
      # (default 14). OpenObserve's own floor is 3 days; its default is 3650
      # (~10y, effectively unbounded), which we override to a sane local value.
      ZO_COMPACT_DATA_RETENTION_DAYS: "14"
      TZ: UTC
    volumes:
      - openobserve_data:/data
    networks:
      - osprey-network

volumes:
  openobserve_data:
    labels:
      com.osprey.repo-id: "0123456789ab"

networks:
  osprey-network: