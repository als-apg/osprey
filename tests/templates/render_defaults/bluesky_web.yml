# The bluesky-web service owns the browser-facing FastAPI sidecar (see
# src/osprey/interfaces/bluesky_web/) that serves the operator web panels and
# same-origin read-proxies the bluesky bridge.
# `osprey up` builds its image locally on first run; subsequent runs
# reuse the local tag. To use a prebuilt/published image instead, set
# OSPREY_BLUESKY_WEB_IMAGE (e.g. OSPREY_BLUESKY_WEB_IMAGE=my-registry/osprey-bluesky-web:dev).
# Use `osprey build --dev` to bake in your local osprey checkout (incl.
# unreleased code) via a wheel; otherwise the image installs osprey from PyPI.

services:
  bluesky-web:
    image: ${OSPREY_BLUESKY_WEB_IMAGE:-golden-project-bluesky-web:local}
    build:
      # EVERY relative path here resolves against the pinned compose project
      # directory — the deployment REPO ROOT (`--project-directory <repo>`, see
      # compose_generator.compose_base_cmd) — never this file's own subdir. So
      # render output is addressed under build/, and the repo's own zones by
      # their plain names (data/, .env).
      context: ./build/services/bluesky_web
      dockerfile: Dockerfile
      args:
        OSPREY_VERSION: "0.0.0"
        OSPREY_PROJECT_NAME: "golden-project"


    # container_name is a HOST-GLOBAL docker identifier: namespace it per-project
    # so two OSPREY projects can deploy the sidecar on one host without colliding
    # on one name. In-network consumers reach this service by its compose service
    # key `bluesky-web` — unchanged here — so this rename needs no network alias.
    container_name: golden-project-bluesky-web
    command:
      [
        "uvicorn",
        "osprey.interfaces.bluesky_web.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8095",
      ]
    labels:
      osprey.project.name: "golden-project"
      com.osprey.repo-id: "0123456789ab"
      osprey.project.root: "/deploy/golden-project"
      # Content fingerprint of the rendered config this deploy built
      # (runtime_helper's as_built_config_digest, carried in by
      # OSPREY_CONFIG_DIGEST). The same recreate trigger as the env digest, for
      # the other file a container reads its settings from: this service mounts
      # the rendered config.yml, so `osprey set` changes a file the compose
      # document never mentions and compose would leave the container running on
      # the settings it parsed at startup. Empty when the invocation did not set
      # the variable (a hand-run `docker compose up`).
      osprey.config.digest: "${OSPREY_CONFIG_DIGEST:-}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8095:8095"
    environment:
      # The connector-backed sidecar reads config.yml at runtime. CWD is the
      # image WORKDIR (/app), not the project dir, so without CONFIG_FILE this
      # falls back to /app/config.yml — mirrors the bluesky bridge's identical
      # CONFIG_FILE convention.
      CONFIG_FILE: /app/project/config.yml
      TZ: UTC
      # Reach the co-deployed bluesky bridge by its in-network compose service
      # key `bluesky-bridge` — never the host-published port.
      BLUESKY_BRIDGE_URL: http://bluesky-bridge:8090
      # No :-default — an unset token must stay EMPTY rather than booting with
      # a guessable secret (mirrors the bridge's own launch-token convention).
      # The sidecar attaches this token to every queue WRITE it relays (add,
      # start, stop — including the `cancel: true` withdrawal — and abort) and
      # to no read, letting the bridge hold the only copy of which writes need
      # arming. An empty value simply omits the header, so the bridge refuses
      # the writes it gates instead of accepting a guessed credential.
      # `osprey up` auto-generates a strong random token into the
      # project .env when unset (see container_lifecycle.py's per-service
      # token-mint map).
      BLUESKY_LAUNCH_TOKEN: ${BLUESKY_LAUNCH_TOKEN}
      # The operator credential for this sidecar's own web gate
      # (WebAuthMiddleware): a browser logs in through the `?token=` exchange,
      # a non-browser client sends it as `X-Osprey-Terminal-Secret`. No
      # :-default for the same reason as the launch token above; `osprey up`
      # mints it into the project .env (container_lifecycle's per-service
      # token-mint map). In a multi-user deployment each per-user terminal
      # proxies its BLUESKY tab here with ITS OWN secret, never this one —
      # see the roster grant just below.
      OSPREY_TERMINAL_SECRET: ${OSPREY_TERMINAL_SECRET}
      # Marks the container shape for web_auth: an empty secret then refuses
      # startup naming the variable, instead of minting a value that is
      # announced only to the container log and reachable by nobody.
      OSPREY_TERMINAL_BIND_HOST: "0.0.0.0"
      # WHO this sidecar's audit records are written as. The audit mount follows
      # the MIDDLEWARE, not the login wall: this container runs an interface app
      # of its own, so it carries `WebAuthMiddleware` (which records every
      # refused request) and `HttpAuditMiddleware` (which records every admitted
      # mutation — this app's mutations are queue add/move/start/stop/abort,
      # i.e. starting and aborting scans on the machine).
      #
      # Without this the identity ladder falls through to the container's
      # process account and the `actor` field on every one of those records
      # names nobody. The value is the compose SERVICE KEY, the same rule the
      # dispatch workers follow, so a record traces back to the container that
      # wrote it with no lookup table — and the same derivation provisions the
      # host directory and names the mount below
      # (compose_generator.FIXED_SERVICE_AUDIT_IDENTITIES), which is why the
      # three are asserted against each other rather than kept in step by hand.
      #
      # No OSPREY_AUDIT_DIR beside it, unlike the dispatch worker: that variable
      # is the contract a compose file offers the PROJECT image's entrypoint,
      # whose root phase joins the group of each directory it names before
      # dropping privileges. This image has no entrypoint and no privilege drop
      # (uvicorn runs as root, so the mount's setgid 0o2770 mode is already
      # writable by it), so the variable would be config nothing reads — exactly
      # why the auth sidecar omits it too.
      OSPREY_AUDIT_IDENTITY: bluesky-web
    volumes:
      # Bind-mount source is relative to the compose project directory
      # (build/services/), not this file's own subdir — hence the
      # bluesky-web/ prefix (mirrors the bridge's config.yml:ro convention).
      - ./build/services/bluesky_web/config.yml:/app/project/config.yml:ro
      # This sidecar's audit subdirectory, and only its own. A bind rather than
      # a named volume, for the same reason the dispatch worker's is: the
      # records are the operator's to read, grep and purge on the host. The
      # isolation is the MOUNT — this container holds a bind to
      # `var/audit/bluesky-web` and nothing else under `var/audit`, so it cannot
      # read a terminal user's records or a worker's. Provisioned host-side
      # before the mount is created (compose_generator.ensure_audit_dir, from
      # `_ensure_agent_data_structure` on the build path): left to the container
      # runtime, a missing bind source is created by the daemon instead.
      #
      # The container side is `/app/var/audit/...`, NOT this project's
      # `/app/<project>/var/audit/...`: the image runs no OSPREY project, so its
      # writer anchors the audit zone on the working directory (WORKDIR /app),
      # and mounting the project-rooted path would bind a directory nothing ever
      # writes to while the records piled up in the writable layer.
      - ./var/audit/bluesky-web:/app/var/audit/bluesky-web

    networks:
      - osprey-network
    healthcheck:
      # curl isn't in the python:3.11-slim image — probe in-image with
      # python, matching the bridge's own healthcheck idiom.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8095/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      # Grace period before failed probes count — uvicorn/FastAPI startup and
      # the first image build (which bakes in the sidecar's
      # dependencies at build time, not at container start) take a few seconds.
      start_period: 15s

networks:
  osprey-network: