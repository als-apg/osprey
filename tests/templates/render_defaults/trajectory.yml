# The trajectory service runs the full PROJECT image (<project>:local) that
# `osprey up` builds from the project root — the image the web terminal and the
# dispatch worker run — and overrides only `command:` to start the service.
# OSPREY_WORKER_IMAGE overrides with a prebuilt/published image.

services:
  trajectory:
    image: ${OSPREY_WORKER_IMAGE:-golden-project:local}
    # NO build: block, for the dispatch worker's reason: the project image is
    # built once by `osprey up` before `docker compose up` runs, and a second
    # `build:` naming the same tag would race that sole builder.
    #
    # container_name is a HOST-GLOBAL docker identifier, namespaced per project
    # so two OSPREY projects can deploy the service on one host.
    container_name: golden-project-trajectory
    # The service reads its port from `services.trajectory.port` in the config
    # mounted below, and the address it binds from TRAJECTORY_BIND.
    command: ["python", "-m", "osprey.services.trajectory"]
    restart: unless-stopped
    stop_grace_period: 41s
    ports:
      - "127.0.0.1:10082:10082"
    environment:
      OSPREY_PROJECT_DIR: /app/golden-project
      TRAJECTORY_BIND: 0.0.0.0
      # The agent door's credential. No :-default: an unset token stays EMPTY,
      # and the door refuses every agent request rather than accepting a
      # guessable value. `osprey up` mints it into the project .env.
      TRAJECTORY_LAUNCH_TOKEN: ${TRAJECTORY_LAUNCH_TOKEN}
      # The operator credential for this service's own web gate. No :-default
      # for the launch token's reason; `osprey up` mints it into the project
      # .env. A per-user terminal proxies the panel here with ITS OWN secret,
      # admitted through the roster grant just below.
      OSPREY_TERMINAL_SECRET: ${OSPREY_TERMINAL_SECRET}
      # Marks the container shape for the web gate: an empty secret then
      # refuses startup naming the variable, instead of minting a value that
      # is announced only to the container log and reachable by nobody.
      OSPREY_TERMINAL_BIND_HOST: "0.0.0.0"
      # WHO this service's audit records are written as, and WHERE: its compose
      # service key, under its own audit subdirectory mounted below. Also the
      # contract this file offers the image's entrypoint, whose root phase joins
      # the group of each directory the render names before dropping privileges.
      OSPREY_AUDIT_IDENTITY: trajectory
      OSPREY_AUDIT_DIR: /app/golden-project/var/audit/trajectory
      # WHO this service is to the control system. The entrypoint's root phase
      # renames the image's `osprey` account to this name, using the module
      # mounted read-only below, before it drops privileges.
      OSPREY_CONTROL_IDENTITY: osprey-trajectory
      OSPREY_CONTROL_IDENTITY_MODULE: /opt/osprey/control_identity/control_identity.py
      # WHERE the service reads the control-context tree, mounted read-only
      # below: the owner of a request may have been narrowed to another machine
      # by their terminal, and this is the only place that is visible from here.
      OSPREY_CONTROL_CONTEXT_TREE: /osprey/control_tree
      # WHERE the service takes its target's guarded-run lock, mounted below and
      # shared with every other container that runs the agent, so a write here
      # contends for the same lock as theirs.
      OSPREY_GUARDED_RUN_DIR: /app/golden-project/var/guarded_run
      # WHERE the service keeps its own state, mounted read-write below.
      OSPREY_TRAJECTORY_STATE_DIR: /app/golden-project/var/trajectory
      # The STAGED config bind-mounted below, not the copy baked into the
      # image, named for both of its readers: the framework's config loader
      # reads OSPREY_CONFIG, the connector's limits resolution CONFIG_FILE.
      CONFIG_FILE: /app/golden-project/build/config.yml
      OSPREY_CONFIG: /app/golden-project/build/config.yml
      TZ: UTC
    # Bind-mount sources are relative to the pinned compose project directory,
    # which is the deployment REPO ROOT.
    volumes:
      # The staged runtime config overlays the config.yml baked into the image.
      - ./build/services/trajectory/config.yml:/app/golden-project/build/config.yml:ro
      # This service's audit subdirectory, and only its own: the isolation is
      # the mount. Provisioned host-side before the mount is created.
      - ./var/audit/trajectory:/app/golden-project/var/audit/trajectory
      # The control-context tree, READ-ONLY and WHOLE: the owner arrives with
      # the request, so a mount narrowed to one identity would answer for
      # nobody, and nothing here may edit the narrowing that judges its writes.
      - ./var/agent_data/control_target:/osprey/control_tree:ro
      # Guarded runs' locks, read-write: one directory per control target,
      # provisioned setgid and group-writable on the host before compose runs.
      - ./var/guarded_run:/app/golden-project/var/guarded_run
      # The service's state directory, read-write.
      - ./var/trajectory:/app/golden-project/var/trajectory
      # The control-identity script the entrypoint runs, with its catalog
      # closure beside it, staged into this build context by compose_generator
      # byte for byte. Read-only: it runs as root, so nothing inside may edit it.
      - ./build/services/trajectory/control_identity:/opt/osprey/control_identity:ro
    networks:
      - osprey-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:10082/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  osprey-network:
