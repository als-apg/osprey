description: 'A partial beam loss forty minutes before activation: the stored current steps from 500
  mA to 440 mA and is back at 500 mA eight minutes later. Two steps rather than a spike, so the
  archive''s minimum is the planted value at any sample cadence.'
archiver:
- channel: SR:DIAG:DCCT:01:CURRENT:RB
  events:
  - shape: step
    at_offset: -2400
    to: 440.0
  - shape: step
    at_offset: -1920
    to: 500.0
