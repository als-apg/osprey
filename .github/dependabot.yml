# Dependabot configuration for automated dependency updates
# See https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Update model: lockfile-first. The `uv` ecosystem updates `uv.lock` — the
# resolution CI actually installs and tests — and leaves the `>=` floors in
# pyproject.toml alone. Those floors are compatibility promises to operator
# sites (each carries a comment saying why it sits where it does) and move
# only by deliberate hand-written commits, never by bot. The `pip` ecosystem
# we used before did the opposite: it bumped the floors nothing tests and
# left the lockfile stale.
#
# Deliberately absent: a `docker` block. Every FROM tag in docker/ and
# scripts/va/ is a policy pin (EPICS base release, the supported Python), not
# staleness — a docker block would propose python:3.13 weekly and we would
# close it weekly. Base images move by hand, with the support policy.

version: 2
updates:
  # Python dependencies — uv.lock bumps only, one grouped PR per week.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    assignees:
      - "thellert"
    labels:
      - "dependencies"
      - "python"
    # Supply-chain quarantine: never propose a release that is less than a week
    # old. A hijacked package or a malicious maintainer release is usually
    # caught and yanked within days, so waiting costs nothing and removes the
    # window in which we would be the ones to find it.
    #
    # Note this covers version updates only — Dependabot *security* updates
    # bypass cooldown by design, which is what we want for a CVE fix.
    cooldown:
      default-days: 7
      include:
        - "*"
    # One PR, one CI run, one review per week — ten parallel single-package
    # PRs each dragging the full e2e matrix is what this replaces.
    #
    # A group covers version updates only unless it says otherwise, so security
    # updates get a group of their own: without it every alert opens its own
    # PR, and a batch of alerts arriving together floods the CI queue (twenty
    # PRs on 2026-11-11, each a full e2e matrix).
    groups:
      python-lockfile:
        patterns:
          - "*"
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Two JS toolchains: "/" is the dev/CI one (tsc + vitest behind the Frontend
  # JS lane); src/osprey/apps/js_check is the one `osprey app check` installs
  # on users' machines, exact-pinned and tested by its own lane. Groups are
  # per directory, so each gets its own PR and runs the lane that covers it.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/src/osprey/apps/js_check"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    assignees:
      - "thellert"
    labels:
      - "dependencies"
      - "javascript"
    # Same one-week quarantine as the Python block.
    cooldown:
      default-days: 7
      include:
        - "*"
    # marked, dompurify and dockview-core are the builds
    # src/osprey/interfaces/vendor_manifest.json pins, and the JS suite proves
    # node_modules holds exactly those builds, so a bump here alone goes red.
    # All three move by hand, manifest first.
    ignore:
      - dependency-name: "marked"
      - dependency-name: "dompurify"
      - dependency-name: "dockview-core"
    groups:
      js-toolchain:
        patterns:
          - "*"
      js-security:
        applies-to: security-updates
        patterns:
          - "*"

  # GitHub Actions. Every `uses:` is pinned by commit SHA with a `# vX.Y.Z`
  # comment, which Dependabot rewrites together. "/" covers .github/workflows
  # only; the composite actions under .github/actions/ are listed explicitly.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    assignees:
      - "thellert"
    labels:
      - "dependencies"
      - "github-actions"
    # Same one-week quarantine as the Python block. Actions run with repository
    # credentials, so a freshly published tag is if anything a sharper risk.
    cooldown:
      default-days: 7
      include:
        - "*"
