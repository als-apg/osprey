name: Release a component package to PyPI

on:
  push:
    tags:
      # Calendar tags like osprey-facility-v2026.12.0, one glob per stream.
      - 'osprey-connectors-v2*'
      - 'osprey-facility-v2*'

# Each published component package (osprey-connectors, osprey-facility) has
# its own calendar stream, on its own <dist>-vYYYY.M.P tags (bN / rcN for
# pre-releases), cut when the package changes rather than with every framework
# release. This workflow is the whole release of every such stream: one tag
# builds, checks and publishes that stream's wheel and sdist and nothing else.
# What differs between the streams (the package, its lanes, its environment,
# its changelog) is read from scripts/ci/release_streams.py by the `resolve`
# job, never spelled here. The framework's v-tags run
# release.yml, which builds none of these packages; the framework declares only
# floors on them, and its own release proves the floors resolve from PyPI.
#
# The trigger is a tag push and nothing else: no dispatch, so no run publishes
# a commit nobody tagged. The `2` keeps retired lines such as
# osprey-connectors-v0.1.0 out, as each package's describe glob does. Every job
# is also guarded on the tag refs, so a trigger widened later cannot run a
# publish from a branch, and on the repository, so a tag on a mirror or fork
# builds and publishes nothing.
#
# On PyPI, each package's trusted publisher names this workflow file and the
# stream's environment (`pypi-connectors`, `pypi-facility`), and nothing else
# can upload it: the framework's publisher (release.yml,
# `pypi`) is registered on osprey-framework, not on these.

# Nothing at workflow level writes. The two jobs that do — the PyPI upload
# (`id-token`) and the GitHub release (`contents`) — say so in their own block.
permissions:
  contents: read

jobs:
  # The one place a tag becomes a stream. A ref outside the two globs, or a
  # version not spelled in canonical PEP 440 form (`-rc1`, `2026.01.0`), fails
  # here, before anything is built: the table refuses a spelling rather than
  # normalising it, so the version every later job compares against is the one
  # the wheel carries.
  resolve:
    name: Resolve The Release Stream
    runs-on: ubuntu-latest
    if: github.repository == 'als-apg/osprey' && (startsWith(github.ref, 'refs/tags/osprey-connectors-v2') || startsWith(github.ref, 'refs/tags/osprey-facility-v2'))
    outputs:
      key: ${{ steps.stream.outputs.key }}
      dist: ${{ steps.stream.outputs.dist }}
      import_name: ${{ steps.stream.outputs.import_name }}
      package_dir: ${{ steps.stream.outputs.package_dir }}
      environment: ${{ steps.stream.outputs.environment }}
      changelog: ${{ steps.stream.outputs.changelog }}
      tag_prefix: ${{ steps.stream.outputs.tag_prefix }}
      lean_extras: ${{ steps.stream.outputs.lean_extras }}
      version: ${{ steps.stream.outputs.version }}
      prerelease: ${{ steps.stream.outputs.prerelease }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Resolve the stream from the tag
      id: stream
      run: python3 scripts/ci/release_streams.py resolve "$GITHUB_REF"

  # Nothing else in this workflow runs a test. A component package is proved
  # by always-on lanes rather than model-spending ones, so no label is involved
  # here: what the gate asks is that the ci.yml run on the tagged tree ran the
  # stream's lanes and every one of them went green.
  verify-ci:
    name: Verify CI On The Tagged Tree
    runs-on: ubuntu-latest
    needs: [resolve]
    if: github.repository == 'als-apg/osprey' && (startsWith(github.ref, 'refs/tags/osprey-connectors-v2') || startsWith(github.ref, 'refs/tags/osprey-facility-v2'))
    # A job-level block REPLACES the workflow's scopes rather than extending
    # them. Reading another workflow's runs needs `actions: read`.
    permissions:
      actions: read
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0  # the tree comparison walks the tag's parents
        persist-credentials: false

    - name: Require the tagged commit on main
      # Releases are cut from main (the release skill). The lane gate
      # below cannot tell: a commit off main whose tree had a green run passes
      # it. And a component tag main cannot reach leaves main's dev builds
      # describing from an older tag of that package, below the framework's
      # floor. Shared with release.yml; tests/deployment/test_ci_workflow_wiring.py
      # holds the two copies equal and runs this one against a scratch repo.
      env:
        TAG_SHA: ${{ github.sha }}
        TAG_NAME: ${{ github.ref_name }}
      run: |
        git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
        if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
          echo "::error::$TAG_NAME ($TAG_SHA) is not on main. Tag the merge commit on main:"
          echo "  git push --delete origin $TAG_NAME && git tag -f $TAG_NAME <main sha> && git push origin $TAG_NAME"
          exit 1
        fi
        echo "✅ $TAG_NAME is on main"

    - name: Require a green CI run on this tree
      # scripts/ci/require_green_lanes.py, shared with release.yml. The lanes
      # are the stream's `required_lanes` in scripts/ci/release_streams.py, one
      # per line as <ci.yml job id>=<rendered job-name prefix>: the unit and
      # lint lanes, the package's own build and framework-free suite, and for a
      # stream with a compatibility contract its backward-compatibility lanes.
      # A compatibility lane that stands down (no release listed yet, no floor
      # declared yet) concludes success, so it never blocks a tag it has
      # nothing to prove for. The list is assigned before the gate runs, so a
      # ref the table refuses fails this step rather than reaching the gate.
      # tests/deployment/test_ci_workflow_wiring.py pins every stream's list
      # against ci.yml.
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        TAG_SHA: ${{ github.sha }}
        TAG_NAME: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        REQUIRED_LANES="$(python3 scripts/ci/release_streams.py lanes "$GITHUB_REF")"
        python3 scripts/ci/require_green_lanes.py --lanes "$REQUIRED_LANES"

  build:
    name: Build The Package
    runs-on: ubuntu-latest
    needs: [resolve, verify-ci]
    if: github.repository == 'als-apg/osprey' && (startsWith(github.ref, 'refs/tags/osprey-connectors-v2') || startsWith(github.ref, 'refs/tags/osprey-facility-v2'))

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0  # the version is the describe of this package's own tags
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

    - name: Set up Python
      run: uv python install 3.11

    - name: Build package
      # The tagged stream's package and no other workspace member.
      env:
        DIST: ${{ needs.resolve.outputs.dist }}
      run: uv build --package "$DIST"

    - name: Verify built versions match tag
      # The version comes from the describe, not a literal, so this checks the
      # files about to be published: exactly one wheel and one sdist of this
      # package, both carrying the tag's number. A shallow checkout or a missing
      # tag does not fail the build — it silently yields 0.0.postN+g… or the
      # previous tag's .postN — so this is what catches that before PyPI does.
      env:
        DIST: ${{ needs.resolve.outputs.dist }}
        VERSION: ${{ needs.resolve.outputs.version }}
      run: |
        ls -l dist/
        status=0
        PREFIX="${DIST//-/_}-"
        shopt -s nullglob
        files=(dist/*)
        wheels=(dist/"$PREFIX"*.whl)
        sdists=(dist/"$PREFIX"*.tar.gz)
        if [ "${#wheels[@]}" -ne 1 ] || [ "${#sdists[@]}" -ne 1 ] || [ "${#files[@]}" -ne 2 ]; then
          echo "❌ expected one $DIST wheel and one sdist in dist/, found: ${files[*]}"
          status=1
        fi
        for file in "${wheels[@]}" "${sdists[@]}"; do
          name="$(basename "$file")"
          # <name>-<version>-<python tag>-...whl / <name>-<version>.tar.gz
          if [[ "$name" == *.whl ]]; then
            BUILT="$(echo "$name" | cut -d'-' -f2)"
          else
            BUILT="${name#"$PREFIX"}"
            BUILT="${BUILT%.tar.gz}"
          fi
          echo "$name: $BUILT"
          if [ "$BUILT" != "$VERSION" ]; then
            echo "❌ Version mismatch! Tag: $VERSION, Built: $BUILT"
            echo "   A clean checkout of the tag must build exactly $VERSION."
            echo "   A local segment or .postN means the tag is not what was built."
            status=1
          fi
        done
        [ "$status" -eq 0 ] && echo "✅ Every built version matches tag: $VERSION"
        exit "$status"

    - name: Check package
      run: uvx twine check dist/*

    - name: Upload distribution artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: ${{ needs.resolve.outputs.key }}-distributions
        path: dist/

  verify-install:
    name: Verify The Wheel On A Bare Venv
    runs-on: ubuntu-latest
    needs: [resolve, build]
    if: github.repository == 'als-apg/osprey' && (startsWith(github.ref, 'refs/tags/osprey-connectors-v2') || startsWith(github.ref, 'refs/tags/osprey-facility-v2'))

    # The wheel about to be published, installed into a fresh venv with every
    # dependency resolved from PyPI (with the stream's extras, so the walk
    # imports what they gate), then walked by the same lean import check every
    # PR runs: every module imports, and nothing the stream forbids is loaded.
    # Then the installed `__version__` must be the tag's.
    steps:
    # For scripts/ci/lean_import_walk.py and the stream table it reads.
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Download distribution artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        name: ${{ needs.resolve.outputs.key }}-distributions
        path: dist/

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

    - name: Install the wheel with deps from PyPI and import-walk it
      # The extras are a separate requirement on the package name, never a
      # bracket after the wheel glob, which the shell reads as a character
      # class.
      env:
        KEY: ${{ needs.resolve.outputs.key }}
        DIST: ${{ needs.resolve.outputs.dist }}
        IMPORT_NAME: ${{ needs.resolve.outputs.import_name }}
        LEAN_EXTRAS: ${{ needs.resolve.outputs.lean_extras }}
        VERSION: ${{ needs.resolve.outputs.version }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        wheels=(dist/"${DIST//-/_}"-*.whl)
        [ "${#wheels[@]}" -eq 1 ]
        install=("${wheels[0]}")
        if [ -n "$LEAN_EXTRAS" ]; then
          install+=("${DIST}[${LEAN_EXTRAS}]")
        fi
        uv venv /tmp/lean-check --python 3.11
        uv pip install --python /tmp/lean-check/bin/python "${install[@]}"
        /tmp/lean-check/bin/python -I scripts/ci/lean_import_walk.py "$KEY"
        INSTALLED="$(/tmp/lean-check/bin/python -I -c "import $IMPORT_NAME; print($IMPORT_NAME.__version__)")"
        echo "$IMPORT_NAME.__version__ = $INSTALLED"
        [ "$INSTALLED" = "$VERSION" ]

  publish-to-pypi:
    name: Publish The Package To PyPI
    # `verify-ci` already gates `build`, so this repeats it — deliberately.
    # The publish is the one step nobody can take back, and a future edit that
    # re-wires the chain above must not be able to un-gate it silently.
    needs: [resolve, verify-ci, build, verify-install]
    if: github.repository == 'als-apg/osprey' && (startsWith(github.ref, 'refs/tags/osprey-connectors-v2') || startsWith(github.ref, 'refs/tags/osprey-facility-v2'))
    runs-on: ubuntu-latest
    # The stream's own environment, which its PyPI trusted publisher names.
    environment:
      name: ${{ needs.resolve.outputs.environment }}
      url: https://pypi.org/project/${{ needs.resolve.outputs.dist }}/${{ needs.resolve.outputs.version }}/
    # Trusted publishing: the OIDC token is minted for this job alone.
    permissions:
      id-token: write

    steps:
    - name: Download distribution artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        name: ${{ needs.resolve.outputs.key }}-distributions
        path: dist/

    # skip-existing lets a re-pushed tag complete a publish that stopped halfway.
    - name: Publish the package to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
      with:
        packages-dir: dist/
        skip-existing: true
        verbose: true

  create-github-release:
    name: Create GitHub Release
    needs: [resolve, build, publish-to-pypi]
    if: github.repository == 'als-apg/osprey' && (startsWith(github.ref, 'refs/tags/osprey-connectors-v2') || startsWith(github.ref, 'refs/tags/osprey-facility-v2'))
    runs-on: ubuntu-latest
    permissions:
      contents: write  # creating the release

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Extract release notes from the package CHANGELOG
      # The package's own changelog, folded from <package_dir>/changelog.d/ by
      # `scripts/changelog_fragments.py apply --root <package_dir>`, and read by
      # the same script release.yml reads the framework's with.
      env:
        CHANGELOG: ${{ needs.resolve.outputs.changelog }}
        DIST: ${{ needs.resolve.outputs.dist }}
        VERSION: ${{ needs.resolve.outputs.version }}
      run: |
        echo "Extracting release notes for $DIST $VERSION"
        python3 scripts/ci/release_notes.py "$CHANGELOG" "$VERSION" > release_notes.md
        cat release_notes.md

    - name: Create Release
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
      with:
        name: ${{ needs.resolve.outputs.dist }} v${{ needs.resolve.outputs.version }}
        body_path: release_notes.md
        draft: false
        prerelease: ${{ needs.resolve.outputs.prerelease == 'true' }}
        # "Latest" stays the framework's: a component release is never what a
        # reader landing on the repository's releases page should install.
        make_latest: false
