# Builds the documentation and publishes it to the gh-pages branch.
#
# Site layout:
#   /            written ONLY by the newest release tag, so the site root always
#                shows the newest release — never a development build.
#   /vX.Y.Z/     one directory per vX.Y.Z release tag, rewritten only when that
#                tag is re-published. Pre-release and component tags
#                (v1.0.0rc1, osprey-connectors-v*) build but are not published.
#   /latest/     the development build from main, which renders a banner saying
#                so and points readers at the released docs.
#
# After this workflow first lands: the root keeps whatever the previous workflow
# last wrote until a release tag is published, because only a release tag build
# rewrites it. To get the root onto the new layout without waiting for the next
# release, publish the newest release once by hand:
#
#     gh workflow run docs.yml -f tag=vX.Y.Z
#
# All of the decision logic (which version, which directory, whether to deploy
# at all) lives in scripts/ci/docs_publish.py; this workflow only wires it up.
# The helper is fetched by a second, sparse checkout into .docs-ci/ from the
# default branch, because a tag build — or a workflow_dispatch for an older
# tag — checks out a tree that predates the helper and would not contain it.
#
# Serialisation: every deploying run shares the concurrency group `docs-deploy`,
# so two deploys can never interleave and race each other's gh-pages commits.
# Pull-request builds get a group of their own per run, so they are never queued
# behind a deploy. Note what this does and does not give you: `cancel-in-progress`
# is false, so a run that has already started always finishes — but GitHub keeps
# at most ONE pending run per group, so a run still waiting in the queue when a
# newer one arrives is superseded and never executes at all. A tag deploy lost
# that way has to be re-dispatched by hand:
#
#     gh workflow run docs.yml -f tag=vX.Y.Z

name: Build and Deploy Documentation

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'  # Trigger on version tags (v1.0, v2.1.3, etc.)
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build docs for (e.g., vYYYY.M.P). Leave empty for main branch build.'
        required: false
        type: string

permissions:
  contents: write   # Required to push to gh-pages branch

concurrency:
  group: "docs-${{ github.event_name == 'pull_request' && github.run_id || 'deploy' }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    # The three docs_publish.py invocations must all describe the same build.
    # Hoisting their inputs here makes the three command lines textually
    # identical, so no single step can drift away from the others.
    env:
      DOCS_REF: ${{ github.ref }}
      DOCS_EVENT: ${{ github.event_name }}
      DOCS_INPUT_TAG: ${{ github.event.inputs.tag || '' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # Fetch full history including all tags
        ref: ${{ github.event.inputs.tag || github.ref }}

    # Second, sparse checkout of the default branch: the tree checked out above
    # may be an old tag that predates the publishing helper, so the helper is
    # always taken from the default branch instead of from the build's own tree.
    - name: Checkout publishing helper
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.repository.default_branch }}
        path: .docs-ci
        sparse-checkout: scripts/ci
        sparse-checkout-cone-mode: true

    # Runs before uv is installed: the helper is stdlib-only by design, so the
    # deploy decision is available even if the docs build never happens.
    # The helper reads `git tag` from its working directory — the build checkout
    # above, not .docs-ci — which is why that checkout keeps `fetch-depth: 0` and
    # why this step (and the two below) never set `working-directory`.
    - name: Plan the deploy
      id: plan
      run: |
        python3 .docs-ci/scripts/ci/docs_publish.py plan \
          --ref "$DOCS_REF" \
          --event "$DOCS_EVENT" \
          --input-tag "$DOCS_INPUT_TAG" >> "$GITHUB_OUTPUT"

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.11

    - name: Install dependencies
      run: uv sync --extra docs

    - name: Build documentation
      run: |
        cd docs
        uv run make html

    # Fail-closed: a missing gh-pages branch is the first deployment, but any
    # other failure (network, auth) must stop the run rather than be mistaken
    # for one — publishing an "empty site" would delete every existing version.
    - name: Fetch published site
      id: pages
      if: steps.plan.outputs.deploy == 'true'
      run: |
        URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
        set +e
        git ls-remote --exit-code --heads "$URL" gh-pages >/dev/null
        rc=$?
        set -e
        case "$rc" in
          0)
            git clone --branch gh-pages --depth 1 "$URL" gh-pages-existing
            rm -rf gh-pages-existing/.git
            echo "first_deploy=false" >> "$GITHUB_OUTPUT"
            ;;
          2)
            echo "No gh-pages branch yet — treating this as the first deployment."
            echo "first_deploy=true" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "::error::git ls-remote failed with exit code ${rc}; refusing to guess whether the site exists."
            exit "$rc"
            ;;
        esac

    - name: Stage deployment tree
      if: steps.plan.outputs.deploy == 'true'
      run: |
        python3 .docs-ci/scripts/ci/docs_publish.py stage \
          --ref "$DOCS_REF" \
          --event "$DOCS_EVENT" \
          --input-tag "$DOCS_INPUT_TAG" \
          --build docs/build/html \
          --existing gh-pages-existing \
          --deployment deployment ${{ steps.pages.outputs.first_deploy == 'true' && '--allow-empty-site' || '' }}

    # Must follow the stage step: a release build's root refresh clears the root
    # `_static/` before copying the build in, which would delete a versions.json
    # written ahead of it. Reads the repository's tags from the build checkout's
    # cwd, as noted at the plan step, so it sets no `working-directory` either.
    - name: Write version switcher index
      if: steps.plan.outputs.deploy == 'true'
      run: |
        python3 .docs-ci/scripts/ci/docs_publish.py versions \
          --deployment deployment

    - name: Deploy to GitHub Pages
      if: steps.plan.outputs.deploy == 'true'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./deployment
