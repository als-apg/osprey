name: Validate Install Docs

# Builds every workspace package from the current SHA, installs osprey via
# `uv tool` against those wheels, and runs the bash blocks extracted from
# installation.rst and osprey-build-interview.rst.
# This catches doc-vs-wheel drift before it reaches a release tag.
#
# `uv tool install` runs outside the uv workspace, so `[tool.uv.sources]` does
# not apply and workspace siblings would otherwise be pulled from PyPI rather
# than from the commit under test. `--find-links dist` keeps them local.

on:
  pull_request:
    paths:
      - 'docs/source/getting-started/installation.rst'
      - 'docs/source/getting-started/osprey-build-interview.rst'
      - 'scripts/extract_doc_bash.py'
      - '.github/workflows/validate-install-docs.yml'
      - 'src/osprey/cli/skills_cmd.py'
      - 'src/osprey/templates/skills/**'
  workflow_call: {}

jobs:
  validate:
    name: Run install docs against built wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build wheels from current SHA
        run: uv build --all-packages

      - name: Install osprey from built wheels (NOT PyPI)
        run: uv tool install --find-links dist ./dist/osprey_framework-*.whl

      - name: Verify osprey on PATH
        run: osprey --version

      # npm treats a failed `optionalDependencies` fetch as non-fatal, so a
      # transient registry blip leaves @anthropic-ai/claude-code installed
      # without the platform-native binary it ships as an optional dep. The
      # install still exits 0 and reports success; the docs' own
      # `claude --version` is what surfaces it, as a red lane that says nothing
      # about the docs it is supposed to be validating. Retries make the blip
      # recoverable without masking a genuine delivery failure.
      #
      # Written to ~/.npmrc rather than through `npm config` so it also covers
      # the apt-installed npm the docs bring in, not just the runner's own.
      - name: Let npm retry a transient registry failure
        run: |
          {
            echo 'fetch-retries=5'
            echo 'fetch-retry-mintimeout=20000'
            echo 'fetch-retry-maxtimeout=120000'
          } >> ~/.npmrc

      - name: Extract and run installation.rst bash blocks
        run: |
          python scripts/extract_doc_bash.py docs/source/getting-started/installation.rst > /tmp/install.sh
          cat /tmp/install.sh
          bash /tmp/install.sh

      - name: Extract and run osprey-build-interview.rst bash blocks
        run: |
          python scripts/extract_doc_bash.py docs/source/getting-started/osprey-build-interview.rst > /tmp/interview.sh
          cat /tmp/interview.sh
          bash /tmp/interview.sh

      - name: Verify osprey-build-interview skill installed
        run: test -f ~/.claude/skills/osprey-build-interview/SKILL.md
