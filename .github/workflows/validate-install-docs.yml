name: Validate Install Docs

# Builds every workspace package from the current SHA, installs osprey via
# `uv tool` against those wheels, and runs the bash blocks extracted from
# installation.rst.
# This catches doc-vs-wheel drift before it reaches a release tag.
#
# `uv tool install` runs outside the uv workspace, so `[tool.uv.sources]` does
# not apply and workspace siblings would otherwise be pulled from PyPI rather
# than from the commit under test. `--find-links dist` alone does not keep them
# local: a resolver offered both prefers the higher version, and a stable PyPI
# release sorts above a checkout's dev build of the pre-release it descends
# from (osprey-connectors, on its own tag stream, is the one that gets there
# first). So each member wheel is named as a requirement of its own (`--with`),
# which pins that exact file.

on:
  pull_request:
    paths:
      - 'docs/source/getting-started/installation.rst'
      - 'scripts/extract_doc_bash.py'
      - '.github/workflows/validate-install-docs.yml'
  workflow_call: {}

permissions:
  contents: read

jobs:
  validate:
    name: Run install docs against built wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0

      - name: Build wheels from current SHA
        run: uv build --all-packages

      - name: Install osprey from built wheels (NOT PyPI)
        run: |
          uv tool install --find-links dist ./dist/osprey_framework-*.whl \
            --with ./dist/osprey_connectors-*.whl \
            --with ./dist/pyaml_cs_osprey-*.whl

      - name: Verify osprey on PATH
        run: osprey --version

      - name: Extract and run installation.rst bash blocks
        run: |
          python scripts/extract_doc_bash.py docs/source/getting-started/installation.rst > /tmp/install.sh
          cat /tmp/install.sh
          bash /tmp/install.sh
