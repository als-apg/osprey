name: Release to PyPI

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v2026.5.0

# PAIRED PUBLISHING: the framework and the workspace members that version with
# it (today osprey-optimizer and pyaml-cs-osprey: same v-tags, same describe —
# see their pyproject.toml) build and publish from one v-tag, always carrying the same
# number. The component packages are NOT among them: osprey-connectors,
# osprey-facility and osprey-panels each have their own calendar stream on
# their own osprey-<package>-v* tags (the STREAMS table in
# scripts/ci/release_streams.py) and publish from release-package.yml, so
# nothing here builds or uploads them. The framework declares at most a floor
# on each (`osprey-connectors>=` in the root pyproject.toml; osprey-facility
# bare until it declares one), and verify-pypi-resolvable is the gate that
# every component the framework needs is already on PyPI: it resolves the
# framework wheel's dependencies from PyPI plus ONLY the lockstep member
# wheels this same run publishes — the one honest offline stand-in for the
# state PyPI reaches the moment the publish job lands — so a component can
# only come from PyPI. (validate-install-docs cannot be that gate: it installs
# with `--find-links dist`, so any unpublished sibling resolves locally
# there.) verify-component-floors then proves each declared floor is enough.
# A framework that needs a newer component release raises its floor only after
# release-package.yml has published it.

# Nothing at workflow level writes. The two jobs that do — the PyPI upload
# (`id-token`) and the GitHub release (`contents`) — say so in their own block,
# so the jobs that install from PyPI and run what they installed hold neither.
permissions:
  contents: read

# Only the upstream repository publishes. Every job carries the repository
# guard, so a version tag on a mirror or fork builds and publishes nothing.
jobs:
  # Nothing else in this workflow runs a test, so without this job a tag can
  # publish a tree whose agentic lanes never ran. Every lane `REQUIRED_LANES`
  # below names is gated on the `full-ci` label, and `all-checks-passed` counts a
  # conditionally skipped lane as a pass — so an unlabeled release PR merges
  # fully green having proved nothing about the agent paths. This is where that
  # is caught, before the wheel is built.
  verify-full-ci:
    name: Verify Full CI On The Tagged Tree
    runs-on: ubuntu-latest
    if: github.repository == 'als-apg/osprey' && startsWith(github.ref, 'refs/tags/v')
    # A job-level block REPLACES the workflow's scopes rather than extending
    # them. Reading another workflow's runs needs `actions: read`; nothing here
    # writes anything.
    permissions:
      actions: read
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0  # the tree comparison below walks the tag's parents
        persist-credentials: false

    - name: Require the tagged commit on main
      # Releases are cut from main (the release skill). The lane gate
      # below cannot tell: a commit off main whose tree had a green run passes
      # it. And a component tag main cannot reach leaves main's dev builds
      # describing from an older component tag, below the framework's floor.
      # Shared with release-package.yml; tests/deployment/test_ci_workflow_wiring.py
      # holds the two copies equal and runs this one against a scratch repo.
      env:
        TAG_SHA: ${{ github.sha }}
        TAG_NAME: ${{ github.ref_name }}
      run: |
        git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
        if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
          echo "::error::$TAG_NAME ($TAG_SHA) is not on main. Tag the merge commit on main:"
          echo "  git push --delete origin $TAG_NAME && git tag -f $TAG_NAME <main sha> && git push origin $TAG_NAME"
          exit 1
        fi
        echo "✅ $TAG_NAME is on main"

    - name: Require a green full-ci run on this tree
      # scripts/ci/require_green_lanes.py, shared with release-package.yml:
      # a successful ci.yml run on a commit carrying the tagged tree in which
      # every lane below concluded `success`. A skipped lane is a lane the
      # `full-ci` label was missing for, and does not count.
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        TAG_SHA: ${{ github.sha }}
        TAG_NAME: ${{ github.ref_name }}
        # The model-spending lanes, one per line: <lane id>=<rendered job-name
        # prefix>. A lane id is its ci.yml job id, or the cell's `lane:` where a
        # matrix job hosts several lanes (`dispatch-stack-e2e`), each then named by
        # its own cell's prefix. A prefix, because a matrix job (`agentic-per-preset`)
        # renders one job per cell, and every cell must pass. tests/deployment/
        # test_ci_workflow_wiring.py pins this list to the spending lanes of LANES,
        # so a renamed lane fails a unit test, not a release.
        REQUIRED_LANES: |
          agentic-per-preset=Preset Agentic Flow
          e2e-tests=E2E Tests
          dispatch-deploy-e2e=Dispatch Stack E2E — Deploy
          single-user-narrowing-e2e=Dispatch Stack E2E — Single-User Narrowing
          dispatch-overlay-e2e=Dispatch Stack E2E — Overlay Visibility
          host-record-e2e=Dispatch Stack E2E — Host Record
          scan-agentic-e2e=Dispatch Stack E2E — Scan Stack Agentic
          nextcloud-talk-bridge-e2e=Nextcloud Talk Bridge E2E
          gchat-bridge-e2e=Google Chat Bridge E2E
          dockerfile-agent-e2e=Dockerfile Agent E2E
          target-switch-agentic-e2e=Control-Target Switch Agentic E2E
      run: |
        python3 scripts/ci/require_green_lanes.py --lanes "$REQUIRED_LANES" \
          --hint "gh pr edit <release-notes PR> --add-label full-ci   # before merging it" \
          --hint "gh workflow run ci.yml --ref $TAG_NAME -f revalidate_secret_lanes=true"

  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: [verify-full-ci]
    if: github.repository == 'als-apg/osprey' && startsWith(github.ref, 'refs/tags/v')
    outputs:
      # The wheel prefix of every component stream, read from STREAMS, so the
      # refusal below and verify-pypi-resolvable's exclusion follow the table.
      component_dists: ${{ steps.streams.outputs.component_dists }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0  # Fetch all history for version detection
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

    - name: Set up Python
      run: uv python install 3.11

    - name: List the component streams
      id: streams
      run: |
        COMPONENT_DISTS=$(python3 scripts/ci/release_streams.py dists --joined)
        echo "component streams: $COMPONENT_DISTS"
        echo "component_dists=$COMPONENT_DISTS" >> "$GITHUB_OUTPUT"

    - name: Build packages
      # The framework and the members that ride its v-tag, named one by one
      # rather than `--all-packages`: the component packages are workspace
      # members too, but each releases from its own tags (release-package.yml),
      # and a wheel of one built here would carry the framework-tag checkout's
      # number for it. tests/deployment/test_ci_workflow_wiring.py holds this
      # list to the workspace members minus the STREAMS packages.
      run: |
        uv build
        uv build --package osprey-optimizer
        uv build --package pyaml-cs-osprey

    - name: Verify built versions match tag
      # The versions are derived from the tag rather than a literal, so this
      # checks the artifacts that are actually about to be published — every
      # wheel, since every package built above derives from the same tag. A shallow checkout
      # or a missing tag does not fail the build — it silently yields 0.0.postN+g…
      # or the previous tag's .postN — so this gate is what catches that before it reaches PyPI.
      # A component wheel in dist/ is refused outright: it publishes from
      # release-package.yml, on its own tags.
      env:
        COMPONENT_DISTS: ${{ steps.streams.outputs.component_dists }}
      run: |
        TAG_VERSION="${GITHUB_REF#refs/tags/v}"
        echo "Tag version: $TAG_VERSION"
        if [ -z "$COMPONENT_DISTS" ]; then
          echo "❌ no component streams listed: the refusal below would check nothing"
          exit 1
        fi
        status=0
        for prefix in $COMPONENT_DISTS; do
          if compgen -G "dist/${prefix}*" > /dev/null; then
            echo "❌ dist/ holds ${prefix%-}, which publishes from release-package.yml"
            status=1
          fi
        done
        for WHEEL in dist/*.whl; do
          # Wheel filenames are <name>-<version>-<python tag>-...; field 2 is the version.
          BUILT_VERSION=$(basename "$WHEEL" | cut -d'-' -f2)
          echo "$(basename "$WHEEL"): $BUILT_VERSION"
          if [ "$TAG_VERSION" != "$BUILT_VERSION" ]; then
            echo "❌ Version mismatch! Tag: $TAG_VERSION, Built: $BUILT_VERSION"
            echo "   A clean checkout of tag v$TAG_VERSION must build exactly $TAG_VERSION."
            echo "   A local segment or .postN means the tag is not what was built."
            status=1
          fi
        done
        [ "$status" -eq 0 ] && echo "✅ Every built version matches tag: $TAG_VERSION"
        exit "$status"

    - name: Check package
      run: uvx twine check dist/*

    - name: List built artifacts
      run: |
        ls -lh dist/

    - name: Upload distribution artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: python-package-distributions
        path: dist/

  validate-install-docs:
    name: Validate Install Docs
    needs: [build]
    if: github.repository == 'als-apg/osprey' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/validate-install-docs.yml

  verify-pypi-resolvable:
    name: Verify Deps Resolve From PyPI
    needs: [build]
    if: github.repository == 'als-apg/osprey' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    # The wheel about to be published, installed the way the docs tell users to
    # install it: every dependency must resolve from the index — except the
    # lockstep members this same run publishes. Each of their wheels (each
    # dist/*.whl but the framework's own) is staged into a find-links directory
    # of its own (never the whole dist/ as-is, which would also offer the sdists
    # and let ANY unpublished dependency resolve locally and defeat the gate):
    # PyPI plus those wheels is exactly the index state the moment
    # publish-to-pypi lands, so this is what refuses a framework wheel whose
    # OTHER pins nothing on PyPI satisfies yet. Every component stream's wheel
    # (build's `component_dists`, read from STREAMS) is excluded by name as well
    # as never built here: osprey-connectors and osprey-facility must resolve
    # from PyPI, which is what proves the framework's floor on each is already
    # published. Staged by exclusion otherwise, so a lockstep member added later
    # is offered here the day it starts publishing, not after this gate has
    # failed its first tag.
    steps:
    - name: Download distribution artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        name: python-package-distributions
        path: dist/

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

    - name: Install framework wheel with deps from PyPI plus the lockstep member wheels
      # `--prerelease if-necessary`, spelled out rather than left to whatever
      # the floating uv defaults to: a pre-release is taken only where nothing
      # stable satisfies a requirement — which includes a requirement that names
      # one, since no stable satisfies `==X.YbN` — the policy the resolvers
      # deployments use behave like. With uv ≥ 0.12, `if-necessary` means
      # stable first, a pre-release only when every stable candidate is
      # rejected, transitive dependencies included; `if-necessary-or-explicit`
      # is its deprecated alias. setup-uv installs the current uv. The
      # framework's floor names a stable osprey-connectors release, so this
      # resolves a stable one and a connectors beta is never absorbed.
      env:
        COMPONENT_DISTS: ${{ needs.build.outputs.component_dists }}
      run: |
        mkdir -p /tmp/sibling
        if [ -z "$COMPONENT_DISTS" ]; then
          echo "::error::build listed no component streams to exclude"
          exit 1
        fi
        for wheel in dist/*.whl; do
          name="$(basename "$wheel")"
          case "$name" in osprey_framework-*) continue ;; esac
          for prefix in $COMPONENT_DISTS; do
            case "$name" in "$prefix"*) continue 2 ;; esac
          done
          cp "$wheel" /tmp/sibling/
        done
        ls /tmp/sibling
        uv tool install ./dist/osprey_framework-*.whl --find-links /tmp/sibling \
          --prerelease if-necessary
        osprey --version
        # The framework's `optimizer` extra names osprey-optimizer, whose wheel
        # the loop above staged with the other members. The base only: the
        # `service` extra is the optimizer image's, and its pins (torch, xopt)
        # are checked by that image's build.
        FRAMEWORK_WHEEL=$(ls "$PWD"/dist/osprey_framework-*.whl)
        uv venv /tmp/optimizer-check
        uv pip install --python /tmp/optimizer-check/bin/python \
          "osprey-framework[optimizer] @ file://$FRAMEWORK_WHEEL" --find-links /tmp/sibling
        /tmp/optimizer-check/bin/python -c "import osprey, osprey_optimizer.models.api, osprey_optimizer.environments.spec"

  verify-component-floors:
    name: Verify Every Component Import Resolves At Its Floor
    needs: [build]
    if: github.repository == 'als-apg/osprey' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    # verify-pypi-resolvable proves each floor is published; this proves each
    # floor is enough. Between releases main may import component code no
    # release carries yet, behind an `except ImportError` stand-in that keeps
    # the framework running at the floor with that feature switched off. A
    # published framework resolves the floor on every install that already has
    # it, so a tag refuses while any such import is still unpublished: release
    # the component, raise the floor, then tag. Every STREAMS entry with
    # `compat=True` is checked, all floors installed together, and each scanned
    # over that stream's `floor_consumers` only. A floor the table marks
    # optional and the root pyproject.toml does not declare (osprey-facility
    # while it is listed bare) stands down with its reason logged; a missing
    # connectors floor fails the plan step.
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0  # the floors are checked against the tags reachable from HEAD
        persist-credentials: false

    - name: Download distribution artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        name: python-package-distributions
        path: dist/

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

    - name: Plan the component floors
      # Writes `requirements` (every armed floor, `<dist>==<floor>`) and `scans`
      # (`<import name>:<consumer>,...` per armed floor). A component whose own
      # osprey-connectors requirement at HEAD is above the framework's
      # connectors floor is reported here, ahead of the install it would break.
      id: plan
      run: |
        python3 - <<'PLAN'
        import os
        import re
        import subprocess
        import sys
        import tomllib

        sys.path.insert(0, "scripts/ci")
        from release_streams import STREAMS


        def calver(version):
            return tuple(int(part) for part in re.findall(r"\d+", version)[:3])


        floors, scans = {}, []
        for stream in (s for s in STREAMS if s.compat):
            done = subprocess.run(
                [sys.executable, "scripts/ci/compat_matrix.py", "--package", stream.key,
                 "--root", ".", "floor"],
                capture_output=True,
                text=True,
            )
            if done.returncode != 0:
                sys.exit(f"::error::{stream.dist}: no floor to verify\n{done.stderr.strip()}")
            floor = done.stdout.strip()
            if not floor:
                print(f"{stream.dist} stands down: {done.stderr.strip()}")
                continue
            floors[stream.dist] = floor
            scans.append(f"{stream.import_name}:{','.join(stream.floor_consumers)}")
            print(f"floor: {stream.dist}=={floor}, scanned over {', '.join(stream.floor_consumers)}")

        connectors = floors["osprey-connectors"]
        for stream in STREAMS:
            if stream.dist not in floors or stream.dist == "osprey-connectors":
                continue
            with open(f"{stream.package_dir}/pyproject.toml", "rb") as handle:
                project = tomllib.load(handle).get("project", {})
            for requirement in project.get("dependencies", []):
                needed = re.fullmatch(r"osprey-connectors\s*>=\s*([^,;\s]+)", requirement.strip())
                if not needed:
                    continue
                if calver(needed[1]) > calver(connectors):
                    print(
                        f"::warning::{stream.dist} at HEAD requires osprey-connectors>={needed[1]},"
                        f" above the framework's connectors floor {connectors}"
                    )
                else:
                    print(
                        f"{stream.dist} at HEAD requires osprey-connectors>={needed[1]},"
                        f" within the framework's connectors floor {connectors}"
                    )

        with open(os.environ["GITHUB_OUTPUT"], "a") as out:
            out.write("requirements=" + " ".join(f"{d}=={v}" for d, v in floors.items()) + "\n")
            out.write("scans=" + " ".join(scans) + "\n")
        PLAN

    - name: Install the built wheels with every floor together
      # pyaml-cs-osprey without its dependencies: the scan reads its source and
      # resolves only component names, so pyAML is not needed here.
      env:
        REQUIREMENTS: ${{ steps.plan.outputs.requirements }}
      run: |
        read -ra floors <<< "$REQUIREMENTS"
        uv venv /tmp/floor-check
        uv pip install --python /tmp/floor-check/bin/python \
          ./dist/osprey_framework-*.whl "${floors[@]}"
        uv pip install --python /tmp/floor-check/bin/python --no-deps \
          ./dist/pyaml_cs_osprey-*.whl

    - name: Scan the built framework for component names the floors lack
      env:
        SCANS: ${{ steps.plan.outputs.scans }}
      run: |
        if [ -z "$SCANS" ]; then
          echo "::error::the plan armed no floor to scan"
          exit 1
        fi
        status=0
        for scan in $SCANS; do
          target="${scan%%:*}"
          IFS=, read -ra consumers <<< "${scan#*:}"
          packages=()
          for consumer in "${consumers[@]}"; do packages+=(--package "$consumer"); done
          echo "scanning ${consumers[*]} for $target names its floor lacks"
          /tmp/floor-check/bin/python -I \
            packages/osprey-connectors/tests/osprey_connectors_tests/compat/scan_framework_imports.py \
            --release --target "$target" "${packages[@]}" || status=1
        done
        exit "$status"

  publish-to-pypi:
    name: Publish to PyPI
    # `verify-full-ci` already gates `build`, so this repeats it — deliberately.
    # The publish is the one step nobody can take back, and a future edit that
    # re-wires the chain above must not be able to un-gate it silently.
    needs: [verify-full-ci, build, validate-install-docs, verify-pypi-resolvable, verify-component-floors]
    if: github.repository == 'als-apg/osprey' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/osprey-framework/
    # Trusted publishing: the OIDC token is minted for this job alone.
    permissions:
      id-token: write

    steps:
    - name: Download distribution artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        name: python-package-distributions
        path: dist/

    # The framework depends on every lockstep member, and PyPI takes files one
    # at a time. Members upload first, from a directory holding only their
    # files, so a refused member upload stops the run before the framework is
    # live with a dependency nothing satisfies. Staged by exclusion, so a member
    # added later publishes ahead of the framework without an edit here.
    # skip-existing lets a re-pushed tag complete a publish that stopped halfway.
    - name: Stage member distributions
      run: |
        mkdir -p dist-members
        for file in dist/*; do
          case "$(basename "$file")" in
            osprey_framework-*|osprey-framework-*) ;;
            *) mv "$file" dist-members/ ;;
          esac
        done
        ls -l dist-members/ dist/
        if [ -z "$(ls -A dist-members)" ]; then
          echo "No member distributions found in dist/"
          exit 1
        fi

    - name: Publish workspace members to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
      with:
        packages-dir: dist-members/
        skip-existing: true
        verbose: true

    - name: Publish framework to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
      with:
        packages-dir: dist/
        skip-existing: true
        verbose: true

  create-github-release:
    name: Create GitHub Release
    needs: [publish-to-pypi]
    if: github.repository == 'als-apg/osprey' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # creating the release

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Extract version from tag
      id: get_version
      run: |
        VERSION="${GITHUB_REF#refs/tags/v}"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Version: $VERSION"
        # Anything that is not exactly X.Y.Z is a pre-release (b1/rc1 suffixes).
        # Same rule as docs_publish.py's RELEASE_TAG_RE: the stable grammar is
        # the whitelist, everything else must not be advertised as latest.
        if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "prerelease=false" >> "$GITHUB_OUTPUT"
        else
          echo "prerelease=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Extract release notes from CHANGELOG
      id: changelog
      # scripts/ci/release_notes.py, shared with release-package.yml: the
      # tag's section, its heading matched literally, up to the next release
      # heading — or a pointer to the file when the section is missing.
      env:
        VERSION: ${{ steps.get_version.outputs.version }}
      run: |
        echo "Extracting release notes for version $VERSION"
        python3 scripts/ci/release_notes.py CHANGELOG.md "$VERSION" > release_notes.md
        cat release_notes.md

    - name: Create Release
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
      with:
        name: Release v${{ steps.get_version.outputs.version }}
        body_path: release_notes.md
        draft: false
        prerelease: ${{ steps.get_version.outputs.prerelease == 'true' }}

# osprey-connectors, osprey-facility and osprey-panels publish from
# release-package.yml, each on its own osprey-<package>-v* tags, through its own
# `pypi-<package>` environment.
