name: Release to PyPI

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v2026.5.0

# PAIRED PUBLISHING: osprey-connectors versions with the framework's own
# calendar stream (same v-tags, same describe — see its pyproject.toml), so one
# tag builds and publishes BOTH wheels, always carrying the same number. The
# old two-tag dance (a connectors release published before the framework tag
# that needed it, from its own osprey-connectors-v* trigger) is retired with
# the 0.x line itself. verify-pypi-resolvable still gates the framework wheel,
# resolving its dependencies from PyPI plus ONLY the sibling connectors wheel
# this same run publishes — the one honest offline stand-in for the state PyPI
# reaches the moment the publish job lands. (validate-install-docs cannot be
# that gate: it installs with `--find-links dist`, so any unpublished sibling
# resolves locally there.)

permissions:
  contents: write  # Required for creating GitHub releases
  id-token: write  # Required for trusted publishing to PyPI

jobs:
  # Nothing else in this workflow runs a test, so without this job a tag can
  # publish a tree whose agentic lanes never ran. Those eight lanes are gated
  # on the `full-ci` label, and `all-checks-passed` counts a conditionally
  # skipped lane as a pass — so an unlabeled release PR merges fully green
  # having proved nothing about the agent paths. This is where that is caught,
  # before the wheel is built.
  verify-full-ci:
    name: Verify Full CI On The Tagged Tree
    runs-on: ubuntu-latest
    if: startsWith(github.ref_name, 'v')
    # A job-level block REPLACES the workflow's scopes rather than extending
    # them. Reading another workflow's runs needs `actions: read`; nothing here
    # writes anything.
    permissions:
      actions: read
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # the tree comparison below walks the tag's parents

    - name: Require a green full-ci run on this tree
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        TAG_SHA: ${{ github.sha }}
        TAG_NAME: ${{ github.ref_name }}
      run: |
        python3 - <<'PY'
        import json, os, subprocess, sys

        # Job-name prefixes keyed by ci.yml job id: the gate matches on a
        # prefix because `agentic-per-preset` is a matrix that renders one job
        # per preset. tests/deployment/test_ci_workflow_wiring.py pins this map
        # against ci.yml, so a renamed lane fails a unit test, not a release.
        REQUIRED = {
            "agentic-per-preset": "Tier 3 — Agentic flow",
            "e2e-tests": "E2E Tests",
            "dispatch-deploy-e2e": "Dispatch Deploy E2E",
            "single-user-narrowing-e2e": "Single-User Narrowing E2E",
            "dispatch-overlay-e2e": "Dispatch Overlay E2E",
            "scan-agentic-e2e": "Scan Stack Agentic E2E",
            "nextcloud-talk-bridge-e2e": "Nextcloud Talk Bridge E2E",
            "gchat-bridge-e2e": "Google Chat Bridge E2E",
            "target-switch-agentic-e2e": "Control-Target Switch Agentic E2E",
        }
        REPO, TAG_SHA, TAG = os.environ["REPO"], os.environ["TAG_SHA"], os.environ["TAG_NAME"]

        def git(*args):
            return subprocess.run(["git", *args], capture_output=True, text=True,
                                  check=True).stdout.strip()

        def api(path, paginate=False):
            cmd = ["gh", "api", *(["--paginate", "--slurp"] if paginate else []), path]
            done = subprocess.run(cmd, capture_output=True, text=True)
            if done.returncode:
                sys.exit(f"::error::gh api {path} failed: {done.stderr.strip()}")
            return json.loads(done.stdout)

        # A `--merge` merge commit has a different sha from the PR head whose
        # run carried the label, and a tag may sit a commit or two above it.
        # What the lanes actually proved is a TREE, so any nearby commit with
        # the tagged commit's tree is an equally good place to find the run.
        tag_tree = git("rev-parse", TAG_SHA + "^{tree}")
        nearby = git("log", "--first-parent", "-n", "3", "--format=%H", TAG_SHA).split()
        nearby += git("rev-parse", TAG_SHA + "^@").split()
        candidates, seen = [], set()
        for raw in [TAG_SHA, *nearby]:
            sha = git("rev-parse", raw + "^{commit}")  # full form, so dedupe works
            if sha in seen:
                continue
            seen.add(sha)
            if git("rev-parse", sha + "^{tree}") == tag_tree:
                candidates.append(sha)

        def missing_lanes(run_id):
            """Lane ids whose job is absent, skipped, or not successful."""
            pages = api(f"repos/{REPO}/actions/runs/{run_id}/jobs?per_page=100", paginate=True)
            jobs = [j for page in pages for j in page.get("jobs", [])]
            bad = {}
            for lane, prefix in REQUIRED.items():
                matches = [j for j in jobs if j["name"].startswith(prefix)]
                if not matches:
                    bad[lane] = "no such job in the run"
                elif any(j["conclusion"] != "success" for j in matches):
                    bad[lane] = ", ".join(sorted({str(j["conclusion"]) for j in matches}))
            return bad

        # Every successful run on a same-tree commit is checked, not only the
        # newest: a later re-run without the label is green and empty, and it
        # must not hide the labeled run that actually did the work.
        report = []
        for sha in candidates:
            runs = api(f"repos/{REPO}/actions/workflows/ci.yml/runs?head_sha={sha}&per_page=20")
            for run in runs.get("workflow_runs", []):
                if run["conclusion"] != "success":
                    continue
                bad = missing_lanes(run["id"])
                if not bad:
                    print(f"✅ every model-spending lane passed on {sha[:12]}: {run['html_url']}")
                    sys.exit(0)
                report.append(f"  {run['html_url']} — " +
                              "; ".join(f"{k}: {v}" for k, v in sorted(bad.items())))

        print(f"::error::no CI run proves the agentic lanes on the tree tagged {TAG}")
        print("Trees checked: " + ", ".join(s[:12] for s in candidates))
        print("\n".join(report) if report else "  no successful ci.yml run on any of them")
        print("A lane reported `skipped` did not run: the `full-ci` label was missing.")
        print("Run the lanes against this tree, by either route:")
        print("  gh pr edit <release-notes PR> --add-label full-ci   # before merging it")
        print(f"  gh workflow run ci.yml --ref {TAG} -f revalidate_secret_lanes=true")
        print("Then re-push the tag, which retriggers this workflow:")
        print(f"  git push --delete origin {TAG} && git push origin {TAG}")
        print(f"  (git tag -f {TAG} <sha> in between, if the tag has to move)")
        sys.exit(1)
        PY

  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: [verify-full-ci]
    if: startsWith(github.ref_name, 'v')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # Fetch all history for version detection

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python
      run: uv python install 3.11

    - name: Build packages
      # Both workspace packages: the framework and osprey-connectors ride the
      # same v-tag and must land on PyPI together, carrying the same number.
      run: uv build --all-packages

    - name: Verify built versions match tag
      # The versions are derived from the tag rather than a literal, so this
      # checks the artifacts that are actually about to be published — every
      # wheel, since both packages derive from the same tag. A shallow checkout
      # or a missing tag does not fail the build — it silently yields 0.1.devN —
      # so this gate is what catches that before it reaches PyPI.
      run: |
        TAG_VERSION="${GITHUB_REF#refs/tags/v}"
        echo "Tag version: $TAG_VERSION"
        status=0
        for WHEEL in dist/*.whl; do
          # Wheel filenames are <name>-<version>-<python tag>-...; field 2 is the version.
          BUILT_VERSION=$(basename "$WHEEL" | cut -d'-' -f2)
          echo "$(basename "$WHEEL"): $BUILT_VERSION"
          if [ "$TAG_VERSION" != "$BUILT_VERSION" ]; then
            echo "❌ Version mismatch! Tag: $TAG_VERSION, Built: $BUILT_VERSION"
            echo "   A clean checkout of tag v$TAG_VERSION must build exactly $TAG_VERSION."
            echo "   A local segment or .postN means the tag is not what was built."
            status=1
          fi
        done
        [ "$status" -eq 0 ] && echo "✅ Every built version matches tag: $TAG_VERSION"
        exit "$status"

    - name: Check package
      run: uvx twine check dist/*

    - name: List built artifacts
      run: |
        ls -lh dist/

    - name: Upload distribution artifacts
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions
        path: dist/

  validate-install-docs:
    name: Validate Install Docs
    needs: [build]
    if: startsWith(github.ref_name, 'v')
    uses: ./.github/workflows/validate-install-docs.yml

  verify-pypi-resolvable:
    name: Verify Deps Resolve From PyPI
    needs: [build]
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest

    # The wheel about to be published, installed the way the docs tell users to
    # install it: every dependency must resolve from the index — except the one
    # sibling this same run publishes. The connectors wheel is staged into its
    # own find-links directory (never the whole dist/, which would let ANY
    # unpublished dependency resolve locally and defeat the gate): PyPI plus
    # that one wheel is exactly the index state the moment publish-to-pypi
    # lands, so this is what refuses a framework wheel whose OTHER pins nothing
    # on PyPI satisfies yet.
    steps:
    - name: Download distribution artifacts
      uses: actions/download-artifact@v8
      with:
        name: python-package-distributions
        path: dist/

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Install framework wheel with deps from PyPI plus the paired connectors wheel
      run: |
        mkdir -p /tmp/sibling
        cp dist/osprey_connectors-*.whl /tmp/sibling/
        uv tool install ./dist/osprey_framework-*.whl --find-links /tmp/sibling
        osprey --version

  publish-to-pypi:
    name: Publish to PyPI
    # `verify-full-ci` already gates `build`, so this repeats it — deliberately.
    # The publish is the one step nobody can take back, and a future edit that
    # re-wires the chain above must not be able to un-gate it silently.
    needs: [verify-full-ci, build, validate-install-docs, verify-pypi-resolvable]
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/osprey-framework/

    steps:
    - name: Download distribution artifacts
      uses: actions/download-artifact@v8
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        verbose: true

  create-github-release:
    name: Create GitHub Release
    needs: [publish-to-pypi]
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Extract version from tag
      id: get_version
      run: |
        VERSION="${GITHUB_REF#refs/tags/v}"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
        # Anything that is not exactly X.Y.Z is a pre-release (b1/rc1 suffixes).
        # Same rule as docs_publish.py's RELEASE_TAG_RE: the stable grammar is
        # the whitelist, everything else must not be advertised as latest.
        if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "prerelease=false" >> $GITHUB_OUTPUT
        else
          echo "prerelease=true" >> $GITHUB_OUTPUT
        fi

    - name: Extract release notes from CHANGELOG
      id: changelog
      run: |
        VERSION="${{ steps.get_version.outputs.version }}"
        echo "Extracting release notes for version $VERSION"

        # Extract section between [VERSION] and next [VERSION] or end
        sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$d' > release_notes.md

        # If empty, use a generic message
        if [ ! -s release_notes.md ]; then
          echo "See CHANGELOG.md for details." > release_notes.md
        fi

        cat release_notes.md

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        name: Release v${{ steps.get_version.outputs.version }}
        body_path: release_notes.md
        draft: false
        prerelease: ${{ steps.get_version.outputs.prerelease == 'true' }}

# The former publish-connectors-to-pypi job (its own osprey-connectors-v* tag,
# its own static-version check) is retired: the connectors package now versions
# with the framework's calendar stream, and the build job above publishes both
# wheels from the one v-tag.
