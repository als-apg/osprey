name: Release to PyPI

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v2026.5.0

permissions:
  contents: write  # Required for creating GitHub releases
  id-token: write  # Required for trusted publishing to PyPI

jobs:
  build:
    name: Build Distribution
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # Fetch all history for version detection

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python
      run: uv python install 3.11

    - name: Build package
      run: uv build

    - name: Verify built version matches tag
      # The version is derived from the tag rather than a literal, so this checks
      # the artifact that is actually about to be published. A shallow checkout or
      # a missing tag does not fail the build — it silently yields 0.1.devN — so
      # this gate is what catches that before it reaches PyPI.
      run: |
        TAG_VERSION="${GITHUB_REF#refs/tags/v}"
        WHEEL=$(ls dist/*.whl)
        # Wheel filenames are <name>-<version>-<python tag>-...; field 2 is the version.
        BUILT_VERSION=$(basename "$WHEEL" | cut -d'-' -f2)
        echo "Tag version:   $TAG_VERSION"
        echo "Built version: $BUILT_VERSION"
        if [ "$TAG_VERSION" != "$BUILT_VERSION" ]; then
          echo "❌ Version mismatch! Tag: $TAG_VERSION, Built: $BUILT_VERSION"
          echo "   A clean checkout of tag v$TAG_VERSION must build exactly $TAG_VERSION."
          echo "   A local segment or .postN means the tag is not what was built."
          exit 1
        fi
        echo "✅ Built version matches tag: $TAG_VERSION"

    - name: Check package
      run: uvx twine check dist/*

    - name: List built artifacts
      run: |
        ls -lh dist/

    - name: Upload distribution artifacts
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions
        path: dist/

  validate-install-docs:
    name: Validate Install Docs
    needs: [build]
    uses: ./.github/workflows/validate-install-docs.yml

  publish-to-pypi:
    name: Publish to PyPI
    needs: [build, validate-install-docs]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/osprey-framework/

    steps:
    - name: Download distribution artifacts
      uses: actions/download-artifact@v8
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        verbose: true

  create-github-release:
    name: Create GitHub Release
    needs: [publish-to-pypi]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Extract version from tag
      id: get_version
      run: |
        VERSION="${GITHUB_REF#refs/tags/v}"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Extract release notes from CHANGELOG
      id: changelog
      run: |
        VERSION="${{ steps.get_version.outputs.version }}"
        echo "Extracting release notes for version $VERSION"

        # Extract section between [VERSION] and next [VERSION] or end
        sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$d' > release_notes.md

        # If empty, use a generic message
        if [ ! -s release_notes.md ]; then
          echo "See CHANGELOG.md for details." > release_notes.md
        fi

        cat release_notes.md

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        name: Release v${{ steps.get_version.outputs.version }}
        body_path: release_notes.md
        draft: false
        prerelease: false
