name: Release to PyPI

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v2026.5.0

# PAIRED PUBLISHING: the framework and the workspace members that version with
# it (today osprey-optimizer and pyaml-cs-osprey: same v-tags, same describe —
# see their pyproject.toml) build and publish from one v-tag, always carrying the same
# number. osprey-connectors is NOT one of them: it has its own calendar stream
# on its own osprey-connectors-v* tags and publishes from
# release-connectors.yml, so nothing here builds or uploads it. The framework
# declares only a floor on it (`osprey-connectors>=` in the root
# pyproject.toml), and verify-pypi-resolvable is the gate that the floor is
# already on PyPI: it resolves the framework wheel's dependencies from PyPI
# plus ONLY the lockstep member wheels this same run publishes — the one honest
# offline stand-in for the state PyPI reaches the moment the publish job lands —
# so osprey-connectors can only come from PyPI. (validate-install-docs cannot
# be that gate: it installs with `--find-links dist`, so any unpublished sibling
# resolves locally there.) A framework that needs a newer connectors release
# raises the floor only after release-connectors.yml has published it.

# Nothing at workflow level writes. The two jobs that do — the PyPI upload
# (`id-token`) and the GitHub release (`contents`) — say so in their own block,
# so the jobs that install from PyPI and run what they installed hold neither.
permissions:
  contents: read

# Only the upstream repository publishes. Every job carries the repository
# guard, so a version tag on a mirror or fork builds and publishes nothing.
jobs:
  # Nothing else in this workflow runs a test, so without this job a tag can
  # publish a tree whose agentic lanes never ran. Every lane `REQUIRED_LANES`
  # below names is gated on the `full-ci` label, and `all-checks-passed` counts a
  # conditionally skipped lane as a pass — so an unlabeled release PR merges
  # fully green having proved nothing about the agent paths. This is where that
  # is caught, before the wheel is built.
  verify-full-ci:
    name: Verify Full CI On The Tagged Tree
    runs-on: ubuntu-latest
    if: github.repository == 'als-apg/osprey' && startsWith(github.ref, 'refs/tags/v')
    # A job-level block REPLACES the workflow's scopes rather than extending
    # them. Reading another workflow's runs needs `actions: read`; nothing here
    # writes anything.
    permissions:
      actions: read
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0  # the tree comparison below walks the tag's parents
        persist-credentials: false

    - name: Require the tagged commit on main
      # Releases are cut from main (the release skill). The lane gate
      # below cannot tell: a commit off main whose tree had a green run passes
      # it. And a connectors tag main cannot reach leaves main's dev builds
      # describing from an older connectors tag, below the framework's floor.
      # Shared with release-connectors.yml; tests/deployment/test_ci_workflow_wiring.py
      # holds the two copies equal and runs this one against a scratch repo.
      env:
        TAG_SHA: ${{ github.sha }}
        TAG_NAME: ${{ github.ref_name }}
      run: |
        git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
        if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
          echo "::error::$TAG_NAME ($TAG_SHA) is not on main. Tag the merge commit on main:"
          echo "  git push --delete origin $TAG_NAME && git tag -f $TAG_NAME <main sha> && git push origin $TAG_NAME"
          exit 1
        fi
        echo "✅ $TAG_NAME is on main"

    - name: Require a green full-ci run on this tree
      # scripts/ci/require_green_lanes.py, shared with release-connectors.yml:
      # a successful ci.yml run on a commit carrying the tagged tree in which
      # every lane below concluded `success`. A skipped lane is a lane the
      # `full-ci` label was missing for, and does not count.
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        TAG_SHA: ${{ github.sha }}
        TAG_NAME: ${{ github.ref_name }}
        # The model-spending lanes, one per line: <lane id>=<rendered job-name
        # prefix>. A lane id is its ci.yml job id, or the cell's `lane:` where a
        # matrix job hosts several lanes (`dispatch-stack-e2e`), each then named by
        # its own cell's prefix. A prefix, because a matrix job (`agentic-per-preset`)
        # renders one job per cell, and every cell must pass. tests/deployment/
        # test_ci_workflow_wiring.py pins this list to the spending lanes of LANES,
        # so a renamed lane fails a unit test, not a release.
        REQUIRED_LANES: |
          agentic-per-preset=Preset Agentic Flow
          e2e-tests=E2E Tests
          dispatch-deploy-e2e=Dispatch Stack E2E — Deploy
          single-user-narrowing-e2e=Dispatch Stack E2E — Single-User Narrowing
          dispatch-overlay-e2e=Dispatch Stack E2E — Overlay Visibility
          host-record-e2e=Dispatch Stack E2E — Host Record
          scan-agentic-e2e=Dispatch Stack E2E — Scan Stack Agentic
          nextcloud-talk-bridge-e2e=Nextcloud Talk Bridge E2E
          gchat-bridge-e2e=Google Chat Bridge E2E
          dockerfile-agent-e2e=Dockerfile Agent E2E
          target-switch-agentic-e2e=Control-Target Switch Agentic E2E
      run: |
        python3 scripts/ci/require_green_lanes.py --lanes "$REQUIRED_LANES" \
          --hint "gh pr edit <release-notes PR> --add-label full-ci   # before merging it" \
          --hint "gh workflow run ci.yml --ref $TAG_NAME -f revalidate_secret_lanes=true"

  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: [verify-full-ci]
    if: github.repository == 'als-apg/osprey' && startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0  # Fetch all history for version detection
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

    - name: Set up Python
      run: uv python install 3.11

    - name: Build packages
      # The framework and the members that ride its v-tag, named one by one
      # rather than `--all-packages`: osprey-connectors is a workspace member
      # too, but it releases from its own tags (release-connectors.yml), and a
      # wheel of it built here would carry the framework-tag checkout's
      # connectors number. tests/deployment/test_ci_workflow_wiring.py holds
      # this list to the workspace members minus osprey-connectors.
      run: |
        uv build
        uv build --package osprey-optimizer
        uv build --package pyaml-cs-osprey

    - name: Verify built versions match tag
      # The versions are derived from the tag rather than a literal, so this
      # checks the artifacts that are actually about to be published — every
      # wheel, since every package built above derives from the same tag. A shallow checkout
      # or a missing tag does not fail the build — it silently yields 0.0.postN+g…
      # or the previous tag's .postN — so this gate is what catches that before it reaches PyPI.
      run: |
        TAG_VERSION="${GITHUB_REF#refs/tags/v}"
        echo "Tag version: $TAG_VERSION"
        status=0
        if compgen -G "dist/osprey_connectors-*" > /dev/null; then
          echo "❌ dist/ holds osprey-connectors, which publishes from release-connectors.yml"
          status=1
        fi
        for WHEEL in dist/*.whl; do
          # Wheel filenames are <name>-<version>-<python tag>-...; field 2 is the version.
          BUILT_VERSION=$(basename "$WHEEL" | cut -d'-' -f2)
          echo "$(basename "$WHEEL"): $BUILT_VERSION"
          if [ "$TAG_VERSION" != "$BUILT_VERSION" ]; then
            echo "❌ Version mismatch! Tag: $TAG_VERSION, Built: $BUILT_VERSION"
            echo "   A clean checkout of tag v$TAG_VERSION must build exactly $TAG_VERSION."
            echo "   A local segment or .postN means the tag is not what was built."
            status=1
          fi
        done
        [ "$status" -eq 0 ] && echo "✅ Every built version matches tag: $TAG_VERSION"
        exit "$status"

    - name: Check package
      run: uvx twine check dist/*

    - name: List built artifacts
      run: |
        ls -lh dist/

    - name: Upload distribution artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: python-package-distributions
        path: dist/

  validate-install-docs:
    name: Validate Install Docs
    needs: [build]
    if: github.repository == 'als-apg/osprey' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/validate-install-docs.yml

  verify-pypi-resolvable:
    name: Verify Deps Resolve From PyPI
    needs: [build]
    if: github.repository == 'als-apg/osprey' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    # The wheel about to be published, installed the way the docs tell users to
    # install it: every dependency must resolve from the index — except the
    # lockstep members this same run publishes. Each of their wheels (each
    # dist/*.whl but the framework's own) is staged into a find-links directory
    # of its own (never the whole dist/ as-is, which would also offer the sdists
    # and let ANY unpublished dependency resolve locally and defeat the gate):
    # PyPI plus those wheels is exactly the index state the moment
    # publish-to-pypi lands, so this is what refuses a framework wheel whose
    # OTHER pins nothing on PyPI satisfies yet. osprey-connectors is excluded by
    # name as well as never built here: it must resolve from PyPI, which is what
    # proves the framework's `osprey-connectors>=` floor is already published.
    # Staged by exclusion otherwise, so a lockstep member added later is offered
    # here the day it starts publishing, not after this gate has failed its
    # first tag.
    steps:
    - name: Download distribution artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        name: python-package-distributions
        path: dist/

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

    - name: Install framework wheel with deps from PyPI plus the lockstep member wheels
      # `--prerelease if-necessary`, spelled out rather than left to whatever
      # the floating uv defaults to: a pre-release is taken only where nothing
      # stable satisfies a requirement — which includes a requirement that names
      # one, since no stable satisfies `==X.YbN` — the policy the resolvers
      # deployments use behave like. With uv ≥ 0.12, `if-necessary` means
      # stable first, a pre-release only when every stable candidate is
      # rejected, transitive dependencies included; `if-necessary-or-explicit`
      # is its deprecated alias. setup-uv installs the current uv. The
      # framework's floor names a stable osprey-connectors release, so this
      # resolves a stable one and a connectors beta is never absorbed.
      run: |
        mkdir -p /tmp/sibling
        for wheel in dist/*.whl; do
          case "$(basename "$wheel")" in
            osprey_framework-*|osprey_connectors-*) ;;
            *) cp "$wheel" /tmp/sibling/ ;;
          esac
        done
        ls /tmp/sibling
        uv tool install ./dist/osprey_framework-*.whl --find-links /tmp/sibling \
          --prerelease if-necessary
        osprey --version
        # The framework's `optimizer` extra names osprey-optimizer, whose wheel
        # the loop above staged with the other members. The base only: the
        # `service` extra is the optimizer image's, and its pins (torch, xopt)
        # are checked by that image's build.
        FRAMEWORK_WHEEL=$(ls "$PWD"/dist/osprey_framework-*.whl)
        uv venv /tmp/optimizer-check
        uv pip install --python /tmp/optimizer-check/bin/python \
          "osprey-framework[optimizer] @ file://$FRAMEWORK_WHEEL" --find-links /tmp/sibling
        /tmp/optimizer-check/bin/python -c "import osprey, osprey_optimizer.models.api, osprey_optimizer.environments.spec"

  publish-to-pypi:
    name: Publish to PyPI
    # `verify-full-ci` already gates `build`, so this repeats it — deliberately.
    # The publish is the one step nobody can take back, and a future edit that
    # re-wires the chain above must not be able to un-gate it silently.
    needs: [verify-full-ci, build, validate-install-docs, verify-pypi-resolvable]
    if: github.repository == 'als-apg/osprey' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/osprey-framework/
    # Trusted publishing: the OIDC token is minted for this job alone.
    permissions:
      id-token: write

    steps:
    - name: Download distribution artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        name: python-package-distributions
        path: dist/

    # The framework depends on every lockstep member, and PyPI takes files one
    # at a time. Members upload first, from a directory holding only their
    # files, so a refused member upload stops the run before the framework is
    # live with a dependency nothing satisfies. Staged by exclusion, so a member
    # added later publishes ahead of the framework without an edit here.
    # skip-existing lets a re-pushed tag complete a publish that stopped halfway.
    - name: Stage member distributions
      run: |
        mkdir -p dist-members
        for file in dist/*; do
          case "$(basename "$file")" in
            osprey_framework-*|osprey-framework-*) ;;
            *) mv "$file" dist-members/ ;;
          esac
        done
        ls -l dist-members/ dist/
        if [ -z "$(ls -A dist-members)" ]; then
          echo "No member distributions found in dist/"
          exit 1
        fi

    - name: Publish workspace members to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
      with:
        packages-dir: dist-members/
        skip-existing: true
        verbose: true

    - name: Publish framework to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
      with:
        packages-dir: dist/
        skip-existing: true
        verbose: true

  create-github-release:
    name: Create GitHub Release
    needs: [publish-to-pypi]
    if: github.repository == 'als-apg/osprey' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # creating the release

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Extract version from tag
      id: get_version
      run: |
        VERSION="${GITHUB_REF#refs/tags/v}"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Version: $VERSION"
        # Anything that is not exactly X.Y.Z is a pre-release (b1/rc1 suffixes).
        # Same rule as docs_publish.py's RELEASE_TAG_RE: the stable grammar is
        # the whitelist, everything else must not be advertised as latest.
        if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "prerelease=false" >> "$GITHUB_OUTPUT"
        else
          echo "prerelease=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Extract release notes from CHANGELOG
      id: changelog
      # scripts/ci/release_notes.py, shared with release-connectors.yml: the
      # tag's section, its heading matched literally, up to the next release
      # heading — or a pointer to the file when the section is missing.
      env:
        VERSION: ${{ steps.get_version.outputs.version }}
      run: |
        echo "Extracting release notes for version $VERSION"
        python3 scripts/ci/release_notes.py CHANGELOG.md "$VERSION" > release_notes.md
        cat release_notes.md

    - name: Create Release
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
      with:
        name: Release v${{ steps.get_version.outputs.version }}
        body_path: release_notes.md
        draft: false
        prerelease: ${{ steps.get_version.outputs.prerelease == 'true' }}

# osprey-connectors publishes from release-connectors.yml, on its own
# osprey-connectors-v* tags, through its own `pypi-connectors` environment.
