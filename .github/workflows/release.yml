name: Release to PyPI

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v2026.5.0

# PAIRED PUBLISHING: osprey-connectors versions with the framework's own
# calendar stream (same v-tags, same describe — see its pyproject.toml), so one
# tag builds and publishes BOTH wheels, always carrying the same number. The
# old two-tag dance (a connectors release published before the framework tag
# that needed it, from its own osprey-connectors-v* trigger) is retired with
# the 0.x line itself. verify-pypi-resolvable still gates the framework wheel,
# resolving its dependencies from PyPI plus ONLY the sibling connectors wheel
# this same run publishes — the one honest offline stand-in for the state PyPI
# reaches the moment the publish job lands. (validate-install-docs cannot be
# that gate: it installs with `--find-links dist`, so any unpublished sibling
# resolves locally there.)

permissions:
  contents: write  # Required for creating GitHub releases
  id-token: write  # Required for trusted publishing to PyPI

jobs:
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    if: startsWith(github.ref_name, 'v')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # Fetch all history for version detection

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python
      run: uv python install 3.11

    - name: Build packages
      # Both workspace packages: the framework and osprey-connectors ride the
      # same v-tag and must land on PyPI together, carrying the same number.
      run: uv build --all-packages

    - name: Verify built versions match tag
      # The versions are derived from the tag rather than a literal, so this
      # checks the artifacts that are actually about to be published — every
      # wheel, since both packages derive from the same tag. A shallow checkout
      # or a missing tag does not fail the build — it silently yields 0.1.devN —
      # so this gate is what catches that before it reaches PyPI.
      run: |
        TAG_VERSION="${GITHUB_REF#refs/tags/v}"
        echo "Tag version: $TAG_VERSION"
        status=0
        for WHEEL in dist/*.whl; do
          # Wheel filenames are <name>-<version>-<python tag>-...; field 2 is the version.
          BUILT_VERSION=$(basename "$WHEEL" | cut -d'-' -f2)
          echo "$(basename "$WHEEL"): $BUILT_VERSION"
          if [ "$TAG_VERSION" != "$BUILT_VERSION" ]; then
            echo "❌ Version mismatch! Tag: $TAG_VERSION, Built: $BUILT_VERSION"
            echo "   A clean checkout of tag v$TAG_VERSION must build exactly $TAG_VERSION."
            echo "   A local segment or .postN means the tag is not what was built."
            status=1
          fi
        done
        [ "$status" -eq 0 ] && echo "✅ Every built version matches tag: $TAG_VERSION"
        exit "$status"

    - name: Check package
      run: uvx twine check dist/*

    - name: List built artifacts
      run: |
        ls -lh dist/

    - name: Upload distribution artifacts
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions
        path: dist/

  validate-install-docs:
    name: Validate Install Docs
    needs: [build]
    if: startsWith(github.ref_name, 'v')
    uses: ./.github/workflows/validate-install-docs.yml

  verify-pypi-resolvable:
    name: Verify Deps Resolve From PyPI
    needs: [build]
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest

    # The wheel about to be published, installed the way the docs tell users to
    # install it: every dependency must resolve from the index — except the one
    # sibling this same run publishes. The connectors wheel is staged into its
    # own find-links directory (never the whole dist/, which would let ANY
    # unpublished dependency resolve locally and defeat the gate): PyPI plus
    # that one wheel is exactly the index state the moment publish-to-pypi
    # lands, so this is what refuses a framework wheel whose OTHER pins nothing
    # on PyPI satisfies yet.
    steps:
    - name: Download distribution artifacts
      uses: actions/download-artifact@v8
      with:
        name: python-package-distributions
        path: dist/

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Install framework wheel with deps from PyPI plus the paired connectors wheel
      run: |
        mkdir -p /tmp/sibling
        cp dist/osprey_connectors-*.whl /tmp/sibling/
        uv tool install ./dist/osprey_framework-*.whl --find-links /tmp/sibling
        osprey --version

  publish-to-pypi:
    name: Publish to PyPI
    needs: [build, validate-install-docs, verify-pypi-resolvable]
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/osprey-framework/

    steps:
    - name: Download distribution artifacts
      uses: actions/download-artifact@v8
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        verbose: true

  create-github-release:
    name: Create GitHub Release
    needs: [publish-to-pypi]
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Extract version from tag
      id: get_version
      run: |
        VERSION="${GITHUB_REF#refs/tags/v}"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Extract release notes from CHANGELOG
      id: changelog
      run: |
        VERSION="${{ steps.get_version.outputs.version }}"
        echo "Extracting release notes for version $VERSION"

        # Extract section between [VERSION] and next [VERSION] or end
        sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$d' > release_notes.md

        # If empty, use a generic message
        if [ ! -s release_notes.md ]; then
          echo "See CHANGELOG.md for details." > release_notes.md
        fi

        cat release_notes.md

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        name: Release v${{ steps.get_version.outputs.version }}
        body_path: release_notes.md
        draft: false
        prerelease: false

# The former publish-connectors-to-pypi job (its own osprey-connectors-v* tag,
# its own static-version check) is retired: the connectors package now versions
# with the framework's calendar stream, and the build job above publishes both
# wheels from the one v-tag.
