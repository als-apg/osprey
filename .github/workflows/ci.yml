        docker rm -f panels-proj-agent-record || true
        docker rm -f panels-proj-agent-record-clickhouse || true
        docker volume ls -q --filter "name=^panels-proj_" \
          | xargs -r docker volume rm -f || true
        docker compose -p plan-agentic down || true
        docker rm -f plan-agentic-agent-record || true
        docker rm -f plan-agentic-agent-record-clickhouse || true
        docker volume ls -q --filter "name=^plan-agentic_" \
          | xargs -r docker volume rm -f || true
        docker compose -p orm-roundtrip down || true
        docker rm -f orm-roundtrip-agent-record || true
        docker rm -f orm-roundtrip-agent-record-clickhouse || true
        docker volume ls -q --filter "name=^orm-roundtrip_" \
          | xargs -r docker volume rm -f || true
        docker compose -p grid-scan-roundtrip down || true
        docker rm -f grid-scan-roundtrip-agent-record || true
        docker rm -f grid-scan-roundtrip-agent-record-clickhouse || true
        docker volume ls -q --filter "name=^grid-scan-roundtrip_" \
          | xargs -r docker volume rm -f || true
        docker compose -p bump-roundtrip down || true
        docker rm -f bump-roundtrip-agent-record || true
        docker rm -f bump-roundtrip-agent-record-clickhouse || true
        docker volume ls -q --filter "name=^bump-roundtrip_" \
          | xargs -r docker volume rm -f || true
        docker compose -p preflight-probe down || true
        docker rm -f preflight-probe-agent-record || true
        docker rm -f preflight-probe-agent-record-clickhouse || true
        docker volume ls -q --filter "name=^preflight-probe_" \
          | xargs -r docker volume rm -f || true
        docker compose -p sandbox-escape down || true
        docker rm -f sandbox-escape-agent-record || true
        docker rm -f sandbox-escape-agent-record-clickhouse || true
        docker volume ls -q --filter "name=^sandbox-escape_" \
          | xargs -r docker volume rm -f || true
        docker compose -p osprey-e2e-dispatch down || true
        docker rm -f osprey-e2e-dispatch-agent-record || true
        docker rm -f osprey-e2e-dispatch-agent-record-clickhouse || true
        docker volume ls -q --filter "name=^osprey-e2e-dispatch_" \
