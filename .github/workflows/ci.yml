  multi-user-deploy-lifecycle-e2e-podman:
    name: Multi-User Deploy Lifecycle E2E (podman runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Podman counterpart of multi-user-deploy-lifecycle-e2e, same scope (PRs into
    # main only); the test picks its runtime from OSPREY_E2E_RUNTIME.
    needs: changes
    if: >-
      (github.event_name == 'pull_request'
      && needs.changes.outputs.docs_only != 'true' &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && inputs.revalidate_secret_lanes)

    steps:
    - *free-runner-disk

    - *checkout-full-history

    - *install-uv

    - *python-3-11

    - name: Set up rootless Podman
      run: |
        podman --version
        pip install --user podman-compose==1.0.6
        podman compose version
        # Docker auto-treats localhost registries as insecure (plain HTTP);
        # rootless podman defaults to tls-verify=true, so the test's throwaway
        # stub registry on localhost:19081 (HTTP) breaks both `podman push` and
        # the deploy's `podman compose pull`. A registries.conf.d drop-in (merged,
        # not clobbering the default docker.io search registry) marks that one
        # host insecure — giving podman docker's built-in localhost behavior.
        mkdir -p ~/.config/containers/registries.conf.d
        cat > ~/.config/containers/registries.conf.d/localhost-insecure.conf <<'EOF'
        [[registry]]
        location = "localhost:19081"
        insecure = true
        EOF

    - *install-osprey

    - name: Run multi-user deploy lifecycle E2E (podman)
      timeout-minutes: 55
      env:
        OSPREY_E2E_RUNTIME: podman
        CONTAINER_RUNTIME: podman
      run: |
        # `podman compose` delegates to the docker-compose CLI plugin present on
        # the runner, which speaks the Docker API over the rootless podman socket
        # (unix://$XDG_RUNTIME_DIR/podman/podman.sock). That API service isn't
        # running by default — `podman push`/`build` are direct CLI calls that
        # need no socket, but the compose `pull`/`up` the deploy runs do. Start
        # it for the duration of this step (must be here, not the setup step:
        # each step is its own process group) and wait until it's listening.
        podman system service --time=0 &
        SOCK="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/podman/podman.sock"
        for _ in $(seq 1 30); do if [ -S "$SOCK" ]; then break; fi; sleep 1; done
        export DOCKER_HOST="unix://$SOCK"
        # `-m 'not qmd'`: same reason as the docker lane above — this lane has
        # no qmd sidecar image, and the shared-bundle/sidecar test refuses to
        # skip on a missing one. It would additionally need the image in
        # PODMAN's store rather than docker's, which is why it is not simply
        # built here.
        uv run pytest tests/e2e/test_deploy_lifecycle.py -m 'not qmd' -v --tb=short

    # Before the teardown below (see deploy-e2e).
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: multi-user-deploy-lifecycle-e2e-podman
        engine: podman

    # Belt and suspenders: see e2e-tests.
    - name: Clean up any stranded lifecycle-e2e resources
      if: always()
      run: |
        for user in alice bob carol dave erin; do
          podman rm -f "osprey-e2e-mus-p3-web-${user}" || true
          podman volume rm "osprey-e2e-mus-p3_${user}-claude-config" || true
          podman volume rm "osprey-e2e-mus-p3_${user}-agent-data" || true
        done
        podman rm -f osprey-e2e-mus-p3-nginx || true
        podman rm -f osprey-e2e-mus-p3-registry || true
        podman rm -f osprey-e2e-mus-p3-agent-record || true
        podman rm -f osprey-e2e-mus-p3-agent-record-clickhouse || true
        podman compose -p osprey-e2e-mus-p3 down || true
        podman volume rm osprey-e2e-mus-p3_agent_record_clickhouse_data || true

  two-shape-boot-e2e:
    name: Two-Shape Boot E2E (bridge + host network axis, podman-compose)
    runs-on: ubuntu-latest
    # Headroom: the module rebuilds the full project image cold each run and
    # boots twice; a slow run should report the module's own failure.
    timeout-minutes: 75
    # Secret-free. PRs into main AND epic/* (unlike the podman lifecycle lane): the
    # network axis and podman-compose provider are built on epic phase branches.
    needs: changes
    if: *main-or-epic-pr-or-secret-revalidation

    steps:
    # Out-of-disk here showed up as podman-compose 1.0.6 answering `up -d` 0 with
    # no container created.
    - *free-runner-disk

    - *checkout-full-history

    - *install-uv

    - *python-3-11

    - *install-osprey

    - name: Pin podman-compose 1.0.6 as podman's compose provider
      # Certifies podman-compose specifically (no --project-directory, one merged
      # compose document and env file); see the same step in static-checks.
      run: |
        pip install --user podman-compose==1.0.6
        PODMAN_COMPOSE_BIN="$(command -v podman-compose || true)"
        if [ -z "$PODMAN_COMPOSE_BIN" ]; then
          echo "❌ podman-compose is not on PATH after install"
          exit 1
        fi
        mkdir -p ~/.config/containers
        cat > ~/.config/containers/containers.conf <<EOF
        [engine]
        compose_providers = ["$PODMAN_COMPOSE_BIN"]
        EOF
        # Second, independent expression of the same choice — see the identical
        # line in static-checks. The file is authoritative for podman's config
        # chain; a USER-level containers.conf.d drop-in would outrank it, and
        # this env var sidesteps the chain entirely. Written to $GITHUB_ENV so
        # it reaches EVERY later step in this job — step 0 and the boot alike,
        # which is what keeps them in one environment.
        echo "PODMAN_COMPOSE_PROVIDER=$PODMAN_COMPOSE_BIN" >> "$GITHUB_ENV"
        podman --version
        podman ps >/dev/null

    - name: Step 0 — assert the compose provider is podman-compose 1.0.6
      env:
        CONTAINER_RUNTIME: podman
      # Falsifiability check before the ~20-min boot: the same
      # `detect_compose_provider` call the deploy makes, banner printed for audit.
      run: |
        podman compose version
        uv run python - <<'PY'
        from osprey.deployment.runtime_helper import (
            ComposeProvider,
            detect_compose_provider,
            get_runtime_command,
        )

        runtime_cmd = get_runtime_command()
        info = detect_compose_provider(runtime_cmd)
        print("runtime command:", " ".join(runtime_cmd))
        print("provider banner:", info.banner)
        assert info.provider is ComposeProvider.PODMAN_COMPOSE, (
            f"this lane must run podman-compose; probed {info.provider} instead"
        )
        assert info.version == (1, 0, 6), (
            f"this lane pins podman-compose 1.0.6; probed {info.version_text}"
        )
        print("✅ compose provider is podman-compose 1.0.6")
        PY

    - name: Pre-flight — the module's host ports must be free on the runner
      # Under the host shape these are REAL binds; a foreign socket would fail the
      # exposure test misleadingly. Fails open if `ss` is missing.
      run: |
        for port in 21781 21791; do
          if ss -ltnH "sport = :$port" 2>/dev/null | grep -q .; then
            echo "❌ port $port is already bound on this runner:"
            ss -ltnp "sport = :$port" || true
            exit 1
          fi
        done
        echo "✅ 21781 and 21791 are free"

    - name: Diagnostic — podman's inspect .State schema (health-field spelling)
      # INFORMATIONAL: which health-field spelling this podman uses (the module
      # accepts either). Before the boot because a step after a failed one does not
      # run. Never reds the lane (guarded calls, explicit `exit 0`).
      run: |
        PROBE=osprey-e2e-two-shape-schema-probe
        report_field() {
          # A Go template naming a field the runtime does not have is an ERROR,
          # not an empty render — which is what makes rc the answer here.
          if podman inspect --type container -f "{{json $1}}" "$PROBE" >/dev/null 2>&1; then
            echo "schema: podman DOES expose $1"
          else
            echo "schema: podman does NOT expose $1"
          fi
        }
        podman rm -f "$PROBE" >/dev/null 2>&1 || true
        if podman run -d --name "$PROBE" \
             --health-cmd true --health-interval 2s --health-retries 2 \
             docker.io/library/busybox:1.37 sleep 60 >/dev/null 2>&1; then
          sleep 6
          echo "--- podman inspect .State ---"
          podman inspect --type container -f '{{json .State}}' "$PROBE" 2>/dev/null | head -c 900
          echo
          report_field .State.Health
          report_field .State.Healthcheck
          podman rm -f "$PROBE" >/dev/null 2>&1 || true
        else
          echo "(schema probe unavailable — the throwaway container did not start)"
        fi
        exit 0

    - name: Run two-shape boot E2E (podman)
      timeout-minutes: 70
      env:
        # Fails at collection on any other value.
        OSPREY_E2E_RUNTIME: podman
        # `osprey up`'s runtime; a missing podman fails loudly instead of falling
        # through to the runner's docker daemon.
        CONTAINER_RUNTIME: podman
      # NO `podman system service` / DOCKER_HOST here, unlike the podman lifecycle
      # lane: podman-compose reads no socket, and the variable would be the only
      # difference between step 0 (which proves the provider) and this step. Do not
      # copy it in.
      run: |
        uv run pytest tests/e2e/test_two_shape_boot.py -v --tb=short

    # Before the cleanup below (see deploy-e2e).
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: two-shape-boot-e2e
        engine: podman

    # Belt and suspenders (see e2e-tests). The host shape binds real host ports,
    # so a stranded container would break the next run.
    - name: Clean up any stranded two-shape resources
      if: always()
      run: |
        podman rm -f osprey-e2e-two-shape-event-dispatcher || true
        podman rm -f osprey-e2e-two-shape-dispatch-worker-1 || true
        podman rm -f osprey-e2e-two-shape-schema-probe || true
        podman rm -f osprey-e2e-two-shape-agent-record || true
        podman rm -f osprey-e2e-two-shape-agent-record-clickhouse || true
        podman volume rm osprey-e2e-two-shape_dispatch_workspace_1 || true
        podman volume rm osprey-e2e-two-shape_agent_record_clickhouse_data || true
        podman network rm osprey-e2e-two-shape_osprey-network || true
        podman rmi -f osprey-e2e-two-shape:local || true
        podman rmi -f osprey-e2e-two-shape-dispatch:local || true

  qmd-sidecar-e2e:
    name: qmd Sidecar E2E (image build + live daemon over a fixture corpus)
    runs-on: ubuntu-latest
    # Same-repo only, no secrets.
    needs: changes
    if: *same-repo-pr-or-secret-revalidation
    # Cold cache fetches 2.1 GB of models and embeds the corpus before serving.
    # Covers the step caps (125 + 15 + 55 + 10) plus the image build;
    # tests/integration/test_qmd_sidecar_time_budget.py checks it.
    timeout-minutes: 240

    steps:
    - *free-runner-disk

    - *checkout-full-history

    - *install-uv

    - *python-3-11

    - *install-osprey

    # For the shared-bundle step's real `osprey up`.
    - *setup-compose

    - *assert-container-runtime

    - name: Build the sidecar image
      # Restores main's warm-up layer cache; restore only (a PR-saved cache would be
      # readable by that PR alone).
      uses: ./.github/actions/build-qmd-image
      with:
        # The mounted-models build below reuses this builder and cache.
        keep-builder: "true"

    - name: Run qmd sidecar E2E
      # Outlasts SIDECAR_ARIEL_TEST_TIMEOUT + SIDECAR_OKF_TEST_TIMEOUT (7041 s)
      # rounded up, plus 5 min; test_qmd_sidecar_time_budget.py checks it.
      timeout-minutes: 125
      env:
        # The module starts the sidecar from this tag instead of building its own.
        OSPREY_QMD_IMAGE: osprey-qmd:ci
      # Marker + keyword, not a file name: coverage is split across OKF and ARIEL
      # modules. Wall-clock budgets run in the next step.
      run: uv run pytest tests/integration/ -m "dockerbuild and not wallclock" -k qmd -v --tb=short

    - name: Run the wall-clock budgets serially
      # Selected by marker alone, in a process of its own; an empty selection
      # exits non-zero.
      timeout-minutes: 15
      env:
        OSPREY_QMD_IMAGE: osprey-qmd:ci
      run: uv run python scripts/check.py run pytest-wallclock

    - name: Run the multi-user shared-bundle sidecar E2E
      # The `qmd`-marked half of test_deploy_lifecycle.py, which the lifecycle lanes
      # deselect: it needs this image. The cap outlasts
      # DEPLOY_LIFECYCLE_QMD_TIMEOUT (2802 s); test_qmd_sidecar_time_budget.py
      # checks it.
      timeout-minutes: 55
      env:
        OSPREY_QMD_IMAGE: osprey-qmd:ci
      run: uv run pytest tests/e2e/test_deploy_lifecycle.py -m qmd -v --tb=short

    - name: Build the sidecar image with the model fetches skipped
      # The air-gapped image: `OSPREY_QMD_MODELS_MOUNTED=1` skips the 2.1 GB model
      # fetch so the models arrive over a read-only mount at runtime. `cache-from`
      # only; nothing is saved.
      run: |
        set -euo pipefail
        docker buildx build \
          --build-arg OSPREY_QMD_MODELS_MOUNTED=1 \
          --tag osprey-qmd:ci-mounted \
          --load \
          --cache-from type=local,src=/tmp/qmd-buildx-cache \
          src/osprey/templates/services/qmd

    - name: Run the mounted-models E2E
      # Named by path. The module skips in the step above; the variable below,
      # set here alone, says the mounted image exists.
      timeout-minutes: 10
      env:
        OSPREY_QMD_MOUNTED_IMAGE: osprey-qmd:ci-mounted
      run: uv run pytest tests/integration/test_qmd_models_mount.py -v --tb=short

    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: qmd-sidecar-e2e
        engine: docker

    # Belt and suspenders (see e2e-tests), before the image cleanup.
    - name: Clean up any stranded shared-bundle e2e resources
      if: always()
      run: |
        docker rm -f osprey-e2e-mus-p3-qmd || true
        for user in alice bob; do
          docker rm -f "osprey-e2e-mus-p3-web-${user}" || true
          docker volume rm "osprey-e2e-mus-p3_${user}-claude-config" || true
          docker volume rm "osprey-e2e-mus-p3_${user}-agent-data" || true
        done
        docker rm -f osprey-e2e-mus-p3-nginx || true
        docker rm -f osprey-e2e-mus-p3-registry || true
        docker compose -p osprey-e2e-mus-p3 down || true
        docker rm -f osprey-e2e-mus-p3-agent-record || true
        docker rm -f osprey-e2e-mus-p3-agent-record-clickhouse || true
        docker volume rm osprey-e2e-mus-p3_agent_record_clickhouse_data || true

    - name: Clean up the sidecar images
      if: always()
      run: |
        docker rmi -f osprey-qmd:ci || true
        docker rmi -f osprey-qmd:ci-mounted || true

  qmd-cache-warmup:
    name: qmd Layer Cache Warm-up (pushes to main)
    runs-on: ubuntu-latest
    # Main pushes only: a PR can restore caches from main but not from other PRs,
    # so the qmd layer cache is saved here once and only restored by PR lanes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # A hit is a lookup; a miss is one cold build plus a 2.5 GB upload.
    timeout-minutes: 45

    steps:
    - *checkout

    - name: Warm the qmd layer cache
      uses: ./.github/actions/build-qmd-image
      with:
        warm: "true"

  target-switch-e2e:
    name: Control-Target Switch E2E (virtual accelerator + bench IOC, two live CA servers)
    runs-on: ubuntu-latest
    # Same-repo only, no secrets: both targets are local CA servers. The
    # agent-driven half is target-switch-agentic-e2e.
    needs: changes
    if: *same-repo-pr-or-secret-revalidation
    # Two cold image builds plus the three modules (figures in workflow.rst,
    # "Measured CI Figures"). Tighter than its neighbours: no stack is deployed.
    timeout-minutes: 30

    steps:
    - *checkout-full-history

    - *install-uv

    - *python-3-11

    - *install-osprey

    - *assert-container-runtime

    - &build-va-image
      name: Build the virtual accelerator image
      uses: ./.github/actions/build-virtual-accelerator-image

    - name: Build the bench IOC image
      # After the VA image: it reuses that action's Buildx builder.
      uses: ./.github/actions/build-bench-ioc-image

    - name: Run the control-target switch E2E
      # Half the job cap; the realistic hang is an unserved channel read, which
      # the connector abandons after 120 s.
      timeout-minutes: 15
      env:
        # Without it every test in tests/va/e2e/ skips by design; the zero-skip gate
        # below turns a lost flag into a red lane.
        OSPREY_VA_E2E_ENABLE: "1"
      # Named by path; each module also asserts its own MIN_COLLECTED_TESTS floor.
      run: |
        uv run pytest tests/va/e2e/test_target_switch.py tests/va/e2e/test_bench_ioc_live.py \
          tests/va/e2e/test_live_standin.py tests/va/e2e/test_per_target_posture.py tests/va/e2e/test_model_status_va.py \
          tests/va/e2e/test_ca_loop_exit.py \
          -v --tb=short --junitxml=junit-target-switch-e2e.xml

    - name: Fail the lane on any skipped test
      run: |
        # Same gate, same argument as scan-agentic-e2e: every way this lane can
        # skip is a CI misconfiguration rather than a legitimate environment
        # gap, and pytest's exit code cannot express the difference. The live
        # one here is `OSPREY_VA_E2E_ENABLE`: unset, every module collects
        # cleanly and skips in full, and the job goes green having built two
        # images and measured nothing. The other is the Bluesky lane scenario,
        # which skips when the queueserver client stack is not importable —
        # it is a core dependency, so a skip there means the install step
        # produced something narrower than `uv sync --extra dev` promises.
        uv run python - <<'PY'
        import sys
        import xml.etree.ElementTree as ET

        report = "junit-target-switch-e2e.xml"
        total = skipped = 0
        for suite in ET.parse(report).getroot().iter("testsuite"):
            total += int(suite.get("tests", 0))
            skipped += int(suite.get("skipped", 0))
        print(f"{report}: {total} test(s), {skipped} skipped")
        failed = False
        if total == 0:
            print(f"::error::{report} collected no tests")
            failed = True
        if skipped:
            print(f"::error::{report} reports {skipped} skipped test(s)")
            failed = True
        if failed:
            sys.exit(1)
        print("✅ every control-target switch test ran; none skipped")
        PY
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: target-switch-e2e
        engine: docker

    - name: Clean up the target images
      # The action removes osprey-va-full:latest; bench-ioc:latest is named here.
      # Containers carry per-run names and are removed by their own teardown.
      if: always()
      uses: ./.github/actions/remove-virtual-accelerator-images
      with:
        extra-tags: bench-ioc:latest

  target-switch-agentic-e2e:
    name: Control-Target Switch Agentic E2E (a real agent moving between the virtual accelerator and the bench IOC)
    runs-on: ubuntu-latest
    # Its own lane because the module is `requires_als_apg` in full and `if:` is
    # the only granularity for that. Model-spending lane, gated as
    # scan-agentic-e2e.
    needs: changes
    if: *full-ci-pr-or-secret-revalidation
    # Two cold builds plus the module, flaky-rerun headroom (two scenarios carry
    # reruns=2) and one attempt of S4's 900 s timeout (a timeout is not an
    # AssertionError, so it is not rerun). Not the pathological sum, as
    # scan-agentic-e2e.
    timeout-minutes: 45

    steps:
    - *free-runner-disk

    - *checkout-full-history

    - *install-uv

    - *python-3-11

    - *install-osprey

    - *llm-preflight-probe

    - *assert-container-runtime

    - *build-va-image

    - name: Build the bench IOC image
      # After the VA image: it reuses that action's Buildx builder.
      uses: ./.github/actions/build-bench-ioc-image

    - *install-pinned-cli

    - name: Run the control-target switch agentic E2E
      # Leaves the builds and CLI setup the remaining 10 minutes.
      timeout-minutes: 35
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
        # Arms the agent-transcript dump, as in scan-agentic-e2e.
        OSPREY_CI_DIAG_DIR: ci-diag
      # No OSPREY_VA_E2E_ENABLE: this module has its own gates. Named by path.
      run: |
        uv run pytest tests/e2e/test_target_switch_agentic.py -v --tb=short \
          --junitxml=junit-target-switch-agentic-e2e.xml

    - name: Fail the lane on any skipped test
      run: |
        # Same gate, same argument as scan-agentic-e2e: every way this lane can
        # skip is a CI misconfiguration rather than a legitimate environment
        # gap — no SDK, no `claude` CLI, no docker, no provider key — and each
        # turns the job into a green check over a lane that built two images,
        # deployed nothing and measured nothing. pytest's exit code cannot
        # express the difference.
        #
        # The `claude` CLI case is the live one, not a hypothetical: a fresh
        # runner has no `claude` on PATH until the lane installs the pinned
        # one, so this module's `is_claude_code_available()` skipif can fire —
        # and because that skipif is module-wide here, it takes all ten tests
        # with it.
        #
        # Safe alongside two scenarios' `flaky(reruns=2)`: pytest-rerunfailures
        # does not record rerun attempts as testcases, so an absorbed sampling
        # flake leaves the skipped count at zero.
        uv run python - <<'PY'
        import sys
        import xml.etree.ElementTree as ET

        report = "junit-target-switch-agentic-e2e.xml"
        total = skipped = 0
        for suite in ET.parse(report).getroot().iter("testsuite"):
            total += int(suite.get("tests", 0))
            skipped += int(suite.get("skipped", 0))
        print(f"{report}: {total} test(s), {skipped} skipped")
        failed = False
        if total == 0:
            print(f"::error::{report} collected no tests")
            failed = True
        if skipped:
            print(f"::error::{report} reports {skipped} skipped test(s)")
            failed = True
        if failed:
            sys.exit(1)
        print("✅ every control-target switch agentic test ran; none skipped")
        PY
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: target-switch-agentic-e2e
        engine: docker

    - name: Clean up the target images
      # As in target-switch-e2e.
      if: always()
      uses: ./.github/actions/remove-virtual-accelerator-images
      with:
        extra-tags: bench-ioc:latest

  va-live-e2e:
    name: Live Virtual Accelerator E2E (${{ matrix.group }}; every suite the switch lane does not run)
    runs-on: ubuntu-latest
    # Same-repo only, no credentials: every assertion reads back from a container
    # this job built.
    needs: changes
    if: *same-repo-pr-or-secret-revalidation
    # Serially these suites took 22-24 min (4 build + 18 pytest), so they are split
    # into three cells balanced by measured module times (~6-7 min of pytest
    # each, ~11-12 min per green cell). Boot bounds per module are in each module
    # (CONTAINER_BOOT_TIMEOUT_S, BOOT_TIMEOUT_S).
    timeout-minutes: 40
    # Every suite in exactly one cell (the wiring test reads `suites`). Modules
    # sharing the session container stay in one process, in order.
    strategy:
      fail-fast: false
      matrix:
        include:
        - group: session-container
          suites: >-
            tests/va/e2e/test_approval_smoke.py tests/va/e2e/test_limits_enforcement.py
            tests/va/e2e/test_orbit_response.py tests/va/e2e/test_full_sweep.py
            tests/va/e2e/test_finder_live_reads.py tests/va/e2e/test_scenario_reload.py
            tests/va/e2e/test_sim_apply_va.py
            tests/va/e2e/test_va_put_surface.py tests/va/e2e/test_planted_journal.py
            tests/va/e2e/test_substrate_parity.py tests/va/e2e/test_chain_boot.py
          als_lane: false
        - group: measurements
          suites: >-
            tests/va/e2e/test_pyaml_measure_guarded.py tests/va/e2e/test_check_b_served.py
          als_lane: false
        - group: facility-trees
          suites: >-
            tests/va/e2e/test_mml_trees_boot.py
          als_lane: true

    steps:
    - *checkout-full-history

    - *install-uv

    - *python-3-11

    - *install-osprey

    - *assert-container-runtime

    - *build-va-image

    - name: Run the live virtual accelerator E2E
      # About 3x a green run; bounds the unserved-channel read hang (120 s).
      timeout-minutes: 20
      env:
        # See target-switch-e2e.
        OSPREY_VA_E2E_ENABLE: "1"
      # One process per cell, no xdist: the conftest keeps ONE session container per
      # process. Named by path, cheapest first; MIN_COLLECTED_TESTS floors apply.
      run: |
        uv run pytest ${{ matrix.suites }} \
          -v --tb=short --junitxml=junit-va-live-e2e.xml

    - name: Run the real-facility lane on the NSLS-II stand-in
      # A step of its own (the step above runs the tests/va/e2e partition); skips
      # without the variable, so it goes through the zero-skip gate. Only the
      # facility-trees cell (`als_lane`) runs it.
      if: matrix.als_lane
      timeout-minutes: 10
      env:
        OSPREY_ALS_LANE_STAND_IN: tests/fixtures/mml/nsls2
      run: |
        uv run pytest tests/cli/test_als_lane.py -v --tb=short --junitxml=junit-als-lane.xml

    - name: Fail the lane on any skipped test
      env:
        ALS_LANE: ${{ matrix.als_lane }}
      run: |
        # The gate reads the reports rather than pytest's exit codes because an
        # exit code cannot express the difference: a run that skipped every
        # test it collected exits 0. Each step skips one way: the tests/va/e2e
        # modules without `OSPREY_VA_E2E_ENABLE`, and the real-facility lane without
        # `OSPREY_ALS_LANE_STAND_IN`. Unset, either collects cleanly and skips,
        # and the job goes green having built an image and measured nothing.
        # One report per step, each named here; the real-facility lane's only
        # in the cell that runs it, read from the matrix rather than from
        # whether the file exists, so a cell that should have run it and did
        # not reds here.
        uv run python - <<'PY'
        import os
        import sys
        import xml.etree.ElementTree as ET

        reports = ["junit-va-live-e2e.xml"]
        if os.environ["ALS_LANE"] == "true":
            reports.append("junit-als-lane.xml")
        failed = False
        for report in reports:
            total = skipped = 0
            for suite in ET.parse(report).getroot().iter("testsuite"):
                total += int(suite.get("tests", 0))
                skipped += int(suite.get("skipped", 0))
            print(f"{report}: {total} test(s), {skipped} skipped")
            if total == 0:
                print(f"::error::{report} collected no tests")
                failed = True
            if skipped:
                print(f"::error::{report} reports {skipped} skipped test(s)")
                failed = True
        if failed:
            sys.exit(1)
        print("✅ every live virtual accelerator test ran; none skipped")
        PY
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: va-live-e2e-${{ matrix.group }}
        engine: docker

    - name: Clean up the target images
      # One image, so the action's own tag is the whole list.
      if: always()
      uses: ./.github/actions/remove-virtual-accelerator-images

  va-bluesky-deploy-e2e:
    name: Virtual Accelerator Plan Deploy E2E (two plan lanes, one per control target, full Docker stack)
    runs-on: ubuntu-latest
    # Same-repo only, no secrets (the .env is seeded from .env.example).
    needs: changes
    if: *same-repo-pr-or-secret-revalidation
    # Sized like bluesky-deploy-e2e (same init/build/up/down surface).
    timeout-minutes: 60

    steps:
    - *checkout-full-history

    - *install-uv

    - *python-3-11

    - *setup-compose

    - *install-osprey

    - *assert-container-runtime

    - *build-va-image

    - name: Run the two-lane plan deployment E2E
      # 55 as the single-lane deployment lane; the image build gets the rest.
      timeout-minutes: 55
      env:
        # See target-switch-e2e.
        OSPREY_VA_E2E_ENABLE: "1"
      # Named by path; MIN_COLLECTED_TESTS floor applies.
      run: |
        uv run pytest tests/va/e2e/test_bluesky_lanes.py \
          -v --tb=short --junitxml=junit-va-bluesky-deploy-e2e.xml

    - name: Fail the lane on any skipped test
      run: |
        # The gate reads the report rather than pytest's exit code because the
        # exit code cannot express the difference: a run that skipped every
        # test it collected exits 0. Three ways this module skips, each a CI
        # misconfiguration rather than a legitimate environment gap:
        # `OSPREY_VA_E2E_ENABLE` unset, which greens the lane having built an
        # image and measured nothing; `docker` absent from PATH, which the
        # assert step above should already have caught; and
        # `osprey-va-full:latest` not present, which means the build step
        # produced nothing under the tag the fixtures name.
        uv run python - <<'PY'
        import sys
        import xml.etree.ElementTree as ET

        report = "junit-va-bluesky-deploy-e2e.xml"
        total = skipped = 0
        for suite in ET.parse(report).getroot().iter("testsuite"):
            total += int(suite.get("tests", 0))
            skipped += int(suite.get("skipped", 0))
        print(f"{report}: {total} test(s), {skipped} skipped")
        failed = False
        if total == 0:
            print(f"::error::{report} collected no tests")
            failed = True
        if skipped:
            print(f"::error::{report} reports {skipped} skipped test(s)")
            failed = True
        if failed:
            sys.exit(1)
        print("✅ every plan deployment test ran; none skipped")
        PY
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: va-bluesky-deploy-e2e
        engine: docker
    # Belt and suspenders: see e2e-tests.
    - name: Clean up any stranded stack resources
      if: always()
      run: |
        docker compose -p lane-e2e down || true
        docker rm -f lane-e2e-agent-record || true
        docker rm -f lane-e2e-agent-record-clickhouse || true
        docker volume ls -q --filter "name=^lane-e2e_" \
          | xargs -r docker volume rm -f || true

    - name: Clean up the target images
      # Only the image: `osprey down` in the module owns the containers.
      if: always()
      uses: ./.github/actions/remove-virtual-accelerator-images

  # The CANOPY contract, against CANOPY and PyDMConverter at the commits the
  # package pins (PROVEN_COMMITS; no commit is written here).
  #   * No job-level `if:`: it decides inside, so it ends success or failure,
  #     never skipped, and the gate reads it as always-on.
  #   * Same-repo changes into an integration base always run it and fail
  #     closed without the read credential; fork PRs skip with a summary line
  #     (a maintainer dispatches it on the fork's branch).
  #   * The credential never shares a step with code the change controls, and
  #     nothing the job builds reaches the shared Actions cache.
  canopy-contract:
    name: CANOPY contract
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        # Later steps run the change's code: leave no token in the git config.
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: false

    - name: Decide whether the change needs the contract
      id: decide
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_REF: ${{ github.base_ref }}
        REF_NAME: ${{ github.ref_name }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        case "$EVENT_NAME" in
          pull_request) base="$BASE_REF" ;;
          push) base="$REF_NAME" ;;
          *) base="" ;;
        esac
        run=true
        reason=""
        case "$base" in
          ""|main|epic/*) ;;
          *) run=false; reason="$base is not an integration base" ;;
        esac
        if [[ "$run" == "true" && "$EVENT_NAME" == "pull_request" && "$HEAD_REPO" != "$REPO" ]]; then
          run=false
          reason="a pull request from a fork has no CANOPY read credential; a maintainer runs the contract through a workflow dispatch"
        fi
        echo "run=$run" >> "$GITHUB_OUTPUT"
        if [[ "$run" == "false" ]]; then
          echo "CANOPY contract not run: $reason" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Require the CANOPY read credential
      id: credential
      if: steps.decide.outputs.run == 'true'
      env:
        TOKEN: ${{ secrets.CANOPY_READ_TOKEN }}
        BRANCH: ${{ github.head_ref || github.ref_name }}
      run: |
        if [[ -z "$TOKEN" ]]; then
          echo "::error::this change needs the CANOPY contract, which needs the CANOPY read credential: a maintainer re-runs it with gh workflow run ci.yml --ref $BRANCH"
          exit 1
        fi

    - name: Read the proven commits from the package
      id: pin
      if: steps.decide.outputs.run == 'true'
      # Each value reaches `git fetch` beside the credential: 40-hex only.
      run: |
        python3 src/osprey/integrations/canopy/proven.py --pins > pins
        canopy="$(sed -n 's/^canopy=//p' pins)"
        pydm="$(sed -n 's/^PyDMConverter=//p' pins)"
        for value in "$canopy" "$pydm"; do
          if [[ ! "$value" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::proven.py --pins names a value that is not a 40-hex commit: $value"
            exit 1
          fi
        done
        {
          echo "canopy=$canopy"
          echo "pydm=$pydm"
        } >> "$GITHUB_OUTPUT"

    - name: Fetch CANOPY and PyDMConverter at the proven commits
      id: fetch
      if: steps.decide.outputs.run == 'true'
      env:
        TOKEN: ${{ secrets.CANOPY_READ_TOKEN }}
        CANOPY_REPOSITORY: ${{ vars.CANOPY_REPOSITORY }}
        PYDMCONVERTER_REPOSITORY: ${{ vars.PYDMCONVERTER_REPOSITORY }}
        CANOPY_COMMIT: ${{ steps.pin.outputs.canopy }}
        PYDM_COMMIT: ${{ steps.pin.outputs.pydm }}
        SOURCES: ${{ runner.temp }}/canopy-sources
      # The only step with the credential, running git alone, via an askpass helper
      # that holds no secret; git config is never written.
      run: |
        set -euo pipefail
        askpass="$RUNNER_TEMP/canopy-askpass"
        # The helper answers git from this step's environment, which no
        # other step shares.
        # The single quotes are the point: $1 and ${TOKEN} expand when git
        # runs the written helper, not here.
        # shellcheck disable=SC2016
        printf '%s\n' '#!/bin/sh' 'case "$1" in Username*) echo x-access-token ;; *) printf "%s\n" "${TOKEN}" ;; esac' > "$askpass"
        chmod 700 "$askpass"
        fetch_at() {
          # $1 = clone directory, $2 = owner/name, $3 = commit
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git clone --quiet "https://github.com/$2" "$1"
          if ! git -C "$1" cat-file -e "$3^{commit}" 2>/dev/null; then
            GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git -C "$1" fetch --quiet origin "$3"
          fi
          git -C "$1" checkout --quiet --detach "$3"
          # The install asks the clone for the commit by its id.
          git -C "$1" config uploadpack.allowAnySHA1InWant true
        }
        fetch_at "$SOURCES/canopy" "$CANOPY_REPOSITORY" "$CANOPY_COMMIT"
        fetch_at "$SOURCES/pydmconverter" "$PYDMCONVERTER_REPOSITORY" "$PYDM_COMMIT"
        {
          echo "canopy=$SOURCES/canopy"
          echo "pydm=$SOURCES/pydmconverter"
        } >> "$GITHUB_OUTPUT"

    - name: Install CANOPY and PyDMConverter at the proven commits
      id: install
      if: steps.decide.outputs.run == 'true'
      env:
        CANOPY_CLONE: ${{ steps.fetch.outputs.canopy }}
        PYDM_CLONE: ${{ steps.fetch.outputs.pydm }}
        CANOPY_COMMIT: ${{ steps.pin.outputs.canopy }}
        PYDM_COMMIT: ${{ steps.pin.outputs.pydm }}
      # No secret here. `git+file://` so the distribution records its commit, which
      # the contract reads.
      run: |
        set -euo pipefail
        if git config --global --get-regexp '^url\..*\.insteadof$' > /dev/null; then
          echo "::error::a git URL rewrite is still configured; refusing to run the build beside it"
          exit 1
        fi
        uv sync --locked --extra dev
        # The contract runs against the versions uv.lock holds, like every
        # other lane: the lock's own install set (the synced extra, workspace
        # members left out) constrains the install, so CANOPY adds the
        # distributions the lock does not hold and moves none it does. A
        # requirement of the pair that excludes a locked version fails here,
        # as it fails the project image's constrained install.
        uv export --frozen --no-hashes --no-emit-workspace --extra dev \
          > "$RUNNER_TEMP/lock-constraints.txt"
        # CANOPY names a source of its own for PyDMConverter. The override
        # makes the local clone the one source, so the resolver sees a single
        # URL for it and the install reaches no remote.
        pydm="PyDMConverter @ git+file://${PYDM_CLONE}@${PYDM_COMMIT}"
        printf '%s\n' "$pydm" > "$RUNNER_TEMP/canopy-overrides.txt"
        uv pip install -c "$RUNNER_TEMP/lock-constraints.txt" \
          --override "$RUNNER_TEMP/canopy-overrides.txt" \
          "canopy[mcp,convert] @ git+file://${CANOPY_CLONE}@${CANOPY_COMMIT}" \
          "PyDMConverter @ git+file://${PYDM_CLONE}@${PYDM_COMMIT}"

    - name: Run the CANOPY contract
      id: contract
      if: steps.decide.outputs.run == 'true'
      run: |
        set -o pipefail
        python3 scripts/check.py run canopy-contract 2>&1 | tee canopy-contract.log

    - name: Name the proven commits
      id: summary
      if: always() && (steps.contract.outcome == 'success' || steps.contract.outcome == 'failure')
      run: |
        grep '^check: ' canopy-contract.log | tail -n 1 >> "$GITHUB_STEP_SUMMARY"

  all-checks-passed:
    name: All CI Checks Passed
    needs: [changes, test, serial-suites, dependency-floor, connectors-standalone, connectors-compat-plan, connectors-compat, framework-at-connectors-floor, optimizer, lint, docs, package, static-checks, visual-theming, visual-theming-agent, frontend-js, build-boot-smoke, e2e-tests, e2e-no-model, agent-record-e2e, deploy-e2e, dispatch-deploy-e2e, single-user-narrowing-e2e, host-record-e2e, dispatch-overlay-e2e, bluesky-deploy-e2e, optimizer-deploy-e2e, bluesky-web-deploy-e2e, va-substrate-equivalence-e2e, orm-roundtrip-e2e, bluesky-queue-e2e, scan-agentic-e2e, archiver-world-e2e, graph-reseed-e2e, tiled-roundtrip-e2e, bluesky-catalog-e2e, bluesky-sandbox-escape-e2e, nextcloud-talk-bridge-e2e, gchat-bridge-e2e, teams-bridge-e2e, slack-bridge-e2e, dockerfile-e2e, privilege-split-e2e, execution-environment-parity-e2e, agentic-per-preset, deploy-writeback-e2e, multi-user-deploy-lifecycle-e2e, multi-user-deploy-lifecycle-e2e-podman, auth-perimeter-e2e, terminal-auth-multiuser-e2e, full-chain-auth-e2e, two-shape-boot-e2e, qmd-cache-warmup, qmd-sidecar-e2e, jupyter-panel-e2e, target-switch-e2e, target-switch-agentic-e2e, va-live-e2e, va-bluesky-deploy-e2e, plugin-smoke, canopy-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Not on cancel: a superseded run must not leave a red gate on the same sha.
    # Add `full-ci` before pushing; labelling right after a push cancels that run.
    if: ${{ !cancelled() }}

    steps:
    - name: Check all jobs status
      # Both shapes BLOCK: always-on jobs must be "success"; pull-request-scoped
      # lanes (check_pr_lane) may be "skipped", except on a revalidation dispatch,
      # where every lane must run. Dependabot and unlabelled PRs pass with a note
      # in the run summary. actor/head_ref go through `env:`, never `${{ }}` in
      # `run:` (script injection).
      env:
        ACTOR: ${{ github.actor }}
        HEAD_BRANCH: ${{ github.head_ref }}
        EVENT_NAME: ${{ github.event_name }}
        REVALIDATE: ${{ inputs.revalidate_secret_lanes }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HAS_FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
      run: |
        # The classifier must succeed: every pull-request-scoped lane needs it,
        # so a failed `changes` job skips them all, and check_pr_lane below
        # reads a skip as a pass.
        if [[ "${{ needs.changes.result }}" != "success" ]]; then
          echo "❌ Changed-path classifier failed; the e2e lanes that need it did not run"
          exit 1
        fi
        if [[ "${{ needs.test.result }}" != "success" ]]; then
          echo "❌ Tests failed"
          exit 1
        fi
        if [[ "${{ needs.serial-suites.result }}" != "success" ]]; then
          echo "❌ Serial suites failed (pty, wall-clock budgets or live Channel Access)"
          exit 1
        fi
        if [[ "${{ needs.dependency-floor.result }}" != "success" ]]; then
          echo "❌ Archiver suite failed at the declared dependency floor"
          exit 1
        fi
        if [[ "${{ needs.optimizer.result }}" != "success" ]]; then
          echo "❌ Optimizer suite failed"
          exit 1
        fi
        if [[ "${{ needs.connectors-standalone.result }}" != "success" ]]; then
          echo "❌ Connectors suite failed without the framework installed"
          exit 1
        fi
        if [[ "${{ needs.connectors-compat-plan.result }}" != "success" ]]; then
          echo "❌ Connectors compatibility plan failed (supported releases or connectors floor)"
          exit 1
        fi
        if [[ "${{ needs.connectors-compat.result }}" != "success" ]]; then
          echo "❌ Connectors HEAD broke a supported framework release"
          exit 1
        fi
        if [[ "${{ needs.framework-at-connectors-floor.result }}" != "success" ]]; then
          echo "❌ Framework HEAD failed at its declared connectors floor"
          exit 1
        fi
        if [[ "${{ needs.lint.result }}" != "success" ]]; then
          # Also covers the Tier 0 config-key resurrection guard, folded into
          # that job.
          echo "❌ Lint checks or the config-key resurrection guard failed"
          exit 1
        fi
        if [[ "${{ needs.docs.result }}" != "success" ]]; then
          echo "❌ Documentation build failed"
          exit 1
        fi
        if [[ "${{ needs.package.result }}" != "success" ]]; then
          # Also covers the lean connectors wheel, folded into that job.
          echo "❌ Package build or the lean connectors wheel check failed"
          exit 1
        fi
        if [[ "${{ needs.static-checks.result }}" != "success" ]]; then
          echo "❌ Tier 0 static checks failed"
          exit 1
        fi
        if [[ "${{ needs.plugin-smoke.result }}" != "success" ]]; then
          echo "❌ Plugin marketplace smoke failed (the osprey plugin no longer installs)"
          exit 1
        fi
        if [[ "${{ needs.visual-theming.result }}" != "success" ]]; then
          echo "❌ Behavioral theming suite failed"
          exit 1
        fi
        if [[ "${{ needs.visual-theming-agent.result }}" != "success" ]]; then
          echo "❌ Watchdog browser / visual regression suite failed"
          exit 1
        fi
        if [[ "${{ needs.frontend-js.result }}" != "success" ]]; then
          echo "❌ Frontend JS (typecheck + vitest) failed"
          exit 1
        fi
        if [[ "${{ needs.build-boot-smoke.result }}" != "success" ]]; then
          echo "❌ Tier 1 build + boot smoke failed"
          exit 1
        fi
        if [[ "${{ needs.canopy-contract.result }}" != "success" ]]; then
          # The lane reports success itself when the change does not need
          # the contract, so a skip is never a pass here.
          echo "❌ CANOPY contract failed"
          exit 1
        fi
        check_pr_lane() {
          # $1 = human-readable lane name, $2 = needs.<job>.result
          if [[ "$2" == "skipped" && "$EVENT_NAME" == "workflow_dispatch" && "$REVALIDATE" == "true" ]]; then
            echo "❌ $1 skipped on a revalidation run, which must run every lane"
            exit 1
          elif [[ "$2" == "skipped" ]]; then
            echo "⏭️  $1 skipped (lane's if: condition not met on this event)"
          elif [[ "$2" != "success" ]]; then
            echo "❌ $1 failed (result: $2)"
            exit 1
          else
            echo "✅ $1 passed"
          fi
        }
        check_pr_lane "Agentic per-preset"           "${{ needs.agentic-per-preset.result }}"
        check_pr_lane "E2E tests"                    "${{ needs.e2e-tests.result }}"
        check_pr_lane "Model-free E2E"               "${{ needs.e2e-no-model.result }}"
        check_pr_lane "Agent record E2E"             "${{ needs.agent-record-e2e.result }}"
        check_pr_lane "Deploy E2E"                   "${{ needs.deploy-e2e.result }}"
        check_pr_lane "Dispatch deploy E2E"          "${{ needs.dispatch-deploy-e2e.result }}"
        check_pr_lane "Single-user narrowing E2E"    "${{ needs.single-user-narrowing-e2e.result }}"
        check_pr_lane "Host record E2E"              "${{ needs.host-record-e2e.result }}"
        check_pr_lane "Dispatch overlay E2E"         "${{ needs.dispatch-overlay-e2e.result }}"
        check_pr_lane "Bluesky deploy E2E"           "${{ needs.bluesky-deploy-e2e.result }}"
        check_pr_lane "Optimizer deploy E2E"         "${{ needs.optimizer-deploy-e2e.result }}"
        check_pr_lane "Bluesky web deploy E2E"    "${{ needs.bluesky-web-deploy-e2e.result }}"
        check_pr_lane "VA substrate equivalence E2E" "${{ needs.va-substrate-equivalence-e2e.result }}"
        check_pr_lane "ORM + Grid roundtrip E2E"     "${{ needs.orm-roundtrip-e2e.result }}"
        check_pr_lane "Bluesky queue E2E"            "${{ needs.bluesky-queue-e2e.result }}"
        check_pr_lane "Scan stack agentic E2E"       "${{ needs.scan-agentic-e2e.result }}"
        check_pr_lane "Archiver world E2E"           "${{ needs.archiver-world-e2e.result }}"
        check_pr_lane "Graph reseed stamp E2E"       "${{ needs.graph-reseed-e2e.result }}"
        check_pr_lane "Tiled roundtrip E2E"          "${{ needs.tiled-roundtrip-e2e.result }}"
        check_pr_lane "Bluesky catalog E2E"          "${{ needs.bluesky-catalog-e2e.result }}"
        check_pr_lane "Bluesky sandbox escape E2E"   "${{ needs.bluesky-sandbox-escape-e2e.result }}"
        check_pr_lane "Nextcloud Talk bridge E2E"    "${{ needs.nextcloud-talk-bridge-e2e.result }}"
        check_pr_lane "Google Chat bridge E2E"       "${{ needs.gchat-bridge-e2e.result }}"
        check_pr_lane "Microsoft Teams bridge E2E"   "${{ needs.teams-bridge-e2e.result }}"
        check_pr_lane "Slack bridge E2E"             "${{ needs.slack-bridge-e2e.result }}"
        check_pr_lane "Dockerfile E2E"               "${{ needs.dockerfile-e2e.result }}"
        check_pr_lane "Privilege split E2E"          "${{ needs.privilege-split-e2e.result }}"
        check_pr_lane "Execution env parity E2E"     "${{ needs.execution-environment-parity-e2e.result }}"
        check_pr_lane "Deploy write-back E2E"         "${{ needs.deploy-writeback-e2e.result }}"
        check_pr_lane "Multi-user lifecycle E2E (docker)" "${{ needs.multi-user-deploy-lifecycle-e2e.result }}"
        check_pr_lane "Multi-user lifecycle E2E (podman)" "${{ needs.multi-user-deploy-lifecycle-e2e-podman.result }}"
        check_pr_lane "Auth perimeter E2E"           "${{ needs.auth-perimeter-e2e.result }}"
        check_pr_lane "Terminal auth multi-user E2E" "${{ needs.terminal-auth-multiuser-e2e.result }}"
        check_pr_lane "Full-chain auth E2E"        "${{ needs.full-chain-auth-e2e.result }}"
        check_pr_lane "Two-shape boot E2E (podman-compose)" "${{ needs.two-shape-boot-e2e.result }}"
        check_pr_lane "qmd layer cache warm-up"      "${{ needs.qmd-cache-warmup.result }}"
        check_pr_lane "qmd sidecar E2E"              "${{ needs.qmd-sidecar-e2e.result }}"
        check_pr_lane "Notebook panel E2E"           "${{ needs.jupyter-panel-e2e.result }}"
        check_pr_lane "Control-target switch E2E"    "${{ needs.target-switch-e2e.result }}"
        check_pr_lane "Control-target switch agentic E2E" "${{ needs.target-switch-agentic-e2e.result }}"
        check_pr_lane "Live virtual accelerator E2E" "${{ needs.va-live-e2e.result }}"
        check_pr_lane "VA plan deploy E2E"           "${{ needs.va-bluesky-deploy-e2e.result }}"
        echo "✅ All CI checks passed!"

        # A green gate on a Dependabot PR is green-with-a-gap, and the gap is
        # invisible unless it is named. Dependabot runs get no Actions secrets,
        # so every API-key lane skipped above rather than ran. Say so where a
        # reviewer will actually see it — the run summary, not buried in a log.
        # `-n "$GITHUB_STEP_SUMMARY"` is not defensive noise: `run:` executes
        # under `bash -e`, so an unset summary path would make `>> ""` fail and
        # take the whole gate down with it. This block is advisory — it must
        # never be able to turn a passing gate red.
        if [ "$ACTOR" = "dependabot[bot]" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          {
            echo "### ⚠️ Secret-dependent lanes did not run"
            echo
            echo "Dependabot pull requests are treated as fork runs and receive only the"
            echo "Dependabot secret store, so \`ALS_APG_API_KEY\` is unavailable and these"
            echo "lanes skipped rather than executed:"
            echo
            echo "- Deploy E2E Test (build + deploy pipeline)"
            echo "- Tier 3 — Agentic flow"
            echo "- E2E Tests"
            echo "- Dispatch Deploy E2E / Dispatch Overlay E2E"
            echo "- Single-User Narrowing E2E"
            echo "- Host Record E2E"
            echo "- Nextcloud Talk Bridge E2E / Google Chat Bridge E2E"
            echo "- Scan Stack Agentic E2E"
            echo "- Control-Target Switch Agentic E2E"
            echo
            echo "**This gate cannot vouch for them.** After reviewing the dependency diff,"
            echo "revalidate the branch as a maintainer (that run does get the secrets):"
            echo
            echo '```'
            echo "gh workflow run ci.yml --ref $HEAD_BRANCH -f revalidate_secret_lanes=true"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "⚠️  Secret-dependent lanes skipped (Dependabot run) — see run summary."
        fi

        # The same shape for the everyday case: a same-repo PR without the
        # `full-ci` label. Its model-spending lanes skipped by design (the
        # workflow-level note), and a labeled PR or a maintainer's dispatch is
        # where they run — say so, and print the one command that runs them
        # here instead.
        # Advisory like the block above; it can never turn a passing gate red.
        if [ "$EVENT_NAME" = "pull_request" ] && [ "$ACTOR" != "dependabot[bot]" ] \
           && [ "$HAS_FULL_CI" != "true" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          {
            echo "### ℹ️ Model-spending lanes did not run (no \`full-ci\` label)"
            echo
            echo "These lanes drive real agent sessions and run only when asked for, not on"
            echo "every pull request push. They skipped here:"
            echo
            echo "- Tier 3 — Agentic flow"
            echo "- E2E Tests"
            echo "- Dispatch Deploy E2E / Dispatch Overlay E2E"
            echo "- Single-User Narrowing E2E"
            echo "- Host Record E2E"
            echo "- Nextcloud Talk Bridge E2E / Google Chat Bridge E2E"
            echo "- Scan Stack Agentic E2E"
            echo "- Control-Target Switch Agentic E2E"
            echo
            echo "If this change touches what they cover, run them on this PR:"
            echo
            echo '```'
            echo "gh pr edit $PR_NUMBER --add-label full-ci"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "ℹ️  Model-spending lanes skipped (no full-ci label) — see run summary."
        fi

        # A docs-only pull request (the `changes` job) skipped every
        # pull-request-scoped lane. Say so, so a green check is not read as
        # e2e coverage. Advisory: it can never turn a passing gate red.
        if [ "$DOCS_ONLY" = "true" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          {
            echo "### ℹ️ Docs-only pull request: e2e and deploy lanes did not run"
            echo
            echo "Every changed path is under \`docs/\`, \`changelog.d/\` or \`tests/docs/\`"
            echo "(scripts/ci/docs_only.py), so the pull-request-scoped lanes stood down."
            echo "The always-on lanes, the docs build and the tests that read docs/ ran."
            echo "To run every lane anyway:"
            echo
            echo '```'
            echo "gh pr edit $PR_NUMBER --add-label full-ci"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "ℹ️  Docs-only pull request: e2e lanes skipped — see run summary."
        fi
