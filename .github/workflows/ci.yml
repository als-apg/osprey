            --ignore=tests/e2e/fixtures/test_slack_fixture_smoke.py \
            --ignore=tests/e2e/web_terminals/test_auth_perimeter.py \
            --ignore=tests/e2e/web_terminals/test_terminal_auth_multiuser_e2e.py \
            --ignore=tests/e2e/test_full_chain_auth.py \
            --ignore=tests/e2e/test_jupyter_panel_lifecycle.py \
            --ignore=tests/e2e/claude_code/test_channel_finder_mcp_benchmarks.py \
            --ignore=tests/e2e/test_agent_record_e2e.py \
            --ignore=tests/e2e/test_host_record_e2e.py \
            --ignore=tests/e2e/test_scripted_model.py \
            --ignore=tests/e2e/claude_code/test_safety_gates_scripted.py \
            --ignore=tests/e2e/test_dispatch_deploy_render.py \
            --ignore=tests/e2e/web_terminals/test_scaffold_render_roundtrip.py \
            --ignore=tests/e2e/web_terminals/test_skills_overlay_discovery.py \
            --ignore=tests/e2e/web_terminals/test_loopback_chokepoint.py \
            --ignore=tests/e2e/web_terminals/test_session_restart_e2e.py \
            --ignore=tests/e2e/web_terminals/test_terminal_auth_e2e.py \
            --ignore=tests/e2e/web_terminals/test_render_permissions_scripted.py \
            --ignore=tests/e2e/claude_code/test_chat_approval_gates_scripted.py \
            --ignore=tests/e2e/claude_code/test_chat_plan_mode_scripted.py \
            --ignore=tests/e2e/claude_code/test_chat_attachment_read_scripted.py \
            --ignore=tests/e2e/test_watchdog_agent_scripted.py \
            --ignore=tests/e2e/test_watchdog_hold_scripted.py \
