    - name: Run host record E2E
      timeout-minutes: 55
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
      run: |
        uv run pytest tests/e2e/test_host_record_e2e.py -v --tb=short \
          --junitxml=junit-host-record.xml

    - name: Fail the lane on any skipped test
      run: |
        # The module's only skip paths are "no docker" and "no claude CLI",
        # and this lane exists to have both; pytest exits 0 on an all-skipped
        # run, so the junit report is read instead.
        uv run python - <<'PY'
        import sys
        import xml.etree.ElementTree as ET

        report = "junit-host-record.xml"
        total = skipped = 0
        for suite in ET.parse(report).getroot().iter("testsuite"):
            total += int(suite.get("tests", 0))
            skipped += int(suite.get("skipped", 0))
        print(f"{report}: {total} test(s), {skipped} skipped")
        if total == 0:
            print(f"::error::{report} collected no tests")
            sys.exit(1)
        if skipped:
            print(f"::error::{report} reports {skipped} skipped test(s)")
            sys.exit(1)
        print("✅ every host record test ran; none skipped")
        PY
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: host-record-e2e
        engine: docker
    # Belt and suspenders: see e2e-tests.
