  agent-record-e2e:
    name: Agent Record E2E (${{ matrix.backend }}; replays every captured fixture through the real stack)
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request')
      || (github.event_name == 'workflow_dispatch' && inputs.revalidate_secret_lanes)
    # One case per runner: cases share a per-host project name and port block. The wiring test holds the cells.
    strategy:
      fail-fast: false
      matrix:
        include:
        - backend: embedded
          case: test_embedded_record_on_hello_world
        - backend: clickhouse
          case: test_clickhouse_record_on_demo
    timeout-minutes: 135
    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - *assert-container-runtime

    - *install-pinned-cli

    - name: Run the agent record replay
      timeout-minutes: 120
      run: |
        uv run pytest \
          tests/e2e/test_agent_record_e2e.py \
          -k "${{ matrix.case }}" \
          -v --tb=short --durations=15 \
          --junitxml=junit-agent-record-e2e.xml

    - name: Fail the lane on any skipped test
      run: |
        uv run python scripts/ci/junit_no_skips.py junit-agent-record-e2e.xml \
          --message "✅ every agent record replay test ran; none skipped"
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: agent-record-e2e-${{ matrix.backend }}
        engine: docker
    - name: Clean up any stranded stack resources
      if: always()
      run: |
        scripts/ci/cleanup_stacks.sh osprey-e2e-agent-record

  benchmarks:
    name: On-Demand Benchmarks (channel-finder MCP + Tier 2 model)
    runs-on: ubuntu-latest
    # Dispatch-only: they measure the model, not the change, so all-checks-passed does not need them.
    if: github.event_name == 'workflow_dispatch' && inputs.run_benchmarks
    timeout-minutes: 60

    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - *llm-preflight-probe

    - *install-pinned-cli

    - name: Fetch the pinned neosemantics (n10s) jar for the graph benchmark lane
      # Fetched here: a failed download in the fixture would SKIP the graph paradigm.
      run: |
        set -euo pipefail
        url="$(uv run python -c 'from tests._graphdb_container import N10S_JAR_URL; print(N10S_JAR_URL)')"
        jar="${{ runner.temp }}/$(basename "$url")"
        curl -fsSL --retry 3 --retry-all-errors --max-time 300 -o "$jar" "$url"
        ls -l "$jar"
        echo "OSPREY_TEST_N10S_JAR=$jar" >> "$GITHUB_ENV"

    - name: Run channel-finder MCP benchmarks
      timeout-minutes: 30
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
      run: |
        uv run pytest tests/e2e/claude_code/test_channel_finder_mcp_benchmarks.py -v --tb=short

    - name: Run Tier 2 model benchmarks
      if: ${{ !cancelled() }}
      timeout-minutes: 30
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
      run: |
        # test_chart_value_reading.py deploys a full stack and runs on the benchmark board only.
        uv run pytest tests/e2e/tier2/ --ignore=tests/e2e/tier2/test_chart_value_reading.py \
          -v --tb=short

  deploy-e2e:
    name: Deploy E2E Test (build + deploy pipeline)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Needs ALS_APG_API_KEY: the same-repo check alone does not exclude Dependabot, which gets no secrets.
    if: >-
      (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.actor != 'dependabot[bot]')
      || (github.event_name == 'workflow_dispatch' && inputs.revalidate_secret_lanes)

    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - name: Create hello_world deployment repo
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
      run: |
        # The model is the gateway's id: the build refuses an alias such as haiku.
        uv run osprey init hello-world-test --preset hello-world \
          --set provider=als-apg --set model=claude-haiku-5-5
        cd hello-world-test
        uv run osprey build --skip-deps --skip-lifecycle
        ls -la

    - name: osprey up (hello-world)
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
      run: |
        cd hello-world-test
        uv run osprey up -d --dev

    # Before the teardown below, which deletes the containers whose logs matter.
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: deploy-e2e
        engine: docker

    - name: osprey down
      if: always()
      run: |
        cd hello-world-test
        # No `|| true`: a swallowed exit code would read a usage error as a clean teardown.
        uv run osprey down

    - name: Clean up any stranded hello-world resources
      if: always()
      run: |
        scripts/ci/cleanup_stacks.sh hello-world-test

  dispatch-stack-e2e:
    name: Dispatch Stack E2E (${{ matrix.what }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: *full-ci-pr-or-secret-revalidation
    strategy:
      fail-fast: false
      matrix:
        include:
        - lane: dispatch-deploy-e2e
          what: deploy, full Docker stack + real agent runs + multi-user web tier
          module: tests/e2e/test_dispatch_deploy.py
          project: osprey-e2e-dispatch
        - lane: single-user-narrowing-e2e
          what: single-user narrowing, owner-narrowed dispatch run
          module: tests/e2e/test_single_user_narrowing_e2e.py
          project: suproj
        - lane: dispatch-overlay-e2e
          what: overlay skill/data/trigger visibility
          module: tests/e2e/test_dispatch_overlay_visibility.py
          project: osprey-e2e-overlay

    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - *llm-preflight-probe

    - &build-qmd-image
      name: Build the qmd sidecar image
      uses: ./.github/actions/build-qmd-image

    - name: Run the dispatch stack E2E module
      timeout-minutes: 55
      env:
        OSPREY_QMD_IMAGE: osprey-qmd:ci
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
        EVENT_DISPATCHER_TOKEN: dev-token
        DISPATCH_WORKER_TOKEN: dev-token
      run: |
        uv run pytest ${{ matrix.module }} -v --tb=short
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: ${{ matrix.lane }}
        engine: docker
    - name: Clean up any stranded stack resources
      if: always()
      run: |
        scripts/ci/cleanup_stacks.sh ${{ matrix.project }}

  host-record-e2e:
    name: Host Record E2E (host sessions record without a container; the stack takes the record over)
    runs-on: ubuntu-latest
    if: *full-ci-pr-or-secret-revalidation
    timeout-minutes: 60

    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - *llm-preflight-probe

    - *install-pinned-cli

    - name: Run host record E2E
      timeout-minutes: 55
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
      run: |
        uv run pytest tests/e2e/test_host_record_e2e.py -v --tb=short \
          --junitxml=junit-host-record.xml

    - name: Fail the lane on any skipped test
      run: |
        uv run python scripts/ci/junit_no_skips.py junit-host-record.xml \
          --message "✅ every host record test ran; none skipped"
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: host-record-e2e
        engine: docker
    - name: Clean up any stranded stack resources
      if: always()
      run: |
        scripts/ci/cleanup_stacks.sh osprey-e2e-host-record

  stack-e2e:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    # Same-repo only even without secrets: house policy for every image build-and-deploy job.
    if: &same-repo-pr-or-secret-revalidation >-
      (github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && inputs.revalidate_secret_lanes)
    # One cell per stack module; `lane` names its diagnostics, `project` the stack its cleanup removes.
    strategy:
      fail-fast: false
      matrix:
        include:
        - lane: bluesky-deploy-e2e
          name: Bluesky Deploy E2E (bluesky bridge, full Docker stack)
          module: tests/e2e/test_bluesky_deploy.py
          project: osprey-e2e-bluesky-deploy
          timeout: 60
          step_timeout: 55
        - lane: bluesky-web-deploy-e2e
          name: Bluesky Web Deploy E2E (VA + bluesky bridge + bluesky-web sidecar, full Docker stack)
          module: tests/e2e/test_bluesky_web_deploy.py
          project: panels-proj
          timeout: 45
          step_timeout: 40
        - lane: va-substrate-equivalence-e2e
          name: VA Substrate Equivalence E2E (virtual accelerator + bluesky bridge, full Docker stack)
          module: tests/e2e/test_va_substrate_equivalence.py
          project: osprey-e2e-va-substrate
          timeout: 45
          step_timeout: 40
        - lane: bluesky-queue-e2e
          name: Bluesky Queue E2E (queueserver + Redis + Tiled + VA, full Docker stack)
          module: tests/e2e/test_bluesky_queue_e2e.py
          project: queue-e2e
          timeout: 75
          step_timeout: 70
        # No secrets (test_secret_free_lane_has_no_llm_secret); -s so the measured budgets reach a green log.
        - lane: archiver-world-e2e
          name: Archiver World E2E (VA + mongodb store + recorder, full Docker stack)
          module: tests/e2e/test_archiver_world_e2e.py
          project: archiver-world
          timeout: 45
          step_timeout: 40
          pytest_args: -s
        - lane: tiled-roundtrip-e2e
          name: Tiled Roundtrip E2E (bluesky bridge + Tiled persistence, full Docker stack)
          module: tests/e2e/test_tiled_roundtrip.py
          project: osprey-e2e-tiled
          timeout: 30
          step_timeout: 25
        - lane: bluesky-catalog-e2e
          name: Bluesky Catalog E2E (layered plan catalog, full Docker stack)
          module: tests/e2e/test_bluesky_catalog_e2e.py
          project: osprey-e2e-catalog
          timeout: 60
          step_timeout: 55
        - lane: bluesky-sandbox-escape-e2e
          name: Bluesky Sandbox Escape E2E (session-plan authoring gates, full Docker stack)
          module: tests/e2e/test_bluesky_sandbox_escape_e2e.py
          project: sandbox-escape
          timeout: 45
          step_timeout: 40

    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - name: Run the stack E2E module
      timeout-minutes: ${{ matrix.step_timeout }}
      run: |
        uv run pytest ${{ matrix.module }} -v ${{ matrix.pytest_args }} --tb=short
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: ${{ matrix.lane }}
        engine: docker
    - name: Clean up any stranded stack resources
      if: always()
      run: |
        scripts/ci/cleanup_stacks.sh ${{ matrix.project }}

  optimizer-deploy-e2e:
    name: Optimizer Deploy E2E (optimizer + Redis job store, full Docker stack)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: *same-repo-pr-or-secret-revalidation

    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - name: Run optimizer deploy E2E
      timeout-minutes: 55
      run: |
        uv run pytest tests/e2e/test_optimizer_deploy.py -v --tb=short
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: optimizer-deploy-e2e
        engine: docker

  orm-roundtrip-e2e:
    name: ORM + Grid Scan Roundtrip E2E (VA + bluesky bridge + Tiled, full Docker stack)
    runs-on: ubuntu-latest
    # Sequential steps: two modules bind CA port 5064, and a runner fits one stack at a time.
    if: *same-repo-pr-or-secret-revalidation
    timeout-minutes: 100

    steps:
    # Docker 29's containerd image store unpacks shared layers per image and ran this lane out of
    # disk. Drop this once the lane builds less per stack.
    - name: Use the overlay2 image store
      run: |
        sudo mkdir -p /etc/docker
        [ -s /etc/docker/daemon.json ] || echo '{}' | sudo tee /etc/docker/daemon.json >/dev/null
        sudo jq '.features["containerd-snapshotter"] = false' /etc/docker/daemon.json \
          | sudo tee /etc/docker/daemon.json.new >/dev/null
        sudo mv /etc/docker/daemon.json.new /etc/docker/daemon.json
        sudo systemctl restart docker
        driver=$(docker info --format '{{.Driver}}')
        echo "storage driver: $driver"
        [ "$driver" = overlay2 ]

    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - name: Run ORM roundtrip E2E
      timeout-minutes: 45
      run: |
        uv run pytest tests/e2e/test_orm_roundtrip.py -v --tb=short

    - name: Run grid scan roundtrip E2E
      timeout-minutes: 40
      run: |
        uv run pytest tests/e2e/test_grid_scan_roundtrip.py -v --tb=short

    - name: Run orbit bump sweep roundtrip E2E
      timeout-minutes: 45
      run: |
        uv run pytest tests/e2e/test_bump_roundtrip.py -v --tb=short

    - name: Run preflight probe E2E
      timeout-minutes: 45
      run: |
        uv run pytest tests/e2e/test_preflight_probe.py -v --tb=short
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: orm-roundtrip-e2e
        engine: docker
    - name: Clean up any stranded stack resources
      if: always()
      run: |
        scripts/ci/cleanup_stacks.sh \
          orm-roundtrip \
          grid-scan-roundtrip \
          bump-roundtrip \
          preflight-probe

  scan-agentic-e2e:
    name: Scan Stack Agentic E2E (agent-driven ORM + grid scans on the deployed queue stack)
    runs-on: ubuntu-latest
    if: *full-ci-pr-or-secret-revalidation
    # Above the fixture's own caps (the deploy alone may take 56 min), so its timeout report is not cut off.
    timeout-minutes: 75

    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - *llm-preflight-probe

    - *install-pinned-cli

    - *build-qmd-image

    - name: Run scan stack agentic E2E
      timeout-minutes: 70
      env:
        OSPREY_QMD_IMAGE: osprey-qmd:ci
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
      run: |
        uv run pytest tests/e2e/test_plan_stack_agentic.py -v --tb=short \
          --junitxml=junit-scan-agentic-e2e.xml

    - name: Fail the lane on any skipped test
      run: |
        # A flake absorbed by `flaky(reruns=2)` skips nothing: reruns are not testcases.
        uv run python scripts/ci/junit_no_skips.py junit-scan-agentic-e2e.xml \
          --message "✅ every scan-stack agentic test ran; none skipped"
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: scan-agentic-e2e
        engine: docker
    - name: Clean up any stranded stack resources
      if: always()
      run: |
        scripts/ci/cleanup_stacks.sh plan-agentic

  graph-reseed-e2e:
    name: Graph Reseed Stamp E2E (render + real Neo4j store, no model)
    runs-on: ubuntu-latest
    if: *same-repo-pr-or-secret-revalidation
    timeout-minutes: 30

    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - name: Fetch the pinned neosemantics (n10s) jar
      # As in the benchmarks job: a fixture download failure would skip.
      run: |
        set -euo pipefail
        url="$(uv run python -c 'from tests._graphdb_container import N10S_JAR_URL; print(N10S_JAR_URL)')"
        jar="${{ runner.temp }}/$(basename "$url")"
        curl -fsSL --retry 3 --retry-all-errors --max-time 300 -o "$jar" "$url"
        echo "OSPREY_TEST_N10S_JAR=$jar" >> "$GITHUB_ENV"

    - name: Run graph reseed stamp E2E
      timeout-minutes: 25
      run: |
        uv run pytest tests/e2e/test_graph_reseed_stamp.py -v --tb=short
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: graph-reseed-e2e
        engine: docker

  nextcloud-talk-bridge-e2e:
    name: Nextcloud Talk Bridge E2E (real Talk server + dispatch stack)
    runs-on: ubuntu-latest
    if: *full-ci-pr-or-secret-revalidation
    # A job `permissions:` replaces the defaults; `packages: read` for the PRIVATE ghcr Talk fixture.
    permissions:
      contents: read
      packages: read
    timeout-minutes: 45

    steps:
    - *checkout-full-history

    - name: Log in to ghcr (Nextcloud Talk fixture)
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - *install-uv

    - *sync-dev-deps

    - *install-pinned-cli

    - name: Pull the pinned Nextcloud Talk fixture image
      run: |
        # Pulled here: the module skips without the image. The wiring test binds this constant to the Dockerfile.
        IMAGE=$(uv run python -c 'import importlib.util as i, sys; s=i.spec_from_file_location("_nc","tests/e2e/test_nextcloud_talk_bridge_e2e.py"); m=i.module_from_spec(s); sys.modules["_nc"]=m; s.loader.exec_module(m); print(m.NEXTCLOUD_FIXTURE_IMAGE)')
        echo "Pulling fixture image: $IMAGE"
        docker pull "$IMAGE"

    - *llm-preflight-probe

    - name: Run Nextcloud Talk bridge E2E
      timeout-minutes: 40
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
      run: |
        uv run pytest tests/e2e/test_nextcloud_talk_bridge_e2e.py -v --tb=short
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: nextcloud-talk-bridge-e2e
        engine: docker

  gchat-bridge-e2e:
    name: Google Chat Bridge E2E (Pub/Sub emulator + dispatch stack)
    runs-on: ubuntu-latest
    if: *full-ci-pr-or-secret-revalidation
    permissions:
      contents: read
    timeout-minutes: 45
    env:
      OSPREY_E2E_RUNTIME: docker

    steps:
    - *checkout-full-history

    - *install-uv

    - name: Install osprey
      run: uv sync --locked --extra dev --extra gchat

    - *install-pinned-cli

    - name: Pull the Pub/Sub emulator image
      run: |
        # Pulled here: a failed pull in the fixture is a skip. PYTHONPATH as pytest's, for the connectors harness.
        IMAGE=$(PYTHONPATH=packages/osprey-connectors/tests uv run python -c 'from tests.e2e.fixtures.gchat_pubsub_emulator import IMAGE; print(IMAGE)')
        echo "Pulling emulator image: $IMAGE"
        docker pull "$IMAGE"

    - *llm-preflight-probe

    # Separate steps, no xdist: both files use one fixed-name emulator container.
    - name: Run Google Chat fixture smoke tests
      run: |
        uv run pytest tests/e2e/fixtures/test_gchat_fixture_smoke.py -v --tb=short \
          --junitxml=junit-gchat-fixture-smoke.xml

    - name: Run Google Chat bridge E2E
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
      run: |
        uv run pytest tests/e2e/test_gchat_bridge_e2e.py -v --tb=short \
          --junitxml=junit-gchat-bridge-e2e.xml

    - name: Fail the lane on any skipped test
      run: |
        uv run python scripts/ci/junit_no_skips.py junit-gchat-fixture-smoke.xml junit-gchat-bridge-e2e.xml \
          --message "✅ every Google Chat test ran; none skipped"
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: gchat-bridge-e2e
        engine: docker

  teams-slack-bridge-e2e:
    name: Microsoft Teams + Slack Bridge E2E (loopback fakes, no container)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25

    steps:
    - *checkout-full-history

    - *install-uv

    - name: Install osprey
      run: uv sync --locked --extra dev --extra teams

    - *install-pinned-cli

    - name: Run Microsoft Teams and Slack bridge E2E
      timeout-minutes: 16
      run: |
        # `--no-sync`: a bare `uv run` re-syncs and strips the `teams` extra back out.
        uv run --no-sync pytest \
          tests/e2e/fixtures/test_teams_fixture_smoke.py \
          tests/e2e/test_teams_bridge_e2e.py \
          tests/e2e/fixtures/test_slack_fixture_smoke.py \
          tests/e2e/test_slack_bridge_e2e.py \
          -v --tb=short \
          --junitxml=junit-teams-slack-bridge-e2e.xml

    - name: Fail the lane on any skipped test
      run: |
        uv run --no-sync python scripts/ci/junit_no_skips.py junit-teams-slack-bridge-e2e.xml \
          --message "✅ every Microsoft Teams and Slack test ran; none skipped"
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: teams-slack-bridge-e2e

  privilege-split-e2e:
    name: Privilege Split E2E (built images, stat-level ownership proof)
    runs-on: ubuntu-latest
    # The job `name:` names only the first module: branch protection matches on it.
    timeout-minutes: 120
    if: *same-repo-pr-or-secret-revalidation

    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - name: Run privilege split E2E
      timeout-minutes: 85
      run: |
        uv run pytest tests/e2e/test_privilege_split.py -v --tb=short \
          --junitxml=junit-privilege-split.xml

    - name: Run audit two-container mechanism E2E
      # `success() || failure()`: a red step above must not hide this, and `always()` would run after a cancel.
      if: success() || failure()
      timeout-minutes: 35
      run: |
        uv run pytest tests/e2e/test_audit_two_container.py -v --tb=short \
          --junitxml=junit-audit-two-container.xml

    - name: Fail the lane on a lane-wide skip
      if: success() || failure()
      run: |
        # --allow-partial-skips: the audit module has documented per-test guards.
        uv run python scripts/ci/junit_no_skips.py junit-privilege-split.xml junit-audit-two-container.xml --allow-partial-skips \
          --message "✅ both privilege-split modules ran"

    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: privilege-split-e2e
        engine: docker

    - name: Clean up any stranded resources from either module
      if: always()
      run: |
        scripts/ci/cleanup_stacks.sh \
          --sweep \
          --image 'osprey-e2e-privsplit-*' \
          --image 'osprey-e2e-audit2c*' \
          osprey-e2e-privsplit \
          osprey-e2e-audit2c

  dockerfile-e2e:
    name: Dockerfile E2E (generated container image)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: *same-repo-pr-or-secret-revalidation

    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - name: Run Dockerfile E2E
      timeout-minutes: 55
      env:
        OSPREY_E2E_PIP_SPEC: git+https://github.com/${{ github.repository }}.git@${{ github.event.pull_request.head.sha || github.sha }}
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
      run: uv run pytest tests/e2e/test_dockerfile_e2e.py -v --tb=short

    # The proxied build is proven from the proxy's access log, not the build's exit status: this
    # runner has open egress.
    - name: Start a logging forward proxy (tinyproxy)
      # `LogLevel Info` is load-bearing: the request line the assertion reads is logged at Info.
      run: |
        set -euo pipefail
        rm -rf /tmp/osprey-proxy
        mkdir -p /tmp/osprey-proxy
        cat > /tmp/osprey-proxy/tinyproxy.conf <<'CONF'
        Port 8888
        Timeout 600
        MaxClients 100
        LogLevel Info
        LogFile "/proxy/access.log"
        CONF
        : > /tmp/osprey-proxy/access.log
        chmod 666 /tmp/osprey-proxy/access.log
        docker run -d --name osprey-ci-proxy --network host \
          -v /tmp/osprey-proxy:/proxy debian:bookworm-slim \
          sh -c 'apt-get update -qq \
                 && apt-get install -y -qq --no-install-recommends tinyproxy \
                 && exec tinyproxy -d -c /proxy/tinyproxy.conf'
        # A bare TCP connect: a probe that fetched through the proxy would write the access log under test.
        for _ in $(seq 60); do
          if (exec 3<>/dev/tcp/127.0.0.1/8888) 2>/dev/null; then
            echo "✅ tinyproxy is listening on 127.0.0.1:8888"
            exit 0
          fi
          sleep 2
        done
        echo "❌ tinyproxy never came up on 127.0.0.1:8888"
        docker logs osprey-ci-proxy || true
        exit 1

    - name: Assert the uppercase-only proxy contract reaches the build
      # BuildKit copies HTTP_PROXY into http_proxy inside RUN, which would pass the assertion with the
      # bridge deleted, so the build uses podman. This probe fails the lane if podman ever does the same.
      run: |
        set -euo pipefail
        rm -rf /tmp/osprey-proxy-probe
        mkdir -p /tmp/osprey-proxy-probe
        cat > /tmp/osprey-proxy-probe/Dockerfile <<'PROBE'
        FROM docker.io/library/busybox
        RUN env | sort | grep -i proxy || echo "NO-PROXY-ENV"
        PROBE
        # Retry only the base-image pull: the measured build runs once from local storage, so the
        # property under test is never retried into passing.
        pulled=
        for attempt in 1 2 3; do
          if podman pull docker.io/library/busybox; then
            pulled=yes
            break
          fi
          echo "pull attempt $attempt of 3 failed; retrying in $((attempt * 5))s"
          sleep "$((attempt * 5))"
        done
        if [ -z "$pulled" ]; then
          echo "❌ could not fetch the probe base image in 3 attempts — a registry"
          echo "   failure, which says nothing about the proxy contract below"
          exit 1
        fi
        # `|| rc=$?`: under `set -e` a bare assignment would abort before the output below is printed.
        rc=0
        out="$(podman build --no-cache --pull=never --http-proxy=false \
          --build-arg HTTP_PROXY=http://127.0.0.1:8888 \
          --build-arg HTTPS_PROXY=http://127.0.0.1:8888 \
          /tmp/osprey-proxy-probe 2>&1)" || rc=$?
        printf '%s\n' "$out"
        if [ "$rc" -ne 0 ]; then
          echo "❌ the probe build failed (podman exit $rc); its output is above"
          exit 1
        fi
        if ! grep -q 'HTTP_PROXY=http://127.0.0.1:8888' <<<"$out"; then
          echo "❌ the uppercase HTTP_PROXY build-arg never reached the RUN environment"
          exit 1
        fi
        if grep -q 'http_proxy=' <<<"$out"; then
          echo "❌ this build runtime injects a lowercase proxy variable of its own —"
          echo "   the access-log assertion would then pass with the Dockerfile's"
          echo "   lowercase bridge deleted, i.e. it would prove nothing."
          exit 1
        fi
        echo "✅ uppercase in, uppercase only — the bridge is the sole path to apt"

    - name: Build the web-terminal auth sidecar through the proxy
      # `--http-proxy=false` drops buildah's copy of the host's proxy variables, so the build-args are
      # the only ones.
      timeout-minutes: 15
      run: |
        set -euo pipefail
        version="$(uv run --no-sync python -c 'import osprey; print(osprey.__version__)')"
        echo "OSPREY_VERSION=$version"
        rm -rf /tmp/osprey-sidecar-ctx
        mkdir -p /tmp/osprey-sidecar-ctx
        cp -a src/osprey/templates/modules/web_terminals/auth_sidecar/. /tmp/osprey-sidecar-ctx/
        : > /tmp/osprey-sidecar-ctx/osprey-local-requirements.txt
        podman build --no-cache --network=host --http-proxy=false \
          --build-arg HTTP_PROXY=http://127.0.0.1:8888 \
          --build-arg HTTPS_PROXY=http://127.0.0.1:8888 \
          --build-arg OSPREY_VERSION="$version" \
          --build-arg OSPREY_DEV=1 \
          --tag osprey-auth-sidecar:proxied-ci \
          /tmp/osprey-sidecar-ctx

    - name: Assert apt and pip traffic went through the proxy
      run: |
        set -euo pipefail
        log=/tmp/osprey-proxy/access.log
        if [ ! -s "$log" ]; then
          echo "❌ proxy access log missing or empty at $log — nothing was proxied at all"
          docker logs osprey-ci-proxy || true
          exit 1
        fi
        apt_hits="$(grep -F 'deb.debian.org' "$log" || true)"
        pip_hits="$(grep -E 'pypi\.org|files\.pythonhosted\.org' "$log" || true)"
        echo "── apt traffic seen by the proxy ──────────────────────────────"
        head -n 20 <<<"${apt_hits:-<none>}"
        echo "── pip traffic seen by the proxy ──────────────────────────────"
        head -n 20 <<<"${pip_hits:-<none>}"
        if [ -z "$apt_hits" ]; then
          echo "❌ no deb.debian.org request reached the proxy: the lowercase-proxy"
          echo "   bridge in the auth-sidecar Dockerfile is not doing its job."
          exit 1
        fi
        if [ -z "$pip_hits" ]; then
          echo "❌ no pypi.org / files.pythonhosted.org request reached the proxy:"
          echo "   the framework install bypassed it."
          exit 1
        fi
        echo "✅ both apt and pip traffic went through the proxy"

    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: dockerfile-e2e
        engine: docker

    - name: Stop the forward proxy
      # Last: the capture step needs the container's logs.
      if: always()
      run: |
        set -euo pipefail
        if [ -f /tmp/osprey-proxy/access.log ]; then
          echo "── last 40 proxy access-log lines ─────────────────────────────"
          tail -n 40 /tmp/osprey-proxy/access.log || true
        fi
        docker rm -f osprey-ci-proxy > /dev/null 2>&1 || true

