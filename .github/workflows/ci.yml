          tests/interfaces/history/test_history_page_browser.py \
          tests/interfaces/test_events_notice_browser.py \
          tests/interfaces/test_browser_helper.py \
          tests/interfaces/test_load_smokes.py -v --tb=short

  visual-theming-agent:
    name: Watchdog Browser + Visual Regression (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The rest of the browser lane: the watchdog suite (needs the pinned CLI), the
    # container-backed suites, and visual regression. Chromium only.
    # contents: write for this job alone: the last step pushes regenerated
    # baselines back to the PR branch.
    permissions:
      contents: write
    env:
      OSPREY_OFFLINE: "1"

    steps:
    - *checkout-full-history

    - *install-uv

    - *python-3-11

    - *sync-dev-deps

    - name: Fetch vendor assets
      timeout-minutes: 5
      run: uv run osprey vendor fetch --quiet

    # `visual-theming` writes the Playwright cache; this lane only reads it.
    - *playwright-cache-key

    - *playwright-apt

    - name: Restore Playwright browsers and apt debs
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.cache/ms-playwright
          ~/apt-archives
        key: ${{ steps.playwright-key.outputs.key }}
        restore-keys: |
          ${{ steps.playwright-key.outputs.prefix }}

    - *playwright-chromium

    - *install-pinned-cli

    - name: Run the watchdog browser suite
      timeout-minutes: 20
      run: |
        uv run pytest tests/interfaces/test_watchdog_e2e.py -m browser -v --tb=short \
          --junitxml=junit-watchdog-browser.xml

    - name: Fail the lane on any skipped watchdog browser test
      run: |
        # The chromium fixture skips when its binary is absent, and pytest's
        # exit code cannot tell "everything passed" from "everything was
        # skipped". The junit report is read instead: zero skips, and a
        # non-zero test count so an empty selection cannot pass either.
        uv run python - <<'PY'
        import sys
        import xml.etree.ElementTree as ET

        report = "junit-watchdog-browser.xml"
        total = skipped = 0
        for suite in ET.parse(report).getroot().iter("testsuite"):
            total += int(suite.get("tests", 0))
            skipped += int(suite.get("skipped", 0))
        print(f"{report}: {total} test(s), {skipped} skipped")
        failed = False
        if total == 0:
            print(f"::error::{report} collected no tests")
            failed = True
        if skipped:
            print(f"::error::{report} reports {skipped} skipped test(s)")
            failed = True
        if failed:
            sys.exit(1)
        print("every watchdog browser test ran; none skipped")
        PY

    # Container start/stop changes the host's network, and every Chromium then
    # fails in-flight requests (ERR_NETWORK_CHANGED). Beside the parallel workers
    # that broke other suites' pages, so these run serially, here.
    - name: Run the container-backed browser suites
      run: |
        uv run pytest \
          tests/interfaces/web_terminal/test_auth_login_browser.py \
          tests/interfaces/web_terminal/test_ariel_embedded_agent_browser.py \
          -v --tb=short

    - name: Run visual regression suite
      # Linux is the authoritative platform for the pixel diff; a missing baseline
      # is written and committed back by the step below.
      run: uv run pytest tests/interfaces/design_system/test_visual.py -v --tb=short

    - name: Upload Linux-rendered baselines artifact
      uses: actions/upload-artifact@v7
      with:
        name: visual-baselines-linux
        path: tests/interfaces/design_system/baselines/*.png
        retention-days: 14

    - name: Commit new/updated Linux baselines back to the PR branch
      # Same-repo PRs only: forks cannot push.
      if: >-
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: "chore(visual): update Linux-rendered theming baseline(s) [skip ci]"
        file_pattern: 'tests/interfaces/design_system/baselines/*.png'
        commit_user_name: "github-actions[bot]"
        commit_user_email: "github-actions[bot]@users.noreply.github.com"

  frontend-js:
    name: Frontend JS (typecheck + lint + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - *checkout-full-history

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install JS dependencies
      # `npm ci` tests exactly the lockfile. Regenerate the lock with
      # `npm install --package-lock-only`, which is platform-neutral.
      run: npm ci

    - name: Typecheck (tsc --noEmit)
      run: python3 scripts/check.py run tsc

    - name: Lint (eslint)
      run: python3 scripts/check.py run eslint

    - name: Format (prettier)
      run: python3 scripts/check.py run prettier

    - name: Run JS tests (vitest)
      run: python3 scripts/check.py run vitest

    # `osprey app check` installs its own pinned toolchain and runs it through Python.
    - *install-uv

    - name: Install Python dependencies
      run: uv sync --locked --extra dev

    - name: Run osprey app check over a panel (pinned JS toolchain)
      run: python3 scripts/check.py run app-check-js

  plugin-smoke:
    name: Plugin marketplace smoke (install the osprey plugin)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No `if:`: a plugin that stops installing breaks every consumer, and changes
    # outside `plugins/` can cause it. About a minute.
    steps:
    - *checkout-full-history

    # `marketplace add` writes the registration into $CLAUDE_CONFIG_DIR, so every
    # later step must share it. GITHUB_ENV because `runner` is not available in
    # job-level `env:`.
    - name: Point the Claude CLI at a scratch config dir
      run: echo "CLAUDE_CONFIG_DIR=$RUNNER_TEMP/claude-cfg" >> "$GITHUB_ENV"

    - *install-uv

    - *python-3-11

    - name: Install dependencies
      run: uv sync --locked

    - *install-pinned-cli

    - name: Install the osprey plugin from the in-repo marketplace
      # The checkout is the marketplace source, so this proves THIS commit's manifests.
      run: |
        claude plugin marketplace add "$GITHUB_WORKSPACE"
        claude plugin install osprey@osprey

    - name: Check the plugin exposes all ten skills
      run: |
        claude plugin details osprey@osprey | tee /tmp/details.txt
        grep -q 'Skills (10)' /tmp/details.txt
        for s in contribute design-philosophy doc-sync housekeeping panel pre-commit release setup test-audit upstream-scout; do grep -q "$s" /tmp/details.txt; done

  build-boot-smoke:
    name: Tier 1 — Build + MCP boot (${{ matrix.preset }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset: [hello-world, demo]

    steps:
    - *checkout-full-history

    - *install-uv

    - *python-3-11

    - *sync-dev-deps

    - name: Cache uv project-venv downloads
      uses: actions/cache@v6
      with:
        path: ~/.cache/uv
        key: uv-buildboot-${{ runner.os }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          uv-buildboot-${{ runner.os }}-

    - name: Run Tier 1 boot smoke for preset
      env:
        PRESET: ${{ matrix.preset }}
        # Over /tmp's tmpfs quota otherwise; see "Run unit tests".
        TMPDIR: ${{ runner.temp }}
      run: |
        uv run pytest tests/integration/test_build_boot.py -v --tb=short -k "$PRESET"

  changes:
    name: Changed-path classifier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Docs-only pull requests stand the pull-request-scoped lanes down (rule in
    # scripts/ci/docs_only.py; workflow.rst, "Model-Spending Lanes"). Pushes,
    # dispatches and `full-ci` PRs always get `docs_only=false`. Must succeed:
    # the gate requires it, so a broken classifier reds the run instead of
    # quietly skipping every e2e lane.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
    - name: Checkout the classifier
      uses: actions/checkout@v7
      with:
        sparse-checkout: scripts/ci
        persist-credentials: false
    - name: Classify changed paths
      id: classify
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT_NAME: ${{ github.event_name }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HAS_FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
      run: |
        set -euo pipefail
        if [[ "$EVENT_NAME" != "pull_request" ]]; then
          echo "Not a pull request ($EVENT_NAME): every lane runs."
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
        elif [[ "$HAS_FULL_CI" == "true" ]]; then
          echo "full-ci label: every lane runs."
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
        else
          # Both names of a rename are fed, so moving a file out of src/ into
          # docs/ still counts as touching src/.
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)' > changed-paths.txt
          python3 scripts/ci/docs_only.py < changed-paths.txt >> "$GITHUB_OUTPUT"
        fi

  agentic-per-preset:
    name: Tier 3 — Agentic flow (${{ matrix.preset }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Model-spending lane (see the header note). Gating, no continue-on-error.
    needs: changes
    if: &full-ci-pr-or-secret-revalidation >-
      (github.event_name == 'pull_request'
      && needs.changes.outputs.docs_only != 'true'
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.actor != 'dependabot[bot]'
        && contains(github.event.pull_request.labels.*.name, 'full-ci'))
      || (github.event_name == 'workflow_dispatch' && inputs.revalidate_secret_lanes)
    strategy:
      fail-fast: false
      matrix:
        preset: [hello-world, demo]

    steps:
    - *checkout-full-history

    - *install-uv

    - *python-3-11

    - *sync-dev-deps

    - &llm-preflight-probe
      name: Pre-flight LLM endpoint reachability check
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
      run: |
        # Fail fast on an unset secret or a non-allowlisted runner IP, rather than
        # under a flood of 4xx errors minutes into the tests.
        if [ -z "${ALS_APG_API_KEY:-}" ]; then
          echo "❌ ALS_APG_API_KEY secret is not set on this runner"
          echo "   (Check repo secrets; every LLM-calling lane needs it.)"
          exit 1
        fi
        ALS_APG_PROBE_BASE="${ALS_APG_BASE_URL}"
        ALS_APG_PROBE_BASE="${ALS_APG_PROBE_BASE%/}"; ALS_APG_PROBE_BASE="${ALS_APG_PROBE_BASE%/v1}"
        HTTP_CODE=$(curl -sS -o /tmp/probe.txt -w "%{http_code}" --max-time 15 \
          -X POST "$ALS_APG_PROBE_BASE/v1/messages" \
          -H "Content-Type: application/json" \
          -H "anthropic-version: 2023-06-01" \
          -H "Authorization: Bearer $ALS_APG_API_KEY" \
          -d '{"model":"claude-haiku-5-5","max_tokens":4,"messages":[{"role":"user","content":"ping"}]}')
        if [ "$HTTP_CODE" != "200" ]; then
          echo "❌ ALS-APG endpoint probe failed (HTTP $HTTP_CODE)"
          echo "   Body (first 500 chars):"
          head -c 500 /tmp/probe.txt; echo
          echo "   If 401/403: rotate ALS_APG_API_KEY or check IP allowlist."
          echo "   If 5xx: ALS-APG outage — retry, or contact the proxy admin."
          exit 1
        fi
        echo "✅ ALS-APG endpoint reachable (HTTP 200)"

    - *install-pinned-cli

    - name: Run Tier 3 agentic test for preset
      timeout-minutes: 55
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
        PRESET: ${{ matrix.preset }}
      run: |
        # template names use snake_case in init_project (e.g. hello_world);
        # the matrix entry is the kebab-case preset id, which appears in the
        # function name (test_hello_world_*) so -k matches both.
        PRESET_K="${PRESET//-/_}"
        uv run pytest tests/e2e/test_preset_agentic.py -v --tb=short -k "$PRESET_K"

    # On failure only: container logs, exit codes, OOMKilled and runner disk/memory,
    # uploaded as `ci-diag-<lane>`. (Same in every lane below.)
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: agentic-per-preset-${{ matrix.preset }}
        engine: docker

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Model-spending lane (see the header note); also a plain dispatch for scoped
    # reruns via e2e_filter, unless run_benchmarks is set.
    needs: changes
    if: >-
      (github.event_name == 'pull_request'
      && needs.changes.outputs.docs_only != 'true'
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.actor != 'dependabot[bot]'
        && contains(github.event.pull_request.labels.*.name, 'full-ci'))
      || (github.event_name == 'workflow_dispatch' && !inputs.run_benchmarks)
    # Healthy ~20-25 min; the cap also fits @flaky reruns of one ~8-min test.
    timeout-minutes: 50

    steps:
    # Image-building lanes run the hosted runner out of disk ("No space left on
    # device"); drop the preinstalled SDKs they never use.
    - &free-runner-disk
      name: Free runner disk
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h /

    - *checkout-full-history

    - *install-uv

    - *python-3-11

    - *sync-dev-deps

    - *llm-preflight-probe

    - *install-pinned-cli

    - name: Run E2E tests
      # Below the job cap so a hang fails the step and the capture still runs; a
      # job timeout is a hard cancel.
      timeout-minutes: 45
      # E2E_FILTER: debug-only dispatch input, empty on push/PR.
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
        E2E_FILTER: ${{ inputs.e2e_filter }}
      run: |
        if [ -n "$E2E_FILTER" ]; then
          echo "Running scoped E2E filter: $E2E_FILTER"
          # Word-splitting on $E2E_FILTER is intentional so callers can
          # pass multiple paths or extra pytest args in one input.
          # shellcheck disable=SC2086
          uv run pytest $E2E_FILTER -v --tb=short
        else
          # Every --ignore below runs elsewhere, not "untested": container-image and
          # full-stack deploy modules in their own jobs (they leave host-global
          # residue); the two Google Chat files in gchat-bridge-e2e (they share one
          # fixed-name Pub/Sub emulator, which loadfile workers would kill mid-test);
          # the Teams files in teams-bridge-e2e (need the `teams` extra); the Slack and
          # other model-free files in slack-bridge-e2e and e2e-no-model (no label
          # needed there); the live watchdog checks are opt-in; the channel-finder
          # benchmarks run on the run_benchmarks dispatch. Every module binding the
          # VA's fixed CA port runs in its own job.
          # -n 4 --dist loadfile: real-LLM round-trips at near-zero CPU.
          # --durations=30 shows which tests approach the step cap.
          uv run pytest tests/e2e/ -v --tb=short --durations=30 -n 4 --dist loadfile \
            --ignore=tests/e2e/test_preset_agentic.py \
            --ignore=tests/e2e/test_plan_stack_agentic.py \
            --ignore=tests/e2e/test_dispatch_deploy.py \
            --ignore=tests/e2e/test_single_user_narrowing_e2e.py \
            --ignore=tests/e2e/test_dispatch_overlay_visibility.py \
            --ignore=tests/e2e/test_bluesky_deploy.py \
            --ignore=tests/e2e/test_optimizer_deploy.py \
            --ignore=tests/e2e/test_bluesky_queue_e2e.py \
            --ignore=tests/e2e/test_dockerfile_e2e.py \
            --ignore=tests/e2e/test_privilege_split.py \
            --ignore=tests/e2e/test_audit_two_container.py \
            --ignore=tests/e2e/test_execution_environment_parity.py \
            --ignore=tests/e2e/test_tiled_roundtrip.py \
            --ignore=tests/e2e/test_va_substrate_equivalence.py \
            --ignore=tests/e2e/test_target_switch_agentic.py \
            --ignore=tests/e2e/test_orm_roundtrip.py \
            --ignore=tests/e2e/test_grid_scan_roundtrip.py \
            --ignore=tests/e2e/test_bump_roundtrip.py \
            --ignore=tests/e2e/test_preflight_probe.py \
            --ignore=tests/e2e/test_archiver_world_e2e.py \
            --ignore=tests/e2e/test_graph_reseed_stamp.py \
            --ignore=tests/e2e/test_bluesky_catalog_e2e.py \
            --ignore=tests/e2e/test_bluesky_sandbox_escape_e2e.py \
            --ignore=tests/e2e/test_bluesky_web_deploy.py \
            --ignore=tests/e2e/test_deploy_lifecycle.py \
            --ignore=tests/e2e/test_two_shape_boot.py \
            --ignore=tests/e2e/test_deploy_writeback_e2e.py \
            --ignore=tests/e2e/test_nextcloud_talk_bridge_e2e.py \
            --ignore=tests/e2e/test_gchat_bridge_e2e.py \
            --ignore=tests/e2e/fixtures/test_gchat_fixture_smoke.py \
            --ignore=tests/e2e/test_teams_bridge_e2e.py \
            --ignore=tests/e2e/fixtures/test_teams_fixture_smoke.py \
            --ignore=tests/e2e/test_slack_bridge_e2e.py \
            --ignore=tests/e2e/fixtures/test_slack_fixture_smoke.py \
            --ignore=tests/e2e/web_terminals/test_auth_perimeter.py \
            --ignore=tests/e2e/web_terminals/test_terminal_auth_multiuser_e2e.py \
            --ignore=tests/e2e/test_full_chain_auth.py \
            --ignore=tests/e2e/test_jupyter_panel_lifecycle.py \
            --ignore=tests/e2e/claude_code/test_channel_finder_mcp_benchmarks.py \
            --ignore=tests/e2e/test_agent_record_e2e.py \
            --ignore=tests/e2e/test_host_record_e2e.py \
            --ignore=tests/e2e/test_scripted_model.py \
            --ignore=tests/e2e/claude_code/test_safety_gates_scripted.py \
            --ignore=tests/e2e/test_dispatch_deploy_render.py \
            --ignore=tests/e2e/web_terminals/test_scaffold_render_roundtrip.py \
            --ignore=tests/e2e/web_terminals/test_skills_overlay_discovery.py \
            --ignore=tests/e2e/web_terminals/test_loopback_chokepoint.py \
            --ignore=tests/e2e/web_terminals/test_session_restart_e2e.py \
            --ignore=tests/e2e/web_terminals/test_terminal_auth_e2e.py \
            --ignore=tests/e2e/web_terminals/test_render_permissions_scripted.py \
            --ignore=tests/e2e/claude_code/test_chat_approval_gates_scripted.py \
            --ignore=tests/e2e/claude_code/test_chat_plan_mode_scripted.py \
            --ignore=tests/e2e/claude_code/test_chat_attachment_read_scripted.py \
            --ignore=tests/e2e/test_watchdog_agent_scripted.py \
            --ignore=tests/e2e/test_watchdog_hold_scripted.py \
            --ignore=tests/e2e/test_watchdog_live.py \
            --ignore=tests/e2e/tier2
        fi
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: e2e-tests
        engine: docker
    # Belt and suspenders: the deploy's own teardown does not run when the job is
    # killed, and a self-hosted, reused or `act` runner keeps the stack. Exact
    # names, never a prune. E2E_FILTER can run any full-stack module here.
    - name: Clean up any stranded stack resources
      if: always()
      run: |
        docker compose -p queue-e2e down || true
        docker rm -f queue-e2e-agent-record || true
        docker rm -f queue-e2e-agent-record-clickhouse || true
        docker volume ls -q --filter "name=^queue-e2e_" \
          | xargs -r docker volume rm -f || true
        docker compose -p osprey-e2e-bluesky-deploy down || true
        docker rm -f osprey-e2e-bluesky-deploy-agent-record || true
        docker rm -f osprey-e2e-bluesky-deploy-agent-record-clickhouse || true
        docker volume ls -q --filter "name=^osprey-e2e-bluesky-deploy_" \
