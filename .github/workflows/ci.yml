  two-shape-boot-e2e:
    name: Two-Shape Boot E2E (bridge + host network axis, podman-compose)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    if: *main-or-epic-pr-or-secret-revalidation

    steps:
    # Out of disk, podman-compose 1.0.6 answers `up -d` with 0 and creates no container; the capture logs `df -h /`.
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - name: Pin podman-compose 1.0.6 as podman's compose provider
      run: |
        pip install --user podman-compose==1.0.6
        PODMAN_COMPOSE_BIN="$(command -v podman-compose || true)"
        if [ -z "$PODMAN_COMPOSE_BIN" ]; then
          echo "❌ podman-compose is not on PATH after install"
          exit 1
        fi
        mkdir -p ~/.config/containers
        cat > ~/.config/containers/containers.conf <<EOF
        [engine]
        compose_providers = ["$PODMAN_COMPOSE_BIN"]
        EOF
        echo "PODMAN_COMPOSE_PROVIDER=$PODMAN_COMPOSE_BIN" >> "$GITHUB_ENV"
        podman --version
        podman ps >/dev/null

    - name: Step 0 — assert the compose provider is podman-compose 1.0.6
      env:
        CONTAINER_RUNTIME: podman
      run: |
        podman compose version
        uv run python - <<'PY'
        from osprey.deployment.runtime_helper import (
            ComposeProvider,
            detect_compose_provider,
            get_runtime_command,
        )

        runtime_cmd = get_runtime_command()
        info = detect_compose_provider(runtime_cmd)
        print("runtime command:", " ".join(runtime_cmd))
        print("provider banner:", info.banner)
        assert info.provider is ComposeProvider.PODMAN_COMPOSE, (
            f"this lane must run podman-compose; probed {info.provider} instead"
        )
        assert info.version == (1, 0, 6), (
            f"this lane pins podman-compose 1.0.6; probed {info.version_text}"
        )
        print("✅ compose provider is podman-compose 1.0.6")
        PY

    - name: Run two-shape boot E2E (podman)
      timeout-minutes: 70
      env:
        OSPREY_E2E_RUNTIME: podman
        CONTAINER_RUNTIME: podman
      # No `podman system service` / DOCKER_HOST, unlike the podman lifecycle lane: podman-compose reads
      # no socket, and the variable would be the only difference between step 0 and this step.
      run: |
        uv run pytest tests/e2e/test_two_shape_boot.py -v --tb=short

    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: two-shape-boot-e2e
        engine: podman

    - name: Clean up any stranded two-shape resources
      if: always()
      run: |
        podman rm -f osprey-e2e-two-shape-event-dispatcher || true
        podman rm -f osprey-e2e-two-shape-dispatch-worker-1 || true
        podman rm -f osprey-e2e-two-shape-agent-record || true
        podman rm -f osprey-e2e-two-shape-agent-record-clickhouse || true
        podman volume rm osprey-e2e-two-shape_dispatch_workspace_1 || true
        podman volume rm osprey-e2e-two-shape_agent_record_clickhouse_data || true
        podman network rm osprey-e2e-two-shape_osprey-network || true
        podman rmi -f osprey-e2e-two-shape:local || true
        podman rmi -f osprey-e2e-two-shape-dispatch:local || true

  qmd-sidecar-e2e:
    name: qmd Sidecar E2E (image build + live daemon over a fixture corpus)
    runs-on: ubuntu-latest
    if: *same-repo-pr-or-secret-revalidation
    # Covers the step caps plus the image build; tests/integration/test_qmd_sidecar_time_budget.py checks it.
    timeout-minutes: 240

    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - name: Build the sidecar image
      # Restore only: a PR-saved cache would be readable by that PR alone.
      uses: ./.github/actions/build-qmd-image
      with:
        # The mounted-models build below reuses this builder and cache.
        keep-builder: "true"

    - name: Run qmd sidecar E2E
      # Outlasts SIDECAR_ARIEL_TEST_TIMEOUT + SIDECAR_OKF_TEST_TIMEOUT (7041 s) rounded up, plus 5 min;
      # test_qmd_sidecar_time_budget.py checks it.
      timeout-minutes: 125
      env:
        OSPREY_QMD_IMAGE: osprey-qmd:ci
      run: uv run pytest tests/integration/ -m "dockerbuild and not wallclock" -k qmd -v --tb=short

    - name: Run the wall-clock budgets serially
      timeout-minutes: 15
      env:
        OSPREY_QMD_IMAGE: osprey-qmd:ci
      run: uv run python scripts/check.py run pytest-wallclock

    - name: Run the multi-user shared-bundle sidecar E2E
      # The `qmd` half of test_deploy_lifecycle.py, which the lifecycle lanes deselect. Outlasts
      # DEPLOY_LIFECYCLE_QMD_TIMEOUT (2802 s); test_qmd_sidecar_time_budget.py checks it.
      timeout-minutes: 55
      env:
        OSPREY_QMD_IMAGE: osprey-qmd:ci
      run: uv run pytest tests/e2e/test_deploy_lifecycle.py -m qmd -v --tb=short

    - name: Build the sidecar image with the model fetches skipped
      run: |
        set -euo pipefail
        docker buildx build \
          --build-arg OSPREY_QMD_MODELS_MOUNTED=1 \
          --tag osprey-qmd:ci-mounted \
          --load \
          --cache-from type=local,src=/tmp/qmd-buildx-cache \
          src/osprey/templates/services/qmd

    - name: Run the mounted-models E2E
      timeout-minutes: 10
      env:
        OSPREY_QMD_MOUNTED_IMAGE: osprey-qmd:ci-mounted
      run: uv run pytest tests/integration/test_qmd_models_mount.py -v --tb=short

    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: qmd-sidecar-e2e
        engine: docker

    # Before the image cleanup: a surviving container pins its image.
    - name: Clean up any stranded shared-bundle e2e resources
      if: always()
      run: |
        scripts/ci/cleanup_stacks.sh --sweep osprey-e2e-mus-p3

    - name: Clean up the sidecar images
      if: always()
      run: |
        docker rmi -f osprey-qmd:ci || true
        docker rmi -f osprey-qmd:ci-mounted || true

  qmd-cache-warmup:
    name: qmd Layer Cache Warm-up (pushes to main)
    runs-on: ubuntu-latest
    # Main pushes only: a PR can restore caches from main but not from other PRs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 45

    steps:
    - *checkout

    - name: Warm the qmd layer cache
      uses: ./.github/actions/build-qmd-image
      with:
        warm: "true"

  target-switch-e2e:
    name: Control-Target Switch E2E (virtual accelerator + bench IOC, two live CA servers)
    runs-on: ubuntu-latest
    if: *same-repo-pr-or-secret-revalidation
    timeout-minutes: 30

    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - *assert-container-runtime

    - &build-va-image
      name: Build the virtual accelerator image
      uses: ./.github/actions/build-virtual-accelerator-image

    - &build-bench-ioc-image
      name: Build the bench IOC image
      # After the VA image: it reuses that action's Buildx builder.
      uses: ./.github/actions/build-bench-ioc-image

    - name: Run the control-target switch E2E
      timeout-minutes: 15
      env:
        OSPREY_VA_E2E_ENABLE: "1"
      run: |
        uv run pytest tests/va/e2e/test_target_switch.py tests/va/e2e/test_bench_ioc_live.py \
          tests/va/e2e/test_live_standin.py tests/va/e2e/test_per_target_posture.py tests/va/e2e/test_model_status_va.py \
          tests/va/e2e/test_ca_loop_exit.py \
          -v --tb=short --junitxml=junit-target-switch-e2e.xml

    - name: Fail the lane on any skipped test
      run: |
        uv run python scripts/ci/junit_no_skips.py junit-target-switch-e2e.xml \
          --message "✅ every control-target switch test ran; none skipped"
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: target-switch-e2e
        engine: docker

    - name: Clean up the target images
      if: always()
      uses: ./.github/actions/remove-virtual-accelerator-images
      with:
        extra-tags: bench-ioc:latest

  target-switch-agentic-e2e:
    name: Control-Target Switch Agentic E2E (a real agent moving between the virtual accelerator and the bench IOC)
    runs-on: ubuntu-latest
    if: *full-ci-pr-or-secret-revalidation
    timeout-minutes: 45

    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - *llm-preflight-probe

    - *assert-container-runtime

    - *build-va-image

    - *build-bench-ioc-image

    - *install-pinned-cli

    - name: Run the control-target switch agentic E2E
      timeout-minutes: 35
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
      run: |
        uv run pytest tests/e2e/test_target_switch_agentic.py -v --tb=short \
          --junitxml=junit-target-switch-agentic-e2e.xml

    - name: Fail the lane on any skipped test
      run: |
        uv run python scripts/ci/junit_no_skips.py junit-target-switch-agentic-e2e.xml \
          --message "✅ every control-target switch agentic test ran; none skipped"
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: target-switch-agentic-e2e
        engine: docker

    - name: Clean up the target images
      if: always()
      uses: ./.github/actions/remove-virtual-accelerator-images
      with:
        extra-tags: bench-ioc:latest

  va-live-e2e:
    name: Live Virtual Accelerator E2E (${{ matrix.group }}; every suite the switch lane does not run)
    runs-on: ubuntu-latest
    if: *same-repo-pr-or-secret-revalidation
    timeout-minutes: ${{ matrix.timeout }}
    # Every suite in exactly one cell (the wiring test reads `suites`); modules sharing the session
    # container stay in one cell, in order.
    strategy:
      fail-fast: false
      matrix:
        include:
        - group: session-container
          suites: >-
            tests/va/e2e/test_approval_smoke.py tests/va/e2e/test_limits_enforcement.py
            tests/va/e2e/test_orbit_response.py tests/va/e2e/test_full_sweep.py
            tests/va/e2e/test_finder_live_reads.py tests/va/e2e/test_scenario_reload.py
            tests/va/e2e/test_sim_apply_va.py
            tests/va/e2e/test_va_put_surface.py tests/va/e2e/test_planted_journal.py
            tests/va/e2e/test_substrate_parity.py tests/va/e2e/test_chain_boot.py
          als_lane: false
          timeout: 40
          step_timeout: 20
        - group: measurements
          suites: >-
            tests/va/e2e/test_pyaml_measure_guarded.py tests/va/e2e/test_check_b_served.py
          als_lane: false
          timeout: 40
          step_timeout: 20
        - group: facility-trees
          suites: >-
            tests/va/e2e/test_mml_trees_boot.py
          als_lane: true
          timeout: 40
          step_timeout: 20
        # Two plan lanes, one per control target, on a full Docker stack (`stack` is its project).
        - group: plan-deploy
          suites: >-
            tests/va/e2e/test_bluesky_lanes.py
          als_lane: false
          timeout: 60
          step_timeout: 55
          stack: lane-e2e

    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - *assert-container-runtime

    - *build-va-image

    - name: Run the live virtual accelerator E2E
      timeout-minutes: ${{ matrix.step_timeout }}
      env:
        OSPREY_VA_E2E_ENABLE: "1"
      # No xdist: the conftest keeps ONE session container per process.
      run: |
        uv run pytest ${{ matrix.suites }} \
          -v --tb=short --junitxml=junit-va-live-e2e.xml

    - name: Run the real-facility lane on the NSLS-II stand-in
      if: matrix.als_lane
      timeout-minutes: 10
      env:
        OSPREY_ALS_LANE_STAND_IN: tests/fixtures/mml/nsls2
      run: |
        uv run pytest tests/cli/test_als_lane.py -v --tb=short --junitxml=junit-als-lane.xml

    - name: Fail the lane on any skipped test
      env:
        ALS_LANE: ${{ matrix.als_lane }}
      run: |
        # Read from the matrix, not from whether the file exists, so a cell that skipped the step reds.
        reports=(junit-va-live-e2e.xml)
        if [[ "$ALS_LANE" == "true" ]]; then reports+=(junit-als-lane.xml); fi
        uv run python scripts/ci/junit_no_skips.py "${reports[@]}" \
          --message "✅ every live virtual accelerator test ran; none skipped"
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: va-live-e2e-${{ matrix.group }}
        engine: docker
    - name: Clean up any stranded stack resources
      if: always() && matrix.stack
      run: |
        scripts/ci/cleanup_stacks.sh ${{ matrix.stack }}

    - name: Clean up the target images
      if: always()
      uses: ./.github/actions/remove-virtual-accelerator-images

  # No job-level `if:`: it decides inside, so it never ends skipped (the gate treats it as always-on).
  # The credential never shares a step with code the change controls, and nothing the job builds
  # reaches the shared Actions cache.
  canopy-contract:
    name: CANOPY contract
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        # Later steps run the change's code: leave no token in the git config.
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: false

    - name: Decide whether the change needs the contract
      id: decide
      # The triggers admit only integration bases (main, epic/**), so only a fork pull request skips.
      env:
        EVENT_NAME: ${{ github.event_name }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        run=true
        if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REPO" != "$REPO" ]]; then
          run=false
          echo "CANOPY contract not run: a pull request from a fork has no CANOPY read credential; a maintainer runs the contract through a workflow dispatch" >> "$GITHUB_STEP_SUMMARY"
        fi
        echo "run=$run" >> "$GITHUB_OUTPUT"

    - name: Require the CANOPY read credential
      id: credential
      if: steps.decide.outputs.run == 'true'
      env:
        TOKEN: ${{ secrets.CANOPY_READ_TOKEN }}
        BRANCH: ${{ github.head_ref || github.ref_name }}
      run: |
        if [[ -z "$TOKEN" ]]; then
          echo "::error::this change needs the CANOPY contract, which needs the CANOPY read credential: a maintainer re-runs it with gh workflow run ci.yml --ref $BRANCH"
          exit 1
        fi

    - name: Read the proven commits from the package
      id: pin
      if: steps.decide.outputs.run == 'true'
      # Each value reaches `git fetch` beside the credential: 40-hex only.
      run: |
        python3 src/osprey/integrations/canopy/proven.py --pins > pins
        canopy="$(sed -n 's/^canopy=//p' pins)"
        pydm="$(sed -n 's/^PyDMConverter=//p' pins)"
        for value in "$canopy" "$pydm"; do
          if [[ ! "$value" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::proven.py --pins names a value that is not a 40-hex commit: $value"
            exit 1
          fi
        done
        {
          echo "canopy=$canopy"
          echo "pydm=$pydm"
        } >> "$GITHUB_OUTPUT"

    - name: Fetch CANOPY and PyDMConverter at the proven commits
      id: fetch
      if: steps.decide.outputs.run == 'true'
      env:
        TOKEN: ${{ secrets.CANOPY_READ_TOKEN }}
        CANOPY_REPOSITORY: ${{ vars.CANOPY_REPOSITORY }}
        PYDMCONVERTER_REPOSITORY: ${{ vars.PYDMCONVERTER_REPOSITORY }}
        CANOPY_COMMIT: ${{ steps.pin.outputs.canopy }}
        PYDM_COMMIT: ${{ steps.pin.outputs.pydm }}
        SOURCES: ${{ runner.temp }}/canopy-sources
      # The only step with the credential: git alone, via an askpass helper that holds no secret.
      run: |
        set -euo pipefail
        askpass="$RUNNER_TEMP/canopy-askpass"
        # Single quotes on purpose: $1 and ${TOKEN} expand when git runs the helper, not here.
        # shellcheck disable=SC2016
        printf '%s\n' '#!/bin/sh' 'case "$1" in Username*) echo x-access-token ;; *) printf "%s\n" "${TOKEN}" ;; esac' > "$askpass"
        chmod 700 "$askpass"
        fetch_at() {
          # $1 = clone directory, $2 = owner/name, $3 = commit
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git clone --quiet "https://github.com/$2" "$1"
          if ! git -C "$1" cat-file -e "$3^{commit}" 2>/dev/null; then
            GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git -C "$1" fetch --quiet origin "$3"
          fi
          git -C "$1" checkout --quiet --detach "$3"
          # The install asks the clone for the commit by its id.
          git -C "$1" config uploadpack.allowAnySHA1InWant true
        }
        fetch_at "$SOURCES/canopy" "$CANOPY_REPOSITORY" "$CANOPY_COMMIT"
        fetch_at "$SOURCES/pydmconverter" "$PYDMCONVERTER_REPOSITORY" "$PYDM_COMMIT"
        {
          echo "canopy=$SOURCES/canopy"
          echo "pydm=$SOURCES/pydmconverter"
        } >> "$GITHUB_OUTPUT"

    - name: Install CANOPY and PyDMConverter at the proven commits
      id: install
      if: steps.decide.outputs.run == 'true'
      env:
        CANOPY_CLONE: ${{ steps.fetch.outputs.canopy }}
        PYDM_CLONE: ${{ steps.fetch.outputs.pydm }}
        CANOPY_COMMIT: ${{ steps.pin.outputs.canopy }}
        PYDM_COMMIT: ${{ steps.pin.outputs.pydm }}
      # `git+file://` so the distribution records its commit, which the contract reads.
      run: |
        set -euo pipefail
        if git config --global --get-regexp '^url\..*\.insteadof$' > /dev/null; then
          echo "::error::a git URL rewrite is still configured; refusing to run the build beside it"
          exit 1
        fi
        uv sync --locked --extra dev
        # Constrained by uv.lock's install set: CANOPY adds what the lock lacks and moves nothing it holds.
        uv export --frozen --no-hashes --no-emit-workspace --extra dev \
          > "$RUNNER_TEMP/lock-constraints.txt"
        # The override makes the local clone CANOPY's one PyDMConverter source, so the install reaches no remote.
        pydm="PyDMConverter @ git+file://${PYDM_CLONE}@${PYDM_COMMIT}"
        printf '%s\n' "$pydm" > "$RUNNER_TEMP/canopy-overrides.txt"
        uv pip install -c "$RUNNER_TEMP/lock-constraints.txt" \
          --override "$RUNNER_TEMP/canopy-overrides.txt" \
          "canopy[mcp,convert] @ git+file://${CANOPY_CLONE}@${CANOPY_COMMIT}" \
          "PyDMConverter @ git+file://${PYDM_CLONE}@${PYDM_COMMIT}"

    - name: Run the CANOPY contract
      id: contract
      if: steps.decide.outputs.run == 'true'
      run: |
        set -o pipefail
        python3 scripts/check.py run canopy-contract 2>&1 | tee canopy-contract.log

    - name: Name the proven commits
      id: summary
      if: always() && (steps.contract.outcome == 'success' || steps.contract.outcome == 'failure')
      run: |
        grep '^check: ' canopy-contract.log | tail -n 1 >> "$GITHUB_STEP_SUMMARY"

  all-checks-passed:
    name: All CI Checks Passed
    # qmd-cache-warmup stays out: it runs on main pushes only, whose own run it already turns red.
    needs: [test, serial-suites, dependency-floor, connectors-standalone, connectors-compat-plan, connectors-compat, framework-at-connectors-floor, optimizer, lint, docs, package, static-checks, visual-theming, visual-theming-agent, frontend-js, build-boot-smoke, e2e-tests, e2e-no-model, agent-record-e2e, deploy-e2e, dispatch-stack-e2e, host-record-e2e, stack-e2e, optimizer-deploy-e2e, orm-roundtrip-e2e, scan-agentic-e2e, graph-reseed-e2e, nextcloud-talk-bridge-e2e, gchat-bridge-e2e, teams-slack-bridge-e2e, dockerfile-e2e, privilege-split-e2e, execution-environment-parity-e2e, agentic-per-preset, deploy-writeback-e2e, multi-user-deploy-lifecycle-e2e, auth-perimeter-e2e, terminal-auth-multiuser-e2e, full-chain-auth-e2e, two-shape-boot-e2e, qmd-sidecar-e2e, jupyter-panel-e2e, target-switch-e2e, target-switch-agentic-e2e, va-live-e2e, plugin-smoke, canopy-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Not on cancel: a superseded run must not leave a red gate on the same sha.
    if: ${{ !cancelled() }}

    steps:
    - name: Check all jobs status
      # Every input goes through `env:`, never `${{ }}` in `run:` (script injection).
      env:
        NEEDS: ${{ toJSON(needs) }}
        ACTOR: ${{ github.actor }}
        HEAD_BRANCH: ${{ github.head_ref }}
        EVENT_NAME: ${{ github.event_name }}
        REVALIDATE: ${{ inputs.revalidate_secret_lanes }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HAS_FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
      run: |
        # A skip passes (the lane's `if:` did not match the event), but a revalidation must run every lane.
        passing='["success", "skipped"]'
        if [[ "$EVENT_NAME" == "workflow_dispatch" && "$REVALIDATE" == "true" ]]; then passing='["success"]'; fi
        summary=${GITHUB_STEP_SUMMARY:-/dev/null}
        {
          echo "| Job | Result |"
          echo "| --- | --- |"
          jq -nr --argjson needs "$NEEDS" '$needs | to_entries[] | "| \(.key) | \(.value.result) |"'
        } >> "$summary"

        if [[ "$ACTOR" == "dependabot[bot]" ]]; then
          hint="Dependabot runs get no secrets, so the API-key lanes skipped. After reviewing the diff, revalidate: \`gh workflow run ci.yml --ref $HEAD_BRANCH -f revalidate_secret_lanes=true\`"
        elif [[ "$EVENT_NAME" == "pull_request" && "$HAS_FULL_CI" != "true" ]]; then
          hint="The model-spending lanes run only under the full-ci label: \`gh pr edit $PR_NUMBER --add-label full-ci\`"
        fi
        if [[ -n "${hint:-}" ]]; then
          echo "ℹ️  $hint"
          printf '\n%s\n' "$hint" >> "$summary"
        fi

        bad=$(jq -nr --argjson needs "$NEEDS" --argjson ok "$passing" \
          '$needs | to_entries[] | select(.value.result | IN($ok[]) | not) | "❌ \(.key): \(.value.result)"')
        if [[ -n "$bad" ]]; then
          echo "$bad"
          exit 1
        fi
        echo "✅ All CI checks passed!"
