  nextcloud-talk-bridge-e2e:
    name: Nextcloud Talk Bridge E2E (real Talk server + dispatch stack)
    runs-on: ubuntu-latest
    # Only run on PRs from same repo (same house policy as every other
    # Docker-stack lane: secrets are unavailable on forks).
    # Secret-dependent lane: skips on Dependabot PRs, which get no Actions
    # secrets. Revalidate with the `revalidate_secret_lanes` dispatch input.
    if: >-
      (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.actor != 'dependabot[bot]')
      || (github.event_name == 'workflow_dispatch' && inputs.revalidate_secret_lanes)
    # A job-level `permissions:` block REPLACES the default token scopes rather
    # than extending them, so `contents: read` is restated alongside the
    # `packages: read` this lane actually needs: the Nextcloud Talk fixture is a
    # PRIVATE ghcr package and is not anonymously pullable.
    permissions:
      contents: read
      packages: read
    # Sized against the fixture's own published budgets, not a guess. Before a
    # single test body runs: the image pull (a fully provisioned Nextcloud, the
    # largest artifact any lane here fetches), then the container's first boot —
    # whose HEALTHCHECK declares a 240s start-period — behind the module's 300s
    # readiness wait. On top of that the module-scoped fixtures build a
    # dispatcher/worker project (a 600s subprocess cap) and wait 45s per /health,
    # and the four tests are each bounded by 90-150s polling budgets
    # (anchor/offset/run-id/bridge-join). Worst case lands near 40min; 45 leaves
    # headroom without letting a wedged poll burn a full hour of runner time.
    timeout-minutes: 45

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Log in to ghcr (openobserve mirror + Nextcloud Talk fixture)
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.11

    - name: Set up Docker Compose
      uses: docker/setup-compose-action@v2

    - name: Install osprey
      run: uv sync --extra dev

    - name: Pull the pinned Nextcloud Talk fixture image
      run: |
        # The e2e module deliberately never pulls or builds: it SKIPS when the
        # image is absent from the local store. Without this step the lane would
        # report green having run nothing, so the pull happens here and its
        # failure is the job's failure. The reference is read out of the module's
        # own constant rather than restated — a literal tag here would be one
        # more place for the pin to drift (tests/deployment/test_ci_workflow_wiring.py
        # binds that constant to the Dockerfile's authoritative FROM/ARG).
        IMAGE=$(uv run python -c 'import importlib.util as i, sys; s=i.spec_from_file_location("_nc","tests/e2e/test_nextcloud_talk_bridge_e2e.py"); m=i.module_from_spec(s); sys.modules["_nc"]=m; s.loader.exec_module(m); print(m.NEXTCLOUD_FIXTURE_IMAGE)')
        echo "Pulling fixture image: $IMAGE"
        docker pull "$IMAGE"

    - name: Pre-flight LLM endpoint reachability check
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
      run: |
        # Same probe as e2e-tests. The deterministic half of this module needs no
        # provider key (a dispatch is observed as "the dedup entry carries a
        # run_id", which the engine persists before any agent work), but the
        # agentic half in the same file reads real model output — so a dead
        # endpoint should fail here, not after ~20min of provisioning.
        if [ -z "${ALS_APG_API_KEY:-}" ]; then
          echo "❌ ALS_APG_API_KEY secret is not set on this runner"
          exit 1
        fi
        ALS_APG_PROBE_BASE="${ALS_APG_BASE_URL:-https://llm.gianlucamartino.com}"
        ALS_APG_PROBE_BASE="${ALS_APG_PROBE_BASE%/}"; ALS_APG_PROBE_BASE="${ALS_APG_PROBE_BASE%/v1}"
        HTTP_CODE=$(curl -sS -o /tmp/probe.txt -w "%{http_code}" --max-time 15 \
          -X POST "$ALS_APG_PROBE_BASE/v1/messages" \
          -H "Content-Type: application/json" \
          -H "anthropic-version: 2023-06-01" \
          -H "Authorization: Bearer $ALS_APG_API_KEY" \
          -d '{"model":"claude-haiku-4-5-20251001","max_tokens":4,"messages":[{"role":"user","content":"ping"}]}')
        if [ "$HTTP_CODE" != "200" ]; then
          echo "❌ ALS-APG endpoint probe failed (HTTP $HTTP_CODE)"
          head -c 500 /tmp/probe.txt; echo
          exit 1
        fi
        echo "✅ ALS-APG endpoint reachable (HTTP 200)"

    - name: Run Nextcloud Talk bridge E2E
      # Step cap under the job cap so a hang fails THIS step, leaving the
      # capture step below room to run. A job-level timeout is a hard cancel
      # that takes the container logs with it.
      timeout-minutes: 40
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
      run: |
        uv run pytest tests/e2e/test_nextcloud_talk_bridge_e2e.py -v --tb=short
    # On failure only: container logs, exit codes, `OOMKilled`, and runner
    # disk/memory state, uploaded as the `ci-diag-<lane>` artifact.
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: nextcloud-talk-bridge-e2e
        engine: docker


  gchat-bridge-e2e:
    name: Google Chat Bridge E2E (Pub/Sub emulator + dispatch stack)
    runs-on: ubuntu-latest
    # Only run on PRs from same repo (same house policy as every other
    # container-stack lane: secrets are unavailable on forks).
    # Secret-dependent lane: skips on Dependabot PRs, which get no Actions
    # secrets. Revalidate with the `revalidate_secret_lanes` dispatch input.
    if: >-
      (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.actor != 'dependabot[bot]')
      || (github.event_name == 'workflow_dispatch' && inputs.revalidate_secret_lanes)
    # A job-level `permissions:` block REPLACES the default token scopes rather
    # than extending them, so the one scope this lane needs is stated in full.
    # Unlike nextcloud-talk-bridge-e2e there is no `packages: read` here: the
    # only image is Google's PUBLIC cloud-sdk emulator, pulled anonymously from
    # gcr.io, so nothing in this job ever authenticates to ghcr.
    permissions:
      contents: read
    # Sized for a COLD run. Nothing caches the emulator image — this repo has no
    # docker-image cache idiom (the one actions/cache use is uv's download
    # cache), and a ~1 GB layer set is not worth round-tripping through it — so
    # the pull is paid in full on a runner that has never seen it, and the
    # fixture's own budget for that is 900s. Each pytest invocation then starts
    # its own emulator behind a 180s readiness wait, and this job runs two. On
    # top of that the module-scoped `osprey build` is capped at 600s, the
    # deterministic dispatch proofs poll to 90-300s each, and the agentic tier
    # adds real model round-trips. Warm, the deterministic tier is well under a
    # minute; 45 covers a cold pull without letting a wedged poll burn an hour
    # of runner time.
    timeout-minutes: 45
    env:
      # ubuntu-latest runners ship docker; the podman counterpart exists only
      # for the deploy-lifecycle pair. Both the fixture module and the e2e
      # module read this one variable and raise at import on any other value,
      # so setting it at job level keeps every step below on one runtime.
      OSPREY_E2E_RUNTIME: docker

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.11

    - name: Install osprey
      # `--extra gchat` is load-bearing, not tidiness: the e2e module drives a
      # REAL google-cloud-pubsub client against the emulator and skips its
      # entire pytestmark when that stack is missing — a green check over zero
      # executed tests. The zero-skip gate at the bottom of this job is the
      # backstop; this is the fix.
      run: uv sync --extra dev --extra gchat

    - name: Pull the Pub/Sub emulator image
      run: |
        # The fixture pulls this itself when absent, but a FAILED pull there is
        # a pytest.skip, not an error — so the pull happens here, where its
        # failure is the job's failure. The reference is read out of the
        # fixture's own constant rather than restated, so this step and the
        # fixture can never disagree about WHICH image the lane runs. It does
        # not make the lane reproducible: the tag is floating (`:emulators`),
        # and pinning it is the fixture's call to make — via its
        # OSPREY_E2E_GCHAT_PUBSUB_IMAGE override, which this step would then
        # follow for free.
        IMAGE=$(uv run python -c 'from tests.e2e.fixtures.gchat_pubsub_emulator import IMAGE; print(IMAGE)')
        echo "Pulling emulator image: $IMAGE"
        docker pull "$IMAGE"

    - name: Pre-flight LLM endpoint reachability check
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
      run: |
        # Same probe as e2e-tests. The deterministic tier of this module needs
        # no provider key (a dispatch is observed as "the dedup entry carries a
        # run_id", which the engine persists before any agent work), but the
        # agentic tier in the same file reads real model output — so a dead
        # endpoint should fail here, not after the emulator pull and a build.
        if [ -z "${ALS_APG_API_KEY:-}" ]; then
          echo "❌ ALS_APG_API_KEY secret is not set on this runner"
          exit 1
        fi
        ALS_APG_PROBE_BASE="${ALS_APG_BASE_URL:-https://llm.gianlucamartino.com}"
        ALS_APG_PROBE_BASE="${ALS_APG_PROBE_BASE%/}"; ALS_APG_PROBE_BASE="${ALS_APG_PROBE_BASE%/v1}"
        HTTP_CODE=$(curl -sS -o /tmp/probe.txt -w "%{http_code}" --max-time 15 \
          -X POST "$ALS_APG_PROBE_BASE/v1/messages" \
          -H "Content-Type: application/json" \
          -H "anthropic-version: 2023-06-01" \
          -H "Authorization: Bearer $ALS_APG_API_KEY" \
          -d '{"model":"claude-haiku-4-5-20251001","max_tokens":4,"messages":[{"role":"user","content":"ping"}]}')
        if [ "$HTTP_CODE" != "200" ]; then
          echo "❌ ALS-APG endpoint probe failed (HTTP $HTTP_CODE)"
          head -c 500 /tmp/probe.txt; echo
          exit 1
        fi
        echo "✅ ALS-APG endpoint reachable (HTTP 200)"

    # The two pytest runs below are deliberately SEPARATE steps, and neither
    # uses xdist. Both files reach the same fixed-name emulator container
    # (osprey-e2e-gchat-pubsub) whose start pre-cleans that exact name, so they
    # must never overlap; separate steps are separate processes that Actions
    # runs strictly in order, which makes that a property of the job rather
    # than a property of pytest's collection order. Fixtures go first so a
    # broken fake fails before the full stack is provisioned.
    - name: Run Google Chat fixture smoke tests
      run: |
        uv run pytest tests/e2e/fixtures/test_gchat_fixture_smoke.py -v --tb=short \
          --junitxml=junit-gchat-fixture-smoke.xml

    - name: Run Google Chat bridge E2E
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
      run: |
        uv run pytest tests/e2e/test_gchat_bridge_e2e.py -v --tb=short \
          --junitxml=junit-gchat-bridge-e2e.xml

    - name: Fail the lane on any skipped test
      run: |
        # Every way this lane can skip is a CI misconfiguration, not a
        # legitimate environment gap: no container runtime, no emulator image,
        # no `gchat` extra, no provider key. Each of those turns the job into a
        # green check that executed nothing, and pytest's exit code cannot
        # express the difference. So the junit XML both runs above wrote is
        # read here: zero skips, and a non-zero test count so an empty
        # selection cannot pass either.
        uv run python - <<'PY'
        import sys
        import xml.etree.ElementTree as ET

        failed = False
        for report in ("junit-gchat-fixture-smoke.xml", "junit-gchat-bridge-e2e.xml"):
            total = skipped = 0
            for suite in ET.parse(report).getroot().iter("testsuite"):
                total += int(suite.get("tests", 0))
                skipped += int(suite.get("skipped", 0))
            print(f"{report}: {total} test(s), {skipped} skipped")
            if total == 0:
                print(f"::error::{report} collected no tests")
                failed = True
            if skipped:
                print(f"::error::{report} reports {skipped} skipped test(s)")
                failed = True
        if failed:
            sys.exit(1)
        print("✅ every Google Chat test ran; none skipped")
        PY
    # On failure only: container logs, exit codes, `OOMKilled`, and runner
    # disk/memory state, uploaded as the `ci-diag-<lane>` artifact.
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: gchat-bridge-e2e
        engine: docker


  dockerfile-e2e:
    name: Dockerfile E2E (generated container image)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Only run on PRs from same repo (mirrors deploy-e2e gating)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.11

    - name: Install osprey
      run: uv sync --extra dev

    - name: Run Dockerfile E2E
      timeout-minutes: 55
      env:
        # Install the PR branch inside the image (not the PyPI release) so
        # the generated Dockerfile is tested against the code under review.
        OSPREY_E2E_PIP_SPEC: git+https://github.com/${{ github.repository }}.git@${{ github.event.pull_request.head.sha }}
        # Drives the real-LLM round-trip in test_generated_image_serves_agent_
        # over_http (injected into the container at run time). The build/boot
        # test needs no key; the HTTP test auto-skips (requires_als_apg) if the
        # secret is ever absent, so this stays advisory and self-gating.
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
      run: uv run pytest tests/e2e/test_dockerfile_e2e.py -v --tb=short

    # ── the proxied build ────────────────────────────────────────────────────
    # Every template Dockerfile opens each apt-using RUN with
    #   export http_proxy="${http_proxy:-${HTTP_PROXY:-}}" …
    # because apt reads only the lowercase names, while a facility hands its
    # proxy to a build as the uppercase ones. The steps below are the
    # empirical proof that this bridge works, and what they assert is the
    # PROXY'S ACCESS LOG, never the build's exit status: this runner has open
    # egress, so a build whose bridge was deleted would quietly fetch straight
    # past the proxy and still exit 0.
    #
    # `set -euo pipefail` is spelled out in every step: GitHub's default shell
    # is `bash -e`, without pipefail, so a masked failure inside a pipeline
    # would report the last command's status and green the lane.
    - name: Start a logging forward proxy (tinyproxy)
      # No Allow/Deny lines: with no ACL at all tinyproxy accepts every client,
      # which is what a single-use proxy on an ephemeral runner wants and keeps
      # a CIDR out of the parse path. No Listen either — the default is every
      # interface. `LogLevel Info` is load-bearing rather than chatty: the
      # request line that names the TARGET host ("Request (fd N): CONNECT
      # deb.debian.org:443") is logged at Info, and the assertion below reads
      # exactly that. The log file is pre-created by this (unprivileged) user
      # so the root process inside the container appends to a file the later
      # grep can still read.
      run: |
        set -euo pipefail
        rm -rf /tmp/osprey-proxy
        mkdir -p /tmp/osprey-proxy
        cat > /tmp/osprey-proxy/tinyproxy.conf <<'CONF'
        Port 8888
        Timeout 600
        MaxClients 100
        LogLevel Info
        LogFile "/proxy/access.log"
        CONF
        : > /tmp/osprey-proxy/access.log
        chmod 666 /tmp/osprey-proxy/access.log
        docker run -d --name osprey-ci-proxy --network host \
          -v /tmp/osprey-proxy:/proxy debian:bookworm-slim \
          sh -c 'apt-get update -qq \
                 && apt-get install -y -qq --no-install-recommends tinyproxy \
                 && exec tinyproxy -d -c /proxy/tinyproxy.conf'
        # Readiness is a bare TCP connect, deliberately: a probe that FETCHED
        # anything through the proxy would write that host into the access log
        # the assertion step reads, and could satisfy it on its own.
        for _ in $(seq 60); do
          if (exec 3<>/dev/tcp/127.0.0.1/8888) 2>/dev/null; then
            echo "✅ tinyproxy is listening on 127.0.0.1:8888"
            exit 0
          fi
          sleep 2
        done
        echo "❌ tinyproxy never came up on 127.0.0.1:8888"
        docker logs osprey-ci-proxy || true
        exit 1

    - name: Assert the uppercase-only proxy contract reaches the build
      # The bridge is only worth proving on a runtime that does NOT already
      # hand the RUN step a lowercase copy of its own. Docker's BuildKit does
      # exactly that — measured: `--build-arg HTTP_PROXY=…` arrives inside RUN
      # as BOTH `HTTP_PROXY` and `http_proxy` — so a docker build would satisfy
      # the log assertion below with the bridge deleted. Podman (buildah)
      # passes the names it is given, which is why the build step uses podman;
      # this probe pins that property on the runner instead of trusting it. If
      # a future podman starts duplicating the case, the lane fails HERE rather
      # than greening over a proof that no longer proves anything.
      #
      # The probe Dockerfile deliberately declares no ARG: the proxy names are
      # predeclared build args, and that is the shape the real Dockerfile
      # relies on. Its base image is fully qualified so nothing here depends on
      # podman's short-name resolution.
      run: |
        set -euo pipefail
        rm -rf /tmp/osprey-proxy-probe
        mkdir -p /tmp/osprey-proxy-probe
        cat > /tmp/osprey-proxy-probe/Dockerfile <<'PROBE'
        FROM docker.io/library/busybox
        RUN env | sort | grep -i proxy || echo "NO-PROXY-ENV"
        PROBE
        out="$(podman build --no-cache --http-proxy=false \
          --build-arg HTTP_PROXY=http://127.0.0.1:8888 \
          --build-arg HTTPS_PROXY=http://127.0.0.1:8888 \
          /tmp/osprey-proxy-probe 2>&1)"
        printf '%s\n' "$out"
        if ! grep -q 'HTTP_PROXY=http://127.0.0.1:8888' <<<"$out"; then
          echo "❌ the uppercase HTTP_PROXY build-arg never reached the RUN environment"
          exit 1
        fi
        if grep -q 'http_proxy=' <<<"$out"; then
          echo "❌ this build runtime injects a lowercase proxy variable of its own —"
          echo "   the access-log assertion would then pass with the Dockerfile's"
          echo "   lowercase bridge deleted, i.e. it would prove nothing."
          exit 1
        fi
        echo "✅ uppercase in, uppercase only — the bridge is the sole path to apt"

    - name: Build the web-terminal auth sidecar through the proxy
      # A staged copy of the template directory, not the directory in place:
      # `osprey up --dev` stages an `osprey-local-requirements.txt` beside the
      # Dockerfile and the COPY that picks it up is an optional glob. Staging an
      # empty one keeps that glob's cross-runtime behaviour out of this lane, so
      # the proxy bridge stays the only thing that can fail here.
      #
      # OSPREY_VERSION is required by the Dockerfile (it exits non-zero when
      # empty) and OSPREY_DEV=1 is what lets a branch version that is not on
      # PyPI fall back to an unpinned prime — the same pair `osprey up --dev`
      # passes. Either way pip talks to PyPI, which is the second half of the
      # assertion below.
      #
      # `--http-proxy=false` turns off buildah's copy of the HOST's proxy
      # variables, so the two build-args are the only proxy values in the
      # build. That, and their case, is the contract under test.
      timeout-minutes: 15
      run: |
        set -euo pipefail
        version="$(uv run --no-sync python -c 'import osprey; print(osprey.__version__)')"
        echo "OSPREY_VERSION=$version"
        rm -rf /tmp/osprey-sidecar-ctx
        mkdir -p /tmp/osprey-sidecar-ctx
        cp -a src/osprey/templates/modules/web_terminals/auth_sidecar/. /tmp/osprey-sidecar-ctx/
        : > /tmp/osprey-sidecar-ctx/osprey-local-requirements.txt
        podman build --no-cache --network=host --http-proxy=false \
          --build-arg HTTP_PROXY=http://127.0.0.1:8888 \
          --build-arg HTTPS_PROXY=http://127.0.0.1:8888 \
          --build-arg OSPREY_VERSION="$version" \
          --build-arg OSPREY_DEV=1 \
          --tag osprey-auth-sidecar:proxied-ci \
          /tmp/osprey-sidecar-ctx

    - name: Assert apt and pip traffic went through the proxy
      # The point of the whole sequence. Two host classes, checked separately
      # because they prove different things: the apt host proves the lowercase
      # bridge (apt reads no uppercase name, so its traffic can only be proxied
      # via the export), and the pip host proves the proxy was engaged for the
      # framework install as well. Matched lines are printed for the job log.
      # Every grep is a plain file read into a variable — no pipelines whose
      # status could be swallowed, and no `head` downstream of a producer.
      run: |
        set -euo pipefail
        log=/tmp/osprey-proxy/access.log
        if [ ! -s "$log" ]; then
          echo "❌ proxy access log missing or empty at $log — nothing was proxied at all"
          docker logs osprey-ci-proxy || true
          exit 1
        fi
        apt_hits="$(grep -F 'deb.debian.org' "$log" || true)"
        pip_hits="$(grep -E 'pypi\.org|files\.pythonhosted\.org' "$log" || true)"
        echo "── apt traffic seen by the proxy ──────────────────────────────"
        head -n 20 <<<"${apt_hits:-<none>}"
        echo "── pip traffic seen by the proxy ──────────────────────────────"
        head -n 20 <<<"${pip_hits:-<none>}"
        if [ -z "$apt_hits" ]; then
          echo "❌ no deb.debian.org request reached the proxy: the lowercase-proxy"
          echo "   bridge in the auth-sidecar Dockerfile is not doing its job."
          exit 1
        fi
        if [ -z "$pip_hits" ]; then
          echo "❌ no pypi.org / files.pythonhosted.org request reached the proxy:"
          echo "   the framework install bypassed it."
          exit 1
        fi
        echo "✅ both apt and pip traffic went through the proxy"

    # On failure only: container logs, exit codes, `OOMKilled`, and runner
    # disk/memory state, uploaded as the `ci-diag-<lane>` artifact.
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: dockerfile-e2e
        engine: docker

    - name: Stop the forward proxy
      # `always()`: the proxy is a fixed-name container on a shared runner, and
      # a failed assertion above must not leave it holding port 8888 for
      # whatever runs next. The log tail is printed here because it is the one
      # diagnostic that explains any failure in this sequence.
      #
      # Last, deliberately — AFTER the capture step above. Teardown removes the
      # container whose logs that step exists to collect, so the order is the
      # difference between a diagnosable red lane and an empty artifact.
      if: always()
      run: |
        set -euo pipefail
        if [ -f /tmp/osprey-proxy/access.log ]; then
          echo "── last 40 proxy access-log lines ─────────────────────────────"
          tail -n 40 /tmp/osprey-proxy/access.log || true
        fi
        docker rm -f osprey-ci-proxy > /dev/null 2>&1 || true


  execution-environment-parity-e2e:
    name: Execution Environment Parity E2E (host venv vs generated image)
    runs-on: ubuntu-latest
    # Same-repo PRs only — house policy for any extra Docker-build-and-deploy
    # job. This one needs no secrets: it builds an image and runs `print(2+2)`
    # through the python-executor path; no LLM is called anywhere in the file.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    # Must exceed the test's own BUILD_TIMEOUT (1200s) plus checkout, uv sync,
    # the wheel build and four container runs — so a slow-but-progressing build
    # is killed by the test (which prints the docker log) rather than silently
    # by this cap.
    timeout-minutes: 40

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.11

    # Installs osprey editable + the `build` package, which is what lets the
    # test stage a wheel from this checkout into the image build context. That
    # staging is load-bearing: without it the image would install the released
    # PyPI osprey and the parity assertions would describe released code
    # instead of the branch under review.
    - name: Install osprey
      run: uv sync --extra dev

    - name: Run execution environment parity E2E
      # Step cap under the job cap so a hang fails THIS step, leaving the
      # capture step below room to run. A job-level timeout is a hard cancel
      # that takes the container logs with it.
      timeout-minutes: 35
      run: |
        uv run pytest tests/e2e/test_execution_environment_parity.py -v --tb=short
    # On failure only: container logs, exit codes, `OOMKilled`, and runner
    # disk/memory state, uploaded as the `ci-diag-<lane>` artifact.
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: execution-environment-parity-e2e
        engine: docker


  deploy-writeback-e2e:
    name: Deploy Write-Back E2E (profile-owned secrets across a rebuild)
    runs-on: ubuntu-latest
    # Only run on PRs from same repo (mirrors deploy-e2e gating). Unlike the
    # lifecycle lanes this is scoped to every same-repo PR rather than PRs into
    # main: it builds no image and runs no destructive verb — it deploys two
    # public upstream stores under project names it owns outright and tears
    # them down in a `finally` — so it is cheap enough to gate every PR that
    # can touch the build/deploy/profile path. No secrets: nothing here reaches
    # an LLM.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    # The workflow-level OSPREY_OPENOBSERVE_IMAGE points the compose template
    # at the ghcr mirror; the pull needs this login, exactly as every other
    # openobserve-deploying lane does.
    - name: Log in to ghcr (openobserve mirror)
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.11

    - name: Set up Docker Compose
      uses: docker/setup-compose-action@v2

    - name: Install osprey
      run: uv sync --extra dev

    - name: Run deploy write-back E2E
      # Step cap under the job cap so a hang fails THIS step, leaving the
      # capture step below room to run. A job-level timeout is a hard cancel
      # that takes the container logs with it.
      timeout-minutes: 15
      run: |
        uv run pytest tests/e2e/test_deploy_writeback_e2e.py -v --tb=short

    # Runs BEFORE the teardown below: the cleanup step deletes the very
    # containers whose logs explain the failure. Read-only capture; the
    # artifact is `ci-diag-<lane>` on the run's summary page.
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: deploy-writeback-e2e
        engine: docker

    # Belt-and-suspenders on top of each test's own try/finally teardown: every
    # resource named here is exact (never a prune/-a/wildcard), matching
    # tests/e2e/test_deploy_writeback_e2e.py's own container-ops safety
    # guardrail.
    - name: Clean up any stranded write-back-e2e resources
      if: always()
      run: |
        for case in profile divergent orphan persona; do
          project="osprey-e2e-wb-${case}"
          docker rm -f "${project}-openobserve" || true
          docker rm -f "${project}-ariel-postgres" || true
          docker compose -p "$project" down || true
          docker volume rm "${project}_openobserve_data" || true
          docker volume rm "${project}_ariel_postgres_data" || true
        done

  multi-user-deploy-lifecycle-e2e:
    name: Multi-User Deploy Lifecycle E2E (PRs into main, real container runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Runs on every same-repo PR whose BASE is main — which is every ordinary
    # PR, but not per-phase PRs inside an epic (those target epic/* and skip
    # it, matching how the epic workflow scopes its heavier gates; the job
    # then runs once at the epic→main boundary). Scoped this way because it
    # drives REAL, destructive container/volume lifecycle operations
    # (decommission/prune/nuke) against the runtime.
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.11

    - name: Set up Docker Compose
      uses: docker/setup-compose-action@v2

    - name: Install osprey
      run: uv sync --extra dev

    - name: Run multi-user deploy lifecycle E2E
      timeout-minutes: 55
      # `-m 'not qmd'` deselects the shared-bundle/sidecar test, which REFUSES
      # to skip when no qmd sidecar image is present (a skip there would report
      # success having proved nothing). This lane neither builds nor loads one,
      # so it would fail on a missing image rather than on a real defect. That
      # test is reached from the qmd-sidecar-e2e lane, which builds the image.
      run: |
        uv run pytest tests/e2e/test_deploy_lifecycle.py -m 'not qmd' -v --tb=short

    # Runs BEFORE the teardown below: the cleanup step deletes the very
    # containers whose logs explain the failure. Read-only capture; the
    # artifact is `ci-diag-<lane>` on the run's summary page.
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: multi-user-deploy-lifecycle-e2e
        engine: docker

    # Belt-and-suspenders on top of the test's own try/finally teardown: every
    # resource named here is exact (never a prune/-a/wildcard), matching
    # tests/e2e/test_deploy_lifecycle.py's own container-ops safety guardrail.
    - name: Clean up any stranded lifecycle-e2e resources
      if: always()
      run: |
        for user in alice bob carol dave erin; do
          docker rm -f "e2e-web-${user}" || true
          docker volume rm "osprey-e2e-mus-p3_${user}-claude-config" || true
          docker volume rm "osprey-e2e-mus-p3_${user}-agent-data" || true
        done
        docker rm -f e2e-nginx || true
        docker rm -f osprey-e2e-mus-p3-registry || true
        docker compose -p osprey-e2e-mus-p3 down || true

  auth-perimeter-e2e:
    name: Auth Perimeter E2E (real sidecar image + nginx auth_request)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Same PR scoping as the lifecycle lanes above: same-repo PRs into main
    # only, since this drives real container lifecycle against the runtime.
    #
    # DELIBERATELY ITS OWN LANE. This is the only job in the repo that builds
    # the deployed auth-sidecar Dockerfile, which is a real
    # `pip install osprey-framework` with a C toolchain — minutes, cold, every
    # run. The multi-user lifecycle lanes are all-stub and fast; folding this
    # into them would have made every lifecycle run pay that build. Keeping it
    # separate also means the cost shows up on its own line rather than as an
    # unexplained slowdown in a neighbouring job.
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.11

    - name: Set up Docker Compose
      uses: docker/setup-compose-action@v2

    - name: Install osprey
      run: uv sync --extra dev

    # `osprey up --dev` builds the sidecar image and stages a locally-built
    # wheel into its context, so the whole run exercises THIS branch's code
    # rather than a published release.
    - name: Run auth perimeter E2E
      timeout-minutes: 55
      run: |
        uv run pytest tests/e2e/web_terminals/test_auth_perimeter.py -v --tb=short

    # Runs BEFORE the teardown below: the cleanup step deletes the very
    # containers whose logs explain the failure. Read-only capture; the
    # artifact is `ci-diag-<lane>` on the run's summary page.
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: auth-perimeter-e2e
        engine: docker

    # Belt-and-suspenders on top of the test's own try/finally teardown. Every
    # resource named here is exact — never a prune, an -a/--all sweep, or a
    # wildcard — matching the test module's container-ops safety guardrail.
    - name: Clean up any stranded auth-perimeter resources
      if: always()
      run: |
        for user in alice bob; do
          docker rm -f "authe2e-web-${user}" || true
          docker volume rm "osprey-e2e-auth-perimeter_${user}-claude-config" || true
          docker volume rm "osprey-e2e-auth-perimeter_${user}-agent-data" || true
        done
        docker rm -f authe2e-auth || true
        docker rm -f authe2e-nginx || true
        docker compose -p osprey-e2e-auth-perimeter down || true
        docker rmi -f authe2e-assistant-auth:local || true
