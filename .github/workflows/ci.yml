          tests/interfaces/web_terminal/test_feedback_rail_browser.py \
          tests/interfaces/web_terminal/test_feedback_modal_browser.py \
          tests/interfaces/web_terminal/test_watchdog_dialog_browser.py \
          tests/interfaces/web_terminal/test_posture_toggle_browser.py \
