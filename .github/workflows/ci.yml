name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, 'epic/**' ]
    # `labeled`: so applying the `full-ci` label starts a run.
    types: [ opened, synchronize, reopened, labeled ]
  workflow_dispatch:
    inputs:
      e2e_filter:
        description: >-
          Optional pytest path/keyword filter for the E2E job (debug-only;
          PR runs always use the full suite). Example:
          'tests/e2e/test_rf_cavity_correlation_scenario.py
          tests/e2e/test_vacuum_burst_scenario.py'
        required: false
        default: ''
      run_benchmarks:
        description: >-
          Run the on-demand benchmark lanes (channel-finder MCP benchmarks
          and the Tier 2 model benchmark) instead of the E2E lane. The home for e2e suites that are useful
          but too expensive to run on every PR — trigger before a release or
          after touching the code they exercise.
        required: false
        type: boolean
        default: false
      revalidate_secret_lanes:
        description: >-
          Run the API-key-dependent lanes (agentic flows, dispatch stacks,
          the build+deploy pipeline, Nextcloud/Google Chat bridges) against
          this ref. Dependabot's own
          runs are treated as fork runs and receive only the Dependabot
          secret store, so ALS_APG_API_KEY is empty and those lanes skip on
          its pull requests. After reading the dependency diff, a maintainer
          revalidates the branch with:
          gh workflow run ci.yml --ref <branch> -f revalidate_secret_lanes=true
          The same dispatch with --ref main is how main gets every lane a
          push skips: main-full-ci.yml starts it once a day when main has
          moved, and a maintainer can start it by hand.
        required: false
        type: boolean
        default: false

# Model-spending lanes (LANES in scripts/repo_checks.py, why="models") run only on a same-repo,
# non-Dependabot PR labelled `full-ci`, or on a `revalidate_secret_lanes` dispatch (nightly on main).

concurrency:
  group: ci-${{ github.workflow }}-${{ (github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)) || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

# Read-only by default. A job `permissions:` block replaces this one, so a job that needs more restates
# `contents: read` beside it.
permissions:
  contents: read

# Every `uv sync` carries `--locked` and every `uv run` follows one; test_ci_workflow_wiring.py holds this.
# Every external action is pinned by commit SHA, and no `run:` holds `${{ }}` (values go through `env:`);
# test_ci_workflow_wiring.py holds both.

env:
  # No literal default: a fork points at its own gateway through the repository variable.
  ALS_APG_BASE_URL: ${{ vars.ALS_APG_BASE_URL }}
  # A literal, not a vars. lookup: an unset variable would refuse every e2e lane.
  OSPREY_E2E_PROVIDER: als-apg
  OSPREY_E2E_FORCE_MODEL: claude-haiku-5-5
  OSPREY_E2E_JUDGE_MODEL: claude-haiku-5-5
  OSPREY_CI_DIAG_DIR: ci-diag

# Repeated steps are YAML anchors (`- &name`) reused as aliases (`- *name`): editing one edits every lane.
# A job cap without a reason beside it is about 3x the p90 of green main runs (Nov 2026), never under
# 10 minutes, and a capped step sits below it; a job with no such data keeps 60.
jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }} (${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    # Generous on purpose: runtime varies by runner, and a cap at the healthy runtime reds healthy runs.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.14']
        os: [ubuntu-latest]
        # Shards are defined by the pytest check; a new test directory lands in rest-b.
        # test_ci_workflow_wiring.py holds that the shards cover tests/ exactly once.
        shard: [cli-a, cli-b, rest-a, rest-b, rest-c]
        # macOS is one job running only _MACOS_RUNS (repo_checks.py): the account's macOS ceiling is 5 jobs.
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"python-version":"3.12","os":"macos-latest","shard":"macos"}]' || '[{"python-version":"3.11","os":"macos-latest","shard":"macos"},{"python-version":"3.12","os":"macos-latest","shard":"macos"}]') }}
        # PRs run 3.12 only, except `full-ci` and Dependabot PRs; serial-suites carries the same exclude.
        exclude: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && '[{"python-version":"3.11"},{"python-version":"3.14"}]' || '[]') }}

    steps:
    # No job but visual-baselines-push pushes, so no other checkout leaves the token in the git config.
    - &checkout-full-history
      name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - &install-uv-matrix-python
      name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      # virtual-accelerator: the live CA suites SKIP without it (test_live_ca_venue_guard.py reds that).
      run: uv sync --locked --extra dev --extra virtual-accelerator

    - &install-pinned-cli
      name: Install the pinned Claude Code CLI
      uses: ./.github/actions/install-pinned-claude-code

    - name: Run unit tests
      # Below the job cap: a job timeout is a hard cancel that skips the diagnostics steps.
      timeout-minutes: 70
      env:
        COVERAGE_CORE: sysmon
        # Not /tmp: on Ubuntu 26.04 it is a ~6.3 GB tmpfs quota (runner-images#14777) the suite's venvs overflow.
        TMPDIR: ${{ runner.temp }}
        PYTHON_VERSION: ${{ matrix.python-version }}
        MATRIX_OS: ${{ matrix.os }}
        SHARD: ${{ matrix.shard }}
      # Coverage on 3.12/ubuntu only (sys.monitoring makes it ~free); this guard and the Codecov `if:` must
      # match (test_ci_workflow_wiring.py). --dist loadgroup relies on FileOrGroupScheduling in tests/conftest.py.
      run: |
        if [ "$PYTHON_VERSION" = "3.12" ] && [ "$MATRIX_OS" = "ubuntu-latest" ]; then
          COV_ARGS="--cov=src/osprey --cov=packages/osprey-connectors/src/osprey_connectors --cov=packages/osprey-optimizer/src/osprey_optimizer --cov=packages/pyaml-cs-osprey/src/pyaml_cs_osprey --cov-report=xml"
        else
          COV_ARGS=""
        fi
        # No faulthandler_timeout: its GIL-less watchdog segfaulted workers inside YAML/Jinja parsers.
        # --timeout here, not in the ini, which would bind the e2e lanes too. `signal`, not `thread`: the
        # thread method kills the xdist worker and wedges the scheduler.
        mkdir -p ci-diag
        set -o pipefail
        # $COV_ARGS is empty or several flags: split on purpose.
        # shellcheck disable=SC2086
        uv run python scripts/check.py run pytest --shard "$SHARD" -- --durations=50 --timeout=600 --timeout-method=signal -n 4 $COV_ARGS 2>&1 | tee ci-diag/pytest.log
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          grep -m1 '^CANOPY contract not exercised here' ci-diag/pytest.log >> "$GITHUB_STEP_SUMMARY" || true
        fi

    - name: Readonly gate under Python 3.14
      # The readonly gate needs the OS-specific lazy native loads warmed first; `--isolated` leaves the 3.12 .venv.
      if: matrix.os == 'macos-latest' && matrix.python-version == '3.12' && matrix.shard == 'macos'
      timeout-minutes: 15
      run: uv run python scripts/check.py run readonly-warmups-py314

    - name: Summarise lane diagnostics
      if: always()
      # `python3`, not `uv run`: it still reports when the install failed.
      run: python3 scripts/ci/diag_summary.py ci-diag >> "$GITHUB_STEP_SUMMARY" || true

    - name: Upload lane diagnostics
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: ci-diag-unit-${{ matrix.python-version }}-${{ matrix.os }}-${{ matrix.shard }}
        path: ci-diag/
        retention-days: 14
        if-no-files-found: warn

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
      if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella-${{ matrix.shard }}
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  serial-suites:
    name: Serial suites Python ${{ matrix.python-version }} on ubuntu-latest
    runs-on: ubuntu-latest
    # Suites that must not share a runner (they time the box or need their own process). The job cap is
    # the step caps plus setup; test_ci_workflow_wiring.py holds the sum.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.14']
        exclude: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && '[{"python-version":"3.11"},{"python-version":"3.14"}]' || '[]') }}

    steps:
    - *checkout-full-history

    - *install-uv-matrix-python

    - name: Install dependencies
      run: uv sync --locked --extra dev --extra virtual-accelerator

    - *install-pinned-cli

    - name: Run real-terminal pty suite serially
      timeout-minutes: 10
      run: uv run python scripts/check.py run pytest-pty

    - name: Run the wall-clock budgets serially
      timeout-minutes: 15
      run: uv run python scripts/check.py run pytest-wallclock-unit

    - name: Run live Channel Access suites in isolation
      # After the timing steps, so its load is not measured.
      if: runner.os == 'Linux'
      timeout-minutes: 25
      run: uv run python scripts/check.py run live-ca

  dependency-floor:
    name: Archiver suite at the declared dependency floor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - &checkout
      name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    # `python-version` sets UV_PYTHON for every later step of the job.
    - &install-uv
      name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      with:
        enable-cache: true
        python-version: '3.11'

    - &sync-dev-deps
      name: Install dependencies
      run: uv sync --locked --extra dev

    - name: Pin pandas and numpy to the declared floor
      # After `uv sync`, which would resolve them back up.
      run: uv pip install "pandas==2.2.3" "numpy==2.2.6"

    - name: Show resolved versions
      run: uv run --no-sync python -c "import pandas, numpy; print('pandas', pandas.__version__, 'numpy', numpy.__version__)"

    - name: Run the archiver suite
      # `--no-sync` keeps the pin: a bare `uv run` re-syncs and undoes it.
      run: |
        uv run --no-sync pytest \
          packages/osprey-connectors/tests/osprey_connectors_tests/test_archiver_timerange.py \
          packages/osprey-connectors/tests/osprey_connectors_tests/test_epics_archiver_connector.py \
          packages/osprey-connectors/tests/osprey_connectors_tests/test_doocs_archiver_connector.py \
          packages/osprey-connectors/tests/osprey_connectors_tests/test_mya_archiver_connector.py \
          tests/connectors/test_mya_registration.py \
          tests/connectors/test_mock_connector.py \
          tests/connectors/test_archiver_timezone.py \
          tests/connectors/test_simulation_integration.py \
          tests/utils/test_timeseries.py \
          -v --tb=short

  optimizer:
    name: Optimizer service (engine + real Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The `service` extra is installed only here, so the `test` lanes skip its engine suite.
    steps:
    - *checkout

    - *install-uv

    - name: Install redis-server
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends redis-server

    - name: Install dependencies
      # --all-packages so --extra service reaches the workspace member that defines it.
      run: uv sync --locked --all-packages --extra dev --extra service

    - name: Run the optimizer suite
      timeout-minutes: 25
      run: >-
        uv run --no-sync pytest tests/optimizer -v --tb=short -n 2 --dist loadgroup
        --timeout=600 --timeout-method=signal
        --cov=packages/osprey-optimizer/src/osprey_optimizer --cov-report=xml --cov-report=term

    - &capture-diagnostics
      name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-optimizer
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  connectors-standalone:
    name: Connectors suite without the framework
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - *checkout-full-history

    - *install-uv

    - name: Install the connectors package alone
      run: uv sync --locked --package osprey-connectors

    - name: Refuse an environment that holds the framework
      run: >-
        uv run --no-sync python -c "import importlib.metadata as m, importlib.util as u, sys;
        sys.exit('osprey-framework is installed' if u.find_spec('osprey')
        or any(d.name == 'osprey-framework' for d in m.distributions()) else 0)"

    - name: Run the connectors suite
      # `-c` makes the package the rootdir, so the framework's conftest never loads.
      run: >-
        uv run --no-sync pytest -c packages/osprey-connectors/pyproject.toml
        packages/osprey-connectors/tests -n 4 --dist loadgroup
        --timeout=600 --timeout-method=signal

    - *capture-diagnostics

  # Lane A holds HEAD connectors to every supported framework release; Lane B holds HEAD framework to
  # its connectors floor. Both stand down until data lifts them (scripts/ci/connectors_compat_matrix.py).
  connectors-compat-plan:
    name: Plan the connectors compatibility lanes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      floor: ${{ steps.plan.outputs.floor }}
      floor-applicable: ${{ steps.plan.outputs.floor-applicable }}
    steps:
    - *checkout-full-history

    - name: Read the supported releases and the connectors floor
      id: plan
      run: python3 scripts/ci/connectors_compat_matrix.py github-output

  connectors-compat:
    name: Connectors HEAD under framework ${{ matrix.framework || '(none listed)' }}
    needs: connectors-compat-plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.connectors-compat-plan.outputs.matrix) }}
    env:
      FRAMEWORK: ${{ matrix.framework }}
      # Outside the checkout, so nothing of this tree is importable from it.
      COMPAT_VENV: /tmp/connectors-compat
    steps:
    - name: Stand down while no framework release is listed
      if: matrix.framework == ''
      env:
        REASON: ${{ matrix.reason }}
      run: echo "$REASON"

    - name: Checkout repository
      if: matrix.framework != ''
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Tags: the wheel's version comes from the git tag.
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Install uv
      if: matrix.framework != ''
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      with:
        enable-cache: true
        python-version: '3.11'

    - name: Build the connectors wheel at HEAD
      if: matrix.framework != ''
      run: uv build --package osprey-connectors --wheel --out-dir dist/

    - name: Install the framework release from PyPI with the HEAD connectors
      if: matrix.framework != ''
      run: >-
        python3 scripts/ci/connectors_compat_lane.py install
        --venv "$COMPAT_VENV" --framework "$FRAMEWORK" --connectors head

    - name: Check the release against the connectors
      if: matrix.framework != ''
      run: >-
        python3 scripts/ci/connectors_compat_lane.py check
        --venv "$COMPAT_VENV" --workdir "$RUNNER_TEMP/contracts"

  framework-at-connectors-floor:
    name: Framework HEAD at its declared connectors floor
    needs: connectors-compat-plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # pyaml-cs-osprey and osprey-optimizer are named by path: `--no-sources-package` alone leaves workspace
    # sources a `uv pip install` refuses, and the optimizer is not on PyPI.
    env:
      FLOOR: ${{ needs.connectors-compat-plan.outputs.floor }}
    steps:
    - name: Stand down while the floor predates the independent releases
      if: needs.connectors-compat-plan.outputs.floor-applicable != 'true'
      run: |
        echo "not applicable yet: the connectors floor $FLOOR predates the first independent"
        echo "osprey-connectors release (FIRST_INDEPENDENT_CONNECTORS in scripts/ci/connectors_compat_matrix.py)"

    - name: Checkout repository
      if: needs.connectors-compat-plan.outputs.floor-applicable == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Install uv
      if: needs.connectors-compat-plan.outputs.floor-applicable == 'true'
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      with:
        enable-cache: true
        python-version: '3.11'

    - name: Install the framework with the floor connectors
      if: needs.connectors-compat-plan.outputs.floor-applicable == 'true'
      run: |
        uv venv
        uv pip install --no-sources -e ".[dev]" -e ./packages/pyaml-cs-osprey -e ./packages/osprey-optimizer "osprey-connectors==$FLOOR"

    - name: Hold the lane to the floor connectors from site-packages
      if: needs.connectors-compat-plan.outputs.floor-applicable == 'true'
      run: >-
        python3 scripts/ci/connectors_compat_lane.py assert-installed
        --python .venv/bin/python --module osprey_connectors --connectors-version "$FLOOR"

    - name: Scan the framework for connectors names the floor lacks
      if: needs.connectors-compat-plan.outputs.floor-applicable == 'true'
      run: >-
        .venv/bin/python -I
        packages/osprey-connectors/tests/osprey_connectors_tests/compat/scan_framework_imports.py
        src/osprey packages/pyaml-cs-osprey/src/pyaml_cs_osprey

    - name: Run the connector-facing framework suites at the floor
      if: needs.connectors-compat-plan.outputs.floor-applicable == 'true'
      run: >-
        python3 scripts/ci/connectors_compat_lane.py pytest
        --python .venv/bin/python --installed osprey_connectors --
        tests/connectors tests/registry
        -m "not pty and not wallclock" -n 4 --dist loadgroup
        --timeout=600 --timeout-method=signal

  lint:
    name: Lint and Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - *checkout-full-history

    - *install-uv

    - name: Lockfile is current with pyproject
      run: python3 scripts/check.py run lockfile

    - *sync-dev-deps

    - name: Run ruff, import boundaries, tracked-ignored, mypy and actionlint
      # One call: check.py runs every check it names, whatever the earlier ones did.
      run: uv run python scripts/check.py run ruff ruff-format import-contracts private-imports tracked-ignored mypy actionlint

    - name: Run changelog-fragment guard
      # `!cancelled()` here and below: an earlier failure must not hide this one. The base reaches the
      # shell through `env:`, never `${{ }}` in `run:` (attacker-controlled text). Needs fetch-depth: 0.
      if: ${{ !cancelled() && github.event_name == 'pull_request' }}
      env:
        BASE: ${{ format('origin/{0}', github.event.pull_request.base.ref) }}
      run: python3 scripts/check.py run changelog --base "$BASE"

    - name: Run plugin version-bump gate
      # On a push the base is the first parent. No fetch here: a shallow fetch would break the merge base.
      if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'push') }}
      env:
        BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || 'HEAD^1' }}
      run: python3 scripts/check.py run plugin-version --base "$BASE"

    - name: Install gitleaks
      # Same version as the pre-commit hook (the wiring test holds them equal).
      if: ${{ !cancelled() && github.event_name == 'pull_request' }}
      env:
        GITLEAKS_VERSION: 8.30.0
        GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
      run: |
        curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
        sudo tar -C /usr/local/bin -xzf "$RUNNER_TEMP/gitleaks.tar.gz" gitleaks

    - name: Run gitleaks (secret scan)
      # Base through env:, as in the changelog step.
      if: ${{ !cancelled() && github.event_name == 'pull_request' }}
      env:
        BASE: ${{ format('origin/{0}', github.event.pull_request.base.ref) }}
      run: python3 scripts/check.py run gitleaks --base "$BASE"

  docs:
    name: Documentation Build (Check Only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      build-failed: ${{ steps.build-failed.outputs.value }}

    steps:
    - *checkout-full-history

    - *install-uv

    - name: Install graphviz
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz

    - name: Install dependencies
      run: uv sync --locked --extra docs

    - name: Build documentation
      run: python3 scripts/check.py run docs

    - name: Upload documentation artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      if: github.event_name == 'pull_request'
      with:
        name: documentation-preview
        path: docs/build/html
        retention-days: 7

    # Read by stop-on-failed-cheap-lane; set before the link check, so an external site's outage stops nothing.
    - name: Record a failed docs build
      id: build-failed
      if: failure()
      run: echo "value=true" >> "$GITHUB_OUTPUT"

    - name: Check for broken links
      run: python3 scripts/check.py run linkcheck

  package:
    name: Package Build (framework + lean connectors wheel)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - *checkout-full-history

    - *install-uv

    - name: Build and check the packages
      run: python3 scripts/check.py run package

    - name: Upload package artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: package
        path: dist/osprey_framework-*
        retention-days: 7

  static-checks:
    name: Tier 0 — Static (preset YAML + builds, skill ↔ MCP-tool consistency, podman-compose parse)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - name: Run Tier 0 static checks
      timeout-minutes: 15
      run: uv run pytest tests/integration/test_preset_static.py tests/integration/test_preset_build.py -v --tb=short

    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
      with:
        node-version: '22'

    - name: Check the recorded CLI tool inventory against the pinned build
      timeout-minutes: 5
      run: uv run python scripts/cli_tool_inventory.py --check

    - name: Resume an authored transcript under the pinned CLI
      timeout-minutes: 5
      run: uv run python scripts/transcript_resume_probe.py

    - name: Pin podman-compose 1.0.6 as podman's compose provider
      # `podman compose` would otherwise find the runner's docker-compose plugin first and certify nothing.
      # `--optional`: this job gates every PR, so a runner without podman skips the parse below;
      # two-shape-boot-e2e pins without it and still reds if podman is gone.
      run: python3 scripts/ci/podman_compose.py pin --optional

    - name: Parse the merged podman topology (podman-compose config, no containers)
      # OSPREY's own argv runs `config`: the merged document must parse, with .env outranking .env.shared.
      env:
        # Without it the probe finds the runner's docker daemon first.
        CONTAINER_RUNTIME: podman
      run: uv run python scripts/ci/podman_compose.py parse-check

    - &capture-diagnostics-podman
      name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        engine: podman

  visual-theming:
    name: Behavioral + Visual Theming (Playwright, design system)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # No `if:`: nothing else runs the browser suites, and UI changes come from outside `interfaces/`.
    env:
      OSPREY_OFFLINE: "1"

    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - name: Fetch vendor assets
      timeout-minutes: 5
      run: uv run osprey vendor fetch --quiet

    # Azure's apt mirror some days serves the ~140 MB of debs at 30-100 kB/s, so the debs and browsers
    # are cached, apt prefers archive.ubuntu.com, and each install has a short timeout.
    - &playwright-cache-key
      name: Resolve Playwright browser cache key
      id: playwright-key
      run: |
        version=$(uv run python -c 'import importlib.metadata as m; print(m.version("playwright"))')
        : "${ImageOS:?runner image name missing}" "${ImageVersion:?runner image version missing}"
        echo "prefix=playwright-${version}-${ImageOS}-" >> "$GITHUB_OUTPUT"
        echo "key=playwright-${version}-${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

    - &playwright-apt
      name: Configure apt for the Playwright system deps
      # The snippet name must sort after the image's `zz-retries`.
      run: |
        sudo sed -i -E \
          -e 's#^(http://azure\.archive\.ubuntu\.com/ubuntu/\t)priority:1$#\1priority:2#' \
          -e 's#^(https?://archive\.ubuntu\.com/ubuntu/\t)priority:2$#\1priority:1#' \
          /etc/apt/apt-mirrors.txt
        cat /etc/apt/apt-mirrors.txt
        grep -Eq '^https?://archive\.ubuntu\.com/ubuntu/[[:space:]]+priority:1$' /etc/apt/apt-mirrors.txt \
          || echo "::warning::apt-mirrors.txt not in the expected shape; apt keeps the image's mirror order"
        mkdir -p "$HOME/apt-archives/partial"
        sudo tee /etc/apt/apt.conf.d/zzz-playwright-deps-cache >/dev/null <<EOF
        Dir::Cache::Archives "$HOME/apt-archives";
        APT::Keep-Downloaded-Packages "true";
        Acquire::http::Timeout "15";
        Acquire::Retries "3";
        EOF

    - &playwright-cache-restore
      name: Restore Playwright browsers and apt debs
      id: playwright-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: |
          ~/.cache/ms-playwright
          ~/apt-archives
        key: ${{ steps.playwright-key.outputs.key }}
        restore-keys: |
          ${{ steps.playwright-key.outputs.prefix }}

    - &playwright-chromium
      name: Install Playwright chromium
      timeout-minutes: 10
      run: uv run playwright install chromium --with-deps

    - name: Install Playwright webkit
      timeout-minutes: 10
      run: uv run playwright install webkit --with-deps

    - name: Hand the apt debs to the runner user
      # apt wrote them as root; the save cannot archive what it cannot read.
      run: |
        sudo apt-get autoclean
        sudo chown -R "$USER" ~/apt-archives
        rm -f ~/apt-archives/lock

    - name: Save Playwright browsers and apt debs
      # Saved here, not in a post step, so a later test failure still warms the cache.
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: |
          ~/.cache/ms-playwright
          ~/apt-archives
        key: ${{ steps.playwright-key.outputs.key }}

    # `loadfile`: a file's tests share module fixtures. Every browser-marked module but those
    # visual-theming-agent runs.
    - name: Run behavioral theming suite
      run: |
        uv run pytest -n 4 --dist loadfile -m browser tests/interfaces tests/docs/screenshots \
          --ignore=tests/interfaces/test_watchdog_e2e.py \
          --ignore=tests/interfaces/web_terminal/test_auth_login_browser.py \
          --ignore=tests/interfaces/web_terminal/test_ariel_embedded_agent_browser.py \
          --ignore=tests/interfaces/design_system/test_visual.py \
          -v --tb=short

  visual-theming-agent:
    name: Watchdog Browser + Visual Regression (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OSPREY_OFFLINE: "1"
    outputs:
      rendered: ${{ steps.rendered.outputs.rendered }}

    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - name: Fetch vendor assets
      timeout-minutes: 5
      run: uv run osprey vendor fetch --quiet

    - *playwright-cache-key

    - *playwright-apt

    - *playwright-cache-restore

    - *playwright-chromium

    - *install-pinned-cli

    - name: Run the watchdog browser suite
      timeout-minutes: 20
      env:
        PYTHONPATH: scripts/ci/pytest_plugins  # for -p no_skips
      run: |
        uv run pytest tests/interfaces/test_watchdog_e2e.py -m browser -v --tb=short \
          -p no_skips --no-skips-message "every watchdog browser test ran; none skipped"

    # Serial, in this job: container start/stop changes the host network, and every Chromium then fails
    # in-flight requests (ERR_NETWORK_CHANGED).
    - name: Run the container-backed browser suites
      run: |
        uv run pytest \
          tests/interfaces/web_terminal/test_auth_login_browser.py \
          tests/interfaces/web_terminal/test_ariel_embedded_agent_browser.py \
          -v --tb=short

    - name: Run visual regression suite
      run: uv run pytest tests/interfaces/design_system/test_visual.py -v --tb=short

    - name: Stage the baselines the suite wrote
      # Only the PNGs the suite added or changed: the checkout is the merge commit, so the rest of
      # the tree is main's and would overwrite the PR branch's. Staged at their repo-relative paths.
      id: rendered
      env:
        STAGE: ${{ runner.temp }}/rendered-baselines
      run: |
        mkdir -p "$STAGE"
        git ls-files --others --modified --exclude-standard -- 'tests/interfaces/design_system/baselines/*.png' |
          while IFS= read -r png; do
            if [ -f "$png" ]; then
              mkdir -p "$STAGE/$(dirname "$png")"
              cp -- "$png" "$STAGE/$png"
              echo "::notice::rendered $png"
            fi
          done
        if [ -n "$(find "$STAGE" -type f -name '*.png' -print -quit)" ]; then
          echo "rendered=true" >> "$GITHUB_OUTPUT"
        else
          echo "rendered=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload Linux-rendered baselines artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: visual-baselines-linux
        path: ${{ runner.temp }}/rendered-baselines/
        # Nothing rendered, nothing uploaded, and visual-baselines-push skips.
        if-no-files-found: ignore
        retention-days: 14

  # The one job holding a write token, split from the suites above so no code under test runs beside it:
  # it checks out the PR branch, lays the baselines the suite added or changed over it and pushes.
  # Dependabot's token cannot push, and a run that rendered nothing has nothing to push.
  visual-baselines-push:
    name: Push Linux-rendered visual baselines to the PR branch
    needs: visual-theming-agent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      needs.visual-theming-agent.outputs.rendered == 'true'
    permissions:
      contents: write

    steps:
    - name: Check out the PR branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # The token stays in the git config: the commit step pushes with it.
      with:
        ref: ${{ github.head_ref }}

    - name: Skip the commit if the branch moved past the rendered commit
      # Pure git, no repo code: the branch head can be newer than the sha that rendered the
      # baselines, and committing them there would overwrite a newer push with stale renders.
      id: head
      env:
        RENDERED_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        head="$(git rev-parse HEAD)"
        if [ "$head" = "$RENDERED_SHA" ]; then
          echo "current=true" >> "$GITHUB_OUTPUT"
        else
          echo "::notice::the branch is at $head, not the rendered $RENDERED_SHA; its own run pushes the baselines"
          echo "current=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Download Linux-rendered baselines artifact
      if: steps.head.outputs.current == 'true'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        name: visual-baselines-linux
        # The artifact holds repo-relative paths, so the root lays each PNG where it was rendered.
        path: .

    - name: Commit new/updated Linux baselines back to the PR branch
      if: steps.head.outputs.current == 'true'
      uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c  # v7.2.1
      with:
        commit_message: "chore(visual): update Linux-rendered theming baseline(s) [skip ci]"
        file_pattern: 'tests/interfaces/design_system/baselines/*.png'
        commit_user_name: "github-actions[bot]"
        commit_user_email: "github-actions[bot]@users.noreply.github.com"

  frontend-js:
    name: Frontend JS (typecheck + lint + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - *checkout-full-history

    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install JS dependencies
      # Regenerate the lock with `npm install --package-lock-only`, which is platform-neutral.
      run: npm ci

    - *install-uv

    - *sync-dev-deps

    - name: Run tsc, eslint, prettier, vitest and the app check over a panel
      run: python3 scripts/check.py run tsc eslint prettier vitest app-check-js

  plugin-smoke:
    name: Plugin marketplace smoke (install the osprey plugin)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No `if:`: changes outside `plugins/` can break the install.
    steps:
    - *checkout-full-history

    # GITHUB_ENV, not job `env:`: the `runner` context is unavailable there. Every later step needs it.
    - name: Point the Claude CLI at a scratch config dir
      run: echo "CLAUDE_CONFIG_DIR=$RUNNER_TEMP/claude-cfg" >> "$GITHUB_ENV"

    - *install-uv

    - name: Install dependencies
      run: uv sync --locked

    - *install-pinned-cli

    - name: Install the osprey plugin from the in-repo marketplace
      run: |
        claude plugin marketplace add "$GITHUB_WORKSPACE"
        claude plugin install osprey@osprey

    - name: Check the plugin exposes all eleven skills
      run: |
        claude plugin details osprey@osprey | tee /tmp/details.txt
        grep -q 'Skills (11)' /tmp/details.txt
        for s in build-app contribute design-philosophy doc-sync housekeeping panel pre-commit release setup test-audit upstream-scout; do grep -q "$s" /tmp/details.txt; done

  stop-on-failed-cheap-lane:
    # A deterministic cheap lane failed, so the run cannot pass: cancel the rest. A job of its own, so the
    # failed lane keeps its own red conclusion instead of being cancelled with the run.
    name: Stop the run on a failed cheap lane
    needs: [lint, docs, package, frontend-js, plugin-smoke]
    if: >-
      always() && github.event_name == 'pull_request'
      && (needs.lint.result == 'failure' || needs.package.result == 'failure'
        || needs.frontend-js.result == 'failure' || needs.plugin-smoke.result == 'failure'
        || needs.docs.outputs.build-failed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
    - name: Cancel the run
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"

  build-boot-smoke:
    name: Tier 1 — Build + MCP boot (${{ matrix.preset }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        preset: [hello-world, demo]

    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - name: Run Tier 1 boot smoke for preset
      env:
        PRESET: ${{ matrix.preset }}
        # Over /tmp's tmpfs quota otherwise; see "Run unit tests".
        TMPDIR: ${{ runner.temp }}
      run: |
        uv run pytest tests/integration/test_build_boot.py -v --tb=short -k "$PRESET"

  agentic-per-preset:
    name: Tier 3 — Agentic flow (${{ matrix.preset }})
    runs-on: ubuntu-latest
    # Above the 3x-p90 rule: ten runs of data, and the gateway's latency is not ours to bound.
    timeout-minutes: 25
    if: &full-ci-pr-or-secret-revalidation >-
      (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.user.login != 'dependabot[bot]'
        && contains(github.event.pull_request.labels.*.name, 'full-ci'))
      || (github.event_name == 'workflow_dispatch' && inputs.revalidate_secret_lanes)
    strategy:
      fail-fast: false
      matrix:
        preset: [hello-world, demo]

    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - &llm-preflight-probe
      name: Pre-flight LLM endpoint reachability check
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
      run: |
        if [ -z "${ALS_APG_API_KEY:-}" ]; then
          echo "❌ ALS_APG_API_KEY secret is not set on this runner"
          echo "   (Check repo secrets; every LLM-calling lane needs it.)"
          exit 1
        fi
        ALS_APG_PROBE_BASE="${ALS_APG_BASE_URL}"
        ALS_APG_PROBE_BASE="${ALS_APG_PROBE_BASE%/}"; ALS_APG_PROBE_BASE="${ALS_APG_PROBE_BASE%/v1}"
        HTTP_CODE=$(curl -sS -o /tmp/probe.txt -w "%{http_code}" --max-time 15 \
          -X POST "$ALS_APG_PROBE_BASE/v1/messages" \
          -H "Content-Type: application/json" \
          -H "anthropic-version: 2023-06-01" \
          -H "Authorization: Bearer $ALS_APG_API_KEY" \
          -d "{\"model\":\"$OSPREY_E2E_FORCE_MODEL\",\"max_tokens\":4,\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}]}")
        if [ "$HTTP_CODE" != "200" ]; then
          echo "❌ ALS-APG endpoint probe failed (HTTP $HTTP_CODE)"
          echo "   Body (first 500 chars):"
          head -c 500 /tmp/probe.txt; echo
          echo "   If 401/403: rotate ALS_APG_API_KEY or check IP allowlist."
          echo "   If 5xx: ALS-APG outage — retry, or contact the proxy admin."
          exit 1
        fi
        echo "✅ ALS-APG endpoint reachable (HTTP 200)"

    - *install-pinned-cli

    - name: Run Tier 3 agentic test for preset
      timeout-minutes: 20
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
        PRESET: ${{ matrix.preset }}
        PYTHONPATH: scripts/ci/pytest_plugins  # for -p no_skips
      run: |
        # -k matches the snake_case test names (test_hello_world_*).
        PRESET_K="${PRESET//-/_}"
        uv run pytest tests/e2e/test_preset_agentic.py -v --tb=short -k "$PRESET_K" \
          -p no_skips --no-skips-message "✅ every agentic test of the preset ran; none skipped"

    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: agentic-per-preset-${{ matrix.preset }}

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.user.login != 'dependabot[bot]'
        && contains(github.event.pull_request.labels.*.name, 'full-ci'))
      || (github.event_name == 'workflow_dispatch' && !inputs.run_benchmarks)
    timeout-minutes: 50

    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - *llm-preflight-probe

    - *install-pinned-cli

    # --no-skips-allow-partial: the rest of tests/e2e/ skips by design on CI (opt-in provider
    # matrix, upstreams with no key, no ARIEL logbook backend), so only a session that skipped
    # everything reds.
    - name: Run E2E tests
      timeout-minutes: 45
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
        E2E_FILTER: ${{ inputs.e2e_filter }}
        PYTHONPATH: scripts/ci/pytest_plugins  # for -p no_skips
      run: |
        if [ -n "$E2E_FILTER" ]; then
          echo "Running scoped E2E filter: $E2E_FILTER"
          # $E2E_FILTER may hold several paths or pytest args: split on purpose.
          # shellcheck disable=SC2086
          uv run pytest $E2E_FILTER -v --tb=short \
            -p no_skips --no-skips-message "✅ the scoped E2E filter ran" --no-skips-allow-partial
        else
          # Every --ignore runs in another job (or is opt-in / dispatch-only); none is untested.
          # -n 4 --dist loadfile: real-LLM round-trips at near-zero CPU.
          uv run pytest tests/e2e/ -v --tb=short --durations=30 -n 4 --dist loadfile \
            -p no_skips --no-skips-message "✅ the E2E suite ran" --no-skips-allow-partial \
            --ignore=tests/e2e/test_preset_agentic.py \
            --ignore=tests/e2e/test_plan_stack_agentic.py \
            --ignore=tests/e2e/test_dispatch_deploy.py \
            --ignore=tests/e2e/test_single_user_narrowing_e2e.py \
            --ignore=tests/e2e/test_dispatch_overlay_visibility.py \
            --ignore=tests/e2e/test_bluesky_deploy.py \
            --ignore=tests/e2e/test_optimizer_deploy.py \
            --ignore=tests/e2e/test_bluesky_queue_e2e.py \
            --ignore=tests/e2e/test_dockerfile_e2e.py \
            --ignore=tests/e2e/test_dockerfile_agent_e2e.py \
            --ignore=tests/e2e/test_privilege_split.py \
            --ignore=tests/e2e/test_audit_two_container.py \
            --ignore=tests/e2e/test_execution_environment_parity.py \
            --ignore=tests/e2e/test_tiled_roundtrip.py \
            --ignore=tests/e2e/test_va_substrate_equivalence.py \
            --ignore=tests/e2e/test_target_switch_agentic.py \
            --ignore=tests/e2e/test_orm_roundtrip.py \
            --ignore=tests/e2e/test_grid_scan_roundtrip.py \
            --ignore=tests/e2e/test_bump_roundtrip.py \
            --ignore=tests/e2e/test_preflight_probe.py \
            --ignore=tests/e2e/test_archiver_world_e2e.py \
            --ignore=tests/e2e/test_graph_reseed_stamp.py \
            --ignore=tests/e2e/test_bluesky_catalog_e2e.py \
            --ignore=tests/e2e/test_bluesky_sandbox_escape_e2e.py \
            --ignore=tests/e2e/test_bluesky_web_deploy.py \
            --ignore=tests/e2e/test_deploy_lifecycle.py \
            --ignore=tests/e2e/test_two_shape_boot.py \
            --ignore=tests/e2e/test_deploy_writeback_e2e.py \
            --ignore=tests/e2e/test_nextcloud_talk_bridge_e2e.py \
            --ignore=tests/e2e/test_gchat_bridge_e2e.py \
            --ignore=tests/e2e/fixtures/test_gchat_fixture_smoke.py \
            --ignore=tests/e2e/test_teams_bridge_e2e.py \
            --ignore=tests/e2e/fixtures/test_teams_fixture_smoke.py \
            --ignore=tests/e2e/test_slack_bridge_e2e.py \
            --ignore=tests/e2e/fixtures/test_slack_fixture_smoke.py \
            --ignore=tests/e2e/web_terminals/test_auth_perimeter.py \
            --ignore=tests/e2e/web_terminals/test_terminal_auth_multiuser_e2e.py \
            --ignore=tests/e2e/test_full_chain_auth.py \
            --ignore=tests/e2e/test_jupyter_panel_lifecycle.py \
            --ignore=tests/e2e/claude_code/test_channel_finder_mcp_benchmarks.py \
            --ignore=tests/e2e/test_agent_record_e2e.py \
            --ignore=tests/e2e/test_host_record_e2e.py \
            --ignore=tests/e2e/test_scripted_model.py \
            --ignore=tests/e2e/claude_code/test_safety_gates_scripted.py \
            --ignore=tests/e2e/test_dispatch_deploy_render.py \
            --ignore=tests/e2e/web_terminals/test_scaffold_render_roundtrip.py \
            --ignore=tests/e2e/web_terminals/test_skills_overlay_discovery.py \
            --ignore=tests/e2e/web_terminals/test_loopback_chokepoint.py \
            --ignore=tests/e2e/web_terminals/test_session_restart_e2e.py \
            --ignore=tests/e2e/web_terminals/test_terminal_auth_e2e.py \
            --ignore=tests/e2e/web_terminals/test_render_permissions_scripted.py \
            --ignore=tests/e2e/claude_code/test_chat_approval_gates_scripted.py \
            --ignore=tests/e2e/claude_code/test_chat_plan_mode_scripted.py \
            --ignore=tests/e2e/claude_code/test_chat_attachment_read_scripted.py \
            --ignore=tests/e2e/test_watchdog_agent_scripted.py \
            --ignore=tests/e2e/test_watchdog_hold_scripted.py \
            --ignore=tests/e2e/test_watchdog_live.py \
            --ignore=tests/e2e/tier2
        fi
    - *capture-diagnostics
    # The deploy's own teardown does not run when the job is killed, and a reused runner keeps the
    # stack. Exact names, never a prune.
    - name: Clean up any stranded stack resources
      if: always()
      run: |
        scripts/ci/cleanup_stacks.sh \
          queue-e2e \
          osprey-e2e-bluesky-deploy \
          osprey-e2e-catalog \
          osprey-e2e-tiled \
          panels-proj \
          plan-agentic \
          orm-roundtrip \
          grid-scan-roundtrip \
          bump-roundtrip \
          preflight-probe \
          sandbox-escape \
          osprey-e2e-dispatch \
          osprey-e2e-overlay \
          suproj \
          osprey-e2e-va-substrate \
          lane-e2e \
          osprey-e2e-agent-record \
          osprey-e2e-host-record

  e2e-no-model:
    name: Model-Free E2E (the tests/e2e files that reach no gateway)
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request')
      || (github.event_name == 'workflow_dispatch' && inputs.revalidate_secret_lanes)
    timeout-minutes: 30

    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - &assert-container-runtime
      name: Assert a container runtime is present
      run: |
        set -euo pipefail
        docker info > /dev/null

    - *install-pinned-cli

    - name: Run the model-free E2E files
      timeout-minutes: 25
      env:
        PYTHONPATH: scripts/ci/pytest_plugins  # for -p no_skips
      run: |
        # Named by path, not marker: a vanished path reds (exit 4), a marker matching nothing greens.
        # The wiring test holds this list equal to the model_free tests.
        uv run pytest \
          tests/e2e/test_scripted_model.py \
          tests/e2e/claude_code/test_safety_gates_scripted.py \
          tests/e2e/test_dispatch_deploy_render.py \
          tests/e2e/web_terminals/test_scaffold_render_roundtrip.py \
          tests/e2e/web_terminals/test_skills_overlay_discovery.py \
          tests/e2e/web_terminals/test_loopback_chokepoint.py \
          tests/e2e/web_terminals/test_session_restart_e2e.py \
          tests/e2e/web_terminals/test_terminal_auth_e2e.py \
          tests/e2e/web_terminals/test_render_permissions_scripted.py \
          tests/e2e/claude_code/test_chat_approval_gates_scripted.py \
          tests/e2e/claude_code/test_chat_plan_mode_scripted.py \
          tests/e2e/claude_code/test_chat_attachment_read_scripted.py \
          tests/e2e/test_watchdog_agent_scripted.py \
          tests/e2e/test_watchdog_hold_scripted.py \
          -v --tb=short --durations=15 -n 4 --dist loadfile \
          -p no_skips --no-skips-message "✅ every model-free E2E test ran; none skipped"

    - *capture-diagnostics

  agent-record-e2e:
    name: Agent Record E2E (${{ matrix.backend }}; replays every captured fixture through the real stack)
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request')
      || (github.event_name == 'workflow_dispatch' && inputs.revalidate_secret_lanes)
    # One case per runner: cases share a per-host project name and port block. The wiring test holds the cells.
    strategy:
      fail-fast: false
      matrix:
        include:
        - backend: embedded
          case: test_embedded_record_on_hello_world
        - backend: clickhouse
          case: test_clickhouse_record_on_demo
    timeout-minutes: 135
    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - *assert-container-runtime

    - *install-pinned-cli

    - name: Run the agent record replay
      timeout-minutes: 120
      env:
        CASE: ${{ matrix.case }}
        PYTHONPATH: scripts/ci/pytest_plugins  # for -p no_skips
      run: |
        uv run pytest \
          tests/e2e/test_agent_record_e2e.py \
          -k "$CASE" \
          -v --tb=short --durations=15 \
          -p no_skips --no-skips-message "✅ every agent record replay test ran; none skipped"

    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: agent-record-e2e-${{ matrix.backend }}
    - name: Clean up any stranded stack resources
      if: always()
      run: |
        scripts/ci/cleanup_stacks.sh osprey-e2e-agent-record

  benchmarks:
    name: On-Demand Benchmarks (channel-finder MCP + Tier 2 model)
    runs-on: ubuntu-latest
    # Dispatch-only: they measure the model, not the change, so all-checks-passed does not need them.
    if: github.event_name == 'workflow_dispatch' && inputs.run_benchmarks
    timeout-minutes: 60

    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - *llm-preflight-probe

    - *install-pinned-cli

    - name: Fetch the pinned neosemantics (n10s) jar for the graph benchmark lane
      # Fetched here: a failed download in the fixture would SKIP the graph paradigm.
      run: scripts/ci/fetch_n10s_jar.sh

    - name: Run channel-finder MCP benchmarks
      timeout-minutes: 30
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
      run: |
        uv run pytest tests/e2e/claude_code/test_channel_finder_mcp_benchmarks.py -v --tb=short

    - name: Run Tier 2 model benchmarks
      if: ${{ !cancelled() }}
      timeout-minutes: 30
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
      run: |
        # test_chart_value_reading.py deploys a full stack and runs on the benchmark board only.
        uv run pytest tests/e2e/tier2/ --ignore=tests/e2e/tier2/test_chart_value_reading.py \
          -v --tb=short

  deploy-e2e:
    name: Deploy E2E Test (build + deploy pipeline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # stack-e2e's gate, spelled out: its anchor is defined further down.
    if: >-
      (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && inputs.revalidate_secret_lanes)
    env:
      # Not a secret: `osprey up`'s .env preflight refuses an empty provider key, and nothing here calls a
      # model, so any non-empty value passes. Holding no secret, the lane also runs on Dependabot PRs.
      ALS_APG_API_KEY: placeholder-deploy-e2e-calls-no-model

    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - name: Create hello_world deployment repo
      run: |
        # The model is the gateway's id: the build refuses an alias such as haiku.
        uv run osprey init hello-world-test --preset hello-world \
          --set provider=als-apg --set model="$OSPREY_E2E_FORCE_MODEL"
        cd hello-world-test
        uv run osprey build --skip-deps --skip-lifecycle
        ls -la

    - name: osprey up (hello-world)
      run: |
        cd hello-world-test
        uv run osprey up -d --dev

    # Before the teardown below, which deletes the containers whose logs matter.
    - *capture-diagnostics

    - name: osprey down
      if: always()
      run: |
        cd hello-world-test
        # No `|| true`: a swallowed exit code would read a usage error as a clean teardown.
        uv run osprey down

    - name: Clean up any stranded hello-world resources
      if: always()
      run: |
        scripts/ci/cleanup_stacks.sh hello-world-test

  dispatch-stack-e2e:
    name: Dispatch Stack E2E (${{ matrix.what }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: *full-ci-pr-or-secret-revalidation
    strategy:
      fail-fast: false
      matrix:
        include:
        - lane: dispatch-deploy-e2e
          what: deploy, full Docker stack + real agent runs + multi-user web tier
          module: tests/e2e/test_dispatch_deploy.py
          project: osprey-e2e-dispatch
        - lane: single-user-narrowing-e2e
          what: single-user narrowing, owner-narrowed dispatch run
          module: tests/e2e/test_single_user_narrowing_e2e.py
          project: suproj
        - lane: dispatch-overlay-e2e
          what: overlay skill/data/trigger visibility
          module: tests/e2e/test_dispatch_overlay_visibility.py
          project: osprey-e2e-overlay

    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - *llm-preflight-probe

    - &build-qmd-image
      name: Build the qmd sidecar image
      uses: ./.github/actions/build-qmd-image

    - name: Run the dispatch stack E2E module
      timeout-minutes: 55
      env:
        OSPREY_QMD_IMAGE: osprey-qmd:ci
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
        EVENT_DISPATCHER_TOKEN: dev-token
        DISPATCH_WORKER_TOKEN: dev-token
        MODULE: ${{ matrix.module }}
        PYTHONPATH: scripts/ci/pytest_plugins  # for -p no_skips
      run: |
        uv run pytest "$MODULE" -v --tb=short \
          -p no_skips --no-skips-message "✅ every test of the dispatch stack module ran; none skipped"
    - &capture-diagnostics-per-lane
      name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: ${{ matrix.lane }}
    - name: Clean up any stranded stack resources
      if: always()
      env:
        PROJECT: ${{ matrix.project }}
      run: |
        scripts/ci/cleanup_stacks.sh "$PROJECT"

  host-record-e2e:
    name: Host Record E2E (host sessions record without a container; the stack takes the record over)
    runs-on: ubuntu-latest
    if: *full-ci-pr-or-secret-revalidation
    timeout-minutes: 25

    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - *llm-preflight-probe

    - *install-pinned-cli

    - name: Run host record E2E
      timeout-minutes: 20
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
        PYTHONPATH: scripts/ci/pytest_plugins  # for -p no_skips
      run: |
        uv run pytest tests/e2e/test_host_record_e2e.py -v --tb=short \
          -p no_skips --no-skips-message "✅ every host record test ran; none skipped"

    - *capture-diagnostics
    - name: Clean up any stranded stack resources
      if: always()
      run: |
        scripts/ci/cleanup_stacks.sh osprey-e2e-host-record

  stack-e2e:
    name: Stack E2E — ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    # Same-repo only even without secrets: house policy for every image build-and-deploy job.
    if: &same-repo-pr-or-secret-revalidation >-
      (github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && inputs.revalidate_secret_lanes)
    # One cell per stack module, none with a model secret (test_secret_free_lane_has_no_llm_secret).
    # `lane` names its diagnostics, `cleanup` the stranded resources it removes.
    strategy:
      fail-fast: false
      matrix:
        include:
        - lane: bluesky-deploy-e2e
          name: Bluesky Deploy
          module: tests/e2e/test_bluesky_deploy.py
          cleanup: osprey-e2e-bluesky-deploy
          timeout: 60
          step_timeout: 55
        - lane: bluesky-web-deploy-e2e
          name: Bluesky Web Deploy
          module: tests/e2e/test_bluesky_web_deploy.py
          cleanup: panels-proj
          timeout: 45
          step_timeout: 40
        - lane: va-substrate-equivalence-e2e
          name: VA Substrate Equivalence
          module: tests/e2e/test_va_substrate_equivalence.py
          cleanup: osprey-e2e-va-substrate
          timeout: 45
          step_timeout: 40
        - lane: bluesky-queue-e2e
          name: Bluesky Queue
          module: tests/e2e/test_bluesky_queue_e2e.py
          cleanup: queue-e2e
          timeout: 75
          step_timeout: 70
        # -s so the measured budgets reach a green log.
        - lane: archiver-world-e2e
          name: Archiver World
          module: tests/e2e/test_archiver_world_e2e.py
          cleanup: archiver-world
          timeout: 45
          step_timeout: 40
          pytest_args: -s
        - lane: tiled-roundtrip-e2e
          name: Tiled Roundtrip
          module: tests/e2e/test_tiled_roundtrip.py
          cleanup: osprey-e2e-tiled
          timeout: 30
          step_timeout: 25
        - lane: bluesky-catalog-e2e
          name: Bluesky Catalog
          module: tests/e2e/test_bluesky_catalog_e2e.py
          cleanup: osprey-e2e-catalog
          timeout: 60
          step_timeout: 55
        - lane: bluesky-sandbox-escape-e2e
          name: Bluesky Sandbox Escape
          module: tests/e2e/test_bluesky_sandbox_escape_e2e.py
          cleanup: sandbox-escape
          timeout: 45
          step_timeout: 40
        - lane: optimizer-deploy-e2e
          name: Optimizer Deploy
          module: tests/e2e/test_optimizer_deploy.py
          timeout: 60
          step_timeout: 55
        # Above the test's BUILD_TIMEOUT (1200 s), so the test kills a slow build and prints its log.
        - lane: execution-environment-parity-e2e
          name: Execution Environment Parity
          module: tests/e2e/test_execution_environment_parity.py
          timeout: 40
          step_timeout: 35
        - lane: deploy-writeback-e2e
          name: Deploy Write-Back
          module: tests/e2e/test_deploy_writeback_e2e.py
          cleanup: osprey-e2e-wb-rebuild osprey-e2e-wb-divergent osprey-e2e-wb-render
          timeout: 40
          step_timeout: 35
        - lane: jupyter-panel-e2e
          name: Notebook Panel
          module: tests/e2e/test_jupyter_panel_lifecycle.py
          cleanup: --image osprey-e2e-jnb-operator:local --image osprey-e2e-jnb-va:local osprey-e2e-jnb
          timeout: 75
          step_timeout: 65
        - lane: graph-reseed-e2e
          name: Graph Reseed Stamp
          module: tests/e2e/test_graph_reseed_stamp.py
          n10s: true
          timeout: 30
          step_timeout: 25

    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - name: Fetch the pinned neosemantics (n10s) jar
      # As in the benchmarks job: a fixture download failure would skip.
      if: matrix.n10s
      run: scripts/ci/fetch_n10s_jar.sh

    - name: Run the stack E2E module
      timeout-minutes: ${{ matrix.step_timeout }}
      env:
        MODULE: ${{ matrix.module }}
        PYTEST_ARGS: ${{ matrix.pytest_args }}
        PYTHONPATH: scripts/ci/pytest_plugins  # for -p no_skips
      # The gate also reds a graph cell whose n10s jar went missing: the fixture would skip.
      run: |
        # The cell's pytest_args are empty or several flags: split on purpose.
        # shellcheck disable=SC2086
        uv run pytest "$MODULE" -v $PYTEST_ARGS --tb=short \
          -p no_skips --no-skips-message "✅ every test of the stack module ran; none skipped"
    - *capture-diagnostics-per-lane
    - name: Clean up any stranded stack resources
      if: always() && matrix.cleanup
      env:
        CLEANUP: ${{ matrix.cleanup }}
      run: |
        # The cell's cleanup is several names and flags: split on purpose.
        # shellcheck disable=SC2086
        scripts/ci/cleanup_stacks.sh $CLEANUP

  orm-roundtrip-e2e:
    name: ORM + Grid Scan Roundtrip E2E (VA + bluesky bridge + Tiled, full Docker stack)
    runs-on: ubuntu-latest
    # Sequential steps: two modules bind CA port 5064, and a runner fits one stack at a time.
    if: *same-repo-pr-or-secret-revalidation
    timeout-minutes: 100

    steps:
    # Docker 29's containerd image store unpacks shared layers per image and ran this lane out of
    # disk. Drop this once the lane builds less per stack.
    - name: Use the overlay2 image store
      run: |
        sudo mkdir -p /etc/docker
        [ -s /etc/docker/daemon.json ] || echo '{}' | sudo tee /etc/docker/daemon.json >/dev/null
        sudo jq '.features["containerd-snapshotter"] = false' /etc/docker/daemon.json \
          | sudo tee /etc/docker/daemon.json.new >/dev/null
        sudo mv /etc/docker/daemon.json.new /etc/docker/daemon.json
        sudo systemctl restart docker
        driver=$(docker info --format '{{.Driver}}')
        echo "storage driver: $driver"
        [ "$driver" = overlay2 ]

    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - name: Run ORM roundtrip E2E
      timeout-minutes: 45
      run: |
        uv run pytest tests/e2e/test_orm_roundtrip.py -v --tb=short

    - name: Run grid scan roundtrip E2E
      timeout-minutes: 40
      run: |
        uv run pytest tests/e2e/test_grid_scan_roundtrip.py -v --tb=short

    - name: Run orbit bump sweep roundtrip E2E
      timeout-minutes: 45
      run: |
        uv run pytest tests/e2e/test_bump_roundtrip.py -v --tb=short

    - name: Run preflight probe E2E
      timeout-minutes: 45
      run: |
        uv run pytest tests/e2e/test_preflight_probe.py -v --tb=short
    - *capture-diagnostics
    - name: Clean up any stranded stack resources
      if: always()
      run: |
        scripts/ci/cleanup_stacks.sh \
          orm-roundtrip \
          grid-scan-roundtrip \
          bump-roundtrip \
          preflight-probe

  scan-agentic-e2e:
    name: Scan Stack Agentic E2E (agent-driven ORM + grid scans on the deployed queue stack)
    runs-on: ubuntu-latest
    if: *full-ci-pr-or-secret-revalidation
    # Above the fixture's own caps (the deploy alone may take 56 min), so its timeout report is not cut off.
    timeout-minutes: 75

    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - *llm-preflight-probe

    - *install-pinned-cli

    - *build-qmd-image

    - name: Run scan stack agentic E2E
      timeout-minutes: 70
      env:
        OSPREY_QMD_IMAGE: osprey-qmd:ci
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
        PYTHONPATH: scripts/ci/pytest_plugins  # for -p no_skips
      run: |
        uv run pytest tests/e2e/test_plan_stack_agentic.py -v --tb=short \
          -p no_skips --no-skips-message "✅ every scan-stack agentic test ran; none skipped"

    - *capture-diagnostics
    - name: Clean up any stranded stack resources
      if: always()
      run: |
        scripts/ci/cleanup_stacks.sh plan-agentic

  nextcloud-talk-bridge-e2e:
    name: Nextcloud Talk Bridge E2E (real Talk server + dispatch stack)
    runs-on: ubuntu-latest
    if: *full-ci-pr-or-secret-revalidation
    # A job `permissions:` replaces the defaults; `packages: read` for the PRIVATE ghcr Talk fixture.
    permissions:
      contents: read
      packages: read
    timeout-minutes: 45

    steps:
    - *checkout-full-history

    - name: Log in to ghcr (Nextcloud Talk fixture)
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - *install-uv

    - *sync-dev-deps

    - *install-pinned-cli

    - name: Pull the pinned Nextcloud Talk fixture image
      run: |
        # Pulled here: the module skips without the image. The wiring test binds this constant to the Dockerfile.
        IMAGE=$(uv run python -c 'import importlib.util as i, sys; s=i.spec_from_file_location("_nc","tests/e2e/test_nextcloud_talk_bridge_e2e.py"); m=i.module_from_spec(s); sys.modules["_nc"]=m; s.loader.exec_module(m); print(m.NEXTCLOUD_FIXTURE_IMAGE)')
        echo "Pulling fixture image: $IMAGE"
        docker pull "$IMAGE"

    - *llm-preflight-probe

    - name: Run Nextcloud Talk bridge E2E
      timeout-minutes: 40
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
        PYTHONPATH: scripts/ci/pytest_plugins  # for -p no_skips
      run: |
        uv run pytest tests/e2e/test_nextcloud_talk_bridge_e2e.py -v --tb=short \
          -p no_skips --no-skips-message "✅ every Nextcloud Talk test ran; none skipped"
    - *capture-diagnostics

  gchat-bridge-e2e:
    name: Google Chat Bridge E2E (Pub/Sub emulator + dispatch stack)
    runs-on: ubuntu-latest
    if: *full-ci-pr-or-secret-revalidation
    timeout-minutes: 45
    env:
      OSPREY_E2E_RUNTIME: docker

    steps:
    - *checkout-full-history

    - *install-uv

    - name: Install osprey
      run: uv sync --locked --extra dev --extra gchat

    - *install-pinned-cli

    - name: Pull the Pub/Sub emulator image
      run: |
        # Pulled here: a failed pull in the fixture is a skip. PYTHONPATH as pytest's, for the connectors harness.
        IMAGE=$(PYTHONPATH=packages/osprey-connectors/tests uv run python -c 'from tests.e2e.fixtures.gchat_pubsub_emulator import IMAGE; print(IMAGE)')
        echo "Pulling emulator image: $IMAGE"
        docker pull "$IMAGE"

    - *llm-preflight-probe

    # Separate steps, no xdist: both files use one fixed-name emulator container.
    - name: Run Google Chat fixture smoke tests
      env:
        PYTHONPATH: scripts/ci/pytest_plugins  # for -p no_skips
      run: |
        uv run pytest tests/e2e/fixtures/test_gchat_fixture_smoke.py -v --tb=short \
          -p no_skips --no-skips-message "✅ every Google Chat test ran; none skipped"

    - name: Run Google Chat bridge E2E
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
        PYTHONPATH: scripts/ci/pytest_plugins  # for -p no_skips
      run: |
        uv run pytest tests/e2e/test_gchat_bridge_e2e.py -v --tb=short \
          -p no_skips --no-skips-message "✅ every Google Chat test ran; none skipped"

    - *capture-diagnostics

  teams-slack-bridge-e2e:
    name: Microsoft Teams + Slack Bridge E2E (loopback fakes, no container)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - *checkout-full-history

    - *install-uv

    - name: Install osprey
      run: uv sync --locked --extra dev --extra teams

    - *install-pinned-cli

    - name: Run Microsoft Teams and Slack bridge E2E
      timeout-minutes: 16
      env:
        PYTHONPATH: scripts/ci/pytest_plugins  # for -p no_skips
      run: |
        # `--no-sync`: a bare `uv run` re-syncs and strips the `teams` extra back out.
        uv run --no-sync pytest \
          tests/e2e/fixtures/test_teams_fixture_smoke.py \
          tests/e2e/test_teams_bridge_e2e.py \
          tests/e2e/fixtures/test_slack_fixture_smoke.py \
          tests/e2e/test_slack_bridge_e2e.py \
          -v --tb=short \
          -p no_skips --no-skips-message "✅ every Microsoft Teams and Slack test ran; none skipped"

    - *capture-diagnostics

  privilege-split-e2e:
    name: Privilege Split E2E (built images, stat-level ownership proof)
    runs-on: ubuntu-latest
    # The job `name:` names only the first module: branch protection matches on it.
    timeout-minutes: 120
    if: *same-repo-pr-or-secret-revalidation

    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    # --no-skips-allow-partial: the audit module has documented per-test guards, so only a module-wide skip reds.
    - name: Run privilege split E2E
      timeout-minutes: 85
      env:
        PYTHONPATH: scripts/ci/pytest_plugins  # for -p no_skips
      run: |
        uv run pytest tests/e2e/test_privilege_split.py -v --tb=short \
          -p no_skips --no-skips-message "✅ the privilege split module ran" --no-skips-allow-partial

    - name: Run audit two-container mechanism E2E
      # `success() || failure()`: a red step above must not hide this, and `always()` would run after a cancel.
      if: success() || failure()
      timeout-minutes: 35
      env:
        PYTHONPATH: scripts/ci/pytest_plugins  # for -p no_skips
      run: |
        uv run pytest tests/e2e/test_audit_two_container.py -v --tb=short \
          -p no_skips --no-skips-message "✅ the audit two-container module ran" --no-skips-allow-partial

    - *capture-diagnostics

    - name: Clean up any stranded resources from either module
      if: always()
      run: |
        scripts/ci/cleanup_stacks.sh \
          --sweep \
          --image 'osprey-e2e-privsplit-*' \
          --image 'osprey-e2e-audit2c*' \
          osprey-e2e-privsplit \
          osprey-e2e-audit2c

  # The one Dockerfile test that spends model tokens, apart from dockerfile-e2e below, which holds no key.
  dockerfile-agent-e2e:
    name: Dockerfile Agent E2E (one agent turn through the generated image)
    runs-on: ubuntu-latest
    # No runs to measure yet: dockerfile-e2e's caps, which cover the same image build.
    timeout-minutes: 40
    if: *full-ci-pr-or-secret-revalidation

    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - *llm-preflight-probe

    - name: Run Dockerfile agent E2E
      timeout-minutes: 25
      env:
        OSPREY_E2E_PIP_SPEC: git+https://github.com/${{ github.repository }}.git@${{ github.event.pull_request.head.sha || github.sha }}
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
        PYTHONPATH: scripts/ci/pytest_plugins  # for -p no_skips
      run: |
        uv run pytest tests/e2e/test_dockerfile_agent_e2e.py -v --tb=short \
          -p no_skips --no-skips-message "✅ the Dockerfile agent turn ran; nothing skipped"

    - *capture-diagnostics

  dockerfile-e2e:
    name: Dockerfile E2E (generated container image)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # No model key: the agent turn through the image is dockerfile-agent-e2e's.
    if: *same-repo-pr-or-secret-revalidation

    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - name: Run Dockerfile E2E
      timeout-minutes: 25
      env:
        OSPREY_E2E_PIP_SPEC: git+https://github.com/${{ github.repository }}.git@${{ github.event.pull_request.head.sha || github.sha }}
      run: uv run pytest tests/e2e/test_dockerfile_e2e.py -v --tb=short

    # The proxied build is proven from the proxy's access log, not the build's exit status: this
    # runner has open egress.
    - name: Start a logging forward proxy (tinyproxy)
      env:
        # Tag for the reader, digest for the pull.
        PROXY_BASE_IMAGE: docker.io/library/debian:bookworm-20261104-slim@sha256:734a72b3d6142a71993b4bc580ca01d8ca687f77a2c422d96a961d3376b179bc
      run: scripts/ci/proxied_build.sh start

    - name: Assert the uppercase-only proxy contract reaches the build
      # BuildKit copies HTTP_PROXY into http_proxy inside RUN, which would pass the assertion with the
      # bridge deleted, so the build uses podman. This probe fails the lane if podman ever does the same.
      env:
        PROBE_BASE_IMAGE: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      run: scripts/ci/proxied_build.sh probe

    - name: Build the web-terminal auth sidecar through the proxy
      # Uppercase proxy build-args only: the Dockerfile's lowercase bridge is the one path to apt.
      timeout-minutes: 15
      run: scripts/ci/proxied_build.sh build

    - name: Assert apt and pip traffic went through the proxy
      run: scripts/ci/proxied_build.sh assert

    - *capture-diagnostics

    - name: Stop the forward proxy
      # Last: the capture step needs the container's logs.
      if: always()
      run: scripts/ci/proxied_build.sh stop

  multi-user-deploy-lifecycle-e2e:
    name: Multi-User Deploy Lifecycle E2E (${{ matrix.runtime }} runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # PRs into main only (not epic phases): it runs real destructive lifecycle verbs.
    if: >-
      (github.event_name == 'pull_request'
      && github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && inputs.revalidate_secret_lanes)
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]

    steps:
    - *checkout-full-history

    - *install-uv

    - name: Set up rootless Podman
      if: matrix.runtime == 'podman'
      run: |
        podman --version
        podman compose version
        # Rootless podman verifies TLS even on localhost (docker does not), so the test's plain-HTTP stub
        # registry on localhost:19081 is marked insecure in a merged drop-in.
        mkdir -p ~/.config/containers/registries.conf.d
        cat > ~/.config/containers/registries.conf.d/localhost-insecure.conf <<'EOF'
        [[registry]]
        location = "localhost:19081"
        insecure = true
        EOF

    - *sync-dev-deps

    - name: Run multi-user deploy lifecycle E2E
      if: matrix.runtime == 'docker'
      timeout-minutes: 15
      # `-m 'not qmd'`: that test refuses to skip without a qmd image; qmd-sidecar-e2e runs it.
      run: |
        uv run pytest tests/e2e/test_deploy_lifecycle.py -m 'not qmd' -v --tb=short

    - name: Run multi-user deploy lifecycle E2E (podman)
      if: matrix.runtime == 'podman'
      timeout-minutes: 15
      env:
        OSPREY_E2E_RUNTIME: podman
        CONTAINER_RUNTIME: podman
      run: |
        # `podman compose` delegates to the runner's docker-compose plugin, which needs the podman API
        # socket. Started in this step: each step is its own process group.
        podman system service --time=0 &
        SOCK="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/podman/podman.sock"
        for _ in $(seq 1 30); do if [ -S "$SOCK" ]; then break; fi; sleep 1; done
        export DOCKER_HOST="unix://$SOCK"
        uv run pytest tests/e2e/test_deploy_lifecycle.py -m 'not qmd' -v --tb=short

    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: multi-user-deploy-lifecycle-e2e-${{ matrix.runtime }}
        engine: ${{ matrix.runtime }}

    # --sweep: the test's own stub registry belongs to no compose project.
    - name: Clean up any stranded lifecycle-e2e resources
      if: always()
      env:
        RUNTIME: ${{ matrix.runtime }}
      run: |
        ENGINE="$RUNTIME" scripts/ci/cleanup_stacks.sh --sweep osprey-e2e-mus-p3

  auth-perimeter-e2e:
    name: Auth Perimeter E2E (real sidecar image + nginx auth_request)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # PRs into main and epic/*: a safety lane run only after the epic merged could go red behind a green gate.
    if: &main-or-epic-pr-or-secret-revalidation >-
      (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
        && (github.event.pull_request.base.ref == 'main'
        || startsWith(github.event.pull_request.base.ref, 'epic/')))
      || (github.event_name == 'workflow_dispatch' && inputs.revalidate_secret_lanes)

    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - name: Run auth perimeter E2E
      timeout-minutes: 30
      run: |
        uv run pytest tests/e2e/web_terminals/test_auth_perimeter.py -v --tb=short

    - *capture-diagnostics

    - name: Clean up any stranded auth-perimeter resources
      if: always()
      run: |
        scripts/ci/cleanup_stacks.sh \
          --image osprey-e2e-auth-perimeter-auth:local \
          --image osprey-e2e-auth-perimeter-readonly:local \
          osprey-e2e-auth-perimeter

  terminal-auth-multiuser-e2e:
    name: Terminal Auth Multi-User E2E (auth.method token + none, real render image)
    runs-on: ubuntu-latest
    # Must stay under full-chain-auth-e2e's caps
    # (test_full_chain_auth_lane_outbudgets_the_single_build_lanes).
    timeout-minutes: 70
    if: *main-or-epic-pr-or-secret-revalidation

    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - name: Run terminal auth multi-user E2E
      timeout-minutes: 65
      run: |
        uv run pytest tests/e2e/web_terminals/test_terminal_auth_multiuser_e2e.py -v --tb=short

    - *capture-diagnostics

    - name: Clean up any stranded terminal-auth-multiuser resources
      if: always()
      run: |
        scripts/ci/cleanup_stacks.sh \
          --image osprey-e2e-token-multiuser-readonly:local \
          --image osprey-e2e-open-multiuser-readonly:local \
          osprey-e2e-token-multiuser \
          osprey-e2e-open-multiuser

  full-chain-auth-e2e:
    name: Full-Chain Auth E2E (real sidecar + role-resolved tier render + audit ledgers)
    runs-on: ubuntu-latest
    # Above the single-build auth lanes: test_full_chain_auth_lane_outbudgets_the_single_build_lanes
    # pins the relation and test_full_chain_auth_lane_caps_are_the_measured_ones the numbers.
    timeout-minutes: 85
    if: *main-or-epic-pr-or-secret-revalidation

    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - *playwright-cache-key

    - *playwright-apt

    - *playwright-cache-restore

    - *playwright-chromium

    - name: Run full-chain auth E2E
      timeout-minutes: 75
      env:
        PYTHONPATH: scripts/ci/pytest_plugins  # for -p no_skips
      run: |
        uv run pytest tests/e2e/test_full_chain_auth.py -v --tb=short \
          -p no_skips --no-skips-message "✅ every full-chain auth test ran; none skipped"

    - *capture-diagnostics

    - name: Clean up any stranded full-chain-auth resources
      if: always()
      run: |
        scripts/ci/cleanup_stacks.sh \
          --image osprey-e2e-full-chain-auth-auth:local \
          --image osprey-e2e-full-chain-auth-operator:local \
          --image osprey-e2e-full-chain-auth-probe:local \
          --image osprey-e2e-full-chain-auth:local \
          osprey-e2e-full-chain-auth

  two-shape-boot-e2e:
    name: Two-Shape Boot E2E (bridge + host network axis, podman-compose)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    if: *main-or-epic-pr-or-secret-revalidation

    steps:
    # Out of disk, podman-compose 1.0.6 answers `up -d` with 0 and creates no container; the capture logs `df -h /`.
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - name: Pin podman-compose 1.0.6 as podman's compose provider
      # No `--optional`: a runner that lost podman reds here.
      run: python3 scripts/ci/podman_compose.py pin

    - name: Step 0 — assert the compose provider is podman-compose 1.0.6
      # Before the boot, so a wrong engine is caught before the image build is spent under it.
      env:
        CONTAINER_RUNTIME: podman
      run: uv run python scripts/ci/podman_compose.py assert-provider

    - name: Run two-shape boot E2E (podman)
      timeout-minutes: 70
      env:
        OSPREY_E2E_RUNTIME: podman
        CONTAINER_RUNTIME: podman
      # No `podman system service` / DOCKER_HOST, unlike the podman lifecycle lane: podman-compose reads
      # no socket, and the variable would be the only difference between step 0 and this step.
      run: |
        uv run pytest tests/e2e/test_two_shape_boot.py -v --tb=short

    - *capture-diagnostics-podman

    - name: Clean up any stranded two-shape resources
      if: always()
      run: |
        podman rm -f osprey-e2e-two-shape-event-dispatcher || true
        podman rm -f osprey-e2e-two-shape-dispatch-worker-1 || true
        podman rm -f osprey-e2e-two-shape-agent-record || true
        podman rm -f osprey-e2e-two-shape-agent-record-clickhouse || true
        podman volume rm osprey-e2e-two-shape_dispatch_workspace_1 || true
        podman volume rm osprey-e2e-two-shape_agent_record_clickhouse_data || true
        podman network rm osprey-e2e-two-shape_osprey-network || true
        podman rmi -f osprey-e2e-two-shape:local || true
        podman rmi -f osprey-e2e-two-shape-dispatch:local || true

  qmd-sidecar-e2e:
    name: qmd Sidecar E2E (image build + live daemon over a fixture corpus)
    runs-on: ubuntu-latest
    if: *same-repo-pr-or-secret-revalidation
    # Covers the step caps plus the image build; tests/integration/test_qmd_sidecar_time_budget.py checks it.
    timeout-minutes: 240
    env:
      OSPREY_QMD_IMAGE: osprey-qmd:ci

    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - name: Build the sidecar image
      # Restore only: a PR-saved cache would be readable by that PR alone.
      uses: ./.github/actions/build-qmd-image
      with:
        # The mounted-models build below reuses this builder and cache.
        keep-builder: "true"

    - name: Run qmd sidecar E2E
      # Outlasts SIDECAR_ARIEL_TEST_TIMEOUT + SIDECAR_OKF_TEST_TIMEOUT (7041 s) rounded up, plus 5 min;
      # test_qmd_sidecar_time_budget.py checks it.
      timeout-minutes: 125
      run: uv run pytest tests/integration/ -m "dockerbuild and not wallclock" -k qmd -v --tb=short

    - name: Run the wall-clock budgets serially
      timeout-minutes: 15
      run: uv run python scripts/check.py run pytest-wallclock

    - name: Run the multi-user shared-bundle sidecar E2E
      # The `qmd` half of test_deploy_lifecycle.py, which the lifecycle lanes deselect. Outlasts
      # DEPLOY_LIFECYCLE_QMD_TIMEOUT (2802 s); test_qmd_sidecar_time_budget.py checks it.
      timeout-minutes: 55
      run: uv run pytest tests/e2e/test_deploy_lifecycle.py -m qmd -v --tb=short

    - name: Build the sidecar image with the model fetches skipped
      run: |
        set -euo pipefail
        docker buildx build \
          --build-arg OSPREY_QMD_MODELS_MOUNTED=1 \
          --tag osprey-qmd:ci-mounted \
          --load \
          --cache-from type=local,src=/tmp/qmd-buildx-cache \
          src/osprey/templates/services/qmd

    - name: Run the mounted-models E2E
      timeout-minutes: 10
      env:
        OSPREY_QMD_MOUNTED_IMAGE: osprey-qmd:ci-mounted
      run: uv run pytest tests/integration/test_qmd_models_mount.py -v --tb=short

    - *capture-diagnostics

    # Before the image cleanup: a surviving container pins its image.
    - name: Clean up any stranded shared-bundle e2e resources
      if: always()
      run: |
        scripts/ci/cleanup_stacks.sh --sweep osprey-e2e-mus-p3

    - name: Clean up the sidecar images
      if: always()
      run: |
        docker rmi -f osprey-qmd:ci || true
        docker rmi -f osprey-qmd:ci-mounted || true

  qmd-cache-warmup:
    name: qmd Layer Cache Warm-up (pushes to main)
    runs-on: ubuntu-latest
    # Main pushes only: a PR can restore caches from main but not from other PRs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 45

    steps:
    - *checkout

    - name: Warm the qmd layer cache
      uses: ./.github/actions/build-qmd-image
      with:
        warm: "true"

  target-switch-agentic-e2e:
    name: Control-Target Switch Agentic E2E (a real agent moving between the virtual accelerator and the bench IOC)
    runs-on: ubuntu-latest
    if: *full-ci-pr-or-secret-revalidation
    timeout-minutes: 45

    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - *llm-preflight-probe

    - *assert-container-runtime

    - &build-va-image
      name: Build the virtual accelerator image
      uses: ./.github/actions/build-virtual-accelerator-image

    - name: Build the bench IOC image
      # After the VA image: it reuses that action's Buildx builder.
      uses: ./.github/actions/build-bench-ioc-image

    - *install-pinned-cli

    - name: Run the control-target switch agentic E2E
      timeout-minutes: 35
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
        PYTHONPATH: scripts/ci/pytest_plugins  # for -p no_skips
      run: |
        uv run pytest tests/e2e/test_target_switch_agentic.py -v --tb=short \
          -p no_skips --no-skips-message "✅ every control-target switch agentic test ran; none skipped"

    - *capture-diagnostics

    - name: Clean up the target images
      if: always()
      uses: ./.github/actions/remove-virtual-accelerator-images
      with:
        extra-tags: bench-ioc:latest

  va-live-e2e:
    name: Live VA E2E — ${{ matrix.group }}
    runs-on: ubuntu-latest
    if: *same-repo-pr-or-secret-revalidation
    timeout-minutes: ${{ matrix.timeout }}
    # Every suite in exactly one cell (the wiring test reads `suites`); modules sharing the session
    # container stay in one cell, in order.
    strategy:
      fail-fast: false
      matrix:
        include:
        - group: session-container
          suites: >-
            tests/va/e2e/test_approval_smoke.py tests/va/e2e/test_limits_enforcement.py
            tests/va/e2e/test_orbit_response.py tests/va/e2e/test_full_sweep.py
            tests/va/e2e/test_finder_live_reads.py tests/va/e2e/test_scenario_reload.py
            tests/va/e2e/test_sim_apply_va.py
            tests/va/e2e/test_va_put_surface.py tests/va/e2e/test_planted_journal.py
            tests/va/e2e/test_substrate_parity.py tests/va/e2e/test_chain_boot.py
          als_lane: false
          timeout: 40
          step_timeout: 20
        - group: measurements
          suites: >-
            tests/va/e2e/test_pyaml_measure_guarded.py tests/va/e2e/test_check_b_served.py
          als_lane: false
          timeout: 40
          step_timeout: 20
        - group: facility-trees
          suites: >-
            tests/va/e2e/test_mml_trees_boot.py
          als_lane: true
          timeout: 40
          step_timeout: 20
        # Two plan lanes, one per control target, on a full Docker stack (`stack` is its project).
        - group: plan-deploy
          suites: >-
            tests/va/e2e/test_bluesky_lanes.py
          als_lane: false
          timeout: 60
          step_timeout: 55
          stack: lane-e2e
        # Two live CA servers: the virtual accelerator and the bench IOC.
        - group: target-switch
          suites: >-
            tests/va/e2e/test_target_switch.py tests/va/e2e/test_bench_ioc_live.py
            tests/va/e2e/test_live_standin.py tests/va/e2e/test_per_target_posture.py
            tests/va/e2e/test_model_status_va.py tests/va/e2e/test_ca_loop_exit.py
          als_lane: false
          bench_ioc: true
          timeout: 30
          step_timeout: 15

    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - *assert-container-runtime

    - *build-va-image

    - name: Build the bench IOC image
      # After the VA image: it reuses that action's Buildx builder.
      if: matrix.bench_ioc
      uses: ./.github/actions/build-bench-ioc-image

    - name: Run the live virtual accelerator E2E
      timeout-minutes: ${{ matrix.step_timeout }}
      env:
        OSPREY_VA_E2E_ENABLE: "1"
        SUITES: ${{ matrix.suites }}
        PYTHONPATH: scripts/ci/pytest_plugins  # for -p no_skips
      # No xdist: the conftest keeps ONE session container per process.
      run: |
        # The cell's suites are several paths: split on purpose.
        # shellcheck disable=SC2086
        uv run pytest $SUITES \
          -v --tb=short \
          -p no_skips --no-skips-message "✅ every live virtual accelerator test ran; none skipped"

    - name: Run the real-facility lane on the NSLS-II stand-in
      if: matrix.als_lane
      timeout-minutes: 10
      env:
        OSPREY_ALS_LANE_STAND_IN: tests/fixtures/mml/nsls2
        PYTHONPATH: scripts/ci/pytest_plugins  # for -p no_skips
      run: |
        uv run pytest tests/cli/test_als_lane.py -v --tb=short \
          -p no_skips --no-skips-message "✅ the real-facility lane ran; none skipped"

    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: va-live-e2e-${{ matrix.group }}
    - name: Clean up any stranded stack resources
      if: always() && matrix.stack
      env:
        STACK: ${{ matrix.stack }}
      run: |
        scripts/ci/cleanup_stacks.sh "$STACK"

    - name: Clean up the target images
      if: always()
      uses: ./.github/actions/remove-virtual-accelerator-images
      with:
        # Every cell: removing a tag the cell never built is a no-op.
        extra-tags: bench-ioc:latest

  # No job-level `if:`: it decides inside, so it never ends skipped (the gate treats it as always-on).
  # The credential never shares a step with code the change controls, and nothing the job builds
  # reaches the shared Actions cache.
  canopy-contract:
    name: CANOPY contract
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        # Later steps run the change's code: leave no token in the git config.
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      with:
        enable-cache: false

    - name: Decide whether the change needs the contract
      id: decide
      # The triggers admit only integration bases (main, epic/**), so only a fork pull request skips.
      env:
        EVENT_NAME: ${{ github.event_name }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        run=true
        if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REPO" != "$REPO" ]]; then
          run=false
          echo "CANOPY contract not run: a pull request from a fork has no CANOPY read credential; a maintainer runs the contract through a workflow dispatch" >> "$GITHUB_STEP_SUMMARY"
        fi
        echo "run=$run" >> "$GITHUB_OUTPUT"

    - name: Require the CANOPY read credential
      id: credential
      if: steps.decide.outputs.run == 'true'
      env:
        TOKEN: ${{ secrets.CANOPY_READ_TOKEN }}
        BRANCH: ${{ github.head_ref || github.ref_name }}
      run: |
        if [[ -z "$TOKEN" ]]; then
          echo "::error::this change needs the CANOPY contract, which needs the CANOPY read credential: a maintainer re-runs it with gh workflow run ci.yml --ref $BRANCH"
          exit 1
        fi

    - name: Read the proven commits from the package
      id: pin
      if: steps.decide.outputs.run == 'true'
      # Each value reaches `git fetch` beside the credential: 40-hex only.
      run: |
        python3 src/osprey/integrations/canopy/proven.py --pins > pins
        canopy="$(sed -n 's/^canopy=//p' pins)"
        pydm="$(sed -n 's/^PyDMConverter=//p' pins)"
        for value in "$canopy" "$pydm"; do
          if [[ ! "$value" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::proven.py --pins names a value that is not a 40-hex commit: $value"
            exit 1
          fi
        done
        {
          echo "canopy=$canopy"
          echo "pydm=$pydm"
        } >> "$GITHUB_OUTPUT"

    - name: Fetch CANOPY and PyDMConverter at the proven commits
      id: fetch
      if: steps.decide.outputs.run == 'true'
      env:
        TOKEN: ${{ secrets.CANOPY_READ_TOKEN }}
        CANOPY_REPOSITORY: ${{ vars.CANOPY_REPOSITORY }}
        PYDMCONVERTER_REPOSITORY: ${{ vars.PYDMCONVERTER_REPOSITORY }}
        CANOPY_COMMIT: ${{ steps.pin.outputs.canopy }}
        PYDM_COMMIT: ${{ steps.pin.outputs.pydm }}
        SOURCES: ${{ runner.temp }}/canopy-sources
      # The only step with the credential: git alone, via an askpass helper that holds no secret.
      run: |
        set -euo pipefail
        askpass="$RUNNER_TEMP/canopy-askpass"
        # Single quotes on purpose: $1 and ${TOKEN} expand when git runs the helper, not here.
        # shellcheck disable=SC2016
        printf '%s\n' '#!/bin/sh' 'case "$1" in Username*) echo x-access-token ;; *) printf "%s\n" "${TOKEN}" ;; esac' > "$askpass"
        chmod 700 "$askpass"
        fetch_at() {
          # $1 = clone directory, $2 = owner/name, $3 = commit
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git clone --quiet "https://github.com/$2" "$1"
          if ! git -C "$1" cat-file -e "$3^{commit}" 2>/dev/null; then
            GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git -C "$1" fetch --quiet origin "$3"
          fi
          git -C "$1" checkout --quiet --detach "$3"
          # The install asks the clone for the commit by its id.
          git -C "$1" config uploadpack.allowAnySHA1InWant true
        }
        fetch_at "$SOURCES/canopy" "$CANOPY_REPOSITORY" "$CANOPY_COMMIT"
        fetch_at "$SOURCES/pydmconverter" "$PYDMCONVERTER_REPOSITORY" "$PYDM_COMMIT"
        {
          echo "canopy=$SOURCES/canopy"
          echo "pydm=$SOURCES/pydmconverter"
        } >> "$GITHUB_OUTPUT"

    - name: Install CANOPY and PyDMConverter at the proven commits
      id: install
      if: steps.decide.outputs.run == 'true'
      env:
        CANOPY_CLONE: ${{ steps.fetch.outputs.canopy }}
        PYDM_CLONE: ${{ steps.fetch.outputs.pydm }}
        CANOPY_COMMIT: ${{ steps.pin.outputs.canopy }}
        PYDM_COMMIT: ${{ steps.pin.outputs.pydm }}
      # `git+file://` so the distribution records its commit, which the contract reads.
      run: |
        set -euo pipefail
        if git config --global --get-regexp '^url\..*\.insteadof$' > /dev/null; then
          echo "::error::a git URL rewrite is still configured; refusing to run the build beside it"
          exit 1
        fi
        uv sync --locked --extra dev
        # Constrained by uv.lock's install set: CANOPY adds what the lock lacks and moves nothing it holds.
        uv export --frozen --no-hashes --no-emit-workspace --extra dev \
          > "$RUNNER_TEMP/lock-constraints.txt"
        # The override makes the local clone CANOPY's one PyDMConverter source, so the install reaches no remote.
        pydm="PyDMConverter @ git+file://${PYDM_CLONE}@${PYDM_COMMIT}"
        printf '%s\n' "$pydm" > "$RUNNER_TEMP/canopy-overrides.txt"
        uv pip install -c "$RUNNER_TEMP/lock-constraints.txt" \
          --override "$RUNNER_TEMP/canopy-overrides.txt" \
          "canopy[mcp,convert] @ git+file://${CANOPY_CLONE}@${CANOPY_COMMIT}" \
          "PyDMConverter @ git+file://${PYDM_CLONE}@${PYDM_COMMIT}"

    - name: Run the CANOPY contract
      id: contract
      if: steps.decide.outputs.run == 'true'
      run: |
        set -o pipefail
        python3 scripts/check.py run canopy-contract 2>&1 | tee canopy-contract.log

    - name: Name the proven commits
      id: summary
      if: always() && (steps.contract.outcome == 'success' || steps.contract.outcome == 'failure')
      run: |
        grep '^check: ' canopy-contract.log | tail -n 1 >> "$GITHUB_STEP_SUMMARY"

  all-checks-passed:
    name: All CI Checks Passed
    # qmd-cache-warmup stays out: it runs on main pushes only, whose own run it already turns red.
    needs: [test, serial-suites, dependency-floor, connectors-standalone, connectors-compat-plan, connectors-compat, framework-at-connectors-floor, optimizer, lint, docs, package, static-checks, visual-theming, visual-theming-agent, visual-baselines-push, frontend-js, build-boot-smoke, e2e-tests, e2e-no-model, agent-record-e2e, deploy-e2e, dispatch-stack-e2e, host-record-e2e, stack-e2e, orm-roundtrip-e2e, scan-agentic-e2e, nextcloud-talk-bridge-e2e, gchat-bridge-e2e, teams-slack-bridge-e2e, dockerfile-e2e, dockerfile-agent-e2e, privilege-split-e2e, agentic-per-preset, multi-user-deploy-lifecycle-e2e, auth-perimeter-e2e, terminal-auth-multiuser-e2e, full-chain-auth-e2e, two-shape-boot-e2e, qmd-sidecar-e2e, target-switch-agentic-e2e, va-live-e2e, plugin-smoke, canopy-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Not on cancel: a superseded run must not leave a red gate on the same sha.
    if: ${{ !cancelled() }}

    steps:
    - name: Check all jobs status
      # Every input goes through `env:`, never `${{ }}` in `run:` (script injection).
      env:
        NEEDS: ${{ toJSON(needs) }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        HEAD_BRANCH: ${{ github.head_ref }}
        EVENT_NAME: ${{ github.event_name }}
        REVALIDATE: ${{ inputs.revalidate_secret_lanes }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HAS_FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
      run: |
        # A skip passes (the lane's `if:` did not match the event), but a revalidation must run every lane.
        passing='["success", "skipped"]'
        if [[ "$EVENT_NAME" == "workflow_dispatch" && "$REVALIDATE" == "true" ]]; then passing='["success"]'; fi
        summary=${GITHUB_STEP_SUMMARY:-/dev/null}
        {
          echo "| Job | Result |"
          echo "| --- | --- |"
          jq -nr --argjson needs "$NEEDS" '$needs | to_entries[] | "| \(.key) | \(.value.result) |"'
        } >> "$summary"

        if [[ "$PR_AUTHOR" == "dependabot[bot]" ]]; then
          hint="Dependabot runs get no secrets, so the API-key lanes skipped. After reviewing the diff, revalidate: \`gh workflow run ci.yml --ref $HEAD_BRANCH -f revalidate_secret_lanes=true\`"
        elif [[ "$EVENT_NAME" == "pull_request" && "$HAS_FULL_CI" != "true" ]]; then
          hint="The model-spending lanes run only under the full-ci label: \`gh pr edit $PR_NUMBER --add-label full-ci\`"
        fi
        if [[ -n "${hint:-}" ]]; then
          echo "ℹ️  $hint"
          printf '\n%s\n' "$hint" >> "$summary"
        fi

        # The baseline push runs only when a same-repo PR rendered a baseline, never on a dispatch,
        # so its skip always passes; its failure fails like any other.
        bad=$(jq -nr --argjson needs "$NEEDS" --argjson ok "$passing" --arg push visual-baselines-push \
          '$needs | to_entries[] | select(.value.result | IN($ok[]) | not)
            | select(.key != $push or .value.result != "skipped") | "❌ \(.key): \(.value.result)"')
        if [[ -n "$bad" ]]; then
          echo "$bad"
          exit 1
        fi
        echo "✅ All CI checks passed!"
