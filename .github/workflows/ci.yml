  orm-roundtrip-e2e:
    name: ORM + Grid Scan Roundtrip E2E (VA + bluesky bridge + Tiled, full Docker stack)
    runs-on: ubuntu-latest
    # Sequential steps: two modules bind CA port 5064, and a runner fits one stack at a time.
    needs: changes
    if: *same-repo-pr-or-secret-revalidation
    timeout-minutes: 100

    steps:
    - *free-runner-disk

    # Docker 29's containerd image store unpacks shared layers per image and ran this lane out of
    # disk. Drop this once the lane builds less per stack.
    - name: Use the overlay2 image store
      run: |
        sudo mkdir -p /etc/docker
        [ -s /etc/docker/daemon.json ] || echo '{}' | sudo tee /etc/docker/daemon.json >/dev/null
        sudo jq '.features["containerd-snapshotter"] = false' /etc/docker/daemon.json \
          | sudo tee /etc/docker/daemon.json.new >/dev/null
        sudo mv /etc/docker/daemon.json.new /etc/docker/daemon.json
        sudo systemctl restart docker
        driver=$(docker info --format '{{.Driver}}')
        echo "storage driver: $driver"
        [ "$driver" = overlay2 ]

    - *checkout-full-history

    - *install-uv

    - *python-3-11

    - *setup-compose

    - *install-osprey

    - name: Run ORM roundtrip E2E
      timeout-minutes: 45
      run: |
        uv run pytest tests/e2e/test_orm_roundtrip.py -v --tb=short

    - name: Run grid scan roundtrip E2E
      timeout-minutes: 40
      run: |
        uv run pytest tests/e2e/test_grid_scan_roundtrip.py -v --tb=short

    - name: Run orbit bump sweep roundtrip E2E
      timeout-minutes: 45
      run: |
        uv run pytest tests/e2e/test_bump_roundtrip.py -v --tb=short

    - name: Run preflight probe E2E
      timeout-minutes: 45
      run: |
        uv run pytest tests/e2e/test_preflight_probe.py -v --tb=short
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: orm-roundtrip-e2e
        engine: docker
    - name: Clean up any stranded stack resources
      if: always()
      run: |
        scripts/ci/cleanup_stacks.sh \
          orm-roundtrip \
          grid-scan-roundtrip \
          bump-roundtrip \
          preflight-probe

