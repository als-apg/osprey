        fi
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: e2e-tests
        engine: docker
    # The deploy's own teardown does not run when the job is killed, and a reused runner keeps the
    # stack. Exact names, never a prune.
