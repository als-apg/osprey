name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    # Epic phase branches merge into an epic/<name> integration base, not
    # main, and their PRs are where the phase's CI certification happens --
    # the full lane set must run there, not only on the final epic-to-main
    # PR.
    branches: [ main, 'epic/**' ]
  workflow_dispatch:
    inputs:
      e2e_filter:
        description: >-
          Optional pytest path/keyword filter for the E2E job (debug-only;
          PR runs always use the full suite). Example:
          'tests/e2e/test_rf_cavity_correlation_scenario.py
          tests/e2e/test_vacuum_burst_scenario.py'
        required: false
        default: ''
      run_benchmarks:
        description: >-
          Run the on-demand benchmark lanes (channel-finder MCP benchmarks)
          instead of the E2E lane. The home for e2e suites that are useful
          but too expensive to run on every PR — trigger before a release or
          after touching the code they exercise.
        required: false
        type: boolean
        default: false
      revalidate_secret_lanes:
        description: >-
          Run the API-key-dependent lanes (agentic flows, dispatch stacks,
          Nextcloud/Google Chat bridges) against this ref. Dependabot's own
          runs are treated as fork runs and receive only the Dependabot
          secret store, so ALS_APG_API_KEY is empty and those lanes skip on
          its pull requests. After reading the dependency diff, a maintainer
          revalidates the branch with:
          gh workflow run ci.yml --ref <branch> -f revalidate_secret_lanes=true
        required: false
        type: boolean
        default: false
  schedule:
    # Nightly at 07:00 UTC (midnight Pacific) for the always-on jobs
    # (test, lint, docs, ...; no `if:`). Every e2e/benchmark lane is
    # PR-gated or dispatch-gated and does NOT run on this schedule.
    - cron: '0 7 * * *'

# Note: This workflow runs tests, linting, docs build, and package checks
# For documentation deployment to GitHub Pages, see .github/workflows/docs.yml

# Pull openobserve from our ghcr mirror rather than ECR Public. ECR Public
# rate-limits anonymous pulls per source IP and GitHub-hosted runners share
# egress IPs, so E2E deploys intermittently died on
# "toomanyrequests: Rate exceeded". Set at workflow level because the ref is
# identical in every deploying job; jobs that don't deploy ignore it.
#
# The mirror is PRIVATE, so each deploying job also needs the ghcr login step.
# Populate/refresh it with .github/workflows/mirror-openobserve.yml, which must
# be re-run whenever the pin in
# src/osprey/templates/services/openobserve/docker-compose.yml.j2 moves.
env:
  OSPREY_OPENOBSERVE_IMAGE: ghcr.io/als-apg/openobserve:v0.14.4
  # ALS-APG endpoint override: set the ALS_APG_BASE_URL repository variable
  # to point every LLM-touching job (probes and pytest alike) at an
  # alternate gateway. Empty/unset keeps the provider's default endpoint.
  ALS_APG_BASE_URL: ${{ vars.ALS_APG_BASE_URL }}

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Without a bound, a single wedged xdist worker holds the lane at 99% for
    # the 6-hour default.
    #
    # 45 rather than 30, and the cells are no longer close to it. A healthy run
    # is ~11 min (ubuntu 3.12) to ~22 min (ubuntu 3.11, which also measures
    # coverage); macOS finishes in ~9-14. What forces the headroom is a known
    # intermittent tail worth ~12 minutes: a worker wedges mid-test and its
    # share has to be redistributed to a replacement, or the session hangs
    # after the last test on non-daemon threads that outlive it. Both are
    # visible in this lane's uploaded diagnostics, and neither is bounded by
    # anything the suite controls, so a cap tight enough to catch them also
    # reds the runs where they merely cost time.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
        os: [ubuntu-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      # virtual-accelerator: carries the whole serving stack -- pcaspy, and
      # lume-pva-apg[ca,pva] which brings p4p with it -- none of which is in
      # dev. The live Channel Access suites (run in their own step below, one
      # process per module) and tests/va/test_facility_seam.py's served-boot
      # branch need all of it. These guard their imports, so without the extra
      # they SKIP rather than error: the lane stays green having never touched
      # Channel Access. That is why the extra is pinned here and why
      # tests/va/test_live_ca_venue_guard.py fails this lane outright if the
      # server does not import on linux/x86_64.
      #
      # The bluesky stack (bluesky/ophyd-async/tiled) is a core dependency, so
      # plain `uv sync` carries it. tests/services/bluesky_bridge/* guard their
      # imports with `pytest.importorskip` and would SKIP silently if the stack
      # ever left the install set — test_ci_workflow_wiring.py pins the stack in
      # [project] dependencies for that reason.
      run: uv sync --extra dev --extra virtual-accelerator

    - name: Run unit tests
      # timeout-minutes is deliberately below the job's cap. A JOB timeout is a
      # hard cancel: the runner stops the job outright, and the collection steps
      # below never get a dependable chance to run, so a wedged lane is recorded
      # as `cancelled` with nothing to read. Failing the STEP instead costs the
      # same wall clock and leaves the summary and upload steps room to run.
      #
      # The 5-minute margin is not sized to the collection steps, which take two
      # seconds between them — it is there so this cap sits clear of the ~12
      # minute intermittent tail described on the job cap above. A cap set just
      # above the healthy runtime kills the runs that hit that tail and would
      # have passed anyway; the value is deliberately loose for that reason, and
      # tightening it is how this lane starts flaking.
      timeout-minutes: 40
      env:
        # Switches on tests/ci_diagnostics.py: a continuously flushed event log
        # and stack-dump file per xdist worker, written here and uploaded below.
        # Unset everywhere else, so local runs are unaffected.
        OSPREY_CI_DIAG_DIR: ci-diag
      # Coverage is measured only on the cell that uploads to Codecov below —
      # the other three cells were paying ~25% runtime (measured) for a report
      # nobody reads.
      #
      # -n 4 --dist loadgroup (pytest-xdist): the cross-test global-state
      # bleed this lane used to flake on under -n (stdlib subprocess.run
      # monkeypatches, loguru sink reconfiguration) is file-local, so pinning
      # every file to a single worker is what makes results
      # placement-invariant. Stock loadgroup does NOT do that on its own — it
      # scopes by the `@group` suffix and gives each unmarked nodeid a scope
      # of its own — so tests/conftest.py overrides
      # pytest_xdist_make_scheduler with FileOrGroupScheduling: `@group`
      # nodeids keep upstream's grouping, everything else gets exact
      # `--dist loadfile` semantics. That override is keyed on
      # `--dist loadgroup` alone, so the e2e lane's loadfile and ad-hoc
      # `--dist load`/worksteal runs are untouched.
      #
      # xdist_group("docker") rides on top, covering the ten container-
      # starting files (the ARIEL Postgres set plus the mongodb archiver
      # connector): one group means one worker, one testcontainers session,
      # one ryuk — two reapers starting at once race the Docker port mapper.
      #
      # -n 4 rather than `auto`: a fixed count keeps the four matrix cells
      # comparable and matches the vCPU count of a standard GitHub-hosted
      # Linux runner. tests/deployment/test_ci_workflow_wiring.py pins both
      # this invocation and the conftest override, so the flag cannot outlive
      # the scheduler that makes it safe.
      #
      # -m "not pty" hands the real-terminal suite to the serial step below.
      # Those scenarios assert on repaint cadence and on a spinner ADVANCING
      # between two frames, so they measure the box as much as the code, and
      # three other xdist workers competing for it is exactly the load that
      # turns "the monitor thread is running" into an intermittent red.
      # Written as a marker deselection rather than `--ignore=tests/pty`
      # because tests/pty/test_stub_coverage.py is unmarked on purpose and
      # belongs in this lane: it scans the deploy path for runtime argv the
      # stub cannot answer, needs no terminal, and is what makes the serial
      # step's failures worth reading.
      run: |
        if [ "${{ matrix.python-version }}" = "3.11" ] && [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
          COV_ARGS="--cov=src/osprey --cov=packages/osprey-connectors/src/osprey_connectors --cov-report=xml --cov-report=term"
        else
          COV_ARGS=""
        fi
        # No `-o faulthandler_timeout` here, deliberately. pytest's built-in
        # version does reach the job log under `-n` (xdist relays worker
        # stderr), but it dumps once per test and lands only in the log — which
        # is precisely what a cancelled job truncates. tests/ci_diagnostics.py
        # (armed by OSPREY_CI_DIAG_DIR above) writes the same stacks to a file
        # per worker that is uploaded as an artifact, and repeats the dump, so
        # a genuinely stuck stack is distinguishable from a merely slow one.
        # Setting the ini option here would also be actively unsafe: pytest
        # implements it with faulthandler.dump_traceback_later, whose watchdog
        # walks frames without the GIL and segfaults workers that are inside a
        # YAML or Jinja parser. That crashed this lane on three consecutive
        # runs; tests/ci_diagnostics.py samples from a Python thread instead.
        #
        # Still dump-only, never kill: the container-starting files can sit in
        # a cold image pull for minutes and must not be shot for it.
        #
        # The two live Channel Access modules are excluded here and run in the
        # isolated step below: libca is process-global and not thread-safe, and
        # a pyepics PV finalized by the garbage collector — which runs on
        # whatever thread allocates next — segfaults inside libca. In a
        # long-lived xdist worker that shares 16k other tests, the crash lands
        # minutes later in an unrelated test and EPICS' signal handling turns
        # it into a silent wedge rather than a death. A live CA client/server
        # pair is only safe in a process of its own.
        #
        # --durations=50: the ubuntu cells run ~2x the macOS wall clock and the
        # gap is undiagnosed. A per-cell slow-test ranking in every run is what
        # tells "one group of tests got expensive" apart from "the whole suite
        # is uniformly slower on this runner" — remove once the unit lane's
        # runtime question is settled.
        uv run pytest tests/ --ignore=tests/e2e --ignore=tests/va/test_record_factory.py --ignore=tests/va/test_apply_fault.py -m "not pty" -v --tb=short --durations=50 -n 4 --dist loadgroup $COV_ARGS

    # The two steps below are the reason the step above has its own timeout.
    # They run on success too: on a green lane the summary is one line, and on
    # a killed lane it is the only place the answer exists.
    - name: Summarise lane diagnostics
      if: always()
      # Names the test each worker was inside when the lane stopped. All four
      # workers stalling at once means the runner went away; one worker stalling
      # means the test it names deadlocked. That distinction decides whether a
      # rerun is legitimate, and it is not recoverable from the job log.
      #
      # `python3`, not `uv run`: the script is stdlib-only and standalone by
      # design, so it still reports when the failure being diagnosed is the
      # dependency install itself. `|| true` because a broken diagnostic must
      # never turn a green lane red, nor mask the real failure on a red one.
      run: python3 scripts/ci/diag_summary.py ci-diag >> "$GITHUB_STEP_SUMMARY" || true

    - name: Upload lane diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ci-diag-unit-${{ matrix.python-version }}-${{ matrix.os }}
        path: ci-diag/
        retention-days: 14
        if-no-files-found: warn

    - name: Run real-terminal pty suite serially
      # Linux only, and not because the suite cannot run elsewhere: it is POSIX
      # and passes on macOS too (it self-skips only off-POSIX, which no cell in
      # this matrix is). It is pinned here because the scenarios assert on
      # timing (a spinner ADVANCING between two frames, a late line arriving
      # after a kill), and the macOS runners are the noisier, slower, more
      # contended ones, so they would be where this suite starts flaking. What
      # it covers is not OS-specific either: it is how OSPREY's own renderer
      # drives a terminal. Both Linux Python cells run it, so it is not
      # single-interpreter, and a developer on macOS runs it locally.
      if: matrix.os == 'ubuntu-latest'
      # Serial by construction, and no xdist flags. Each scenario allocates a
      # pty, starts a real verb on it in its own session, and asserts on what
      # the terminal showed, including that a spinner ADVANCED between two
      # frames, which is how the monitor thread is proven to be running. That
      # measures the box as much as the code, so it is exactly the assertion a
      # loaded runner turns into an intermittent red. Hence its own step here
      # rather than a share of the parallel lane above, which deselects the
      # marker.
      #
      # `-m pty` and not the bare directory: tests/pty/test_stub_coverage.py is
      # unmarked on purpose, needs no terminal, and already ran in the parallel
      # step. Selecting the directory alone would run it twice.
      #
      # No actions/cache for .cache/pty-exemplar. The session fixture renders
      # that repo with the real `osprey init` and `osprey build` in ~1.2 s for
      # ~380 KB, which is less than a cache round trip costs, and its key is a
      # content hash of the templates plus the scaffolder that stamps them out:
      # every PR touching a rendered file would miss the cache anyway. The
      # checkout is writable, so the fixture writes there and the runner throws
      # it away with everything else.
      #
      # The job cap above stays at 45 rather than growing to absorb this step.
      # 40 (the unit step) plus 10 (here) exceeds it on paper, but only in a run
      # where the unit step has already burned its own cap, which is a red lane
      # whatever happens next: nothing is lost by the job cap cutting a step
      # short in that case. On a healthy lane this step costs well under a
      # minute, so the tail margin the job cap comment argues for is untouched.
      timeout-minutes: 10
      run: uv run pytest tests/pty/ -m pty -v --tb=short

    - name: Run live Channel Access suites in isolation
      # One pytest process per module via the live-CA gate — the same venue
      # rule the local certification uses. --pva asserts pcaspy/p4p/
      # lume-pva-apg import before running, so the served-boot branch of the
      # seam test actually executes. The gate fails unless every module exits
      # 0 with zero skips and at least one pass, which closes the gap the
      # in-sweep venue guard cannot: a skipped live suite fails THIS step even
      # if a future marker or fixture skip slips past the import guard.
      if: matrix.os == 'ubuntu-latest'
      run: uv run python scripts/va/live_ca/gate.py --pva

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v7
      if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  dependency-floor:
    name: Archiver suite at the declared dependency floor
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # pyproject declares `pandas>=2.2.3` / `numpy>=2.2.6`, but every other lane
    # resolves to the newest release, so nothing ever ran the floor and the
    # declaration was an unverified claim. It is not a formality: pandas 3
    # changed two things the archiver code touches — the default string dtype
    # (object -> str) and non-nanosecond datetime resolution (coerced -> kept) —
    # so "green on latest" does not imply "works at the floor". This lane pins
    # the declared minimums so the floor either holds or fails here, rather than
    # at an operator's site running an older pandas.
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.11

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Pin pandas and numpy to the declared floor
      # Must come after `uv sync`, which would otherwise resolve them back up.
      run: uv pip install "pandas==2.2.3" "numpy==2.2.6"

    - name: Show resolved versions
      # Printed so a failure here is immediately attributable to the pin rather
      # than mistaken for a normal test regression.
      run: uv run --no-sync python -c "import pandas, numpy; print('pandas', pandas.__version__, 'numpy', numpy.__version__)"

    - name: Run the archiver suite
      # `--no-sync` keeps the pin: a bare `uv run` re-syncs and silently undoes
      # the downgrade, which would make this lane a duplicate of `test`.
      # Scoped to the pandas-dependent surface — this lane exists to check the
      # dependency floor, not to re-run the whole suite a second time.
      run: |
        uv run --no-sync pytest \
          tests/connectors/test_archiver_timerange.py \
          tests/connectors/test_epics_archiver_connector.py \
          tests/connectors/test_doocs_archiver_connector.py \
          tests/connectors/test_mock_connector.py \
          tests/connectors/test_archiver_timezone.py \
          tests/connectors/test_simulation_integration.py \
          tests/utils/test_timeseries.py \
          -v --tb=short

  lint:
    name: Lint and Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      # Full history + tags: the package version is derived from the git tag.
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.11

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Run ruff (linting)
      run: |
        uv run ruff check src/ packages/ tests/ --output-format=github

    - name: Run ruff (formatting)
      run: |
        uv run ruff format --check src/ packages/ tests/

    - name: Run mypy (type checking)
      run: |
        uv run mypy src/ packages/osprey-connectors/src/ --no-error-summary || true
      continue-on-error: true

  docs:
    name: Documentation Build (Check Only)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.11

    - name: Install dependencies
      run: uv sync --extra docs

    - name: Build documentation
      run: |
        cd docs
        uv run make html

    - name: Check for broken links
      run: |
        cd docs
        uv run make linkcheck || true
      continue-on-error: true

    - name: Upload documentation artifact
      uses: actions/upload-artifact@v7
      if: github.event_name == 'pull_request'
      with:
        name: documentation-preview
        path: docs/build/html
        retention-days: 7

  package:
    name: Package Build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      # Full history + tags: the package version is derived from the git tag.
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.11

    - name: Build package
      run: uv build

    - name: Check package
      run: uvx twine check dist/*

    - name: Upload package artifacts
      uses: actions/upload-artifact@v7
      with:
        name: package
        path: dist/
        retention-days: 7

  lean-wheel:
    name: Lean connectors wheel
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Install Python
      run: uv python install 3.11

    - name: Build osprey-connectors wheel
      run: uv build --package osprey-connectors

    - name: Verify wheel is self-contained on a bare venv
      run: |
        uv venv /tmp/lean-check --python 3.11
        uv pip install --python /tmp/lean-check/bin/python dist/osprey_connectors-*.whl
        /tmp/lean-check/bin/python -c "
        import importlib, pkgutil, sys
        import osprey_connectors.control_system.epics_connector
        import osprey_connectors.control_system.limits_validator
        import osprey_connectors.errors, osprey_connectors.config, osprey_connectors.logger
        import osprey_connectors.simulation
        bad = sorted({m.split('.')[0] for m in sys.modules} & {'litellm','openai','anthropic','fastapi','playwright','osprey'})
        assert not bad, f'lean wheel loaded: {bad}'
        # Every module in the wheel must import on the bare venv — a missed
        # osprey.* rewrite in a leaf nothing imports transitively (honesty,
        # procedural, the mock/doocs/mongodb connectors) would otherwise ship.
        # walk_packages swallows package import errors unless onerror raises.
        import osprey_connectors
        def _raise(name):
            raise ImportError(f'failed to walk {name}')
        modules = [m.name for m in pkgutil.walk_packages(osprey_connectors.__path__, 'osprey_connectors.', onerror=_raise)]
        for name in modules:
            importlib.import_module(name)
        assert 'osprey' not in sys.modules, 'a lean-wheel module imported the osprey framework'
        print(f'LEAN WHEEL OK ({len(modules)} modules)')
        "

  static-checks:
    name: Tier 0 — Static (preset YAML, skill ↔ MCP-tool consistency, podman-compose parse)
    runs-on: ubuntu-latest
    # Matches the convention the other light lanes use. None of this job's work
    # can hang in principle, but it now shells out to `osprey init`, `osprey
    # build` and a compose parse — new shapes for a job that otherwise inherits
    # the 6-hour default.
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      # Full history + tags: the package version is derived from the git tag.
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.11

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Run Tier 0 static checks
      timeout-minutes: 15
      run: uv run pytest tests/integration/test_preset_static.py -v --tb=short

    - name: Pin podman-compose 1.0.6 as podman's compose provider
      # Identical pin to the two-shape-boot-e2e lane below, for the identical
      # reason: `podman compose` delegates to whichever provider it finds, and
      # on a GitHub runner the first one is the docker-compose CLI plugin — a
      # different engine that accepts `--project-directory`, the very flag the
      # podman argv omits. A parse that ran under the plugin would certify
      # nothing while reporting green. containers.conf names the binary by
      # ABSOLUTE path so the choice cannot depend on PATH ordering.
      #
      # `podman ps` is not decoration: it is the first rootless podman call on
      # the runner and pays the one-time storage-init cost here, where nothing
      # is timing it. Left to the probe below it can outlast that probe's 5s
      # timeout and be read as "no podman on this host".
      #
      # Unlike the two-shape lane's identical step, this one DEGRADES rather
      # than fails when podman is absent. This job carries no `if:` — it gates
      # every push, schedule and fork PR — so a future runner image dropping
      # podman must not red the thing that gates everything for a reason
      # unrelated to what it gates. The coverage is not silently revocable
      # either way: the two-shape lane is not guarded, so podman disappearing
      # still turns that lane red on the next PR.
      run: |
        if ! command -v podman >/dev/null 2>&1; then
          echo "⏭️  podman is not on this runner image — the podman-compose parse"
          echo "    coverage below will skip. The two-shape-boot-e2e lane is NOT"
          echo "    guarded this way and will red if podman is genuinely gone."
          echo "OSPREY_PARSE_SKIP=1" >> "$GITHUB_ENV"
          exit 0
        fi
        pip install --user podman-compose==1.0.6
        PODMAN_COMPOSE_BIN="$(command -v podman-compose || true)"
        if [ -z "$PODMAN_COMPOSE_BIN" ]; then
          echo "❌ podman-compose is not on PATH after install"
          exit 1
        fi
        mkdir -p ~/.config/containers
        cat > ~/.config/containers/containers.conf <<EOF
        [engine]
        compose_providers = ["$PODMAN_COMPOSE_BIN"]
        EOF
        # Second, independent expression of the same choice. The file above is
        # authoritative for podman's own config chain, but a USER-level
        # containers.conf.d drop-in loads after it and would outrank it; this
        # env var sidesteps the chain entirely. Nothing in this repo writes such
        # a drop-in — the exposure is a hypothetical property of a future runner
        # image — so this is hardening, not a fix for a live hole.
        echo "PODMAN_COMPOSE_PROVIDER=$PODMAN_COMPOSE_BIN" >> "$GITHUB_ENV"
        podman --version
        podman ps >/dev/null

    - name: Parse the merged podman topology (podman-compose config, no containers)
      env:
        # Pins the runtime lookup to podman alone. Without it the probe would
        # try docker first, find the runner's live docker daemon, and this step
        # would assert the wrong engine's shape.
        CONTAINER_RUNTIME: podman
      # The cheap half of two-shape-boot-e2e: seconds instead of ~20 minutes,
      # and no container is created. It renders a dispatch-enabled deployment,
      # asks OSPREY for the argv it would hand podman-compose, and runs that
      # argv's `config` — so what gets parsed is the REAL merged document and
      # the REAL --env-file, not a hand-rolled lookalike. `osprey build
      # --skip-deps --skip-lifecycle` stops at the render, which is why this
      # fits in a Tier 0 job at all.
      run: |
        if [ "${OSPREY_PARSE_SKIP:-}" = "1" ]; then
          echo "⏭️  skipped: podman is absent from this runner (see the pin step above)."
          exit 0
        fi
        cat > /tmp/two-shape-parse-override.yml <<'EOF'
        dispatch:
          triggers: tutorial_triggers.yml
          worker_count: 1
          workspace_mode: isolated
          network: bridge
        config:
          claude_code.telemetry.enabled: false
          deployed_services: []
        EOF
        uv run osprey init parse-check --preset hello-world --no-git \
          --override /tmp/two-shape-parse-override.yml
        cd parse-check
        # The two chain members carry the SAME key with DIFFERENT values, so
        # the interpolated result below distinguishes "the merged env file was
        # read" from "the merged env file preserved local-wins precedence".
        printf '\nDISPATCH_WORKER_TOKEN=shared-loses\n' >> .env.shared
        printf 'EVENT_DISPATCHER_TOKEN=local-wins\nDISPATCH_WORKER_TOKEN=local-wins\n' > .env
        uv run osprey build --skip-deps --skip-lifecycle
        uv run python - <<'PY'
        import os
        import subprocess
        import sys
        from pathlib import Path

        from osprey.deployment.compose_generator import (
            compose_base_cmd,
            compose_provider_env,
            resolve_repo_root,
        )
        from osprey.deployment.container_lifecycle import _env_file_args, as_built_compose_files
        from osprey.deployment.runtime_helper import (
            ComposeProvider,
            detect_compose_provider,
            get_runtime_command,
        )
        from osprey.utils.config import load_config

        config = load_config("build/config.yml")
        root = Path(resolve_repo_root(config)).resolve()
        runtime_cmd = get_runtime_command(config)

        info = detect_compose_provider(runtime_cmd, config)
        print("provider banner:", info.banner)
        assert info.provider is ComposeProvider.PODMAN_COMPOSE, info
        assert info.version == (1, 0, 6), info

        # Building the argv is what WRITES .osprey-compose.yml and
        # build/.env.merged; `_env_file_args` is the seam that chooses the
        # merged env file over the two-member chain, exactly as the deploy
        # verbs call it.
        argv = compose_base_cmd(
            runtime_cmd,
            as_built_compose_files(config, root),
            root,
            _env_file_args(root, info.provider),
            info.provider,
        )
        print("argv:", " ".join(argv))
        assert "--project-directory" not in argv, "podman-compose does not parse that flag"

        env = {**os.environ, **compose_provider_env(info.provider, root)}
        parsed = subprocess.run(
            [*argv, "config"], capture_output=True, text=True, env=env, cwd=root, check=False
        )
        sys.stdout.write(parsed.stdout)
        sys.stderr.write(parsed.stderr)
        assert parsed.returncode == 0, "podman-compose could not parse the merged topology"

        for service in ("event-dispatcher", "dispatch-worker-1"):
            assert f"{service}:" in parsed.stdout, f"{service} missing from the merged document"
        assert "local-wins" in parsed.stdout, "build/.env.merged did not interpolate the topology"
        assert "shared-loses" not in parsed.stdout, ".env.shared outranked .env in the merge"
        print("✅ merged topology parses under podman-compose 1.0.6, .env.merged interpolates it")
        PY

    # This lane creates no container — it only renders and parses. The capture
    # still earns its place: when the parse dies, runner disk and the engine's
    # own state are the evidence that separates a real topology error from an
    # engine that was never usable on this runner.
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: static-checks
        engine: podman

  config-key-guard:
    name: Tier 0 — Config-key resurrection guard (manifest ↔ rendered templates)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        # LOAD-BEARING for the `--back-test` run below, which extracts the
        # baseline tree with `git archive <commit>`: a shallow clone cannot
        # reach the baseline. It fails loudly there (RuntimeError -> exit 1)
        # rather than skipping, so dropping this can only red the lane, never
        # quietly hollow it out — but the fix is to restore the depth, not to
        # drop the flag.
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.11

    - name: Install dependencies
      # The guard renders the shipped config.yml.j2 templates through Jinja and
      # parses scripts/config_key_manifest.yml, so it needs the project deps
      # like every other lane.
      run: uv sync --extra dev

    - name: Run config-key resurrection guard (with back-test)
      # ~4.6s. Exit 0 clean, 1 on any failure record — an unmapped rendered
      # key, a dead `evidence` regex, a deleted key resurrected in a template
      # or preset override, an `orphan_sites` regex matching again, template
      # parity drift, and the manifest's own consistency checks. The script's
      # module docstring is the authoritative list.
      #
      # `--back-test` (one command, guard + back-test) is what makes the orphan
      # regexes falsifiable: each must match at the recorded baseline and NOT on
      # the branch, so a regex wired to nothing is caught instead of reporting
      # green. tests/scripts/test_config_key_guard.py covers the same ground in
      # the unit-test lane today — but revocably: its back-test cases skip
      # themselves when the baseline is unreachable, so a checkout-depth or
      # marker-deselection change over there would drop the proof with no red
      # signal to say so. Pinning it to this lane, whose full history is its
      # stated purpose, is what makes the coverage non-revocable.
      run: uv run python scripts/check_config_keys.py --back-test

  visual-theming:
    name: Behavioral + Visual Theming (Playwright, design system)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The default GITHUB_TOKEN is read-only repo-wide; this job's last step
    # pushes regenerated Linux baselines back to the PR branch, so it alone
    # needs contents: write (matches docs.yml's workflow-level grant for the
    # same reason — gh-pages push — scoped here to just this job instead of
    # the whole ci.yml workflow).
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    # Job-level "paths" isn't a thing in GitHub Actions — dorny/paths-filter
    # computes it as a step output instead, so every later step can gate on
    # it. An unrelated PR still gets a green (not skipped) job: every gated
    # step no-ops, which reports as job success, same as any other
    # conditionally-skipped step in this workflow.
    - name: Detect design-system / dispatch dashboard changes
      id: changes
      uses: dorny/paths-filter@v4
      with:
        filters: |
          theming:
            - 'src/osprey/interfaces/**'
            - 'src/osprey/dispatch/**'
            - 'tests/interfaces/design_system/**'
            - 'tests/interfaces/web_terminal/**'
            - 'tests/interfaces/bluesky_web/**'
            - 'tests/interfaces/ariel/**'
            - 'tests/interfaces/conftest.py'
            - 'tests/interfaces/_browser.py'
            - 'tests/interfaces/test_load_smokes.py'
            # The multi-user login-flow browser test drives the composed
            # perimeter — nginx's rendered config plus the auth sidecar — none
            # of which lives under interfaces/. Without these four a change to
            # the login page, the nginx template or the shared container
            # fixture would leave this lane green by skipping it entirely.
            - 'src/osprey/services/auth_sidecar/**'
            - 'src/osprey/deployment/web_terminals/**'
            - 'src/osprey/templates/modules/web_terminals/**'
            - 'tests/deployment/web_terminals/test_auth_serving.py'

    - name: Install uv
      if: steps.changes.outputs.theming == 'true'
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python
      if: steps.changes.outputs.theming == 'true'
      run: uv python install 3.11

    - name: Install dependencies
      if: steps.changes.outputs.theming == 'true'
      run: uv sync --extra dev

    - name: Install Playwright chromium
      if: steps.changes.outputs.theming == 'true'
      run: uv run playwright install chromium --with-deps

    - name: Run behavioral theming suite
      if: steps.changes.outputs.theming == 'true'
      run: |
        uv run pytest tests/interfaces/design_system/test_behavioral.py \
          tests/interfaces/design_system/test_theme_lab.py \
          tests/interfaces/design_system/test_dispatch_dashboard_unauthorized.py \
          tests/interfaces/web_terminal/test_panels_browser.py \
          tests/interfaces/web_terminal/test_panels_collab_browser.py \
          tests/interfaces/web_terminal/test_agent_activity_browser.py \
          tests/interfaces/web_terminal/test_contract_params.py \
          tests/interfaces/web_terminal/test_logout_resume_browser.py \
          tests/interfaces/web_terminal/test_auth_login_browser.py \
          tests/interfaces/bluesky_web/test_channel_combobox_browser.py \
          tests/interfaces/ariel/test_embedded_nav.py \
          tests/interfaces/test_load_smokes.py -v --tb=short

    - name: Run visual regression suite
      # Linux is the authoritative platform for the pixel diff (see
      # test_visual.py's module docstring); this runner IS that platform.
      # A missing baseline is written on the spot — see the "commit" step
      # below for how a first-time/updated baseline lands back in the repo.
      if: steps.changes.outputs.theming == 'true'
      run: uv run pytest tests/interfaces/design_system/test_visual.py -v --tb=short

    - name: Upload Linux-rendered baselines artifact
      if: steps.changes.outputs.theming == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: visual-baselines-linux
        path: tests/interfaces/design_system/baselines/*.png
        retention-days: 14

    - name: Commit new/updated Linux baselines back to the PR branch
      # Only for same-repo PRs — forks can't push, and main pushes have
      # nothing to compare against (baselines only ever change via a PR).
      if: >-
        steps.changes.outputs.theming == 'true' &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: "chore(visual): update Linux-rendered theming baseline(s) [skip ci]"
        file_pattern: 'tests/interfaces/design_system/baselines/*.png'
        commit_user_name: "github-actions[bot]"
        commit_user_email: "github-actions[bot]@users.noreply.github.com"

  frontend-js:
    name: Frontend JS (typecheck + lint + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      # Full history + tags: the package version is derived from the git tag.
      with:
        fetch-depth: 0

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Install JS dependencies
      # `npm install --no-package-lock`, not `npm ci`: the committed
      # package-lock.json records a resolved entry only for the host platform's
      # rollup binary (the lock is authored on macOS), and both `npm ci` AND a
      # plain `npm install` honor that incomplete tree, so the Linux runner
      # never installs @rollup/rollup-linux-x64-gnu that vitest needs (npm
      # optional-deps bug, npm/cli#4828 — its own error message says to ignore
      # the lockfile). `--no-package-lock` resolves fresh from package.json and
      # installs the correct platform binary. This is a dev/CI-only
      # typecheck+test job, so strict lock reproduction is not required here.
      run: npm install --no-package-lock

    - name: Typecheck (tsc --noEmit)
      run: npm run typecheck

    - name: Lint (eslint)
      run: npm run lint

    - name: Run JS tests (vitest)
      run: npm run test:js

  build-boot-smoke:
    name: Tier 1 — Build + MCP boot (${{ matrix.preset }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset: [hello-world, control-assistant]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      # Full history + tags: the package version is derived from the git tag.
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.11

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Cache uv project-venv downloads
      uses: actions/cache@v6
      with:
        path: ~/.cache/uv
        key: uv-buildboot-${{ runner.os }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          uv-buildboot-${{ runner.os }}-

    - name: Run Tier 1 boot smoke for preset
      env:
        PRESET: ${{ matrix.preset }}
      run: |
        uv run pytest tests/integration/test_build_boot.py -v --tb=short -k "$PRESET"

  agentic-per-preset:
    name: Tier 3 — Agentic flow (${{ matrix.preset }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Only run on PRs from same repo (ALS_APG_API_KEY unavailable on forks).
    # Gating (no continue-on-error): a red Tier 3 flow blocks the merge like
    # every other e2e lane — the house rule is full green, no advisory tiers.
    # Secret-dependent lane: skips on Dependabot PRs, which get no Actions
    # secrets. Revalidate with the `revalidate_secret_lanes` dispatch input.
    if: >-
      (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.actor != 'dependabot[bot]')
      || (github.event_name == 'workflow_dispatch' && inputs.revalidate_secret_lanes)
    strategy:
      fail-fast: false
      matrix:
        preset: [hello-world, control-assistant]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      # Full history + tags: the package version is derived from the git tag.
      with:
        fetch-depth: 0

    - name: Log in to ghcr (openobserve mirror)
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.11

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Pre-flight LLM endpoint reachability check
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
      run: |
        # Defense in depth: surface "secret unset" or "GitHub Actions IP not
        # allowlisted" failures clearly here, instead of buried under confusing
        # 4xx errors flooding pytest output 5+ minutes later.
        # See CHANGELOG entry on the cborg → ALS-APG CI swap for full context.
        if [ -z "${ALS_APG_API_KEY:-}" ]; then
          echo "❌ ALS_APG_API_KEY secret is not set on this runner"
          echo "   (Check repo secrets; required for the agentic-per-preset job.)"
          exit 1
        fi
        ALS_APG_PROBE_BASE="${ALS_APG_BASE_URL:-https://llm.gianlucamartino.com}"
        ALS_APG_PROBE_BASE="${ALS_APG_PROBE_BASE%/}"; ALS_APG_PROBE_BASE="${ALS_APG_PROBE_BASE%/v1}"
        HTTP_CODE=$(curl -sS -o /tmp/probe.txt -w "%{http_code}" --max-time 15 \
          -X POST "$ALS_APG_PROBE_BASE/v1/messages" \
          -H "Content-Type: application/json" \
          -H "anthropic-version: 2023-06-01" \
          -H "Authorization: Bearer $ALS_APG_API_KEY" \
          -d '{"model":"claude-haiku-4-5-20251001","max_tokens":4,"messages":[{"role":"user","content":"ping"}]}')
        if [ "$HTTP_CODE" != "200" ]; then
          echo "❌ ALS-APG endpoint probe failed (HTTP $HTTP_CODE)"
          echo "   Body (first 500 chars):"
          head -c 500 /tmp/probe.txt; echo
          echo "   If 401/403: rotate ALS_APG_API_KEY or check IP allowlist."
          echo "   If 5xx: ALS-APG outage — retry, or contact the proxy admin."
          exit 1
        fi
        echo "✅ ALS-APG endpoint reachable (HTTP 200)"

    - name: Put the SDK's bundled Claude CLI on PATH
      # `claude-agent-sdk` ships a working `claude` binary but installs no
      # console script, so a fresh runner has none on PATH. The SDK finds its
      # own bundled copy, but osprey's launcher and health check shell
      # `claude` off PATH, and every agent test skips when `claude --version`
      # fails -- a lane that reports green having executed nothing. Exposing
      # the bundled binary makes the SDK, the product, and the skip guards
      # agree on one CLI, with no npm install and no SDK/CLI version drift.
      # Verify before exporting: a missing binary must fail the lane loudly
      # rather than silently restore the skips this step exists to remove.
      run: |
        bundled="$(uv run python -c "import claude_agent_sdk, pathlib; print(pathlib.Path(claude_agent_sdk.__file__).parent / '_bundled')")"
        "$bundled/claude" --version
        echo "$bundled" >> "$GITHUB_PATH"

    - name: Run Tier 3 agentic test for preset
      timeout-minutes: 55
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
        PRESET: ${{ matrix.preset }}
      run: |
        # template names use snake_case in init_project (e.g. hello_world);
        # the matrix entry is the kebab-case preset id, which appears in the
        # function name (test_hello_world_*) so -k matches both.
        PRESET_K="${PRESET//-/_}"
        uv run pytest tests/e2e/test_preset_agentic.py -v --tb=short -k "$PRESET_K"

    # On failure only: container logs, exit codes, `OOMKilled`, and runner
    # disk/memory state, uploaded as the `ci-diag-<lane>` artifact.
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: agentic-per-preset-${{ matrix.preset }}
        engine: docker

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Only run on PRs (not pushes) to control API costs, and only for non-fork PRs (secrets unavailable on forks).
    # Also runs on manual workflow_dispatch to enable scoped reruns via the e2e_filter input —
    # unless that dispatch asked for the benchmark lanes instead (run_benchmarks).
    # Secret-dependent lane: skips on Dependabot PRs, which get no Actions
    # secrets. Revalidate with the `revalidate_secret_lanes` dispatch input.
    if: >-
      (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.actor != 'dependabot[bot]')
      || (github.event_name == 'workflow_dispatch' && !inputs.run_benchmarks)
    # The lane's healthy runtime is ~20-25min (real-LLM SDK/CLI pipelines —
    # every full-stack docker deploy now lives in its own dedicated job, and
    # the channel-finder benchmarks moved to the nightly schedule); a run past
    # the cap means a test is wedged on a dead endpoint or a leaked container
    # stack, and the useful signal is the timeout itself, not more runner time.
    timeout-minutes: 40

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Log in to ghcr (openobserve mirror)
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.11

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Pre-flight LLM endpoint reachability check
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
      run: |
        # Same probe as agentic-per-preset; see comment there for rationale.
        if [ -z "${ALS_APG_API_KEY:-}" ]; then
          echo "❌ ALS_APG_API_KEY secret is not set on this runner"
          exit 1
        fi
        ALS_APG_PROBE_BASE="${ALS_APG_BASE_URL:-https://llm.gianlucamartino.com}"
        ALS_APG_PROBE_BASE="${ALS_APG_PROBE_BASE%/}"; ALS_APG_PROBE_BASE="${ALS_APG_PROBE_BASE%/v1}"
        HTTP_CODE=$(curl -sS -o /tmp/probe.txt -w "%{http_code}" --max-time 15 \
          -X POST "$ALS_APG_PROBE_BASE/v1/messages" \
          -H "Content-Type: application/json" \
          -H "anthropic-version: 2023-06-01" \
          -H "Authorization: Bearer $ALS_APG_API_KEY" \
          -d '{"model":"claude-haiku-4-5-20251001","max_tokens":4,"messages":[{"role":"user","content":"ping"}]}')
        if [ "$HTTP_CODE" != "200" ]; then
          echo "❌ ALS-APG endpoint probe failed (HTTP $HTTP_CODE)"
          head -c 500 /tmp/probe.txt; echo
          exit 1
        fi
        echo "✅ ALS-APG endpoint reachable (HTTP 200)"

    - name: Put the SDK's bundled Claude CLI on PATH
      # See the identical step in agentic-per-preset: the SDK bundles a
      # `claude` binary but installs no console script, so without this the
      # CLI-gated tests in this lane skip and the lane greens having run only
      # the tests that need no agent.
      run: |
        bundled="$(uv run python -c "import claude_agent_sdk, pathlib; print(pathlib.Path(claude_agent_sdk.__file__).parent / '_bundled')")"
        "$bundled/claude" --version
        echo "$bundled" >> "$GITHUB_PATH"

    - name: Run E2E tests
      # Step cap under the job cap so a hang fails THIS step, leaving the
      # capture step below room to run. A job-level timeout is a hard cancel
      # that takes the container logs with it.
      timeout-minutes: 35
      # E2E_FILTER comes from workflow_dispatch `inputs.e2e_filter` and is
      # empty on push/PR/schedule triggers, so the full-suite command runs
      # by default. The filter is a debug-only convenience for scoped CI
      # reruns — PR merge gate always exercises the full suite. Workflow
      # inputs require repo write access; treat as trusted (same level as
      # this file).
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
        E2E_FILTER: ${{ inputs.e2e_filter }}
      run: |
        if [ -n "$E2E_FILTER" ]; then
          echo "Running scoped E2E filter: $E2E_FILTER"
          # Word-splitting on $E2E_FILTER is intentional so callers can
          # pass multiple paths or extra pytest args in one input.
          uv run pytest $E2E_FILTER -v --tb=short
        else
          # Tier 3 per-preset agentic flows live in their own matrix job
          # (agentic-per-preset). The full Docker-stack tests
          # (dispatch-deploy-e2e, dispatch-overlay-e2e, bluesky-deploy-e2e,
          # tiled-roundtrip-e2e, va-substrate-equivalence-e2e,
          # orm-roundtrip-e2e, bluesky-catalog-e2e,
          # bluesky-sandbox-escape-e2e,
          # nextcloud-talk-bridge-e2e,
          # multi-user-deploy-lifecycle-e2e, deploy-writeback-e2e) and the
          # Dockerfile e2e
          # (dockerfile-e2e) each have their own job because they build
          # container images. Exclude them all here to avoid
          # double-execution — and because full-stack deploys leave
          # host-global residue (fixed `<prefix>-web-<user>`/`<prefix>-nginx`
          # container names, the host-global openobserve data volume with
          # root creds pinned on first init) that breaks later tests sharing
          # this runner. NOTE: "--ignore" means "not in this secret-gated
          # LLM lane," NOT "not tested" — every ignored file below runs in
          # its own job (the deploy-lifecycle jobs run on PRs into main
          # only — see those jobs' comments), except the channel-finder
          # benchmarks, which run on demand via the run_benchmarks
          # dispatch input (channel-finder-benchmarks): they are a
          # statistical quality score with flaky reruns, not a per-PR
          # correctness gate.
          # The two Google Chat files leave this lane for a different reason
          # than everything above: neither builds an image, but both drive the
          # SAME fixed-name Pub/Sub emulator container
          # (osprey-e2e-gchat-pubsub), and PubSubEmulator.start() pre-cleans by
          # `rm -f`-ing that exact name before it starts its own. Under the
          # -n 4 --dist loadfile below two FILES run concurrently on different
          # workers — loadfile keeps a file's tests together, it does not
          # serialize files — so one file's pre-clean would kill the other's
          # live emulator mid-test and surface as an unreadable flake. They
          # therefore leave together and run in gchat-bridge-e2e as two
          # separate, sequential pytest steps; ignoring only the bridge module
          # would leave the hazard armed for the next file to use the fixture.
          # -n 4 --dist loadfile (pytest-xdist): this lane is ~18 min of
          # real-LLM round-trips at near-zero CPU, so four workers cut it to
          # roughly the slowest single file. loadfile (not load) keeps every
          # file's tests on one worker, preserving in-file ordering and
          # module-scoped fixtures — the documented registry-order hazard is
          # about mixing e2e with unit tests, not about file-level
          # parallelism. No fixed-port stack (the VA on CA 5064) actually
          # boots in this lane: every module that binds that port leaves by
          # --ignore below and runs in its own job — the scan-stack agentic
          # module and the VA substrate equivalence proof each in one, and
          # the ORM, grid-scan and orbit-bump roundtrips together in
          # orm-roundtrip-e2e, where they run as sequential steps so the
          # stacks never contend for a host port.
          uv run pytest tests/e2e/ -v --tb=short -n 4 --dist loadfile \
            --ignore=tests/e2e/test_preset_agentic.py \
            --ignore=tests/e2e/test_plan_stack_agentic.py \
            --ignore=tests/e2e/test_dispatch_deploy.py \
            --ignore=tests/e2e/test_dispatch_overlay_visibility.py \
            --ignore=tests/e2e/test_bluesky_deploy.py \
            --ignore=tests/e2e/test_bluesky_queue_e2e.py \
            --ignore=tests/e2e/test_dockerfile_e2e.py \
            --ignore=tests/e2e/test_execution_environment_parity.py \
            --ignore=tests/e2e/test_tiled_roundtrip.py \
            --ignore=tests/e2e/test_va_substrate_equivalence.py \
            --ignore=tests/e2e/test_orm_roundtrip.py \
            --ignore=tests/e2e/test_grid_scan_roundtrip.py \
            --ignore=tests/e2e/test_bump_roundtrip.py \
            --ignore=tests/e2e/test_archiver_world_e2e.py \
            --ignore=tests/e2e/test_bluesky_catalog_e2e.py \
            --ignore=tests/e2e/test_bluesky_sandbox_escape_e2e.py \
            --ignore=tests/e2e/test_bluesky_web_deploy.py \
            --ignore=tests/e2e/test_deploy_lifecycle.py \
            --ignore=tests/e2e/test_two_shape_boot.py \
            --ignore=tests/e2e/test_deploy_writeback_e2e.py \
            --ignore=tests/e2e/test_nextcloud_talk_bridge_e2e.py \
            --ignore=tests/e2e/test_gchat_bridge_e2e.py \
            --ignore=tests/e2e/fixtures/test_gchat_fixture_smoke.py \
            --ignore=tests/e2e/web_terminals/test_auth_perimeter.py \
            --ignore=tests/e2e/claude_code/test_channel_finder_mcp_benchmarks.py
        fi
    # On failure only: container logs, exit codes, `OOMKilled`, and runner
    # disk/memory state, uploaded as the `ci-diag-<lane>` artifact.
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: e2e-tests
        engine: docker


  channel-finder-benchmarks:
    name: Channel-Finder MCP Benchmarks (on demand)
    runs-on: ubuntu-latest
    # Manual-only, via the `run_benchmarks` workflow_dispatch input (Actions
    # tab "Run workflow", or `gh workflow run ci.yml -f run_benchmarks=true`):
    # this is a statistical quality benchmark (F1/perfect-match thresholds
    # over ~30 real LLM channel-finder queries, flaky-rerun-heavy), not a
    # per-PR correctness gate. It used to run inside the shared e2e-tests
    # lane on every PR (~4min of the lane); like every benchmark in this
    # repo it is human-babysat — run it deliberately before a release or
    # after touching the channel-finder/MCP code, and read the scores in the
    # job log. Deliberately NOT in all-checks-passed's needs — a
    # dispatch-gated job has no result on PR runs. This job is the intended
    # home for future too-expensive-per-PR e2e lanes as well.
    if: github.event_name == 'workflow_dispatch' && inputs.run_benchmarks
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.11

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Pre-flight LLM endpoint reachability check
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
      run: |
        # Same probe as e2e-tests: fail fast if the proxy is unreachable.
        if [ -z "${ALS_APG_API_KEY:-}" ]; then
          echo "❌ ALS_APG_API_KEY secret is not set on this runner"
          exit 1
        fi
        ALS_APG_PROBE_BASE="${ALS_APG_BASE_URL:-https://llm.gianlucamartino.com}"
        ALS_APG_PROBE_BASE="${ALS_APG_PROBE_BASE%/}"; ALS_APG_PROBE_BASE="${ALS_APG_PROBE_BASE%/v1}"
        HTTP_CODE=$(curl -sS -o /tmp/probe.txt -w "%{http_code}" --max-time 15 \
          -X POST "$ALS_APG_PROBE_BASE/v1/messages" \
          -H "Content-Type: application/json" \
          -H "anthropic-version: 2023-06-01" \
          -H "Authorization: Bearer $ALS_APG_API_KEY" \
          -d '{"model":"claude-haiku-4-5-20251001","max_tokens":4,"messages":[{"role":"user","content":"ping"}]}')
        if [ "$HTTP_CODE" != "200" ]; then
          echo "❌ ALS-APG endpoint probe failed (HTTP $HTTP_CODE)"
          head -c 500 /tmp/probe.txt; echo
          exit 1
        fi
        echo "✅ ALS-APG endpoint reachable (HTTP 200)"

    - name: Put the SDK's bundled Claude CLI on PATH
      # See the identical step in agentic-per-preset: without it the
      # benchmark module's CLI-gated tests skip and the lane greens empty.
      run: |
        bundled="$(uv run python -c "import claude_agent_sdk, pathlib; print(pathlib.Path(claude_agent_sdk.__file__).parent / '_bundled')")"
        "$bundled/claude" --version
        echo "$bundled" >> "$GITHUB_PATH"

    - name: Run channel-finder MCP benchmarks
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
      run: |
        uv run pytest tests/e2e/claude_code/test_channel_finder_mcp_benchmarks.py -v --tb=short

  deploy-e2e:
    name: Deploy E2E Test (build + deploy pipeline)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Only run on PRs from same repo (secrets unavailable on forks)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Log in to ghcr (openobserve mirror)
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.11

    - name: Set up Docker Compose
      uses: docker/setup-compose-action@v2

    - name: Install osprey
      run: uv sync --extra dev

    - name: Create hello_world deployment repo
      env:
        # Exported at init time so the shell-harvest seeds it into the repo's
        # .env — the flow `up`'s .env preflight expects (without it, `up`
        # refuses on the missing secret store).
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
      run: |
        # CI only has ALS_APG_API_KEY (cborg's IP allowlist excludes GitHub
        # Actions runners). Drive provider selection through `osprey init
        # --set`, which bakes it into the emitted profile.yml, instead of
        # post-build sed surgery — keeps the contract explicit and survives
        # template re-formatting.
        #
        # Two steps, because they are two things: `init` writes the source
        # zone, `build` renders it. --skip-deps/--skip-lifecycle belong to the
        # render and so live on `build`.
        uv run osprey init hello-world-test --preset hello-world \
          --set provider=als-apg --set model=haiku
        cd hello-world-test
        uv run osprey build --skip-deps --skip-lifecycle
        uv run osprey skills install osprey-build-interview
        ls -la

    - name: osprey up (deploys openobserve for hello-world)
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
      run: |
        cd hello-world-test
        # hello-world declares deployed_services: [openobserve], so this
        # verifies a single-service deploy succeeding end-to-end.
        uv run osprey up -d --dev

    # Runs BEFORE the teardown below: the cleanup step deletes the very
    # containers whose logs explain the failure. Read-only capture; the
    # artifact is `ci-diag-<lane>` on the run's summary page.
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: deploy-e2e
        engine: docker

    - name: osprey down
      if: always()
      run: |
        cd hello-world-test
        # No `|| true`: this teardown is expected to succeed, and swallowing
        # its exit code is how the retired verb here went unnoticed — a
        # guaranteed usage error read as a clean no-op teardown.
        uv run osprey down

