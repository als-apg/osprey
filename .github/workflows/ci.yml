  multi-user-deploy-lifecycle-e2e:
    name: Multi-User Deploy Lifecycle E2E (${{ matrix.runtime }} runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # PRs into main only (not epic phases): it runs real destructive lifecycle verbs.
    if: >-
      (github.event_name == 'pull_request'
      && github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && inputs.revalidate_secret_lanes)
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]

    steps:
    - *checkout-full-history

    - *install-uv

    - name: Set up rootless Podman
      if: matrix.runtime == 'podman'
      run: |
        podman --version
        podman compose version
        # Rootless podman verifies TLS even on localhost (docker does not), so the test's plain-HTTP stub
        # registry on localhost:19081 is marked insecure in a merged drop-in.
        mkdir -p ~/.config/containers/registries.conf.d
        cat > ~/.config/containers/registries.conf.d/localhost-insecure.conf <<'EOF'
        [[registry]]
        location = "localhost:19081"
        insecure = true
        EOF

    - *sync-dev-deps

    - name: Run multi-user deploy lifecycle E2E
      if: matrix.runtime == 'docker'
      timeout-minutes: 55
      # `-m 'not qmd'`: that test refuses to skip without a qmd image; qmd-sidecar-e2e runs it.
      run: |
        uv run pytest tests/e2e/test_deploy_lifecycle.py -m 'not qmd' -v --tb=short

    - name: Run multi-user deploy lifecycle E2E (podman)
      if: matrix.runtime == 'podman'
      timeout-minutes: 55
      env:
        OSPREY_E2E_RUNTIME: podman
        CONTAINER_RUNTIME: podman
      run: |
        # `podman compose` delegates to the runner's docker-compose plugin, which needs the podman API
        # socket. Started in this step: each step is its own process group.
        podman system service --time=0 &
        SOCK="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/podman/podman.sock"
        for _ in $(seq 1 30); do if [ -S "$SOCK" ]; then break; fi; sleep 1; done
        export DOCKER_HOST="unix://$SOCK"
        uv run pytest tests/e2e/test_deploy_lifecycle.py -m 'not qmd' -v --tb=short

    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: multi-user-deploy-lifecycle-e2e-${{ matrix.runtime }}
        engine: ${{ matrix.runtime }}

    # --sweep: the test's own stub registry belongs to no compose project.
    - name: Clean up any stranded lifecycle-e2e resources
      if: always()
      run: |
        ENGINE=${{ matrix.runtime }} scripts/ci/cleanup_stacks.sh --sweep osprey-e2e-mus-p3

  auth-perimeter-e2e:
    name: Auth Perimeter E2E (real sidecar image + nginx auth_request)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # PRs into main and epic/*: a safety lane run only after the epic merged could go red behind a green gate.
    if: &main-or-epic-pr-or-secret-revalidation >-
      (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
        && (github.event.pull_request.base.ref == 'main'
        || startsWith(github.event.pull_request.base.ref, 'epic/')))
      || (github.event_name == 'workflow_dispatch' && inputs.revalidate_secret_lanes)

    steps:
    - *checkout-full-history

    - *install-uv

    - *sync-dev-deps

    - name: Run auth perimeter E2E
      timeout-minutes: 55
      run: |
        uv run pytest tests/e2e/web_terminals/test_auth_perimeter.py -v --tb=short

    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
