          | xargs -r docker volume rm -f || true
        docker compose -p osprey-e2e-agent-record down || true
        docker rm -f osprey-e2e-agent-record-agent-record || true
        docker rm -f osprey-e2e-agent-record-agent-record-clickhouse || true
        docker volume ls -q --filter "name=^osprey-e2e-agent-record_" \
          | xargs -r docker volume rm -f || true
        docker compose -p osprey-e2e-host-record down || true
        docker rm -f osprey-e2e-host-record-agent-record || true
        docker rm -f osprey-e2e-host-record-agent-record-clickhouse || true
        docker volume ls -q --filter "name=^osprey-e2e-host-record_" \
          | xargs -r docker volume rm -f || true

  e2e-no-model:
    name: Model-Free E2E (the tests/e2e files that reach no gateway)
    runs-on: ubuntu-latest
    # Every PR, forks and Dependabot included: no gateway key, public images
    # only, so no label or actor guard.
    needs: changes
    if: >-
      (github.event_name == 'pull_request'
      && needs.changes.outputs.docs_only != 'true')
      || (github.event_name == 'workflow_dispatch' && inputs.revalidate_secret_lanes)
    # Sized like tiled-roundtrip-e2e (one stack, no build, no model).
    timeout-minutes: 30

    steps:
    - *free-runner-disk

    - *checkout-full-history

    - *install-uv

    - *python-3-11

    - *sync-dev-deps

    - &assert-container-runtime
      name: Assert a container runtime is present
      # A skip is a failure here, so a missing runtime is named up front.
      run: |
        set -euo pipefail
        docker info > /dev/null

    - *install-pinned-cli

    - name: Run the model-free E2E files
      timeout-minutes: 25
      run: |
        # Named by path, not marker: a vanished path exits pytest 4 and reds the step,
        # a marker matching nothing would green it. The wiring test holds this list
        # equal to the model_free tests.
        uv run pytest \
          tests/e2e/test_scripted_model.py \
          tests/e2e/claude_code/test_safety_gates_scripted.py \
          tests/e2e/test_dispatch_deploy_render.py \
          tests/e2e/web_terminals/test_scaffold_render_roundtrip.py \
          tests/e2e/web_terminals/test_skills_overlay_discovery.py \
          tests/e2e/web_terminals/test_loopback_chokepoint.py \
          tests/e2e/web_terminals/test_session_restart_e2e.py \
          tests/e2e/web_terminals/test_terminal_auth_e2e.py \
          tests/e2e/web_terminals/test_render_permissions_scripted.py \
          tests/e2e/claude_code/test_chat_approval_gates_scripted.py \
          tests/e2e/claude_code/test_chat_plan_mode_scripted.py \
          tests/e2e/claude_code/test_chat_attachment_read_scripted.py \
          tests/e2e/test_watchdog_agent_scripted.py \
          tests/e2e/test_watchdog_hold_scripted.py \
          -v --tb=short --durations=15 -n 4 --dist loadfile \
          --junitxml=junit-e2e-no-model.xml

    - name: Fail the lane on any skipped test
      run: |
        # A skip here means the lane is wrong about its runner; pytest's exit code
        # cannot tell all-passed from all-skipped, so the junit report is read.
        uv run python - <<'PY'
        import sys
        import xml.etree.ElementTree as ET

        report = "junit-e2e-no-model.xml"
        total = skipped = 0
        for suite in ET.parse(report).getroot().iter("testsuite"):
            total += int(suite.get("tests", 0))
            skipped += int(suite.get("skipped", 0))
        print(f"{report}: {total} test(s), {skipped} skipped")
        failed = False
        if total == 0:
            print(f"::error::{report} collected no tests")
            failed = True
        if skipped:
            print(f"::error::{report} reports {skipped} skipped test(s)")
            failed = True
        if failed:
            sys.exit(1)
        print("✅ every model-free E2E test ran; none skipped")
        PY
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: e2e-no-model
        engine: docker

  agent-record-e2e:
    name: Agent Record E2E (${{ matrix.backend }}; replays every captured fixture through the real stack)
    runs-on: ubuntu-latest
    # Every PR, forks included, as e2e-no-model. Its own lane because each case
    # deploys a whole stack and waits out a stopped source.
    needs: changes
    if: >-
      (github.event_name == 'pull_request'
      && needs.changes.outputs.docs_only != 'true')
      || (github.event_name == 'workflow_dispatch' && inputs.revalidate_secret_lanes)
    # One case per runner: they share a per-host project name and port block, so
    # this costs the longer case, not the sum. The wiring test holds the cells.
    strategy:
      fail-fast: false
      matrix:
        include:
        - backend: embedded
          case: test_embedded_record_on_hello_world
        - backend: clickhouse
          case: test_clickhouse_record_on_demo
    # Sized for the waits (a 5-min stopped-source wait, a full deploy cycle), not
    # measured.
    timeout-minutes: 135
    steps:
    - *free-runner-disk

    - *checkout-full-history

    - *install-uv

    - *python-3-11

    - *sync-dev-deps

    - *assert-container-runtime

    - *install-pinned-cli

    - name: Run the agent record replay
      timeout-minutes: 120
      run: |
        # Named by path: a path that stops existing exits pytest 4 and reds
        # this step; a case name that stops matching collects nothing, which
        # exits pytest 5 and the skip gate below reds too. One case per cell,
        # serial: the cases share one host port block.
        uv run pytest \
          tests/e2e/test_agent_record_e2e.py \
          -k "${{ matrix.case }}" \
          -v --tb=short --durations=15 \
          --junitxml=junit-agent-record-e2e.xml

    - name: Fail the lane on any skipped test
      run: |
        # A skip here is the lane being wrong about its own runner, and
        # pytest's exit code cannot tell "everything passed" from "everything
        # was skipped" — so the junit report is read instead.
        uv run python - <<'PY'
        import sys
        import xml.etree.ElementTree as ET

        report = "junit-agent-record-e2e.xml"
        total = skipped = 0
        for suite in ET.parse(report).getroot().iter("testsuite"):
            total += int(suite.get("tests", 0))
            skipped += int(suite.get("skipped", 0))
        print(f"{report}: {total} test(s), {skipped} skipped")
        failed = False
        if total == 0:
            print(f"::error::{report} collected no tests")
            failed = True
        if skipped:
            print(f"::error::{report} reports {skipped} skipped test(s)")
            failed = True
        if failed:
            sys.exit(1)
        print("✅ every agent record replay test ran; none skipped")
        PY
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: agent-record-e2e-${{ matrix.backend }}
        engine: docker
    # Belt and suspenders: see e2e-tests.
    - name: Clean up any stranded stack resources
      if: always()
      run: |
        docker compose -p osprey-e2e-agent-record down || true
        docker rm -f osprey-e2e-agent-record-agent-record || true
        docker rm -f osprey-e2e-agent-record-agent-record-clickhouse || true
        docker volume ls -q --filter "name=^osprey-e2e-agent-record_" \
          | xargs -r docker volume rm -f || true

  channel-finder-benchmarks:
    name: Channel-Finder MCP Benchmarks (on demand)
    runs-on: ubuntu-latest
    # Dispatch-only (`run_benchmarks`): a statistical quality benchmark, not a
    # per-PR gate, so it is not in all-checks-passed's needs.
    if: github.event_name == 'workflow_dispatch' && inputs.run_benchmarks
    timeout-minutes: 30

    steps:
    - *checkout-full-history

    - *install-uv

    - *python-3-11

    - *sync-dev-deps

    - *llm-preflight-probe

    - *install-pinned-cli

    - name: Fetch the pinned neosemantics (n10s) jar for the graph benchmark lane
      # A failed jar download in the fixture would SKIP the graph paradigm; fetching
      # it here fails loudly. The URL comes from the fixture's own pin.
      run: |
        set -euo pipefail
        url="$(uv run python -c 'from tests._graphdb_container import N10S_JAR_URL; print(N10S_JAR_URL)')"
        jar="${{ runner.temp }}/$(basename "$url")"
        curl -fsSL --retry 3 --retry-all-errors --max-time 300 -o "$jar" "$url"
        ls -l "$jar"
        echo "OSPREY_TEST_N10S_JAR=$jar" >> "$GITHUB_ENV"

    - name: Run channel-finder MCP benchmarks
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
      run: |
        uv run pytest tests/e2e/claude_code/test_channel_finder_mcp_benchmarks.py -v --tb=short

  tier2-model-benchmark:
    name: Tier 2 — Model benchmark (on demand)
    runs-on: ubuntu-latest
    # Tier 2 measures the model, not the change. Dispatch-only, like the
    # channel-finder benchmarks; not in all-checks-passed's needs.
    if: github.event_name == 'workflow_dispatch' && inputs.run_benchmarks
    timeout-minutes: 30

    steps:
    - *checkout-full-history

    - *install-uv

    - *python-3-11

    - *sync-dev-deps

    - *llm-preflight-probe

    - *install-pinned-cli

    - name: Run Tier 2 model benchmarks
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
      run: |
        # The chart-value-reading benchmark deploys a full stack and runs on the
        # benchmark board only; this job carries the stack-free tier-2 tests.
        uv run pytest tests/e2e/tier2/ --ignore=tests/e2e/tier2/test_chart_value_reading.py \
          -v --tb=short

  deploy-e2e:
    name: Deploy E2E Test (build + deploy pipeline)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Secret-dependent: `osprey up`'s .env preflight needs ALS_APG_API_KEY, so it
    # skips on fork and Dependabot PRs (the same-repo check alone does not cover
    # Dependabot). Revalidate with the `revalidate_secret_lanes` dispatch.
    needs: changes
    if: >-
      (github.event_name == 'pull_request'
      && needs.changes.outputs.docs_only != 'true'
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.actor != 'dependabot[bot]')
      || (github.event_name == 'workflow_dispatch' && inputs.revalidate_secret_lanes)

    steps:
    - *checkout-full-history

    - *install-uv

    - *python-3-11

    - &setup-compose
      name: Set up Docker Compose
      uses: docker/setup-compose-action@v2

    - &install-osprey
      name: Install osprey
      run: uv sync --locked --extra dev

    - name: Create hello_world deployment repo
      env:
        # Seeded into the repo's .env, which `up`'s preflight expects.
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
      run: |
        # The provider is chosen by init's `--set`, not post-build edits. The model
        # is the gateway's id: the build refuses an alias such as haiku.
        uv run osprey init hello-world-test --preset hello-world \
          --set provider=als-apg --set model=claude-haiku-5-5
        cd hello-world-test
        uv run osprey build --skip-deps --skip-lifecycle
        ls -la

    - name: osprey up (hello-world)
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
      run: |
        cd hello-world-test
        # hello-world declares deployed_services: [] and keeps its agent
        # record embedded, so this verifies `osprey up` on a container-free
        # deployment end-to-end.
        uv run osprey up -d --dev

    # Before the teardown below, which deletes the containers whose logs matter.
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: deploy-e2e
        engine: docker

    - name: osprey down
      if: always()
      run: |
        cd hello-world-test
        # No `|| true`: this teardown is expected to succeed, and swallowing
        # its exit code would read a usage error as a clean no-op teardown.
        uv run osprey down

    # Even when the build or `osprey down` failed: a stranded agent record holds
    # its port and volume on a reused runner. Names are exact.
    - name: Clean up any stranded hello-world resources
      if: always()
      run: |
        docker compose -p hello-world-test down || true
        docker rm -f hello-world-test-agent-record || true
        docker rm -f hello-world-test-agent-record-clickhouse || true
        docker volume rm hello-world-test_agent_record_clickhouse_data || true

  dispatch-deploy-e2e:
    name: Dispatch Deploy E2E (full Docker stack + real agent runs + multi-user web tier)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Model-spending lane. The deploy also stands up the multi-user web tier, so
    # this lane carries the T1-T4 proofs in tests/e2e/test_dispatch_deploy.py.
    needs: changes
