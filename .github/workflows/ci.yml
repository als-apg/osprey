  orm-roundtrip-e2e:
    name: ORM + Grid Scan Roundtrip E2E (VA + bluesky bridge + Tiled, full Docker stack)
    runs-on: ubuntu-latest
    # Only run on PRs from same repo (mirrors va-substrate-equivalence-e2e
    # gating). This job needs no secrets — both roundtrips drive the bridge
    # HTTP API directly, no LLM involved. It previously ran inside the
    # shared e2e-tests lane (its ~7min full VA/bridge/Tiled build + deploy
    # was the lane's second-biggest time sink); same extraction pattern as
    # every other dockerbuild-marked file.
    #
    # Three modules, run as SEQUENTIAL steps rather than one pytest
    # invocation. The ORM and grid-scan roundtrips both stand up their own VA
    # and bind CA port 5064 by design, so overlapping them would collide. The
    # orbit-bump roundtrip pins its whole port block and so could run beside
    # them, but it stands up a third full VA/bridge/Tiled stack — three at once
    # is more than a GHA runner has to give. Sequential steps also keep the
    # three failures separately attributable in the job log.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    # Builds the native PyAT/serving-stack VA image from source like
    # va-substrate-equivalence-e2e (see its timeout note) — generous cap so a
    # cold image cache can't red the job. Raised from 45 when the grid-scan
    # roundtrip joined. Each module's own internal caps, wire to wire: 300s
    # build + 1200s deploy + 300s health + its scan + a 300s `osprey down`
    # in the teardown, and flaky(reruns=1) repeats the SCAN only (the module
    # fixtures survive a rerun, so no second build/deploy) — 2580s for ORM
    # (240s scan) and 2340s for grid (120s scan), ~82min if both ran every
    # timeout to the wire. Raised from 75 when the orbit-bump roundtrip
    # joined, which adds a third build/deploy/teardown plus its own 600s scan.
    #
    # 100 is therefore deliberately NOT that pathological sum: it bounds the
    # realistic run, where the later modules reuse the first's images and
    # nothing sits at its cap, while still leaving the suite's own named
    # timeouts — not a bare GHA cancellation — to report a genuine hang.
    # Tighten once there are observed green timings for the three.
    timeout-minutes: 100

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Log in to ghcr (openobserve mirror)
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.11

    - name: Set up Docker Compose
      uses: docker/setup-compose-action@v2

    - name: Install osprey
      run: uv sync --extra dev

    # Step caps under the job cap, each sized from its module's own internal
    # timeouts (see the job-cap note above), so a hang fails THAT step and the
    # diagnostics step below still runs. A job-level timeout is a hard cancel
    # that takes the container logs with it (same rationale as
    # va-substrate-equivalence-e2e's step cap).
    - name: Run ORM roundtrip E2E
      timeout-minutes: 45
      run: |
        uv run pytest tests/e2e/test_orm_roundtrip.py -v --tb=short

    - name: Run grid scan roundtrip E2E
      timeout-minutes: 40
      run: |
        uv run pytest tests/e2e/test_grid_scan_roundtrip.py -v --tb=short

    - name: Run orbit bump sweep roundtrip E2E
      timeout-minutes: 45
      run: |
        uv run pytest tests/e2e/test_bump_roundtrip.py -v --tb=short
    # On failure only: container logs, exit codes, `OOMKilled`, and runner
    # disk/memory state, uploaded as the `ci-diag-<lane>` artifact.
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: orm-roundtrip-e2e
        engine: docker


