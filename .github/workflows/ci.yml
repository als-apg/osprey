    # system to mock and redeploys the whole stack), plus a 900s whole-queue
    # drain budget and stage 6's deliberately long 4000-point abort scan. This
    # lane has never run in GHA before, so the cap is deliberately generous —
    # tighten it once there are observed green timings to tighten against.
    timeout-minutes: 75

    steps:
    - name: Checkout repository
