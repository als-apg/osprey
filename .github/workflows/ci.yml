    if: *full-ci-pr-or-secret-revalidation
    # A job-level `permissions:` REPLACES the defaults, so `contents: read` is
    # restated; `packages: read` because the Talk fixture is a PRIVATE ghcr package.
    permissions:
      contents: read
      packages: read
    # Sized from the fixture's budgets (large image pull, 240 s start-period, 300 s
    # readiness, 600 s build, 90-150 s polls): worst case near 40 min.
    timeout-minutes: 45

    steps:
    - *free-runner-disk

    - *checkout-full-history

    - name: Log in to ghcr (Nextcloud Talk fixture)
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - *install-uv

    - *python-3-11

    - *setup-compose

    - *install-osprey

    - *install-pinned-cli

    - name: Pull the pinned Nextcloud Talk fixture image
      run: |
        # The module SKIPS when the image is absent, so the pull happens here. The
        # reference comes from the module's own constant (the wiring test binds it to
        # the Dockerfile).
        IMAGE=$(uv run python -c 'import importlib.util as i, sys; s=i.spec_from_file_location("_nc","tests/e2e/test_nextcloud_talk_bridge_e2e.py"); m=i.module_from_spec(s); sys.modules["_nc"]=m; s.loader.exec_module(m); print(m.NEXTCLOUD_FIXTURE_IMAGE)')
        echo "Pulling fixture image: $IMAGE"
        docker pull "$IMAGE"

    - *llm-preflight-probe

    - name: Run Nextcloud Talk bridge E2E
      timeout-minutes: 40
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
      run: |
        uv run pytest tests/e2e/test_nextcloud_talk_bridge_e2e.py -v --tb=short
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: nextcloud-talk-bridge-e2e
        engine: docker

  gchat-bridge-e2e:
    name: Google Chat Bridge E2E (Pub/Sub emulator + dispatch stack)
    runs-on: ubuntu-latest
    # Model-spending lane.
    needs: changes
    if: *full-ci-pr-or-secret-revalidation
    # `permissions:` replaces the defaults; no `packages: read`, the emulator image
    # is public.
    permissions:
      contents: read
    # Sized for a COLD emulator pull (fixture budget 900 s), two emulator starts,
    # a 600 s build and the dispatch polls.
    timeout-minutes: 45
    env:
      # Both modules raise at import on any other value; set once for every step.
      OSPREY_E2E_RUNTIME: docker

    steps:
    - *free-runner-disk

    - *checkout-full-history

    - *install-uv

    - *python-3-11

    - name: Install osprey
      # `--extra gchat`: without it the module skips entirely (the zero-skip gate
      # below is the backstop).
      run: uv sync --locked --extra dev --extra gchat

    - *install-pinned-cli

    - name: Pull the Pub/Sub emulator image
      run: |
        # A failed pull in the fixture is a pytest.skip, so it is pulled here. The
        # reference comes from the fixture's constant (floating tag; the fixture's
        # OSPREY_E2E_GCHAT_PUBSUB_IMAGE override is where to pin it). PYTHONPATH as
        # pytest's, for the connectors test harness.
        IMAGE=$(PYTHONPATH=packages/osprey-connectors/tests uv run python -c 'from tests.e2e.fixtures.gchat_pubsub_emulator import IMAGE; print(IMAGE)')
        echo "Pulling emulator image: $IMAGE"
        docker pull "$IMAGE"

    - *llm-preflight-probe

    # Separate steps, no xdist: both files use one fixed-name emulator container
    # whose start pre-cleans that name, so they must never overlap.
    - name: Run Google Chat fixture smoke tests
      run: |
        uv run pytest tests/e2e/fixtures/test_gchat_fixture_smoke.py -v --tb=short \
          --junitxml=junit-gchat-fixture-smoke.xml

    - name: Run Google Chat bridge E2E
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
      run: |
        uv run pytest tests/e2e/test_gchat_bridge_e2e.py -v --tb=short \
          --junitxml=junit-gchat-bridge-e2e.xml

    - name: Fail the lane on any skipped test
      run: |
        # Every skip here is a CI misconfiguration (no runtime, image, extra or key),
        # so both junit reports must show zero skips and a non-zero count.
        uv run python - <<'PY'
        import sys
        import xml.etree.ElementTree as ET

        failed = False
        for report in ("junit-gchat-fixture-smoke.xml", "junit-gchat-bridge-e2e.xml"):
            total = skipped = 0
            for suite in ET.parse(report).getroot().iter("testsuite"):
                total += int(suite.get("tests", 0))
                skipped += int(suite.get("skipped", 0))
            print(f"{report}: {total} test(s), {skipped} skipped")
            if total == 0:
                print(f"::error::{report} collected no tests")
                failed = True
            if skipped:
                print(f"::error::{report} reports {skipped} skipped test(s)")
                failed = True
        if failed:
            sys.exit(1)
        print("✅ every Google Chat test ran; none skipped")
        PY
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: gchat-bridge-e2e
        engine: docker

