  visual-theming-agent:
    name: Watchdog Browser + Visual Regression (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # contents: write for this job alone: the last step pushes regenerated baselines to the PR branch.
    permissions:
      contents: write
    env:
      OSPREY_OFFLINE: "1"

    steps:
    - *checkout-full-history

    - *install-uv

    - *python-3-11

    - *sync-dev-deps

    - name: Fetch vendor assets
      timeout-minutes: 5
      run: uv run osprey vendor fetch --quiet

    - *playwright-cache-key

    - *playwright-apt

    - name: Restore Playwright browsers and apt debs
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.cache/ms-playwright
          ~/apt-archives
        key: ${{ steps.playwright-key.outputs.key }}
        restore-keys: |
          ${{ steps.playwright-key.outputs.prefix }}

    - *playwright-chromium

    - *install-pinned-cli

    - name: Run the watchdog browser suite
      timeout-minutes: 20
      run: |
        uv run pytest tests/interfaces/test_watchdog_e2e.py -m browser -v --tb=short \
          --junitxml=junit-watchdog-browser.xml

    - name: Fail the lane on any skipped watchdog browser test
      run: |
        # pytest exits 0 when every test skips, so the junit report is checked instead.
        uv run python scripts/ci/junit_no_skips.py junit-watchdog-browser.xml \
          --message "every watchdog browser test ran; none skipped"

    # Serial, in this job: container start/stop changes the host network, and every Chromium then fails
    # in-flight requests (ERR_NETWORK_CHANGED).
    - name: Run the container-backed browser suites
      run: |
        uv run pytest \
          tests/interfaces/web_terminal/test_auth_login_browser.py \
          tests/interfaces/web_terminal/test_ariel_embedded_agent_browser.py \
          -v --tb=short

    - name: Run visual regression suite
      run: uv run pytest tests/interfaces/design_system/test_visual.py -v --tb=short

    - name: Upload Linux-rendered baselines artifact
      uses: actions/upload-artifact@v7
      with:
        name: visual-baselines-linux
        path: tests/interfaces/design_system/baselines/*.png
        retention-days: 14

    - name: Commit new/updated Linux baselines back to the PR branch
      if: >-
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: "chore(visual): update Linux-rendered theming baseline(s) [skip ci]"
        file_pattern: 'tests/interfaces/design_system/baselines/*.png'
        commit_user_name: "github-actions[bot]"
        commit_user_email: "github-actions[bot]@users.noreply.github.com"

  frontend-js:
    name: Frontend JS (typecheck + lint + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - *checkout-full-history

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install JS dependencies
      # Regenerate the lock with `npm install --package-lock-only`, which is platform-neutral.
      run: npm ci

    - name: Typecheck (tsc --noEmit)
      run: python3 scripts/check.py run tsc

    - name: Lint (eslint)
      run: python3 scripts/check.py run eslint

    - name: Format (prettier)
      run: python3 scripts/check.py run prettier

    - name: Run JS tests (vitest)
      run: python3 scripts/check.py run vitest

    - *install-uv

    - name: Install Python dependencies
      run: uv sync --locked --extra dev

    - name: Run osprey app check over a panel (pinned JS toolchain)
      run: python3 scripts/check.py run app-check-js

  plugin-smoke:
    name: Plugin marketplace smoke (install the osprey plugin)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No `if:`: changes outside `plugins/` can break the install.
    steps:
    - *checkout-full-history

    # GITHUB_ENV, not job `env:`: the `runner` context is unavailable there. Every later step needs it.
    - name: Point the Claude CLI at a scratch config dir
      run: echo "CLAUDE_CONFIG_DIR=$RUNNER_TEMP/claude-cfg" >> "$GITHUB_ENV"

    - *install-uv

    - *python-3-11

    - name: Install dependencies
      run: uv sync --locked

    - *install-pinned-cli

    - name: Install the osprey plugin from the in-repo marketplace
      run: |
        claude plugin marketplace add "$GITHUB_WORKSPACE"
        claude plugin install osprey@osprey

    - name: Check the plugin exposes all ten skills
      run: |
        claude plugin details osprey@osprey | tee /tmp/details.txt
        grep -q 'Skills (10)' /tmp/details.txt
        for s in contribute design-philosophy doc-sync housekeeping panel pre-commit release setup test-audit upstream-scout; do grep -q "$s" /tmp/details.txt; done

  build-boot-smoke:
    name: Tier 1 — Build + MCP boot (${{ matrix.preset }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset: [hello-world, demo]

    steps:
    - *checkout-full-history

    - *install-uv

    - *python-3-11

    - *sync-dev-deps

    - name: Cache uv project-venv downloads
      uses: actions/cache@v6
      with:
        path: ~/.cache/uv
        key: uv-buildboot-${{ runner.os }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          uv-buildboot-${{ runner.os }}-

    - name: Run Tier 1 boot smoke for preset
      env:
        PRESET: ${{ matrix.preset }}
        # Over /tmp's tmpfs quota otherwise; see "Run unit tests".
        TMPDIR: ${{ runner.temp }}
      run: |
        uv run pytest tests/integration/test_build_boot.py -v --tb=short -k "$PRESET"

  changes:
    name: Changed-path classifier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Docs-only PRs stand the PR-scoped lanes down (scripts/ci/docs_only.py). Must succeed: a broken
    # classifier must red the run, not quietly skip every e2e lane.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
    - name: Checkout the classifier
      uses: actions/checkout@v7
      with:
        sparse-checkout: scripts/ci
        persist-credentials: false
    - name: Classify changed paths
      id: classify
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT_NAME: ${{ github.event_name }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HAS_FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
      run: |
        set -euo pipefail
        if [[ "$EVENT_NAME" != "pull_request" ]]; then
          echo "Not a pull request ($EVENT_NAME): every lane runs."
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
        elif [[ "$HAS_FULL_CI" == "true" ]]; then
          echo "full-ci label: every lane runs."
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
        else
          # Both names of a rename: moving a file out of src/ still counts as touching src/.
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)' > changed-paths.txt
          python3 scripts/ci/docs_only.py < changed-paths.txt >> "$GITHUB_OUTPUT"
        fi

  agentic-per-preset:
    name: Tier 3 — Agentic flow (${{ matrix.preset }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: changes
    if: &full-ci-pr-or-secret-revalidation >-
      (github.event_name == 'pull_request'
      && needs.changes.outputs.docs_only != 'true'
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.actor != 'dependabot[bot]'
        && contains(github.event.pull_request.labels.*.name, 'full-ci'))
      || (github.event_name == 'workflow_dispatch' && inputs.revalidate_secret_lanes)
    strategy:
      fail-fast: false
      matrix:
        preset: [hello-world, demo]

    steps:
    - *checkout-full-history

    - *install-uv

    - *python-3-11

    - *sync-dev-deps

    - &llm-preflight-probe
      name: Pre-flight LLM endpoint reachability check
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
      run: |
        if [ -z "${ALS_APG_API_KEY:-}" ]; then
          echo "❌ ALS_APG_API_KEY secret is not set on this runner"
          echo "   (Check repo secrets; every LLM-calling lane needs it.)"
          exit 1
        fi
        ALS_APG_PROBE_BASE="${ALS_APG_BASE_URL}"
        ALS_APG_PROBE_BASE="${ALS_APG_PROBE_BASE%/}"; ALS_APG_PROBE_BASE="${ALS_APG_PROBE_BASE%/v1}"
        HTTP_CODE=$(curl -sS -o /tmp/probe.txt -w "%{http_code}" --max-time 15 \
          -X POST "$ALS_APG_PROBE_BASE/v1/messages" \
          -H "Content-Type: application/json" \
          -H "anthropic-version: 2023-06-01" \
          -H "Authorization: Bearer $ALS_APG_API_KEY" \
          -d '{"model":"claude-haiku-5-5","max_tokens":4,"messages":[{"role":"user","content":"ping"}]}')
        if [ "$HTTP_CODE" != "200" ]; then
          echo "❌ ALS-APG endpoint probe failed (HTTP $HTTP_CODE)"
          echo "   Body (first 500 chars):"
          head -c 500 /tmp/probe.txt; echo
          echo "   If 401/403: rotate ALS_APG_API_KEY or check IP allowlist."
          echo "   If 5xx: ALS-APG outage — retry, or contact the proxy admin."
          exit 1
        fi
        echo "✅ ALS-APG endpoint reachable (HTTP 200)"

    - *install-pinned-cli

    - name: Run Tier 3 agentic test for preset
      timeout-minutes: 55
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
        PRESET: ${{ matrix.preset }}
      run: |
        # -k matches the snake_case test names (test_hello_world_*).
        PRESET_K="${PRESET//-/_}"
        uv run pytest tests/e2e/test_preset_agentic.py -v --tb=short -k "$PRESET_K"

    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: agentic-per-preset-${{ matrix.preset }}
        engine: docker

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      (github.event_name == 'pull_request'
      && needs.changes.outputs.docs_only != 'true'
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.actor != 'dependabot[bot]'
        && contains(github.event.pull_request.labels.*.name, 'full-ci'))
      || (github.event_name == 'workflow_dispatch' && !inputs.run_benchmarks)
    timeout-minutes: 50

    steps:
    - &free-runner-disk
      name: Free runner disk
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h /

    - *checkout-full-history

    - *install-uv

    - *python-3-11

    - *sync-dev-deps

    - *llm-preflight-probe

    - *install-pinned-cli

    - name: Run E2E tests
      timeout-minutes: 45
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
        E2E_FILTER: ${{ inputs.e2e_filter }}
      run: |
        if [ -n "$E2E_FILTER" ]; then
          echo "Running scoped E2E filter: $E2E_FILTER"
          # $E2E_FILTER may hold several paths or pytest args: split on purpose.
          # shellcheck disable=SC2086
          uv run pytest $E2E_FILTER -v --tb=short
        else
          # Every --ignore runs in another job (or is opt-in / dispatch-only); none is untested.
          # -n 4 --dist loadfile: real-LLM round-trips at near-zero CPU.
          uv run pytest tests/e2e/ -v --tb=short --durations=30 -n 4 --dist loadfile \
            --ignore=tests/e2e/test_preset_agentic.py \
            --ignore=tests/e2e/test_plan_stack_agentic.py \
            --ignore=tests/e2e/test_dispatch_deploy.py \
            --ignore=tests/e2e/test_single_user_narrowing_e2e.py \
            --ignore=tests/e2e/test_dispatch_overlay_visibility.py \
            --ignore=tests/e2e/test_bluesky_deploy.py \
            --ignore=tests/e2e/test_optimizer_deploy.py \
            --ignore=tests/e2e/test_bluesky_queue_e2e.py \
            --ignore=tests/e2e/test_dockerfile_e2e.py \
            --ignore=tests/e2e/test_privilege_split.py \
            --ignore=tests/e2e/test_audit_two_container.py \
            --ignore=tests/e2e/test_execution_environment_parity.py \
            --ignore=tests/e2e/test_tiled_roundtrip.py \
            --ignore=tests/e2e/test_va_substrate_equivalence.py \
            --ignore=tests/e2e/test_target_switch_agentic.py \
            --ignore=tests/e2e/test_orm_roundtrip.py \
