    name: Host Record E2E (host sessions record without a container; the stack takes the record over)
    runs-on: ubuntu-latest
    # Model-spending lane: live `osprey query`/`chat` against the host-local agent
    # record, then `osprey up --dev` takes the record over and hands it back.
    needs: changes
    if: *full-ci-pr-or-secret-revalidation
    timeout-minutes: 60

    steps:
    - *free-runner-disk

