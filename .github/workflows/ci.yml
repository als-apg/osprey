          --image osprey-e2e-full-chain-auth:local \
          osprey-e2e-full-chain-auth

  jupyter-panel-e2e:
    name: Notebook Panel E2E (deployed render + a kernel that follows the terminal)
    runs-on: ubuntu-latest
