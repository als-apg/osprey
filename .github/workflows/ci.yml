        docker rm -f osprey-e2e-va-substrate-agent-record || true
        docker rm -f osprey-e2e-va-substrate-agent-record-clickhouse || true
        docker volume ls -q --filter "name=^osprey-e2e-va-substrate_" \
          | xargs -r docker volume rm -f || true
        docker compose -p lane-e2e down || true
        docker rm -f lane-e2e-agent-record || true
        docker rm -f lane-e2e-agent-record-clickhouse || true
