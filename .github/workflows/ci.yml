  privilege-split-e2e:
    name: Privilege Split E2E (built images, stat-level ownership proof)
    runs-on: ubuntu-latest
    # Three image builds (privilege-split base + admin, then the audit module's
    # cold hello-world build); the steps carry 85 + 35. The job `name:` names the
    # first module only because branch protection matches on it.
    timeout-minutes: 120
    # Same-repo PRs, any base: every resource carries a per-run uuid, nothing
    # host-global.
    needs: changes
    if: *same-repo-pr-or-secret-revalidation

    steps:
    - *free-runner-disk

    - *checkout-full-history

    - *install-uv

    - *python-3-11

    - *install-osprey

    - name: Run privilege split E2E
      timeout-minutes: 85
      # No pip-spec override: the suite stages the local dev wheel, because what it
      # proves is unreleased code.
      run: |
        uv run pytest tests/e2e/test_privilege_split.py -v --tb=short \
          --junitxml=junit-privilege-split.xml

    # A second step, not a job: same runner needs and gating, and it keeps the two
    # image builds off one runner at once.
    - name: Run audit two-container mechanism E2E
      # `success() || failure()`: a red step above must not hide this result, and
      # `always()` would keep building after a cancel.
      if: success() || failure()
      timeout-minutes: 35
      # Stages the dev wheel too; Linux-only by design.
      run: |
        uv run pytest tests/e2e/test_audit_two_container.py -v --tb=short \
          --junitxml=junit-audit-two-container.xml

    - name: Fail the lane on a lane-wide skip
      if: success() || failure()
      run: |
        # Not the zero-skip gate: the audit module has documented per-test guards. A
        # report that collected nothing or skipped everything fails the lane; a partial
        # skip is a warning.
        uv run python - <<'PY'
        import os
        import sys
        import xml.etree.ElementTree as ET

        failed = False
        for report in ("junit-privilege-split.xml", "junit-audit-two-container.xml"):
            if not os.path.exists(report):
                print(f"::error::{report} was never written — the step that writes it did not finish")
                failed = True
                continue
            total = skipped = 0
            for suite in ET.parse(report).getroot().iter("testsuite"):
                total += int(suite.get("tests", 0))
                skipped += int(suite.get("skipped", 0))
            print(f"{report}: {total} test(s), {skipped} skipped")
            if total == 0:
                print(f"::error::{report} collected no tests")
                failed = True
            elif skipped == total:
                print(f"::error::{report} skipped every one of its {total} test(s)")
                failed = True
            elif skipped:
                print(f"::warning::{report} skipped {skipped} of {total} test(s)")
        if failed:
            sys.exit(1)
        print("✅ both privilege-split modules ran")
        PY

    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: privilege-split-e2e
        engine: docker

    # Belt and suspenders: per-run uuid names, so the tag prefix is the only
    # handle; scoped to it, never a bare prune.
    - name: Clean up any stranded resources from either module
      if: always()
      run: |
        docker ps -aq --filter "name=^osprey-e2e-privsplit-" | xargs -r docker rm -f
        docker images -q "osprey-e2e-privsplit-*" | xargs -r docker rmi -f
        docker volume ls -q --filter "name=^osprey-e2e-privsplit-" | xargs -r docker volume rm -f
        docker ps -aq --filter "name=^osprey-e2e-audit2c-" | xargs -r docker rm -f
        docker images -q "osprey-e2e-audit2c*" | xargs -r docker rmi -f
        docker volume ls -q --filter "name=^osprey-e2e-audit2c" | xargs -r docker volume rm -f

  dockerfile-e2e:
    name: Dockerfile E2E (generated container image)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: changes
    if: *same-repo-pr-or-secret-revalidation

    steps:
    - *free-runner-disk

    - *checkout-full-history

    - *install-uv

    - *python-3-11

    - *install-osprey

    - name: Run Dockerfile E2E
      timeout-minutes: 55
      env:
        # The PR branch, not the PyPI release.
        OSPREY_E2E_PIP_SPEC: git+https://github.com/${{ github.repository }}.git@${{ github.event.pull_request.head.sha || github.sha }}
        # For the HTTP test; it auto-skips without the key (advisory).
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
      run: uv run pytest tests/e2e/test_dockerfile_e2e.py -v --tb=short

    # ── the proxied build ──
    # Template Dockerfiles bridge the facility's uppercase HTTP_PROXY to apt's
    # lowercase names. The steps below prove it from the PROXY'S ACCESS LOG, not
    # the build's exit status (this runner has open egress). Every step sets
    # pipefail: the default shell has none.
    - name: Start a logging forward proxy (tinyproxy)
      # No ACL and no Listen: accept every client on every interface. `LogLevel Info`
      # is load-bearing: the target-host request line the assertion reads is logged
      # at Info.
      run: |
        set -euo pipefail
        rm -rf /tmp/osprey-proxy
        mkdir -p /tmp/osprey-proxy
        cat > /tmp/osprey-proxy/tinyproxy.conf <<'CONF'
        Port 8888
        Timeout 600
        MaxClients 100
        LogLevel Info
        LogFile "/proxy/access.log"
        CONF
        : > /tmp/osprey-proxy/access.log
        chmod 666 /tmp/osprey-proxy/access.log
        docker run -d --name osprey-ci-proxy --network host \
          -v /tmp/osprey-proxy:/proxy debian:bookworm-slim \
          sh -c 'apt-get update -qq \
                 && apt-get install -y -qq --no-install-recommends tinyproxy \
                 && exec tinyproxy -d -c /proxy/tinyproxy.conf'
        # Readiness is a bare TCP connect, deliberately: a probe that FETCHED
        # anything through the proxy would write that host into the access log
        # the assertion step reads, and could satisfy it on its own.
        for _ in $(seq 60); do
          if (exec 3<>/dev/tcp/127.0.0.1/8888) 2>/dev/null; then
            echo "✅ tinyproxy is listening on 127.0.0.1:8888"
            exit 0
          fi
          sleep 2
        done
        echo "❌ tinyproxy never came up on 127.0.0.1:8888"
        docker logs osprey-ci-proxy || true
        exit 1

    - name: Assert the uppercase-only proxy contract reaches the build
      # BuildKit copies HTTP_PROXY into http_proxy inside RUN, which would pass the
      # log assertion with the bridge deleted, so the build uses podman. This probe
      # pins that podman does not; if it ever does, the lane fails here.
      run: |
        set -euo pipefail
        rm -rf /tmp/osprey-proxy-probe
        mkdir -p /tmp/osprey-proxy-probe
        cat > /tmp/osprey-proxy-probe/Dockerfile <<'PROBE'
        FROM docker.io/library/busybox
        RUN env | sort | grep -i proxy || echo "NO-PROXY-ENV"
        PROBE
        # Fetch the base image before the measured build, and retry that: the
        # pull is the only part of this step that talks to a registry, and a
        # throttled or refused pull is not a fact about proxy variables. The
        # build then runs from local storage exactly once, so the property under
        # test is never retried into passing.
        pulled=
        for attempt in 1 2 3; do
          if podman pull docker.io/library/busybox; then
            pulled=yes
            break
          fi
          echo "pull attempt $attempt of 3 failed; retrying in $((attempt * 5))s"
          sleep "$((attempt * 5))"
        done
        if [ -z "$pulled" ]; then
          echo "❌ could not fetch the probe base image in 3 attempts — a registry"
          echo "   failure, which says nothing about the proxy contract below"
          exit 1
        fi
        # `|| rc=$?` is what keeps a failed build readable. The build's stderr is
        # redirected into $out, so under `set -e` a bare assignment aborts the
        # step before the printf below and reports the exit status with none of
        # the output that explains it.
        rc=0
        out="$(podman build --no-cache --pull=never --http-proxy=false \
          --build-arg HTTP_PROXY=http://127.0.0.1:8888 \
          --build-arg HTTPS_PROXY=http://127.0.0.1:8888 \
          /tmp/osprey-proxy-probe 2>&1)" || rc=$?
        printf '%s\n' "$out"
        if [ "$rc" -ne 0 ]; then
          echo "❌ the probe build failed (podman exit $rc); its output is above"
          exit 1
        fi
        if ! grep -q 'HTTP_PROXY=http://127.0.0.1:8888' <<<"$out"; then
          echo "❌ the uppercase HTTP_PROXY build-arg never reached the RUN environment"
          exit 1
        fi
        if grep -q 'http_proxy=' <<<"$out"; then
          echo "❌ this build runtime injects a lowercase proxy variable of its own —"
          echo "   the access-log assertion would then pass with the Dockerfile's"
          echo "   lowercase bridge deleted, i.e. it would prove nothing."
          exit 1
        fi
        echo "✅ uppercase in, uppercase only — the bridge is the sole path to apt"

    - name: Build the web-terminal auth sidecar through the proxy
      # A staged copy with an empty osprey-local-requirements.txt keeps the optional
      # COPY glob out of the picture. No lock constraints: the deps layer takes the
      # release build's index-resolving path. OSPREY_VERSION + OSPREY_DEV=1 mirror
      # `osprey up --dev`. `--http-proxy=false` drops buildah's copy of the host's
      # proxy variables, so the build-args are the only ones.
      timeout-minutes: 15
      run: |
        set -euo pipefail
        version="$(uv run --no-sync python -c 'import osprey; print(osprey.__version__)')"
        echo "OSPREY_VERSION=$version"
        rm -rf /tmp/osprey-sidecar-ctx
        mkdir -p /tmp/osprey-sidecar-ctx
        cp -a src/osprey/templates/modules/web_terminals/auth_sidecar/. /tmp/osprey-sidecar-ctx/
        : > /tmp/osprey-sidecar-ctx/osprey-local-requirements.txt
        podman build --no-cache --network=host --http-proxy=false \
          --build-arg HTTP_PROXY=http://127.0.0.1:8888 \
          --build-arg HTTPS_PROXY=http://127.0.0.1:8888 \
          --build-arg OSPREY_VERSION="$version" \
          --build-arg OSPREY_DEV=1 \
          --tag osprey-auth-sidecar:proxied-ci \
          /tmp/osprey-sidecar-ctx

    - name: Assert apt and pip traffic went through the proxy
      # apt traffic proves the lowercase bridge; pip traffic proves the framework
      # install was proxied too. No pipelines whose status could be swallowed.
      run: |
        set -euo pipefail
        log=/tmp/osprey-proxy/access.log
        if [ ! -s "$log" ]; then
          echo "❌ proxy access log missing or empty at $log — nothing was proxied at all"
          docker logs osprey-ci-proxy || true
          exit 1
        fi
        apt_hits="$(grep -F 'deb.debian.org' "$log" || true)"
        pip_hits="$(grep -E 'pypi\.org|files\.pythonhosted\.org' "$log" || true)"
        echo "── apt traffic seen by the proxy ──────────────────────────────"
        head -n 20 <<<"${apt_hits:-<none>}"
        echo "── pip traffic seen by the proxy ──────────────────────────────"
        head -n 20 <<<"${pip_hits:-<none>}"
        if [ -z "$apt_hits" ]; then
          echo "❌ no deb.debian.org request reached the proxy: the lowercase-proxy"
          echo "   bridge in the auth-sidecar Dockerfile is not doing its job."
          exit 1
        fi
        if [ -z "$pip_hits" ]; then
          echo "❌ no pypi.org / files.pythonhosted.org request reached the proxy:"
          echo "   the framework install bypassed it."
          exit 1
        fi
        echo "✅ both apt and pip traffic went through the proxy"

    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: dockerfile-e2e
        engine: docker

    - name: Stop the forward proxy
      # Fixed-name container on a shared runner. Last, after the capture step,
      # which needs the container's logs.
      if: always()
      run: |
        set -euo pipefail
        if [ -f /tmp/osprey-proxy/access.log ]; then
          echo "── last 40 proxy access-log lines ─────────────────────────────"
          tail -n 40 /tmp/osprey-proxy/access.log || true
        fi
        docker rm -f osprey-ci-proxy > /dev/null 2>&1 || true

  execution-environment-parity-e2e:
    name: Execution Environment Parity E2E (host venv vs generated image)
    runs-on: ubuntu-latest
    # Same-repo only, no secrets.
    needs: changes
    if: *same-repo-pr-or-secret-revalidation
    # Above the test's own BUILD_TIMEOUT (1200 s) plus setup, so the test kills a
    # slow build and prints its log.
    timeout-minutes: 40

    steps:
    - *checkout-full-history

    - *install-uv

    - *python-3-11

    # Editable install + `build`, so the test stages a wheel from this checkout
    # rather than testing the released PyPI osprey.
    - *install-osprey

    - name: Run execution environment parity E2E
      timeout-minutes: 35
      run: |
        uv run pytest tests/e2e/test_execution_environment_parity.py -v --tb=short
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: execution-environment-parity-e2e
        engine: docker

  deploy-writeback-e2e:
    name: Deploy Write-Back E2E (profile-owned secrets across a rebuild)
    runs-on: ubuntu-latest
    # Same-repo only, every base (nothing destructive, project names it owns),
    # no secrets. Sized for two project-image builds.
    needs: changes
    if: *same-repo-pr-or-secret-revalidation
    timeout-minutes: 40

    steps:
    - *free-runner-disk

    - *checkout-full-history

    - *install-uv

    - *python-3-11

    - *setup-compose

    - *install-osprey

    - name: Run deploy write-back E2E
      timeout-minutes: 35
      run: |
        uv run pytest tests/e2e/test_deploy_writeback_e2e.py -v --tb=short

    # Before the teardown below (see deploy-e2e).
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: deploy-writeback-e2e
        engine: docker

    # Belt and suspenders: see e2e-tests.
    - name: Clean up any stranded write-back-e2e resources
      if: always()
      run: |
        for case in rebuild divergent render; do
          project="osprey-e2e-wb-${case}"
          docker rm -f "${project}-ariel-postgres" || true
          docker rm -f "${project}-agent-record" || true
          docker rm -f "${project}-agent-record-clickhouse" || true
          docker compose -p "$project" down || true
          docker volume rm "${project}_ariel_postgres_data" || true
          docker volume rm "${project}_agent_record_clickhouse_data" || true
        done

  multi-user-deploy-lifecycle-e2e:
    name: Multi-User Deploy Lifecycle E2E (real container runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # PRs into main only (epic phase PRs skip it): it drives REAL destructive
    # lifecycle verbs (decommission/prune/nuke) against the runtime.
    needs: changes
    if: >-
      (github.event_name == 'pull_request'
      && needs.changes.outputs.docs_only != 'true' &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && inputs.revalidate_secret_lanes)

    steps:
    - *free-runner-disk

    - *checkout-full-history

    - *install-uv

    - *python-3-11

    - *setup-compose

    - *install-osprey

    - name: Run multi-user deploy lifecycle E2E
      timeout-minutes: 55
      # `-m 'not qmd'`: that test refuses to skip without a qmd image, which this
      # lane does not build; qmd-sidecar-e2e runs it.
      run: |
        uv run pytest tests/e2e/test_deploy_lifecycle.py -m 'not qmd' -v --tb=short

    # Before the teardown below (see deploy-e2e).
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: multi-user-deploy-lifecycle-e2e
        engine: docker

    # Belt and suspenders: see e2e-tests.
    - name: Clean up any stranded lifecycle-e2e resources
      if: always()
      run: |
        for user in alice bob carol dave erin; do
          docker rm -f "osprey-e2e-mus-p3-web-${user}" || true
          docker volume rm "osprey-e2e-mus-p3_${user}-claude-config" || true
          docker volume rm "osprey-e2e-mus-p3_${user}-agent-data" || true
        done
        docker rm -f osprey-e2e-mus-p3-nginx || true
        docker rm -f osprey-e2e-mus-p3-registry || true
        docker rm -f osprey-e2e-mus-p3-agent-record || true
        docker rm -f osprey-e2e-mus-p3-agent-record-clickhouse || true
        docker compose -p osprey-e2e-mus-p3 down || true
        docker volume rm osprey-e2e-mus-p3_agent_record_clickhouse_data || true

  auth-perimeter-e2e:
    name: Auth Perimeter E2E (real sidecar image + nginx auth_request)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Its own lane: the only job that builds the auth-sidecar Dockerfile (a real
    # pip install with a C toolchain). PRs into main AND epic/*: a safety lane
    # that only ran after the epic merged could go red inside a green gate.
    needs: changes
    if: &main-or-epic-pr-or-secret-revalidation >-
      (github.event_name == 'pull_request'
      && needs.changes.outputs.docs_only != 'true'
        && github.event.pull_request.head.repo.full_name == github.repository
        && (github.event.pull_request.base.ref == 'main'
        || startsWith(github.event.pull_request.base.ref, 'epic/')))
      || (github.event_name == 'workflow_dispatch' && inputs.revalidate_secret_lanes)

    steps:
    - *free-runner-disk

    - *checkout-full-history

    - *install-uv

    - *python-3-11

    - *setup-compose

    - *install-osprey

    # `osprey up --dev` stages this branch's wheel into the sidecar image.
    - name: Run auth perimeter E2E
      timeout-minutes: 55
      run: |
        uv run pytest tests/e2e/web_terminals/test_auth_perimeter.py -v --tb=short

    # Before the teardown below (see deploy-e2e).
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: auth-perimeter-e2e
        engine: docker

    # Belt and suspenders: see e2e-tests.
    - name: Clean up any stranded auth-perimeter resources
      if: always()
      run: |
        for user in alice bob; do
          docker rm -f "osprey-e2e-auth-perimeter-web-${user}" || true
          docker volume rm "osprey-e2e-auth-perimeter_${user}-claude-config" || true
          docker volume rm "osprey-e2e-auth-perimeter_${user}-agent-data" || true
        done
        docker rm -f osprey-e2e-auth-perimeter-auth || true
        docker rm -f osprey-e2e-auth-perimeter-nginx || true
        docker compose -p osprey-e2e-auth-perimeter down || true
        docker rm -f osprey-e2e-auth-perimeter-agent-record || true
        docker rm -f osprey-e2e-auth-perimeter-agent-record-clickhouse || true
        docker volume rm osprey-e2e-auth-perimeter_agent_record_clickhouse_data || true
        docker rmi -f osprey-e2e-auth-perimeter-auth:local || true
        docker rmi -f osprey-e2e-auth-perimeter-readonly:local || true

  terminal-auth-multiuser-e2e:
    name: Terminal Auth Multi-User E2E (auth.method token + none, real render image)
    runs-on: ubuntu-latest
    # One image build, two deployments; +10 over the single-deploy lanes. Must
    # stay under full-chain-auth-e2e's caps (pinned by
    # test_full_chain_auth_lane_outbudgets_the_single_build_lanes).
    timeout-minutes: 70
    # Scope as auth-perimeter-e2e. Its own lane: a real render image build.
    # Proves both sidecar-less postures (`auth.method: token` and `none`);
    # auth-perimeter-e2e covers the authenticated perimeter.
    needs: changes
    if: *main-or-epic-pr-or-secret-revalidation

    steps:
    - *free-runner-disk

    - *checkout-full-history

    - *install-uv

    - *python-3-11

    - *setup-compose

    - *install-osprey

    # `--dev` stages this branch's wheel; no provider secret (fake key, no model).
    - name: Run terminal auth multi-user E2E
      timeout-minutes: 65
      run: |
        uv run pytest tests/e2e/web_terminals/test_terminal_auth_multiuser_e2e.py -v --tb=short

    # Before the teardown below (see deploy-e2e).
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: terminal-auth-multiuser-e2e
        engine: docker

    # Belt and suspenders: see e2e-tests.
    - name: Clean up any stranded terminal-auth-multiuser resources
      if: always()
      run: |
        for user in alice; do
          docker rm -f "osprey-e2e-token-multiuser-web-${user}" || true
          docker volume rm "osprey-e2e-token-multiuser_${user}-claude-config" || true
          docker volume rm "osprey-e2e-token-multiuser_${user}-agent-data" || true
        done
        docker rm -f osprey-e2e-token-multiuser-nginx || true
        docker compose -p osprey-e2e-token-multiuser down || true
        docker rm -f osprey-e2e-token-multiuser-agent-record || true
        docker rm -f osprey-e2e-token-multiuser-agent-record-clickhouse || true
        docker volume rm osprey-e2e-token-multiuser_agent_record_clickhouse_data || true
        for user in alice kiosk; do
          docker rm -f "osprey-e2e-open-multiuser-web-${user}" || true
          docker volume rm "osprey-e2e-open-multiuser_${user}-claude-config" || true
          docker volume rm "osprey-e2e-open-multiuser_${user}-agent-data" || true
        done
        docker rm -f osprey-e2e-open-multiuser-nginx || true
        docker compose -p osprey-e2e-open-multiuser down || true
        docker rm -f osprey-e2e-open-multiuser-agent-record || true
        docker rm -f osprey-e2e-open-multiuser-agent-record-clickhouse || true
        docker volume rm osprey-e2e-open-multiuser_agent_record_clickhouse_data || true
        # Each lane's tier image, tagged `<project_name>-<tier>:local`.
        docker rmi -f osprey-e2e-token-multiuser-readonly:local || true
        docker rmi -f osprey-e2e-open-multiuser-readonly:local || true

  full-chain-auth-e2e:
    name: Full-Chain Auth E2E (real sidecar + role-resolved tier render + audit ledgers)
    runs-on: ubuntu-latest
    # Strictly above the single-build auth lanes: BOTH real images build cold here.
    # test_full_chain_auth_lane_outbudgets_the_single_build_lanes pins the relation
    # and test_full_chain_auth_lane_caps_are_the_measured_ones the numbers; moving
    # either is a re-measurement (workflow.rst, "Measured CI Figures").
    timeout-minutes: 85
    # Scope as the two auth lanes above. Its own lane: the only one building the
    # sidecar AND the project image in one deployment, proving the identity the
    # sidecar establishes reaches the container, picks its tier, and lands in its
    # own audit ledger.
    needs: changes
    if: *main-or-epic-pr-or-secret-revalidation

    steps:
    - *free-runner-disk

    - *checkout-full-history

    - *install-uv

    - *python-3-11

    - *setup-compose

    - *install-osprey

    # Playwright cache and apt treatment as visual-theming (read-only here).
    - *playwright-cache-key

    - *playwright-apt

    - name: Restore Playwright browsers and apt debs
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.cache/ms-playwright
          ~/apt-archives
        key: ${{ steps.playwright-key.outputs.key }}
        restore-keys: |
          ${{ steps.playwright-key.outputs.prefix }}

    - *playwright-chromium

    # `--dev` stages this branch's wheel into both images; no provider secret.
    - name: Run full-chain auth E2E
      timeout-minutes: 75
      run: |
        uv run pytest tests/e2e/test_full_chain_auth.py -v --tb=short \
          --junitxml=junit-full-chain-auth.xml

    - name: Fail the lane on any skipped test
      run: |
        # The only skip paths are "no runtime" and "daemon not responding", both CI
        # misconfigurations here, so a skip fails the lane.
        uv run python - <<'PY'
        import sys
        import xml.etree.ElementTree as ET

        report = "junit-full-chain-auth.xml"
        total = skipped = 0
        for suite in ET.parse(report).getroot().iter("testsuite"):
            total += int(suite.get("tests", 0))
            skipped += int(suite.get("skipped", 0))
        print(f"{report}: {total} test(s), {skipped} skipped")
        if total == 0:
            print(f"::error::{report} collected no tests")
            sys.exit(1)
        if skipped:
            print(f"::error::{report} reports {skipped} skipped test(s)")
            sys.exit(1)
        print("✅ every full-chain auth test ran; none skipped")
        PY

    # Before the teardown below (see deploy-e2e).
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: full-chain-auth-e2e
        engine: docker

    # Belt and suspenders: see e2e-tests. Volumes go by the project prefix so a
    # roster edit cannot strand them.
    - name: Clean up any stranded full-chain-auth resources
      if: always()
      run: |
        docker compose -p osprey-e2e-full-chain-auth down || true
        for user in alice bob carol dave kiosk erin; do
          docker rm -f "osprey-e2e-full-chain-auth-web-${user}" || true
        done
        docker rm -f osprey-e2e-full-chain-auth-auth || true
        docker rm -f osprey-e2e-full-chain-auth-nginx || true
        docker rm -f osprey-e2e-full-chain-auth-agent-record || true
        docker rm -f osprey-e2e-full-chain-auth-agent-record-clickhouse || true
        docker rm -f osprey-e2e-full-chain-auth-history || true
        docker volume ls -q --filter "name=^osprey-e2e-full-chain-auth_" \
          | xargs -r docker volume rm -f || true
        docker rmi -f osprey-e2e-full-chain-auth-auth:local || true
        docker rmi -f osprey-e2e-full-chain-auth-operator:local || true
        docker rmi -f osprey-e2e-full-chain-auth-probe:local || true
        # The project image `osprey up` builds, which the history service runs.
        docker rmi -f osprey-e2e-full-chain-auth:local || true

  jupyter-panel-e2e:
    name: Notebook Panel E2E (deployed render + a kernel that follows the terminal)
    runs-on: ubuntu-latest
    # Same-repo only, no secrets (fake key, no model).
