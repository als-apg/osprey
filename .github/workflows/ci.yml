    runs-on: ubuntu-latest
    # Only run on PRs from same repo (mirrors va-substrate-equivalence-e2e
    # gating). This job needs no secrets — both roundtrips drive the bridge
    # HTTP API directly, no LLM involved. It previously ran inside the
    # shared e2e-tests lane (its ~7min full VA/bridge/Tiled build + deploy
    # was the lane's second-biggest time sink); same extraction pattern as
    # every other dockerbuild-marked file.
    #
    # Two modules, run as two SEQUENTIAL steps rather than one pytest
    # invocation: both stand up their own VA and bind CA port 5064 by design,
    # so overlapping them would collide. Sequential steps also keep the two
    # failures separately attributable in the job log.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    # Builds the native PyAT/serving-stack VA image from source like
    # va-substrate-equivalence-e2e (see its timeout note) — generous cap so a
    # cold image cache can't red the job. Raised from 45 when the grid-scan
    # roundtrip joined. Each module's own internal caps, wire to wire: 300s
    # build + 1200s deploy + 300s health + its scan + a 300s `osprey down`
    # in the teardown, and flaky(reruns=1) repeats the SCAN only (the module
    # fixtures survive a rerun, so no second build/deploy) — 2580s for ORM
    # (240s scan) and 2340s for grid (120s scan), ~82min if both ran every
    # timeout to the wire.
    #
    # 75 is therefore deliberately NOT that pathological sum: it bounds the
    # realistic run, where the second module reuses the first's images and
    # nothing sits at its cap, while still leaving the suite's own named
    # timeouts — not a bare GHA cancellation — to report a genuine hang.
    # Tighten once there are observed green timings for the pair.
    timeout-minutes: 75

    steps:
    - name: Checkout repository
