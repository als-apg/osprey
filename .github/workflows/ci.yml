name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    # Epic phase PRs certify the phase, so the full lane set runs on them too.
    branches: [ main, 'epic/**' ]
    # `labeled`: applying the `full-ci` label must start a run. Any label re-runs
    # the workflow; the per-PR concurrency group cancels the superseded run.
    types: [ opened, synchronize, reopened, labeled ]
  workflow_dispatch:
    inputs:
      e2e_filter:
        description: >-
          Optional pytest path/keyword filter for the E2E job (debug-only;
          PR runs always use the full suite). Example:
          'tests/e2e/test_rf_cavity_correlation_scenario.py
          tests/e2e/test_vacuum_burst_scenario.py'
        required: false
        default: ''
      run_benchmarks:
        description: >-
          Run the on-demand benchmark lanes (channel-finder MCP benchmarks
          and the Tier 2 model benchmark) instead of the E2E lane. The home for e2e suites that are useful
          but too expensive to run on every PR — trigger before a release or
          after touching the code they exercise.
        required: false
        type: boolean
        default: false
      revalidate_secret_lanes:
        description: >-
          Run the API-key-dependent lanes (agentic flows, dispatch stacks,
          the build+deploy pipeline, Nextcloud/Google Chat bridges) against
          this ref. Dependabot's own
          runs are treated as fork runs and receive only the Dependabot
          secret store, so ALS_APG_API_KEY is empty and those lanes skip on
          its pull requests. After reading the dependency diff, a maintainer
          revalidates the branch with:
          gh workflow run ci.yml --ref <branch> -f revalidate_secret_lanes=true
          The same dispatch with --ref main is how main gets every lane a
          push skips: main-full-ci.yml starts it once a day when main has
          moved, and a maintainer can start it by hand.
        required: false
        type: boolean
        default: false

# Model-spending lanes (the LANES table in scripts/repo_checks.py, why="models")
# run only on (1) a same-repo, non-Dependabot PR labelled `full-ci`, or (2) a
# `revalidate_secret_lanes` dispatch, which is also how main gets them
# (main-full-ci.yml dispatches it nightly when main has moved). A docs-only PR
# stands the pull-request-scoped lanes down (`changes` job). Rationale, costs
# and figures: docs/source/contributing/workflow.rst, "Model-Spending Lanes".

# One live run per PR and per pushed branch; a dispatch run is never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ (github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)) || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

# Every `uv sync` carries `--locked` (fails on a stale uv.lock rather than
# re-locking it) and every `uv run` follows one. Lanes that test outside the
# lock move off it in a step of their own. test_ci_workflow_wiring.py holds this.

env:
  # ALS-APG endpoint for every LLM-touching job. No literal default: a fork
  # points its traffic at its own gateway through the repository variable.
  ALS_APG_BASE_URL: ${{ vars.ALS_APG_BASE_URL }}
  # Provider for every lane that collects tests/e2e/. A plain name, not a vars.
  # lookup: an unset variable would refuse every e2e lane.
  OSPREY_E2E_PROVIDER: als-apg
  # One model for everything, judge included.
  OSPREY_E2E_FORCE_MODEL: claude-haiku-5-5
  OSPREY_E2E_JUDGE_MODEL: claude-haiku-5-5
  # Diagnostics dir for every pytest step (_harness/ci_diagnostics.py); the
  # capture step uploads it.
  OSPREY_CI_DIAG_DIR: ci-diag

# Steps repeated across lanes are written once as a YAML anchor (`- &name`, at
# their first use) and reused as an alias (`- *name`). Editing an anchored step
# edits every lane that aliases it.
jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }} (${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    # A wedged xdist worker would otherwise hold the lane for the 6-hour default.
    # Runtime varies widely by runner, and an intermittent wedge/hang tail needs
    # headroom: a cap at the healthy runtime reds healthy runs.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.14']
        # macOS cells come from `include` below, not from this axis.
        os: [ubuntu-latest]
        # Each ubuntu cell runs as five shards (defined by the pytest check; figures
        # in workflow.rst, "Measured CI Figures"). A new test directory lands in rest-b.
        # test_ci_workflow_wiring.py holds that the shards cover tests/ exactly once.
        shard: [cli-a, cli-b, rest-a, rest-b, rest-c]
        # A macOS cell is ONE job (`shard: macos`) running only what repo_checks.py
        # lists in _MACOS_RUNS: the account's macOS ceiling is 5 concurrent jobs.
        # 3.14 runs on ubuntu only; on macOS the 3.14 readonly-gate warm-up runs as one
        # step of the 3.12 cell.
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"python-version":"3.12","os":"macos-latest","shard":"macos"}]' || '[{"python-version":"3.11","os":"macos-latest","shard":"macos"},{"python-version":"3.12","os":"macos-latest","shard":"macos"}]') }}
        # PRs run 3.12 only, except `full-ci`-labelled and Dependabot PRs.
        # serial-suites carries the same exclude.
        exclude: ${{ fromJSON(github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && '[{"python-version":"3.11"},{"python-version":"3.14"}]' || '[]') }}

    steps:
    - &checkout-full-history
      name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - &install-uv
      name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      # virtual-accelerator: the live Channel Access suites need it and SKIP
      # without it; tests/va/test_live_ca_venue_guard.py fails the lane if the server
      # does not import on linux/x86_64.
      run: uv sync --locked --extra dev --extra virtual-accelerator

    - &install-pinned-cli
      name: Install the pinned Claude Code CLI
      # The suite's real-binary checks fail, never skip, without it.
      uses: ./.github/actions/install-pinned-claude-code

    - name: Run unit tests
      # Below the job cap so a timeout fails the STEP (a job timeout is a hard cancel
      # that skips the diagnostics steps). Deliberately loose: tightening it flakes.
      timeout-minutes: 70
      env:
        # Switches on _harness/ci_diagnostics.py; unset elsewhere.
        OSPREY_CI_DIAG_DIR: ci-diag
        # PEP 669 tracing for the coverage cell; inert elsewhere.
        COVERAGE_CORE: sysmon
        # Not /tmp: on Ubuntu 26.04 it is a ~6.3 GB tmpfs quota (runner-images#14777),
        # and the suite's ~120 real builds copied venvs there and hit EDQUOT. On the
        # uv cache's filesystem the venvs are hardlinked.
        TMPDIR: ${{ runner.temp }}
      # Coverage only on the 3.12/ubuntu cell: 3.12+ can use sys.monitoring, which is
      # ~free versus ~2x for the C tracer. This guard and the Codecov `if:` must name
      # the same version (test_ci_workflow_wiring.py pins them together).
      #
      # --dist loadgroup relies on the FileOrGroupScheduling override in
      # tests/conftest.py (pins each file to one worker); the wiring test pins both.
      #
      # Deselected markers run elsewhere: pty and wallclock in serial-suites (they
      # time the box), canopy in canopy-contract.
      run: |
        if [ "${{ matrix.python-version }}" = "3.12" ] && [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
          COV_ARGS="--cov=src/osprey --cov=packages/osprey-connectors/src/osprey_connectors --cov=packages/osprey-optimizer/src/osprey_optimizer --cov=packages/pyaml-cs-osprey/src/pyaml_cs_osprey --cov-report=xml"
        else
          COV_ARGS=""
        fi
        # No `-o faulthandler_timeout`: its watchdog walks frames without the GIL and
        # segfaulted workers inside YAML/Jinja parsers on three consecutive runs.
        # _harness/ci_diagnostics.py samples stacks from a Python thread instead.
        #
        # --timeout=600: per-test cap, so a hang is named before the step cap cancels
        # the job. Ten minutes clears a cold container image pull. `signal`, not
        # `thread`: the thread method kills the xdist worker and wedges the scheduler.
        # Not an ini default, which would bind the e2e lanes too.
        #
        # The live Channel Access modules run in serial-suites: libca is process-global
        # and a crash in a shared worker becomes a silent wedge.
        #
        # The log is teed into ci-diag/ for diag_summary.py; `pipefail` because the
        # default shell has none.
        mkdir -p ci-diag
        set -o pipefail
        # The check leaves three integration modules to unconditional jobs (boot smoke,
        # Tier 0 static); an `if:` on those jobs would drop that coverage.
        # tests/deployment/test_ci_workflow_wiring.py holds the rule.
        # $COV_ARGS splits into its flags on purpose: it is empty or several words.
        # shellcheck disable=SC2086
        uv run python scripts/check.py run pytest --shard "${{ matrix.shard }}" -- --durations=50 --timeout=600 --timeout-method=signal -n 4 $COV_ARGS 2>&1 | tee ci-diag/pytest.log
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          grep -m1 '^CANOPY contract not exercised here' ci-diag/pytest.log >> "$GITHUB_STEP_SUMMARY" || true
        fi

    - name: Readonly gate under Python 3.14
      # The readonly gate refuses native loads once user code starts, so lazy stdlib
      # native loads must be warmed first, and which ones is OS-specific. This runs
      # the warm-up module under 3.14 on macOS; `--isolated` leaves the 3.12 .venv.
      if: matrix.os == 'macos-latest' && matrix.python-version == '3.12' && matrix.shard == 'macos'
      timeout-minutes: 15
      run: uv run python scripts/check.py run readonly-warmups-py314

    # Run on success too: the summary is the slow-test ranking on a green lane.
    - name: Summarise lane diagnostics
      if: always()
      # Names the test each worker was in when the lane stopped. `python3`, not
      # `uv run`, so it still reports when the install failed; `|| true` so it never
      # changes the lane's result.
      run: python3 scripts/ci/diag_summary.py ci-diag >> "$GITHUB_STEP_SUMMARY" || true

    - name: Upload lane diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ci-diag-unit-${{ matrix.python-version }}-${{ matrix.os }}-${{ matrix.shard }}
        path: ci-diag/
        retention-days: 14
        if-no-files-found: warn

    - name: Upload coverage reports to Codecov
      # Codecov merges the shards' reports for one commit.
      uses: codecov/codecov-action@v7
      if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella-${{ matrix.shard }}
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  serial-suites:
    name: Serial suites Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Suites that must not share a runner with the unit sweep's workers or with
    # each other (pty and wall-clock budgets time the box; live CA needs its own
    # process). The job cap is the step caps plus setup; test_ci_workflow_wiring.py
    # holds the sum.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.14']
        os: [ubuntu-latest]
        exclude: ${{ fromJSON(github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && '[{"python-version":"3.11"},{"python-version":"3.14"}]' || '[]') }}

    steps:
    - *checkout-full-history

    - *install-uv

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      # virtual-accelerator: see the `test` job.
      run: uv sync --locked --extra dev --extra virtual-accelerator

    - *install-pinned-cli

    - name: Run real-terminal pty suite serially
      # Ubuntu only: the scenarios assert on timing, and macOS runners are noisier.
      if: matrix.os == 'ubuntu-latest'
      # Serial, no xdist: a loaded runner turns the spinner-advance assertions into
      # intermittent reds. `-m pty`, not the directory: test_stub_coverage.py is
      # unmarked on purpose and runs in the unit sweep. No cache for
      # .cache/pty-exemplar: rendering it (~1.2 s) is cheaper than a cache round trip.
      timeout-minutes: 10
      run: uv run python scripts/check.py run pytest-pty

    - name: Run the wall-clock budgets serially
      # Collects every file carrying the marker; tests/integration budgets run in
      # qmd-sidecar-e2e, which builds their image. Ubuntu only, as above.
      if: matrix.os == 'ubuntu-latest'
      timeout-minutes: 15
      run: uv run python scripts/check.py run pytest-wallclock-unit

    - name: Run live Channel Access suites in isolation
      # One process per module via the live-CA gate, which fails on any skip (closes
      # the gap the in-sweep venue guard cannot). After the timing steps so its load
      # is not measured. The cap clears the gate's 5-minute per-module limit twice.
      if: matrix.os == 'ubuntu-latest'
      timeout-minutes: 15
      run: uv run python scripts/check.py run live-ca

  dependency-floor:
    name: Archiver suite at the declared dependency floor
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Every other lane resolves the newest pandas/numpy; this one pins the declared
    # floor (pandas 3 changed string dtype and datetime resolution).
    steps:
    - &checkout
      name: Checkout repository
      uses: actions/checkout@v7

    - *install-uv

    - &python-3-11
      name: Set up Python
      run: uv python install 3.11

    - &sync-dev-deps
      name: Install dependencies
      run: uv sync --locked --extra dev

    - name: Pin pandas and numpy to the declared floor
      # After `uv sync`, which would resolve them back up.
      run: uv pip install "pandas==2.2.3" "numpy==2.2.6"

    - name: Show resolved versions
      run: uv run --no-sync python -c "import pandas, numpy; print('pandas', pandas.__version__, 'numpy', numpy.__version__)"

    - name: Run the archiver suite
      # `--no-sync` keeps the pin: a bare `uv run` re-syncs and undoes it.
      run: |
        uv run --no-sync pytest \
          packages/osprey-connectors/tests/osprey_connectors_tests/test_archiver_timerange.py \
          packages/osprey-connectors/tests/osprey_connectors_tests/test_epics_archiver_connector.py \
          packages/osprey-connectors/tests/osprey_connectors_tests/test_doocs_archiver_connector.py \
          packages/osprey-connectors/tests/osprey_connectors_tests/test_mya_archiver_connector.py \
          tests/connectors/test_mya_registration.py \
          tests/connectors/test_mock_connector.py \
          tests/connectors/test_archiver_timezone.py \
          tests/connectors/test_simulation_integration.py \
          tests/utils/test_timeseries.py \
          -v --tb=short

  optimizer:
    name: Optimizer service (engine + real Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The optimizer's `service` extra (xopt, torch, botorch) is installed only
    # here, so the `test` lanes skip its engine suite. redis-server is for the
    # Lua-script tests.
    steps:
    - *checkout

    - *install-uv

    - *python-3-11

    - name: Install redis-server
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends redis-server

    - name: Install dependencies
      # --all-packages so --extra service reaches the workspace member that defines it.
      run: uv sync --locked --all-packages --extra dev --extra service

    - name: Run the optimizer suite
      # Below the job's cap, so a wedged run fails this step and the capture below still runs.
      timeout-minutes: 25
      # -n 2: two CPUs, each worker starts its own redis-server.
      run: >-
        uv run --no-sync pytest tests/optimizer -v --tb=short -n 2 --dist loadgroup
        --timeout=600 --timeout-method=signal
        --cov=packages/osprey-optimizer/src/osprey_optimizer --cov-report=xml --cov-report=term

    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: optimizer

    - name: Upload coverage reports to Codecov
      # Codecov merges this with the `test` lanes' reports for the same commit.
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-optimizer
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  connectors-standalone:
    name: Connectors suite without the framework
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # osprey-connectors releases on its own cycle; its suite runs here without
    # the framework (and with it in the unit lane's rest-b shard).
    steps:
    - *checkout-full-history

    - *install-uv

    - *python-3-11

    - name: Install the connectors package alone
      # The member, its dependencies and its `dev` group, exactly as uv.lock pins them.
      run: uv sync --locked --package osprey-connectors

    - name: Refuse an environment that holds the framework
      run: >-
        uv run --no-sync python -c "import importlib.metadata as m, importlib.util as u, sys;
        sys.exit('osprey-framework is installed' if u.find_spec('osprey')
        or any(d.name == 'osprey-framework' for d in m.distributions()) else 0)"

    - name: Run the connectors suite
      # `-c` makes the package the rootdir, so the framework's conftest never loads.
      run: >-
        uv run --no-sync pytest -c packages/osprey-connectors/pyproject.toml
        packages/osprey-connectors/tests -n 4 --dist loadgroup
        --timeout=600 --timeout-method=signal

    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: connectors-standalone

  # Connectors compatibility lanes. Lane A (`connectors-compat`) holds HEAD of
  # the connectors to every supported framework release; Lane B
  # (`framework-at-connectors-floor`) holds HEAD of the framework to its declared
  # connectors floor. Both stand down (succeeding, with a reason in the log) until
  # data lifts them: listing a release in [tool.osprey-connectors.compat], or
  # raising the floor to FIRST_INDEPENDENT_CONNECTORS. See
  # scripts/ci/connectors_compat_matrix.py and connectors_compat_lane.py.
  connectors-compat-plan:
    name: Plan the connectors compatibility lanes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      floor: ${{ steps.plan.outputs.floor }}
      floor-applicable: ${{ steps.plan.outputs.floor-applicable }}
    steps:
    - *checkout-full-history

    - name: Read the supported releases and the connectors floor
      id: plan
      # Stdlib-only: the plan must not wait on a dependency install.
      run: python3 scripts/ci/connectors_compat_matrix.py github-output

  connectors-compat:
    name: Connectors HEAD under framework ${{ matrix.framework || '(none listed)' }}
    needs: connectors-compat-plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # One cell per supported framework release, from PyPI, with the HEAD
    # connectors wheel in place of the one it resolved.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.connectors-compat-plan.outputs.matrix) }}
    env:
      FRAMEWORK: ${{ matrix.framework }}
      # Outside the checkout, so nothing of this tree is importable from it.
      COMPAT_VENV: /tmp/connectors-compat
    steps:
    - name: Stand down while no framework release is listed
      if: matrix.framework == ''
      env:
        REASON: ${{ matrix.reason }}
      run: echo "$REASON"

    - name: Checkout repository
      if: matrix.framework != ''
      uses: actions/checkout@v7
      # Tags: the wheel's version comes from the git tag.
      with:
        fetch-depth: 0

    - name: Install uv
      if: matrix.framework != ''
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python
      if: matrix.framework != ''
      run: uv python install 3.11

    - name: Build the connectors wheel at HEAD
      if: matrix.framework != ''
      run: uv build --package osprey-connectors --wheel --out-dir dist/

    - name: Install the framework release from PyPI with the HEAD connectors
      if: matrix.framework != ''
      run: >-
        python3 scripts/ci/connectors_compat_lane.py install
        --venv "$COMPAT_VENV" --framework "$FRAMEWORK" --connectors head

    - name: Check the release against the connectors
      if: matrix.framework != ''
      run: >-
        python3 scripts/ci/connectors_compat_lane.py check
        --venv "$COMPAT_VENV" --workdir "$RUNNER_TEMP/contracts"

  framework-at-connectors-floor:
    name: Framework HEAD at its declared connectors floor
    needs: connectors-compat-plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # `--no-sources` installs the floor connectors from PyPI. pyaml-cs-osprey and
    # osprey-optimizer are named by path because `--no-sources-package` alone
    # leaves workspace sources a `uv pip install` refuses, and the optimizer is
    # not on PyPI.
    env:
      FLOOR: ${{ needs.connectors-compat-plan.outputs.floor }}
    steps:
    - name: Stand down while the floor predates the independent releases
      if: needs.connectors-compat-plan.outputs.floor-applicable != 'true'
      run: |
        echo "not applicable yet: the connectors floor $FLOOR predates the first independent"
        echo "osprey-connectors release (FIRST_INDEPENDENT_CONNECTORS in scripts/ci/connectors_compat_matrix.py)"

    - name: Checkout repository
      if: needs.connectors-compat-plan.outputs.floor-applicable == 'true'
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install uv
      if: needs.connectors-compat-plan.outputs.floor-applicable == 'true'
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python
      if: needs.connectors-compat-plan.outputs.floor-applicable == 'true'
      run: uv python install 3.11

    - name: Install the framework with the floor connectors
      if: needs.connectors-compat-plan.outputs.floor-applicable == 'true'
      run: |
        uv venv --python 3.11
        uv pip install --no-sources -e ".[dev]" -e ./packages/pyaml-cs-osprey -e ./packages/osprey-optimizer "osprey-connectors==$FLOOR"

    - name: Hold the lane to the floor connectors from site-packages
      if: needs.connectors-compat-plan.outputs.floor-applicable == 'true'
      run: >-
        python3 scripts/ci/connectors_compat_lane.py assert-installed
        --python .venv/bin/python --module osprey_connectors --connectors-version "$FLOOR"

    - name: Scan the framework for connectors names the floor lacks
      if: needs.connectors-compat-plan.outputs.floor-applicable == 'true'
      run: >-
        .venv/bin/python -I
        packages/osprey-connectors/tests/osprey_connectors_tests/compat/scan_framework_imports.py
        src/osprey packages/pyaml-cs-osprey/src/pyaml_cs_osprey

    - name: Run the connector-facing framework suites at the floor
      if: needs.connectors-compat-plan.outputs.floor-applicable == 'true'
      # Source-text tests (which read this checkout's connectors) are deselected; see
      # scripts/ci/connectors_compat_lane.py.
      run: >-
        python3 scripts/ci/connectors_compat_lane.py pytest
        --python .venv/bin/python --installed osprey_connectors --
        tests/connectors tests/registry
        -m "not pty and not wallclock" -n 4 --dist loadgroup
        --timeout=600 --timeout-method=signal

  lint:
    name: Lint and Code Quality + Tier 0 config-key guard
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - *checkout-full-history

    - *install-uv

    - *python-3-11

    - name: Lockfile is current with pyproject
      # Names a stale uv.lock before the sync (which would otherwise just fail).
      run: python3 scripts/check.py run lockfile

    - *sync-dev-deps

    - name: Run ruff (linting)
      run: uv run python scripts/check.py run ruff

    - name: Run ruff (formatting)
      run: uv run python scripts/check.py run ruff-format

    - name: Run lint-imports (import boundaries)
      # Contracts: [tool.importlinter] in pyproject.toml. `!cancelled()` here and
      # below so an earlier failure does not hide this one and cost a second cycle.
      if: ${{ !cancelled() }}
      run: uv run python scripts/check.py run import-contracts

    - name: Run ruff import-private-name on the framework
      # PLC2701 catches a `_`-name reached past a connectors namespace (lint-imports
      # sees modules, not names). Preview-only in the pinned ruff, so selected alone.
      if: ${{ !cancelled() }}
      run: uv run python scripts/check.py run private-imports

    - name: Run the connectors public-names check
      # A name in a public osprey_connectors __all__ that no shipped code
      # outside its module uses fails here, unless it is a declared extension
      # point.
      if: ${{ !cancelled() }}
      run: uv run python scripts/check.py run connectors-public-names

    - name: Run config-key resurrection guard (with back-test)
      if: ${{ !cancelled() }}
      # `--back-test` proves each orphan regex matches at the baseline and not on
      # the branch. The unit-lane test of this skips when the baseline is
      # unreachable; this lane has full history, so the proof cannot silently drop.
      run: uv run python scripts/check.py run config-keys

    - name: Run changelog-fragment guard
      # `python3`, not `uv run`: stdlib-only, so it still reports when the install
      # broke. The base reaches the shell through `env:`, never `${{ }}` in `run:`:
      # a branch name is attacker-controlled text. Needs fetch-depth: 0.
      if: ${{ !cancelled() && github.event_name == 'pull_request' }}
      env:
        BASE: ${{ format('origin/{0}', github.event.pull_request.base.ref) }}
      run: python3 scripts/check.py run changelog --base "$BASE"

    - name: Run plugin version-bump gate
      # Consumers install the plugin by version, so an edit without a bump never
      # reaches them. Base handling as in the changelog step; on a push the base is
      # the first parent. No fetch here: a shallow fetch would break the merge base.
      if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'push') }}
      env:
        BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || 'HEAD^1' }}
      run: python3 scripts/check.py run plugin-version --base "$BASE"

    - name: No tracked file is gitignored
      if: ${{ !cancelled() }}
      run: python3 scripts/check.py run tracked-ignored

    - name: No document hand-types the parallel sweep
      if: ${{ !cancelled() }}
      run: python3 scripts/check.py run hand-typed-sweeps

    - name: Install gitleaks
      # Same version as the pre-commit hook (the wiring test holds them equal).
      if: ${{ !cancelled() }}
      env:
        GITLEAKS_VERSION: 8.30.0
        GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
      run: |
        curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
        sudo tar -C /usr/local/bin -xzf "$RUNNER_TEMP/gitleaks.tar.gz" gitleaks

    - name: Run gitleaks (secret scan)
      # Base through env:, as in the changelog step.
      if: ${{ !cancelled() && github.event_name == 'pull_request' }}
      env:
        BASE: ${{ format('origin/{0}', github.event.pull_request.base.ref) }}
      run: python3 scripts/check.py run gitleaks --base "$BASE"

    - name: Run mypy (type checking)
      run: uv run python scripts/check.py run mypy

    - name: Run actionlint (workflow lint)
      if: ${{ !cancelled() }}
      run: uv run python scripts/check.py run actionlint

  docs:
    name: Documentation Build (Check Only)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - *checkout-full-history

    - *install-uv

    - *python-3-11

    # sphinx.ext.graphviz needs `dot`; its warnings are errors.
    - name: Install graphviz
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz

    - name: Install dependencies
      run: uv sync --locked --extra docs

    - name: Build documentation
      run: python3 scripts/check.py run docs

    - name: Upload documentation artifact
      uses: actions/upload-artifact@v7
      if: github.event_name == 'pull_request'
      with:
        name: documentation-preview
        path: docs/build/html
        retention-days: 7

    # Unfollowable-by-checker addresses go in `linkcheck_ignore` (docs/source/conf.py).
    - name: Check for broken links
      run: python3 scripts/check.py run linkcheck

  package:
    name: Package Build (framework + lean connectors wheel)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - *checkout-full-history

    - *install-uv

    - *python-3-11

    # Order declared in PACKAGE_STEPS of scripts/repo_checks.py.
    - name: Build and check the packages
      run: python3 scripts/check.py run package

    # The framework's wheel and sdist only.
    - name: Upload package artifacts
      uses: actions/upload-artifact@v7
      with:
        name: package
        path: dist/osprey_framework-*
        retention-days: 7

  static-checks:
    name: Tier 0 — Static (preset YAML + builds, skill ↔ MCP-tool consistency, podman-compose parse)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - *checkout-full-history

    - *install-uv

    - *python-3-11

    - *sync-dev-deps

    - name: Run Tier 0 static checks
      timeout-minutes: 15
      run: uv run pytest tests/integration/test_preset_static.py tests/integration/test_preset_build.py -v --tb=short

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Check the recorded CLI tool inventory against the pinned build
      timeout-minutes: 5
      run: uv run python scripts/cli_tool_inventory.py --check

    - name: Resume an authored transcript under the pinned CLI
      timeout-minutes: 5
      run: uv run python scripts/transcript_resume_probe.py

    - name: Pin podman-compose 1.0.6 as podman's compose provider
      # `podman compose` would otherwise find the runner's docker-compose plugin
      # first and certify nothing; containers.conf names the binary by absolute path.
      # `podman ps` pays rootless storage init here, before the probe's 5 s timeout.
      # Degrades rather than fails without podman: this job gates every PR, and
      # two-shape-boot-e2e (unguarded) still reds if podman is gone.
      run: |
        if ! command -v podman >/dev/null 2>&1; then
          echo "⏭️  podman is not on this runner image — the podman-compose parse"
          echo "    coverage below will skip. The two-shape-boot-e2e lane is NOT"
          echo "    guarded this way and will red if podman is genuinely gone."
          echo "OSPREY_PARSE_SKIP=1" >> "$GITHUB_ENV"
          exit 0
        fi
        pip install --user podman-compose==1.0.6
        PODMAN_COMPOSE_BIN="$(command -v podman-compose || true)"
        if [ -z "$PODMAN_COMPOSE_BIN" ]; then
          echo "❌ podman-compose is not on PATH after install"
          exit 1
        fi
        mkdir -p ~/.config/containers
        cat > ~/.config/containers/containers.conf <<EOF
        [engine]
        compose_providers = ["$PODMAN_COMPOSE_BIN"]
        EOF
        # Second, independent expression of the same choice. The file above is
        # authoritative for podman's own config chain, but a USER-level
        # containers.conf.d drop-in loads after it and would outrank it; this
        # env var sidesteps the chain entirely. Nothing in this repo writes such
        # a drop-in — the exposure is a hypothetical property of a future runner
        # image — so this is hardening, not a fix for a live hole.
        echo "PODMAN_COMPOSE_PROVIDER=$PODMAN_COMPOSE_BIN" >> "$GITHUB_ENV"
        podman --version
        podman ps >/dev/null

    - name: Parse the merged podman topology (podman-compose config, no containers)
      env:
        # Without it the probe finds the runner's docker daemon first.
        CONTAINER_RUNTIME: podman
      # The cheap half of two-shape-boot-e2e: renders only and parses the REAL
      # merged document and env file with `podman-compose config`.
      run: |
        if [ "${OSPREY_PARSE_SKIP:-}" = "1" ]; then
          echo "⏭️  skipped: podman is absent from this runner (see the pin step above)."
          exit 0
        fi
        uv run osprey init parse-check --preset hello-world --no-git \
          --set dispatch.triggers=tutorial_triggers.yml \
          --set dispatch.worker_count=1 \
          --set dispatch.workspace_mode=isolated \
          --set dispatch.network=bridge \
          --set 'config.deployed_services=[]'
        cd parse-check
        # The two chain members carry the SAME key with DIFFERENT values, so
        # the interpolated result below distinguishes "the merged env file was
        # read" from "the merged env file preserved local-wins precedence".
        printf '\nDISPATCH_WORKER_TOKEN=shared-loses\n' >> .env.shared
        printf 'EVENT_DISPATCHER_TOKEN=local-wins\nDISPATCH_WORKER_TOKEN=local-wins\n' > .env
        uv run osprey build --skip-deps --skip-lifecycle
        uv run python - <<'PY'
        import os
        import subprocess
        import sys
        from pathlib import Path

        from osprey.deployment.compose_generator import (
            compose_base_cmd,
            compose_provider_env,
            resolve_repo_root,
        )
        from osprey.deployment.container_lifecycle import _env_file_args, as_built_compose_files
        from osprey.deployment.runtime_helper import (
            ComposeProvider,
            detect_compose_provider,
            get_runtime_command,
        )
        from osprey_connectors.config import load_config

        config = load_config("build/config.yml")
        root = Path(resolve_repo_root(config)).resolve()
        runtime_cmd = get_runtime_command(config)

        info = detect_compose_provider(runtime_cmd, config)
        print("provider banner:", info.banner)
        assert info.provider is ComposeProvider.PODMAN_COMPOSE, info
        assert info.version == (1, 0, 6), info

        # Building the argv is what WRITES .osprey-compose.yml and
        # build/.env.merged; `_env_file_args` is the seam that chooses the
        # merged env file over the two-member chain, exactly as the deploy
        # verbs call it.
        argv = compose_base_cmd(
            runtime_cmd,
            as_built_compose_files(config, root),
            root,
            _env_file_args(root, info.provider),
            info.provider,
        )
        print("argv:", " ".join(argv))
        assert "--project-directory" not in argv, "podman-compose does not parse that flag"

        env = {**os.environ, **compose_provider_env(info.provider, root)}
        parsed = subprocess.run(
            [*argv, "config"], capture_output=True, text=True, env=env, cwd=root, check=False
        )
        sys.stdout.write(parsed.stdout)
        sys.stderr.write(parsed.stderr)
        assert parsed.returncode == 0, "podman-compose could not parse the merged topology"

        for service in ("event-dispatcher", "dispatch-worker-1"):
            assert f"{service}:" in parsed.stdout, f"{service} missing from the merged document"
        assert "local-wins" in parsed.stdout, "build/.env.merged did not interpolate the topology"
        assert "shared-loses" not in parsed.stdout, ".env.shared outranked .env in the merge"
        print("✅ merged topology parses under podman-compose 1.0.6, .env.merged interpolates it")
        PY

    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: static-checks
        engine: podman

  visual-theming:
    name: Behavioral + Visual Theming (Playwright, design system)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # No `if:`: nothing else collects the browser suites, and the UI changes from
    # well outside `interfaces/`. WebKit is for the graph finder suite.
    # OSPREY_OFFLINE=1: pages load vendored libraries, never the CDN.
    env:
      OSPREY_OFFLINE: "1"

    steps:
    - *checkout-full-history

    - *install-uv

    - *python-3-11

    - *sync-dev-deps

    # The vendor trees are gitignored; this writes them, checked against SHA256.
    - name: Fetch vendor assets
      timeout-minutes: 5
      run: uv run osprey vendor fetch --quiet

    # `--with-deps` pulls ~140 MB of debs, and azure's apt mirror some days serves
    # them at 30-100 kB/s (20-40 min, lane timeout). So the debs and browsers are
    # cached, apt prefers archive.ubuntu.com, and each install has a short timeout.
    - &playwright-cache-key
      name: Resolve Playwright browser cache key
      id: playwright-key
      run: |
        version=$(uv run python -c 'import importlib.metadata as m; print(m.version("playwright"))')
        : "${ImageOS:?runner image name missing}" "${ImageVersion:?runner image version missing}"
        echo "prefix=playwright-${version}-${ImageOS}-" >> "$GITHUB_OUTPUT"
        echo "key=playwright-${version}-${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

    - &playwright-apt
      name: Configure apt for the Playwright system deps
      # Swaps the azure/archive.ubuntu.com priorities in apt-mirrors.txt (azure stays
      # the fallback). The snippet name sorts after the image's `zz-retries`.
      run: |
        sudo sed -i -E \
          -e 's#^(http://azure\.archive\.ubuntu\.com/ubuntu/\t)priority:1$#\1priority:2#' \
          -e 's#^(https?://archive\.ubuntu\.com/ubuntu/\t)priority:2$#\1priority:1#' \
          /etc/apt/apt-mirrors.txt
        cat /etc/apt/apt-mirrors.txt
        grep -Eq '^https?://archive\.ubuntu\.com/ubuntu/[[:space:]]+priority:1$' /etc/apt/apt-mirrors.txt \
          || echo "::warning::apt-mirrors.txt not in the expected shape; apt keeps the image's mirror order"
        mkdir -p "$HOME/apt-archives/partial"
        sudo tee /etc/apt/apt.conf.d/zzz-playwright-deps-cache >/dev/null <<EOF
        Dir::Cache::Archives "$HOME/apt-archives";
        APT::Keep-Downloaded-Packages "true";
        Acquire::http::Timeout "15";
        Acquire::Retries "3";
        EOF

    - name: Restore Playwright browsers and apt debs
      id: playwright-cache
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.cache/ms-playwright
          ~/apt-archives
        key: ${{ steps.playwright-key.outputs.key }}
        restore-keys: |
          ${{ steps.playwright-key.outputs.prefix }}

    - &playwright-chromium
      name: Install Playwright chromium
      timeout-minutes: 10
      run: uv run playwright install chromium --with-deps

    - name: Install Playwright webkit
      timeout-minutes: 10
      run: uv run playwright install webkit --with-deps

    - name: Hand the apt debs to the runner user
      # apt wrote them as root; the save cannot archive what it cannot read.
      run: |
        sudo apt-get autoclean
        sudo chown -R "$USER" ~/apt-archives
        rm -f ~/apt-archives/lock

    - name: Save Playwright browsers and apt debs
      # Saved here, not in a post step, so a later test failure still warms the cache.
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          ~/.cache/ms-playwright
          ~/apt-archives
        key: ${{ steps.playwright-key.outputs.key }}

    # `loadfile`: a file's tests share module fixtures. Suites that start a
    # container run serially in `visual-theming-agent`.
    - name: Run behavioral theming suite
      run: |
        uv run pytest -n 4 --dist loadfile \
          tests/interfaces/design_system/test_behavioral.py \
          tests/interfaces/design_system/test_theme_lab.py \
          tests/interfaces/design_system/test_dispatch_dashboard_unauthorized.py \
          tests/interfaces/design_system/test_dispatch_dashboard_toolbar.py \
          tests/interfaces/design_system/test_panel_browser.py \
          tests/interfaces/design_system/test_dispatch_run_crosslinks.py \
          tests/interfaces/design_system/test_dispatch_run_thinking_browser.py \
          tests/interfaces/design_system/test_dispatch_dashboard_clock_trigger.py \
          tests/interfaces/design_system/test_dispatch_dashboard_facility_time.py \
          tests/interfaces/design_system/test_dispatch_dashboard_trigger_tools.py \
          tests/interfaces/design_system/test_dispatch_run_owner.py \
          tests/interfaces/design_system/test_osprey_drawer.py \
          tests/interfaces/artifacts/test_gallery_interactions.py \
          tests/interfaces/artifacts/test_plot_theme_browser.py \
          tests/interfaces/artifacts/test_plot_export_browser.py \
          tests/interfaces/artifacts/test_opaque_origin_browser.py \
          tests/docs/screenshots/test_video_probes_browser.py \
          tests/interfaces/web_terminal/test_panels_browser.py \
          tests/interfaces/web_terminal/test_opaque_panel_browser.py \
          tests/interfaces/web_terminal/test_facility_time_browser.py \
          tests/interfaces/web_terminal/test_panels_collab_browser.py \
