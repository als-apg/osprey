  multi-user-deploy-lifecycle-e2e-podman:
    name: Multi-User Deploy Lifecycle E2E (PRs into main, podman runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Podman counterpart of multi-user-deploy-lifecycle-e2e above — same job,
    # same real-runtime lifecycle mechanics, run against rootless podman
    # instead of docker (tests/e2e/test_deploy_lifecycle.py picks its runtime
    # from OSPREY_E2E_RUNTIME). Scoped identically: same-repo PRs into main
    # (per-phase PRs inside an epic target epic/* and skip it).
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.11

    - name: Set up rootless Podman
      run: |
        podman --version
        pip install --user podman-compose
        podman compose version
        # Docker auto-treats localhost registries as insecure (plain HTTP);
        # rootless podman defaults to tls-verify=true, so the test's throwaway
        # stub registry on localhost:19081 (HTTP) breaks both `podman push` and
        # the deploy's `podman compose pull`. A registries.conf.d drop-in (merged,
        # not clobbering the default docker.io search registry) marks that one
        # host insecure — giving podman docker's built-in localhost behavior.
        mkdir -p ~/.config/containers/registries.conf.d
        cat > ~/.config/containers/registries.conf.d/localhost-insecure.conf <<'EOF'
        [[registry]]
        location = "localhost:19081"
        insecure = true
        EOF

    - name: Install osprey
      run: uv sync --extra dev

    - name: Run multi-user deploy lifecycle E2E (podman)
      timeout-minutes: 55
      env:
        OSPREY_E2E_RUNTIME: podman
        # Explicit belt-and-suspenders alongside the test's own RUNTIME ->
        # CONTAINER_RUNTIME coupling (see _run_osprey): makes the deploy-side
        # runtime selection self-documenting here too, not just inferred.
        CONTAINER_RUNTIME: podman
      run: |
        # `podman compose` delegates to the docker-compose CLI plugin present on
        # the runner, which speaks the Docker API over the rootless podman socket
        # (unix://$XDG_RUNTIME_DIR/podman/podman.sock). That API service isn't
        # running by default — `podman push`/`build` are direct CLI calls that
        # need no socket, but the compose `pull`/`up` the deploy runs do. Start
        # it for the duration of this step (must be here, not the setup step:
        # each step is its own process group) and wait until it's listening.
        podman system service --time=0 &
        SOCK="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/podman/podman.sock"
        for _ in $(seq 1 30); do if [ -S "$SOCK" ]; then break; fi; sleep 1; done
        export DOCKER_HOST="unix://$SOCK"
        # `-m 'not qmd'`: same reason as the docker lane above — this lane has
        # no qmd sidecar image, and the shared-bundle/sidecar test refuses to
        # skip on a missing one. It would additionally need the image in
        # PODMAN's store rather than docker's, which is why it is not simply
        # built here.
        uv run pytest tests/e2e/test_deploy_lifecycle.py -m 'not qmd' -v --tb=short

    # Runs BEFORE the teardown below: the cleanup step deletes the very
    # containers whose logs explain the failure. Read-only capture; the
    # artifact is `ci-diag-<lane>` on the run's summary page.
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: multi-user-deploy-lifecycle-e2e-podman
        engine: podman

    # Belt-and-suspenders on top of the test's own try/finally teardown: every
    # resource named here is exact (never a prune/-a/wildcard), matching
    # tests/e2e/test_deploy_lifecycle.py's own container-ops safety guardrail.
    - name: Clean up any stranded lifecycle-e2e resources
      if: always()
      run: |
        for user in alice bob carol dave erin; do
          podman rm -f "e2e-web-${user}" || true
          podman volume rm "osprey-e2e-mus-p3_${user}-claude-config" || true
          podman volume rm "osprey-e2e-mus-p3_${user}-agent-data" || true
        done
        podman rm -f e2e-nginx || true
        podman rm -f osprey-e2e-mus-p3-registry || true
        podman compose -p osprey-e2e-mus-p3 down || true

  two-shape-boot-e2e:
    name: Two-Shape Boot E2E (bridge + host network axis, podman-compose)
    runs-on: ubuntu-latest
    # Headroom, not an estimate. The module rebuilds the full project image
    # (Node + the Claude Code CLI) cold on every run — it `rmi -f`s its own
    # images at teardown, so there is no warm-cache assumption to make — then
    # boots twice and waits on healthchecks each time, against timeouts tuned
    # on a warm macOS cache. The number is set so a slow run reports the
    # module's OWN failure rather than being cut off mid-diagnosis here.
    timeout-minutes: 75
    # Secret-free: the module boots a dispatcher/worker pair and reads its
    # answers off the runtime (published ports, /proc/net/tcp, container env),
    # never off a model.
    #
    # The base-ref clause differs from multi-user-deploy-lifecycle-e2e-podman
    # above ON PURPOSE. This lane certifies the network axis and the
    # podman-compose provider, both of which are built on epic phase branches
    # whose PRs target an `epic/*` integration base. Scoped to main alone it
    # would skip on every PR that changes what it covers and only ever run once
    # the work was already merged into the epic.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && (github.event.pull_request.base.ref == 'main'
      || startsWith(github.event.pull_request.base.ref, 'epic/'))

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.11

    - name: Install osprey
      run: uv sync --extra dev

    - name: Pin podman-compose 1.0.6 as podman's compose provider
      # This lane exists to certify OSPREY against podman-compose specifically:
      # a different argv (no --project-directory), a single root-merged
      # compose document, and one merged --env-file. `podman compose` on a
      # GitHub runner would otherwise delegate to the docker-compose CLI
      # plugin, which is the provider the docker lanes already cover — the lane
      # would pass while testing the shape it was written to leave behind.
      # The absolute path in containers.conf is what makes the choice
      # independent of PATH ordering; `podman ps` pays the rootless storage-init
      # cost before anything times a podman call.
      run: |
        pip install --user podman-compose==1.0.6
        PODMAN_COMPOSE_BIN="$(command -v podman-compose || true)"
        if [ -z "$PODMAN_COMPOSE_BIN" ]; then
          echo "❌ podman-compose is not on PATH after install"
          exit 1
        fi
        mkdir -p ~/.config/containers
        cat > ~/.config/containers/containers.conf <<EOF
        [engine]
        compose_providers = ["$PODMAN_COMPOSE_BIN"]
        EOF
        # Second, independent expression of the same choice — see the identical
        # line in static-checks. The file is authoritative for podman's config
        # chain; a USER-level containers.conf.d drop-in would outrank it, and
        # this env var sidesteps the chain entirely. Written to $GITHUB_ENV so
        # it reaches EVERY later step in this job — step 0 and the boot alike,
        # which is what keeps them in one environment.
        echo "PODMAN_COMPOSE_PROVIDER=$PODMAN_COMPOSE_BIN" >> "$GITHUB_ENV"
        podman --version
        podman ps >/dev/null

    - name: Step 0 — assert the compose provider is podman-compose 1.0.6
      env:
        CONTAINER_RUNTIME: podman
      # The lane's own falsifiability check, and it runs BEFORE the ~20-minute
      # boot rather than after it. It asks the same question the deploy asks —
      # OSPREY's `detect_compose_provider`, against the same
      # `get_runtime_command` argv — so agreeing here means the boot below
      # cannot be running a provider this lane never named. Printing the raw
      # banner alongside is what makes the claim auditable from the log instead
      # of taken on the assertion's word.
      run: |
        podman compose version
        uv run python - <<'PY'
        from osprey.deployment.runtime_helper import (
            ComposeProvider,
            detect_compose_provider,
            get_runtime_command,
        )

        runtime_cmd = get_runtime_command()
        info = detect_compose_provider(runtime_cmd)
        print("runtime command:", " ".join(runtime_cmd))
        print("provider banner:", info.banner)
        assert info.provider is ComposeProvider.PODMAN_COMPOSE, (
            f"this lane must run podman-compose; probed {info.provider} instead"
        )
        assert info.version == (1, 0, 6), (
            f"this lane pins podman-compose 1.0.6; probed {info.version_text}"
        )
        print("✅ compose provider is podman-compose 1.0.6")
        PY

    - name: Pre-flight — ports 21781 and 21791 must be free on the runner
      # Under the host shape these are REAL binds on the runner, not
      # publications into a VM as they were on the author's macOS host. If
      # anything else already holds either port the module's exposure test
      # reads a foreign socket out of the runner's own /proc/net/tcp and fails
      # in a way that points at the feature rather than at the runner. Refusing
      # here costs a second and names the actual cause.
      #
      # Fails open if `ss` is missing: an absent tool is not evidence of a busy
      # port, and the module's own preflight would still refuse below.
      run: |
        for port in 21781 21791; do
          if ss -ltnH "sport = :$port" 2>/dev/null | grep -q .; then
            echo "❌ port $port is already bound on this runner:"
            ss -ltnp "sport = :$port" || true
            exit 1
          fi
        done
        echo "✅ 21781 and 21791 are free"

    - name: Diagnostic — podman's inspect .State schema (health-field spelling)
      # INFORMATIONAL, not protective. The module reads the health field
      # schema-driven — it accepts either `.State.Health.Status` or
      # `.State.Healthcheck.Status` and refuses in seconds naming both if
      # neither exists — so a spelling mismatch can no longer stall the lane.
      # What it still cannot tell a human is WHICH spelling this podman uses,
      # and no lane in this repo has ever read a health field under podman at
      # all. That fact is worth one throwaway container.
      #
      # Placement before the boot is load-bearing for a duller reason than the
      # rationale it replaced: a step AFTER a failing step does not run at all
      # without its own `if:`, so a diagnostic parked below the boot would be
      # missing from exactly the runs that need it.
      #
      # Diagnostic means it must never red the lane: every call is guarded and
      # the step ends in an explicit `exit 0`, so a registry hiccup pulling
      # busybox costs nothing. The throwaway is exact-named and removed
      # immediately; the healthcheck flags are what make the field appear.
      run: |
        PROBE=osprey-e2e-two-shape-schema-probe
        report_field() {
          # A Go template naming a field the runtime does not have is an ERROR,
          # not an empty render — which is what makes rc the answer here.
          if podman inspect --type container -f "{{json $1}}" "$PROBE" >/dev/null 2>&1; then
            echo "schema: podman DOES expose $1"
          else
            echo "schema: podman does NOT expose $1"
          fi
        }
        podman rm -f "$PROBE" >/dev/null 2>&1 || true
        if podman run -d --name "$PROBE" \
             --health-cmd true --health-interval 2s --health-retries 2 \
             docker.io/library/busybox:1.37 sleep 60 >/dev/null 2>&1; then
          sleep 6
          echo "--- podman inspect .State ---"
          podman inspect --type container -f '{{json .State}}' "$PROBE" 2>/dev/null | head -c 900
          echo
          report_field .State.Health
          report_field .State.Healthcheck
          podman rm -f "$PROBE" >/dev/null 2>&1 || true
        else
          echo "(schema probe unavailable — the throwaway container did not start)"
        fi
        exit 0

    - name: Run two-shape boot E2E (podman)
      # Below the job cap, so a hang fails THIS step and the capture below still
      # runs — a job-cap kill is a hard cancel that tears the containers down
      # with their logs unread.
      timeout-minutes: 70
      env:
        # The module's own runtime switch — it drives every podman CLI call it
        # makes off this variable and fails at collection on any other value.
        OSPREY_E2E_RUNTIME: podman
        # The deploy side of the same choice: `osprey up` resolves its runtime
        # through CONTAINER_RUNTIME, and pinning it to podman means a missing
        # podman is a loud failure rather than a silent fall-through to the
        # runner's live docker daemon.
        CONTAINER_RUNTIME: podman
      # NO `podman system service` / `DOCKER_HOST` export here, deliberately.
      # The neighbouring multi-user-deploy-lifecycle-e2e-podman lane needs both
      # because `podman compose` resolves to the docker-compose CLI plugin
      # there, and the plugin speaks the Docker API over that socket. This lane
      # forces podman-compose, which drives the `podman` CLI directly and reads
      # no socket — so exporting DOCKER_HOST would buy nothing and cost the one
      # thing that matters: it would be the only environment difference between
      # the step that PROVES the provider and the step that USES it. A future
      # provider that did consult DOCKER_HOST would then reintroduce exactly the
      # delegation this lane exists to prevent, with step 0 still green because
      # step 0 never sees that variable. Do not copy it in from the neighbour.
      run: |
        uv run pytest tests/e2e/test_two_shape_boot.py -v --tb=short

    # Before the cleanup below, deliberately: teardown removes the containers,
    # and with them the logs that say why the boot failed.
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: two-shape-boot-e2e
        engine: podman

    # Belt-and-suspenders on top of the module's own try/finally teardown.
    # Every name here is exact — never a prune, an -a/--all, or a wildcard —
    # matching the container-ops guardrail the module documents. The host shape
    # binds real host ports, so a stranded container from a killed run would
    # break the next one rather than merely waste space.
    - name: Clean up any stranded two-shape resources
      if: always()
      run: |
        podman rm -f osprey-e2e-two-shape-event-dispatcher || true
        podman rm -f osprey-e2e-two-shape-dispatch-worker-1 || true
        podman rm -f osprey-e2e-two-shape-schema-probe || true
        podman volume rm osprey-e2e-two-shape_dispatch_workspace_1 || true
        podman network rm osprey-e2e-two-shape_osprey-network || true
        podman rmi -f osprey-e2e-two-shape:local || true
        podman rmi -f osprey-e2e-two-shape-dispatch:local || true


  qmd-sidecar-e2e:
    name: qmd Sidecar E2E (image build + live daemon over a fixture corpus)
    runs-on: ubuntu-latest
    # Same-repo PRs only — house policy for any extra Docker-build-and-deploy
    # job. This one needs no secrets: the sidecar is a local container serving
    # a fixture corpus, and no LLM is called anywhere in the module.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    # Cold-cache shape: 2.1 GB of GGUF models fetched during the build, plus
    # qmd's fail-closed startup pass, which will not serve until it has
    # embedded the corpus. Warm-cache runs skip the fetch entirely (see the
    # cache step). Deliberately generous — this lane has never run in GHA, so
    # there are no observed green timings to tighten against yet.
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.11

    - name: Install osprey
      run: uv sync --extra dev

    # Needed by the multi-user shared-bundle step below, which drives a real
    # `osprey up` (and therefore `docker compose`). Same step the two
    # multi-user lifecycle lanes use, for the same reason.
    - name: Set up Docker Compose
      uses: docker/setup-compose-action@v2

    - name: Assert a container runtime is present
      # The module skips itself when docker is unavailable, which is right for
      # a developer laptop and wrong here: pytest exits 0 on an all-skipped
      # run, so a runner without docker would turn this lane green having
      # tested nothing. Failing here instead makes that state loud, and fails
      # it before the multi-GB build rather than after.
      #
      # The absent-module case needs no guard — pytest exits 4 on a path that
      # does not exist, which already reds the step.
      run: |
        set -euo pipefail
        docker info > /dev/null

    - name: Set up Docker Buildx
      # Needed only for `type=local` layer caching; the plain docker builder
      # every other lane uses cannot import or export one.
      uses: docker/setup-buildx-action@v3

    - name: Derive the model-pin cache key
      id: pins
      # The three GGUFs are fetched INSIDE the image build, so what is cached
      # is the buildx layer cache rather than the files themselves. Keying it
      # on the SHA256 pins is what makes "fetch once per pin bump" true: bump a
      # pin and the RUN text changes, its layer misses, and the new key starts
      # a fresh entry instead of restoring one that could never hit.
      #
      # `pipefail` is set explicitly. GitHub Actions' default shell does not
      # set it, so a pipeline reports the LAST command's status: a `grep` that
      # matched nothing would be masked by a succeeding `sha256sum` and key the
      # cache on the digest of the empty string — one shared key for every set
      # of pins, which is worse than having no cache at all. The `-eq 3` check
      # is the second half of that guard: it fails loudly if the label block is
      # ever renamed, rather than silently keying on a partial match.
      run: |
        set -euo pipefail
        dockerfile=src/osprey/templates/services/qmd/Dockerfile
        pins="$(grep -oE 'com\.osprey\.qmd\.[a-z]+_sha256="[0-9a-f]{64}"' "$dockerfile" | sort)"
        printf '%s\n' "$pins"
        test "$(printf '%s\n' "$pins" | wc -l)" -eq 3
        echo "digest=$(printf '%s' "$pins" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

    - name: Cache the sidecar image layers (keyed on the model SHA256 pins)
      uses: actions/cache@v6
      with:
        path: /tmp/qmd-buildx-cache
        key: qmd-buildx-${{ runner.os }}-${{ steps.pins.outputs.digest }}-${{ hashFiles('src/osprey/templates/services/qmd/Dockerfile', 'src/osprey/templates/services/qmd/entrypoint.sh') }}
        # Pins unchanged but the Dockerfile or entrypoint edited: restore the
        # previous entry anyway. buildx revalidates every layer against the
        # current instructions, so at worst the model layers miss and refetch —
        # a stale model can never be served as a fresh one.
        restore-keys: |
          qmd-buildx-${{ runner.os }}-${{ steps.pins.outputs.digest }}-

    - name: Build the sidecar image
      # The template directory IS the build context: Dockerfile and
      # entrypoint.sh are siblings there and carry no Jinja, so what builds
      # here is byte-identical to what a rendered deployment builds.
      run: |
        set -euo pipefail
        docker buildx build \
          --tag osprey-qmd:ci \
          --load \
          --cache-from type=local,src=/tmp/qmd-buildx-cache \
          --cache-to type=local,dest=/tmp/qmd-buildx-cache-new,mode=max \
          src/osprey/templates/services/qmd

    - name: Rotate the layer cache
      # buildx cannot safely export to the directory it imported from in the
      # same build, so the export goes to a sibling and is swapped in here.
      # Without the swap the cache would grow every run until it evicted
      # itself.
      run: |
        set -euo pipefail
        rm -rf /tmp/qmd-buildx-cache
        mv /tmp/qmd-buildx-cache-new /tmp/qmd-buildx-cache

    - name: Run qmd sidecar E2E
      # Step cap under the job cap so a wedged query fails THIS step, leaving
      # the capture step below room to run. A job-level timeout is a hard
      # cancel that takes the container logs with it.
      timeout-minutes: 45
      env:
        # The module starts the sidecar from this tag instead of building its
        # own image, so what the tests exercise is the cached build above.
        # Same variable a rendered compose file overrides `image:` with.
        OSPREY_QMD_IMAGE: osprey-qmd:ci
      # Selected by marker + keyword rather than by naming one module: the
      # sidecar-container coverage is split across an OKF module and an ARIEL
      # one, and a lane that named a single file would silently stop covering
      # the other the day it moved. `-m dockerbuild` is what keeps the
      # non-container integration modules (preset-static, build-boot) out.
      run: uv run pytest tests/integration/ -m dockerbuild -k qmd -v --tb=short

    - name: Run the multi-user shared-bundle sidecar E2E
      # The `qmd`-marked half of tests/e2e/test_deploy_lifecycle.py, which the
      # two multi-user lifecycle lanes deselect: it drives a real `osprey up`
      # with the sidecar co-deployed alongside the web tier, and so needs the
      # image this lane just built. Selected by marker, not by test name, so a
      # rename cannot silently drop it — and `-m qmd` deselects the four
      # lifecycle tests those lanes already own, keeping them from running
      # twice.
      timeout-minutes: 20
      env:
        OSPREY_QMD_IMAGE: osprey-qmd:ci
      run: uv run pytest tests/e2e/test_deploy_lifecycle.py -m qmd -v --tb=short

    - name: Build the sidecar image with the model fetches skipped
      # The image an air-gapped build host produces: same Dockerfile, same
      # digest pins, but `services.qmd.models_dir` set means the three GGUFs
      # arrive at runtime over a read-only bind mount instead of being baked in.
      # It is the only image the mounted-delivery path can be tested against —
      # a baked image already has the models, so it can never exercise the
      # check — and it is cheap for exactly the reason the path exists: the
      # 2.1 GB of downloads is what the build arg skips.
      #
      # `cache-from` only. Exporting a second cache here would race the rotated
      # entry above and evict the model layers, which are the expensive half.
      run: |
        set -euo pipefail
        docker buildx build \
          --build-arg OSPREY_QMD_MODELS_MOUNTED=1 \
          --tag osprey-qmd:ci-mounted \
          --load \
          --cache-from type=local,src=/tmp/qmd-buildx-cache \
          src/osprey/templates/services/qmd

    - name: Run the mounted-models E2E
      # Named by path, not by marker: this module is the whole subject, and a
      # path that stops existing exits pytest 4 and reds the step, whereas a
      # renamed marker would silently select nothing. The module is collected by
      # the sidecar step above too, where it skips — the variable below is what
      # says the skip-ARG image exists, and it is set on this step alone.
      timeout-minutes: 10
      env:
        OSPREY_QMD_MOUNTED_IMAGE: osprey-qmd:ci-mounted
      run: uv run pytest tests/integration/test_qmd_models_mount.py -v --tb=short

    # On failure only: container logs, exit codes, `OOMKilled`, and runner
    # disk/memory state, uploaded as the `ci-diag-<lane>` artifact.
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: qmd-sidecar-e2e
        engine: docker

    # Belt-and-suspenders on top of the test's own try/finally teardown, and
    # BEFORE the image cleanup below (a surviving container pins its image).
    # Every resource named here is exact — never a prune/-a/wildcard — matching
    # tests/e2e/test_deploy_lifecycle.py's own container-ops safety guardrail.
    - name: Clean up any stranded shared-bundle e2e resources
      if: always()
      run: |
        docker rm -f osprey-e2e-mus-p3-qmd || true
        for user in alice bob; do
          docker rm -f "e2e-web-${user}" || true
          docker volume rm "osprey-e2e-mus-p3_${user}-claude-config" || true
          docker volume rm "osprey-e2e-mus-p3_${user}-agent-data" || true
        done
        docker rm -f e2e-nginx || true
        docker rm -f osprey-e2e-mus-p3-registry || true
        docker compose -p osprey-e2e-mus-p3 down || true

    - name: Clean up the sidecar images
      # Exact tags only — never a prune, an -a/--all, or a wildcard, matching
      # the container-ops guardrail every other lane here observes.
      if: always()
      run: |
        docker rmi -f osprey-qmd:ci || true
        docker rmi -f osprey-qmd:ci-mounted || true

  all-checks-passed:
    name: All CI Checks Passed
    needs: [test, dependency-floor, lint, docs, package, static-checks, config-key-guard, visual-theming, frontend-js, build-boot-smoke, e2e-tests, deploy-e2e, dispatch-deploy-e2e, dispatch-overlay-e2e, bluesky-deploy-e2e, bluesky-web-deploy-e2e, va-substrate-equivalence-e2e, orm-roundtrip-e2e, bluesky-queue-e2e, scan-agentic-e2e, archiver-world-e2e, tiled-roundtrip-e2e, bluesky-catalog-e2e, bluesky-sandbox-escape-e2e, nextcloud-talk-bridge-e2e, gchat-bridge-e2e, dockerfile-e2e, execution-environment-parity-e2e, agentic-per-preset, deploy-writeback-e2e, multi-user-deploy-lifecycle-e2e, multi-user-deploy-lifecycle-e2e-podman, lean-wheel, two-shape-boot-e2e, qmd-sidecar-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: always()

    steps:
    - name: Check all jobs status
      # Two shapes, both BLOCKING — no advisory tier (house rule: full green,
      # a red e2e lane must never hide inside a green check):
      #
      #   * Always-on jobs (test, lint, ...): anything but "success" fails
      #     the gate, including "skipped".
      #   * Conditionally-run jobs (every e2e/deploy lane; `if:` limits them
      #     to same-repo PRs, and the lifecycle pair to PRs based on main):
      #     "skipped" is a legitimate result on push/schedule/fork-PR/epic
      #     -phase runs and passes the gate; any OTHER non-success result
      #     (failure, cancelled) fails it. Corollary: on fork PRs the secret
      #     -gated lanes don't run at all — the gate can't vouch for them
      #     there, same as before.
      #
      # Dependabot PRs are a third case that looks like the second: the lanes
      # skip legitimately (no secrets are issued to them), so the gate passes —
      # but it says so explicitly in the run summary rather than letting a
      # green check imply coverage it does not have.
      #
      # `github.actor` and `github.head_ref` are routed through `env:` and used
      # only as quoted shell variables — never interpolated into `run:`, where a
      # crafted branch name would be a script-injection vector.
      env:
        ACTOR: ${{ github.actor }}
        HEAD_BRANCH: ${{ github.head_ref }}
      run: |
        if [[ "${{ needs.test.result }}" != "success" ]]; then
          echo "❌ Tests failed"
          exit 1
        fi
        if [[ "${{ needs.dependency-floor.result }}" != "success" ]]; then
          echo "❌ Archiver suite failed at the declared dependency floor"
          exit 1
        fi
        if [[ "${{ needs.lint.result }}" != "success" ]]; then
          echo "❌ Lint checks failed"
          exit 1
        fi
        if [[ "${{ needs.docs.result }}" != "success" ]]; then
          echo "❌ Documentation build failed"
          exit 1
        fi
        if [[ "${{ needs.package.result }}" != "success" ]]; then
          echo "❌ Package build failed"
          exit 1
        fi
        if [[ "${{ needs.static-checks.result }}" != "success" ]]; then
          echo "❌ Tier 0 static checks failed"
          exit 1
        fi
        if [[ "${{ needs.config-key-guard.result }}" != "success" ]]; then
          echo "❌ Config-key resurrection guard failed"
          exit 1
        fi
        if [[ "${{ needs.visual-theming.result }}" != "success" ]]; then
          echo "❌ Behavioral/visual theming suite failed"
          exit 1
        fi
        if [[ "${{ needs.frontend-js.result }}" != "success" ]]; then
          echo "❌ Frontend JS (typecheck + vitest) failed"
          exit 1
        fi
        if [[ "${{ needs.build-boot-smoke.result }}" != "success" ]]; then
          echo "❌ Tier 1 build + boot smoke failed"
          exit 1
        fi
        if [[ "${{ needs.lean-wheel.result }}" != "success" ]]; then
          echo "❌ Lean connectors wheel check failed"
          exit 1
        fi
        check_pr_lane() {
          # $1 = human-readable lane name, $2 = needs.<job>.result
          if [[ "$2" == "skipped" ]]; then
            echo "⏭️  $1 skipped (lane's if: condition not met on this event)"
          elif [[ "$2" != "success" ]]; then
            echo "❌ $1 failed (result: $2)"
            exit 1
          else
            echo "✅ $1 passed"
          fi
        }
        check_pr_lane "Agentic per-preset"           "${{ needs.agentic-per-preset.result }}"
        check_pr_lane "E2E tests"                    "${{ needs.e2e-tests.result }}"
        check_pr_lane "Deploy E2E"                   "${{ needs.deploy-e2e.result }}"
        check_pr_lane "Dispatch deploy E2E"          "${{ needs.dispatch-deploy-e2e.result }}"
        check_pr_lane "Dispatch overlay E2E"         "${{ needs.dispatch-overlay-e2e.result }}"
        check_pr_lane "Bluesky deploy E2E"           "${{ needs.bluesky-deploy-e2e.result }}"
        check_pr_lane "Bluesky web deploy E2E"    "${{ needs.bluesky-web-deploy-e2e.result }}"
        check_pr_lane "VA substrate equivalence E2E" "${{ needs.va-substrate-equivalence-e2e.result }}"
        check_pr_lane "ORM + Grid roundtrip E2E"     "${{ needs.orm-roundtrip-e2e.result }}"
        check_pr_lane "Bluesky queue E2E"            "${{ needs.bluesky-queue-e2e.result }}"
        check_pr_lane "Scan stack agentic E2E"       "${{ needs.scan-agentic-e2e.result }}"
        check_pr_lane "Archiver world E2E"           "${{ needs.archiver-world-e2e.result }}"
        check_pr_lane "Tiled roundtrip E2E"          "${{ needs.tiled-roundtrip-e2e.result }}"
        check_pr_lane "Bluesky catalog E2E"          "${{ needs.bluesky-catalog-e2e.result }}"
        check_pr_lane "Bluesky sandbox escape E2E"   "${{ needs.bluesky-sandbox-escape-e2e.result }}"
        check_pr_lane "Nextcloud Talk bridge E2E"    "${{ needs.nextcloud-talk-bridge-e2e.result }}"
        check_pr_lane "Google Chat bridge E2E"       "${{ needs.gchat-bridge-e2e.result }}"
        check_pr_lane "Dockerfile E2E"               "${{ needs.dockerfile-e2e.result }}"
        check_pr_lane "Execution env parity E2E"     "${{ needs.execution-environment-parity-e2e.result }}"
        check_pr_lane "Deploy write-back E2E"         "${{ needs.deploy-writeback-e2e.result }}"
        check_pr_lane "Multi-user lifecycle E2E (docker)" "${{ needs.multi-user-deploy-lifecycle-e2e.result }}"
        check_pr_lane "Multi-user lifecycle E2E (podman)" "${{ needs.multi-user-deploy-lifecycle-e2e-podman.result }}"
        check_pr_lane "Two-shape boot E2E (podman-compose)" "${{ needs.two-shape-boot-e2e.result }}"
        check_pr_lane "qmd sidecar E2E"              "${{ needs.qmd-sidecar-e2e.result }}"
        echo "✅ All CI checks passed!"

        # A green gate on a Dependabot PR is green-with-a-gap, and the gap is
        # invisible unless it is named. Dependabot runs get no Actions secrets,
        # so every API-key lane skipped above rather than ran. Say so where a
        # reviewer will actually see it — the run summary, not buried in a log.
        # `-n "$GITHUB_STEP_SUMMARY"` is not defensive noise: `run:` executes
        # under `bash -e`, so an unset summary path would make `>> ""` fail and
        # take the whole gate down with it. This block is advisory — it must
        # never be able to turn a passing gate red.
        if [ "$ACTOR" = "dependabot[bot]" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          {
            echo "### ⚠️ Secret-dependent lanes did not run"
            echo
            echo "Dependabot pull requests are treated as fork runs and receive only the"
            echo "Dependabot secret store, so \`ALS_APG_API_KEY\` is unavailable and these"
            echo "lanes skipped rather than executed:"
            echo
            echo "- Tier 3 — Agentic flow (both presets)"
            echo "- E2E Tests"
            echo "- Dispatch Deploy E2E / Dispatch Overlay E2E"
            echo "- Nextcloud Talk Bridge E2E / Google Chat Bridge E2E"
            echo "- Scan Stack Agentic E2E"
            echo
            echo "**This gate cannot vouch for them.** After reviewing the dependency diff,"
            echo "revalidate the branch as a maintainer (that run does get the secrets):"
            echo
            echo '```'
            echo "gh workflow run ci.yml --ref $HEAD_BRANCH -f revalidate_secret_lanes=true"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "⚠️  Secret-dependent lanes skipped (Dependabot run) — see run summary."
        fi
