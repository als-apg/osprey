  orm-roundtrip-e2e:
    name: ORM + Grid Scan Roundtrip E2E (VA + bluesky bridge + Tiled, full Docker stack)
    runs-on: ubuntu-latest
    # Same-repo only, no secrets. Four modules as SEQUENTIAL steps: two bind CA
    # port 5064, and more than one full VA/bridge/Tiled stack at once is more
    # than a runner has.
    needs: changes
    if: *same-repo-pr-or-secret-revalidation
    # Bounds the realistic run (later modules reuse the first's images), not the
    # ~82+ min sum of every module's internal caps, so the suite's own named
    # timeouts report a genuine hang.
    timeout-minutes: 100

    steps:
    - *free-runner-disk

    # Docker 29's containerd image store unpacks shared layers per image: the
    # fourth stack hit ENOSPC on a 37 GB disk, overlay2 peaked at 16.7 GiB.
    # A workaround: drop it once the lane builds less per stack.
    - name: Use the overlay2 image store
      run: |
        sudo mkdir -p /etc/docker
        [ -s /etc/docker/daemon.json ] || echo '{}' | sudo tee /etc/docker/daemon.json >/dev/null
        sudo jq '.features["containerd-snapshotter"] = false' /etc/docker/daemon.json \
          | sudo tee /etc/docker/daemon.json.new >/dev/null
        sudo mv /etc/docker/daemon.json.new /etc/docker/daemon.json
        sudo systemctl restart docker
        driver=$(docker info --format '{{.Driver}}')
        echo "storage driver: $driver"
        [ "$driver" = overlay2 ]

    - *checkout-full-history

    - *install-uv

    - *python-3-11

    - *setup-compose

    - *install-osprey

    # Step caps sized from each module's internal timeouts.
    - name: Run ORM roundtrip E2E
      timeout-minutes: 45
      run: |
        uv run pytest tests/e2e/test_orm_roundtrip.py -v --tb=short

    - name: Run grid scan roundtrip E2E
      timeout-minutes: 40
      run: |
        uv run pytest tests/e2e/test_grid_scan_roundtrip.py -v --tb=short

    - name: Run orbit bump sweep roundtrip E2E
      timeout-minutes: 45
      run: |
        uv run pytest tests/e2e/test_bump_roundtrip.py -v --tb=short

    - name: Run preflight probe E2E
      timeout-minutes: 45
      run: |
        uv run pytest tests/e2e/test_preflight_probe.py -v --tb=short
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: orm-roundtrip-e2e
        engine: docker
    # Belt and suspenders: see e2e-tests.
    - name: Clean up any stranded stack resources
      if: always()
      run: |
        docker compose -p orm-roundtrip down || true
        docker rm -f orm-roundtrip-agent-record || true
        docker rm -f orm-roundtrip-agent-record-clickhouse || true
        docker volume ls -q --filter "name=^orm-roundtrip_" \
          | xargs -r docker volume rm -f || true
        docker compose -p grid-scan-roundtrip down || true
        docker rm -f grid-scan-roundtrip-agent-record || true
        docker rm -f grid-scan-roundtrip-agent-record-clickhouse || true
        docker volume ls -q --filter "name=^grid-scan-roundtrip_" \
          | xargs -r docker volume rm -f || true
        docker compose -p bump-roundtrip down || true
        docker rm -f bump-roundtrip-agent-record || true
        docker rm -f bump-roundtrip-agent-record-clickhouse || true
        docker volume ls -q --filter "name=^bump-roundtrip_" \
          | xargs -r docker volume rm -f || true
        docker compose -p preflight-probe down || true
        docker rm -f preflight-probe-agent-record || true
        docker rm -f preflight-probe-agent-record-clickhouse || true
        docker volume ls -q --filter "name=^preflight-probe_" \
          | xargs -r docker volume rm -f || true

  bluesky-queue-e2e:
    name: Bluesky Queue E2E (queueserver + Redis + Tiled + VA, full Docker stack)
    runs-on: ubuntu-latest
    # Same-repo only, no secrets.
    needs: changes
    if: *same-repo-pr-or-secret-revalidation
