  scan-agentic-e2e:
    name: Scan Stack Agentic E2E (agent-driven ORM + grid scans on the deployed queue stack)
    runs-on: ubuntu-latest
    # Only run on PRs from same repo (secrets unavailable on forks). Both live
    # tests drive a real agent against the deployed stack, so this lane needs
    # ALS_APG_API_KEY — the same gating as dispatch-overlay-e2e.
    # Secret-dependent lane: skips on Dependabot PRs, which get no Actions
    # secrets. Revalidate with the `revalidate_secret_lanes` dispatch input.
    if: >-
      (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.actor != 'dependabot[bot]')
      || (github.event_name == 'workflow_dispatch' && inputs.revalidate_secret_lanes)
    # One pytest invocation covers the whole module: the offline floor/judge
    # checks plus the two live agent runs, which share a single module-scoped
    # deploy of the VA/bridge/queue stack.
    #
    # Sized from the fixture's own named caps, not from a wall-clock
    # observation. Before a single test body runs, the module-scoped deploy can
    # spend 360s force-removing its three images (3 x 120s, bounded and
    # non-fatal) + BUILD_TIMEOUT_SEC 300 + DEPLOY_UP_TIMEOUT_SEC 2400 +
    # HEALTH_TIMEOUT_SEC 300 = 3360s, i.e. 56min, with DOWN_TIMEOUT_SEC 300
    # more in teardown. A 45 cap would therefore be cut short by GHA before the
    # fixture's own TimeoutExpired handling — which prints what was still
    # building and the dead containers' logs — ever got to say why.
    #
    # 75 matches bluesky-queue-e2e, which carries the same 2400s deploy budget,
    # and like that lane it is deliberately NOT the pathological sum: it bounds
    # the realistic run (locally the whole cold cycle, image build included,
    # took ~33min on an Apple Silicon box and ~7.5min warm; GHA builds
    # natively) while leaving a genuine hang to be reported by the suite's
    # named timeouts rather than by a bare GHA cancellation. Tighten once
    # there are observed green timings on a runner.
    timeout-minutes: 75

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Log in to ghcr (openobserve mirror)
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.11

    - name: Set up Docker Compose
      uses: docker/setup-compose-action@v2

    - name: Install osprey
      run: uv sync --extra dev

    - name: Pre-flight LLM endpoint reachability check
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
      run: |
        # Same probe as dispatch-overlay-e2e: fail fast if the proxy is
        # unreachable rather than burning a multi-minute stack build first.
        if [ -z "${ALS_APG_API_KEY:-}" ]; then
          echo "❌ ALS_APG_API_KEY secret is not set on this runner"
          exit 1
        fi
        ALS_APG_PROBE_BASE="${ALS_APG_BASE_URL:-https://llm.gianlucamartino.com}"
        ALS_APG_PROBE_BASE="${ALS_APG_PROBE_BASE%/}"; ALS_APG_PROBE_BASE="${ALS_APG_PROBE_BASE%/v1}"
        HTTP_CODE=$(curl -sS -o /tmp/probe.txt -w "%{http_code}" --max-time 15 \
          -X POST "$ALS_APG_PROBE_BASE/v1/messages" \
          -H "Content-Type: application/json" \
          -H "anthropic-version: 2023-06-01" \
          -H "Authorization: Bearer $ALS_APG_API_KEY" \
          -d '{"model":"claude-haiku-4-5-20251001","max_tokens":4,"messages":[{"role":"user","content":"ping"}]}')
        if [ "$HTTP_CODE" != "200" ]; then
          echo "❌ ALS-APG endpoint probe failed (HTTP $HTTP_CODE)"
          head -c 500 /tmp/probe.txt; echo
          exit 1
        fi
        echo "✅ ALS-APG endpoint reachable (HTTP 200)"

    - name: Put the SDK's bundled Claude CLI on PATH
      # See the identical step in agentic-per-preset. This lane's zero-skip
      # gate below is what first surfaced the missing CLI: pytest passed
      # while both live tests skipped on `claude --version`.
      run: |
        bundled="$(uv run python -c "import claude_agent_sdk, pathlib; print(pathlib.Path(claude_agent_sdk.__file__).parent / '_bundled')")"
        "$bundled/claude" --version
        echo "$bundled" >> "$GITHUB_PATH"

    - name: Run scan stack agentic E2E
      # Step cap under the job cap so a hang fails THIS step, leaving the
      # capture step below room to run. A job-level timeout is a hard cancel
      # that takes the container logs with it.
      timeout-minutes: 70
      env:
        ALS_APG_API_KEY: ${{ secrets.ALS_APG_API_KEY }}
      run: |
        uv run pytest tests/e2e/test_plan_stack_agentic.py -v --tb=short \
          --junitxml=junit-scan-agentic-e2e.xml

    - name: Fail the lane on any skipped test
      run: |
        # Every way this lane can skip is a CI misconfiguration, not a
        # legitimate environment gap: no container runtime, no SDK, no `claude`
        # CLI, no provider key. Each turns the job into a green check over a
        # lane that deployed nothing and measured nothing, and pytest's exit
        # code cannot express the difference.
        #
        # The `claude` CLI case is the live one, not a hypothetical:
        # claude-agent-sdk (0.2.110) bundles its own CLI and installs no
        # `claude` console script, so the module's
        # `is_claude_code_available()` skipif can fire on a runner where the
        # SDK would in fact work — silently reducing this lane to its offline
        # floor/judge checks while both agent runs vanish.
        #
        # Safe alongside the live tests' `flaky(reruns=2)`: pytest-rerunfailures
        # does not record rerun attempts as testcases, so an absorbed sampling
        # flake leaves the skipped count at zero.
        uv run python - <<'PY'
        import sys
        import xml.etree.ElementTree as ET

        report = "junit-scan-agentic-e2e.xml"
        total = skipped = 0
        for suite in ET.parse(report).getroot().iter("testsuite"):
            total += int(suite.get("tests", 0))
            skipped += int(suite.get("skipped", 0))
        print(f"{report}: {total} test(s), {skipped} skipped")
        failed = False
        if total == 0:
            print(f"::error::{report} collected no tests")
            failed = True
        if skipped:
            print(f"::error::{report} reports {skipped} skipped test(s)")
            failed = True
        if failed:
            sys.exit(1)
        print("✅ every scan-stack agentic test ran; none skipped")
        PY
    # On failure only: container logs, exit codes, `OOMKilled`, and runner
    # disk/memory state, uploaded as the `ci-diag-<lane>` artifact.
    - name: Capture failure diagnostics
      if: failure()
      uses: ./.github/actions/capture-ci-diagnostics
      with:
        name: scan-agentic-e2e
        engine: docker


