name: Install the pinned Claude Code CLI
description: >-
  Install the one Claude Code version OSPREY pins globally and put first on
  PATH the directory `scripts/pinned_claude.py` resolves, the same resolver
  every local gate script uses; the step fails with the install command when
  no installed `claude` reports the pin. Every agent run OSPREY starts is
  pointed at an installed `claude` that reports the pinned version and refuses
  to start otherwise; the copy bundled inside the Agent SDK never runs.
  Requires a synced project venv, which the caller sets up.

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Install and verify the pinned version
      shell: bash
      run: |
        set -euo pipefail
        pin="$(uv run python scripts/pinned_claude.py --pin)"
        npm install -g "@anthropic-ai/claude-code@$pin"
        dir="$(uv run python scripts/pinned_claude.py)"
        echo "claude $pin on PATH: $dir"
        echo "$dir" >> "$GITHUB_PATH"
