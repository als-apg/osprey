name: Build the bench IOC image
description: >-
  Build `bench-ioc:latest` from docker/bench-ioc into the calling job's local
  image store, through the registry layer cache the job's environment names
  (OSPREY_BUILD_CACHE_FROM, and OSPREY_BUILD_CACHE_TO where the job writes it).
  Sets up no builder of its own: it builds on the Buildx builder that
  build-virtual-accelerator-image leaves as the job's default, so the caller
  calls that action first. Requires a synced project venv, as that action does.

runs:
  using: composite
  steps:
    - name: Build the bench IOC image
      shell: bash
      # `-f` is load-bearing, not stylistic: BuildKit only auto-detects a file
      # literally named `Dockerfile`, so dropping it fails with "open
      # Dockerfile: no such file or directory" (podman finds `Containerfile`
      # unaided, docker does not). The Containerfile's header says this, and
      # tests/fixtures/bench_ioc.py prints the same build when the image is
      # absent — the fixture never builds implicitly, so this step IS the only
      # thing in CI that produces `bench-ioc:latest`, and that tag is
      # hardcoded there with no environment override.
      #
      # No staging step, unlike the virtual accelerator image: this context is
      # three small text files and the Containerfile, so the directory holding
      # them is already the smallest possible context.
      #
      # The layer cache is the virtual accelerator action's, under the key
      # `bench-ioc`, read and written on the same terms (see that action): a
      # lane reads main's layers, deploy-cache-warmup writes them, and a
      # missing variable or tag is a cold build. Nothing in this image depends
      # on osprey's source, so an unchanged record set hits on every layer.
      run: |
        set -euo pipefail
        flags="$(uv run python -c 'from osprey.deployment.build_cache import build_cache_args; print("\n".join(build_cache_args("docker", "bench-ioc")))')"
        cache_flags=()
        [[ -z "$flags" ]] || mapfile -t cache_flags <<< "$flags"
        echo "Building bench-ioc:latest (layer cache: ${cache_flags[*]:-none})"
        docker buildx build \
          --tag bench-ioc:latest \
          --load \
          "${cache_flags[@]}" \
          -f docker/bench-ioc/Containerfile docker/bench-ioc
