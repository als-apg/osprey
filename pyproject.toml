[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "osprey-framework"
dynamic = ["version"]
description = "An agentic interface to scientific control systems"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Thorsten Hellert", email = "thellert@lbl.gov"},
]
maintainers = [
    {name = "Thorsten Hellert", email = "thellert@lbl.gov"},
]
keywords = [
    "ai", "agents", "framework", "scientific-computing",
    "epics", "accelerator-physics", "als", "berkeley", "agent-framework",
    "control-systems", "mcp", "human-in-the-loop", "container-orchestration"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]

# Core runtime dependencies from requirements.txt analysis
dependencies = [
    # Core framework dependencies
    "rich>=15.0.0",
    "click>=8.4.2",
    "questionary>=2.1.1",
    "python-dotenv>=1.1.0",
    "PyYAML>=6.0.2",
    "ruamel.yaml>=0.18.0",  # Comment-preserving YAML for config updates
    "Jinja2>=3.1.6",
    "requests>=2.34.2",
    # Container runtime (Docker or Podman) must be installed separately via system package managers
    # Framework uses CLI tools (docker/podman commands), not Python packages
    # Install Docker Desktop 4.0+ OR Podman 4.0+:
    #   - Docker: https://docs.docker.com/get-docker/
    #   - Podman: https://podman.io/getting-started/installation
    # Jupyter notebook support
    "nbformat>=5.0.0",
    "nbclient",
    "nbconvert>=7.0.0",
    # JupyterLab and the server it runs on, launched by the notebook sidecar via
    # ServerApp traits and a ContentsManager subclass. Capped below the next major
    # so adopting it is a reviewed change, not a lock-refresh surprise.
    "jupyterlab>=4.6,<5",
    "jupyter-server>=2.21,<3",
    "ipykernel",
    # AI/ML provider integrations
    "litellm>=1.56.0",  # Unified LLM provider interface (100+ providers)
    # Capped below 3.x: the 3.0 major is a client rewrite (new httpx2 stack).
    # Adopting it should be a reviewed change, not something a lock refresh
    # picks up on its own from an open-ended floor.
    "openai>=2.53.0,<3",
    "anthropic",
    "google-generativeai",
    "ollama>=0.6.2",
    # Advanced code generation
    # Claude Code SDK - pinned. Bundles CLI 2.1.228 (verified to work with
    # als-apg routing). >=0.1.46 needed for list_subagents/
    # get_subagent_messages, which the e2e trace collector uses to read sub-agent
    # transcripts (CLI >=2.1.x no longer streams them through query()).
    "claude-agent-sdk==0.2.136",
    # Data processing - required for archiver connectors and data handling
    # Archiver connectors return pandas DataFrames for time-series data
    "pandas>=2.2.3",
    "numpy>=2.2.6",  # Required by pandas
    # archiver_read imports dateutil.parser directly to accept ISO/human start
    # and end times. It resolves today only because pandas happens to depend on
    # it; declare it so a future pandas that drops the dependency cannot break
    # the tool silently.
    "python-dateutil>=2.9.0",
    "matplotlib>=3.11.1",  # Required for Python capability visualization (core use case)
    # The image render worker decodes and re-encodes logbook attachments with
    # Pillow; matplotlib pulls it in only transitively, so declare it here.
    "pillow>=12.3",
    "psutil>=7.2",  # The web terminal reads the process table with it
    # Networking and protocols
    "aiohttp>=3.14.3",  # Required by litellm (ConnectionTimeoutError needs >=3.10)
    "websocket-client>=1.7.0",
    "urllib3>=2.7.0",
    "certifi>=2026.7.22",
    "charset-normalizer>=3.4.9",
    "idna>=3.18",
    "MarkupSafe>=3.0.2",
    "markdown>=3.5",  # Markdown-to-HTML rendering for artifact converters
    "aiofiles>=25.1.0",  # Async file I/O for non-blocking Python executor
    # MCP server development (for building MCP servers)
    "fastmcp>=3.4.4",
    # Scientific computing stack - for Python execution capability
    "scipy>=1.17.1",
    "seaborn",
    "scikit-learn",
    "plotly>=6.9.0",
    "bokeh>=3.9.1",  # Interactive dashboards (data-visualizer agent)
    "playwright>=1.61.0",
    "ipywidgets",  # Interactive widgets for Jupyter notebooks
    # Natural language processing
    "nltk>=3.10.0",
    # ARIEL Web Interface (FastAPI server)
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    # The web-terminal panel proxy's WebSocket leg. Reaches us transitively via
    # uvicorn[standard] and tiled, but the proxy imports it directly and, more
    # to the point, depends on a specific guarantee: `connect().process_redirect`
    # (websockets >= 14) is what lets the handshake refuse to follow a redirect
    # while it is carrying the operator secret. An install resolving an older
    # websockets would still import, still connect, and silently follow that
    # redirect off loopback — so the floor is declared here rather than inherited.
    "websockets>=14",
    # OIDC client + JOSE (token verification) for the multi-user web-terminal
    # auth sidecar. Declared explicitly rather than relied on as fastmcp's
    # transitive dependency — the sidecar imports it directly.
    "authlib>=1.7.2",
    # Signed session cookies for the auth sidecar (login session id + unlocked-user set).
    "itsdangerous>=2.2.0",
    # Form parsing for the auth sidecar's login POST. Starlette requires this for
    # EVERY form body, urlencoded included — not only multipart — so without it a
    # login POST fails at request time rather than at import. Declared explicitly
    # for the same reason as authlib above: it reaches us today only as `mcp`'s
    # transitive dependency, and a sidecar image built from a narrower set would
    # serve a login page whose form can never be submitted.
    "python-multipart>=0.0.18",
    # Utilities
    "unique-namer>=1.6.2",
    # PostgreSQL (required for native logbook_search capability and checkpointing)
    "psycopg[binary,pool]>=3.3.4,<4.0.0",
    "psycopg-pool>=3.3.1,<4.0.0",
    # MongoDB client for the stored archive: the `mongodb_archiver` connector
    # reads it, the deploy-time seeder writes it, and the recorder keeps it
    # current. Core rather than an extra because the shipped `control-assistant`
    # preset deploys that store, and `osprey up` preflights this import before it
    # builds anything -- so an install that lacked it could not run the preset at
    # all. Declared here as well as in osprey-connectors: three framework modules
    # (simulation.apply, deployment.container_lifecycle, services.archiver_recorder)
    # import pymongo directly rather than through a connector.
    "pymongo>=4.17.0",
    # Neo4j driver for the graph store (osprey.services.graphdb). Pure Python,
    # no build step, so it carries none of the platform-wheel concerns that
    # justify keeping other clients optional. Core rather than an extra.
    "neo4j>=5.20",
    # RDF/Turtle parser for the graph-mode channel snapshot: `osprey build` reads
    # the corpus at services.graphdb.ttl_path in the CLI's own process
    # (deployment.channel_snapshot). Pure Python, no build step, so it carries
    # none of the platform-wheel concerns that justify keeping other clients
    # optional. Core rather than an extra.
    "rdflib>=7.0",
    # ARIEL proxy support for HTTP ingestion through SOCKS tunnels
    "aiohttp-socks>=0.8.0",
    # File system monitoring for web terminal
    "watchdog>=6.0.0",
    # Async HTTP client for the web-terminal panel reverse proxy
    "httpx>=0.28.1",
    # Lattice physics (Accelerator Toolbox for lattice dashboard + shared ring).
    # Floor-pinned for the save_mat/load_mat(use='RING'), disable_6d, and
    # get_optics(get_chrom=) surface the shared ALS-U AR ring relies on.
    "accelerator-toolbox[plot]>=0.8.0",
    # LUMEModel physics-backend contract for the VA (osprey.services.virtual_accelerator).
    # Exact-pinned: young/fast-moving API (8 releases between 0.3.2 and 0.5.0) and the
    # adapter code is written against the 0.5.0 contract specifically. Core, not optional —
    # same reasoning as PyAT above.
    "lume-base==0.5.0",
    # pyAT physics backend implementing the LUMEModel contract above
    # (osprey.simulation.engines.pyat_model). Exact-pinned for the same
    # reason as lume-base: a young package whose surface is still settling, and
    # the facility adapter is written against the 0.2.0 contract specifically —
    # the persistent-lattice simulator, the multi-element writable variable a
    # setpoint spanning lattice slices needs, the lattice-level variable kind
    # the energy knob rides on, and the rollback-on-lost-orbit guarantee the
    # VA's write path depends on.
    "lume-pyat==0.2.0",
    # Bluesky scan stack (osprey.services.bluesky_bridge): RunEngine, ophyd-async
    # devices, and the Tiled writer/reader. Core, not optional — Bluesky is a
    # core part of OSPREY, joining PyAT above. ophyd-async's [ca] brings
    # the aioca Channel Access backend the EPICS substrate devices need.
    "bluesky>=1.16.0",
    "ophyd-async[ca]>=0.16,<1.0",
    "tiled[client]>=0.2.14",
    # Bluesky's own client view of a Tiled catalog: `BlueskyRun` /
    # `BlueskyEventStream`, which know how a run's documents are laid out in the
    # catalog so the bridge's read path does not have to. Exact-pinned, like the
    # queue-server client below and for the same reason: it is a compatibility
    # pairing, not a floor. 2.0.9 requires `tiled[client]>=0.2.12`, which the
    # floor above satisfies, and it is the pairing the bridge's Tiled read path
    # is exercised against.
    "bluesky-tiled-plugins==2.0.9",
    # Queue-server client the bridge's `QueueBackend` speaks to the RE manager
    # with. Exact-pinned (not floor-pinned like the rest of the stack): the
    # 0.0.x API still moves between patch releases, and the adapter is the only
    # thing standing between that surface and every queue route. Bumps go
    # through dependabot so the adapter's contract tests gate them.
    "bluesky-queueserver-api==0.0.13",
    "duckdb>=1.5.4",
    # agent-record decodes OTLP logs itself (http/protobuf and http/json). The
    # range is the 1.x line of the locked opentelemetry-api/sdk, so the proto
    # messages and the SDK stay one release.
    "opentelemetry-proto>=1.44.0,<2",
    "tenacity>=9.1.4",
    # Cross-version TypedDict/NotRequired — pydantic v2.12 rejects typing.TypedDict on py<3.12.
    "typing_extensions>=4.16.0",
    # The facility file validates through a pydantic model generated from its
    # LinkML schema (src/osprey/facility/schema/_generated/core.py).
    "pydantic>=2.11,<3",
    # `osprey up --dev` builds a wheel from the local checkout. A shipped
    # CLI flag must not depend on an optional extra: an editable install without
    # `--extra dev` would otherwise satisfy every other --dev precondition and
    # fail only at wheel-build time.
    "build",
    # The connectors package has its own calendar stream, on its own
    # osprey-connectors-v* tags (see its pyproject.toml), and stays
    # backward-compatible with every supported framework release, so this is a
    # floor and never a pin. 2026.6.2 is a placeholder left from the shared
    # stream, not a connectors release: PyPI carries 0.1.0 and 2026.9.0b1–b3,
    # so today the floor resolves to 2026.9.0b3. It is raised to the first
    # independent stable connectors release (planned 2026.10.0) at the
    # cut-over, before the first stable framework release under the split,
    # and stays unchanged until that release exists. A same-checkout build
    # describes from the newest connectors tag, which satisfies it.
    #
    # The floor admits no pre-release by itself. Every install OSPREY drives
    # from a pre-release pin admits them for the whole resolve (`--pre` for
    # pip, `--prerelease allow` for uv; see osprey.version.pins_prerelease),
    # which lets it take the newest connectors pre-release. Where no stable
    # release satisfies the floor, pip *and* uv under its default policy
    # (`if-necessary`) silently take a pre-release — which is why the floor
    # names only a stable connectors release already on PyPI.
    "osprey-connectors>=2026.6.2",
    # pyAML control-system backend over the connector; versions with this repo's
    # own calendar stream (same v-tags, same describe), so the floor is the last
    # stable framework release tag, which any same-checkout build satisfies.
    "pyaml-cs-osprey>=2026.6.2",
    # pyAML itself, installed from accelerator-middle-layer-apg: the ALS-APG
    # staging distribution of pyAML, which carries upstream commits only and
    # imports as `pyaml` exactly as accelerator-middle-layer does. The two ship
    # the same `pyaml/` package directory, so this one is never installed beside
    # accelerator-middle-layer. String-equal to the pin in
    # packages/pyaml-cs-osprey/pyproject.toml (a test holds them together).
    "accelerator-middle-layer-apg==0.3.1.post1",
    # pySC, the measurement engine pyAML's tuning tools drive.
    "accelerator-commissioning==1.5.3",
]

[project.optional-dependencies]
# Documentation dependencies (for building docs only)
docs = [
    "sphinx>=9.0.4",
    "pydata-sphinx-theme",
    "myst-parser",
    "sphinx-copybutton",
    "sphinx-autobuild",
    "sphinx-design",
    "sphinx-reredirects==1.1.0",
    "sphinxcontrib-jsmath>=1.0.1",
    "graphviz",
]

# Development and testing
dev = [
    "pytest",
    "setuptools-scm",  # The build backend under hatch-vcs, called directly by the version-parity test
    "pytest-asyncio",
    "pytest-cov",  # Code coverage reporting
    "pytest-order",  # Run flaky/in-debug e2e tests first via @pytest.mark.order
    "pytest-rerunfailures",  # Absorb rare LLM nondeterminism in agentic e2e via @pytest.mark.flaky
    "pytest-timeout",  # Per-test hang-breaker: the model-matrix benchmark runner and the
                       # CI unit lane both pass --timeout (see .github/workflows/ci.yml)
    "pytest-xdist",  # Parallel test lanes in CI (-n 4; unit lane --dist loadgroup, e2e lane --dist loadfile)
    # Pinned to the minor the checked-in baseline beside the gate was measured
    # with. The baseline is a measurement; a checker free to move minors reports
    # errors the diff did not introduce, so the pin is what makes a red gate mean
    # the change under it.
    "mypy>=1.19.1,<1.20",
    # Stub distributions for the typeless third-party imports in src/. Without any
    # one of them mypy stops with "errors prevented further checking" and examines
    # no module at all.
    "types-PyYAML",  # `yaml`
    "types-Markdown",  # `markdown`
    "types-aiofiles",  # `aiofiles`
    "pre-commit",
    # Pinned to the same minor the pre-commit hook uses. Ruff's formatter output
    # changes between minors, so an unpinned floor lets CI and the local hook
    # disagree about what "formatted" means.
    "ruff>=0.16.2,<0.17",
    # Pinned so every venue judges the workflows by the same rules: a linter
    # free to move versions reports findings the diff did not introduce.
    "actionlint-py==1.7.12.25",
    # Pinned for the same reason; actionlint runs it over every workflow `run:` block.
    "shellcheck-py==0.11.0.1",
    "testcontainers[postgres]>=4.15.0",  # Real PostgreSQL for integration tests
    # `lint-imports` holds the boundary between the framework and the
    # connectors package: the contracts are in [tool.importlinter] below.
    "import-linter>=2.15,<3",
    "testcontainers[mongodb]>=4.15.0",  # Real MongoDB for archiver integration tests
    "docker>=7.2.0",  # Docker SDK for testcontainers availability check
    "psycopg[binary,pool]>=3.3.4,<4.0.0",  # ARIEL search integration tests
    "psycopg-pool>=3.3.1,<4.0.0",  # ARIEL search integration tests
    "pillow>=12.3.0",  # Perceptual diffing for the design-system visual regression suite
    # Generates the facility file's pydantic model and vocabulary table. Exact:
    # the committed output is byte-compared against a regeneration, and
    # gen-pydantic's output changes between releases.
    "linkml==1.11.1",
    "PyJWT[crypto]>=2.8",  # Teams relay token validation; its tests import jwt plainly, so a missing install must fail
    # The HTTP client starlette's TestClient is built on. Without it the test
    # client falls back to httpx, which starlette deprecates.
    "httpx2>=2.13.0",
    "pyaml-test-lattice==0.2.0",  # pyAML's test lattices, loaded by the pyAML view tests
]

# ARIEL (Agentic Retrieval Interface for Electronic Logbooks)
# See _ISSUES/MAJOR/ARIEL/ for specification
ariel = [
    # PostgreSQL with pgvector for vector similarity search
    "psycopg[pool]>=3.1.0,<4.0.0",
    "psycopg-pool>=3.3.1,<4.0.0",
]

# ARIEL proxy support for HTTP ingestion through SOCKS tunnels
ariel-proxy = [
    "aiohttp-socks>=0.8.0",
]

# Google Chat bridge (osprey.bridges.google_chat): Pub/Sub event ingestion,
# Chat/Drive API access, and GCS artifact storage.
gchat = [
    "google-cloud-pubsub>=2.18",
    "google-api-python-client>=2.100",
    "google-auth>=2.56.3",
    # Held below 3.13: google-cloud-storage 3.13+ requires google-api-core
    # >=2.27, which google-generativeai caps below. The floor cannot move
    # until that legacy SDK is replaced by google-genai.
    "google-cloud-storage>=2.10",
    # Some deployment hosts only permit egress through a Squid proxy. httplib2
    # (used by google-api-python-client) only honors HTTP(S)_PROXY env vars
    # when PySocks is installed, so this is required, not optional, on those hosts.
    "pysocks>=1.7",
]

# Microsoft Teams bridge (osprey.bridges.teams): Service Bus queue consumption
# and image downscaling. Both are imported lazily by the adapter, so the unit
# lanes run without this extra installed.
teams = [
    "azure-servicebus>=7.11",
    "pillow>=10",
]

# Screen capture on Linux (X11) — not needed on macOS
screen-capture-linux = [
    "mss>=10.2.0",
    "python-xlib>=0.33",
]

# Virtual Accelerator: the serving stack, both transports, plus what the
# archiver recorder needs to run on the SAME image. Everything else the VA needs
# (PyAT, the manifest/lattice layer) is a core dependency;
# `osprey-framework[virtual-accelerator]` keeps resolving for every existing
# reference to it (CI `uv sync --extra`, both VA images).
#
# The `aioca` entry is the recorder's, not the IOC's. The recorder
# (osprey.services.archiver_recorder) ships as a compose-template-only service
# that runs this image with a different command -- deliberately, so it adds no
# image build to any deploy or to the seven VA-stack CI lanes -- which makes its
# dependencies part of what this extra has to deliver. Its other one, pymongo, is
# a core dependency and reaches the image without being named here:
#
#   * aioca is its Channel Access CLIENT. The serving stack below is a CA
#     *server* and ships no client, and while `ophyd-async[ca]` (a core
#     dependency) does pull aioca in today, that is a transitive fact about
#     another package's extra, not a declaration -- and the recorder imports
#     aioca directly. Declared here so it stays installed if ophyd-async ever
#     changes backends.
#
# lume-pva-apg is the serving package `serving/runner.py` subclasses. Its `ca`
# and `pva` extras are what put the two transports on the wire -- pcaspy for
# Channel Access, p4p for PVAccess -- and BOTH are required for any serving at
# all, because the value layer is p4p-typed even on the CA side. p4p arrives
# only through `pva`: the base package does not depend on it. Exact-pinned for
# the same reason as lume-base and lume-pyat above -- a young package whose
# surface is still settling, and the runner subclass is written against the
# 0.1.5 contract specifically (the extension seams it overrides are not yet a
# stable API).
#
# Both VA images install through the `virtual-accelerator` extra rather than
# naming its contents -- `.[virtual-accelerator]` in the full image,
# `osprey-framework[virtual-accelerator]==<version>` and
# `<wheel>[virtual-accelerator]` in the shipped service template. So neither
# Dockerfile declares lume-pva-apg, pcaspy or p4p as an install target or
# constrains its version, and neither can drift from what is declared here.
# (Both do pass `--only-binary pcaspy`. That is a resolver guard -- refuse the
# sdist and its EPICS source build -- not a pin: it selects no version and
# adds no requirement.)
#
# pcaspy is the portable Channel Access server. The serving layer hosts one,
# and tests/va/test_apply_fault.py stands one up in a child process to assert
# the scenario faults from the far side of the wire; without pcaspy installed
# that suite skips, and
# a skipped live suite proves nothing. It arrives through lume-pva-apg's `ca`
# extra, which carries the `>=0.8.1` floor itself, so this extra names it
# nowhere. That floor is hard: 0.8.0's `SimplePV.writeNotify` aborts the server
# on any asynchronous write while `caput -w` still reports success.
#
# The environment marker is load-bearing. It admits the two platforms where a
# Channel Access server loads: linux x86_64, where pcaspy publishes manylinux
# wheels at every interpreter, and linux aarch64, where it publishes none and
# the VA service image builds pcaspy itself from its sdist against EPICS Base
# plus the separate PCAS module (see that Dockerfile's native-wheels stage).
# Everywhere else nothing loads: the macosx_11_0_arm64 wheels are broken as
# shipped (they link @rpath/libc++.1.dylib with no surviving LC_RPATH entry).
# The marker rides on the lume-pva-apg entry alone, because its `ca` extra
# requires pcaspy with no marker of its own: unmarked, this entry would send a
# developer's Mac into a pcaspy source build that needs EPICS Base plus the
# PCAS module, and fail. Verified, not assumed -- resolving
# `lume-pva-apg[ca,pva]==0.1.5` for macOS at 3.13 selects pcaspy 0.8.1, whose
# only artifact at that interpreter and platform is the sdist. Marked, those
# hosts get the honest skip and run the live suites in the container venue
# under scripts/va/live_ca/ instead. A linux aarch64 host installing this extra
# outside that image needs EPICS Base and PCAS for the same source build.
#
# The cost of the marker is that `import lume_pva_apg` is unavailable on a Mac
# too. That costs nothing real: `serving/runner.py` imports `lume_pva_apg.runner`,
# which imports pcaspy, so it is unimportable on those hosts regardless of what
# else is installed, and the suites that reach it already treat all three server
# roots the same way.
virtual-accelerator = [
    "lume-pva-apg[ca,pva]==0.1.5; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
    # Recorder-side (see the note above); deliberately UNMARKED, unlike the
    # serving entry. That marker is not a house style to copy — it exists
    # because pcaspy loads only on linux x86_64 and aarch64. These two load
    # everywhere, so marking them would only make the recorder's dependencies
    # silently absent on a developer's machine.
    "aioca>=1.7",
]

# All optional dependencies for complete installation
all = [
    "osprey-framework[docs,dev,ariel,screen-capture-linux,gchat,teams]"
]

[tool.uv.workspace]
members = ["packages/osprey-connectors", "packages/pyaml-cs-osprey"]

[tool.uv.sources]
osprey-connectors = { workspace = true }
pyaml-cs-osprey = { workspace = true }

[project.urls]
Homepage = "https://als-apg.github.io/osprey"
Documentation = "https://als-apg.github.io/osprey"
Repository = "https://github.com/als-apg/osprey"
Paper = "https://doi.org/10.1063/5.0306302"
Issues = "https://github.com/als-apg/osprey/issues"
Changelog = "https://github.com/als-apg/osprey/blob/main/CHANGELOG.md"

# Define console scripts for CLI entry points
[project.scripts]
# Main CLI entry point. Points at `main`, NOT at the `cli` group it wraps:
# `main` is where the last-resort handlers live, and an entry point naming the
# bare group routes every uncaught exception past them into a traceback on an
# operator's terminal. Pinned by tests/cli/test_main.py::TestConsoleScriptWiring.
osprey = "osprey.cli.main:main"

# Built-in trigger sources for the event dispatcher, discovered by
# osprey.dispatch.source_registry.SourceRegistry at startup.
[project.entry-points."osprey.trigger_sources"]
webhook = "osprey.dispatch.sources.webhook:WebhookSource"
cron = "osprey.dispatch.sources.cron:CronSource"
epics_ca = "osprey.dispatch.sources.epics_ca:EpicsCaSource"

# Simulation engine plug-ins, each entry naming the module that implements the
# plug-in contract; a facility build reaches an engine only through this group.
[project.entry-points."osprey.simulation.engines"]
pyat = "osprey.simulation.engines.pyat"

# Resolver exemptions for packages published more recently than the
# ambient `exclude-newer` window some developer machines set (a rolling
# "nothing newer than N days" policy). Each is an exact pin this project needs
# by name, so a window that hides them makes the lock unresolvable rather than
# merely conservative. Each timestamp must sit after the upload time of the
# version pinned above it: uv filters candidates by upload time BEFORE the
# specifier is applied, so an entry left behind its pin hides the only
# acceptable candidate, and moving a pin means moving its entry too.
#
# These must live HERE, in repo config, and not be left to the command line.
# uv.lock does record what was applied, under `[options.exclude-newer-package]`,
# but that block is an OUTPUT — a record of the resolve that produced the file,
# not an input uv reads back. So a lock recorded with a per-package exemption
# still cannot be REGENERATED without one: a plain `uv lock` or
# `uv lock --upgrade` fails again unless the exemption is declared, which is
# why it belongs in the project's own configuration where every contributor
# and every CI runner picks it up automatically.
#
# Each entry may be dropped once the ambient window has moved past that
# package's upload date; none is load-bearing beyond making the resolve
# reproducible.
[tool.uv]
exclude-newer-package = { lume-pyat = "2026-09-18T00:00:00Z", lume-pva-apg = "2026-09-30T00:00:00Z", accelerator-middle-layer-apg = "2026-10-11T00:00:00Z" }

# Hatchling build configuration
# The version comes from the git tag, not a literal — a release is cut by tagging.
# `post-release` keeps the base version on the *last* tag (2026.6.2.post783+g83fda5e60),
# where the default `guess-next-dev` would invent an unreleased 2026.6.3. CalVer cannot
# predict its own next number, so guessing is worse than not guessing.
[tool.hatch.version]
source = "vcs"
# `git_describe_command` exists because the backend's default tag glob (*[0-9]*)
# matches every tag containing a digit: the workspace sibling's release tag
# osprey-connectors-v0.1.0 (which rebased every dev build to 0.1.0.postN the day
# it was cut) and the checkpoint-* tags (which do not parse as versions at all).
# The runtime probe in src/osprey/version.py has always filtered to v[0-9]*; this
# makes the build stamp read the same tags, and --abbrev=40 hands the backend a
# full node to slice to its fixed width. Pinned to the runtime derivation by
# tests/test_version.py::TestBuildStampParity.
raw-options = { version_scheme = "post-release", git_describe_command = "git describe --dirty --tags --long --abbrev=40 --match v[0-9]*" }

# Stamps the resolved version into the built artifact, which is the only way a wheel
# (and any container built from one) can report its version without git present.
[tool.hatch.build.hooks.vcs]
version-file = "src/osprey/_version.py"

[tool.hatch.build]
# Directories a working tree can hold but a distribution must never carry.
# Hatchling packages the working tree, so each entry here is half a pair: the
# exclude keeps the files out of the sdist/wheel, a matching .gitignore entry
# keeps them out of git. Add one, add the other — tests/cli/test_dockerfile_template.py
# fails if the pair comes apart.
#
# - benchmarks/results: written by running the channel-finder benchmark from
#   inside the packaged template tree.
# - prefetched-models: GGUF model files staged on disk where the model host is
#   unreachable, for the qmd sidecar to load over a read-only mount. Gigabytes
#   each — unexcluded they turn a small wheel into an unusable one.
exclude = ["src/osprey/templates/apps/control_assistant/data/benchmarks/results", "**/prefetched-models"]

[tool.hatch.build.targets.wheel]
# `dock_engine` (the dock layout rules shared with the panel builder) ships inside this
# wheel from packages/dock-engine: it is too small for a distribution of its
# own, and nothing on PyPI could otherwise satisfy a framework import of it.
# The panel builder installs the same directory from git (`#subdirectory=packages/dock-engine`),
# never the framework. The import-linter contract `dock-engine-standalone`
# keeps the module from importing the framework back.
packages = ["src/osprey", "packages/dock-engine/src/dock_engine"]

# The engine's case corpus and manifest live beside its TypeScript, outside the
# import root; `dock_engine._data` reads both as package data.
[tool.hatch.build.targets.wheel.force-include]
"packages/dock-engine/cases" = "dock_engine/cases"
"packages/dock-engine/dist/manifest.json" = "dock_engine/manifest.json"

# Development tool configurations
[tool.mypy]
python_version = "3.11"
# The source roots, searched in this order. `osprey_connectors` also sits in the
# environment as an installed wheel; naming its source here is what makes a run
# over a single file resolve the same packages a whole-tree run resolves, so both
# report the same errors. `explicit_package_bases` is the half that makes the
# roots count: it derives each module's name from them rather than from the
# directory the file happens to live in.
mypy_path = "src:packages/osprey-connectors/src:packages/pyaml-cs-osprey/src:packages/dock-engine/src"
explicit_package_bases = true
files = [
    "src",
    "packages/osprey-connectors/src",
    "packages/pyaml-cs-osprey/src",
    "packages/dock-engine/src",
]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Gradual typing
ignore_missing_imports = true
exclude = [
    "^build/",
    "^dist/",
    "^venv/",
    "_agent_data/",
    "__pycache__/",
    "^src/osprey/facility/schema/_generated/",
]

# Specific modules to ignore due to optional dependencies
[[tool.mypy.overrides]]
module = [
    "openai.*",
    "anthropic.*",
    "google.*",
    "googleapiclient.*",
    "ollama.*",
    "litellm.*",
    "pandas.*",
    "numpy.*",
    "matplotlib.*",
    "p4p.*",
    "podman.*",
    "pymongo.*",
    "doocs4py.*",
    "jlab_archiver_client.*",
    "tango.*",
]
ignore_missing_imports = true

# Bluesky bridge (osprey.services.bluesky_bridge): the bridge's own HTTP core
# (app.py, runs.py, security.py) stays import-clean of these, but the modules
# that run inside the queueserver worker (qserver_startup.py, devices/, plans/)
# import them from the bluesky stack (a core dependency).
[[tool.mypy.overrides]]
module = [
    "bluesky.*",
    "ophyd.*",
    "ophyd_async.*",
    "tiled.*",
]
ignore_missing_imports = true

# Sphinx is never imported by this tree; mypy reaches it by following bokeh's
# own property module, and bokeh ships types, so `ignore_missing_imports` does
# not apply. Sphinx's source uses syntax newer than the `python_version` above,
# and parsing it raises a syntax error that aborts the entire run — skipping it
# is what keeps the check able to report on this repository.
[[tool.mypy.overrides]]
module = ["sphinx.*"]
follow_imports = "skip"

# The facility schema's generated pydantic model is gen-pydantic output, byte
# for byte; its root class's `schema` field overrides `BaseModel.schema`. The
# `exclude` entry above only stops discovery, and importers still reach the
# module, so `silent` keeps its types visible to them and its own errors quiet.
[[tool.mypy.overrides]]
module = ["osprey.facility.schema._generated.*"]
follow_imports = "silent"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -v --tb=short --strict-markers --color=yes"
testpaths = [
    "tests",
    "packages/osprey-connectors/tests",
    "src/applications/*/tests"
]
# The connectors suite's helpers (osprey_connectors_tests) are imported by the
# framework's own connector tests, which may be collected before that suite is.
pythonpath = ["packages/osprey-connectors/tests"]
python_files = [
    "test_*.py",
    "*_test.py"
]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
# A passing test's tmp_path is deleted at its teardown, and a passing session deletes its base
# directory, so a run leaves only what failed. pytest deletes older runs' directories in the shared
# temporary root when the next process exits, and a whole suite's tree left there would cost that
# process minutes of silent exit.
tmp_path_retention_policy = "failed"
markers = [
    "e2e_smoke: Quick smoke tests for critical workflows",
    "channel_finder_benchmark: Channel finder benchmark validation tests. Run on demand, in the benchmark job (`gh workflow run ci.yml -f run_benchmarks=true`), never on a PR: the LLM scoring lane is too expensive to gate on. Tests carrying it live under tests/e2e/, which keeps them out of the unit lane",
    "e2e_tutorial: Tutorial workflow validation tests",
    "model_free: tests/e2e test that reaches no model, so it runs when the session names no provider (OSPREY_E2E_PROVIDER); the set equals the e2e-no-model and agent-record-e2e CI lanes' selection",
    "agentic_benchmark: Model-capability lane of the benchmark matrix — genuine agentic tasks (multi-tool reasoning, judged answers) where the model-under-test can fail",
    "harness_benchmark: Harness-integrity lane of the benchmark matrix — an agent runs but the assertion is model-independent OSPREY behavior (safety hooks, approval flow, plumbing)",
    "slow: Tests that take significant time",
    "browser: Real-browser Playwright tests (requires chromium; skips if absent)",
    "requires_api: Tests that require API credentials",
    "requires_openai: Tests that require OpenAI API key",
    "requires_anthropic: Tests that require Anthropic API key",
    "requires_google: Tests that require Google API key",
    "requires_cborg: Tests that require CBORG API key (local dev only — IP allowlist blocks GitHub Actions runners)",
    "requires_als_apg: Tests that require ALS-APG API key (the ALS-APG gateway; reachable from GitHub Actions runners)",
    "requires_e2e_provider: Tests that build a deployment repo with the provider the run named in OSPREY_E2E_PROVIDER, and so need that provider's credential — the variable holding it comes from PROVIDER_API_KEYS, not from the test",
    "requires_ollama: Tests that require local Ollama service",
    "requires_matlab: Tests that need a MATLAB installation plus the AT toolbox; skip when `matlab` is not on PATH",
    "asyncio: Async test marker",
    "flaky: Rerun on failure to absorb nondeterminism outside the process — LLM sampling in e2e, OS event delivery in a couple of watcher tests (pytest-rerunfailures). Not for flaky unit tests; see tests/README.md",
    "e2e_services: E2E tests requiring local MCP service infrastructure (PostgreSQL, AccelPapers, etc.)",
    "dockerbuild: E2E tests that run a real docker build (skipped when docker is unavailable)",
    "qmd: Tests that need the qmd sidecar image (OSPREY_QMD_IMAGE). They REFUSE to skip when it is absent — a lane that skipped on a missing image would report success having proved nothing — so a lane that does not build or load one must deselect them with `-m 'not qmd'`",
    "real_workspace_watcher: Web-terminal app test that needs a live filesystem observer — opts out of the conftest stub that keeps broadcaster assertions deterministic",
    "real_http_posters: MCP-server test of the HTTP posters themselves — opts out of the conftest stub that keeps notify_* POSTs from reaching a live web terminal",
    "real_graph_index: Build test of the channel search index derivation itself — opts out of the conftest stub that builds each corpus once per session and copies it into every render",
    "real_fetch: opt out of the ARIEL attachment fetch fake",
    "real_server_launch: Test of ServerLauncher's own launch — opts out of the conftest stub that keeps companion servers from starting real uvicorn daemon threads in the unit suite",
    "wallclock: Tests that read a wall clock: a latency budget (absolute or a ratio of two timings) or a readiness window a loaded host can miss. Deselected from every parallel run, whose other workers would distort the clock they read; each is timed in a serial step that selects this marker. tests/deployment/test_ci_workflow_wiring.py LANE_LEAVING_MARKERS names the step and fails when a marked file has none.",
    "real_bounded_run: Test of run_captured's bounded (timeout/watch) runner itself — opts out of the conftest stub that routes bounded runs through the plain subprocess.run spool path the deploy tests fake",
    "pty: Real-terminal tests that run an osprey verb on a pty and read back the bytes an operator would have seen. POSIX-only (they self-skip elsewhere), and deselected from the parallel lane because they assert on repaint cadence and on a spinner advancing between frames, which three other xdist workers loading the box would distort; they get their own serial CI step instead. Carried per-test, not per-directory: tests/pty/test_stub_coverage.py needs no terminal and stays in the parallel lane.",
]

# Import boundaries, checked by `lint-imports` (import-linter) in the lint job.
# The graph covers three distributions: `osprey` is the framework,
# `osprey_connectors` the separately installable connectors package, and
# `dock_engine` the dock layout rules shared with the panel builder. Every
# import statement counts, including ones inside functions and under
# `if TYPE_CHECKING:`; an `importlib.import_module("...")` string does not.
[tool.importlinter]
root_packages = ["osprey", "osprey_connectors", "dock_engine"]

[[tool.importlinter.contracts]]
id = "connectors-standalone"
name = "osprey_connectors never imports the framework"
# The package runs where osprey is absent: connector-host children, executor
# sandboxes, notebook kernels, and consumers of the connectors wheel alone.
type = "forbidden"
source_modules = ["osprey_connectors"]
forbidden_modules = ["osprey"]

[[tool.importlinter.contracts]]
id = "dock-engine-standalone"
name = "dock_engine imports neither the framework nor the connectors"
# The package is shared with the panel builder, which installs it without either, and is
# standard library only.
type = "forbidden"
source_modules = ["dock_engine"]
forbidden_modules = ["osprey", "osprey_connectors"]

[[tool.importlinter.contracts]]
id = "connectors-public-api"
name = "The framework reaches the connector packages only through their namespaces"
# Every module inside the control_system, archiver and ipc subpackages is
# protected, so their implementation modules (the concrete connectors among
# them) are reached through the subpackage itself, and a module added there
# later is private until it is exempted here. The simulation subpackage keeps
# its modules public: its root is imported by readers that must not load
# numpy, so the heavy modules are reached by their own names. The package's
# top-level modules (config, types, posture_store, ...) are each their own
# public API. The one private top-level module, `_version`, is written by the
# build and gitignored; it is not listed, because import-linter refuses a
# listed module that is missing from the graph, as it is on a fresh clone.
type = "protected"
protected_modules = [
    "osprey_connectors.control_system.*",
    "osprey_connectors.archiver.*",
    "osprey_connectors.ipc.*",
]
allowed_importers = ["osprey_connectors"]
ignore_imports = [
    # The door a connector opens around its own write is a public module of
    # its own: the runtime's raw-put guard reads it by this path.
    "osprey.** -> osprey_connectors.control_system.write_door",
]

[[tool.importlinter.contracts]]
id = "connectors-layers"
name = "The connector package's top-level modules, in layers"
# Every top-level module of osprey_connectors, highest first: a module may
# import only from the layers below it. The connector-host child builds
# connectors through the factory, which builds both families; the simulator's
# archiver reads the simulator view the in-process control-system connector
# names, so the archivers sit above the control-system connectors. The posture
# store, the config loader and their kin sit below every connector, and the
# leaves at the bottom import nothing from the package at module scope (the
# `types` exceptions are named in `ignore_imports` below).
#
# The read-only predicate lives in `posture_env`, a leaf, so the posture store
# no longer imports the control-system connectors that consult it.
#
# A layer written with ":" holds two modules that still import each other,
# each in one direction from inside a function: `posture_store` reads the
# record `control_context` parses, and `control_context` takes its root and
# posture grammar from `posture_store`; `workspace` loads config through
# `config`'s singleton, and `config` resolves paths through `workspace`.
type = "layers"
layers = [
    "osprey_connectors.ipc",
    "osprey_connectors.factory",
    "osprey_connectors.archiver",
    "osprey_connectors.control_system",
    "osprey_connectors.simulation",
    "osprey_connectors.settle",
    "osprey_connectors.errors | osprey_connectors.write_target",
    "osprey_connectors.control_context : osprey_connectors.posture_store",
    "osprey_connectors.logger",
    "osprey_connectors.config : osprey_connectors.workspace",
    "osprey_connectors.call_timeout | osprey_connectors.dotenv | osprey_connectors.honesty",
    "osprey_connectors.connection | osprey_connectors.identity | osprey_connectors.log_filter | osprey_connectors.posture_env | osprey_connectors.process | osprey_connectors.refusals | osprey_connectors.relative_time | osprey_connectors.safety_file | osprey_connectors.standin | osprey_connectors.types | osprey_connectors.yaml_loader",
]
ignore_imports = [
    # Edges that point up, each named so that no other can join them. The
    # simulator's archive takes the stored field name from the archivers' own
    # module rather than restating it. That module defines only string
    # functions, but importing it runs the `archiver` package's `__init__`, so
    # this is a real upward edge and the cycle archiver -> control_system ->
    # simulation -> archiver is still there.
    "osprey_connectors.simulation.archive -> osprey_connectors.archiver._field_names",
    # A type-checking import, for an annotation: the exception taxonomy names the
    # write outcome the control-system contract defines.
    "osprey_connectors.errors -> osprey_connectors.control_system._base",
    # Two function-local imports from the type vocabulary up into the posture
    # readers that import it at module scope: the published machine kind is
    # read from the controls server's report beside the control-context record.
    "osprey_connectors.types -> osprey_connectors.control_context",
    "osprey_connectors.types -> osprey_connectors.posture_store",
]

# Ruff configuration for modern Python linting
[tool.ruff]
line-length = 100
target-version = "py311"
src = [
    "src",
    "interfaces",
    "deployment",
    "packages/osprey-connectors/src",
    "packages/osprey-connectors/tests",
    "packages/pyaml-cs-osprey/src",
    "packages/dock-engine/src",
]
# Executable Python scripts without a .py suffix. Ruff selects files by suffix and
# cannot see them; the pre-commit hook selects by shebang and lints them.
extend-include = ["tests/pty/stub_runtime/docker"]
# Written by the hatch-vcs build hook, not by hand — formatting it is not ours to
# enforce, and it is present in any built or editable-installed tree.
extend-exclude = [
    "*/src/osprey/_version.py",
    "*/src/osprey_connectors/_version.py",
    "*/src/pyaml_cs_osprey/_version.py",
    "*/src/dock_engine/_version.py",
    # Generated from the facility schema by gen-pydantic; compared byte for byte
    # with a regeneration, so it is never reformatted.
    "src/osprey/facility/schema/_generated/",
]

[tool.ruff.format]
# Ruff >=0.16 also formats Python code blocks embedded in Markdown. The snippets
# in the shipped agent rules and skill references are documentation, not code we
# run: they are hand-aligned for readability and are sometimes deliberately
# partial. Reformatting them serves no one, so the formatter stays out of prose.
exclude = ["**/*.md"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "SIM",  # flake8-simplify
    "PERF",  # perflint
    "RET",  # flake8-return
    "PIE",  # flake8-pie
    "FURB",  # refurb: a hand-written idiom the standard library already provides
    "ARG001",  # unused function argument
    "ARG002",  # unused method argument
    "RUF100",  # unused noqa: a suppression names an enabled rule that fires on its line
    "TID251",  # banned-api: the agent SDK is imported only inside the harness adapter
    "T20",  # print and pprint: shipped code reports through its own output channel
    "T100",  # debugger calls
    "ERA001",  # commented-out code
    "S105",  # a quoted credential assigned to a name
    "S106",  # a quoted credential passed as an argument
    "S107",  # a quoted credential as a parameter default
    "TD003",  # a work marker carries a link to its issue
]
# Rules this config does not select but code may name in a `noqa`: PLC2701
# (import-private-name) runs in a preview-only invocation of its own, so RUF100
# must not report a suppression of it as unused.
external = ["PLC2701"]
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.flake8-unused-arguments]
# A variadic collects what a caller sends and names nothing in particular, so
# its name is never a claim that something is read.
ignore-variadic-names = true

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# The harness adapter, src/osprey/agent_runner/, is the one package that imports
# the agent SDK. Every other module reaches the agent through it.
"claude_agent_sdk".msg = "reach the agent through osprey.agent_runner, the one package that imports the SDK"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
# Allow assert False, useless attribute access, assert blind exception. Test
# fixtures carry fake credentials by design; gitleaks scans every path for real ones.
"tests/*" = ["B011", "B017", "B018", "S105", "S106", "S107"]
"packages/*/tests/**" = ["S105", "S106", "S107", "T20"]  # T20: tests print, as below
# The simplification families are adopted in the shipped trees first; the test
# trees are brought under them separately. Each code that fires there is named,
# so the rest of each family, SIM105 among it, holds in tests as it did before.
"{tests,packages/*/tests}/**" = [
    "FURB110", "FURB116", "FURB167", "FURB171", "FURB188", "FURB192",
    "PERF102", "PERF401", "PERF402", "PERF403",
    "PIE790", "PIE800", "PIE804", "PIE807", "PIE808", "PIE810",
    "RET501", "RET503", "RET504", "RET505", "RET506",
    "SIM102", "SIM103", "SIM108", "SIM112", "SIM114", "SIM115", "SIM116", "SIM117",
    "SIM300", "SIM905",
]
"tests/e2e/conftest.py" = ["F811"]  # Allow pytest hook redefinition
"tests/documentation/test_workflow_autodoc.py" = ["E402"]  # Late imports after path manipulation
"tests/services/channel_finder/test_registration.py" = ["E402"]  # Late imports after path manipulation
"src/osprey/services/channel_finder/__init__.py" = ["E402"]  # Grouped imports with section comments
# The agent SDK ban covers the shipped trees, src/ and packages/. Inside them the
# harness adapter is where the SDK is imported; outside them, tests and developer
# scripts drive the SDK directly. Print calls are judged in the same shipped trees:
# tests, scripts and docs print to the developer running them.
"!{src,packages}/**" = ["TID251", "T20"]
"src/osprey/agent_runner/**" = ["TID251"]
# import-private-name holds the framework to the connectors package's public
# names (lint-imports holds it at the level of modules). Tests, scripts and the
# package itself reach implementation on purpose. The rule is preview-only in
# the pinned ruff, so CI selects it in a run of its own
# (`ruff check --preview --select=PLC2701 .`) rather than turning preview on
# here, and this entry is what scopes that run to the framework.
"!src/osprey/**" = ["PLC2701"]

[tool.ruff.lint.isort]
known-first-party = ["osprey", "configs", "applications", "interfaces", "deployment"]

# Coverage configuration (if using pytest-cov)
[tool.coverage.run]
source = [
    "src",
    "interfaces",
    "deployment",
    "packages/osprey-connectors/src",
    "packages/pyaml-cs-osprey/src",
    "packages/dock-engine/src",
]
# Hooks ship as standalone scripts and are exercised by spawning them, so most of
# their code runs in child processes. The subprocess patcher makes those children
# measure themselves. It force-enables parallel data files; the explicit entry
# below documents that rather than leaving it implicit.
patch = ["subprocess"]
parallel = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.*",
    "build/*",
    "dist/*",
    "venv/*",
    "_agent_data/*",
    # Written by the hatch-vcs build hook (gitignored); not source anyone maintains.
    "*/src/osprey/_version.py",
    "*/src/osprey_connectors/_version.py",
    "*/src/dock_engine/_version.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "if TYPE_CHECKING:",
]
# Typing overload stubs never run; excluding the decorator excludes the stub.
exclude_also = [
    "@(typing\\.)?overload",
]
