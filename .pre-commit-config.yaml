# Pre-commit hooks for Osprey Framework
# See https://pre-commit.com for more information
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Ruff - Fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # Run the formatter
      - id: ruff-format
      # import-private-name for the framework, preview-only in ruff, so it runs
      # in an invocation of its own; pyproject.toml scopes it to src/osprey.
      - id: ruff
        name: ruff (import-private-name)
        args: [--preview, --select=PLC2701]

  # Prettier - JavaScript formatter, scoped to .js and .mjs. The version is the
  # package.json pin; tests/scripts/test_check.py fails while the two disagree.
  # Prettier honours .prettierignore for the paths pre-commit passes it.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: node
        additional_dependencies: ["prettier@3.9.9"]
        entry: prettier --write --ignore-unknown
        files: \.(js|mjs)$

  # General file quality checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Remove trailing whitespace
      - id: trailing-whitespace
        # Vendored minified JS bundles (plotly) and generated channel-database
        # tier artifacts are produced by external tooling — formatting them
        # creates spurious diffs on the next re-vendor / regeneration.
        # Golden render fixtures are byte-exact copies of renderer output;
        # normalizing whitespace here breaks the byte-for-byte render tests.
        # The BuildKit captures are byte-exact for the same reason: a vertex
        # line whose payload is empty ends in the space that separated them,
        # and trimming it rewrites the thing the fixture exists to preserve.
        # The demo element table is tab-separated with a fixed column count,
        # so a row whose last cells are empty ends in tabs.
        # The dock engine's built dist/ and its C-CASES fixtures are checked
        # byte for byte (dist/ by its manifest hashes and `build.mjs --check`,
        # each case by checkCase in cases.test.ts); a byte rewritten here is a
        # file those gates refuse. A formatter added later must skip them too.
        exclude: |
          (?x)^(
            .*\.min\.(js|css)|
            packages/dock-engine/dist/.*|
            packages/dock-engine/cases/.*|
            scripts/facility_demo/injector_elements\.tsv|
            tests/deployment/web_terminals/golden/.*|
            tests/deployment/fixtures/.*\.log|
            tests/templates/render_defaults/.*|
            tests/templates/render_axis_shapes/.*
          )$
      # Ensure files end with a newline
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
            .*\.min\.(js|css)|
            packages/dock-engine/dist/.*|
            packages/dock-engine/cases/.*|
            tests/deployment/web_terminals/golden/.*|
            tests/deployment/fixtures/.*\.log|
            tests/templates/render_defaults/.*|
            tests/templates/render_axis_shapes/.*
          )$
      # Check for merge conflict markers. reStructuredText is exempt: the hook
      # treats a line of exactly seven '=' as a conflict marker, which is also
      # how RST underlines a seven-character heading ("Secrets", "Roadmap"), so
      # every merge touching those pages fails on prose that is perfectly fine.
      - id: check-merge-conflict
        exclude: \.rst$
      # Check YAML syntax. The previous-release profile fixture carries `@…@`
      # sentinels its test expands before reading it, so it is YAML only once
      # expanded; the test that loads it is what checks it.
      - id: check-yaml
        exclude: ^tests/fixtures/previous_release_repo/profile\.yml$
      # Check TOML syntax
      - id: check-toml
      # Prevent large files from being committed. The floor is set by the
      # generated demo-machine graph corpus (~2.7 MB, shipped in the
      # control_assistant preset);
      # raise the number rather than excluding a path, so the guard stays armed.
      - id: check-added-large-files
        args: ['--maxkb=3000']
      # Check for files that would conflict on case-insensitive filesystems
      - id: check-case-conflict
      # Detect private keys
      - id: detect-private-key
      # Check JSON syntax
      - id: check-json
        # This hold record is invalid JSON on purpose: the tests read a corrupt record.
        exclude: ^packages/osprey-connectors/tests/osprey_connectors_tests/fixtures/session_hold/corrupt/
      # Check for debugger imports
      - id: debug-statements

  # Detect hardcoded secrets (passwords, API keys, tokens, etc.)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # Import boundaries between the framework and the connectors package; the
  # contracts are in [tool.importlinter] in pyproject.toml.
  - repo: local
    hooks:
      - id: lint-imports
        name: lint-imports (import boundaries)
        entry: uv run lint-imports --no-logo
        language: system
        pass_filenames: false
        types: [python]

# pre-commit.ci configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: monthly
  submodules: false
  # lint-imports runs on the project's own environment, which pre-commit.ci
  # does not build; CI's lint job runs it instead.
  skip: [lint-imports]
