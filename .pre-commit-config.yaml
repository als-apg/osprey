# Pre-commit hooks for Osprey Framework
# See https://pre-commit.com for more information
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Ruff - Fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # Run the formatter
      - id: ruff-format

  # General file quality checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Remove trailing whitespace
      - id: trailing-whitespace
        # Vendored minified JS bundles (plotly) and generated channel-database
        # tier artifacts are produced by external tooling — formatting them
        # creates spurious diffs on the next re-vendor / regeneration.
        # Golden render fixtures are byte-exact copies of renderer output;
        # normalizing whitespace here breaks the byte-for-byte render tests.
        # The BuildKit captures are byte-exact for the same reason: a vertex
        # line whose payload is empty ends in the space that separated them,
        # and trimming it rewrites the thing the fixture exists to preserve.
        exclude: |
          (?x)^(
            .*\.min\.(js|css)|
            src/osprey/templates/apps/control_assistant/data/channel_databases/tiers/.*\.json|
            tests/deployment/web_terminals/golden/.*|
            tests/deployment/fixtures/.*\.log|
            tests/templates/render_defaults/.*|
            tests/templates/render_axis_shapes/.*
          )$
      # Ensure files end with a newline
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
            .*\.min\.(js|css)|
            src/osprey/templates/apps/control_assistant/data/channel_databases/tiers/.*\.json|
            tests/deployment/web_terminals/golden/.*|
            tests/deployment/fixtures/.*\.log|
            tests/templates/render_defaults/.*|
            tests/templates/render_axis_shapes/.*
          )$
      # Check for merge conflict markers. reStructuredText is exempt: the hook
      # treats a line of exactly seven '=' as a conflict marker, which is also
      # how RST underlines a seven-character heading ("Secrets", "Roadmap"), so
      # every merge touching those pages fails on prose that is perfectly fine.
      - id: check-merge-conflict
        exclude: \.rst$
      # Check YAML syntax
      - id: check-yaml
      # Check TOML syntax
      - id: check-toml
      # Prevent large files from being committed. The floor is set by the
      # generated demo-machine graph corpus
      # (templates/apps/control_assistant/data/demo_machine.ttl, ~1.5 MB);
      # raise the number rather than excluding a path, so the guard stays armed.
      - id: check-added-large-files
        args: ['--maxkb=2000']
      # Check for files that would conflict on case-insensitive filesystems
      - id: check-case-conflict
      # Detect private keys
      - id: detect-private-key
      # Check JSON syntax
      - id: check-json
      # Check for debugger imports
      - id: debug-statements

  # Detect hardcoded secrets (passwords, API keys, tokens, etc.)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

# pre-commit.ci configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: monthly
  submodules: false
